services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do sleep 2; done &&
        mc mb -p local/repair-media >/dev/null 2>&1 || true &&
        exit 0
    restart: "no"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  photo-worker-go:
    build:
      context: ./photo-worker-go
    depends_on:
      - minio
      - minio-init
      - rabbitmq
    environment:
      PHOTO_MINIO_ENDPOINT: minio:9000
      PHOTO_MINIO_ACCESS_KEY: minioadmin
      PHOTO_MINIO_SECRET_KEY: minioadmin
      PHOTO_MINIO_BUCKET: repair-media
      PHOTO_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PHOTO_PROCESS_QUEUE: repair.media.process
      PHOTO_RESULT_QUEUE: repair.media.processed
      PHOTO_PREVIEW_LONG_EDGE: 1280
      PHOTO_THUMB_LONG_EDGE: 320
      PHOTO_TINY_LONG_EDGE: 96

volumes:
  minio-data:
