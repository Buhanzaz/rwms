main.datasource.url=jdbc:hsqldb:file:.jmix/hsqldb/wmspanel
main.datasource.username=sa
main.datasource.password=

main.liquibase.change-log=dev/buhanzaz/wmspanel/liquibase/changelog.xml

jmix.ui.login-view-id=LoginView
jmix.ui.main-view-id=MainView
jmix.ui.menu-config=dev/buhanzaz/wmspanel/menu.xml
jmix.ui.composite-menu=true

ui.login.defaultUsername=admin
ui.login.defaultPassword=admin

jmix.core.available-locales=ru,en

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false

# Enable colors in logs
spring.output.ansi.enabled=always

# 'debug' level logs SQL generated by EclipseLink ORM
logging.level.eclipselink.logging.sql=info

# 'debug' level logs data store operations
logging.level.io.jmix.core.datastore=info

# 'debug' level logs access control constraints
logging.level.io.jmix.core.AccessLogger=debug

# 'debug' level logs all Jmix debug output
logging.level.io.jmix=info

# 'debug' or 'trace' levels help to troubleshoot security problems
logging.level.org.springframework.security=info

logging.level.org.atmosphere=warn

# Mobile estimates can upload phone photos directly as multipart files.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# Smart reservation AI uses Mistral via Spring AI OpenAI-compatible config.
# Set MISTRAL_API_KEY in the environment or spring.ai.openai.chat.api-key locally.
spring.ai.openai.chat.base-url=https://api.mistral.ai/v1
spring.ai.openai.chat.options.model=mistral-small-latest
spring.ai.openai.chat.api-key=${MISTRAL_API_KEY:}

# Repair estimate media uses MinIO when available and keeps a local fallback copy in .media/rental-item-events.
repair.media.local-root=.media/rental-item-events
repair.media.object-prefix=repair-estimates
repair.media.minio-enabled=true
repair.media.minio-endpoint=http://localhost:9000
repair.media.minio-access-key=minioadmin
repair.media.minio-secret-key=minioadmin
repair.media.minio-bucket=repair-media
repair.media.minio-auto-create-bucket=true
repair.media.incoming-object-name=incoming-upload.bin
repair.media.queue-enabled=true
repair.media.processing-queue=repair.media.process
repair.media.processing-result-queue=repair.media.processed
repair.media.preview-long-edge=1280
repair.media.thumb-long-edge=320
repair.media.tiny-long-edge=96

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
