server:
  port: ${ASSET_SERVICE_PORT:8086}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: asset-service
  tracing:
    sampling:
      probability: ${ASSET_TRACING_SAMPLING_PROBABILITY:0.1}

logging:
  structured:
    format:
      console: ecs

spring:
  application:
    name: asset-service
  datasource:
    url: ${ASSET_DB_URL}
    username: ${ASSET_DB_USERNAME}
    password: ${ASSET_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  cloud:
    function:
      definition: assetInbound
    stream:
      bindings:
        assetInbound-in-0:
          destination: rwms.asset.rental-item.v1,rwms.asset.equipment-catalog.v1,rwms.asset.equipment-balance.v1,rwms.asset.equipment-movement.v1,rwms.asset.equipment-allocation-hold.v1,rwms.asset.operation-lease.v1,rwms.asset.classifier.v1
          group: asset-service-inbox-v1
          consumer:
            max-attempts: 1
            multiplex: true
      kafka:
        default:
          producer:
            sync: true
        binder:
          brokers: ${ASSET_KAFKA_BROKERS:}
          auto-create-topics: false
          configuration:
            acks: all
            enable.idempotence: true
            compression.type: zstd
            request.timeout.ms: 5000
            delivery.timeout.ms: 15000
            max.block.ms: 5000
            metadata.recovery.rebootstrap.trigger.ms: 1000
        bindings:
          assetInbound-in-0:
            consumer: { enable-dlq: false, common-error-handler-bean-name: assetFailClosedConsumerErrorHandler }
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER}
          audiences: ${AUTH_AUDIENCE:rwms-services}

rwms:
  platform:
    kafka:
      enabled: ${ASSET_KAFKA_ENABLED:false}
      destinations:
        - rwms.asset.rental-item.v1
        - rwms.asset.equipment-catalog.v1
        - rwms.asset.equipment-balance.v1
        - rwms.asset.equipment-movement.v1
        - rwms.asset.equipment-allocation-hold.v1
        - rwms.asset.operation-lease.v1
        - rwms.asset.classifier.v1
        - rwms.asset.dlt.v1
  asset:
    idempotency:
      retention: ${ASSET_IDEMPOTENCY_RETENTION:7d}
      cleanup-delay: ${ASSET_IDEMPOTENCY_CLEANUP_DELAY:1h}
      cleanup-batch-size: ${ASSET_IDEMPOTENCY_CLEANUP_BATCH_SIZE:250}
    operation-lease:
      ttl: ${ASSET_OPERATION_LEASE_TTL:15m}
    equipment-hold:
      ttl: ${ASSET_EQUIPMENT_HOLD_TTL:15m}
    eventing:
      outbox:
        relay-delay: ${ASSET_KAFKA_OUTBOX_RELAY_DELAY:1s}
        lease-duration: ${ASSET_KAFKA_OUTBOX_LEASE_DURATION:30s}
        instance-id: ${ASSET_KAFKA_INSTANCE_ID:asset-service}
    warehouse-registry:
      enabled: ${ASSET_WAREHOUSE_REGISTRY_ENABLED:false}
      base-url: ${WAREHOUSE_SERVICE_INTERNAL_BASE_URL:}
      token-uri: ${ASSET_WAREHOUSE_TOKEN_URI:}
      client-id: asset-service
      client-secret: ${ASSET_WAREHOUSE_CLIENT_SECRET:}
      connect-timeout: ${ASSET_WAREHOUSE_CONNECT_TIMEOUT:2s}
      read-timeout: ${ASSET_WAREHOUSE_READ_TIMEOUT:3s}
  cors:
    allowed-origins: ${PANEL_ORIGIN}
  security:
    dev-auth-bypass: ${ASSET_DEV_AUTH_BYPASS:false}
