server:
  port: ${API_GATEWAY_PORT:8088}
  forward-headers-strategy: none

spring:
  application:
    name: api-gateway-service
  http:
    clients:
      connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:2s}
      read-timeout: ${GATEWAY_READ_TIMEOUT:10s}
  cloud:
    gateway:
      server:
        webmvc:
          forwarded-request-headers-filter:
            enabled: false

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: api-gateway-service
  tracing:
    sampling:
      probability: ${API_GATEWAY_TRACING_SAMPLING_PROBABILITY:0.1}

logging:
  structured:
    format:
      console: ecs

rwms:
  gateway:
    public-base-uri: ${GATEWAY_PUBLIC_BASE_URI}
    trusted-proxy-addresses: ${GATEWAY_TRUSTED_PROXY_ADDRESSES:127.0.0.1,::1}
    routes:
      auth-uri: ${AUTH_SERVICE_URL}
      task-board-uri: ${TASK_BOARD_SERVICE_URL}
      warehouse-uri: ${WAREHOUSE_SERVICE_URL}
      asset-uri: ${ASSET_SERVICE_URL}
      maintenance-uri: ${MAINTENANCE_SERVICE_URL}
      media-uri: ${MEDIA_SERVICE_URL}
      inventory-uri: ${INVENTORY_SERVICE_URL}
      logistics-uri: ${LOGISTICS_SERVICE_URL}
      logistics-planner-uri: ${LOGISTICS_PLANNER_URL}
      dossier-uri: ${DOSSIER_SERVICE_URL}
      analytics-uri: ${ANALYTICS_SERVICE_URL}
      assistant-uri: ${ASSISTANT_SERVICE_URL}
      cad-uri: ${CAD_SERVICE_URL:}
    security:
      issuer: ${AUTH_ISSUER}
      audience: ${AUTH_AUDIENCE:rwms-services}
    cors:
      allowed-origins: ${PANEL_ORIGIN}
