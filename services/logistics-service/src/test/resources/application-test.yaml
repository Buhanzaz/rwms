spring:
  flyway:
    enabled: true
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never

rwms:
  platform:
    kafka:
      enabled: false
  logistics:
    return-registration:
      relay-enabled: false
    return-completion:
      relay-enabled: false
    shipment:
      relay-enabled: false
    transfer:
      relay-enabled: false
    security:
      dev-auth-bypass: false
