server:
  port: ${LOGISTICS_SERVICE_PORT:8090}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: logistics-service
  tracing:
    sampling:
      probability: ${LOGISTICS_TRACING_SAMPLING_PROBABILITY:0.1}

logging:
  structured:
    format:
      console: ecs

spring:
  application:
    name: logistics-service
  datasource:
    url: ${LOGISTICS_DB_URL}
    username: ${LOGISTICS_DB_USERNAME}
    password: ${LOGISTICS_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  cloud:
    function:
      definition: logisticsInbound
    stream:
      bindings:
        logisticsInbound-in-0:
          destination: rwms.asset.rental-item.v1,rwms.asset.operation-lease.v1,rwms.asset.equipment-allocation-hold.v1,rwms.task-board.board-task.v1,rwms.maintenance.estimate.v1,rwms.media.media.v1
          group: logistics-service-inbox-v1
          consumer:
            max-attempts: 1
            multiplex: true
      kafka:
        bindings:
          logisticsInbound-in-0:
            consumer:
              enable-dlq: false
              start-offset: earliest
              common-error-handler-bean-name: logisticsFailClosedConsumerErrorHandler
        binder:
          brokers: ${LOGISTICS_KAFKA_BROKERS:}
          auto-create-topics: false
          configuration:
            acks: all
            enable.idempotence: true
            compression.type: zstd
            request.timeout.ms: 5000
            delivery.timeout.ms: 15000
            max.block.ms: 5000
            metadata.recovery.rebootstrap.trigger.ms: 1000
      default:
        producer:
          sync: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER}
          audiences: ${AUTH_AUDIENCE:rwms-services}

rwms:
  platform:
    kafka:
      enabled: ${LOGISTICS_KAFKA_ENABLED:false}
      destinations:
        - rwms.logistics.return.v1
        - rwms.logistics.shipment.v1
        - rwms.logistics.transfer.v1
  logistics:
    idempotency:
      retention: ${LOGISTICS_IDEMPOTENCY_RETENTION:7d}
    dependencies:
      enabled: ${LOGISTICS_DEPENDENCIES_ENABLED:false}
      token-uri: ${AUTH_TOKEN_URI:}
      client-id: ${LOGISTICS_CLIENT_ID:logistics-service}
      client-secret: ${LOGISTICS_CLIENT_SECRET:}
      asset-base-url: ${ASSET_SERVICE_URL:}
      warehouse-base-url: ${WAREHOUSE_SERVICE_URL:}
      task-board-base-url: ${TASK_BOARD_SERVICE_URL:}
      maintenance-base-url: ${MAINTENANCE_SERVICE_URL:}
      media-base-url: ${MEDIA_SERVICE_URL:}
      connect-timeout: ${LOGISTICS_DEPENDENCY_CONNECT_TIMEOUT:2s}
      read-timeout: ${LOGISTICS_DEPENDENCY_READ_TIMEOUT:5s}
    return-registration:
      relay-enabled: ${LOGISTICS_RETURN_REGISTRATION_RELAY_ENABLED:true}
      relay-delay: ${LOGISTICS_RETURN_REGISTRATION_RELAY_DELAY:1s}
      relay-initial-delay: ${LOGISTICS_RETURN_REGISTRATION_RELAY_INITIAL_DELAY:1s}
    return-completion:
      relay-enabled: ${LOGISTICS_RETURN_COMPLETION_RELAY_ENABLED:true}
      relay-delay: ${LOGISTICS_RETURN_COMPLETION_RELAY_DELAY:1s}
      relay-initial-delay: ${LOGISTICS_RETURN_COMPLETION_RELAY_INITIAL_DELAY:1s}
    shipment:
      relay-enabled: ${LOGISTICS_SHIPMENT_RELAY_ENABLED:true}
      relay-delay: ${LOGISTICS_SHIPMENT_RELAY_DELAY:1s}
      relay-initial-delay: ${LOGISTICS_SHIPMENT_RELAY_INITIAL_DELAY:1s}
    transfer:
      relay-enabled: ${LOGISTICS_TRANSFER_RELAY_ENABLED:true}
      relay-delay: ${LOGISTICS_TRANSFER_RELAY_DELAY:1s}
      relay-initial-delay: ${LOGISTICS_TRANSFER_RELAY_INITIAL_DELAY:1s}
    owner-proof:
      relay-enabled: ${LOGISTICS_OWNER_PROOF_RELAY_ENABLED:true}
      relay-delay: ${LOGISTICS_OWNER_PROOF_RELAY_DELAY:1s}
      relay-initial-delay: ${LOGISTICS_OWNER_PROOF_RELAY_INITIAL_DELAY:1s}
    equipment-movement:
      relay-enabled: ${LOGISTICS_EQUIPMENT_MOVEMENT_RELAY_ENABLED:true}
      relay-delay: ${LOGISTICS_EQUIPMENT_MOVEMENT_RELAY_DELAY:1s}
      relay-initial-delay: ${LOGISTICS_EQUIPMENT_MOVEMENT_RELAY_INITIAL_DELAY:1s}
    driver-queue:
      relay-enabled: ${LOGISTICS_DRIVER_QUEUE_RELAY_ENABLED:true}
      relay-delay: ${LOGISTICS_DRIVER_QUEUE_RELAY_DELAY:1s}
      relay-initial-delay: ${LOGISTICS_DRIVER_QUEUE_RELAY_INITIAL_DELAY:1s}
    eventing:
      outbox:
        relay-delay: ${LOGISTICS_KAFKA_OUTBOX_RELAY_DELAY:1s}
        lease-duration: ${LOGISTICS_KAFKA_OUTBOX_LEASE_DURATION:30s}
        instance-id: ${LOGISTICS_KAFKA_INSTANCE_ID:logistics-service}
    security:
      dev-auth-bypass: false
    client-presentation:
      token-secret: ${CLIENT_PRESENTATION_TOKEN_SECRET:rwms-local-client-presentation-secret-change-me}
    rental-inquiry:
      outbox-enabled: ${LOGISTICS_RENTAL_INQUIRY_OUTBOX_ENABLED:true}
      outbox-delay: ${LOGISTICS_RENTAL_INQUIRY_OUTBOX_DELAY:1s}
      outbox-initial-delay: ${LOGISTICS_RENTAL_INQUIRY_OUTBOX_INITIAL_DELAY:1s}
      booking-retry-delay: ${LOGISTICS_RENTAL_BOOKING_RETRY_DELAY:2s}
      booking-retry-initial-delay: ${LOGISTICS_RENTAL_BOOKING_RETRY_INITIAL_DELAY:2s}
  cors:
    allowed-origins: ${PANEL_ORIGIN}
