server:
  port: ${AUTH_SERVICE_PORT:9000}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: ${AUTH_SESSION_TIMEOUT:8h}
      cookie:
        http-only: true
        secure: ${AUTH_SESSION_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: auth-service
  tracing:
    sampling:
      probability: ${AUTH_TRACING_SAMPLING_PROBABILITY:0.1}

logging:
  structured:
    format:
      console: ecs

spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:}
    username: ${AUTH_DB_USERNAME:}
    password: ${AUTH_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  cloud:
    function:
      definition: authUserAuthorizationEvents;authWorkerAccessEvents
    stream:
      bindings:
        authUserAuthorizationEvents-in-0:
          destination: rwms.auth.user-authorization.v1
          group: auth-shadow-v1
          consumer:
            max-attempts: 1
        authWorkerAccessEvents-in-0:
          destination: rwms.auth.worker-access.v1
          group: auth-shadow-v1
          consumer:
            max-attempts: 1
      kafka:
        binder:
          brokers: ${AUTH_KAFKA_BROKERS:}
          auto-create-topics: false
          configuration:
            acks: all
            enable.idempotence: true
            compression.type: zstd
            request.timeout.ms: 5000
            delivery.timeout.ms: 15000
            max.block.ms: 5000
            metadata.recovery.rebootstrap.trigger.ms: 1000
        bindings:
          authUserAuthorizationEvents-in-0:
            consumer:
              enable-dlq: false
              common-error-handler-bean-name: authFailClosedConsumerErrorHandler
          authWorkerAccessEvents-in-0:
            consumer:
              enable-dlq: false
              common-error-handler-bean-name: authFailClosedConsumerErrorHandler
        default:
          producer:
            sync: true

rwms:
  platform:
    kafka:
      enabled: ${AUTH_KAFKA_ENABLED:false}
      destinations:
        - rwms.auth.user-authorization.v1
        - rwms.auth.worker-access.v1
  auth:
    issuer: ${AUTH_ISSUER:http://localhost:8088/auth}
    panel-origin: ${PANEL_ORIGIN:http://localhost:8080}
    panel-redirect-uri: ${PANEL_REDIRECT_URI:http://localhost:8080/auth/callback}
    panel-post-logout-redirect-uri: ${PANEL_POST_LOGOUT_REDIRECT_URI:http://localhost:8080/}
    worker-origin: ${WORKER_ORIGIN:http://localhost:8082}
    worker-redirect-uri: ${WORKER_REDIRECT_URI:http://localhost:8082/auth/worker/callback}
    worker-post-logout-redirect-uri: ${WORKER_POST_LOGOUT_REDIRECT_URI:http://localhost:8082/}
    driver-origin: ${DRIVER_ORIGIN:http://localhost:8082}
    driver-redirect-uri: ${DRIVER_REDIRECT_URI:http://localhost:8082/auth/driver/callback}
    driver-post-logout-redirect-uri: ${DRIVER_POST_LOGOUT_REDIRECT_URI:http://localhost:8082/}
    dev-default-credentials: ${AUTH_DEV_DEFAULT_CREDENTIALS:false}
    bootstrap-admin-username: ${AUTH_BOOTSTRAP_ADMIN_USERNAME:}
    bootstrap-admin-password: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
    signing-key-store: ${AUTH_SIGNING_KEY_STORE:}
    signing-key-store-password: ${AUTH_SIGNING_KEY_STORE_PASSWORD:}
    signing-key-alias: ${AUTH_SIGNING_KEY_ALIAS:rwms-auth}
    customer-registration-throttle:
      per-client-limit: ${AUTH_CUSTOMER_REGISTRATION_PER_CLIENT_LIMIT:10}
      per-client-window: ${AUTH_CUSTOMER_REGISTRATION_PER_CLIENT_WINDOW:PT10M}
      global-limit: ${AUTH_CUSTOMER_REGISTRATION_GLOBAL_LIMIT:250}
      global-window: ${AUTH_CUSTOMER_REGISTRATION_GLOBAL_WINDOW:PT1M}
      retention: ${AUTH_CUSTOMER_REGISTRATION_THROTTLE_RETENTION:P1D}
      cleanup-delay: ${AUTH_CUSTOMER_REGISTRATION_THROTTLE_CLEANUP_DELAY:PT1H}
    login-attempt-throttle:
      source-ingress:
        limit: ${AUTH_LOGIN_SOURCE_INGRESS_LIMIT:30}
        window: ${AUTH_LOGIN_SOURCE_INGRESS_WINDOW:PT1M}
      source-auth:
        limit: ${AUTH_LOGIN_SOURCE_AUTH_LIMIT:20}
        window: ${AUTH_LOGIN_SOURCE_AUTH_WINDOW:PT10M}
      account-auth:
        limit: ${AUTH_LOGIN_ACCOUNT_AUTH_LIMIT:10}
        window: ${AUTH_LOGIN_ACCOUNT_AUTH_WINDOW:PT15M}
      retention: ${AUTH_LOGIN_THROTTLE_RETENTION:P1D}
      cleanup-delay: ${AUTH_LOGIN_THROTTLE_CLEANUP_DELAY:PT1H}
      database-timeout: ${AUTH_LOGIN_THROTTLE_DATABASE_TIMEOUT:PT3S}
    warehouse-validation:
      enabled: ${AUTH_WAREHOUSE_VALIDATION_ENABLED:false}
      base-url: ${WAREHOUSE_SERVICE_INTERNAL_BASE_URL:}
      token-uri: ${AUTH_WAREHOUSE_TOKEN_URI:}
      client-id: auth-service
      client-secret: ${AUTH_WAREHOUSE_CLIENT_SECRET:}
      connect-timeout: ${AUTH_WAREHOUSE_CONNECT_TIMEOUT:2s}
      read-timeout: ${AUTH_WAREHOUSE_READ_TIMEOUT:3s}
    oauth:
      clients:
        - client-id: rwms-panel
          client-name: RWMS Panel
          enabled: true
          revision: 7
          authentication-methods: [none]
          grant-types: [authorization_code, refresh_token]
          redirect-uris: ["${PANEL_REDIRECT_URI:http://localhost:8080/auth/callback}"]
          post-logout-redirect-uris: ["${PANEL_POST_LOGOUT_REDIRECT_URI:http://localhost:8080/}"]
          scopes: [openid, profile, offline_access, rwms.read, rwms.write, warehouse.read]
          require-proof-key: true
          allowed-principal-types: [USER]
          audiences: [rwms-services]
          allowed-origins: ["${PANEL_ORIGIN:http://localhost:8080}"]
          access-token-ttl: 5m
          refresh-token-ttl: 30d
          reuse-refresh-tokens: false
        - client-id: rwms-manager-android
          client-name: RWMS Руководитель
          enabled: true
          revision: 1
          authentication-methods: [none]
          grant-types: [authorization_code, refresh_token]
          redirect-uris: ["${MANAGER_REDIRECT_URI:http://localhost:8080/auth/manager/callback}"]
          post-logout-redirect-uris: ["${MANAGER_POST_LOGOUT_REDIRECT_URI:http://localhost:8080/}"]
          scopes: [openid, profile, offline_access, rwms.read, rwms.write, warehouse.read]
          require-proof-key: true
          allowed-principal-types: [USER]
          audiences: [rwms-services]
          allowed-origins: ["${MANAGER_ORIGIN:http://localhost:8080}"]
          access-token-ttl: 5m
          refresh-token-ttl: 30d
          reuse-refresh-tokens: false
        - client-id: rwms-rental-manager-web
          client-name: RWMS Менеджер Web
          enabled: true
          revision: 1
          authentication-methods: [none]
          grant-types: [authorization_code, refresh_token]
          redirect-uris: ["${RENTAL_MANAGER_WEB_REDIRECT_URI:${PANEL_ORIGIN:http://localhost:8080}/manager/auth/callback}"]
          post-logout-redirect-uris: ["${RENTAL_MANAGER_WEB_POST_LOGOUT_REDIRECT_URI:${PANEL_ORIGIN:http://localhost:8080}/manager/}"]
          scopes: [openid, profile, offline_access, rental.manage]
          require-proof-key: true
          allowed-principal-types: [USER]
          audiences: [rwms-services]
          allowed-origins: ["${RENTAL_MANAGER_WEB_ORIGIN:${PANEL_ORIGIN:http://localhost:8080}}"]
          access-token-ttl: 5m
          refresh-token-ttl: 30d
          reuse-refresh-tokens: false
        - client-id: rwms-rental-manager-android
          client-name: RWMS Менеджер Android
          enabled: true
          revision: 1
          authentication-methods: [none]
          grant-types: [authorization_code, refresh_token]
          redirect-uris: ["${RENTAL_MANAGER_ANDROID_REDIRECT_URI:${MANAGER_ORIGIN:http://localhost:8080}/auth/rental-manager/callback}"]
          post-logout-redirect-uris: ["${RENTAL_MANAGER_ANDROID_POST_LOGOUT_REDIRECT_URI:${MANAGER_ORIGIN:http://localhost:8080}/manager/}"]
          scopes: [openid, profile, offline_access, rental.manage]
          require-proof-key: true
          allowed-principal-types: [USER]
          audiences: [rwms-services]
          allowed-origins: ["${RENTAL_MANAGER_ANDROID_ORIGIN:${MANAGER_ORIGIN:http://localhost:8080}}"]
          access-token-ttl: 5m
          refresh-token-ttl: 30d
          reuse-refresh-tokens: false
        - client-id: rwms-admin-web
          client-name: RWMS Администрирование
          enabled: true
          revision: 1
          authentication-methods: [none]
          grant-types: [authorization_code, refresh_token]
          redirect-uris: ["${ADMIN_WEB_REDIRECT_URI:${PANEL_ORIGIN:http://localhost:8080}/admin/auth/callback}"]
          post-logout-redirect-uris: ["${ADMIN_WEB_POST_LOGOUT_REDIRECT_URI:${PANEL_ORIGIN:http://localhost:8080}/admin/}"]
          scopes: [openid, profile, offline_access, admin.manage]
          require-proof-key: true
          allowed-principal-types: [USER]
          audiences: [rwms-services]
          allowed-origins: ["${ADMIN_WEB_ORIGIN:${PANEL_ORIGIN:http://localhost:8080}}"]
          access-token-ttl: 5m
          refresh-token-ttl: 30d
          reuse-refresh-tokens: false
        - client-id: rwms-customer-android
          client-name: RWMS Клиент
          enabled: true
          revision: 1
          authentication-methods: [none]
          grant-types: [authorization_code, refresh_token]
          redirect-uris: ["${CUSTOMER_REDIRECT_URI:https://localhost/auth/customer/callback}"]
          scopes: [openid, profile, offline_access, customer.rental]
          require-proof-key: true
          allowed-principal-types: [USER]
          audiences: [rwms-services]
          allowed-origins: ["${CUSTOMER_ORIGIN:https://localhost}"]
          access-token-ttl: 5m
          refresh-token-ttl: 30d
          reuse-refresh-tokens: false
        - client-id: rwms-worker-android
          client-name: RWMS Рабочий
          enabled: true
          revision: 5
          authentication-methods: [none]
          grant-types: [authorization_code, refresh_token]
          redirect-uris: ["${WORKER_REDIRECT_URI:http://localhost:8082/auth/worker/callback}"]
          post-logout-redirect-uris: ["${WORKER_POST_LOGOUT_REDIRECT_URI:http://localhost:8082/}"]
          scopes: [openid, profile, offline_access, worker.tasks]
          require-proof-key: true
          allowed-principal-types: [WORKER]
          audiences: [rwms-services]
          allowed-origins: ["${WORKER_ORIGIN:http://localhost:8082}"]
          access-token-ttl: 5m
          refresh-token-ttl: 30d
          reuse-refresh-tokens: false
        - client-id: rwms-driver-android
          client-name: RWMS Водитель
          enabled: true
          revision: 1
          authentication-methods: [none]
          grant-types: [authorization_code, refresh_token]
          redirect-uris: ["${DRIVER_REDIRECT_URI:http://localhost:8082/auth/driver/callback}"]
          post-logout-redirect-uris: ["${DRIVER_POST_LOGOUT_REDIRECT_URI:http://localhost:8082/}"]
          scopes: [openid, profile, offline_access, driver.tasks]
          require-proof-key: true
          allowed-principal-types: [WORKER]
          audiences: [rwms-services]
          allowed-origins: ["${DRIVER_ORIGIN:http://localhost:8082}"]
          access-token-ttl: 5m
          refresh-token-ttl: 30d
          reuse-refresh-tokens: false
        - client-id: task-board-service
          client-name: Task Board Service
          enabled: true
          revision: ${TASK_BOARD_CLIENT_REVISION:6}
          authentication-methods: [client_secret_basic]
          grant-types: [client_credentials]
          scopes: [worker-credentials.manage, media.task-board, warehouse.identity.read, warehouse.timezone.read, warehouse.lifecycle.read, warehouse.lifecycle.confirm]
          secret-environment: TASK_BOARD_CLIENT_SECRET
          audiences: [rwms-services]
          access-token-ttl: 5m
        - client-id: auth-service
          client-name: Auth Service Warehouse Client
          enabled: ${AUTH_WAREHOUSE_CLIENT_ENABLED:false}
          revision: ${AUTH_WAREHOUSE_CLIENT_REVISION:1}
          authentication-methods: [client_secret_basic]
          grant-types: [client_credentials]
          scopes: [warehouse.read]
          secret-environment: AUTH_WAREHOUSE_CLIENT_SECRET
          audiences: [rwms-services]
          access-token-ttl: 5m
        - client-id: asset-service
          client-name: Asset Service Warehouse Registry Client
          enabled: ${ASSET_WAREHOUSE_CLIENT_ENABLED:false}
          revision: ${ASSET_WAREHOUSE_CLIENT_REVISION:5}
          authentication-methods: [client_secret_basic]
          grant-types: [client_credentials]
          scopes: [warehouse.read, warehouse.timezone.read, warehouse.operation.mark, warehouse.lifecycle.read, warehouse.lifecycle.confirm, media.asset, media.asset-import]
          secret-environment: ASSET_WAREHOUSE_CLIENT_SECRET
          audiences: [rwms-services]
          access-token-ttl: 5m
        - client-id: maintenance-service
          client-name: Maintenance Service Downstream Client
          enabled: ${MAINTENANCE_CLIENT_ENABLED:false}
          revision: ${MAINTENANCE_CLIENT_REVISION:5}
          authentication-methods: [client_secret_basic]
          grant-types: [client_credentials]
          scopes: [asset.maintenance, task-board.task-sync, queue-registry.write, media.maintenance, logistics.maintenance, warehouse.timezone.read, warehouse.operation.mark, warehouse.lifecycle.read, warehouse.lifecycle.confirm]
          secret-environment: MAINTENANCE_CLIENT_SECRET
          audiences: [rwms-services]
          access-token-ttl: 5m
        - client-id: inventory-service
          client-name: Inventory Service Downstream Client
          enabled: ${INVENTORY_CLIENT_ENABLED:false}
          revision: ${INVENTORY_CLIENT_REVISION:7}
          authentication-methods: [client_secret_basic]
          grant-types: [client_credentials]
          scopes: [warehouse.timezone.read, warehouse.operation.mark, warehouse.lifecycle.read, warehouse.lifecycle.confirm, asset.inventory, maintenance.inventory, logistics.inventory, media.inventory, task-board.inventory-calendar.read]
          secret-environment: INVENTORY_CLIENT_SECRET
          audiences: [rwms-services]
          access-token-ttl: 5m
        - client-id: logistics-service
          client-name: Logistics Service Downstream Client
          enabled: ${LOGISTICS_CLIENT_ENABLED:false}
          revision: ${LOGISTICS_CLIENT_REVISION:7}
          authentication-methods: [client_secret_basic]
          grant-types: [client_credentials]
          scopes: [warehouse.logistics, warehouse.timezone.read, warehouse.operation.mark, warehouse.lifecycle.read, warehouse.lifecycle.confirm, asset.logistics, task-board.logistics, task-board.driver-shifts.plan, maintenance.logistics, media.logistics]
          secret-environment: LOGISTICS_CLIENT_SECRET
          audiences: [rwms-services]
          access-token-ttl: 5m
        - client-id: logistics-planner
          client-name: Logistics Planner Integration Client
          enabled: ${LOGISTICS_PLANNER_CLIENT_ENABLED:false}
          revision: ${LOGISTICS_PLANNER_CLIENT_REVISION:1}
          authentication-methods: [client_secret_basic]
          grant-types: [client_credentials]
          scopes: [logistics.planning]
          secret-environment: LOGISTICS_PLANNER_CLIENT_SECRET
          audiences: [rwms-services]
          access-token-ttl: 5m
