rwms:
  auth:
    oauth:
      clients:
        - client-id: rwms-panel
          client-name: RWMS Panel
          enabled: true
          revision: 7
          authentication-methods: [none]
          grant-types: [authorization_code, refresh_token]
          redirect-uris: [http://localhost:8080/auth/callback]
          post-logout-redirect-uris: [http://localhost:8080/]
          scopes: [openid, profile, offline_access, rwms.read, rwms.write, warehouse.read]
          require-proof-key: true
          allowed-principal-types: [USER]
          audiences: [rwms-services]
          allowed-origins: [http://localhost:8080]
          access-token-ttl: 5m
          refresh-token-ttl: 30d
          reuse-refresh-tokens: false
        - client-id: rwms-manager-android
          client-name: RWMS Руководитель
          enabled: true
          revision: 1
          authentication-methods: [none]
          grant-types: [authorization_code, refresh_token]
          redirect-uris: [http://localhost:8080/auth/manager/callback]
          post-logout-redirect-uris: [http://localhost:8080/]
          scopes: [openid, profile, offline_access, rwms.read, rwms.write, warehouse.read]
          require-proof-key: true
          allowed-principal-types: [USER]
          audiences: [rwms-services]
          allowed-origins: [http://localhost:8080]
          access-token-ttl: 5m
          refresh-token-ttl: 30d
          reuse-refresh-tokens: false
        - client-id: rwms-worker-android
          client-name: RWMS Рабочий
          enabled: true
          revision: 3
          authentication-methods: [none]
          grant-types: [authorization_code, refresh_token]
          redirect-uris: [http://localhost:8082/auth/worker/callback]
          post-logout-redirect-uris: [http://localhost:8082/]
          scopes: [openid, profile, offline_access, worker.tasks]
          require-proof-key: true
          allowed-principal-types: [WORKER]
          audiences: [rwms-services]
          allowed-origins: [http://localhost:8082]
          access-token-ttl: 5m
          refresh-token-ttl: 30d
          reuse-refresh-tokens: false
        - client-id: rwms-driver-android
          client-name: RWMS Водитель
          enabled: true
          revision: 1
          authentication-methods: [none]
          grant-types: [authorization_code, refresh_token]
          redirect-uris: [http://localhost:8082/auth/driver/callback]
          post-logout-redirect-uris: [http://localhost:8082/]
          scopes: [openid, profile, offline_access, driver.tasks]
          require-proof-key: true
          allowed-principal-types: [WORKER]
          audiences: [rwms-services]
          allowed-origins: [http://localhost:8082]
          access-token-ttl: 5m
          refresh-token-ttl: 30d
          reuse-refresh-tokens: false
        - client-id: task-board-service
          client-name: Task Board Service
          enabled: true
          revision: ${TASK_BOARD_CLIENT_REVISION:7}
          authentication-methods: [client_secret_basic]
          grant-types: [client_credentials]
          scopes: [worker-credentials.manage, media.task-board, warehouse.identity.read, warehouse.timezone.read, warehouse.lifecycle.read, warehouse.lifecycle.confirm, maintenance.task-requirements]
          secret-environment: TASK_BOARD_CLIENT_SECRET
          audiences: [rwms-services]
          access-token-ttl: 5m
        - client-id: auth-service
          client-name: Auth Service Warehouse Client
          enabled: true
          revision: 2
          authentication-methods: [client_secret_basic]
          grant-types: [client_credentials]
          scopes: [warehouse.read]
          development-secret: auth-service-test-secret
          audiences: [rwms-services]
          access-token-ttl: 5m
