rwms:
  auth:
    oauth:
      clients:
        - client-id: maintenance-service
          client-name: Maintenance Service Downstream Client
          enabled: true
          revision: 1
          authentication-methods: [client_secret_basic]
          grant-types: [client_credentials]
          scopes: [asset.maintenance, task-board.task-sync]
          development-secret: maintenance-test-secret
          audiences: [rwms-services]
          access-token-ttl: 5m
