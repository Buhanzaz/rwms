rwms:
  auth:
    oauth:
      clients:
        - client-id: asset-service
          client-name: Asset Service Warehouse Registry Client
          enabled: ${ASSET_WAREHOUSE_CLIENT_ENABLED:false}
          revision: ${ASSET_WAREHOUSE_CLIENT_REVISION:2}
          authentication-methods: [client_secret_basic]
          grant-types: [client_credentials]
          scopes: [warehouse.read, media.asset-import]
          secret-environment: ASSET_WAREHOUSE_CLIENT_SECRET
          audiences: [rwms-services]
          access-token-ttl: 5m
