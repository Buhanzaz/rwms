spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never

rwms:
  auth:
    issuer: http://localhost:9000
    panel-origin: http://localhost:8080
    panel-redirect-uri: http://localhost:8080/auth/callback
    panel-post-logout-redirect-uri: http://localhost:8080/
    worker-origin: http://localhost:8082
    worker-redirect-uri: http://localhost:8082/auth/callback
    worker-post-logout-redirect-uri: http://localhost:8082/
    dev-default-credentials: true
    bootstrap-admin-username: admin
    bootstrap-admin-password: admin
    signing-key-store: ""
    signing-key-store-password: ""
    signing-key-alias: rwms-auth-test
    warehouse-validation:
      enabled: false
    oauth:
      clients:
        - client-id: rwms-panel
          client-name: RWMS Panel
          enabled: true
          revision: 7
          authentication-methods: [none]
          grant-types: [authorization_code, refresh_token]
          redirect-uris: [http://localhost:8080/auth/callback]
          post-logout-redirect-uris: [http://localhost:8080/]
          scopes: [openid, profile, offline_access, rwms.read, rwms.write, warehouse.read]
          require-proof-key: true
          allowed-principal-types: [USER]
          audiences: [rwms-services]
          allowed-origins: [http://localhost:8080]
          access-token-ttl: 5m
          refresh-token-ttl: 30d
          reuse-refresh-tokens: false
        - client-id: rwms-manager-android
          client-name: RWMS Руководитель
          enabled: true
          revision: 1
          authentication-methods: [none]
          grant-types: [authorization_code, refresh_token]
          redirect-uris: [http://localhost:8080/auth/manager/callback]
          post-logout-redirect-uris: [http://localhost:8080/]
          scopes: [openid, profile, offline_access, rwms.read, rwms.write, warehouse.read]
          require-proof-key: true
          allowed-principal-types: [USER]
          audiences: [rwms-services]
          allowed-origins: [http://localhost:8080]
          access-token-ttl: 5m
          refresh-token-ttl: 30d
          reuse-refresh-tokens: false
        - client-id: rwms-worker-android
          client-name: RWMS Рабочий
          enabled: true
          revision: 2
          authentication-methods: [none]
          grant-types: [authorization_code, refresh_token]
          redirect-uris: [http://localhost:8082/auth/callback]
          post-logout-redirect-uris: [http://localhost:8082/]
          scopes: [openid, profile, offline_access, worker.tasks]
          require-proof-key: true
          allowed-principal-types: [WORKER]
          audiences: [rwms-services]
          allowed-origins: [http://localhost:8082]
          access-token-ttl: 5m
          refresh-token-ttl: 30d
          reuse-refresh-tokens: false
        - client-id: task-board-service
          client-name: Task Board Service
          enabled: true
          revision: 1
          authentication-methods: [client_secret_basic]
          grant-types: [client_credentials]
          scopes: [worker-credentials.manage]
          development-secret: task-board-test-secret
          audiences: [rwms-services]
          access-token-ttl: 5m
        - client-id: auth-service
          client-name: Auth Service Warehouse Client
          enabled: false
          revision: 1
          authentication-methods: [client_secret_basic]
          grant-types: [client_credentials]
          scopes: [warehouse.read]
          audiences: [rwms-services]
          access-token-ttl: 5m
        - client-id: asset-service
          client-name: Asset Service Warehouse Registry Client
          enabled: false
          revision: 2
          authentication-methods: [client_secret_basic]
          grant-types: [client_credentials]
          scopes: [warehouse.read, media.asset-import]
          secret-environment: ASSET_WAREHOUSE_CLIENT_SECRET
          audiences: [rwms-services]
          access-token-ttl: 5m
        - client-id: maintenance-service
          client-name: Maintenance Service Downstream Client
          enabled: false
          revision: 1
          authentication-methods: [client_secret_basic]
          grant-types: [client_credentials]
          scopes: [asset.maintenance, task-board.task-sync, queue-registry.write, media.maintenance]
          audiences: [rwms-services]
          access-token-ttl: 5m
