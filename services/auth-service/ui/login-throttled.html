<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f3f6f7" />
    <link rel="stylesheet" href="/src/index.css" />
    <title>Повторите вход позже — RWMS</title>
  </head>
  <body>
    <main class="auth-page">
      <div class="auth-page__wash" aria-hidden="true"></div>
      <div class="auth-page__content">
        <section class="auth-layout" aria-labelledby="login-throttled-title">
          <div class="auth-brand">
            <img
              src="assets/block-box-logo.svg"
              class="auth-brand__logo"
              alt="Block Box"
            />
          </div>
          <div class="auth-notice">
            <h1 id="login-throttled-title" class="auth-notice__title">
              Слишком много попыток входа
            </h1>
            <p class="auth-notice__body">
              Подождите __RETRY_AFTER_SECONDS__ сек. и попробуйте снова.
            </p>
            <a href="login" class="auth-submit auth-notice__retry">
              Повторить вход
            </a>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
