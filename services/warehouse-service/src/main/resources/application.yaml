server:
  port: ${WAREHOUSE_SERVICE_PORT:8083}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: warehouse-service
  tracing:
    sampling:
      probability: ${WAREHOUSE_TRACING_SAMPLING_PROBABILITY:0.1}

logging:
  structured:
    format:
      console: ecs

spring:
  application:
    name: warehouse-service
  datasource:
    url: ${WAREHOUSE_DB_URL}
    username: ${WAREHOUSE_DB_USERNAME}
    password: ${WAREHOUSE_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  cloud:
    stream:
      kafka:
        binder:
          brokers: ${WAREHOUSE_KAFKA_BROKERS:}
          auto-create-topics: false
          configuration:
            acks: all
            enable.idempotence: true
            compression.type: zstd
            request.timeout.ms: 5000
            delivery.timeout.ms: 15000
            max.block.ms: 5000
            metadata.recovery.rebootstrap.trigger.ms: 1000
        default:
          producer:
            sync: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER}
          audiences: ${AUTH_AUDIENCE:rwms-services}

rwms:
  platform:
    kafka:
      enabled: ${WAREHOUSE_KAFKA_ENABLED}
      destinations:
        - rwms.warehouse.warehouse.v1
  warehouse:
    eventing:
      outbox:
        relay-delay: ${WAREHOUSE_KAFKA_OUTBOX_RELAY_DELAY:1s}
        lease-duration: ${WAREHOUSE_KAFKA_OUTBOX_LEASE_DURATION:30s}
        instance-id: ${WAREHOUSE_KAFKA_INSTANCE_ID:warehouse-service}
    idempotency:
      retention: ${WAREHOUSE_IDEMPOTENCY_RETENTION:7d}
      cleanup-delay: ${WAREHOUSE_IDEMPOTENCY_CLEANUP_DELAY:1h}
      cleanup-batch-size: ${WAREHOUSE_IDEMPOTENCY_CLEANUP_BATCH_SIZE:250}
  cors:
    allowed-origins: ${PANEL_ORIGIN}
