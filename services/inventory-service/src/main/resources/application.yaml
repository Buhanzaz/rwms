server:
  port: ${INVENTORY_SERVICE_PORT:8089}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: inventory-service
  tracing:
    sampling:
      probability: ${INVENTORY_TRACING_SAMPLING_PROBABILITY:0.1}

logging:
  structured:
    format:
      console: ecs

spring:
  application:
    name: inventory-service
  datasource:
    url: ${INVENTORY_DB_URL}
    username: ${INVENTORY_DB_USERNAME}
    password: ${INVENTORY_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  cloud:
    function:
      definition: inventoryMediaFacts;inventoryAssetFacts
    stream:
      bindings:
        inventoryMediaFacts-in-0:
          destination: rwms.media.media.v1
          group: inventory-service-media-inbox-v1
          consumer:
            max-attempts: 1
        inventoryAssetFacts-in-0:
          destination: rwms.asset.rental-item.v1
          group: inventory-service-asset-membership-v1
          consumer:
            max-attempts: 1
      kafka:
        default:
          producer:
            sync: true
        binder:
          brokers: ${INVENTORY_KAFKA_BROKERS:}
          auto-create-topics: false
          configuration:
            acks: all
            enable.idempotence: true
            compression.type: zstd
            request.timeout.ms: 5000
            delivery.timeout.ms: 15000
            max.block.ms: 5000
            metadata.recovery.rebootstrap.trigger.ms: 1000
        bindings:
          inventoryMediaFacts-in-0:
            consumer:
              enable-dlq: false
              start-offset: earliest
          inventoryAssetFacts-in-0:
            consumer:
              enable-dlq: false
              start-offset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER}
          audiences: ${AUTH_AUDIENCE:rwms-services}

rwms:
  platform:
    kafka:
      enabled: ${INVENTORY_KAFKA_ENABLED:false}
      destinations:
        - rwms.inventory.session.v1
        - rwms.inventory.publication.v1
  inventory:
    idempotency:
      retention: ${INVENTORY_IDEMPOTENCY_RETENTION:7d}
    dependencies:
      enabled: ${INVENTORY_DEPENDENCIES_ENABLED:false}
      token-uri: ${AUTH_TOKEN_URI:}
      client-id: ${INVENTORY_CLIENT_ID:inventory-service}
      client-secret: ${INVENTORY_CLIENT_SECRET:}
      warehouse-base-url: ${WAREHOUSE_INTERNAL_BASE_URL:}
      task-board-base-url: ${TASK_BOARD_INTERNAL_BASE_URL:}
      asset-base-url: ${ASSET_INTERNAL_BASE_URL:}
      maintenance-base-url: ${MAINTENANCE_INTERNAL_BASE_URL:}
      logistics-base-url: ${LOGISTICS_INTERNAL_BASE_URL:}
      media-base-url: ${MEDIA_INTERNAL_BASE_URL:}
      connect-timeout: ${INVENTORY_CONNECT_TIMEOUT:2s}
      read-timeout: ${INVENTORY_READ_TIMEOUT:5s}
    eventing:
      outbox:
        relay-delay: ${INVENTORY_KAFKA_OUTBOX_RELAY_DELAY:1s}
        lease-duration: ${INVENTORY_KAFKA_OUTBOX_LEASE_DURATION:30s}
        instance-id: ${INVENTORY_KAFKA_INSTANCE_ID:inventory-service}
    security:
      dev-auth-bypass: ${INVENTORY_DEV_AUTH_BYPASS:false}
  cors:
    allowed-origins: ${PANEL_ORIGIN}
