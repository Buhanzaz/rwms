name: logistics-simulator

services:
  db:
    image: postgis/postgis:16-3.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logistics}
      POSTGRES_USER: ${POSTGRES_USER:-logistics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logistics}
    volumes:
      - logistics-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  osrm-download:
    image: curlimages/curl:8.12.1
    user: "0:0"
    environment:
      OSRM_DATA_URL: ${OSRM_DATA_URL:-https://download.geofabrik.de/russia/central-fed-district-latest.osm.pbf}
    volumes:
      - logistics-osrm-data:/data
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        if [ -s /data/region.osm.pbf ]; then
          exit 0
        fi
        curl --fail --location --retry 5 --retry-all-errors --continue-at - \
          --output /data/region.osm.pbf.download "$${OSRM_DATA_URL}"
        mv /data/region.osm.pbf.download /data/region.osm.pbf
    restart: "no"

  osrm-prepare:
    profiles:
      - legacy-routing
    image: osrm/osrm-backend:v5.25.0
    user: "0:0"
    depends_on:
      osrm-download:
        condition: service_completed_successfully
    volumes:
      - logistics-osrm-data:/data
    entrypoint:
      - /bin/bash
      - -ec
    command:
      - |
        if [ ! -s /data/region.osrm ]; then
          osrm-extract -p /opt/car.lua /data/region.osm.pbf
        fi
        if [ ! -s /data/region.osrm.partition ]; then
          osrm-partition /data/region.osrm
        fi
        if [ ! -s /data/region.osrm.datasource_names ]; then
          osrm-customize /data/region.osrm
        fi
        test -s /data/region.osrm
    restart: "no"

  osrm:
    profiles:
      - legacy-routing
    image: osrm/osrm-backend:v5.25.0
    depends_on:
      osrm-prepare:
        condition: service_completed_successfully
    volumes:
      - logistics-osrm-data:/data:ro
    command:
      - osrm-routed
      - --algorithm
      - mld
      - /data/region.osrm
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/5000; printf "GET /route/v1/driving/37.6000000,55.7000000;37.6100000,55.7100000 HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n" >&3; grep -q "\"code\":\"Ok\"" <&3'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  valhalla-init:
    image: alpine:3.21
    user: "0:0"
    depends_on:
      osrm-download:
        condition: service_completed_successfully
    volumes:
      - logistics-osrm-data:/osm-source:ro
      - logistics-valhalla-data:/custom_files
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        test -s /osm-source/region.osm.pbf
        ln -sfn /osm-source/region.osm.pbf /custom_files/region.osm.pbf
        test -e /custom_files/region.osm.pbf
    restart: "no"

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.8.3
    depends_on:
      valhalla-init:
        condition: service_completed_successfully
    environment:
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      build_tar: "True"
      force_rebuild: "False"
      use_tiles_ignore_pbf: "False"
      use_default_speeds_config: "False"
      serve_tiles: "True"
      server_threads: ${VALHALLA_SERVER_THREADS:-2}
    volumes:
      - logistics-osrm-data:/osm-source:ro
      - logistics-valhalla-data:/custom_files
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error http://127.0.0.1:8002/status >/dev/null
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30m
    restart: unless-stopped

  truck-restrictions-indexer:
    build:
      context: ./backend
      target: restriction-indexer
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://logistics:logistics@db:5432/logistics}
      OSM_DATA_VERSION: ${OSM_DATA_VERSION:-unknown}
      OSM_RESTRICTIONS_PBF_PATH: /osm-source/region.osm.pbf
      OSM_RESTRICTIONS_BATCH_SIZE: ${OSM_RESTRICTIONS_BATCH_SIZE:-1000}
    depends_on:
      db:
        condition: service_healthy
      osrm-download:
        condition: service_completed_successfully
    volumes:
      - logistics-osrm-data:/osm-source:ro
    restart: "no"

  backend:
    build:
      context: ./backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://logistics:logistics@db:5432/logistics}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-valhalla}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-http://osrm:5000}
      OSRM_PROFILE: ${OSRM_PROFILE:-driving}
      OSRM_TIMEOUT_SECONDS: ${OSRM_TIMEOUT_SECONDS:-15}
      VALHALLA_URL: ${VALHALLA_URL:-http://valhalla:8002}
      VALHALLA_ENABLED: ${VALHALLA_ENABLED:-true}
      VALHALLA_TIMEOUT_SECONDS: ${VALHALLA_TIMEOUT_SECONDS:-30}
      OSM_DATA_VERSION: ${OSM_DATA_VERSION:-unknown}
      DEFAULT_SCENARIO_TIMEZONE: ${DEFAULT_SCENARIO_TIMEZONE:-Europe/Moscow}
      PLANNER_DEFAULT_SEED: ${PLANNER_DEFAULT_SEED:-20260822}
      RWMS_SYNC_ENABLED: ${RWMS_SYNC_ENABLED:-false}
      RWMS_LOGISTICS_BASE_URL: ${RWMS_LOGISTICS_BASE_URL:-}
      RWMS_TOKEN_URL: ${RWMS_TOKEN_URL:-}
      RWMS_CLIENT_ID: ${RWMS_CLIENT_ID:-logistics-planner}
      RWMS_CLIENT_SECRET: ${RWMS_CLIENT_SECRET:-}
      RWMS_TIMEOUT_SECONDS: ${RWMS_TIMEOUT_SECONDS:-15}
    command:
      - /bin/sh
      - -ec
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
      valhalla:
        condition: service_healthy
      truck-restrictions-indexer:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  backend-test:
    profiles:
      - tools
    build:
      context: ./backend
      target: test
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://logistics:logistics@db:5432/logistics}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+psycopg://logistics:logistics@db:5432/logistics}
      PYTHONPATH: /app
      ROUTING_PROVIDER: mock
      DEFAULT_SCENARIO_TIMEZONE: ${DEFAULT_SCENARIO_TIMEZONE:-Europe/Moscow}
      PLANNER_DEFAULT_SEED: ${PLANNER_DEFAULT_SEED:-20260822}
      RWMS_SYNC_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    working_dir: /app

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_APP_BASE_PATH: ${VITE_APP_BASE_PATH:-/}
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1/
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  frontend-test:
    profiles:
      - tools
    build:
      context: ./frontend
      target: test
    environment:
      # Test assertions cover the root-path browser contract independently
      # from this VPS's /logistics-simulator reverse-proxy configuration.
      VITE_API_BASE_URL: /api
      VITE_APP_BASE_PATH: /
      VITE_MAP_STYLE_URL: ""
    volumes:
      - ./frontend:/app
      - ./backend:/backend:ro
      - /app/node_modules
    working_dir: /app

volumes:
  logistics-postgres:
  logistics-osrm-data:
  logistics-valhalla-data:
