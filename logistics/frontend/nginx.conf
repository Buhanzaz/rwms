server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_origin http://backend:8000;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /api/ {
        proxy_pass $backend_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    # The VPS publishes the same immutable bundle below this prefix. Keep the
    # API prefix in this container as well so direct and edge-routed smoke tests
    # exercise exactly the URLs embedded by Vite.
    location /logistics-simulator/api/ {
        rewrite ^/logistics-simulator/api/(.*)$ /api/$1 break;
        proxy_pass $backend_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    location = /logistics-simulator {
        return 308 /logistics-simulator/;
    }

    # Never turn a missing hashed asset into index.html: browsers reject that
    # fallback as a module MIME mismatch and the operator sees a blank page.
    location ^~ /logistics-simulator/assets/ {
        rewrite ^/logistics-simulator/(.*)$ /$1 break;
        try_files $uri =404;
    }

    location /logistics-simulator/ {
        rewrite ^/logistics-simulator/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
