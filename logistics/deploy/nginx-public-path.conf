# Include these locations inside the public TLS server block. The primary RWMS
# panel owns /logistics/**; the standalone logistics panel must not intercept it.
location = /logistics-panel {
    return 308 /logistics-panel/;
}

# Standalone administrator catalog requests are supported only through the
# authenticated gateway at /api/logistics-planner/v1/admin/**.
location = /logistics-panel/api/admin {
    return 404;
}

location ^~ /logistics-panel/api/admin/ {
    return 404;
}

location ^~ /logistics-panel/api/ {
    proxy_pass http://127.0.0.1:8000/api/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location ^~ /logistics-panel/ {
    proxy_pass http://127.0.0.1:5173/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
