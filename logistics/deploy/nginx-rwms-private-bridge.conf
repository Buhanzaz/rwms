# Docker-only RWMS planning bridge for the logistics simulator.
#
# This file is intentionally bound to the fixed gateway of the persistent
# `rwms-logistics-private` Docker bridge. It must never listen on the public
# VPS address. OAuth2/Bearer authorization remains enforced by both upstreams.
server {
    listen 172.21.0.1:19002 default_server;
    server_name _;
    server_tokens off;
    access_log off;

    allow 172.21.0.0/16;
    deny all;

    location = /oauth2/token {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:9002;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    location = /oauth2/jwks {
        proxy_pass http://127.0.0.1:9002;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    location / {
        return 404;
    }
}

server {
    listen 172.21.0.1:18090 default_server;
    server_name _;
    server_tokens off;
    access_log off;

    allow 172.21.0.0/16;
    deny all;

    location ^~ /api/internal/logistics/v1/planning/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    location / {
        return 404;
    }
}
