# Include once in the existing Nginx http context before the public RWMS servers.
# The mapped value never contains query arguments. Capability-bearing path
# segments are replaced before the access log line is rendered.
map $uri $rwms_sanitized_route {
    default $uri;

    ~^/api/logistics/public/v1/client-presentations/[^/]+$ /api/logistics/public/v1/client-presentations/[capability];
    ~^/api/logistics/public/v1/client-presentations/[^/]+/bookings$ /api/logistics/public/v1/client-presentations/[capability]/bookings;
    ~^/api/logistics/public/v1/client-presentations/[^/]+/bookings/[^/]+$ /api/logistics/public/v1/client-presentations/[capability]/bookings/[booking];
    ~^/api/logistics/public/v1/client-presentations/[^/]+/bookings/[^/]+/payment$ /api/logistics/public/v1/client-presentations/[capability]/bookings/[booking]/payment;
    ~^/api/logistics/public/v1/client-presentations/[^/]+/bookings/[^/]+/payment/confirm-test$ /api/logistics/public/v1/client-presentations/[capability]/bookings/[booking]/payment/confirm-test;
    ~^/api/logistics/public/v1/client-presentations/[^/]+/media/[^/]+/[^/]+/[^/]+/[^/]+$ /api/logistics/public/v1/client-presentations/[capability]/media/[cabin]/[media]/[generation]/[variant];
    ~^/api/logistics/public/v1/client-presentations/ /api/logistics/public/v1/client-presentations/[capability-route];

    ~^/api/logistics/public/v1/cabin-photo-presentations/[^/]+$ /api/logistics/public/v1/cabin-photo-presentations/[capability];
    ~^/api/logistics/public/v1/cabin-photo-presentations/[^/]+/media/[^/]+/[^/]+/[^/]+$ /api/logistics/public/v1/cabin-photo-presentations/[capability]/media/[media]/[generation]/[variant];
    ~^/api/logistics/public/v1/cabin-photo-presentations/ /api/logistics/public/v1/cabin-photo-presentations/[capability-route];

    ~^/api/logistics/public/v1/contractor-route-shares/[^/]+$ /api/logistics/public/v1/contractor-route-shares/[capability];
    ~^/api/logistics/public/v1/contractor-route-shares/[^/]+/tasks/[^/]+/entries/[^/]+/actions$ /api/logistics/public/v1/contractor-route-shares/[capability]/tasks/[task]/entries/[entry]/actions;
    ~^/api/logistics/public/v1/contractor-route-shares/[^/]+/tasks/[^/]+/entries/[^/]+/evidence/[^/]+$ /api/logistics/public/v1/contractor-route-shares/[capability]/tasks/[task]/entries/[entry]/evidence/[evidence];
    ~^/api/logistics/public/v1/contractor-route-shares/[^/]+/tasks/[^/]+/entries/[^/]+/media/[^/]+/generations/[^/]+/variants/[^/]+/content$ /api/logistics/public/v1/contractor-route-shares/[capability]/tasks/[task]/entries/[entry]/media/[media]/generations/[generation]/variants/[variant]/content;
    ~^/api/logistics/public/v1/contractor-route-shares/ /api/logistics/public/v1/contractor-route-shares/[capability-route];

    ~^/client-presentations/ /client-presentations/[capability];
    ~^/photos/ /photos/[capability];
    ~^/contractor-routes/ /contractor-routes/[capability];
}

log_format rwms_sanitized escape=json
    '{"timestamp":"$time_iso8601",'
    '"remoteAddress":"$remote_addr",'
    '"method":"$request_method",'
    '"route":"$rwms_sanitized_route",'
    '"protocol":"$server_protocol",'
    '"status":$status,'
    '"requestId":"$request_id",'
    '"durationSeconds":$request_time,'
    '"bytesSent":$body_bytes_sent}';
