# Include these exact locations inside the TLS server block for
# 77-90-158-90.sslip.io. The four APK roots stay separate: this aggregate
# page never mirrors another application's release artifact.

location = /downloads {
    return 302 /downloads/;
}

location = /downloads/ {
    default_type text/html;
    add_header Cache-Control "no-cache, no-store, max-age=0, must-revalidate" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    alias /var/www/rwms-app-downloads/;
}

location = /downloads/index.html {
    default_type text/html;
    add_header Cache-Control "no-cache, no-store, max-age=0, must-revalidate" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    alias /var/www/rwms-app-downloads/index.html;
}

location = /downloads/rwms-driver.apk {
    add_header Cache-Control "no-store" always;
    return 302 /downloads/rwms-driver-0.1.18-debug.apk;
}

location = /downloads/rwms-driver-0.1.18-debug.apk {
    types {
        application/vnd.android.package-archive apk;
    }
    add_header Content-Disposition 'attachment; filename="rwms-driver-0.1.18-debug.apk"' always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    alias /var/www/rwms-driver-download/rwms-driver-0.1.18-debug.apk;
}

location = /downloads/rwms-customer-0.1.1.apk {
    types {
        application/vnd.android.package-archive apk;
    }
    add_header Content-Disposition 'attachment; filename="rwms-customer-0.1.1.apk"' always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    alias /var/www/rwms-client-download/rwms-customer-0.1.1.apk;
}

location = /downloads/rwms-customer-0.1.2.apk {
    types {
        application/vnd.android.package-archive apk;
    }
    add_header Content-Disposition 'attachment; filename="rwms-customer-0.1.2.apk"' always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    alias /var/www/rwms-client-download/rwms-customer-0.1.2.apk;
}

location = /downloads/rwms-customer-0.1.3.apk {
    types {
        application/vnd.android.package-archive apk;
    }
    add_header Content-Disposition 'attachment; filename="rwms-customer-0.1.3.apk"' always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    alias /var/www/rwms-client-download/rwms-customer-0.1.3.apk;
}

location = /downloads/rwms-customer-0.1.4.apk {
    types {
        application/vnd.android.package-archive apk;
    }
    add_header Content-Disposition 'attachment; filename="rwms-customer-0.1.4.apk"' always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    alias /var/www/rwms-client-download/rwms-customer-0.1.4.apk;
}

location = /client-download {
    return 302 /client-download/;
}

location ^~ /client-download/ {
    alias /var/www/rwms-client-download/;
    index index.html;
    add_header Cache-Control "no-cache, no-store, max-age=0, must-revalidate" always;
    add_header Content-Security-Policy "default-src 'none'; connect-src 'self'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
}
