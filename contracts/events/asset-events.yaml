asyncapi: 3.1.0
info:
  title: RWMS Asset Domain Events
  version: 1.1.0
  description: >-
    Sanitized committed asset facts. Kafka is transport, not the canonical
    archive. Every topic is keyed by aggregateId and consumers deduplicate by
    eventId, quarantine version gaps, and never receive comments, note text,
    tenant data, media URLs or PII.
defaultContentType: application/json
servers:
  kafka:
    host: configured-at-runtime
    protocol: kafka
channels:
  rentalItemFacts:
    address: rwms.asset.rental-item.v1
    description: >-
      Complete contiguous RENTAL_ITEM stream. Media-service projects CABIN
      authorization from the full owner facts, treats comment/note facts as
      ordering markers, and deactivates the owner when status is WRITTEN_OFF.
    messages: { factV1: { $ref: '#/components/messages/AssetFactV1' } }
  equipmentCatalogFacts: { address: rwms.asset.equipment-catalog.v1, messages: { factV1: { $ref: '#/components/messages/AssetFactV1' } } }
  equipmentBalanceFacts: { address: rwms.asset.equipment-balance.v1, messages: { factV1: { $ref: '#/components/messages/AssetFactV1' } } }
  equipmentMovementFacts: { address: rwms.asset.equipment-movement.v1, messages: { factV1: { $ref: '#/components/messages/AssetFactV1' } } }
  equipmentHoldFacts: { address: rwms.asset.equipment-allocation-hold.v1, messages: { factV1: { $ref: '#/components/messages/AssetFactV1' } } }
  operationLeaseFacts: { address: rwms.asset.operation-lease.v1, messages: { factV1: { $ref: '#/components/messages/AssetFactV1' } } }
  classifierFacts: { address: rwms.asset.classifier.v1, messages: { factV1: { $ref: '#/components/messages/AssetFactV1' } } }
  sanitizedDlt:
    address: rwms.asset.dlt.v1
    description: Hash-only failure record; no original event body or sensitive fields.
    messages: { dltV1: { $ref: '#/components/messages/SanitizedDltV1' } }
operations:
  publishRentalItemFacts: { action: send, channel: { $ref: '#/channels/rentalItemFacts' } }
  publishEquipmentCatalogFacts: { action: send, channel: { $ref: '#/channels/equipmentCatalogFacts' } }
  publishEquipmentBalanceFacts: { action: send, channel: { $ref: '#/channels/equipmentBalanceFacts' } }
  publishEquipmentMovementFacts: { action: send, channel: { $ref: '#/channels/equipmentMovementFacts' } }
  publishEquipmentHoldFacts: { action: send, channel: { $ref: '#/channels/equipmentHoldFacts' } }
  publishOperationLeaseFacts: { action: send, channel: { $ref: '#/channels/operationLeaseFacts' } }
  publishClassifierFacts: { action: send, channel: { $ref: '#/channels/classifierFacts' } }
components:
  messages:
    AssetFactV1:
      name: asset.fact.v1
      payload: { $ref: './asset/asset-events-v1.schema.json' }
    SanitizedDltV1:
      name: asset.sanitized-dlt.v1
      payload:
        type: object
        additionalProperties: false
        required: [failureCode, messageSha256, recordedAt]
        properties:
          failureCode: { enum: [VALIDATION_REJECTED, PROCESSING_FAILED, VERSION_GAP] }
          messageSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
          recordedAt: { type: string, format: date-time }
