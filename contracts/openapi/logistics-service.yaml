          type: [array, "null"]
          maxItems: 31
          uniqueItems: true
          items: { type: string, format: date }
      allOf:
        - if:
            required: [latitude]
          then:
            required: [longitude]
        - if:
            required: [longitude]
          then:
            required: [latitude]
      oneOf:
        - required: [clientId]
          not: { required: [newClient] }
        - required: [newClient]
          not: { required: [clientId] }
