        equipmentName: { type: string, minLength: 1, maxLength: 512 }
        quantity: { type: integer, format: int64, minimum: 1 }
        reservationState:
          type: string
          const: ACTIVE
          description: Derived from the active order-wide asset reservation; no duplicate local status is stored.
    OrderRentalTerm:
      type: object
      additionalProperties: false
      required: [rentalMonths, shipmentDate, returnDate]
      properties:
        rentalMonths: { type: integer, format: int64, minimum: 1 }
        shipmentDate: { type: [string, "null"], format: date }
        returnDate: { type: [string, "null"], format: date }
    OrderRentalItem:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          warehouseId,
          number,
          status,
          rentalType,
          dimensions,
          finishing,
          category,
          characteristics,
          linoleum,
          tags,
          contents,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        number: { type: string }
        status: { type: string }
        rentalType: { type: [string, "null"] }
        dimensions: { type: [string, "null"] }
        finishing: { type: [string, "null"] }
        category: { type: [string, "null"] }
        characteristics: { type: [string, "null"] }
        linoleum: { type: [boolean, "null"] }
        tags: { type: array, items: { type: string } }
        contents:
          type: array
          items: { $ref: "#/components/schemas/OrderEquipmentContent" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderUnit:
      type: object
      additionalProperties: false
      required: [reservationId, added, reservationState, unit, desiredContents, rentalTerm]
      properties:
        reservationId: { type: [string, "null"], format: uuid }
        added: { type: boolean }
        reservationState:
          type: [string, "null"]
          description: ACTIVE for a cabin currently reserved by this order; null for an unselected candidate.
        unit: { $ref: "#/components/schemas/OrderRentalItem" }
        desiredContents:
          type: array
          items: { $ref: "#/components/schemas/OrderDesiredEquipment" }
        rentalTerm:
          anyOf:
            - { $ref: "#/components/schemas/OrderRentalTerm" }
            - { type: "null" }
    OrderUnitPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          { type: array, items: { $ref: "#/components/schemas/OrderUnit" } }
        page: { type: integer, format: int64, minimum: 0 }
        size: { type: integer, format: int64, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int64, minimum: 0 }
