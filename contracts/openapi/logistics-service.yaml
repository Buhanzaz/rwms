        city: { type: string }
        cabinTypes:
          type: array
          items: { type: string }
        finishes:
          type: array
          items: { type: string }
        dimensions:
          type: array
          items: { type: string }
        categories:
          type: array
          items: { type: string }
        characteristics:
          type: array
          items: { type: string }
        typeDimensions:
          type: array
          items: { $ref: "#/components/schemas/CabinTypeDimensionRelation" }
    CabinTypeDimensionRelation:
      type: object
      additionalProperties: false
