        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    put:
      operationId: updateCustomerProfile
      description: >-
        Updates mutable contact and display fields for the authenticated subject under the
        profile version fence. The individual/legal entity kind and auth/client bindings remain
        immutable; logistics updates its rental-client projection in the same transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCustomerProfileRequest" }
      responses:
        "200":
          description: Updated customer profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
