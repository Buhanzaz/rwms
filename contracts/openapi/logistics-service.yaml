        status: { type: string }
        rentalType: { type: [string, "null"] }
        dimensions: { type: [string, "null"] }
        finishing: { type: [string, "null"] }
        category: { type: [string, "null"] }
        characteristics: { type: [string, "null"] }
        linoleum: { type: [boolean, "null"] }
        tags: { type: array, items: { type: string } }
        contents:
          type: array
          items: { $ref: "#/components/schemas/OrderEquipmentContent" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderUnit:
      type: object
      additionalProperties: false
      required: [reservationId, added, unit, desiredContents, rentalTerm]
      properties:
        reservationId: { type: [string, "null"], format: uuid }
        added: { type: boolean }
        unit: { $ref: "#/components/schemas/OrderRentalItem" }
        desiredContents:
          type: array
          items: { $ref: "#/components/schemas/OrderDesiredEquipment" }
        rentalTerm:
          anyOf:
            - { $ref: "#/components/schemas/OrderRentalTerm" }
            - { type: "null" }
    OrderUnitPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          { type: array, items: { $ref: "#/components/schemas/OrderUnit" } }
        page: { type: integer, format: int64, minimum: 0 }
        size: { type: integer, format: int64, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int64, minimum: 0 }
    OrderPermissions:
      type: object
      additionalProperties: false
      required: [canEdit, canViewOtherManagers]
      properties:
        canEdit: { type: boolean }
        canViewOtherManagers: { type: boolean }
    OrderDetail:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          number,
          status,
          client,
          managerId,
          managerDisplayName,
          createdBy,
          createdByDisplayName,
          warehouseId,
          deliveryAddress,
          latitude,
          longitude,
          contactPhone,
          comment,
          acceptableDeliveryDates,
          unitCount,
          createdAt,
          updatedAt,
          units,
          movements,
          permissions,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        number: { type: string }
        status:
          { type: string, enum: [DRAFT, SAVED, FULFILLED, CLOSED, CANCELLED] }
        client: { $ref: "#/components/schemas/OrderClient" }
        managerId: { type: string, format: uuid }
        managerDisplayName: { type: string }
        createdBy: { type: string, format: uuid }
        createdByDisplayName: { type: string }
        warehouseId: { type: [string, "null"], format: uuid }
        deliveryAddress: { type: [string, "null"], maxLength: 1000 }
        latitude:
          { type: [number, "null"], format: double, minimum: -90, maximum: 90 }
        longitude:
          { type: [number, "null"], format: double, minimum: -180, maximum: 180 }
        contactPhone:
          type: [string, "null"]
          maxLength: 16
          pattern: '^\+[1-9][0-9]{6,14}$'
          description: Canonical E.164 contact phone stored by logistics.
        comment: { type: [string, "null"], maxLength: 2000 }
        acceptableDeliveryDates:
          type: array
          maxItems: 31
          uniqueItems: true
          items: { type: string, format: date }
        unitCount: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        units:
          { type: array, items: { $ref: "#/components/schemas/OrderUnit" } }
        movements:
          type: array
          items: { $ref: "#/components/schemas/OrderMovement" }
        permissions: { $ref: "#/components/schemas/OrderPermissions" }
    OrderMovementCabin:
      type: object
      additionalProperties: false
      required: [rentalItemId, lineState]
      properties:
        rentalItemId: { type: string, format: uuid }
        lineState: { type: string }
    OrderMovement:
      type: object
      additionalProperties: false
      required:
        [
          documentId,
          documentType,
          state,
          scheduledDate,
          actualAt,
          rentalShipmentId,
          createdAt,
          updatedAt,
          cabins,
        ]
      properties:
        documentId: { type: string, format: uuid }
        documentType: { type: string, enum: [SHIPMENT, RETURN] }
        state: { type: string }
        scheduledDate:
          type: [string, "null"]
          format: date
          description: Null while an automatically created rental return has not yet been scheduled.
        actualAt:
          type: [string, "null"]
          format: date-time
          description: >-
            Logistics completion timestamp of the SHIPPED, ACCEPTED, or
            ESTIMATE_REQUESTED terminal branch; this is not an independently
            captured physical-arrival timestamp.
        rentalShipmentId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        cabins:
          type: array
          items: { $ref: "#/components/schemas/OrderMovementCabin" }
    OrderHistoryEvent:
      type: object
      additionalProperties: false
      required:
        [
          id,
          eventType,
          actorSubjectId,
          actorRole,
          orderId,
          subjectType,
          subjectId,
          previousValues,
          newValues,
          occurredAt,
        ]
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string }
        actorSubjectId: { type: string, format: uuid }
        actorRole: { type: string }
        orderId: { type: string, format: uuid }
        subjectType: { type: string }
        subjectId: { type: string }
        previousValues: { type: [object, "null"], additionalProperties: true }
        newValues: { type: [object, "null"], additionalProperties: true }
        occurredAt: { type: string, format: date-time }
    CreateRentalInquiryRequest:
      type: object
      additionalProperties: false
      required: [conversationId]
      properties:
        conversationId: { type: string, format: uuid }
        clientId: { type: string, format: uuid }
        newClient: { $ref: "#/components/schemas/NewClientInput" }
      oneOf:
        - required: [clientId]
          not: { required: [newClient] }
        - required: [newClient]
          not: { required: [clientId] }
    RentalInquiry:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          conversationId,
          client,
          managerId,
          managerDisplayName,
          managerRole,
          warehouseId,
          state,
          bookedOrderId,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        conversationId: { type: string, format: uuid }
        client: { $ref: "#/components/schemas/OrderClient" }
        managerId: { type: string, format: uuid }
        managerDisplayName: { type: string }
        managerRole: { type: string }
        warehouseId: { type: [string, "null"], format: uuid }
        state: { type: string, enum: [ACTIVE, BOOKED, ARCHIVED] }
        bookedOrderId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CabinFacetWarehouse:
      type: object
      additionalProperties: false
