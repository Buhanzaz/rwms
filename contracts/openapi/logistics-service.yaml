          client,
          managerId,
          managerDisplayName,
          createdBy,
          createdByDisplayName,
          warehouseId,
          deliveryAddress,
          latitude,
          longitude,
          contactPhone,
          comment,
          additionalContacts,
          desiredDeliveryWindows,
          unitCount,
          createdAt,
          updatedAt,
          units,
          movements,
          permissions,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
