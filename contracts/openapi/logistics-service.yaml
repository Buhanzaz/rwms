        slotVersion: { type: integer, format: int64, minimum: 0 }
        changeQuoteId: { type: string, format: uuid }
        changeQuoteVersion: { type: integer, format: int64, minimum: 0 }
        testPaymentRequested: { type: boolean, default: false }
    CreateCustomerBookingChangeQuoteRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, operation, slotId, slotVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        operation: { type: string, enum: [CANCEL, RESCHEDULE] }
        slotId: { type: [string, "null"], format: uuid }
        slotVersion: { type: [integer, "null"], format: int64, minimum: 0 }
      description: CANCEL requires both slot fields null; RESCHEDULE requires both populated.
    CustomerBookingChangeAlert:
      type: object
      additionalProperties: false
      required: [mutationId, version, bookingId, orderId, warehouseId, operation, occurredAt, previousDeliveryDate, newDeliveryDate, deliveryAddress, feeRubles, settlement, canOpenOrder]
      properties:
        mutationId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        bookingId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        operation: { type: string, enum: [CANCEL, RESCHEDULE] }
        occurredAt: { type: string, format: date-time }
        previousDeliveryDate: { type: string, format: date }
        newDeliveryDate: { type: [string, "null"], format: date }
        deliveryAddress: { type: string }
        feeRubles:
          type: [string, "null"]
          pattern: '^(0|[1-9][0-9]{0,18})$'
          description: Exact whole RUB through 9223372036854775807; null has no settlement meaning.
        settlement:
          type: [string, "null"]
          enum: [POLICY_UNCONFIGURED, PAYMENT_REQUIRED, NOT_REQUIRED, TEST_PAID, WAIVED, null]
        canOpenOrder: { type: boolean }
    PendingCustomerBookingChangeQuote:
      type: object
      additionalProperties: false
      required: [orderId, warehouseId, quote]
      properties:
        orderId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        quote: { $ref: "#/components/schemas/CustomerBookingChangeQuote" }
    CustomerBookingChangeQuote:
      type: object
      additionalProperties: false
      required: [quoteId, version, bookingId, bookingVersion, operation, oldSlotId, slotId, slotVersion, amountRubles, settlement, applicationState, testPaymentAvailable, supportPhone, expiresAt, noticeDays, deliveryDate, warehouseTimeZone, targetDeliveryDate, targetWindowStart, targetWindowEnd]
      properties:
        quoteId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        bookingId: { type: string, format: uuid }
        bookingVersion: { type: integer, format: int64, minimum: 0 }
        operation: { type: string, enum: [CANCEL, RESCHEDULE] }
        oldSlotId: { type: string, format: uuid }
        slotId: { type: [string, "null"], format: uuid }
        slotVersion: { type: [integer, "null"], format: int64, minimum: 0 }
        amountRubles:
          type: [string, "null"]
          pattern: '^(0|[1-9][0-9]{0,18})$'
          description: Exact whole RUB through 9223372036854775807; null means unknown, waiver returns zero.
        settlement:
          type: string
          enum: [POLICY_UNCONFIGURED, PAYMENT_REQUIRED, NOT_REQUIRED, TEST_PAID, WAIVED]
        applicationState: { type: string, enum: [OFFERED, APPLYING, APPLIED] }
        testPaymentAvailable: { type: boolean }
        supportPhone: { type: [string, "null"], pattern: '^\+[1-9][0-9]{7,14}$' }
        expiresAt: { type: string, format: date-time }
        noticeDays: { type: integer, minimum: 0 }
        deliveryDate: { type: string, format: date }
        warehouseTimeZone: { type: string }
        targetDeliveryDate: { type: [string, "null"], format: date }
        targetWindowStart: { type: [string, "null"], format: time }
        targetWindowEnd: { type: [string, "null"], format: time }
      description: Target date and window are immutable replacement slot facts, all null for CANCEL and all non-null for RESCHEDULE.
    CustomerBooking:
      type: object
      additionalProperties: false
      required:
        [bookingId, version, orderId, status, errorCode, inquiryId, slotId, warehouseId, deliveryAddress, deliveryDate, windowStart, windowEnd, cancellationFeeRubles, cabins]
      properties:
        bookingId: { type: [string, "null"], format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        orderId: { type: [string, "null"], format: uuid }
        status:
          type: string
          enum: [PENDING, COMPLETED, REJECTED, CANCELLATION_PENDING, CANCELLED]
        errorCode: { type: [string, "null"] }
        inquiryId: { type: string, format: uuid }
        slotId: { type: [string, "null"], format: uuid }
        warehouseId: { type: string, format: uuid }
        deliveryAddress: { type: [string, "null"], maxLength: 1000 }
        deliveryDate: { type: [string, "null"], format: date }
        windowStart: { type: [string, "null"], format: time }
        windowEnd: { type: [string, "null"], format: time }
        cancellationFeeRubles:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: Legacy booking field remains null; the exact operation-specific amount and settlement are authoritative only in CustomerBookingChangeQuote.
        cabins:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/CustomerBookingCabin" }
    CustomerShipmentMediaOwner:
      type: object
