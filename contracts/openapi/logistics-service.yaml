        [expectedVersion, chatSelectionHoldMinutes, manualBookingHoldMinutes, presentationHoldMinutes, draftReservationHoldMinutes]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        chatSelectionHoldMinutes: { type: integer, minimum: 1, maximum: 1440 }
        manualBookingHoldMinutes: { type: integer, minimum: 5, maximum: 1440 }
        presentationHoldMinutes: { type: integer, minimum: 5, maximum: 1440 }
        draftReservationHoldMinutes: { type: integer, minimum: 1440, maximum: 14400 }
    ManualBookingDraftHoldsRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, rentalItemIds]
      properties:
        warehouseId: { type: string, format: uuid }
        rentalItemIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    ManualBookingDraftHolds:
      type: object
      additionalProperties: false
