        attemptCount: { type: integer, minimum: 0 }
        recoveryVersion: { type: integer, format: int64, minimum: 1 }
        lastErrorCode:
          oneOf: [ { type: string, minLength: 1, maxLength: 96 }, { type: 'null' } ]
        recoveredBySubjectId: { type: string, format: uuid }
        recoveryReason: { type: string, minLength: 1, maxLength: 2000 }
        recoveredAt: { type: string, format: date-time }
    ApiProblem:
      type: object
      additionalProperties: true
      required: [status, code]
      properties:
        status: { type: integer }
        code: { type: string }
  responses:
    DriverBoardCard:
      description: Current task-board placement for one driver movement.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: "true" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DriverBoardCard" }
    DriverTask:
      description: Current logistics-owned driver task intent and effect checkpoints.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: "true" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DriverTask" }
    EquipmentMovementTask:
      description: Current source-reservation and worker-task state for one physical equipment movement.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: "true" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/EquipmentMovementTask" }
    Document:
      description: Current logistics document state.
      headers:
        ETag:
          required: true
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LogisticsDocument" }
    CreatedDocument:
      description: New DRAFT document, or the original successful create response.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: "true" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LogisticsDocument" }
    DocumentList:
      description: Visible documents.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: "#/components/schemas/LogisticsDocument" }
    OrderDetail:
      description: Current order state and authoritative active asset reservations.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: "true" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OrderDetail" }
    OrderClient:
      description: Current client detail, explicit create result, or its idempotent replay.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: "true" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OrderClient" }
    BadRequest:
      description: Invalid shape, missing idempotency key, or invalid expected version.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    Unauthorized:
      description: Missing or invalid Bearer JWT.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    Forbidden:
      description: Missing USER principal, scope, warehouse access, or required management level.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    NotFound:
      description: Document is absent or outside the caller's warehouse scope.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    Conflict:
      description: Stale version, changed idempotency replay, lease/hold/task conflict, or forbidden lifecycle transition.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    Unprocessable:
      description: Semantic request error such as an impossible contents delta or unsupported correction capability.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    DependencyUnavailable:
      description: An owning service required by the order operation is temporarily unavailable.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
