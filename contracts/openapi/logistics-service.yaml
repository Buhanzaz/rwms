        mediaId: { type: [string, "null"], format: uuid }
        mediaGeneration: { type: [integer, "null"], format: int64, minimum: 1 }
        contentType: { type: string, enum: [image/jpeg, image/webp] }
        contentPath:
          type: [string, "null"]
          maxLength: 4096
          pattern: ^/api/logistics/public/v1/contractor-route-shares/
        thumbnailPath:
          type: [string, "null"]
          maxLength: 4096
          pattern: ^/api/logistics/public/v1/contractor-route-shares/
