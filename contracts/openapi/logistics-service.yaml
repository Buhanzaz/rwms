          items: { $ref: "#/components/schemas/AdditionalContactInput" }
      allOf:
        - if:
            properties:
              clientType: { enum: [LEGAL_ENTITY] }
            required: [clientType]
          then:
            required: [contactPerson]
            properties:
              contactPerson: { type: string, minLength: 1, maxLength: 255 }
    CreateClientRequest:
      type: object
      additionalProperties: false
      required: [clientType, displayName, phone]
      properties:
        clientType: { $ref: "#/components/schemas/ClientType" }
        displayName: { type: string, minLength: 1, maxLength: 512 }
        phone:
          type: string
          minLength: 7
          maxLength: 32
          pattern: '^(?:\+|8)[0-9() .-]{6,31}$'
          description: Human-formatted phone normalized to canonical E.164 before storage.
        contactPerson: { type: [string, "null"], minLength: 1, maxLength: 255 }
        email: { type: [string, "null"], format: email, maxLength: 320 }
        comment: { type: [string, "null"], minLength: 1, maxLength: 2000 }
        source: { type: [string, "null"], minLength: 1, maxLength: 255 }
        additionalContacts:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AdditionalContactInput" }
      allOf:
        - if:
            properties:
              clientType: { enum: [LEGAL_ENTITY] }
            required: [clientType]
          then:
            required: [contactPerson]
            properties:
              contactPerson: { type: string, minLength: 1, maxLength: 255 }
    CreateOrderRequest:
      type: object
      additionalProperties: false
      properties:
        clientId: { type: string, format: uuid }
        newClient: { $ref: "#/components/schemas/NewClientInput" }
        contactPhone:
          type: [string, "null"]
          minLength: 7
          maxLength: 32
          pattern: '^(?:\+|8)[0-9() .-]{6,31}$'
          description: Human-formatted international or Russian trunk phone; normalized to canonical E.164 before storage.
        comment: { type: [string, "null"], minLength: 1, maxLength: 2000 }
      oneOf:
        - required: [clientId]
          not: { required: [newClient] }
        - required: [newClient]
          not: { required: [clientId] }
    UpdateOrderRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, clientId]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        clientId: { type: string, format: uuid }
        contactPhone:
          type: [string, "null"]
          minLength: 7
          maxLength: 32
          pattern: '^(?:\+|8)[0-9() .-]{6,31}$'
          description: Human-formatted international or Russian trunk phone; normalized to canonical E.164 before storage.
        comment: { type: [string, "null"], minLength: 1, maxLength: 2000 }
    ReplaceOrderUnitRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, replacementRentalItemId, reason]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        replacementRentalItemId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    OrderDesiredEquipmentInput:
      type: object
      additionalProperties: false
      required: [equipmentId, quantity]
      properties:
        equipmentId: { type: string, format: uuid }
        quantity: { type: integer, format: int64, minimum: 1 }
    SetOrderUnitDesiredEquipmentRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, requirements]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        requirements:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/OrderDesiredEquipmentInput" }
    OrderRentalTermExtensionInput:
      type: object
      additionalProperties: false
      required: [unitId, additionalMonths]
      properties:
        unitId: { type: string, format: uuid }
        additionalMonths: { type: integer, format: int64, minimum: 1 }
    ExtendOrderRentalTermsRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, terms]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        terms:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { $ref: "#/components/schemas/OrderRentalTermExtensionInput" }
    CreateOrderRentalShipmentRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, driverSnapshot, scheduledDate, unitIds]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        driverSnapshot: { type: string, minLength: 1, maxLength: 512 }
        driverWorkerId: { type: [string, "null"], format: uuid }
        warehouseDriverPool:
          type: boolean
          default: false
          description: Explicitly publishes a future shipment for qualified warehouse drivers; driverWorkerId must be null.
        scheduledDate: { type: string, format: date }
        unitIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    OrderClient:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          type,
          displayName,
          phone,
          contactPerson,
          email,
          responsibleManagerId,
          responsibleManagerDisplayName,
          comment,
          source,
          additionalContacts,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        type: { $ref: "#/components/schemas/ClientType" }
        displayName: { type: string }
        phone:
          description: Null only for historical clients created before phone became mandatory.
          type: [string, "null"]
          maxLength: 16
          pattern: '^\+[1-9][0-9]{6,14}$'
        contactPerson: { type: [string, "null"], maxLength: 255 }
        email: { type: [string, "null"], format: email, maxLength: 320 }
        responsibleManagerId: { type: string, format: uuid }
        responsibleManagerDisplayName:
          description: >-
            Authenticated manager display-name snapshot. Null for historical
            clients whose creator subject was backfilled without inventing a name.
          type: [string, "null"]
          maxLength: 255
        comment: { type: [string, "null"], maxLength: 2000 }
        source: { type: [string, "null"], maxLength: 255 }
        additionalContacts:
          type: array
          items: { $ref: "#/components/schemas/AdditionalContact" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ClientPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/OrderClient" }
        page: { type: integer, format: int64, minimum: 0 }
        size: { type: integer, format: int64, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int64, minimum: 0 }
    OrderSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          number,
          status,
          client,
          managerId,
          managerDisplayName,
          createdBy,
          createdByDisplayName,
          warehouseId,
          deliveryAddress,
          latitude,
          longitude,
          contactPhone,
          comment,
          additionalContacts,
          desiredDeliveryWindows,
          unitCount,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        number: { type: string }
        status:
          { type: string, enum: [DRAFT, SAVED, FULFILLED, CLOSED, CANCELLED] }
        client: { $ref: "#/components/schemas/OrderClient" }
        managerId: { type: string, format: uuid }
        managerDisplayName: { type: string }
        createdBy: { type: string, format: uuid }
        createdByDisplayName: { type: string }
        warehouseId: { type: [string, "null"], format: uuid }
        deliveryAddress: { type: [string, "null"], maxLength: 1000 }
        latitude:
          { type: [number, "null"], format: double, minimum: -90, maximum: 90 }
        longitude:
          { type: [number, "null"], format: double, minimum: -180, maximum: 180 }
        contactPhone:
          type: [string, "null"]
          maxLength: 16
          pattern: '^\+[1-9][0-9]{6,14}$'
          description: Canonical E.164 contact phone stored by logistics.
        comment: { type: [string, "null"], maxLength: 2000 }
        additionalContacts:
          type: array
          items: { $ref: "#/components/schemas/AdditionalContact" }
        desiredDeliveryWindows:
          type: array
          description: Date-only client receiving preferences, separate from the logistics-assigned date.
          items: { $ref: "#/components/schemas/DesiredDeliveryWindow" }
        unitCount: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/OrderSummary" }
        page: { type: integer, format: int64, minimum: 0 }
        size: { type: integer, format: int64, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int64, minimum: 0 }
    OrderEquipmentContent:
      type: object
      additionalProperties: false
      required:
        [equipmentId, equipmentName, quantity, locationKind]
      properties:
        equipmentId: { type: string, format: uuid }
        equipmentName: { type: [string, "null"] }
        quantity: { type: integer, format: int64, minimum: 0 }
        locationKind: { type: string }
    OrderDesiredEquipment:
      type: object
      additionalProperties: false
      required: [equipmentId, equipmentName, quantity, reservationState]
      properties:
        equipmentId: { type: string, format: uuid }
        equipmentName: { type: string, minLength: 1, maxLength: 512 }
        quantity: { type: integer, format: int64, minimum: 1 }
        reservationState:
          type: string
          const: ACTIVE
          description: Derived from the active order-wide asset reservation; no duplicate local status is stored.
    OrderRentalTerm:
      type: object
      additionalProperties: false
      required: [rentalMonths, shipmentDate, returnDate]
      properties:
        rentalMonths: { type: integer, format: int64, minimum: 1 }
        shipmentDate: { type: [string, "null"], format: date }
        returnDate: { type: [string, "null"], format: date }
    OrderRentalItem:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          warehouseId,
          number,
          status,
          rentalType,
          dimensions,
          finishing,
          category,
          characteristics,
          linoleum,
          tags,
          contents,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        number: { type: string }
        status: { type: string }
        rentalType: { type: [string, "null"] }
        dimensions: { type: [string, "null"] }
        finishing: { type: [string, "null"] }
        category: { type: [string, "null"] }
        characteristics: { type: [string, "null"] }
        linoleum: { type: [boolean, "null"] }
        tags: { type: array, items: { type: string } }
        contents:
          type: array
          items: { $ref: "#/components/schemas/OrderEquipmentContent" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderUnit:
      type: object
      additionalProperties: false
      required: [reservationId, added, reservationState, unit, desiredContents, rentalTerm]
      properties:
        reservationId: { type: [string, "null"], format: uuid }
        added: { type: boolean }
        reservationState:
          type: [string, "null"]
          description: ACTIVE for a cabin currently reserved by this order; null for an unselected candidate.
        unit: { $ref: "#/components/schemas/OrderRentalItem" }
        desiredContents:
          type: array
          items: { $ref: "#/components/schemas/OrderDesiredEquipment" }
        rentalTerm:
          anyOf:
            - { $ref: "#/components/schemas/OrderRentalTerm" }
            - { type: "null" }
    OrderUnitPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          { type: array, items: { $ref: "#/components/schemas/OrderUnit" } }
        page: { type: integer, format: int64, minimum: 0 }
        size: { type: integer, format: int64, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int64, minimum: 0 }
    OrderPermissions:
      type: object
      additionalProperties: false
      required: [canEdit, canReplaceUnits, canExtendRentalTerms, canViewOtherManagers]
      properties:
        canEdit: { type: boolean }
        canReplaceUnits:
          type: boolean
          description: >-
            True only for an authorized warehouse manager while this DRAFT or SAVED order has a
            fixed warehouse and every shipment remains before physical departure. It is independent
            from ordinary booking editability and the command still applies a per-unit start fence.
        canExtendRentalTerms:
          type: boolean
          description: >-
            True when the current actor may submit the existing extension command for this SAVED or
            FULFILLED order. The command still requires each selected cabin to have shipped.
        canViewOtherManagers: { type: boolean }
    OrderDetail:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          number,
          status,
          client,
          managerId,
          managerDisplayName,
          createdBy,
          createdByDisplayName,
          warehouseId,
          deliveryAddress,
          latitude,
          longitude,
          contactPhone,
          comment,
          additionalContacts,
          desiredDeliveryWindows,
          unitCount,
          createdAt,
          updatedAt,
          units,
          movements,
          permissions,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        number: { type: string }
        status:
          { type: string, enum: [DRAFT, SAVED, FULFILLED, CLOSED, CANCELLED] }
        client: { $ref: "#/components/schemas/OrderClient" }
        managerId: { type: string, format: uuid }
        managerDisplayName: { type: string }
        createdBy: { type: string, format: uuid }
        createdByDisplayName: { type: string }
        warehouseId: { type: [string, "null"], format: uuid }
        deliveryAddress: { type: [string, "null"], maxLength: 1000 }
        latitude:
          { type: [number, "null"], format: double, minimum: -90, maximum: 90 }
        longitude:
          { type: [number, "null"], format: double, minimum: -180, maximum: 180 }
        contactPhone:
          type: [string, "null"]
          maxLength: 16
          pattern: '^\+[1-9][0-9]{6,14}$'
          description: Canonical E.164 contact phone stored by logistics.
        comment: { type: [string, "null"], maxLength: 2000 }
        additionalContacts:
          type: array
          items: { $ref: "#/components/schemas/AdditionalContact" }
        desiredDeliveryWindows:
          type: array
          items: { $ref: "#/components/schemas/DesiredDeliveryWindow" }
        unitCount: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        units:
          { type: array, items: { $ref: "#/components/schemas/OrderUnit" } }
        movements:
          type: array
          items: { $ref: "#/components/schemas/OrderMovement" }
        permissions: { $ref: "#/components/schemas/OrderPermissions" }
    OrderMovementCabin:
      type: object
      additionalProperties: false
      required: [rentalItemId, lineState]
      properties:
        rentalItemId: { type: string, format: uuid }
        lineState: { type: string }
    OrderMovement:
      type: object
      additionalProperties: false
      required:
        [
          documentId,
          documentType,
          state,
          scheduledDate,
          actualAt,
          rentalShipmentId,
          createdAt,
          updatedAt,
          cabins,
        ]
      properties:
        documentId: { type: string, format: uuid }
        documentType: { type: string, enum: [SHIPMENT, RETURN] }
        state: { type: string }
        scheduledDate:
          type: [string, "null"]
          format: date
          description: Null while an automatically created rental return has not yet been scheduled.
        actualAt:
          type: [string, "null"]
          format: date-time
          description: >-
            Logistics completion timestamp of the SHIPPED, ACCEPTED, or
            ESTIMATE_REQUESTED terminal branch; this is not an independently
            captured physical-arrival timestamp.
        rentalShipmentId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        cabins:
          type: array
          items: { $ref: "#/components/schemas/OrderMovementCabin" }
    OrderHistoryEvent:
      type: object
      additionalProperties: false
      required:
        [
          id,
          eventType,
          actorSubjectId,
          actorRole,
          orderId,
          subjectType,
          subjectId,
          previousValues,
          newValues,
          occurredAt,
        ]
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string }
        actorSubjectId: { type: string, format: uuid }
        actorRole: { type: string }
        orderId: { type: string, format: uuid }
        subjectType: { type: string }
        subjectId: { type: string }
        previousValues: { type: [object, "null"], additionalProperties: true }
        newValues: { type: [object, "null"], additionalProperties: true }
        occurredAt: { type: string, format: date-time }
    CreateRentalInquiryRequest:
      type: object
      additionalProperties: false
      properties:
        conversationId:
          type: [string, "null"]
          format: uuid
          description: Assistant conversation identity; omitted for ordinary manual booking.
        clientId: { type: string, format: uuid }
        newClient: { $ref: "#/components/schemas/NewClientInput" }
        rentalOrderId:
          type: [string, "null"]
          format: uuid
          description: >-
            Existing same-client DRAFT or SAVED order. NORMAL additions require
            current order editability; REPLACEMENT uses its dedicated pre-start
            trip fence even after an actual date was assigned.
      oneOf:
        - required: [clientId]
          not: { required: [newClient] }
        - required: [newClient]
          not: { required: [clientId] }
      anyOf:
        - required: [conversationId]
          properties:
            conversationId: { type: string, format: uuid }
        - required: [clientId, rentalOrderId]
    RentalInquiry:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          conversationId,
          client,
          managerId,
          managerDisplayName,
          managerRole,
          rentalOrderId,
          warehouseId,
          state,
          bookedOrderId,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        conversationId: { type: [string, "null"], format: uuid }
        client: { $ref: "#/components/schemas/OrderClient" }
        managerId: { type: string, format: uuid }
        managerDisplayName: { type: string }
        managerRole: { type: string }
        rentalOrderId: { type: [string, "null"], format: uuid }
        warehouseId: { type: [string, "null"], format: uuid }
        state: { type: string, enum: [ACTIVE, BOOKED, ARCHIVED] }
        bookedOrderId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CabinFacetWarehouse:
      type: object
      additionalProperties: false
      required:
        [
          warehouseId,
          name,
          city,
          cabinTypes,
          finishes,
          dimensions,
          categories,
          characteristics,
          typeDimensions,
        ]
      properties:
        warehouseId: { type: string, format: uuid }
        name: { type: string }
        city: { type: string }
        cabinTypes:
          type: array
          items: { type: string }
        finishes:
          type: array
          items: { type: string }
        dimensions:
          type: array
          items: { type: string }
        categories:
          type: array
          items: { type: string }
        characteristics:
          type: array
          items: { type: string }
        typeDimensions:
          type: array
          items: { $ref: "#/components/schemas/CabinTypeDimensionRelation" }
    CabinTypeDimensionRelation:
      type: object
      additionalProperties: false
      required: [cabinType, dimensions]
      properties:
        cabinType: { type: string }
        dimensions:
          type: array
          items: { type: string }
    CabinFacets:
      type: object
      additionalProperties: false
      required: [warehouses]
      properties:
        warehouses:
          type: array
          items: { $ref: "#/components/schemas/CabinFacetWarehouse" }
    CabinSearchGroup:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        cabinType: { type: [string, "null"], maxLength: 255 }
        finish: { type: [string, "null"], maxLength: 255 }
        dimensions: { type: [string, "null"], maxLength: 255 }
        category: { type: [string, "null"], maxLength: 255 }
        characteristics: { type: [string, "null"], maxLength: 2000 }
        linoleum: { type: [boolean, "null"] }
        quantity: { type: integer, minimum: 1, maximum: 30 }
    CabinSearchRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, groups]
      properties:
        warehouseId: { type: string, format: uuid }
        resultMode:
          description: >-
            REPLACE is the default and atomically releases previous inquiry
            holds. APPEND retains them and must be requested explicitly.
          type: string
          enum: [APPEND, REPLACE]
          default: REPLACE
        groups:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/CabinSearchGroup" }
    AvailableCabin:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          warehouseId,
          status,
          number,
          rentalType,
          dimensions,
          finishing,
          category,
          characteristics,
          linoleum,
          passport,
          tags,
          contents,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        status: { type: string }
        number: { type: string }
        rentalType: { type: [string, "null"] }
        dimensions: { type: [string, "null"] }
        finishing: { type: [string, "null"] }
        category: { type: [string, "null"] }
        characteristics: { type: [string, "null"] }
        linoleum: { type: [boolean, "null"] }
        passport: { type: object, additionalProperties: true }
        tags:
          type: array
          items: { type: string }
        contents:
          type: array
          description: Current physical furniture inside this held cabin; global availability remains separate.
          items: { $ref: "#/components/schemas/OrderEquipmentContent" }
        updatedAt: { type: string, format: date-time }
    CabinSearchGroupResult:
      type: object
      additionalProperties: false
      required: [group, cabins]
      properties:
        group: { $ref: "#/components/schemas/CabinSearchGroup" }
        cabins:
          type: array
          items: { $ref: "#/components/schemas/AvailableCabin" }
    CabinSearchResponse:
      type: object
      additionalProperties: false
      required: [warehouseId, expiresAt, groups]
      properties:
        warehouseId: { type: string, format: uuid }
        expiresAt:
          type: string
          format: date-time
          description: Expiry of the manager-only short reservation created for this chat result.
        groups:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/CabinSearchGroupResult" }
    ReplaceCabinSelectionRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, rentalItemIds]
      properties:
        warehouseId: { type: string, format: uuid }
        rentalItemIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    CabinSelectionResponse:
      type: object
      additionalProperties: false
      required: [inquiryId, warehouseId, expiresAt, rentalItemIds, items]
      properties:
        inquiryId: { type: string, format: uuid }
        warehouseId:
          description: Null only for an empty selection before the inquiry chose a warehouse.
          type: [string, "null"]
          format: uuid
        expiresAt:
          description: Null when the authoritative selection is empty and released.
          type: [string, "null"]
          format: date-time
        rentalItemIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        items:
          type: array
          maxItems: 100
          items:
            allOf:
              - $ref: "#/components/schemas/AvailableCabin"
              - type: object
                description: A selected cabin is always currently FREE.
                properties:
                  status: { type: string, const: FREE }
    CabinCatalogPage:
      type: object
      additionalProperties: false
      required: [warehouseId, content, page, size, totalElements, totalPages]
      properties:
        warehouseId: { type: string, format: uuid }
        content:
          type: array
          items: { $ref: "#/components/schemas/AvailableCabin" }
        page: { type: integer, format: int64, minimum: 0 }
        size: { type: integer, format: int64, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int64, minimum: 0 }
    CabinAvailabilityRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, rentalItemIds]
      properties:
        warehouseId: { type: string, format: uuid }
        rentalItemIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    CabinAvailabilityItem:
      type: object
      additionalProperties: false
      required: [rentalItemId, available, reason]
      properties:
        rentalItemId: { type: string, format: uuid }
        available: { type: boolean }
        reason: { type: [string, "null"] }
    CabinAvailabilityResponse:
      type: object
      additionalProperties: false
      required: [warehouseId, items]
      properties:
        warehouseId: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: "#/components/schemas/CabinAvailabilityItem" }
    PresentationGroupInput:
      type: object
      additionalProperties: false
      required: [key, label, rentalItemIds]
      properties:
        key: { type: string, minLength: 1, maxLength: 128 }
        label: { type: string, minLength: 1, maxLength: 255 }
        rentalItemIds:
          type: array
          minItems: 1
          maxItems: 30
          uniqueItems: true
          items: { type: string, format: uuid }
    PublishClientPresentationRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, groups]
      properties:
        warehouseId: { type: string, format: uuid }
        manualBookingDraftId:
          type: [string, "null"]
          format: uuid
          description: >-
            Optional manager-owned manual draft whose selected live holds are
            atomically transferred to this client presentation.
        mode:
          type: [string, "null"]
          enum: [NORMAL, REPLACEMENT, null]
          description: Omitted NORMAL flow or same-order client replacement.
        replacementUnitIds:
          type: [array, "null"]
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
          description: Ordered old order-cabin IDs; required only in REPLACEMENT mode.
        groups:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: "#/components/schemas/PresentationGroupInput" }
    PresentationPhoto:
      type: object
      additionalProperties: false
      required:
        [
          mediaId,
          generation,
          sortOrder,
          availableVariants,
          thumbnailUrl,
          contentUrl,
        ]
      properties:
        mediaId: { type: string, format: uuid }
        generation: { type: integer, format: int64, minimum: 1 }
        sortOrder: { type: integer, minimum: 0 }
        availableVariants:
          type: array
          items: { type: string }
        thumbnailUrl: { type: string }
        contentUrl: { type: string }
    PresentationCabin:
      type: object
      additionalProperties: false
      required:
        [
          id,
          number,
          rentalType,
          dimensions,
          finishing,
          category,
          characteristics,
          linoleum,
          passport,
          tags,
          currentContents,
          photos,
        ]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        rentalType: { type: [string, "null"] }
        dimensions: { type: [string, "null"] }
        finishing: { type: [string, "null"] }
        category: { type: [string, "null"] }
        characteristics: { type: [string, "null"] }
        linoleum: { type: [boolean, "null"] }
        passport: { type: object, additionalProperties: true }
        tags:
          type: array
          items: { type: string }
        currentContents:
          type: array
          description: Physical furniture currently inside this held cabin.
          items: { $ref: "#/components/schemas/OrderEquipmentContent" }
        photos:
          type: array
          items: { $ref: "#/components/schemas/PresentationPhoto" }
    PresentationGroup:
      type: object
      additionalProperties: false
      required: [key, label, cabins]
      properties:
        key: { type: string }
        label: { type: string }
        cabins:
          type: array
          items: { $ref: "#/components/schemas/PresentationCabin" }
    PresentationEquipmentAvailability:
      type: object
      additionalProperties: false
      required: [equipmentId, equipmentName, availableQuantity, maximumPerCabin]
      properties:
        equipmentId: { type: string, format: uuid }
        equipmentName: { type: string, minLength: 1, maxLength: 512 }
        availableQuantity: { type: integer, format: int64, minimum: 0 }
        maximumPerCabin: { type: [integer, "null"], minimum: 1 }
    CreateCabinPhotoPresentationRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, expectedRentalItemVersion]
      properties:
        warehouseId: { type: string, format: uuid }
        expectedRentalItemVersion:
          type: integer
          format: int64
          minimum: 0
          description: Current asset-service version shown on the cabin card.
    CabinPhotoPresentation:
      type: object
      additionalProperties: false
      required: [id, version, cabinId, cabinNumber, photoCount, createdAt, publicPath]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        cabinId: { type: string, format: uuid }
        cabinNumber: { type: string, minLength: 1, maxLength: 128 }
        photoCount: { type: integer, minimum: 1, maximum: 100 }
        createdAt: { type: string, format: date-time }
        publicPath:
          type: string
          minLength: 1
          maxLength: 512
          description: Same-origin panel path `/photos/{signed-token}`.
    CabinPhotoPresentationPhoto:
      type: object
      additionalProperties: false
      required: [mediaId, generation, sortOrder, thumbnailUrl, contentUrl]
      properties:
        mediaId: { type: string, format: uuid }
        generation: { type: integer, format: int64, minimum: 1 }
        sortOrder: { type: integer, minimum: 0 }
        thumbnailUrl:
          type: string
          minLength: 1
          maxLength: 1024
          description: Presentation-scoped same-origin SMALL image path.
        contentUrl:
          type: string
          minLength: 1
          maxLength: 1024
          description: Presentation-scoped same-origin LARGE image path, or SMALL when LARGE was unavailable at snapshot creation.
    PublicCabinPhotoPresentation:
      type: object
      additionalProperties: false
      required:
        [id, cabinNumber, dimensions, finishing, category, characteristics, linoleum, createdAt, photos]
      properties:
        id: { type: string, format: uuid }
        cabinNumber: { type: string, minLength: 1, maxLength: 128 }
        dimensions: { type: [string, "null"], minLength: 1, maxLength: 255 }
        finishing: { type: [string, "null"], minLength: 1, maxLength: 255 }
        category: { type: [string, "null"], minLength: 1, maxLength: 255 }
        characteristics:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 255 }
        linoleum: { type: [boolean, "null"] }
        createdAt: { type: string, format: date-time }
        photos:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/CabinPhotoPresentationPhoto" }
    ClientPresentation:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          revision,
          inquiryId,
          warehouseId,
          state,
          expiresAt,
          viewUntil,
          canConfirm,
          publicPath,
          bookedOrderId,
          mode,
          replacementUnitIds,
          requiredSelectionCount,
          requiresDesiredDeliveryWindows,
          desiredDeliveryWindows,
          equipmentAvailability,
          groups,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        revision: { type: integer, format: int64, minimum: 1 }
        inquiryId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        state: { type: string, enum: [ACTIVE, BOOKING_PENDING, BOOKED, REVOKED] }
        expiresAt: { type: string, format: date-time }
        viewUntil: { type: string, format: date-time }
        canConfirm: { type: boolean }
        publicPath: { type: string }
        bookedOrderId: { type: [string, "null"], format: uuid }
        mode: { type: string, enum: [NORMAL, REPLACEMENT] }
        replacementUnitIds:
          type: array
          items: { type: string, format: uuid }
        requiredSelectionCount:
          type: [integer, "null"]
          minimum: 1
          description: Exact selection cardinality for REPLACEMENT; null for NORMAL.
        requiresDesiredDeliveryWindows:
          type: boolean
          description: True for NORMAL presentations, which collect one to four requestable client receiving dates before confirmation; false for REPLACEMENT.
        desiredDeliveryWindows:
          type: array
          description: Empty for NORMAL because the client supplies one to four requestable dates at confirmation; REPLACEMENT exposes existing date-only order preferences read-only.
          items: { $ref: "#/components/schemas/DesiredDeliveryWindow" }
        equipmentAvailability:
          type: array
          items: { $ref: "#/components/schemas/PresentationEquipmentAvailability" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/PresentationGroup" }
    RentalSettings:
      type: object
      additionalProperties: false
      required:
        [
          version,
          chatSelectionHoldMinutes,
          manualBookingHoldMinutes,
          presentationHoldMinutes,
          draftReservationHoldMinutes,
          updatedBy,
          updatedAt,
        ]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        chatSelectionHoldMinutes: { type: integer, minimum: 1, maximum: 1440 }
        manualBookingHoldMinutes: { type: integer, minimum: 5, maximum: 1440 }
        presentationHoldMinutes: { type: integer, minimum: 5, maximum: 1440 }
        draftReservationHoldMinutes: { type: integer, minimum: 1440, maximum: 14400 }
        updatedBy: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }
    ShipmentTaskSettings:
      type: object
      additionalProperties: false
      required: [warehouseId, version, maxCabinsPerShipmentTask, updatedBy, updatedAt]
      properties:
        warehouseId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        maxCabinsPerShipmentTask: { type: integer, minimum: 1, maximum: 100 }
        updatedBy: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }
    UpdateShipmentTaskSettingsRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, maxCabinsPerShipmentTask]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        maxCabinsPerShipmentTask: { type: integer, minimum: 1, maximum: 100 }
    UpdateRentalSettingsRequest:
      type: object
      additionalProperties: false
      required:
        [expectedVersion, chatSelectionHoldMinutes, manualBookingHoldMinutes, presentationHoldMinutes, draftReservationHoldMinutes]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        chatSelectionHoldMinutes: { type: integer, minimum: 1, maximum: 1440 }
        manualBookingHoldMinutes: { type: integer, minimum: 5, maximum: 1440 }
        presentationHoldMinutes: { type: integer, minimum: 5, maximum: 1440 }
        draftReservationHoldMinutes: { type: integer, minimum: 1440, maximum: 14400 }
    ManualBookingDraftHoldsRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, rentalItemIds]
      properties:
        warehouseId: { type: string, format: uuid }
        rentalItemIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    ManualBookingDraftHolds:
      type: object
      additionalProperties: false
      required: [draftId, warehouseId, expiresAt, rentalItemIds]
      properties:
        draftId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        expiresAt: { type: [string, "null"], format: date-time }
        rentalItemIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    ConfirmClientPresentationRequest:
      type: object
      additionalProperties: false
      required: [selections]
      properties:
        selections:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/PresentationCabinSelectionInput" }
        desiredDeliveryWindows:
          type: [array, "null"]
          description: Required only for NORMAL. It contains one to four distinct dates selected from requestableDeliveryDates; it must be absent for REPLACEMENT.
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: { $ref: "#/components/schemas/DesiredDeliveryWindowInput" }
        rentalMonths:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: Required only for NORMAL and applied to every cabin selected in this presentation; it must be absent for REPLACEMENT.
        deliveryAddress:
          type: [string, "null"]
          minLength: 1
          maxLength: 1000
          description: Required only for NORMAL and written to the target order after hold conversion; it must be absent for REPLACEMENT.
        latitude:
          type: [number, "null"]
          format: double
          minimum: -90
          maximum: 90
          description: Optional only with longitude for NORMAL; it must be absent for REPLACEMENT.
        longitude:
          type: [number, "null"]
          format: double
          minimum: -180
          maximum: 180
          description: Optional only with latitude for NORMAL; it must be absent for REPLACEMENT.
        additionalContacts:
          type: [array, "null"]
          description: Optional order-owned contacts for NORMAL, normalized to an empty list when absent; it must be absent for REPLACEMENT.
          items: { $ref: "#/components/schemas/AdditionalContactInput" }
      allOf:
        - if:
            required: [latitude]
          then:
            required: [longitude]
        - if:
            required: [longitude]
          then:
            required: [latitude]
    PresentationEquipmentSelectionInput:
      type: object
      additionalProperties: false
      required: [equipmentId, quantity]
      properties:
        equipmentId: { type: string, format: uuid }
        quantity: { type: integer, format: int64, minimum: 1 }
    PresentationCabinSelectionInput:
      type: object
      additionalProperties: false
      required: [rentalItemId, equipment]
      properties:
        rentalItemId: { type: string, format: uuid }
        equipment:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/PresentationEquipmentSelectionInput" }
    PublicClientPresentation:
      type: object
      additionalProperties: false
      required:
        [
          id,
          revision,
          state,
          expiresAt,
          viewUntil,
          viewOnly,
          mode,
          requiredSelectionCount,
          requiresDesiredDeliveryWindows,
          requestableDeliveryDates,
          desiredDeliveryWindows,
          equipmentAvailability,
          groups,
          bookedOrderId,
        ]
      properties:
        id: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
        state: { type: string, enum: [ACTIVE, BOOKING_PENDING, BOOKED, REVOKED] }
        expiresAt: { type: string, format: date-time }
        viewUntil: { type: string, format: date-time }
        viewOnly: { type: boolean }
        mode: { type: string, enum: [NORMAL, REPLACEMENT] }
        requiredSelectionCount:
          type: [integer, "null"]
          minimum: 1
        requiresDesiredDeliveryWindows:
          type: boolean
          description: True for NORMAL presentations, which collect one to four requestable client receiving dates; false for REPLACEMENT.
        requestableDeliveryDates:
          type: array
          uniqueItems: true
          description: For NORMAL, the four warehouse-local dates from day +2 through day +5; empty for REPLACEMENT. These dates are requestable preferences, not a promise that capacity has already been reserved.
          items: { type: string, format: date }
        desiredDeliveryWindows:
          type: array
          description: Empty for NORMAL; existing date-only order preferences are read-only for REPLACEMENT.
          items: { $ref: "#/components/schemas/DesiredDeliveryWindow" }
        equipmentAvailability:
          type: array
          items: { $ref: "#/components/schemas/PresentationEquipmentAvailability" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/PresentationGroup" }
        bookedOrderId: { type: [string, "null"], format: uuid }
    PresentationBooking:
      type: object
      additionalProperties: false
      required: [bookingId, state, orderId, statusPath, errorCode]
      properties:
        bookingId: { type: string, format: uuid }
        state: { type: string, enum: [PENDING, COMPLETED, REJECTED] }
        orderId: { type: [string, "null"], format: uuid }
        statusPath: { type: string }
        errorCode: { type: [string, "null"] }
    RentalBookingAlert:
      type: object
      additionalProperties: false
      required: [bookingId, version, inquiryId, orderId, client, confirmedAt, cabins]
      properties:
        bookingId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        inquiryId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        client: { $ref: "#/components/schemas/OrderClient" }
        confirmedAt: { type: string, format: date-time }
        cabins:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/RentalBookingAlertCabin" }
    RentalBookingAlertCabin:
      type: object
      additionalProperties: false
      required: [id, number, rentalType, dimensions, finishing, category]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        rentalType: { type: [string, "null"] }
        dimensions: { type: [string, "null"] }
        finishing: { type: [string, "null"] }
        category: { type: [string, "null"] }
    RentalBookingAlertAction:
      type: string
      enum: [CONTINUE, KEEP_DRAFT]
    RentalBookingAlertActionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, action]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        action: { $ref: "#/components/schemas/RentalBookingAlertAction" }
    WarehouseOperationMarkRecoveryRequest:
      type: object
      additionalProperties: false
      required: [expectedRecoveryVersion, reason]
      properties:
        expectedRecoveryVersion: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    WarehouseOperationMarkRecoveryResponse:
      type: object
      additionalProperties: false
      required:
        - warehouseId
        - operationId
        - state
        - attemptCount
        - recoveryVersion
        - lastErrorCode
        - recoveredBySubjectId
        - recoveryReason
        - recoveredAt
      properties:
        warehouseId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        state: { type: string, enum: [PENDING, IN_FLIGHT, RETRY_PENDING, CONFIRMED, QUARANTINED] }
        attemptCount: { type: integer, minimum: 0 }
        recoveryVersion: { type: integer, format: int64, minimum: 1 }
        lastErrorCode:
          oneOf: [ { type: string, minLength: 1, maxLength: 96 }, { type: 'null' } ]
        recoveredBySubjectId: { type: string, format: uuid }
        recoveryReason: { type: string, minLength: 1, maxLength: 2000 }
        recoveredAt: { type: string, format: date-time }
    ApiProblem:
      type: object
      additionalProperties: true
      required: [status, code]
      properties:
        status: { type: integer }
        code: { type: string }
  responses:
    DriverBoardCard:
      description: Current task-board placement for one driver movement.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: "true" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DriverBoardCard" }
    DriverTask:
      description: Current logistics-owned driver task intent and effect checkpoints.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: "true" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DriverTask" }
    EquipmentMovementTask:
      description: Current source-reservation and worker-task state for one physical equipment movement.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: "true" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/EquipmentMovementTask" }
    Document:
      description: Current logistics document state.
      headers:
        ETag:
          required: true
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LogisticsDocument" }
    CreatedDocument:
      description: New document, or the original successful create response. A historical rental import may already be advancing its durable effects.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: "true" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LogisticsDocument" }
    DocumentList:
      description: Visible documents.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: "#/components/schemas/LogisticsDocument" }
    OrderDetail:
      description: Current order state and authoritative active asset reservations.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: "true" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OrderDetail" }
    OrderClient:
      description: Current client detail, explicit create result, or its idempotent replay.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: "true" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OrderClient" }
    BadRequest:
      description: Invalid shape, missing idempotency key, or invalid expected version.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    Unauthorized:
      description: Missing or invalid Bearer JWT.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    Forbidden:
      description: Missing USER principal, scope, warehouse access, or required management level.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    NotFound:
      description: Document is absent or outside the caller's warehouse scope.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    Conflict:
      description: Stale version, changed idempotency replay, lease/hold/task conflict, or forbidden lifecycle transition.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    Unprocessable:
      description: Semantic request error such as an impossible contents delta or unsupported correction capability.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    DependencyUnavailable:
      description: An owning service required by the order operation is temporarily unavailable.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
