        latitude:
          { type: [number, "null"], format: double, minimum: -90, maximum: 90 }
        longitude:
          { type: [number, "null"], format: double, minimum: -180, maximum: 180 }
        contactPhone:
          type: [string, "null"]
          minLength: 7
          maxLength: 32
          pattern: '^(?:\+|8)[0-9() .-]{6,31}$'
          description: Human-formatted international or Russian trunk phone; normalized to canonical E.164 before storage.
