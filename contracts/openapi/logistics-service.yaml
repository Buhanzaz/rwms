openapi: 3.1.0
info:
  title: RWMS Logistics Service API
  version: 1.0.0
  description: >-
    Canonical API for rental orders, return, shipment, transfer, driver-task,
    and private route-planning integration flows.
    Public operations require a locally validated USER Bearer JWT, the
    matching rwms scope, and warehouse access. The rental client/order subset also
    accepts only the dedicated rwms-rental-manager-web/android credential with
    RENTAL_MANAGER, rentalAccess=true and exactly rental.manage as its application
    scope; operational document endpoints remain on rwms scopes. Every retriable
    mutation uses a subject-bound Idempotency-Key; mutable transitions also require
    the current document version.
servers:
  - url: /
security:
  - bearerJwt: []
paths:
  /api/logistics/v1/returns:
    get:
      operationId: listReturns
      description: >-
        Lists visible return documents. scheduledDate selects one exact warehouse-local business
        day; omission is retained only for bounded relationship lookups. Requires rwms.read and VIEW
        at the document warehouse. Optional assetId selects documents containing that cabin before
        pagination, including completed and cancelled history independently of its current rental.
      parameters:
        - $ref: "#/components/parameters/WarehouseIdQuery"
        - $ref: "#/components/parameters/DocumentAssetIdQuery"
        - $ref: "#/components/parameters/ScheduledDateQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200": { $ref: "#/components/responses/DocumentList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createReturn
      description: Creates a DRAFT return. No canonical asset effect occurs during creation.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReturnRequest" }
      responses:
        "201": { $ref: "#/components/responses/CreatedDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/logistics/v1/returns/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getReturn
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/returns/{documentId}/history:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getReturnHistory
      description: >-
        Read-only owner journal and immutable equipment evidence. Requires rwms.read and VIEW at
        the document warehouse, including historical documents. Events are ascending by aggregate
        version; follow nextAfterVersion until null. If documentVersion changes between pages,
        restart the read to avoid combining different snapshots. No downstream calls are made.
      parameters:
        - $ref: "#/components/parameters/HistoryAfterVersion"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200":
          description: Bounded journal page with saved line evidence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogisticsDocumentHistory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/returns/{documentId}/register:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: registerReturn
      description: Assigns the pickup driver/date and starts the fenced return-intake saga from a DRAFT return.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReturnPickupRequest" }
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/returns/{documentId}/accept-undamaged:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: acceptUndamagedReturn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptReturnRequest" }
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/logistics/v1/returns/{documentId}/start-estimates:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: startReturnEstimates
      description: >-
        Starts one maintenance-owned DRAFT estimate for every submitted return line.
        Return inspection photographs are immutable evidence; equipment losses are selected
        later inside each individual estimate and never in the return command.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/StartReturnEstimatesRequest" }
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/historical-rental-movements:
    post:
      operationId: createHistoricalRentalMovement
      description: >-
        Creates one real past rental shipment or return from a warehouse cabin card. The command
        requires an existing visible rental client, a non-future warehouse-local date and the
        current cabin version. A shipment accepts either one complete driver snapshot/worker-ID
        pair or an explicit null pair for an unknown driver; neither form creates a driver task or
        route. An imported shipment first closes or cancels eligible maintenance work through a
        durable server-side saga. If the repair-free cabin is already RENTED, the saga records the
        missing provenance as SHIPPED without repeating lease, hold or asset effects. An imported
        return enters the ordinary fenced return-intake and estimate flow and rejects driver data.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateHistoricalRentalMovementRequest" }
      responses:
        "200": { $ref: "#/components/responses/CreatedDocument" }
        "201": { $ref: "#/components/responses/CreatedDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/historical-rental-movements/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    put:
      operationId: updateHistoricalRentalShipment
      description: >-
        Corrects the client, optional complete driver pair and past physical date of one existing
        user-entered historical shipment. The document version and cabin identity are fenced; no
        route, driver task, lease, stock reservation or asset status transition is repeated.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateHistoricalRentalShipmentRequest" }
      responses:
        "200": { $ref: "#/components/responses/CreatedDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/shipments:
    get:
      operationId: listShipments
      description: >-
        Lists visible shipment documents. scheduledDate selects one exact warehouse-local business
        day; omission is retained only for bounded relationship lookups. Optional assetId selects
        documents containing that cabin before pagination, including completed and cancelled
        history independently of its current rental. Warehouse VIEW access remains required.
      parameters:
        - $ref: "#/components/parameters/WarehouseIdQuery"
        - $ref: "#/components/parameters/DocumentAssetIdQuery"
        - $ref: "#/components/parameters/ScheduledDateQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200": { $ref: "#/components/responses/DocumentList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createShipment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateShipmentRequest" }
      responses:
        "201": { $ref: "#/components/responses/CreatedDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/logistics/v1/shipments/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getShipment
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/shipments/{documentId}/history:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getShipmentHistory
      description: >-
        Same bounded owner-journal semantics as getReturnHistory. Requires rwms.read and VIEW at
        the document warehouse. Pre-preparation contents are not a final shipped manifest.
        Follow nextAfterVersion until null; restart if documentVersion changes between pages.
      parameters:
        - $ref: "#/components/parameters/HistoryAfterVersion"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200":
          description: Bounded journal page with saved line evidence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogisticsDocumentHistory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/shipments/{documentId}/plan:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    put:
      operationId: replaceShipmentPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShipmentPlanRequest" }
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/logistics/v1/shipments/{documentId}/furniture-readiness:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getShipmentFurnitureReadiness
      description: >-
        Reports whether an order shipment can start or finish departure. Readiness is based on the
        current asset-side furniture delta and the durable worker task state.
      responses:
        "200":
          description: Current furniture readiness for the shipment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipmentFurnitureReadiness" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/shipments/{documentId}/furniture-tasks:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: createShipmentFurnitureTasks
      description: >-
        For a saved order shipment, compares each order cabin's desired catalogue furniture with
        its current asset contents and creates worker tasks only for the difference. No browser
        movement orchestration or user-entered reservation deadline is involved.
      responses:
        "202":
          description: Furniture movement tasks created or existing idempotent task links returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipmentFurnitureTaskResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/shipments/{documentId}/confirm-preparation:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
      - name: keepScheduledDate
        in: query
        required: false
        description: Explicitly keep a planned calendar date when the physical departure is recorded today.
        schema: { type: boolean, default: false }
    post:
      operationId: confirmShipmentPreparation
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/shipments/{documentId}/cancel:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: cancelShipment
      description: >-
        Starts compensation for an ordinary shipment before departure. A user-entered historical
        shipment is additionally cancellable only from CONFLICT or RECONCILIATION_REQUIRED after
        logistics proves that no completed or unknown shipment-confirm transition exists. A lost
        lease-acquisition response is replayed under its original operation id before the exact
        lease is released; known active holds/leases are compensated and the open reconciliation
        audit is retained as resolved.
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/transfers:
    get:
      operationId: listTransfers
      description: >-
        Lists transfers visible to the selected warehouse. scheduledDate selects both arrivals and
        departures on one exact warehouse-local business day; omission is retained only for bounded
        relationship lookups.
      parameters:
        - $ref: "#/components/parameters/WarehouseIdQuery"
        - $ref: "#/components/parameters/ScheduledDateQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200": { $ref: "#/components/responses/DocumentList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createTransfer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTransferRequest" }
      responses:
        "201": { $ref: "#/components/responses/CreatedDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/logistics/v1/rental-items/{rentalItemId}/furniture-tasks:
    parameters:
      - { name: rentalItemId, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: createCabinFurnitureTask
      description: >-
        Replaces the selected cabin's complete furniture composition with the requested total.
        Logistics derives source balances from the asset-owned additional-equipment ledger and
        creates a worker task only for the physical difference.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCabinFurnitureTaskRequest" }
      responses:
        "200":
          description: The cabin already matches the requested composition; no task was necessary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinFurnitureTaskResult" }
        "202":
          description: A server-side furniture movement task was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinFurnitureTaskResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/transfers/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getTransfer
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/transfers/{documentId}/plan:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getTransferPlan
      description: >-
        Returns typed cargo requirements, calculated furniture totals and independent trip versus
        post-arrival resource intents. Pre-V67 concrete-line transfers are returned as
        legacyCompatible without changing their departure behavior.
      responses:
        "200":
          description: Current transfer planning projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferPlan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateTransferPlan
      parameters:
        - $ref: "#/components/parameters/ExpectedVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTransferPlanRequest" }
      responses:
        "202":
          description: Complete transfer draft planning projection replaced.
          headers:
            ETag: { schema: { type: string } }
            Idempotency-Replayed: { schema: { type: string, enum: ["true"] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/transfers/{documentId}/confirm:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: confirmTransferPlan
      description: >-
        Freezes a structurally complete plan and creates its concrete cabin document lines. The
        returned reservationReadiness becomes RESERVING while durable asset and task-board effects
        are pending, then RESERVED only after every cabin, independent furniture line and driver
        commitment is confirmed. A planned transfer cannot depart before RESERVED.
      responses:
        "202":
          description: Plan confirmed with explicit reservation readiness.
          headers:
            ETag: { schema: { type: string } }
            Idempotency-Replayed: { schema: { type: string, enum: ["true"] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/transfers/{documentId}/furniture-readiness:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getTransferFurnitureReadiness
      description: >-
        Reports the durable worker-task readiness for furniture changes selected for a transfer.
        Requires rwms.read and VIEW access to both the origin and destination warehouses.
      responses:
        "200":
          description: Current furniture readiness for the transfer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferFurnitureReadiness" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/transfers/{documentId}/depart:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: departTransfer
      description: >-
        Starts a confirmed transfer with no physical cabin lines. Resource-only and loose-furniture
        plans enter IN_TRANSIT through the same durable transfer-plan workflow; a transfer with
        concrete cabins must use the independently fenced line departure commands.
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/transfers/{documentId}/arrive:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: arriveTransfer
      description: >-
        Records factual arrival of a zero-cabin transfer and starts furniture execution plus
        resource-placement completion. A transfer with concrete cabins must use line arrival so
        asset location, media, repair continuation, and lease release cannot be bypassed.
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/transfers/{documentId}/lines/{lineId}/depart:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/LineId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/ExpectedLineVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: departTransferLine
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/transfers/{documentId}/lines/{lineId}/arrive:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/LineId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/ExpectedLineVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: arriveTransferLine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArriveTransferLineRequest" }
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/transfers/{documentId}/lines/{lineId}/arrival-preflight:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/LineId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/ExpectedLineVersion"
    get:
      operationId: getTransferArrivalPreflight
      description: >-
        Resolves the active repair that departed with this cabin and checks the
        destination warehouse queue bindings before any arrival mutation.
        Requires MANAGE access to both warehouses.
      responses:
        "200":
          description: Canonical repair-continuation requirements for this line.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferArrivalPreflight" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/transfers/{documentId}/cancel:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: cancelTransfer
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/equipment-movement-tasks:
    post:
      operationId: createEquipmentMovementTask
      description: >-
        Reserves every source balance until deadlineAt and creates one typed worker task.
        It never changes physical equipment balances itself: asset-service executes the
        reserved batch only after task-board reports DONE before the deadline.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "#/components/schemas/CreateEquipmentMovementTaskRequest",
              }
      responses:
        "200": { $ref: "#/components/responses/EquipmentMovementTask" }
        "201": { $ref: "#/components/responses/EquipmentMovementTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/equipment-movement-tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/EquipmentMovementTaskId"
    get:
      operationId: getEquipmentMovementTask
      responses:
        "200": { $ref: "#/components/responses/EquipmentMovementTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/equipment-movement-tasks/{taskId}/cancel:
    parameters:
      - $ref: "#/components/parameters/EquipmentMovementTaskId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: cancelEquipmentMovementTask
      description: >-
        Cancels an unfinished task and releases its source reservations. A task that
        has reached physical execution cannot be cancelled by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "#/components/schemas/CancelEquipmentMovementTaskRequest",
              }
      responses:
        "202": { $ref: "#/components/responses/EquipmentMovementTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/rental-expired-trips:
    get:
      operationId: listRentalExpiredTrips
      description: >-
        Latest 50 auto-cancelled trips across the authenticated rental manager's current
        readable warehouses, newest first. Requires rental access and RENTAL_MANAGER role.
        Does not grant full-order visibility or expose customer/address/free-text contents.
      responses:
        "200":
          description: Limited operational expiry notices.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  type: object
                  required: [id, warehouseId, unitNumber, kind, scheduledDate, state, failureCode, updatedAt]
                  properties:
                    id: { type: string, format: uuid }
                    warehouseId: { type: string, format: uuid }
                    unitNumber: { type: string }
                    kind: { type: string, enum: [SHIPMENT, RETURN, TRANSFER] }
                    scheduledDate: { type: string, format: date }
                    state: { type: string, const: CANCELLED }
                    failureCode: { type: [string, "null"], maxLength: 96 }
                    updatedAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/logistics/v1/driver-tasks:
    get:
      operationId: listDriverTasks
      description: Lists logistics-owned task intents for the selected warehouse.
      parameters:
        - $ref: "#/components/parameters/WarehouseIdQuery"
        - name: expiredOnly
          in: query
          description: >-
            Return only the latest 50 automatically cancelled transport trips, newest first.
            TRIP_DAY_EXPIRED means the warehouse-local planned day ended;
            TRIP_DAY_EXPIRED_CARGO_REVIEW also requires checking custody with the driver.
            Cancellation does not release cabins or charge customer penalties.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Driver task intents. Ordering and execution remain authoritative in task-board.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DriverTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createDriverTask
      description: >-
        Creates one cabin-movement intent and registers it in the warehouse's
        single queue with purpose LOGISTICS_DRIVER. AUTO resolves the current
        warehouse date; FIXED_DATE uses the supplied date. No queue-name lookup
        or fallback is allowed.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDriverTaskRequest" }
      responses:
        "200": { $ref: "#/components/responses/DriverTask" }
        "201": { $ref: "#/components/responses/DriverTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/admin/warehouse-operation-marks/{operationId}/recovery:
    post:
      operationId: recoverLogisticsWarehouseOperationMark
      description: >-
        Global-administrator-only, reviewed retry of one quarantined warehouse operation mark.
        The expected recovery version fences concurrent reviews; every accepted review is appended
        to an immutable audit table. Requires a USER token with rwms.write and SYSTEM_ADMIN or
        WMS_ADMIN global role.
      parameters:
        - name: operationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: warehouseId
          in: query
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WarehouseOperationMarkRecoveryRequest" }
      responses:
        "200":
          description: Requeued mark or the exact replay of an already accepted review.
          headers:
            Idempotency-Replayed:
              required: false
              schema: { type: string, const: "true" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WarehouseOperationMarkRecoveryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/internal/logistics/v1/planning/warehouses:
    get:
      operationId: listRoutePlanningWarehouses
      description: >-
        Returns active RWMS warehouse identities from warehouse-service in its canonical order.
        Requires the exact SERVICE identity logistics-planner, audience rwms-services, and sole
        scope logistics.planning. The response exposes only stable identity, display metadata,
        owner-held address and timezone.
      responses:
        "200":
          description: Active warehouse resources available to the standalone planner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanningWarehouseResourceList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/internal/logistics/v1/planning/warehouses/{servedWarehouseId}/support-links:
    get:
      operationId: listRoutePlanningWarehouseSupportLinks
      description: >-
        Returns warehouse-service-owned directed support edges eligible at the exact served
        warehouse local instant. The endpoint performs no route scoring and mutates no inventory.
        Requires the exact logistics-planner credential.
      parameters:
        - name: servedWarehouseId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: at
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Calendar-eligible support links with both endpoint identities.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/PlanningWarehouseSupportLinkResourceList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/internal/logistics/v1/planning/warehouses/{warehouseId}/support-network:
    get:
      operationId: listRoutePlanningWarehouseSupportNetwork
      description: >-
        Returns every active warehouse-service-owned directed support edge where the selected
        warehouse is either endpoint. No calendar rule is evaluated by this read; the standalone
        planner evaluates the returned policy for each candidate. Requires the exact
        logistics-planner credential and mutates no inventory or availability.
      parameters:
        - name: warehouseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Active adjacent support links with both endpoint identities.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/PlanningWarehouseSupportLinkResourceList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/internal/logistics/v1/planning/drivers:
    get:
      operationId: listRoutePlanningDrivers
      description: >-
        Validates the exact active warehouse identity and returns task-board-owned operational
        availability for staff and explicitly created contractors at the requested instant.
        Planned incoming resources are returned only when includeIncoming=true. Requires the exact
        logistics-planner credential. Login, credentials and groups are never exposed; phone is
        present only for a time-bounded contractor profile.
      parameters:
        - $ref: "#/components/parameters/WarehouseIdQuery"
        - name: at
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: includeIncoming
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Active qualified warehouse drivers in canonical task-board order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanningDriverResourceList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/internal/logistics/v1/planning/vehicle-assignments:
    get:
      operationId: listRoutePlanningVehicleOperationalAssignments
      description: >-
        Returns the logistics-owned live assignment closure required to resolve vehicle placement
        in the bounded half-open interval [windowStart, windowEnd). The closure follows every
        vehicle whose assignment history has touched the requested warehouse, so a later A-to-B-to-C
        reposition cannot make that vehicle falsely reappear at A. Terminal COMPLETED and CANCELLED
        rows are not returned. A TRIP_ONLY assignment reserves the physical vehicle without changing
        its operational base; TEMPORARY and PERMANENT assignments become destination availability
        only after factual arrival changes their status to ACTIVE. Requires the exact SERVICE
        identity logistics-planner, audience rwms-services, and sole scope logistics.planning.
      parameters:
        - $ref: "#/components/parameters/WarehouseIdQuery"
        - name: windowStart
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: windowEnd
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: >-
            Live PLANNED, IN_TRANSIT and ACTIVE vehicle facts used to overlay planner-owned catalog
            data without mutating the catalog vehicle's home warehouse.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/PlanningVehicleOperationalAssignmentList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/internal/logistics/v1/planning/requests:
    get:
      operationId: getRoutePlanningRequests
      description: >-
        Exports the still-unplanned cabin remainder of SAVED rental orders for one warehouse and
        bounded inclusive date range. Requires the exact SERVICE identity logistics-planner,
        audience rwms-services, and sole scope logistics.planning. Coordinates, when present, are
        authoritative over the address. The response includes only the normalized client legal
        type and contact facts required for dispatcher actions; furniture and unrelated client
        facts remain omitted.
      parameters:
        - $ref: "#/components/parameters/WarehouseIdQuery"
        - name: dateFrom
          in: query
          required: true
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Warehouse-local route-planning demand snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanningRequestFeed" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/internal/logistics/v1/planning/assignments:
    get:
      operationId: getRoutePlanningAssignmentStatuses
      description: >-
        Returns current logistics-owned driver audience and task state for planner-created
        shipment parts on one warehouse-local date. The read excludes every manually created
        document and exposes no customer contact data. A shared part changes to ASSIGNED_DRIVER
        after a qualified DriverApp worker claims it, allowing the standalone planner to show the
        authoritative assignee without reading task-board or an RWMS database.
      parameters:
        - $ref: "#/components/parameters/WarehouseIdQuery"
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Current status of every planner-created assignment for the requested date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanningAssignmentStatusResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    post:
      operationId: applyRoutePlanningAssignments
      description: >-
        Applies a planner result as existing logistics-owned rental shipments for exact cabins,
        dates, and DriverApp worker identities. Requires the same exact logistics-planner token.
        The batch may contain several non-overlapping cabin parts of one order; every part has a
        stable idempotent shipment command. Automatic application rejects today and tomorrow,
        dates not approved by the client, stale order versions, and cabins already planned.
        Assigned-driver vehicle/workday snapshots are registered with task-board before any
        shipment part is created or replayed; a failed registration fails the whole request.
        Valid parts are retained even when another part is rejected, and every rejection is
        returned with a stable code.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplyPlanningAssignmentsRequest" }
      responses:
        "200":
          description: Complete applied/rejected result for the batch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplyPlanningAssignmentsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/internal/logistics/v1/planning/assignments/{sourcePlanId}:
    put:
      operationId: replaceRoutePlanningAssignments
      description: >-
        Atomically replaces the complete membership of one still-unstarted published source plan
        with a strictly newer revision. The logistics owner revalidates order, task, lineage, date,
        warehouse, queue, and driver-shift fences before delegating one all-or-nothing replacement
        to task-board. An exact Idempotency-Key replay returns the stored result; a changed payload,
        started task, stale version, or incomplete membership returns 409 without partial mutation.
      parameters:
        - name: sourcePlanId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplacePlanningAssignmentsRequest" }
      responses:
        "200":
          description: Authoritative owner and task-board fences after application or exact replay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplacePlanningAssignmentsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/internal/logistics/v1/planning/assignments/{sourcePlanId}/withdraw-cancelled:
    post:
      operationId: withdrawCancelledRoutePlanningAssignment
      description: >-
        Withdraws exactly one assignment only after the logistics owner has authoritatively
        cancelled its order, shipment document, and driver task. The existing published-plan saga
        prepares one task-board hold, rechecks owner fences, advances only forward after owner
        confirmation, retains the removed tombstone, and replaces every remaining member and shift
        under a strictly newer lineage revision. Exact Idempotency-Key replay returns the stored
        result; stale membership, started work, or a changed owner state returns 409 without a
        silent customer commitment change.
      parameters:
        - name: sourcePlanId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanningPublishedAssignmentWithdrawal" }
      responses:
        "200":
          description: Durable removed-member tombstone and the current published lineage version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanningPublishedAssignmentWithdrawalResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/internal/logistics/v1/planning/assignments/{externalTaskId}/provisional-eta:
    put:
      operationId: replaceRoutePlanningProvisionalEta
      description: >-
        Version-fenced refresh or invalidation of the approximate ETA shown only for an unclaimed
        WAREHOUSE_DRIVERS task on a future warehouse-local day. Claim, assignment, start,
        cancellation, or a newer route source invalidates the preview. This is not live GPS ETA.
      parameters:
        - name: externalTaskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanningProvisionalEtaUpdateRequest" }
      responses:
        "200":
          description: Current versioned preview, possibly cleared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanningProvisionalEtaResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/internal/logistics/v1/planning/orders/{orderId}/reschedule-options:
    get:
      operationId: getRoutePlanningOrderRescheduleOptions
      description: >-
        Recalculates all route-feasible replacement offers from the real completed CustomerApp
        booking. The order fence must still match; the owner resolves and returns the current
        session fence. The current confirmed slot is never released by this read.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: expectedOrderVersion
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: Current commitment and fresh short-lived route-feasible offers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanningOrderRescheduleOptions" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
