      properties:
        equipmentId: { type: string, format: uuid }
        quantity: { type: integer, format: int64, minimum: 1 }
    SetOrderUnitDesiredEquipmentRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, requirements]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        requirements:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/OrderDesiredEquipmentInput" }
    OrderRentalTermExtensionInput:
      type: object
      additionalProperties: false
      required: [unitId, additionalMonths]
      properties:
        unitId: { type: string, format: uuid }
        additionalMonths: { type: integer, format: int64, minimum: 1 }
    ExtendOrderRentalTermsRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, terms]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        terms:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { $ref: "#/components/schemas/OrderRentalTermExtensionInput" }
    CreateOrderRentalShipmentRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, driverSnapshot, scheduledDate, unitIds]
