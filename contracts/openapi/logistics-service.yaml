        expectedVersion: { type: integer, format: int64, minimum: 0 }
        replacementRentalItemId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        inventorySourceWarehouseId:
          description: Physical warehouse of the replacement cabin; null uses the service warehouse.
          type: [string, "null"]
          format: uuid
    OrderDesiredEquipmentInput:
      type: object
      additionalProperties: false
