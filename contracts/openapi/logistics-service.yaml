        resolutionKind:
          type: [string, "null"]
          enum: [DISCOUNT, REPLACEMENT, RETURN, null]
        resolutionComment: { type: [string, "null"], minLength: 1, maxLength: 2000 }
        resolvedAt: { type: [string, "null"], format: date-time }
        actions:
          type: array
          items: { $ref: "#/components/schemas/CustomerCabinProblemAction" }
    StartCustomerCabinProblemRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    ResolveCustomerCabinProblemRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, resolutionKind, resolutionComment]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        resolutionKind: { $ref: "#/components/schemas/CustomerCabinProblemResolutionKind" }
        resolutionComment: { type: string, minLength: 1, maxLength: 2000 }
    PlanningDateOption:
      type: object
      additionalProperties: false
      required: [date, priority, isHard]
      properties:
        date: { type: string, format: date }
        priority: { type: integer, minimum: 0 }
        isHard: { type: boolean }
        windowStart:
          type: [string, "null"]
          format: time
          description: Exact fixed CustomerApp delivery-window start; absent for date-only choices.
        windowEnd:
          type: [string, "null"]
          format: time
          description: Exact fixed CustomerApp delivery-window end; absent for date-only choices.
        travelZoneHours:
          type: [integer, "null"]
          minimum: 1
          description: Informational source depot-to-customer truck travel band; exact capacity evaluates the complete route and never rejects solely by band number.
    PlanningUnitReservation:
      type: object
      additionalProperties: false
      required: [unitId, inventorySourceWarehouseId]
      properties:
        unitId:
          type: string
          format: uuid
          description: Concrete cabin reserved for the rental order.
        inventorySourceWarehouseId:
          type: string
          format: uuid
          description: Warehouse that physically holds this reservation before shipment.
    PlanningRequest:
      type: object
      additionalProperties: false
      required:
        [orderId, orderVersion, sourceRevision, customerDeliveryPurpose, orderNumber, clientName, clientType, contactName, contactPhone, address, latitude, longitude, quantity, unitIds, unitReservations, dateOptions, trailerAccessAllowed, deliveryPriceRubles, priceIsochroneMinutes, createdAt]
      properties:
        orderId: { type: string, format: uuid }
        orderVersion: { type: integer, format: int64, minimum: 0 }
        sourceRevision:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Deterministic revision of every exported planning fact; orderVersion remains the rental-order command fence.
        customerDeliveryPurpose:
          $ref: "#/components/schemas/CustomerDeliveryPurpose"
        orderNumber: { type: string, minLength: 1 }
        clientName: { type: string, minLength: 1 }
        clientType: { $ref: "#/components/schemas/ClientType" }
        contactName: { type: [string, "null"], maxLength: 512 }
        contactPhone:
          type: [string, "null"]
          maxLength: 32
          description: Normalized order override or historical client phone; null when an old record has no phone.
        address: { type: string, minLength: 1 }
        latitude:
          type: [number, "null"]
          format: double
        longitude:
          type: [number, "null"]
          format: double
        quantity: { type: integer, minimum: 1 }
        unitIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        unitReservations:
          type: array
          minItems: 1
          uniqueItems: true
          description: >-
            Complete unit-to-source mapping for unitIds. It does not change the regional
            service warehouse and lets the planner choose a physically valid source.
          items: { $ref: "#/components/schemas/PlanningUnitReservation" }
        dateOptions:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PlanningDateOption" }
        trailerAccessAllowed:
          type: [boolean, "null"]
          description: Customer or manager-confirmed private-site access fact; null means that no authoritative confirmation exists yet. Public-road feasibility remains routing-engine owned.
        deliveryPriceRubles:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: Final logistics-owned delivery amount from the confirmed customer slot; null means that the delivery price has not been calculated.
        priceIsochroneMinutes:
          type: [integer, "null"]
          minimum: 60
          maximum: 720
          multipleOf: 60
          description: Hourly isochrone tariff tier used for the confirmed delivery price; null is also valid when an older or specially priced slot retains the authoritative amount without its tier.
        createdAt: { type: string, format: date-time }
    PlanningRequestFeed:
      type: object
      additionalProperties: false
      required: [warehouseId, timeZone, generatedAt, requests]
      properties:
        warehouseId: { type: string, format: uuid }
        timeZone: { type: string, minLength: 1 }
        generatedAt: { type: string, format: date-time }
        requests:
          type: array
          items: { $ref: "#/components/schemas/PlanningRequest" }
    PlanningCustomerContact:
      type: object
      additionalProperties: false
      required: [clientType, clientName, contactName, contactPhone]
      properties:
        clientType: { $ref: "#/components/schemas/ClientType" }
        clientName: { type: string, minLength: 1, maxLength: 512 }
        contactName: { type: [string, "null"], maxLength: 512 }
        contactPhone: { type: [string, "null"], maxLength: 32 }
    PlanningRescheduleSlot:
      type: object
      additionalProperties: false
      required: [slotId, slotVersion, date, kind, windowStart, windowEnd, deliveryPriceRubles, expiresAt]
      properties:
        slotId: { type: string, format: uuid }
        slotVersion: { type: integer, format: int64, minimum: 0 }
        date: { type: string, format: date }
        kind: { type: string, enum: [FIXED_WINDOW, DURING_DAY] }
        windowStart: { type: [string, "null"], format: time }
        windowEnd: { type: [string, "null"], format: time }
        deliveryPriceRubles: { type: [integer, "null"], format: int64, minimum: 0 }
        expiresAt: { type: string, format: date-time }
    PlanningOrderRescheduleOptions:
      type: object
      additionalProperties: false
      required: [orderId, orderVersion, sessionId, sessionVersion, bookingId, warehouseId, customer, currentSlot, options]
      properties:
        orderId: { type: string, format: uuid }
        orderVersion: { type: integer, format: int64, minimum: 0 }
        sessionId: { type: string, format: uuid }
        sessionVersion: { type: integer, format: int64, minimum: 0 }
        bookingId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        customer: { $ref: "#/components/schemas/PlanningCustomerContact" }
        currentSlot: { $ref: "#/components/schemas/PlanningRescheduleSlot" }
        options:
          type: array
          items: { $ref: "#/components/schemas/PlanningRescheduleSlot" }
    PlanningOrderRescheduleRequest:
      type: object
      additionalProperties: false
      required: [expectedOrderVersion, expectedSessionVersion, slotId, slotVersion, decisionCode, decisionActorSubjectId, decisionReason, publishedPlanWithdrawal]
      properties:
        expectedOrderVersion: { type: integer, format: int64, minimum: 0 }
        expectedSessionVersion: { type: integer, format: int64, minimum: 0 }
        slotId: { type: string, format: uuid }
        slotVersion: { type: integer, format: int64, minimum: 0 }
        decisionCode:
          type: string
          enum: [CUSTOMER_AGREED_RECOMMENDED, CUSTOMER_AGREED_ALTERNATIVE]
        decisionActorSubjectId: { type: string, format: uuid }
        decisionReason: { type: string, minLength: 1, maxLength: 2000 }
        publishedPlanWithdrawal:
          description: >-
            Exact old-day lineage withdrawal used only when the customer commitment was already
            published. Null keeps the ordinary unassigned-booking reschedule path.
          oneOf:
            - $ref: "#/components/schemas/PlanningPublishedAssignmentWithdrawal"
            - type: "null"
    PlanningPublishedAssignmentRemoval:
      type: object
      additionalProperties: false
      required: [documentId, externalTaskId, expectedTaskVersion, serviceWarehouseId, scheduledDate, unitIds]
      properties:
        documentId: { type: string, format: uuid }
        externalTaskId: { type: string, format: uuid }
        expectedTaskVersion: { type: integer, format: int64, minimum: 0 }
        serviceWarehouseId: { type: string, format: uuid }
        scheduledDate: { type: string, format: date }
        unitIds:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { type: string, format: uuid }
    PlanningPublishedAssignmentWithdrawal:
      type: object
      additionalProperties: false
      required: [sourcePlanId, expectedSourcePlanVersion, replacementPlanVersion, warehouseId, date, removedAssignment, remainingAssignments, driverShiftPlans]
      properties:
        sourcePlanId: { type: string, format: uuid }
        expectedSourcePlanVersion: { type: integer, format: int64, minimum: 1 }
        replacementPlanVersion: { type: integer, format: int64, minimum: 2 }
        warehouseId: { type: string, format: uuid }
        date: { type: string, format: date }
        removedAssignment: { $ref: "#/components/schemas/PlanningPublishedAssignmentRemoval" }
        remainingAssignments:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/PlanningAssignmentReplacement" }
        driverShiftPlans:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/PlanningDriverShiftPlan" }
    PlanningPublishedAssignmentWithdrawalResult:
      type: object
      additionalProperties: false
      required: [sourcePlanId, sourcePlanVersion, removedExternalTaskId, removedTaskVersion, state]
      properties:
        sourcePlanId: { type: string, format: uuid }
        sourcePlanVersion: { type: integer, format: int64, minimum: 2 }
        removedExternalTaskId: { type: string, format: uuid }
        removedTaskVersion: { type: integer, format: int64, minimum: 0 }
        state: { type: string, const: COMPLETE }
    PlanningOrderRescheduleResponse:
      type: object
      additionalProperties: false
      required: [orderId, orderVersion, sessionId, sessionVersion, bookingId, warehouseId, confirmedSlot, publishedPlanWithdrawal]
      properties:
        orderId: { type: string, format: uuid }
        orderVersion: { type: integer, format: int64, minimum: 0 }
        sessionId: { type: string, format: uuid }
        sessionVersion: { type: integer, format: int64, minimum: 0 }
        bookingId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        confirmedSlot: { $ref: "#/components/schemas/PlanningRescheduleSlot" }
        publishedPlanWithdrawal:
          oneOf:
            - $ref: "#/components/schemas/PlanningPublishedAssignmentWithdrawalResult"
            - type: "null"
    PlanningBaseTask:
      type: object
      additionalProperties: false
      required: [taskId, externalTaskId, kind, unitNumber, summary, scheduledDate, priority, state]
      properties:
        taskId: { type: string, format: uuid }
        externalTaskId: { type: string, format: uuid }
        kind:
          type: string
          enum: [GENERAL_MOVEMENT, DELIVER_TO_REPAIR, REMOVE_FROM_REPAIR, CAPITAL_TO_PRODUCTION, TRANSFER]
        unitNumber: { type: string, minLength: 1, maxLength: 64 }
        summary: { type: string, minLength: 1, maxLength: 2000 }
        scheduledDate: { type: string, format: date }
        priority: { type: integer, minimum: 1, maximum: 5 }
        state: { type: string, const: SCHEDULED }
    PlanningProvisionalEtaUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedTaskVersion, sourcePlanId, sourcePlanVersion, provisionalEta]
      properties:
        expectedTaskVersion: { type: integer, format: int64, minimum: 0 }
        sourcePlanId: { type: string, format: uuid }
        sourcePlanVersion: { type: integer, format: int64, minimum: 1 }
        provisionalEta:
          type: [string, "null"]
          format: date-time
          description: Null invalidates the previous preview without replacing it.
    PlanningProvisionalEtaResponse:
      type: object
      additionalProperties: false
      required: [taskId, taskVersion, externalTaskId, provisionalEta, sourcePlanId, sourcePlanVersion]
      properties:
        taskId: { type: string, format: uuid }
        taskVersion: { type: integer, format: int64, minimum: 0 }
        externalTaskId: { type: string, format: uuid }
        provisionalEta: { type: [string, "null"], format: date-time }
        sourcePlanId: { type: [string, "null"], format: uuid }
        sourcePlanVersion: { type: [integer, "null"], format: int64, minimum: 1 }
    LogisticsRetentionDataset:
      type: string
      enum: [BUSINESS_AUDIT_PROOF, EVENT_OUTBOX, EVENT_INBOX, GPS_TELEMETRY]
    PlanningRetentionCandidateCount:
      type: object
      additionalProperties: false
      required: [dataset, cutoff, rowCount, activeHolds]
      properties:
        dataset: { $ref: "#/components/schemas/LogisticsRetentionDataset" }
        cutoff: { type: string, format: date-time }
        rowCount: { type: integer, format: int64, minimum: 0 }
        activeHolds: { type: integer, format: int64, minimum: 0 }
    PlanningRetentionDryRun:
      type: object
      additionalProperties: false
      required: [generatedAt, businessAuditProofDays, eventOnlineDays, eventArchiveDays, gpsTelemetryDays, deletionEnabled, dualApprovalRequired, candidates]
      properties:
        generatedAt: { type: string, format: date-time }
        businessAuditProofDays: { type: integer, format: int64, minimum: 1 }
        eventOnlineDays: { type: integer, format: int64, minimum: 1 }
        eventArchiveDays: { type: integer, format: int64, minimum: 1 }
        gpsTelemetryDays: { type: integer, format: int64, minimum: 1 }
        deletionEnabled: { type: boolean, default: false }
        dualApprovalRequired: { type: boolean, const: true }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/PlanningRetentionCandidateCount" }
    PlacePlanningRetentionLegalHoldRequest:
      type: object
      additionalProperties: false
      required: [dataset, scopeKey, reason]
      properties:
        dataset: { $ref: "#/components/schemas/LogisticsRetentionDataset" }
        scopeKey: { type: [string, "null"], maxLength: 256 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    ReleasePlanningRetentionLegalHoldRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    PlanningRetentionLegalHold:
      type: object
      additionalProperties: false
      required: [id, version, dataset, scopeKey, reason, placedBySubjectId, placedAt, releasedBySubjectId, releasedAt, releaseReason]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        dataset: { $ref: "#/components/schemas/LogisticsRetentionDataset" }
        scopeKey: { type: [string, "null"], maxLength: 256 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        placedBySubjectId: { type: string, format: uuid }
        placedAt: { type: string, format: date-time }
        releasedBySubjectId: { type: [string, "null"], format: uuid }
        releasedAt: { type: [string, "null"], format: date-time }
        releaseReason: { type: [string, "null"], maxLength: 2000 }
    RecordPlanningArchiveManifestRequest:
      type: object
      additionalProperties: false
      required: [dataset, periodStart, periodEnd, objectKey, sha256, rowCount]
      properties:
        dataset: { $ref: "#/components/schemas/LogisticsRetentionDataset" }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        objectKey: { type: string, minLength: 1, maxLength: 1000, writeOnly: true }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        rowCount: { type: integer, format: int64, minimum: 0 }
    VerifyPlanningArchiveManifestRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    PlanningArchiveManifest:
      type: object
      additionalProperties: false
      required: [id, version, dataset, periodStart, periodEnd, sha256, rowCount, state, createdBySubjectId, createdAt, verifiedBySubjectId, verifiedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        dataset: { $ref: "#/components/schemas/LogisticsRetentionDataset" }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        rowCount: { type: integer, format: int64, minimum: 0 }
        state: { type: string, enum: [RECORDED, VERIFIED] }
        createdBySubjectId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        verifiedBySubjectId: { type: [string, "null"], format: uuid }
        verifiedAt: { type: [string, "null"], format: date-time }
    PlanningWarehouseResource:
      type: object
      additionalProperties: false
      required:
        [warehouseId, warehouseVersion, name, city, address, latitude, longitude, timeZone, representative, routingReady]
      properties:
        warehouseId: { type: string, format: uuid }
        warehouseVersion: { type: integer, format: int64, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 255 }
        city: { type: string, minLength: 1, maxLength: 255 }
        address: { type: [string, "null"], minLength: 1, maxLength: 1000 }
        latitude:
          { type: [number, "null"], minimum: -90, maximum: 90 }
        longitude:
          { type: [number, "null"], minimum: -180, maximum: 180 }
        timeZone: { type: string, minLength: 1, maxLength: 64 }
        representative: { type: boolean }
        routingReady:
          type: boolean
          description: >-
            True only when the owner-held WGS84 coordinate pair is complete and is not the
            reserved 0,0 placeholder.
    PlanningWarehouseResourceList:
      type: array
      items: { $ref: "#/components/schemas/PlanningWarehouseResource" }
    PlanningWarehouseSupportLinkResource:
      type: object
      additionalProperties: false
      required:
        [supportLinkId, supportLinkVersion, supportWarehouse, servedWarehouse, priority, allowDrivers, allowVehicles, allowInventory, allowDirectFulfillment, allowInterwarehouseTransfer, allowContractorFallback, allowedWeekdays, allowedDates, excludedDates, serviceStart, serviceEnd]
      properties:
        supportLinkId: { type: string, format: uuid }
        supportLinkVersion: { type: integer, format: int64, minimum: 0 }
        supportWarehouse: { $ref: "#/components/schemas/PlanningWarehouseResource" }
        servedWarehouse: { $ref: "#/components/schemas/PlanningWarehouseResource" }
        priority: { type: integer, minimum: 1 }
        allowDrivers: { type: boolean }
        allowVehicles: { type: boolean }
        allowInventory: { type: boolean }
        allowDirectFulfillment: { type: boolean }
        allowInterwarehouseTransfer: { type: boolean }
        allowContractorFallback: { type: boolean }
        allowedWeekdays:
          type: array
          uniqueItems: true
          items:
            { type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY] }
        allowedDates:
          type: array
          uniqueItems: true
          items: { type: string, format: date }
        excludedDates:
          type: array
          uniqueItems: true
          items: { type: string, format: date }
        serviceStart: { type: [string, "null"], format: time }
        serviceEnd: { type: [string, "null"], format: time }
    PlanningWarehouseSupportLinkResourceList:
      type: array
      items:
        { $ref: "#/components/schemas/PlanningWarehouseSupportLinkResource" }
    PlanningDriverResource:
      type: object
      additionalProperties: false
      required:
        [workerId, displayName, employmentType, phone, operationalWarehouseId, availableFrom, availableUntil, availabilityKind]
      properties:
        workerId: { type: string, format: uuid }
        displayName: { type: string, minLength: 1, maxLength: 256 }
        employmentType: { type: string, enum: [STAFF, CONTRACTOR] }
        phone: { type: [string, "null"] }
        operationalWarehouseId: { type: string, format: uuid }
        availableFrom: { type: [string, "null"], format: date-time }
        availableUntil: { type: [string, "null"], format: date-time }
        availabilityKind:
          { type: string, enum: [HOME, ACTIVE_ASSIGNMENT, INCOMING] }
    PlanningDriverResourceList:
      type: array
      items: { $ref: "#/components/schemas/PlanningDriverResource" }
    PlanningVehicleOperationalAssignmentMode:
      type: string
      enum: [TRIP_ONLY, TEMPORARY, PERMANENT]
    PlanningVehicleOperationalAssignmentStatus:
      type: string
      enum: [PLANNED, IN_TRANSIT, ACTIVE, COMPLETED, CANCELLED]
      description: >-
        The shared durable lifecycle enum. The live planning endpoint returns only PLANNED,
        IN_TRANSIT and ACTIVE; terminal values remain valid persisted history.
    PlanningVehicleOperationalAssignment:
      type: object
      additionalProperties: false
      required:
        [assignmentId, version, transferId, vehicleId, sourceWarehouseId, destinationWarehouseId, mode, status, travelStartsAt, effectiveFrom, effectiveUntil, createdAt, updatedAt]
      properties:
        assignmentId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        transferId: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        sourceWarehouseId: { type: string, format: uuid }
        destinationWarehouseId: { type: string, format: uuid }
        mode: { $ref: "#/components/schemas/PlanningVehicleOperationalAssignmentMode" }
        status: { $ref: "#/components/schemas/PlanningVehicleOperationalAssignmentStatus" }
        travelStartsAt: { type: string, format: date-time }
        effectiveFrom: { type: string, format: date-time }
        effectiveUntil:
          type: [string, "null"]
          format: date-time
          description: >-
            Exclusive end of a temporary placement, the TRIP_ONLY effectiveFrom boundary, or the
            preserved end of a superseded permanent history row. A live permanent placement is
            unbounded.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PlanningVehicleOperationalAssignmentList:
      type: array
      items: { $ref: "#/components/schemas/PlanningVehicleOperationalAssignment" }
    PlanningCapacityJob:
      type: object
      additionalProperties: false
      required:
        [sourceJobId, taskType, deliveryDate, latitude, longitude, cabinCount, windowStart, windowEnd, serviceMinutes, trailerAccessAllowed, priority, mandatory]
      properties:
        sourceJobId: { type: string, format: uuid }
        taskType:
          type: string
          enum: [DELIVERY, PICKUP]
          description: Deliveries are hard primary workload; pickups are considered only on return legs.
        deliveryDate: { type: string, format: date }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        cabinCount: { type: integer, minimum: 1 }
        windowStart: { type: string, format: time }
        windowEnd: { type: string, format: time }
        serviceMinutes: { type: integer, minimum: 1 }
        trailerAccessAllowed:
          type: boolean
          description: Whether the destination admits the truck-and-trailer configuration.
        priority:
          type: integer
          minimum: 0
        mandatory:
          type: boolean
          description: A mandatory pickup may not be silently dropped; deliveries are always mandatory.
    PlanningCapacityShift:
      type: object
      additionalProperties: false
      required:
        [sourceShiftId, deliveryDate, shiftStart, shiftEnd, breakMinutes, cabinCapacity]
      properties:
        sourceShiftId:
          type: string
          format: uuid
          description: Stable simulator shift identity; driver names and personal data are not exported.
        deliveryDate: { type: string, format: date }
        shiftStart: { type: string, format: time }
        shiftEnd: { type: string, format: time }
        breakMinutes:
          type: integer
          minimum: 0
          maximum: 720
          description: Must be shorter than the same-day interval from shiftStart to shiftEnd.
          x-rwms-constraint: breakMinutes * 60 < shiftEnd - shiftStart
        cabinCapacity: { type: integer, minimum: 1, maximum: 2 }
    PlanningCapacityIsochroneTariff:
      type: object
      additionalProperties: false
      required: [travelMinutes, priceRubles]
      properties:
        travelMinutes:
          type: integer
          minimum: 60
          maximum: 720
          multipleOf: 60
        priceRubles:
          type: integer
          format: int64
          minimum: 0
    PlanningCapacityPriceZone:
      type: object
      additionalProperties: false
      required:
        [sourceZoneId, sourceZoneVersion, deliveryPriceRubles, pickupPriceRubles, geometry]
      properties:
        sourceZoneId: { type: string, format: uuid }
        sourceZoneVersion: { type: integer, format: int64, minimum: 0 }
        deliveryPriceRubles: { type: integer, format: int64, minimum: 0 }
        pickupPriceRubles: { type: integer, format: int64, minimum: 0 }
        geometry: { $ref: "#/components/schemas/GeoJsonMultiPolygon" }
    PlanningCapacityRestrictionZone:
      type: object
      additionalProperties: false
      required: [sourceZoneId, sourceZoneVersion, kind, geometry]
      properties:
        sourceZoneId: { type: string, format: uuid }
        sourceZoneVersion: { type: integer, format: int64, minimum: 0 }
        kind:
          type: string
          enum: [FORBIDDEN, NO_TRAILER]
          description: FORBIDDEN suppresses delivery offers; NO_TRAILER requires trailer-free routing.
        geometry: { $ref: "#/components/schemas/GeoJsonMultiPolygon" }
    GeoJsonPosition:
      type: array
      prefixItems:
        - { type: number, minimum: -180, maximum: 180 }
        - { type: number, minimum: -90, maximum: 90 }
      minItems: 2
      maxItems: 2
    GeoJsonLinearRing:
      type: array
      minItems: 4
      items: { $ref: "#/components/schemas/GeoJsonPosition" }
    GeoJsonPolygonCoordinates:
      type: array
      minItems: 1
      items: { $ref: "#/components/schemas/GeoJsonLinearRing" }
    GeoJsonMultiPolygon:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: { type: string, const: MultiPolygon }
        coordinates:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/GeoJsonPolygonCoordinates" }
    ReplacePlanningCapacitySnapshotRequest:
      type: object
      additionalProperties: false
      required: [sourceGeneration, sourceRevision, jobs, shifts, isochroneTariffs]
      properties:
        sourceGeneration:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Monotonic warehouse publication generation. A lower generation can be replayed
            only when its exact successful command receipt already exists; otherwise it is stale.
        sourceRevision:
          type: string
          pattern: '^[0-9a-f]{64}$'
        jobs:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/PlanningCapacityJob" }
        shifts:
          type: array
          maxItems: 2000
          items: { $ref: "#/components/schemas/PlanningCapacityShift" }
        isochroneTariffs:
          type: array
          minItems: 1
          maxItems: 12
          description: Ordered contiguous hourly tiers starting at 60 minutes; the last tier is the delivery boundary.
          items: { $ref: "#/components/schemas/PlanningCapacityIsochroneTariff" }
        priceZones:
          type: array
          maxItems: 500
          default: []
          description: >-
            SPECIAL_PRICE polygons. They can override a tariff only after the road route is
            proven to remain inside the farthest configured isochrone; they never extend coverage.
          items: { $ref: "#/components/schemas/PlanningCapacityPriceZone" }
        restrictionZones:
          type: array
          maxItems: 500
          default: []
          description: >-
            Exceptional FORBIDDEN and NO_TRAILER polygons. They are independent from ordinary
            isochrone coverage and never represent a normal delivery region.
          items: { $ref: "#/components/schemas/PlanningCapacityRestrictionZone" }
    PlanningCapacitySnapshotResponse:
      type: object
      additionalProperties: false
      required:
        [warehouseId, sourceGeneration, version, sourceRevision, jobCount, shiftCount, isochroneTariffCount, priceZoneCount, restrictionZoneCount, replayed, updatedAt]
      properties:
        warehouseId: { type: string, format: uuid }
        sourceGeneration: { type: integer, format: int64, minimum: 1 }
        version: { type: integer, format: int64, minimum: 0 }
        sourceRevision:
          type: string
          pattern: '^[0-9a-f]{64}$'
        jobCount: { type: integer, minimum: 0 }
        shiftCount: { type: integer, minimum: 0 }
        isochroneTariffCount: { type: integer, minimum: 1, maximum: 12 }
        priceZoneCount: { type: integer, minimum: 0, maximum: 500 }
        restrictionZoneCount: { type: integer, minimum: 0, maximum: 500 }
        replayed: { type: boolean }
        updatedAt: { type: string, format: date-time }
    PlanningAssignment:
      type: object
      additionalProperties: false
      required: [orderId, expectedOrderVersion, scheduledDate, driverName, unitIds]
      properties:
        orderId: { type: string, format: uuid }
        serviceWarehouseId:
          type: [string, "null"]
          format: uuid
          description: >-
            Regional warehouse that owns the order. Omission preserves legacy behavior and uses
            ApplyPlanningAssignmentsRequest.warehouseId. The root warehouse still owns the
            driver shift plan.
        inventorySourceWarehouseId:
          type: [string, "null"]
          format: uuid
          description: >-
            Physical source shared by every unitId in this shipment. Omission preserves legacy
            behavior and lets the order owner use its existing source-selection fallback.
        expectedOrderVersion: { type: integer, format: int64, minimum: 0 }
        scheduledDate: { type: string, format: date }
        assignmentType:
          type: string
          enum: [ROUTE_PLAN, CONTRACTOR_HANDOFF]
          default: ROUTE_PLAN
          description: >-
            ROUTE_PLAN is an automatic planner result and keeps the near-date protection.
            CONTRACTOR_HANDOFF is an explicit dispatcher decision for one concrete contractor;
            it does not require an internal vehicle, shift or route-cycle snapshot.
        driverAudienceMode:
          type: string
          enum: [ASSIGNED_DRIVER, WAREHOUSE_DRIVERS]
          default: ASSIGNED_DRIVER
          description: WAREHOUSE_DRIVERS explicitly publishes a future delivery for qualified drivers to claim.
        driverWorkerId:
          type: [string, "null"]
          format: uuid
          description: Required for ASSIGNED_DRIVER and null for WAREHOUSE_DRIVERS.
        driverName: { type: string, minLength: 1, maxLength: 512 }
        unitIds:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { type: string, format: uuid }
        provisionalEta:
          type: [string, "null"]
          format: date-time
          description: >-
            Approximate arrival from this exact feasible plan version. Allowed only for an
            unclaimed WAREHOUSE_DRIVERS task on the scheduled future day; it is not GPS ETA.
    ApplyPlanningAssignmentsRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, planId, planVersion, assignments]
      properties:
        warehouseId:
          type: string
          format: uuid
          description: Root warehouse of the immutable planner command.
        planId: { type: string, format: uuid }
        planVersion: { type: integer, format: int64, minimum: 1 }
        assignments:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/PlanningAssignment" }
        driverShiftPlans:
          type: array
          maxItems: 500
          default: []
          description: >-
            Immutable assigned-driver vehicle/workday snapshots from this exact plan version.
            Omission is accepted as an empty list for callers predating Driver Up shift planning.
          items: { $ref: "#/components/schemas/PlanningDriverShiftPlan" }
    PlanningDriverShiftVehicle:
      type: object
      additionalProperties: false
      required: [id, name, registrationNumber, configurationType]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        registrationNumber: { type: string, minLength: 1, maxLength: 64 }
        vehicleType: { type: [string, "null"], maxLength: 64 }
        manufacturer: { type: [string, "null"], maxLength: 100 }
        model: { type: [string, "null"], maxLength: 100 }
        configurationType:
          type: string
          enum: [TRUCK, TRUCK_WITH_TRAILER, TRUCK_WITH_CRANE]
        cabinCapacity:
          type: [integer, "null"]
          minimum: 1
          maximum: 2
          description: >-
            Exact effective cabin capacity for this vehicle/trailer snapshot. Omission preserves
            pre-capacity producers but cannot authorize transfer-cargo load changes.
        startOdometer: { type: [integer, "null"], format: int64, minimum: 0 }
    PlanningDriverShiftTrailer:
      type: object
      additionalProperties: false
      required: [id, name, registrationNumber]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        registrationNumber: { type: string, minLength: 1, maxLength: 64 }
    PlanningDriverShiftPlan:
      type: object
      additionalProperties: false
      required:
        [sourceShiftId, sourcePlanId, sourcePlanVersion, warehouseId, driverId, driverName, workDate, vehicle, tripCount, routeDistanceMeters]
      properties:
        sourceShiftId: { type: string, format: uuid }
        sourcePlanId: { type: string, format: uuid }
        sourcePlanVersion: { type: integer, format: int64, minimum: 1 }
        warehouseId:
          type: string
          format: uuid
          description: Root warehouse of the immutable planner command.
        routeOriginWarehouseId:
          type: [string, "null"]
          format: uuid
          description: >-
            Physical warehouse where this driver/vehicle shift starts. Omission preserves
            legacy local-route behavior and uses warehouseId.
        supportWarehouseLinkId:
          type: [string, "null"]
          format: uuid
          description: >-
            Exact directed support link authorizing a cross-warehouse start; null for a local
            shift. The owner revalidates the link and its calendar before publication.
        driverId: { type: string, format: uuid }
        driverName: { type: string, minLength: 1, maxLength: 256 }
        workDate: { type: string, format: date }
        vehicle: { $ref: "#/components/schemas/PlanningDriverShiftVehicle" }
        trailer:
          oneOf:
            - $ref: "#/components/schemas/PlanningDriverShiftTrailer"
            - type: "null"
        tripCount: { type: integer, minimum: 0 }
        routeDistanceMeters:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Exact sum of planner route-cycle and cross-warehouse positioning meters; UI rounding
            to kilometers is downstream.
        operations:
          type: array
          maxItems: 1000
          default: []
          description: >-
            Immutable one-based executable route order from this exact plan version. Omission is
            accepted as an empty list for callers predating route execution snapshots.
          items: { $ref: "#/components/schemas/PlanningDriverShiftRouteOperation" }
    PlanningDriverShiftRouteOperation:
      type: object
      additionalProperties: false
      required:
        [sequence, kind, locationLabel, plannedArrival, plannedDeparture, loadBefore, loadAfter]
      properties:
        sequence:
          type: integer
          minimum: 1
          description: Contiguous one-based order across every cycle in the driver workday.
        kind:
          type: string
          enum:
            [ORIGIN_START, TRANSFER_LOAD, INBOUND_POSITIONING, TRANSFER_UNLOAD, DEPOT_LOAD, DELIVERY, PICKUP, DEPOT_UNLOAD, DEPOT_RETURN, RETURN_POSITIONING]
        warehouseId:
          type: [string, "null"]
          format: uuid
          description: Warehouse at this operation endpoint; null for a customer location.
        sourceTaskId:
          type: [string, "null"]
          format: uuid
          description: Standalone planner task identity for a customer operation.
        sourceTransferId:
          type: [string, "null"]
          format: uuid
          description: >-
            Canonical logistics transfer identity for a TRANSFER_LOAD or TRANSFER_UNLOAD
            operation; null for customer, depot and positioning operations.
        locationLabel: { type: string, minLength: 1, maxLength: 500 }
        plannedArrival:
          type: string
          format: date-time
          description: Exact stop arrival or positioning destination arrival ETA.
        plannedDeparture:
          type: string
          format: date-time
          description: Exact stop departure or positioning origin departure ETA.
        loadBefore: { type: integer, minimum: 0 }
        loadAfter: { type: integer, minimum: 0 }
    AppliedPlanningAssignment:
      type: object
      additionalProperties: false
      required: [orderId, orderVersion, documentId, externalTaskId, taskVersion, replayed]
      properties:
        orderId: { type: string, format: uuid }
        orderVersion:
          type: integer
          format: int64
          minimum: 0
          description: Current logistics-owned order command fence after the shipment application.
        documentId: { type: string, format: uuid }
        externalTaskId:
          type: string
          format: uuid
          description: >-
            Exact durable logistics driver-task identity created by the shipment workflow. It is
            returned for both first application and replay and is never derived from another ID.
        taskVersion:
          type: integer
          format: int64
          minimum: 0
          description: Exact aggregate fence for the first provisional-ETA refresh or invalidation.
        replayed: { type: boolean }
    PlanningAssignmentStatus:
      type: object
      additionalProperties: false
      required:
        [orderId, orderVersion, documentId, externalTaskId, taskVersion, sourcePlanId, sourcePlanVersion, scheduledDate, unitIds, driverAudienceMode, driverWorkerId, driverName, taskState]
      properties:
        orderId: { type: string, format: uuid }
        orderVersion: { type: integer, format: int64, minimum: 0 }
        documentId: { type: string, format: uuid }
        externalTaskId: { type: string, format: uuid }
        taskVersion: { type: integer, format: int64, minimum: 0 }
        sourcePlanId:
          type: [string, "null"]
          format: uuid
          description: Durable planner lineage; null only for pre-lineage historical projections.
        sourcePlanVersion:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: Current or tombstoning revision visible to the planner.
        scheduledDate: { type: string, format: date }
        unitIds:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { type: string, format: uuid }
        driverAudienceMode:
          type: string
          enum: [ASSIGNED_DRIVER, WAREHOUSE_DRIVERS]
        driverWorkerId: { type: [string, "null"], format: uuid }
        driverName: { type: [string, "null"], maxLength: 512 }
        taskState:
          type: string
          enum: [REGISTERING, SCHEDULED, CURRENT, FINALIZING, COMPLETED, CANCELLED, RECONCILIATION_REQUIRED]
    PlanningAssignmentStatusResponse:
      type: object
      additionalProperties: false
      required: [warehouseId, date, assignments]
      properties:
        warehouseId: { type: string, format: uuid }
        date: { type: string, format: date }
        assignments:
          type: array
          items: { $ref: "#/components/schemas/PlanningAssignmentStatus" }
    RejectedPlanningAssignment:
      type: object
      additionalProperties: false
      required: [orderId, code, message]
      properties:
        orderId: { type: string, format: uuid }
        code: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
    ApplyPlanningAssignmentsResponse:
      type: object
      additionalProperties: false
      required: [applied, rejected]
      properties:
        applied:
          type: array
          items: { $ref: "#/components/schemas/AppliedPlanningAssignment" }
        rejected:
          type: array
          items: { $ref: "#/components/schemas/RejectedPlanningAssignment" }
    PlanningAssignmentReplacement:
      type: object
      additionalProperties: false
      required:
        [orderId, expectedOrderVersion, documentId, externalTaskId, expectedTaskVersion, serviceWarehouseId, scheduledDate, unitIds, driverAudienceMode, driverWorkerId, driverName, targetQueuePosition, provisionalEta]
      properties:
        orderId: { type: string, format: uuid }
        expectedOrderVersion: { type: integer, format: int64, minimum: 0 }
        documentId: { type: string, format: uuid }
        externalTaskId: { type: string, format: uuid }
        expectedTaskVersion: { type: integer, format: int64, minimum: 0 }
        serviceWarehouseId: { type: string, format: uuid }
        scheduledDate: { type: string, format: date }
        unitIds:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { type: string, format: uuid }
        driverAudienceMode:
          type: string
          enum: [ASSIGNED_DRIVER, WAREHOUSE_DRIVERS]
        driverWorkerId: { type: [string, "null"], format: uuid }
        driverName: { type: [string, "null"], maxLength: 512 }
        targetQueuePosition: { type: integer, minimum: 0 }
        provisionalEta: { type: [string, "null"], format: date-time }
    ReplacePlanningAssignmentsRequest:
      type: object
      additionalProperties: false
      required:
        [warehouseId, date, expectedSourcePlanVersion, replacementPlanVersion, assignments, driverShiftPlans]
      properties:
        warehouseId: { type: string, format: uuid }
        date: { type: string, format: date }
        expectedSourcePlanVersion: { type: integer, format: int64, minimum: 1 }
        replacementPlanVersion: { type: integer, format: int64, minimum: 2 }
        assignments:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/PlanningAssignmentReplacement" }
        driverShiftPlans:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/PlanningDriverShiftPlan" }
    PlanningReplacementOutcome:
      type: string
      enum: [APPLIED, REPLAYED]
    ReplacedPlanningAssignment:
      type: object
      additionalProperties: false
      required:
        [orderId, orderVersion, documentId, externalTaskId, taskVersion, taskBoardTaskVersion, taskBoardEntryId, taskBoardEntryVersion, queuePosition]
      properties:
        orderId: { type: string, format: uuid }
        orderVersion: { type: integer, format: int64, minimum: 0 }
        documentId: { type: string, format: uuid }
        externalTaskId: { type: string, format: uuid }
        taskVersion: { type: integer, format: int64, minimum: 0 }
        taskBoardTaskVersion: { type: integer, format: int64, minimum: 0 }
        taskBoardEntryId: { type: string, format: uuid }
        taskBoardEntryVersion: { type: integer, format: int64, minimum: 0 }
        queuePosition: { type: integer, minimum: 0 }
    ReplacedPlanningDriverShift:
      type: object
      additionalProperties: false
      required: [sourceShiftId, taskBoardShiftPlanVersion, sourcePlanVersion]
      properties:
        sourceShiftId: { type: string, format: uuid }
        taskBoardShiftPlanVersion: { type: integer, format: int64, minimum: 0 }
        sourcePlanVersion: { type: integer, format: int64, minimum: 1 }
    ReplacePlanningAssignmentsResponse:
      type: object
      additionalProperties: false
      required:
        [outcome, sourcePlanId, sourcePlanVersion, warehouseId, date, assignments, driverShiftPlans]
      properties:
        outcome: { $ref: "#/components/schemas/PlanningReplacementOutcome" }
        sourcePlanId: { type: string, format: uuid }
        sourcePlanVersion: { type: integer, format: int64, minimum: 2 }
        warehouseId: { type: string, format: uuid }
        date: { type: string, format: date }
        assignments:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/ReplacedPlanningAssignment" }
        driverShiftPlans:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/ReplacedPlanningDriverShift" }
    MaintenanceReturnArrival:
      type: object
      additionalProperties: false
      required: [warehouseId, rentalItemId, returnDocumentId, arrivedAt]
      properties:
        warehouseId: { type: string, format: uuid }
        rentalItemId: { type: string, format: uuid }
        returnDocumentId: { type: string, format: uuid }
        arrivedAt: { type: string, format: date-time }
    ApplyInventoryOutcomeRequest:
      type: object
      additionalProperties: false
      required:
        [warehouseId, inventoryCompletedAt, finalPlanVersion, finalPlanSha256, outcomes]
      properties:
        warehouseId: { type: string, format: uuid }
        inventoryCompletedAt: { type: string, format: date-time }
        finalPlanVersion: { type: integer, format: int64, minimum: 1 }
        finalPlanSha256:
          { type: string, pattern: "^[0-9a-f]{64}$", minLength: 64, maxLength: 64 }
        outcomes:
          type: array
          minItems: 1
          maxItems: 5000
          description: findingId and assetId must each be unique across the complete batch.
          items: { $ref: "#/components/schemas/InventoryAssetOutcome" }
    InventoryAssetOutcome:
      type: object
      additionalProperties: false
      required: [findingId, assetId, dispositionKind, desiredStatus, formerRental, shipment]
      properties:
        findingId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        dispositionKind: { $ref: "#/components/schemas/InventoryDispositionKind" }
        desiredStatus:
          {
            type: string,
            enum: [FREE, REPAIR, CAPITAL_REPAIR, RENTED, WRITE_OFF_PENDING],
          }
        formerRental:
          oneOf:
            - { $ref: "#/components/schemas/InventoryFormerRental" }
            - { type: "null" }
        shipment:
          oneOf:
            - { $ref: "#/components/schemas/InventoryShipment" }
            - { type: "null" }
    InventoryDispositionKind:
      type: string
      enum: [LOCAL, SHIPMENT, WRITE_OFF]
    InventoryFormerRental:
      type: object
      additionalProperties: false
      required: [returnedOn, clientId, clientSnapshot]
      properties:
        returnedOn: { type: string, format: date }
        clientId: { type: string, format: uuid }
        clientSnapshot: { type: string, minLength: 1, maxLength: 512 }
    InventoryShipmentFurniture:
      type: object
      additionalProperties: false
      required: [equipmentId, catalogVersion, quantity]
      properties:
        equipmentId: { type: string, format: uuid }
        catalogVersion: { type: integer, format: int64, minimum: 0 }
        quantity: { type: integer, format: int64, minimum: 1 }
    InventoryShipment:
      type: object
      additionalProperties: false
      required: [departedOn, clientId, clientSnapshot, furniture]
      properties:
        departedOn: { type: string, format: date }
        clientId: { type: string, format: uuid }
        clientSnapshot: { type: string, minLength: 1, maxLength: 512 }
        furniture:
          type: array
          maxItems: 100
          description: >-
            equipmentId values must be unique. These reviewed physical contents deliberately do not
            reserve or decrement STOCK.
          items: { $ref: "#/components/schemas/InventoryShipmentFurniture" }
    InventoryDispositionResult:
      type: object
      additionalProperties: false
      required: [findingId, assetId, dispositionKind, markerId, documentId, lineId]
      properties:
        findingId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        dispositionKind: { $ref: "#/components/schemas/InventoryDispositionKind" }
        markerId: { type: string, format: uuid }
        documentId:
          {
            type: [string, "null"],
            format: uuid,
            description: Null for WRITE_OFF and LOCAL outcomes without formerRental.,
          }
        lineId: { type: [string, "null"], format: uuid }
    ApplyInventoryOutcomeResponse:
      type: object
      additionalProperties: false
      required:
        - inventoryId
        - finalPlanVersion
        - supersededDocumentIds
        - supersededRentalOrderIds
        - cancelledDriverTaskIds
        - dispositions
        - supersededLineCount
        - supersededRentalUnitCount
        - replay
      properties:
        inventoryId: { type: string, format: uuid }
        finalPlanVersion: { type: integer, format: int64, minimum: 1 }
        supersededDocumentIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        supersededRentalOrderIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        cancelledDriverTaskIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        dispositions:
          type: array
          description: Every stored disposition marker and any created or exact-source reused document facts.
          items: { $ref: "#/components/schemas/InventoryDispositionResult" }
        supersededLineCount: { type: integer, format: int64, minimum: 0 }
        supersededRentalUnitCount: { type: integer, format: int64, minimum: 0 }
        replay: { type: boolean }
    LogisticsDocumentState:
      type: string
      enum:
        [
          DRAFT,
          REGISTERING,
          INSPECTION_REQUIRED,
          ACCEPTING,
          ACCEPTED,
          ESTIMATE_PENDING,
          ESTIMATE_REQUESTED,
          PREPARING,
          AWAITING_CONFIRMATION,
          CONFIRMING_PREPARATION,
          SHIPPED,
          CANCELLING,
          DEPARTING,
          IN_TRANSIT,
          ARRIVING,
          COMPLETED,
          CANCELLED,
          CONFLICT,
          RECONCILIATION_REQUIRED,
        ]
    LogisticsDocument:
      type: object
      additionalProperties: false
      allOf:
        - $ref: "#/components/schemas/LogisticsDocumentDeliveryPurposeInvariant"
      required:
        [
          id,
          version,
          documentType,
          customerDeliveryPurpose,
          state,
          warehouseId,
          destinationWarehouseId,
          linkedReturnTransferId,
          partySnapshot,
          driverSnapshot,
          driverWorkerId,
          clientId,
          historicalRentalImport,
          equipmentMovementTaskId,
          scheduledDate,
          rentalOrderId,
          rentalShipmentId,
          inventorySourceId,
          inventorySourceFindingId,
          inventorySourceDispositionKind,
          lines,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        documentType: { type: string, enum: [RETURN, SHIPMENT, TRANSFER] }
        customerDeliveryPurpose:
          anyOf:
            - { $ref: "#/components/schemas/CustomerDeliveryPurpose" }
            - { type: "null" }
        state: { $ref: "#/components/schemas/LogisticsDocumentState" }
        warehouseId: { type: string, format: uuid }
        destinationWarehouseId: { type: [string, "null"], format: uuid }
        linkedReturnTransferId:
          type: [string, "null"]
          format: uuid
          description: >-
            Reverse concrete-line transfer created atomically for selected capital-repair cabins;
            null for ordinary documents and reads that have no linked return leg.
        partySnapshot:
          {
            type: [string, "null"],
            maxLength: 512,
            description: Immutable,
            trimmed workflow snapshot; no directory identity.,
          }
        driverSnapshot:
          {
            type: [string, "null"],
            maxLength: 512,
            description: Immutable,
            trimmed workflow snapshot; no directory identity.,
          }
        driverWorkerId:
          {
            type: [string, "null"],
            format: uuid,
            description: Opaque task-board worker identity selected for driver work; null for legacy or unassigned documents.,
          }
        clientId:
          {
            type: [string, "null"],
            format: uuid,
            description: Client bound to the return or shipment.,
          }
        historicalRentalImport:
          {
            type: boolean,
            description: True when this document was entered as a past physical rental operation without creating a driver task; a shipment may still retain optional driver audit metadata.,
          }
        equipmentMovementTaskId:
          {
            type: [string, "null"],
            format: uuid,
            description: Server-created task that moves transfer furniture between warehouses.,
          }
        scheduledDate:
          {
            type: [string, "null"],
            format: date,
            description: Assigned shipment, return pickup, or transfer task date; absent while waiting for scheduling.,
          }
        rentalOrderId:
          {
            type: [string, "null"],
            format: uuid,
            description: Order whose shipment/return lifecycle owns this document.,
          }
        rentalShipmentId:
          {
            type: [string, "null"],
            format: uuid,
          description: Shipment that produced this cabin-level rental return; null for shipments and generic documents.,
          }
        inventorySourceId:
          {
            type: [string, "null"],
            format: uuid,
            description: Completed inventory that directly created this historical document.,
          }
        inventorySourceFindingId: { type: [string, "null"], format: uuid }
        inventorySourceDispositionKind:
          { type: [string, "null"], enum: [LOCAL, SHIPMENT, null] }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/LogisticsLine" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LogisticsDocumentHistory:
      type: object
      additionalProperties: false
      required: [documentId, warehouseId, documentType, documentVersion, lines, events, nextAfterVersion]
      properties:
        documentId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        documentType: { type: string, enum: [RETURN, SHIPMENT] }
        documentVersion: { type: integer, format: int64, minimum: 0 }
        lines:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/LogisticsHistoryLine" }
        events:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/LogisticsHistoryEvent" }
        nextAfterVersion: { type: [integer, "null"], format: int64, minimum: 0 }
    LogisticsHistoryLine:
      type: object
      additionalProperties: false
      required: [lineId, assetId, contentsBeforeOperation, contentsAfterOperation, returnAcceptance, inventoryShipmentFurniture]
      properties:
        lineId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        contentsBeforeOperation:
          description: Saved before return intake or shipment preparation, not a final shipped manifest.
          oneOf:
            - { $ref: "#/components/schemas/LogisticsHistoryContents" }
            - { type: "null" }
        contentsAfterOperation:
          description: >-
            Immutable ledger contents returned by asset-service after return registration or
            shipment confirmation. Unlike the pre-preparation snapshot, a shipment snapshot includes
            its confirmed equipment changes. Null when no such response was captured, including
            older shipments; never backfilled from current cabin contents. Not an independent
            physical inspection or proof that remaining saga steps succeeded.
          oneOf:
            - { $ref: "#/components/schemas/LogisticsHistoryContents" }
            - { type: "null" }
        returnAcceptance:
          description: Submitted undamaged-acceptance confirmation and extras; does not assert saga completion.
          oneOf:
            - type: object
              additionalProperties: false
              required: [equipmentConfirmed, additionalEquipment]
              properties:
                equipmentConfirmed: { type: boolean, const: true }
                additionalEquipment:
                  type: array
                  items: { $ref: "#/components/schemas/ReturnAdditionalEquipmentRequest" }
            - { type: "null" }
        inventoryShipmentFurniture:
          description: Reviewed historical inventory shipment composition, when captured.
          oneOf:
            - type: array
              maxItems: 100
              items: { $ref: "#/components/schemas/InventoryShipmentFurniture" }
            - { type: "null" }
    LogisticsHistoryContents:
      type: object
      additionalProperties: false
      required: [contents]
      description: Null means not recorded; an empty contents array means a recorded empty composition.
      properties:
        contents:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [equipmentId, quantity]
            properties:
              equipmentId: { type: string, format: uuid }
              quantity: { type: integer, format: int64, minimum: 0 }
    LogisticsHistoryEvent:
      type: object
      additionalProperties: false
      required: [eventId, aggregateVersion, eventType, occurredAt, recordedAt, baseline, recordedActor, state, resultCode]
      properties:
        eventId: { type: string, format: uuid }
        aggregateVersion: { type: integer, format: int64, minimum: 0 }
        eventType: { type: string }
        occurredAt: { type: [string, "null"], format: date-time }
        recordedAt: { type: string, format: date-time }
        baseline:
          type: boolean
          description: Baseline facts have no occurredAt and do not prove a new physical operation.
        recordedActor:
          description: >-
            Journal attribution, not necessarily the physical executor. Background completion may
            retain the document creator. logistics.return.acceptance-started.v1 and
            logistics.return.estimate-started.v1 identify the actual command actor; clients must not
            present the actor of logistics.return.accepted.v1 as the acceptance operator.
          oneOf:
            - type: object
              additionalProperties: false
              required: [subjectId, principalType]
              properties:
                subjectId: { type: string, format: uuid }
                principalType: { type: string }
                profileRevision: { type: [string, "null"] }
            - { type: "null" }
        state: { $ref: "#/components/schemas/LogisticsDocumentState" }
        resultCode: { type: [string, "null"] }
    CustomerDeliveryPurpose:
      type: string
      enum: [RENTAL_DELIVERY, SALE_DELIVERY, CUSTOMER_RELOCATION]
      description: >-
        Customer-facing commercial purpose of a SHIPMENT. It is independent from the physical
        document type; warehouse-to-warehouse work remains TRANSFER.
    LogisticsDocumentDeliveryPurposeInvariant:
      type: object
      oneOf:
        - title: Customer shipment
          required: [documentType, customerDeliveryPurpose]
          properties:
            documentType: { type: string, const: SHIPMENT }
            customerDeliveryPurpose: { $ref: "#/components/schemas/CustomerDeliveryPurpose" }
        - title: Return or warehouse transfer
          required: [documentType, customerDeliveryPurpose]
          properties:
            documentType: { type: string, enum: [RETURN, TRANSFER] }
            customerDeliveryPurpose: { type: "null" }
    LogisticsLine:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          lineNumber,
          assetId,
          assetVersion,
          state,
          tenantSnapshot,
          rentalOrderId,
          inventorySourceWarehouseId,
          inventoryShipmentFurniture,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        lineNumber: { type: integer, minimum: 1 }
        assetId: { type: string, format: uuid }
        assetVersion: { type: integer, minimum: 0 }
        state:
          {
            type: string,
            enum:
              [
                PENDING,
                DEPARTING,
                DEPARTED,
                ARRIVING,
                ARRIVED,
                CONFLICT,
                CANCELLED,
              ],
          }
        tenantSnapshot: { type: [string, "null"], maxLength: 512 }
        rentalOrderId:
          {
            type: [string, "null"],
            format: uuid,
            description: Rental order that owns the return or shipment cabin reservation.,
          }
        inventorySourceWarehouseId:
          {
            type: string,
            format: uuid,
            description: Physical warehouse that owned this cabin at outbound planning; independent from the document service warehouse.,
          }
        inventoryShipmentFurniture:
          oneOf:
            - type: array
              maxItems: 100
              items: { $ref: "#/components/schemas/InventoryShipmentFurniture" }
            - { type: "null" }
    EquipmentMovementLocationKind:
      type: string
      enum: [STOCK, CABIN_NON_RENTED, CABIN_RENTED]
    EquipmentMovementTaskState:
      type: string
      enum:
        [
          RESERVING,
          REGISTERING_TASK,
          AWAITING_WORKER,
          EXECUTING,
          CANCELLING,
          COMPLETED,
          CANCELLED,
          EXPIRED,
          CONFLICT,
          RECONCILIATION_REQUIRED,
        ]
    EquipmentMovementTaskOwnerType:
      type: string
      enum: [USER_REQUEST, MAINTENANCE_DISPOSITION]
    EquipmentMovementLineState:
      type: string
      enum: [PENDING_RESERVATION, RESERVED, EXECUTED, RELEASED]
    EquipmentMovementLineRequest:
      type: object
      additionalProperties: false
      required:
        [
          equipmentId,
          sourceRentalItemId,
          sourceLocationKind,
          expectedSourceBalanceVersion,
          targetRentalItemId,
          targetLocationKind,
          quantity,
        ]
      properties:
        equipmentId: { type: string, format: uuid }
        sourceRentalItemId: { type: [string, "null"], format: uuid }
        sourceLocationKind:
          { $ref: "#/components/schemas/EquipmentMovementLocationKind" }
        expectedSourceBalanceVersion:
          { type: integer, format: int64, minimum: 0 }
        targetRentalItemId: { type: [string, "null"], format: uuid }
        targetLocationKind:
          { $ref: "#/components/schemas/EquipmentMovementLocationKind" }
        quantity: { type: integer, format: int64, minimum: 1 }
    CreateEquipmentMovementTaskRequest:
      type: object
      additionalProperties: false
      required:
        [
          warehouseId,
          targetWarehouseId,
          unitNumber,
          plannedDurationMinutes,
          deadlineAt,
          lines,
        ]
      properties:
        warehouseId: { type: string, format: uuid }
        targetWarehouseId:
          {
            type: [string, "null"],
            format: uuid,
            description: Target warehouse for STOCK-to-STOCK movement; omitted means the source warehouse.,
          }
        unitNumber: { type: [string, "null"], maxLength: 64 }
        plannedDurationMinutes: { type: integer, minimum: 1 }
        deadlineAt: { type: string, format: date-time }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          description: >-
            At most one hundred worker operations are accepted. A cabin-to-cabin line produces
            two operations (take out and bring in); a stock/cabin line produces one.
          items: { $ref: "#/components/schemas/EquipmentMovementLineRequest" }
    CreateMaintenanceEquipmentMovementTaskRequest:
      type: object
      additionalProperties: false
      required:
        [
          decisionId,
          warehouseId,
          unitNumber,
          plannedDurationMinutes,
          deadlineAt,
          lines,
        ]
      properties:
        decisionId:
          { type: string, format: uuid, description: Permanent maintenance disposition owner. }
        warehouseId: { type: string, format: uuid }
        unitNumber: { type: string, minLength: 1, maxLength: 64 }
        plannedDurationMinutes: { type: integer, minimum: 1 }
        deadlineAt: { type: string, format: date-time }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          description: >-
            Each unique equipment line moves a positive quantity from this decision's cabin
            CABIN_NON_RENTED balance to STOCK in the same warehouse. Zero lines are omitted.
          items: { $ref: "#/components/schemas/MaintenanceEquipmentMovementLineRequest" }
    MaintenanceEquipmentMovementLineRequest:
      type: object
      additionalProperties: false
      required: [equipmentId, sourceRentalItemId, expectedSourceBalanceVersion, quantity]
      properties:
        equipmentId: { type: string, format: uuid }
        sourceRentalItemId: { type: string, format: uuid }
        expectedSourceBalanceVersion: { type: integer, format: int64, minimum: 0 }
        quantity: { type: integer, format: int64, minimum: 1 }
    CancelEquipmentMovementTaskRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    EquipmentMovementTaskLine:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          lineNumber,
          equipmentId,
          equipmentName,
          sourceWarehouseId,
          sourceRentalItemId,
          sourceLocationKind,
          expectedSourceBalanceVersion,
          targetWarehouseId,
          targetRentalItemId,
          targetLocationKind,
          quantity,
          reservationId,
          reservationVersion,
          state,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        lineNumber: { type: integer, minimum: 1 }
        equipmentId: { type: string, format: uuid }
        equipmentName: { type: [string, "null"], maxLength: 512 }
        sourceWarehouseId: { type: string, format: uuid }
        sourceRentalItemId: { type: [string, "null"], format: uuid }
        sourceLocationKind:
          { $ref: "#/components/schemas/EquipmentMovementLocationKind" }
        expectedSourceBalanceVersion:
          { type: integer, format: int64, minimum: 0 }
        targetWarehouseId: { type: string, format: uuid }
        targetRentalItemId: { type: [string, "null"], format: uuid }
        targetLocationKind:
          { $ref: "#/components/schemas/EquipmentMovementLocationKind" }
        quantity: { type: integer, format: int64, minimum: 1 }
        reservationId: { type: [string, "null"], format: uuid }
        reservationVersion:
          { type: [integer, "null"], format: int64, minimum: 0 }
        state: { $ref: "#/components/schemas/EquipmentMovementLineState" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EquipmentMovementTask:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          warehouseId,
          ownerType,
          ownerId,
          externalTaskId,
          taskBoardTaskId,
          taskBoardTaskVersion,
          taskBoardDoneAt,
          unitNumber,
          plannedDurationMinutes,
          deadlineAt,
          state,
          terminalState,
          failureCode,
          lines,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        ownerType: { $ref: "#/components/schemas/EquipmentMovementTaskOwnerType" }
        ownerId:
          type: [string, "null"]
          format: uuid
          description: decisionId for MAINTENANCE_DISPOSITION; null for USER_REQUEST.
        externalTaskId: { type: string, format: uuid }
        taskBoardTaskId: { type: [string, "null"], format: uuid }
        taskBoardTaskVersion:
          { type: [integer, "null"], format: int64, minimum: 0 }
        taskBoardDoneAt: { type: [string, "null"], format: date-time }
        unitNumber: { type: [string, "null"], maxLength: 64 }
        plannedDurationMinutes: { type: integer, minimum: 1 }
        deadlineAt: { type: string, format: date-time }
        state: { $ref: "#/components/schemas/EquipmentMovementTaskState" }
        terminalState:
          oneOf:
            - { $ref: "#/components/schemas/EquipmentMovementTaskState" }
            - { type: "null" }
        failureCode: { type: [string, "null"], maxLength: 96 }
        lines:
          type: array
          items: { $ref: "#/components/schemas/EquipmentMovementTaskLine" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DriverTaskKind:
      type: string
      enum:
        [DELIVER_TO_REPAIR, REMOVE_FROM_REPAIR, CAPITAL_TO_PRODUCTION, GENERAL_MOVEMENT, SHIPMENT, RETURN, TRANSFER]
    DriverTaskSourceType:
      type: string
      enum:
        [REPAIR, ESTIMATE, INVENTORY, REPAIR_PLACE, CAPITAL_REPAIR, MANUAL, LOGISTICS_DOCUMENT, LOGISTICS_DOCUMENT_LINE]
    DriverTaskAudienceMode:
      type: string
      enum: [UNASSIGNED, ASSIGNED_DRIVER, WAREHOUSE_DRIVERS]
    DriverTaskAudience:
      type: object
      additionalProperties: false
      required: [mode, workerId, workerName]
      properties:
        mode: { $ref: "#/components/schemas/DriverTaskAudienceMode" }
        workerId:
          type: [string, "null"]
          format: uuid
          description: Required for ASSIGNED_DRIVER; always null for UNASSIGNED and WAREHOUSE_DRIVERS.
        workerName:
          type: [string, "null"]
          maxLength: 512
          description: Immutable display snapshot paired with workerId.
      allOf:
        - if:
            properties: { mode: { const: ASSIGNED_DRIVER } }
            required: [mode]
          then:
            properties:
              workerId: { type: string, format: uuid }
              workerName: { type: string, minLength: 1, maxLength: 512 }
        - if:
            properties: { mode: { enum: [UNASSIGNED, WAREHOUSE_DRIVERS] } }
            required: [mode]
          then:
            properties:
              workerId: { type: "null" }
              workerName: { type: "null" }
    DriverTaskPlanningMode:
      type: string
      enum: [AUTO, FIXED_DATE]
    DriverTaskState:
      type: string
      enum:
        [REGISTERING, SCHEDULED, CURRENT, FINALIZING, COMPLETED, CANCELLED, RECONCILIATION_REQUIRED]
    DriverTripDesiredEquipment:
      type: object
      additionalProperties: false
      required: [equipmentId, equipmentName, quantity]
      properties:
        equipmentId: { type: string, format: uuid }
        equipmentName: { type: string, minLength: 1, maxLength: 512 }
        quantity: { type: integer, format: int64, minimum: 1 }
    DriverTripActualEquipment:
      type: object
      additionalProperties: false
      required: [equipmentId, equipmentName, quantity, locationKind]
      properties:
        equipmentId: { type: string, format: uuid }
        equipmentName: { type: [string, "null"], maxLength: 512 }
        quantity: { type: integer, format: int64, minimum: 0 }
        locationKind: { type: string }
    DriverTripCabin:
      type: object
      additionalProperties: false
      required:
        [cabinId, unitNumber, desiredContents, actualContents, movementTaskCreated, movementTaskCompleted, contentReady]
      properties:
        cabinId: { type: string, format: uuid }
        unitNumber: { type: string, minLength: 1, maxLength: 64 }
        desiredContents:
          type: array
          items: { $ref: "#/components/schemas/DriverTripDesiredEquipment" }
        actualContents:
          type: [array, "null"]
          description: Null only in the bounded local board-card projection; the detail endpoint returns live contents.
          items: { $ref: "#/components/schemas/DriverTripActualEquipment" }
        movementTaskCreated: { type: boolean }
        movementTaskCompleted: { type: boolean }
        contentReady:
          type: [boolean, "null"]
          description: Null only when the local board snapshot cannot prove readiness without a live asset read.
    DriverTripDetails:
      type: object
      additionalProperties: false
      required:
        [taskNumber, tripNumber, operationType, customerDeliveryPurpose, clientName, clientType, address, latitude, longitude, primaryContactName, primaryContactPhone, additionalContacts, comment, desiredDeliveryWindows, scheduledDate, provisionalEta, provisionalEtaApproximate, provisionalEtaSourcePlanId, provisionalEtaSourcePlanVersion, cabins]
      properties:
        taskNumber: { type: string, minLength: 1, maxLength: 64 }
        tripNumber: { type: integer, minimum: 1 }
        operationType: { type: string }
        customerDeliveryPurpose:
          anyOf:
            - { $ref: "#/components/schemas/CustomerDeliveryPurpose" }
            - { type: "null" }
        clientName: { type: string, minLength: 1, maxLength: 512 }
        clientType: { $ref: "#/components/schemas/ClientType" }
        address: { type: [string, "null"], maxLength: 1000 }
        latitude: { type: [number, "null"], format: double, minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], format: double, minimum: -180, maximum: 180 }
        primaryContactName: { type: [string, "null"], maxLength: 512 }
        primaryContactPhone:
          type: [string, "null"]
          maxLength: 16
          pattern: '^\+[1-9][0-9]{6,14}$'
        additionalContacts:
          type: array
          items: { $ref: "#/components/schemas/AdditionalContact" }
        comment: { type: [string, "null"], maxLength: 2000 }
        desiredDeliveryWindows:
          type: array
          items: { $ref: "#/components/schemas/DesiredDeliveryWindow" }
        scheduledDate: { type: string, format: date }
        provisionalEta:
          type: [string, "null"]
          format: date-time
          description: Approximate future preview from the exact feasible planner source, never GPS ETA.
        provisionalEtaApproximate: { type: boolean }
        provisionalEtaSourcePlanId: { type: [string, "null"], format: uuid }
        provisionalEtaSourcePlanVersion:
          type: [integer, "null"]
          format: int64
          minimum: 1
        cabins:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/DriverTripCabin" }
    MaintenanceDriverTaskCompensationOutcome:
      type: string
      enum:
        [ABSENT, PENDING, CANCELLED, STARTED, COMPLETED, RECONCILIATION_REQUIRED]
    MaintenanceDriverTaskCompensation:
      type: object
      additionalProperties: false
      required:
        [
          repairId,
          kind,
          outcome,
          taskId,
          taskVersion,
          state,
          externalTaskId,
          taskBoardTaskId,
          taskBoardTaskVersion,
          taskBoardEntryId,
          taskBoardEntryVersion,
          taskBoardEntryStatus,
          taskBoardStatus,
          taskBoardLane,
          taskBoardDoneAt,
          repairPlaceAllocationId,
          repairPlaceAllocationVersion,
        ]
      properties:
        repairId: { type: string, format: uuid }
        kind:
          type: string
          enum: [DELIVER_TO_REPAIR, CAPITAL_TO_PRODUCTION]
        outcome:
          { $ref: "#/components/schemas/MaintenanceDriverTaskCompensationOutcome" }
        taskId: { type: [string, "null"], format: uuid }
        taskVersion: { type: [integer, "null"], format: int64, minimum: 0 }
        state:
          oneOf:
            - { $ref: "#/components/schemas/DriverTaskState" }
            - { type: "null" }
        externalTaskId: { type: [string, "null"], format: uuid }
        taskBoardTaskId: { type: [string, "null"], format: uuid }
        taskBoardTaskVersion:
          { type: [integer, "null"], format: int64, minimum: 0 }
        taskBoardEntryId: { type: [string, "null"], format: uuid }
        taskBoardEntryVersion:
          { type: [integer, "null"], format: int64, minimum: 0 }
        taskBoardEntryStatus: { type: [string, "null"], maxLength: 24 }
        taskBoardStatus: { type: [string, "null"], maxLength: 24 }
        taskBoardLane: { type: [string, "null"], maxLength: 24 }
        taskBoardDoneAt: { type: [string, "null"], format: date-time }
        repairPlaceAllocationId: { type: [string, "null"], format: uuid }
        repairPlaceAllocationVersion:
          { type: [integer, "null"], format: int64, minimum: 0 }
    CreateDriverTaskRequest:
      type: object
      additionalProperties: false
      required:
        [warehouseId, cabinId, repairId, sourceType, sourceId, kind, planningMode, scheduledDate, priority, activateNow]
      properties:
        warehouseId: { type: string, format: uuid }
        cabinId: { type: string, format: uuid }
        repairId: { type: [string, "null"], format: uuid }
        sourceType: { $ref: "#/components/schemas/DriverTaskSourceType" }
        sourceId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/DriverTaskKind" }
        planningMode: { $ref: "#/components/schemas/DriverTaskPlanningMode" }
        scheduledDate:
          description: >-
            Required only for FIXED_DATE and forbidden for AUTO. This is the
            immutable requested date; private maintenance intake can return a
            later effective date for an overdue request.
          type: [string, "null"]
          format: date
        priority: { type: integer, minimum: 1, maximum: 5 }
        activateNow:
          type: boolean
          description: Used by an explicit drag into CURRENT; DELIVER_TO_REPAIR still requires a free or paired repair place.
        comment:
          type: [string, "null"]
          maxLength: 1000
          description: Required and nonblank for MANUAL / GENERAL_MOVEMENT; optional for other task sources.
    DriverTask:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          warehouseId,
          cabinId,
          repairId,
          sourceType,
          sourceId,
          kind,
          planningMode,
          scheduledDate,
          priority,
          comment,
          unitNumber,
          driverQueueDefinitionId,
          driverAudienceMode,
          plannedDriverWorkerId,
          plannedDriverNameSnapshot,
          externalTaskId,
          taskBoardTaskId,
          taskBoardTaskVersion,
          taskBoardEntryId,
          taskBoardEntryStatus,
          taskBoardDoneAt,
          state,
          repairPlaceAllocationId,
          repairPlaceAllocationVersion,
          completionMediaId,
          completionMediaGeneration,
          coverApplied,
          repairPlaceEffectApplied,
          failureCode,
          createdAt,
          updatedAt,
          completedAt,
          tripDetails,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        cabinId: { type: string, format: uuid }
        repairId: { type: [string, "null"], format: uuid }
        sourceType: { $ref: "#/components/schemas/DriverTaskSourceType" }
        sourceId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/DriverTaskKind" }
        planningMode: { $ref: "#/components/schemas/DriverTaskPlanningMode" }
        scheduledDate:
          type: string
          format: date
          description: >-
            Logistics-owned effective execution date. For an overdue private
            maintenance FIXED_DATE create or replay it may be later than the
            immutable date in the request.
        priority: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, "null"], maxLength: 1000 }
        unitNumber: { type: string, minLength: 1, maxLength: 64 }
        driverQueueDefinitionId: { type: string, format: uuid }
        driverAudienceMode: { $ref: "#/components/schemas/DriverTaskAudienceMode" }
        plannedDriverWorkerId: { type: [string, "null"], format: uuid }
        plannedDriverNameSnapshot: { type: [string, "null"], maxLength: 512 }
        externalTaskId: { type: string, format: uuid }
        taskBoardTaskId: { type: [string, "null"], format: uuid }
        taskBoardTaskVersion: { type: [integer, "null"], format: int64, minimum: 0 }
        taskBoardEntryId: { type: [string, "null"], format: uuid }
        taskBoardEntryStatus: { type: [string, "null"], maxLength: 24 }
        taskBoardDoneAt: { type: [string, "null"], format: date-time }
        state: { $ref: "#/components/schemas/DriverTaskState" }
        repairPlaceAllocationId: { type: [string, "null"], format: uuid }
        repairPlaceAllocationVersion: { type: [integer, "null"], format: int64, minimum: 0 }
