      responses:
        "200":
          description: Authorized no-store cabin image.
          headers:
            X-Content-Type-Options:
              required: true
              schema: { type: string, const: nosniff }
          content:
            image/*:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/customer/v1/delivery-slots/search:
    post:
      operationId: searchCustomerDeliverySlots
      description: >-
        Calculates and persists only currently feasible fixed delivery windows using exact truck
        travel times, configured drivers and the complete held/confirmed workload. Tariff-zone
        polygons classify the delivery price only and never participate in route feasibility.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerDeliverySlotSearchRequest" }
      responses:
        "200":
          description: Current feasible delivery-slot offers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomerDeliverySlot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/customer/v1/delivery-slots/{slotId}/hold:
    parameters:
      - $ref: "#/components/parameters/CustomerDeliverySlotId"
    post:
      operationId: holdCustomerDeliverySlot
      description: Rechecks route capacity and holds one offer under slot and cart version fences.
      parameters:
        - $ref: "#/components/parameters/ExpectedCustomerDeliverySlotVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HoldCustomerDeliverySlotRequest" }
      responses:
        "200":
          description: Held slot and the cart version containing its identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeldCustomerDeliverySlot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/customer/v1/inquiries/{inquiryId}/checkout:
    parameters:
      - $ref: "#/components/parameters/InquiryId"
    post:
      operationId: checkoutCustomerInquiry
      description: >-
        Idempotently converts current cabin holds, furniture intent and a held route window into
        one durable rental booking and saved real order. Pending and rejected outcomes are
        represented by the response status field and can be reconciled by replay.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerCheckoutRequest" }
      responses:
        "200":
          description: Current durable booking outcome, including pending or rejected state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerBooking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/customer/v1/bookings:
    get:
      operationId: listCustomerBookings
      description: Lists durable booking outcomes owned by the authenticated CustomerApp subject.
      responses:
        "200":
          description: Current customer's booking outcomes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomerBooking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/customer/v1/bookings/{bookingId}/change-quotes:
    parameters:
      - $ref: "#/components/parameters/CustomerBookingId"
    post:
      operationId: createCustomerBookingChangeQuote
      description: >-
        Quotes one customer-initiated change under the exact booking and replacement-slot fences.
        Notice is measured in calendar dates of the canonical warehouse timezone (default two),
        not rolling 48 hours. Percentage uses the original confirmed delivery price and rounds
        HALF_UP once to whole RUB. Missing policy remains unavailable, not zero. The immutable
        quote expires after fifteen minutes or at the next warehouse-local midnight, whichever
        comes first. Creation neither changes capacity nor settles a fee.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCustomerBookingChangeQuoteRequest" }
      responses:
        "200":
          description: Exact quote or its idempotent replay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerBookingChangeQuote" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/customer/v1/bookings/{bookingId}/change-quotes/{quoteId}:
    parameters:
      - $ref: "#/components/parameters/CustomerBookingId"
      - name: quoteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getCustomerBookingChangeQuote
      description: >-
        Reads the exact customer-owned application and settlement, including after a lost response.
        APPLYING is not payment success. TEST_PAID is recorded only when the linked booking mutation
        completes; it is explicitly simulated and does not move real money.
      responses:
        "200":
          description: Durable quote and exact linked application result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerBookingChangeQuote" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/customer/v1/bookings/{bookingId}/cancel:
    parameters:
      - $ref: "#/components/parameters/CustomerBookingId"
    post:
      operationId: cancelCustomerBooking
      description: >-
        Idempotently cancels only a completed CustomerApp checkout whose SAVED order, shipment
        draft and furniture preparation have not started. The durable response may remain
        CANCELLATION_PENDING while existing order/asset release recovery continues. The exact
        accepted quote is bound to this mutation before external effects. Test settlement is
        recorded only together with durable completion; a pending cancellation is not paid.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelCustomerBookingRequest" }
      responses:
        "200":
          description: Current durable cancellation outcome or exact idempotent replay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerBooking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/customer/v1/bookings/{bookingId}/delivery-slots/search:
    parameters:
      - $ref: "#/components/parameters/CustomerBookingId"
    post:
      operationId: searchCustomerBookingRescheduleSlots
      description: >-
        Recalculates replacement slots from the completed order's exact cabins, address, route
        profile and current confirmed slot. The original cart and cabin/furniture selection are
        never reopened or accepted from the client.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchCustomerBookingRescheduleRequest" }
      responses:
        "200":
          description: Feasible replacement slot offers with the current slot excluded from workload.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomerDeliverySlot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/customer/v1/bookings/{bookingId}/reschedule:
    parameters:
      - $ref: "#/components/parameters/CustomerBookingId"
    post:
      operationId: rescheduleCustomerBooking
      description: >-
        Idempotently and atomically rechecks a freshly calculated offer, replaces the SAVED
        order's desired delivery date and confirms the new slot before committing release of the
        old slot. On any failure the original confirmed slot and order date remain unchanged.
        The customer must submit the exact accepted quote and explicit test-payment consent when
        required. Settlement and slot replacement commit atomically; a stale/full slot is not paid.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RescheduleCustomerBookingRequest" }
      responses:
        "200":
          description: Rescheduled booking or exact idempotent replay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerBooking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/customer/v1/bookings/{bookingId}/cabins/{cabinId}/acceptance:
    parameters:
      - $ref: "#/components/parameters/CustomerBookingId"
      - $ref: "#/components/parameters/CabinId"
    post:
      operationId: acceptCustomerBookingCabin
      description: >-
        Idempotently accepts one cabin only after its authoritative shipment driver task is
        COMPLETED. The bounded normalized vector signature is retained by logistics; no image or
        browser-owned acceptance state is accepted.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptCustomerCabinRequest" }
      responses:
        "200":
          description: Newly committed acceptance or exact idempotent replay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCabinAcceptance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/customer/v1/bookings/{bookingId}/cabins/{cabinId}/problems:
    parameters:
      - $ref: "#/components/parameters/CustomerBookingId"
      - $ref: "#/components/parameters/CabinId"
    post:
      operationId: reportCustomerBookingCabinProblem
      description: >-
        Idempotently reports a missing-equipment, unsuitable-cabin, or other problem after the
        cabin has arrived. A report may precede acceptance or be added after acceptance. Every
        referenced media generation must already be READY under this cabin's exact shipment line.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportCustomerCabinProblemRequest" }
      responses:
        "201":
          description: New immutable problem report or exact idempotent replay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCabinProblem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/customer-cabin-problems:
    get:
      operationId: listCustomerCabinProblems
      description: >-
        Lists only customer cabin problem claims visible to the authenticated actor. The compact
        context is a current order/client projection; immutable evidence and
        lifecycle actions remain owned by logistics.
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/CustomerCabinProblemClaimStatus" }
      responses:
        "200":
          description: Visible customer cabin problem claims ordered by the resolution deadline.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomerCabinProblemClaim" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/logistics/v1/customer-cabin-problems/{problemId}:
    parameters:
      - $ref: "#/components/parameters/CustomerCabinProblemId"
    get:
      operationId: getCustomerCabinProblem
      responses:
        "200":
          description: One visible customer cabin problem claim and its immutable lifecycle history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCabinProblemClaim" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/customer-cabin-problems/{problemId}/start-progress:
    parameters:
      - $ref: "#/components/parameters/CustomerCabinProblemId"
    post:
      operationId: startCustomerCabinProblem
      description: >-
        Moves an OPEN claim to IN_PROGRESS under its explicit optimistic version fence. It records
        a local immutable lifecycle action and does not silently alter a customer commitment.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartCustomerCabinProblemRequest" }
      responses:
        "200":
          description: Updated warehouse-fenced claim.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCabinProblemClaim" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/customer-cabin-problems/{problemId}/resolve:
    parameters:
      - $ref: "#/components/parameters/CustomerCabinProblemId"
    post:
      operationId: resolveCustomerCabinProblem
      description: >-
        Records a selected remedy for an IN_PROGRESS claim under its explicit optimistic version
        fence. It records the decision only; execution of a discount, replacement or return stays
        with its existing owner and cannot be inferred by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveCustomerCabinProblemRequest" }
      responses:
        "200":
          description: Resolved warehouse-fenced claim.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCabinProblemClaim" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/{documentType}/{documentId}/reconcile:
    parameters:
      - $ref: "#/components/parameters/DocumentTypePath"
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: reconcileDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconcileRequest" }
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    HistoryAfterVersion:
      name: afterVersion
      in: query
      required: false
      description: Exclusive aggregate-version cursor; -1 starts with the earliest recorded fact.
      schema: { type: integer, format: int64, minimum: -1, default: -1 }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LineId:
      name: lineId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentTypePath:
      name: documentType
      in: path
      required: true
      schema: { type: string, enum: [returns, shipments, transfers] }
    WarehouseIdQuery:
      name: warehouseId
      in: query
      required: true
      schema: { type: string, format: uuid }
    ScheduledDateQuery:
      name: scheduledDate
      in: query
      required: false
      description: >-
        Exact business date in the selected warehouse timezone. Active operation pages always
        provide it; omission remains available for bounded relationship lookups.
      schema: { type: string, format: date }
    DocumentAssetIdQuery:
      name: assetId
      in: query
      required: false
      description: Cabin identity matched against document lines before paging. Does not change warehouse authorization.
      schema: { type: string, format: uuid }
    PageQuery:
      name: page
      in: query
      required: false
      description: Zero-based document page number.
      schema: { type: integer, minimum: 0, default: 0 }
    PageSizeQuery:
      name: size
      in: query
      required: false
      description: Number of documents returned in one bounded page.
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    ExpectedVersion:
      name: expectedVersion
      in: query
      required: true
      schema: { type: integer, minimum: 0 }
    ExpectedLineVersion:
      name: expectedLineVersion
      in: query
      required: true
      schema: { type: integer, minimum: 0 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    CustomerBookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CustomerCabinProblemId:
      name: problemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UnitId:
      name: unitId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EquipmentId:
      name: equipmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EquipmentMovementTaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DriverTaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InquiryId:
      name: inquiryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CustomerDeliverySlotId:
      name: slotId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExpectedCustomerDeliverySlotVersion:
      name: expectedSlotVersion
      in: query
      required: true
      schema: { type: integer, format: int64, minimum: 0 }
    PublicPresentationToken:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 40, maxLength: 256 }
    PresentationBookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CabinId:
      name: cabinId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaGeneration:
      name: generation
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    MediaVariant:
      name: variant
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
  schemas:
    CustomerEntityType:
      type: string
      enum: [INDIVIDUAL, LEGAL]
    CreateCustomerProfileRequest:
      type: object
      additionalProperties: false
      required: [entityType, phone]
      properties:
        entityType: { $ref: "#/components/schemas/CustomerEntityType" }
        firstName: { type: [string, "null"], maxLength: 255 }
        lastName: { type: [string, "null"], maxLength: 255 }
        companyName: { type: [string, "null"], maxLength: 512 }
        phone: { type: string, minLength: 1, maxLength: 32 }
        email: { type: [string, "null"], maxLength: 320 }
        additionalInfo: { type: [string, "null"], maxLength: 2000 }
      oneOf:
        - properties:
            entityType: { const: INDIVIDUAL }
            companyName: { type: [string, "null"], maxLength: 0 }
            firstName: { type: string, minLength: 1, maxLength: 255 }
            lastName: { type: string, minLength: 1, maxLength: 255 }
          required: [firstName, lastName]
        - properties:
            entityType: { const: LEGAL }
            companyName: { type: string, minLength: 1, maxLength: 512 }
          required: [companyName]
    UpdateCustomerProfileRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, phone]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        firstName: { type: [string, "null"], maxLength: 255 }
        lastName: { type: [string, "null"], maxLength: 255 }
        companyName: { type: [string, "null"], maxLength: 512 }
        phone: { type: string, minLength: 1, maxLength: 32 }
        email: { type: [string, "null"], maxLength: 320 }
        additionalInfo: { type: [string, "null"], maxLength: 2000 }
    PrepareCustomerProfileAvatarUploadRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, warehouseId]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
    CustomerProfileAvatarUploadScope:
      type: object
      additionalProperties: false
      required: [profileVersion, ownerType, ownerId, warehouseId, context]
      properties:
        profileVersion: { type: integer, format: int64, minimum: 0 }
        ownerType: { type: string, const: LOGISTICS_CUSTOMER_PROFILE }
        ownerId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        context: { type: string, const: PROFILE_AVATAR }
    SetCustomerProfileAvatarRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, mediaId, generation]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        mediaId: { type: string, format: uuid }
        generation: { type: integer, format: int64, minimum: 1 }
    CustomerProfileAvatar:
      type: object
      additionalProperties: false
      required: [mediaId, generation, warehouseId, thumbnailUrl, url]
      properties:
        mediaId: { type: string, format: uuid }
        generation: { type: integer, format: int64, minimum: 1 }
        warehouseId: { type: string, format: uuid }
        thumbnailUrl: { type: string, pattern: '^/api/media/v1/' }
        url: { type: string, pattern: '^/api/media/v1/' }
    CustomerProfile:
      type: object
      additionalProperties: false
      required:
        [id, version, entityType, firstName, lastName, companyName, phone, email, additionalInfo, avatar]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        entityType: { $ref: "#/components/schemas/CustomerEntityType" }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
        companyName: { type: [string, "null"] }
        phone: { type: string }
