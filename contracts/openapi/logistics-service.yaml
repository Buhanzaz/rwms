      properties:
        ownerType: { type: string, const: LOGISTICS_SHIPMENT }
        documentId: { type: string, format: uuid }
        lineId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        context: { type: string, const: SHIPMENT }
    CustomerBookingCabin:
