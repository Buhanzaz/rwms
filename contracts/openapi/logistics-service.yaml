    CustomerCart:
      type: object
      additionalProperties: false
      required: [inquiryId, warehouseId, version, state, cabins, equipment, rentalTerms, deliverySlotId]
      properties:
        inquiryId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        state:
          type: string
          enum: [ACTIVE, SELECTION_PENDING, CHECKOUT_PENDING, BOOKED]
        cabins:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/CustomerCabin" }
        equipment:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/CustomerCabinEquipmentSelection" }
        rentalTerms:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/CustomerCabinRentalTerm" }
        deliverySlotId: { type: [string, "null"], format: uuid }
    CustomerDeliverySlotSearchRequest:
      type: object
      additionalProperties: false
      required:
        [inquiryId, address, latitude, longitude, siteCabinCapacity, privateSiteAccessConfirmed, failedTripChargeAcknowledged]
      properties:
        inquiryId: { type: string, format: uuid }
        address: { type: string, minLength: 1, maxLength: 1000 }
        latitude:
          type: number
          minimum: -90
          maximum: 90
          multipleOf: 0.000001
        longitude:
          type: number
          minimum: -180
          maximum: 180
          multipleOf: 0.000001
        siteCabinCapacity:
          type: integer
          minimum: 1
          maximum: 2
          description: >-
            Maximum number of cabins the destination can accept during one vehicle arrival. One
            selects a truck without a trailer; two permits the two-cabin truck-and-trailer
            configuration. It is a routing constraint, not a tariff-zone attribute.
        privateSiteAccessConfirmed:
          type: boolean
          description: Optional early customer confirmation that the configured truck-and-trailer profile can enter and work on the private destination site. False is valid while only dates are being calculated; a true confirmation is mandatory when the slot is held.
        failedTripChargeAcknowledged:
          type: boolean
          description: Optional early acknowledgement that a false private-site access confirmation can make an unsuccessful trip chargeable under the applicable agreement. False is valid while only dates are being calculated; a true acknowledgement is mandatory when the slot is held. This API does not calculate or invent a tariff.
    CustomerRouteProfile:
      type: object
      additionalProperties: false
      required:
        [combinationHeightMeters, combinationWidthMeters, combinationLengthMeters, combinationWeightTons, axleLoadTons, axleCount]
      properties:
        combinationHeightMeters: { type: number, format: double, exclusiveMinimum: 0 }
        combinationWidthMeters: { type: number, format: double, exclusiveMinimum: 0 }
        combinationLengthMeters: { type: number, format: double, exclusiveMinimum: 0 }
        combinationWeightTons: { type: number, format: double, exclusiveMinimum: 0 }
        axleLoadTons: { type: number, format: double, exclusiveMinimum: 0 }
        axleCount: { type: integer, minimum: 2 }
    CustomerDeliverySlot:
      type: object
      additionalProperties: false
      required:
        [slotId, version, date, kind, start, end, travelZoneHours, capacityRemaining, siteCabinCapacity, deliveryPriceRubles, priceZoneId, priceIsochroneMinutes, roadRouteConfirmed, privateSiteAccessConfirmed, failedTripChargeAcknowledged, routeProfile, expiresAt, state]
      properties:
        slotId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        date: { type: string, format: date }
        kind:
          type: string
          enum: [FIXED_WINDOW, DURING_DAY]
          description: >-
            FIXED_WINDOW keeps the exact start/end as a hard arrival interval; DURING_DAY lets the
            route planner choose any feasible arrival within the still non-null full-day bounds.
        start: { type: string, format: time }
        end: { type: string, format: time }
        travelZoneHours:
          type: integer
          minimum: 1
          description: >-
            Informational depot-to-address truck travel-time band. It is neither a tariff zone nor
            a feasibility cap; the complete day schedule is always simulated exactly.
        capacityRemaining: { type: integer, minimum: 0 }
        siteCabinCapacity:
          type: integer
          minimum: 1
          maximum: 2
        deliveryPriceRubles:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: Actual delivery price from the configured isochrone tier or a historical special-zone quote.
        priceZoneId:
          type: [string, "null"]
          format: uuid
          description: Historical special-price source UUID; new offers return null.
        priceIsochroneMinutes:
          type: [integer, "null"]
          minimum: 60
          maximum: 720
          multipleOf: 60
          description: Configured one-way Valhalla tariff tier; null only on a historical special-zone quote.
        roadRouteConfirmed:
          type: boolean
          const: true
          description: True only after the routing engine found a public-road route for the frozen truck-and-trailer profile.
        privateSiteAccessConfirmed:
          type: boolean
          description: False on a provisional offer until the customer attests private-site access; true for every held or confirmed slot.
        failedTripChargeAcknowledged:
          type: boolean
          description: False on a provisional offer until the customer acknowledges failed-trip responsibility; true for every held or confirmed slot.
        routeProfile: { $ref: "#/components/schemas/CustomerRouteProfile" }
        expiresAt: { type: string, format: date-time }
        state:
          type: string
          enum: [OFFERED, HELD, CHECKOUT_PENDING, CONFIRMED, RELEASED]
    HoldCustomerDeliverySlotRequest:
      type: object
      additionalProperties: false
      required: [inquiryId, expectedVersion, siteCabinCapacity]
      properties:
        inquiryId: { type: string, format: uuid }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        siteCabinCapacity:
          type: integer
          minimum: 1
          maximum: 2
          description: Must exactly match the routing constraint used to calculate the offer.
        privateSiteAccessConfirmed:
          type: boolean
          const: true
          description: Required on hold unless the same true attestation was already attached to the compatible search offer.
        failedTripChargeAcknowledged:
          type: boolean
          const: true
          description: Required on hold unless the same true acknowledgement was already attached to the compatible search offer.
    HeldCustomerDeliverySlot:
      type: object
      additionalProperties: false
      required: [cartVersion, slot]
      properties:
        cartVersion: { type: integer, format: int64, minimum: 0 }
        slot: { $ref: "#/components/schemas/CustomerDeliverySlot" }
    CustomerCheckoutRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, slotId, slotVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        slotId: { type: string, format: uuid }
        slotVersion: { type: integer, format: int64, minimum: 0 }
    CancelCustomerBookingRequest:
      type: object
