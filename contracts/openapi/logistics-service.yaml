      properties:
        warehouseId: { type: string, format: uuid }
        rentalItemIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    CabinSelectionResponse:
      type: object
      additionalProperties: false
      required: [inquiryId, warehouseId, expiresAt, rentalItemIds, items]
      properties:
        inquiryId: { type: string, format: uuid }
        warehouseId:
          description: Null only for an empty selection before the inquiry chose a warehouse.
          type: [string, "null"]
          format: uuid
        expiresAt:
          description: Null when the authoritative selection is empty and released.
          type: [string, "null"]
          format: date-time
        rentalItemIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        items:
          type: array
          maxItems: 100
          items:
            allOf:
              - $ref: "#/components/schemas/AvailableCabin"
              - type: object
                description: A selected cabin is always currently FREE.
                properties:
                  status: { type: string, const: FREE }
