        orderId: { type: [string, "null"], format: uuid }
        statusPath: { type: string }
        errorCode: { type: [string, "null"] }
    RentalBookingAlert:
      type: object
      additionalProperties: false
      required: [bookingId, version, inquiryId, orderId, client, confirmedAt, cabins]
      properties:
        bookingId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        inquiryId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        client: { $ref: "#/components/schemas/OrderClient" }
