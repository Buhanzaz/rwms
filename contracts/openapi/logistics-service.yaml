      type: object
      additionalProperties: false
      required: [id, number, rentalType, dimensions, finishing, category]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        rentalType: { type: [string, "null"] }
        dimensions: { type: [string, "null"] }
        finishing: { type: [string, "null"] }
        category: { type: [string, "null"] }
    RentalBookingAlertAction:
      type: string
      enum: [CONTINUE, KEEP_DRAFT]
    RentalBookingAlertActionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, action]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        action: { $ref: "#/components/schemas/RentalBookingAlertAction" }
    WarehouseOperationMarkRecoveryRequest:
      type: object
      additionalProperties: false
      required: [expectedRecoveryVersion, reason]
      properties:
        expectedRecoveryVersion: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    WarehouseOperationMarkRecoveryResponse:
      type: object
      additionalProperties: false
      required:
        - warehouseId
        - operationId
        - state
        - attemptCount
        - recoveryVersion
        - lastErrorCode
        - recoveredBySubjectId
        - recoveryReason
        - recoveredAt
      properties:
        warehouseId: { type: string, format: uuid }
