        transferId: { type: string, format: uuid }
        lineId: { type: string, format: uuid }
        activeRepairId: { type: [string, "null"], format: uuid }
        priorityRequired: { type: boolean }
        missingQueueDefinitionIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
    ReconcileRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    ClientType:
      type: string
      enum: [INDIVIDUAL, SOLE_PROPRIETOR, LEGAL_ENTITY]
    AdditionalContactInput:
      type: object
      additionalProperties: false
      required: [name, phone]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        phone:
          type: string
          minLength: 7
          maxLength: 32
          pattern: '^(?:\+|8)[0-9() .-]{6,31}$'
    AdditionalContact:
      type: object
      additionalProperties: false
      required: [name, phone]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        phone:
          type: string
          maxLength: 16
          pattern: '^\+[1-9][0-9]{6,14}$'
    DesiredDeliveryWindowInput:
      type: object
      additionalProperties: false
      required: [startDate, endDate]
      properties:
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
      description: >-
        Inclusive client-requested receiving date range. For a public NORMAL presentation,
        startDate equals endDate.
    DesiredDeliveryWindow:
      type: object
      additionalProperties: false
      required: [startDate, endDate]
      properties:
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
      description: Date-only advisory client preference; it never blocks another logistics-assigned date.
    NewClientInput:
      type: object
      additionalProperties: false
      required: [clientType, displayName, phone]
      properties:
        clientType: { $ref: "#/components/schemas/ClientType" }
        displayName: { type: string, minLength: 1, maxLength: 512 }
        phone:
          type: string
          minLength: 7
          maxLength: 32
          pattern: '^(?:\+|8)[0-9() .-]{6,31}$'
          description: Human-formatted phone normalized to canonical E.164 before storage.
        contactPerson: { type: [string, "null"], minLength: 1, maxLength: 255 }
        email: { type: [string, "null"], format: email, maxLength: 320 }
        comment: { type: [string, "null"], minLength: 1, maxLength: 2000 }
        source: { type: [string, "null"], minLength: 1, maxLength: 255 }
        additionalContacts:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AdditionalContactInput" }
      allOf:
        - if:
            properties:
              clientType: { enum: [SOLE_PROPRIETOR, LEGAL_ENTITY] }
            required: [clientType]
          then:
            required: [contactPerson]
            properties:
              contactPerson: { type: string, minLength: 1, maxLength: 255 }
    CreateClientRequest:
      type: object
      additionalProperties: false
      required: [clientType, displayName, phone]
      properties:
        clientType: { $ref: "#/components/schemas/ClientType" }
        displayName: { type: string, minLength: 1, maxLength: 512 }
        phone:
          type: string
          minLength: 7
          maxLength: 32
          pattern: '^(?:\+|8)[0-9() .-]{6,31}$'
          description: Human-formatted phone normalized to canonical E.164 before storage.
        contactPerson: { type: [string, "null"], minLength: 1, maxLength: 255 }
        email: { type: [string, "null"], format: email, maxLength: 320 }
        comment: { type: [string, "null"], minLength: 1, maxLength: 2000 }
        source: { type: [string, "null"], minLength: 1, maxLength: 255 }
        additionalContacts:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AdditionalContactInput" }
      allOf:
        - if:
            properties:
              clientType: { enum: [SOLE_PROPRIETOR, LEGAL_ENTITY] }
            required: [clientType]
          then:
            required: [contactPerson]
            properties:
              contactPerson: { type: string, minLength: 1, maxLength: 255 }
    CreateOrderRequest:
      type: object
      additionalProperties: false
      properties:
        clientId: { type: string, format: uuid }
        newClient: { $ref: "#/components/schemas/NewClientInput" }
        contactPhone:
          type: [string, "null"]
          minLength: 7
          maxLength: 32
          pattern: '^(?:\+|8)[0-9() .-]{6,31}$'
          description: Human-formatted international or Russian trunk phone; normalized to canonical E.164 before storage.
        comment: { type: [string, "null"], minLength: 1, maxLength: 2000 }
      oneOf:
        - required: [clientId]
          not: { required: [newClient] }
        - required: [newClient]
          not: { required: [clientId] }
    UpdateOrderRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, clientId]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        clientId: { type: string, format: uuid }
        contactPhone:
          type: [string, "null"]
          minLength: 7
          maxLength: 32
          pattern: '^(?:\+|8)[0-9() .-]{6,31}$'
          description: Human-formatted international or Russian trunk phone; normalized to canonical E.164 before storage.
        comment: { type: [string, "null"], minLength: 1, maxLength: 2000 }
    ReplaceOrderUnitRequest:
      type: object
      additionalProperties: false
