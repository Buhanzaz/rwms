        newValues: { type: [object, "null"], additionalProperties: true }
        occurredAt: { type: string, format: date-time }
    CreateRentalInquiryRequest:
      type: object
      additionalProperties: false
      properties:
        conversationId:
          type: [string, "null"]
          format: uuid
          description: Assistant conversation identity; omitted for ordinary manual booking.
        clientId: { type: string, format: uuid }
        newClient: { $ref: "#/components/schemas/NewClientInput" }
        rentalOrderId:
          type: [string, "null"]
          format: uuid
          description: >-
            Existing same-client DRAFT or SAVED order. NORMAL additions require
            current order editability; REPLACEMENT uses its dedicated pre-start
            trip fence even after an actual date was assigned.
      oneOf:
        - required: [clientId]
          not: { required: [newClient] }
        - required: [newClient]
          not: { required: [clientId] }
      anyOf:
        - required: [conversationId]
          properties:
            conversationId: { type: string, format: uuid }
        - required: [clientId, rentalOrderId]
    RentalInquiry:
      type: object
