        createdBy: { type: string, format: uuid }
        createdByDisplayName: { type: string }
        warehouseId: { type: [string, "null"], format: uuid }
        deliveryAddress: { type: [string, "null"], maxLength: 1000 }
        latitude:
          { type: [number, "null"], format: double, minimum: -90, maximum: 90 }
        longitude:
          { type: [number, "null"], format: double, minimum: -180, maximum: 180 }
        contactPhone:
          type: [string, "null"]
          maxLength: 16
          pattern: '^\+[1-9][0-9]{6,14}$'
