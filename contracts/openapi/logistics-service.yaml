      properties:
        assetId: { type: string, format: uuid }
        contents:
          type: array
          maxItems: 100
          description: Complete selected furniture total. An empty list clears the cabin furniture.
          items: { $ref: "#/components/schemas/CabinFurnitureRequirement" }
    CreateCabinFurnitureTaskRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, scheduledDate, contents]
      properties:
        warehouseId: { type: string, format: uuid }
        scheduledDate: { type: string, format: date }
        contents:
          type: array
          maxItems: 100
          description: Complete selected furniture total. An empty list clears the cabin furniture.
          items: { $ref: "#/components/schemas/CabinFurnitureRequirement" }
    CabinFurnitureTaskResult:
      type: object
      additionalProperties: false
      required: [rentalItemId, unitNumber, taskId, lineCount]
      properties:
        rentalItemId: { type: string, format: uuid }
        unitNumber: { type: string, minLength: 1, maxLength: 64 }
        taskId: { type: [string, "null"], format: uuid }
        lineCount: { type: integer, minimum: 0 }
    ArriveTransferLineRequest:
      type: object
      additionalProperties: false
      required: [references, priority]
      properties:
        references:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/MediaReferenceInput" }
        priority:
          type: [integer, "null"]
          minimum: 1
          maximum: 5
          description: Required only when the preflight reports an active repair.
    TransferArrivalPreflight:
      type: object
      additionalProperties: false
      required:
        [
          transferId,
          lineId,
          activeRepairId,
          priorityRequired,
          missingQueueDefinitionIds,
        ]
