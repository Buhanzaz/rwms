        inquiryId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        state: { type: string, enum: [ACTIVE, BOOKING_PENDING, BOOKED, REVOKED] }
        expiresAt: { type: string, format: date-time }
        viewUntil: { type: string, format: date-time }
        canConfirm: { type: boolean }
        publicPath: { type: string }
        bookedOrderId: { type: [string, "null"], format: uuid }
        groups:
          type: array
