          presentationHoldMinutes,
          draftReservationHoldMinutes,
          updatedBy,
          updatedAt,
        ]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        chatSelectionHoldMinutes: { type: integer, minimum: 1, maximum: 1440 }
        manualBookingHoldMinutes: { type: integer, minimum: 5, maximum: 1440 }
        presentationHoldMinutes: { type: integer, minimum: 5, maximum: 1440 }
        draftReservationHoldMinutes: { type: integer, minimum: 1440, maximum: 14400 }
        updatedBy: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }
    UpdateRentalSettingsRequest:
      type: object
      additionalProperties: false
