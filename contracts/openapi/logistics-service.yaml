      properties:
        warehouses:
          type: array
          items: { $ref: "#/components/schemas/CabinFacetWarehouse" }
    CabinSearchGroup:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        cabinType: { type: [string, "null"], maxLength: 255 }
        finish: { type: [string, "null"], maxLength: 255 }
        dimensions: { type: [string, "null"], maxLength: 255 }
        category: { type: [string, "null"], maxLength: 255 }
        characteristics: { type: [string, "null"], maxLength: 2000 }
        linoleum: { type: [boolean, "null"] }
        quantity: { type: integer, minimum: 1, maximum: 30 }
    CabinSearchRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, groups]
      properties:
        warehouseId: { type: string, format: uuid }
        resultMode:
          description: >-
            REPLACE is the default and atomically releases previous inquiry
            holds. APPEND retains them and must be requested explicitly.
          type: string
          enum: [APPEND, REPLACE]
          default: REPLACE
        groups:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/CabinSearchGroup" }
    AvailableCabin:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          warehouseId,
          status,
          number,
          rentalType,
          dimensions,
          finishing,
          category,
          characteristics,
          linoleum,
          passport,
          tags,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        status: { type: string }
        number: { type: string }
        rentalType: { type: [string, "null"] }
        dimensions: { type: [string, "null"] }
        finishing: { type: [string, "null"] }
        category: { type: [string, "null"] }
        characteristics: { type: [string, "null"] }
        linoleum: { type: [boolean, "null"] }
        passport: { type: object, additionalProperties: true }
        tags:
          type: array
          items: { type: string }
        updatedAt: { type: string, format: date-time }
    CabinSearchGroupResult:
      type: object
      additionalProperties: false
      required: [group, cabins]
      properties:
        group: { $ref: "#/components/schemas/CabinSearchGroup" }
        cabins:
          type: array
          items: { $ref: "#/components/schemas/AvailableCabin" }
    CabinSearchResponse:
      type: object
      additionalProperties: false
      required: [warehouseId, expiresAt, groups]
      properties:
        warehouseId: { type: string, format: uuid }
        expiresAt:
          type: string
          format: date-time
          description: Expiry of the manager-only short reservation created for this chat result.
        groups:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/CabinSearchGroupResult" }
    ReplaceCabinSelectionRequest:
      type: object
      additionalProperties: false
