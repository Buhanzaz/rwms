        x: { type: number, format: float, minimum: 0, maximum: 1 }
        y: { type: number, format: float, minimum: 0, maximum: 1 }
        elapsedMillis: { type: integer, format: int64, minimum: 0, maximum: 600000 }
    CustomerSignatureStroke:
      type: object
      additionalProperties: false
      required: [points]
      properties:
        points:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: "#/components/schemas/CustomerSignaturePoint" }
    AcceptCustomerCabinRequest:
      type: object
      additionalProperties: false
      required: [strokes]
      properties:
        strokes:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/CustomerSignatureStroke" }
    CustomerCabinAcceptance:
      type: object
      additionalProperties: false
      required: [acceptanceId, version, acceptedAt, signaturePointCount]
      properties:
        acceptanceId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        acceptedAt: { type: string, format: date-time }
        signaturePointCount: { type: integer, minimum: 1, maximum: 8192 }
    CustomerProblemMediaReference:
      type: object
      additionalProperties: false
