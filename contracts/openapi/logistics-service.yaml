openapi: 3.1.0
info:
  title: RWMS Logistics Service API
  version: 1.0.0
  description: >-
    Canonical Stage 8 API for return, shipment, and transfer documents.
    Public operations require a locally validated USER Bearer JWT, the
    matching rwms scope, and warehouse access. Every retriable mutation uses
    a subject-bound Idempotency-Key; mutable transitions also require the
    current document version.
servers:
  - url: /
security:
  - bearerJwt: []
paths:
  /api/logistics/v1/returns:
    get:
      operationId: listReturns
      description: Lists visible return documents. Requires rwms.read and VIEW at the document warehouse.
      parameters:
        - $ref: "#/components/parameters/WarehouseIdQuery"
      responses:
        "200": { $ref: "#/components/responses/DocumentList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createReturn
      description: Creates a DRAFT return. No canonical asset effect occurs during creation.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReturnRequest" }
      responses:
        "201": { $ref: "#/components/responses/CreatedDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/logistics/v1/returns/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getReturn
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/returns/{documentId}/register:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: registerReturn
      description: Assigns the pickup driver/date and starts the fenced return-intake saga from a DRAFT return.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReturnPickupRequest" }
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/returns/{documentId}/accept-undamaged:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: acceptUndamagedReturn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptReturnRequest" }
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/logistics/v1/returns/{documentId}/request-estimate:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: requestReturnEstimate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/RequestReturnEstimateRequest" }
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/shipments:
    get:
      operationId: listShipments
      parameters:
        - $ref: "#/components/parameters/WarehouseIdQuery"
      responses:
        "200": { $ref: "#/components/responses/DocumentList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createShipment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateShipmentRequest" }
      responses:
        "201": { $ref: "#/components/responses/CreatedDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/logistics/v1/shipments/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getShipment
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/shipments/{documentId}/plan:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    put:
      operationId: replaceShipmentPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShipmentPlanRequest" }
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/logistics/v1/shipments/{documentId}/furniture-readiness:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getShipmentFurnitureReadiness
      description: >-
        Reports whether an order shipment can start or finish departure. Readiness is based on the
        current asset-side furniture delta and the durable worker task state.
      responses:
        "200":
          description: Current furniture readiness for the shipment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipmentFurnitureReadiness" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/shipments/{documentId}/furniture-tasks:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: createShipmentFurnitureTasks
      description: >-
        For a saved order shipment, compares each order cabin's desired catalogue furniture with
        its current asset contents and creates worker tasks only for the difference. No browser
        movement orchestration or user-entered reservation deadline is involved.
      responses:
        "202":
          description: Furniture movement tasks created or existing idempotent task links returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipmentFurnitureTaskResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/shipments/{documentId}/confirm-preparation:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: confirmShipmentPreparation
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/shipments/{documentId}/cancel:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: cancelShipment
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/transfers:
    get:
      operationId: listTransfers
      parameters:
        - $ref: "#/components/parameters/WarehouseIdQuery"
      responses:
        "200": { $ref: "#/components/responses/DocumentList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createTransfer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTransferRequest" }
      responses:
        "201": { $ref: "#/components/responses/CreatedDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/logistics/v1/rental-items/{rentalItemId}/furniture-tasks:
    parameters:
      - { name: rentalItemId, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: createCabinFurnitureTask
      description: >-
        Replaces the selected cabin's complete furniture composition with the requested total.
        Logistics derives source balances from the asset-owned additional-equipment ledger and
        creates a worker task only for the physical difference.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCabinFurnitureTaskRequest" }
      responses:
        "200":
          description: The cabin already matches the requested composition; no task was necessary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinFurnitureTaskResult" }
        "202":
          description: A server-side furniture movement task was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinFurnitureTaskResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/transfers/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getTransfer
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/transfers/{documentId}/lines/{lineId}/depart:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/LineId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/ExpectedLineVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: departTransferLine
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/transfers/{documentId}/lines/{lineId}/arrive:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/LineId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/ExpectedLineVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: arriveTransferLine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArriveTransferLineRequest" }
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/logistics/v1/transfers/{documentId}/cancel:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: cancelTransfer
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/equipment-movement-tasks:
    post:
      operationId: createEquipmentMovementTask
      description: >-
        Reserves every source balance until deadlineAt and creates one typed worker task.
        It never changes physical equipment balances itself: asset-service executes the
        reserved batch only after task-board reports DONE before the deadline.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "#/components/schemas/CreateEquipmentMovementTaskRequest",
              }
      responses:
        "200": { $ref: "#/components/responses/EquipmentMovementTask" }
        "201": { $ref: "#/components/responses/EquipmentMovementTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/equipment-movement-tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/EquipmentMovementTaskId"
    get:
      operationId: getEquipmentMovementTask
      responses:
        "200": { $ref: "#/components/responses/EquipmentMovementTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/equipment-movement-tasks/{taskId}/cancel:
    parameters:
      - $ref: "#/components/parameters/EquipmentMovementTaskId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: cancelEquipmentMovementTask
      description: >-
        Cancels an unfinished task and releases its source reservations. A task that
        has reached physical execution cannot be cancelled by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "#/components/schemas/CancelEquipmentMovementTaskRequest",
              }
      responses:
        "202": { $ref: "#/components/responses/EquipmentMovementTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/orders:
    get:
      operationId: listOrders
      description: >-
        Server-paginated order search. Managers receive only managerId == JWT sub;
        warehouse managers receive granted-warehouse orders plus their own unassigned drafts;
        system administrators receive the global view.
      parameters:
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
        - {
            name: size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
        - { name: search, in: query, schema: { type: string, default: "" } }
        - {
            name: sort,
            in: query,
            schema:
              {
                type: string,
                enum:
                  [
                    number,
                    client,
                    manager,
                    warehouse,
                    status,
                    createdAt,
                    updatedAt,
                  ],
                default: updatedAt,
              },
          }
        - {
            name: direction,
            in: query,
            schema: { type: string, enum: [ASC, DESC], default: DESC },
          }
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              {
                type: string,
                enum: [DRAFT, SAVED, FULFILLED, CLOSED, CANCELLED],
              }
        - name: clientType
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/ClientType" }
        - name: warehouseId
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, format: uuid }
        - {
            name: createdFrom,
            in: query,
            schema: { type: string, format: date-time },
          }
        - {
            name: createdTo,
            in: query,
            schema: { type: string, format: date-time },
          }
      responses:
        "200":
          description: Visible orders only.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/OrderPage" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createOrder
      description: >-
        Creates a DRAFT order owned by the JWT subject. Exactly one existing
        clientId or explicitly confirmed newClient is required.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "201": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/orders/{orderId}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      operationId: getOrder
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateOrder
      description: Updates only the existing client of an editable DRAFT order.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrderRequest" }
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: cancelOrder
      description: Logically cancels an editable draft and atomically requests release of every active unit reservation.
      parameters:
        - $ref: "#/components/parameters/ExpectedVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/orders/{orderId}/save:
    parameters:
      - $ref: "#/components/parameters/OrderId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: saveOrder
      description: >-
        Locks a non-empty DRAFT order and atomically creates its DRAFT shipment
        without a driver or shipment date. A saved order is no longer editable.
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/clients:
    get:
      operationId: searchOrderClients
      description: >-
        Searches counterparties by normalized name. With an empty search query,
        returns the most recently created counterparties first.
      parameters:
        - {
            name: type,
            in: query,
            schema: { $ref: "#/components/schemas/ClientType" },
          }
        - { name: search, in: query, schema: { type: string, default: "" } }
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
        - {
            name: size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
      responses:
        "200":
          description: Matching normalized clients.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ClientPage" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createOrderClient
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateClientRequest" }
      responses:
        "200": { $ref: "#/components/responses/OrderClient" }
        "201": { $ref: "#/components/responses/OrderClient" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/orders/{orderId}/warehouse:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    put:
      operationId: selectOrderWarehouse
      description: Warehouse changes are rejected after the first active unit reservation.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelectOrderWarehouseRequest" }
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/orders/{orderId}/available-units:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      operationId: listOrderUnitCandidates
      parameters:
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
        - {
            name: size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - { name: search, in: query, schema: { type: string, default: "" } }
      responses:
        "200":
          description: Free units plus units already added to this order.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/OrderUnitPage" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/orders/{orderId}/units:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      operationId: addOrderUnit
      description: Atomically reserves one unit in asset-service for this editable order.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddOrderUnitRequest" }
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "201": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/orders/{orderId}/units/{unitId}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
      - $ref: "#/components/parameters/UnitId"
    delete:
      operationId: removeOrderUnit
      parameters:
        - $ref: "#/components/parameters/ExpectedVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/orders/{orderId}/units/{unitId}/desired-equipment:
    parameters:
      - $ref: "#/components/parameters/OrderId"
      - $ref: "#/components/parameters/UnitId"
    put:
      operationId: setOrderUnitDesiredEquipment
      description: >-
        Replaces the desired catalogue furniture for one draft order cabin. This creates an
        order-wide reservation, not an immediate physical movement or a time-limited cabin hold.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetOrderUnitDesiredEquipmentRequest" }
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/orders/{orderId}/history:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      operationId: getOrderHistory
      responses:
        "200":
          description: Append-only order audit history.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrderHistoryEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/{documentType}/{documentId}/reconcile:
    parameters:
      - $ref: "#/components/parameters/DocumentTypePath"
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: reconcileDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconcileRequest" }
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LineId:
      name: lineId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentTypePath:
      name: documentType
      in: path
      required: true
      schema: { type: string, enum: [returns, shipments, transfers] }
    WarehouseIdQuery:
      name: warehouseId
      in: query
      required: true
      schema: { type: string, format: uuid }
    ExpectedVersion:
      name: expectedVersion
      in: query
      required: true
      schema: { type: integer, minimum: 0 }
    ExpectedLineVersion:
      name: expectedLineVersion
      in: query
      required: true
      schema: { type: integer, minimum: 0 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UnitId:
      name: unitId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EquipmentId:
      name: equipmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EquipmentMovementTaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    LogisticsDocument:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          documentType,
          state,
          warehouseId,
          destinationWarehouseId,
          partySnapshot,
          driverSnapshot,
          clientId,
          equipmentMovementTaskId,
          scheduledDate,
          scheduledAt,
          rentalOrderId,
          lines,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        documentType: { type: string, enum: [RETURN, SHIPMENT, TRANSFER] }
        state:
          type: string
          enum:
            [
              DRAFT,
              REGISTERING,
              INSPECTION_REQUIRED,
              ACCEPTING,
              ACCEPTED,
              ESTIMATE_PENDING,
              ESTIMATE_REQUESTED,
              PREPARING,
              AWAITING_CONFIRMATION,
              CONFIRMING_PREPARATION,
              SHIPPED,
              CANCELLING,
              DEPARTING,
              IN_TRANSIT,
              ARRIVING,
              COMPLETED,
              CANCELLED,
              CONFLICT,
              RECONCILIATION_REQUIRED,
            ]
        warehouseId: { type: string, format: uuid }
        destinationWarehouseId: { type: [string, "null"], format: uuid }
        partySnapshot:
          {
            type: [string, "null"],
            maxLength: 512,
            description: Immutable,
            trimmed workflow snapshot; no directory identity.,
          }
        driverSnapshot:
          {
            type: [string, "null"],
            maxLength: 512,
            description: Immutable,
            trimmed workflow snapshot; no directory identity.,
          }
        clientId:
          {
            type: [string, "null"],
            format: uuid,
            description: Client bound to the return or shipment.,
          }
        equipmentMovementTaskId:
          {
            type: [string, "null"],
            format: uuid,
            description: Server-created task that moves transfer furniture between warehouses.,
          }
        scheduledDate:
          {
            type: [string, "null"],
            format: date,
            description: Assigned shipment, return pickup, or transfer task date; absent while waiting for scheduling.,
          }
        scheduledAt:
          {
            type: [string, "null"],
            format: date-time,
            description: Deprecated compatibility field. It is always null; logistics schedules by calendar date only.,
          }
        rentalOrderId:
          {
            type: [string, "null"],
            format: uuid,
            description: Order whose shipment/return lifecycle owns this document.,
          }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/LogisticsLine" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LogisticsLine:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          lineNumber,
          assetId,
          assetVersion,
          state,
          tenantSnapshot,
          rentalOrderId,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        lineNumber: { type: integer, minimum: 1 }
        assetId: { type: string, format: uuid }
        assetVersion: { type: integer, minimum: 0 }
        state:
          {
            type: string,
            enum:
              [
                PENDING,
                DEPARTING,
                DEPARTED,
                ARRIVING,
                ARRIVED,
                CONFLICT,
                CANCELLED,
              ],
          }
        tenantSnapshot: { type: [string, "null"], maxLength: 512 }
        rentalOrderId:
          {
            type: [string, "null"],
            format: uuid,
            description: Rental order that owns the return or shipment cabin reservation.,
          }
    EquipmentMovementLocationKind:
      type: string
      enum: [STOCK, CABIN_NON_RENTED, CABIN_RENTED]
    EquipmentMovementTaskState:
      type: string
      enum:
        [
          RESERVING,
          REGISTERING_TASK,
          AWAITING_WORKER,
          EXECUTING,
          CANCELLING,
          COMPLETED,
          CANCELLED,
          EXPIRED,
          CONFLICT,
          RECONCILIATION_REQUIRED,
        ]
    EquipmentMovementLineState:
      type: string
      enum: [PENDING_RESERVATION, RESERVED, EXECUTED, RELEASED]
    EquipmentMovementLineRequest:
      type: object
      additionalProperties: false
      required:
        [
          equipmentId,
          sourceRentalItemId,
          sourceLocationKind,
          expectedSourceBalanceVersion,
          targetRentalItemId,
          targetLocationKind,
          quantity,
        ]
      properties:
        equipmentId: { type: string, format: uuid }
        sourceRentalItemId: { type: [string, "null"], format: uuid }
        sourceLocationKind:
          { $ref: "#/components/schemas/EquipmentMovementLocationKind" }
        expectedSourceBalanceVersion:
          { type: integer, format: int64, minimum: 0 }
        targetRentalItemId: { type: [string, "null"], format: uuid }
        targetLocationKind:
          { $ref: "#/components/schemas/EquipmentMovementLocationKind" }
        quantity: { type: integer, format: int64, minimum: 1 }
    CreateEquipmentMovementTaskRequest:
      type: object
      additionalProperties: false
      required:
        [
          warehouseId,
          targetWarehouseId,
          unitNumber,
          plannedDurationMinutes,
          deadlineAt,
          lines,
        ]
      properties:
        warehouseId: { type: string, format: uuid }
        targetWarehouseId:
          {
            type: [string, "null"],
            format: uuid,
            description: Target warehouse for STOCK-to-STOCK movement; omitted means the source warehouse.,
          }
        unitNumber: { type: [string, "null"], maxLength: 64 }
        plannedDurationMinutes: { type: [integer, "null"], minimum: 1 }
        deadlineAt: { type: string, format: date-time }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          description: >-
            At most ten worker operations are accepted. A cabin-to-cabin line produces
            two operations (take out and bring in); a stock/cabin line produces one.
          items: { $ref: "#/components/schemas/EquipmentMovementLineRequest" }
    CancelEquipmentMovementTaskRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    EquipmentMovementTaskLine:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          lineNumber,
          equipmentId,
          equipmentCode,
          equipmentName,
          sourceWarehouseId,
          sourceRentalItemId,
          sourceLocationKind,
          expectedSourceBalanceVersion,
          targetWarehouseId,
          targetRentalItemId,
          targetLocationKind,
          quantity,
          reservationId,
          reservationVersion,
          state,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        lineNumber: { type: integer, minimum: 1 }
        equipmentId: { type: string, format: uuid }
        equipmentCode: { type: [string, "null"], maxLength: 128 }
        equipmentName: { type: [string, "null"], maxLength: 512 }
        sourceWarehouseId: { type: string, format: uuid }
        sourceRentalItemId: { type: [string, "null"], format: uuid }
        sourceLocationKind:
          { $ref: "#/components/schemas/EquipmentMovementLocationKind" }
        expectedSourceBalanceVersion:
          { type: integer, format: int64, minimum: 0 }
        targetWarehouseId: { type: string, format: uuid }
        targetRentalItemId: { type: [string, "null"], format: uuid }
        targetLocationKind:
          { $ref: "#/components/schemas/EquipmentMovementLocationKind" }
        quantity: { type: integer, format: int64, minimum: 1 }
        reservationId: { type: [string, "null"], format: uuid }
        reservationVersion:
          { type: [integer, "null"], format: int64, minimum: 0 }
        state: { $ref: "#/components/schemas/EquipmentMovementLineState" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EquipmentMovementTask:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          warehouseId,
          externalTaskId,
          taskBoardTaskId,
          taskBoardTaskVersion,
          taskBoardDoneAt,
          unitNumber,
          plannedDurationMinutes,
          deadlineAt,
          state,
          terminalState,
          failureCode,
          lines,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        externalTaskId: { type: string, format: uuid }
        taskBoardTaskId: { type: [string, "null"], format: uuid }
        taskBoardTaskVersion:
          { type: [integer, "null"], format: int64, minimum: 0 }
        taskBoardDoneAt: { type: [string, "null"], format: date-time }
        unitNumber: { type: [string, "null"], maxLength: 64 }
        plannedDurationMinutes: { type: [integer, "null"], minimum: 1 }
        deadlineAt: { type: string, format: date-time }
        state: { $ref: "#/components/schemas/EquipmentMovementTaskState" }
        terminalState:
          oneOf:
            - { $ref: "#/components/schemas/EquipmentMovementTaskState" }
            - { type: "null" }
        failureCode: { type: [string, "null"], maxLength: 96 }
        lines:
          type: array
          items: { $ref: "#/components/schemas/EquipmentMovementTaskLine" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateReturnRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, lines]
      properties:
        warehouseId: { type: string, format: uuid }
        clientId: { type: [string, "null"], format: uuid }
        driverSnapshot:
          {
            type: [string, "null"],
            maxLength: 512,
            description: Immutable,
            trimmed workflow snapshot selected from the configured driver directory.,
          }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ReturnLineRequest" }
    ReturnPickupRequest:
      type: object
      additionalProperties: false
      required: [driverSnapshot, scheduledDate]
      properties:
        driverSnapshot: { type: string, minLength: 1, maxLength: 512 }
        scheduledDate: { type: string, format: date }
    ReturnLineRequest:
      type: object
      additionalProperties: false
      required: [assetId, assetVersion, tenantSnapshot, rentalOrderId]
      properties:
        assetId: { type: string, format: uuid }
        assetVersion: { type: integer, minimum: 0 }
        tenantSnapshot: { type: string, minLength: 1, maxLength: 512 }
        rentalOrderId: { type: [string, "null"], format: uuid }
    AcceptReturnRequest:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { $ref: "#/components/schemas/ReturnMediaLineRequest" }
    MediaReferenceInput:
      type: object
      additionalProperties: false
      required: [mediaId, generation]
      properties:
        mediaId: { type: string, format: uuid }
        generation: { type: integer, format: int64, minimum: 1 }
    ReturnMediaLineRequest:
      type: object
      additionalProperties: false
      required: [lineId, references]
      properties:
        lineId: { type: string, format: uuid }
        references:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/MediaReferenceInput" }
        additionalEquipment:
          type: array
          maxItems: 100
          description: Furniture received with the cabin that is not present in its current return composition.
          items:
            { $ref: "#/components/schemas/ReturnAdditionalEquipmentRequest" }
    ReturnAdditionalEquipmentRequest:
      type: object
      additionalProperties: false
      required: [equipmentId, quantity]
      properties:
        equipmentId: { type: string, format: uuid }
        quantity: { type: integer, format: int64, minimum: 1 }
    EquipmentShortageRequest:
      type: object
      additionalProperties: false
      required: [equipmentId, missingQuantity]
      properties:
        equipmentId: { type: string, format: uuid }
        missingQuantity: { type: integer, format: int64, minimum: 1 }
    ReturnShortageLineRequest:
      type: object
      additionalProperties: false
      required: [lineId, shortages]
      properties:
        lineId: { type: string, format: uuid }
        shortages:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/EquipmentShortageRequest" }
    RequestReturnEstimateRequest:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ReturnShortageLineRequest" }
    CreateShipmentRequest:
      type: object
      additionalProperties: false
      required:
        [
          warehouseId,
          clientId,
          rentalOrderId,
          partySnapshot,
          driverSnapshot,
          lines,
        ]
      properties:
        warehouseId: { type: string, format: uuid }
        clientId: { type: [string, "null"], format: uuid }
        rentalOrderId: { type: [string, "null"], format: uuid }
        partySnapshot: { type: string, minLength: 1, maxLength: 512 }
        driverSnapshot: { type: string, minLength: 1, maxLength: 512 }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ShipmentLineRequest" }
    ShipmentPlanRequest:
      type: object
      additionalProperties: false
      required: [driverSnapshot, scheduledDate]
      properties:
        driverSnapshot: { type: string, minLength: 1, maxLength: 512 }
        scheduledDate: { type: string, format: date }
    ShipmentFurnitureTaskView:
      type: object
      additionalProperties: false
      required: [rentalItemId, unitNumber, taskId, lineCount]
      properties:
        rentalItemId: { type: string, format: uuid }
        unitNumber: { type: string, minLength: 1, maxLength: 64 }
        taskId: { type: [string, "null"], format: uuid, description: Null when the actual furniture already matches the order. }
        lineCount: { type: integer, minimum: 0 }
    ShipmentFurnitureTaskResult:
      type: object
      additionalProperties: false
      required: [shipmentId, shipmentVersion, tasks]
      properties:
        shipmentId: { type: string, format: uuid }
        shipmentVersion: { type: integer, format: int64, minimum: 0 }
        tasks: { type: array, items: { $ref: "#/components/schemas/ShipmentFurnitureTaskView" } }
    ShipmentFurnitureReadinessState:
      type: string
      enum:
        [NOT_REQUIRED, READY, REQUIRES_TASK_CREATION, AWAITING_TASK_COMPLETION, BLOCKED]
    ShipmentFurnitureTaskStatus:
      type: object
      additionalProperties: false
      required:
        [rentalItemId, unitNumber, taskId, externalTaskId, taskBoardTaskId, taskState, lineCount]
      properties:
        rentalItemId: { type: string, format: uuid }
        unitNumber: { type: string, minLength: 1, maxLength: 64 }
        taskId: { type: string, format: uuid }
        externalTaskId: { type: string, format: uuid }
        taskBoardTaskId: { type: [string, "null"], format: uuid }
        taskState: { $ref: "#/components/schemas/EquipmentMovementTaskState" }
        lineCount: { type: integer, minimum: 1 }
    ShipmentFurnitureReadiness:
      type: object
      additionalProperties: false
      required: [shipmentId, shipmentVersion, state, tasks]
      properties:
        shipmentId: { type: string, format: uuid }
        shipmentVersion: { type: integer, format: int64, minimum: 0 }
        state: { $ref: "#/components/schemas/ShipmentFurnitureReadinessState" }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/ShipmentFurnitureTaskStatus" }
    ShipmentLineRequest:
      type: object
      additionalProperties: false
      required: [assetId, assetVersion, allocations]
      properties:
        assetId: { type: string, format: uuid }
        assetVersion: { type: integer, minimum: 0 }
        allocations:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/EquipmentAllocationRequest" }
    EquipmentAllocationRequest:
      type: object
      additionalProperties: false
      required: [equipmentId, quantity, expectedStockVersion]
      properties:
        equipmentId: { type: string, format: uuid }
        quantity: { type: integer, format: int64, minimum: 1 }
        expectedStockVersion: { type: integer, format: int64, minimum: 0 }
    CreateTransferRequest:
      type: object
      additionalProperties: false
      required:
        [
          warehouseId,
          destinationWarehouseId,
          driverSnapshot,
          scheduledDate,
          lines,
          furnitureReplacements,
        ]
      properties:
        warehouseId: { type: string, format: uuid }
        destinationWarehouseId: { type: string, format: uuid }
        driverSnapshot: { type: [string, "null"], maxLength: 512 }
        scheduledDate: { type: string, format: date }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/TransferLineRequest" }
        furnitureReplacements:
          type: array
          maxItems: 100
          description: Desired total furniture composition for selected cabins. Omitting a cabin leaves it unchanged.
          items: { $ref: "#/components/schemas/TransferFurnitureReplacementRequest" }
    TransferLineRequest:
      type: object
      additionalProperties: false
      required: [assetId, assetVersion]
      properties:
        assetId: { type: string, format: uuid }
        assetVersion: { type: integer, minimum: 0 }
    CabinFurnitureRequirement:
      type: object
      additionalProperties: false
      required: [equipmentId, quantity]
      properties:
        equipmentId: { type: string, format: uuid }
        quantity: { type: integer, format: int64, minimum: 1 }
    TransferFurnitureReplacementRequest:
      type: object
      additionalProperties: false
      required: [assetId, contents]
      properties:
        assetId: { type: string, format: uuid }
        contents:
          type: array
          maxItems: 100
          description: Complete selected furniture total. An empty list clears the cabin furniture.
          items: { $ref: "#/components/schemas/CabinFurnitureRequirement" }
    CreateCabinFurnitureTaskRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, scheduledDate, contents]
      properties:
        warehouseId: { type: string, format: uuid }
        scheduledDate: { type: string, format: date }
        contents:
          type: array
          maxItems: 100
          description: Complete selected furniture total. An empty list clears the cabin furniture.
          items: { $ref: "#/components/schemas/CabinFurnitureRequirement" }
    CabinFurnitureTaskResult:
      type: object
      additionalProperties: false
      required: [rentalItemId, unitNumber, taskId, lineCount]
      properties:
        rentalItemId: { type: string, format: uuid }
        unitNumber: { type: string, minLength: 1, maxLength: 64 }
        taskId: { type: [string, "null"], format: uuid }
        lineCount: { type: integer, minimum: 0 }
    ArriveTransferLineRequest:
      type: object
      additionalProperties: false
      required: [references]
      properties:
        references:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/MediaReferenceInput" }
    ReconcileRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    ClientType:
      type: string
      enum: [INDIVIDUAL, LEGAL_ENTITY]
    NewClientInput:
      type: object
      additionalProperties: false
      required: [clientType, displayName]
      properties:
        clientType: { $ref: "#/components/schemas/ClientType" }
        displayName: { type: string, minLength: 1, maxLength: 512 }
    CreateClientRequest:
      type: object
      additionalProperties: false
      required: [clientType, displayName]
      properties:
        clientType: { $ref: "#/components/schemas/ClientType" }
        displayName: { type: string, minLength: 1, maxLength: 512 }
    CreateOrderRequest:
      type: object
      additionalProperties: false
      properties:
        clientId: { type: string, format: uuid }
        newClient: { $ref: "#/components/schemas/NewClientInput" }
      oneOf:
        - required: [clientId]
          not: { required: [newClient] }
        - required: [newClient]
          not: { required: [clientId] }
    UpdateOrderRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, clientId]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        clientId: { type: string, format: uuid }
    SelectOrderWarehouseRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, warehouseId]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
    AddOrderUnitRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, unitId]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        unitId: { type: string, format: uuid }
    OrderDesiredEquipmentInput:
      type: object
      additionalProperties: false
      required: [equipmentId, quantity]
      properties:
        equipmentId: { type: string, format: uuid }
        quantity: { type: integer, format: int64, minimum: 1 }
    SetOrderUnitDesiredEquipmentRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, requirements]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        requirements:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/OrderDesiredEquipmentInput" }
    OrderClient:
      type: object
      additionalProperties: false
      required: [id, version, type, displayName, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        type: { $ref: "#/components/schemas/ClientType" }
        displayName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ClientPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/OrderClient" }
        page: { type: integer, format: int64, minimum: 0 }
        size: { type: integer, format: int64, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int64, minimum: 0 }
    OrderSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          number,
          status,
          client,
          managerId,
          managerDisplayName,
          createdBy,
          createdByDisplayName,
          warehouseId,
          unitCount,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        number: { type: string }
        status:
          { type: string, enum: [DRAFT, SAVED, FULFILLED, CLOSED, CANCELLED] }
        client: { $ref: "#/components/schemas/OrderClient" }
        managerId: { type: string, format: uuid }
        managerDisplayName: { type: string }
        createdBy: { type: string, format: uuid }
        createdByDisplayName: { type: string }
        warehouseId: { type: [string, "null"], format: uuid }
        unitCount: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/OrderSummary" }
        page: { type: integer, format: int64, minimum: 0 }
        size: { type: integer, format: int64, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int64, minimum: 0 }
    OrderEquipmentContent:
      type: object
      additionalProperties: false
      required:
        [equipmentId, equipmentCode, equipmentName, quantity, locationKind]
      properties:
        equipmentId: { type: string, format: uuid }
        equipmentCode: { type: [string, "null"] }
        equipmentName: { type: [string, "null"] }
        quantity: { type: integer, format: int64, minimum: 0 }
        locationKind: { type: string }
    OrderDesiredEquipment:
      type: object
      additionalProperties: false
      required: [equipmentId, equipmentCode, equipmentName, quantity]
      properties:
        equipmentId: { type: string, format: uuid }
        equipmentCode: { type: string, minLength: 1, maxLength: 128 }
        equipmentName: { type: string, minLength: 1, maxLength: 512 }
        quantity: { type: integer, format: int64, minimum: 1 }
    OrderRentalItem:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          warehouseId,
          number,
          status,
          rentalType,
          dimensions,
          finishing,
          category,
          characteristics,
          linoleum,
          tags,
          contents,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        number: { type: string }
        status: { type: string }
        rentalType: { type: [string, "null"] }
        dimensions: { type: [string, "null"] }
        finishing: { type: [string, "null"] }
        category: { type: [string, "null"] }
        characteristics: { type: [string, "null"] }
        linoleum: { type: [boolean, "null"] }
        tags: { type: array, items: { type: string } }
        contents:
          type: array
          items: { $ref: "#/components/schemas/OrderEquipmentContent" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderUnit:
      type: object
      additionalProperties: false
      required: [reservationId, added, unit, desiredContents]
      properties:
        reservationId: { type: [string, "null"], format: uuid }
        added: { type: boolean }
        unit: { $ref: "#/components/schemas/OrderRentalItem" }
        desiredContents:
          type: array
          items: { $ref: "#/components/schemas/OrderDesiredEquipment" }
    OrderUnitPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          { type: array, items: { $ref: "#/components/schemas/OrderUnit" } }
        page: { type: integer, format: int64, minimum: 0 }
        size: { type: integer, format: int64, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int64, minimum: 0 }
    OrderPermissions:
      type: object
      additionalProperties: false
      required: [canEdit, canViewOtherManagers]
      properties:
        canEdit: { type: boolean }
        canViewOtherManagers: { type: boolean }
    OrderDetail:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          number,
          status,
          client,
          managerId,
          managerDisplayName,
          createdBy,
          createdByDisplayName,
          warehouseId,
          unitCount,
          createdAt,
          updatedAt,
          units,
          permissions,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        number: { type: string }
        status:
          { type: string, enum: [DRAFT, SAVED, FULFILLED, CLOSED, CANCELLED] }
        client: { $ref: "#/components/schemas/OrderClient" }
        managerId: { type: string, format: uuid }
        managerDisplayName: { type: string }
        createdBy: { type: string, format: uuid }
        createdByDisplayName: { type: string }
        warehouseId: { type: [string, "null"], format: uuid }
        unitCount: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        units:
          { type: array, items: { $ref: "#/components/schemas/OrderUnit" } }
        permissions: { $ref: "#/components/schemas/OrderPermissions" }
    OrderHistoryEvent:
      type: object
      additionalProperties: false
      required:
        [
          id,
          eventType,
          actorSubjectId,
          actorRole,
          orderId,
          subjectType,
          subjectId,
          previousValues,
          newValues,
          occurredAt,
        ]
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string }
        actorSubjectId: { type: string, format: uuid }
        actorRole: { type: string }
        orderId: { type: string, format: uuid }
        subjectType: { type: string }
        subjectId: { type: string }
        previousValues: { type: [object, "null"], additionalProperties: true }
        newValues: { type: [object, "null"], additionalProperties: true }
        occurredAt: { type: string, format: date-time }
    ApiProblem:
      type: object
      additionalProperties: true
      required: [status, code]
      properties:
        status: { type: integer }
        code: { type: string }
  responses:
    EquipmentMovementTask:
      description: Current source-reservation and worker-task state for one physical equipment movement.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: "true" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/EquipmentMovementTask" }
    Document:
      description: Current logistics document state.
      headers:
        ETag:
          required: true
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LogisticsDocument" }
    CreatedDocument:
      description: New DRAFT document, or the original successful create response.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: "true" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LogisticsDocument" }
    DocumentList:
      description: Visible documents.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: "#/components/schemas/LogisticsDocument" }
    OrderDetail:
      description: Current order state and authoritative active asset reservations.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: "true" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OrderDetail" }
    OrderClient:
      description: Explicitly created client, or the original idempotent result.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: "true" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OrderClient" }
    BadRequest:
      description: Invalid shape, missing idempotency key, or invalid expected version.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    Unauthorized:
      description: Missing or invalid Bearer JWT.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    Forbidden:
      description: Missing USER principal, scope, warehouse access, or required management level.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    NotFound:
      description: Document is absent or outside the caller's warehouse scope.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    Conflict:
      description: Stale version, changed idempotency replay, lease/hold/task conflict, or forbidden lifecycle transition.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    Unprocessable:
      description: Semantic request error such as an impossible contents delta or unsupported correction capability.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    DependencyUnavailable:
      description: An owning service required by the order operation is temporarily unavailable.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
