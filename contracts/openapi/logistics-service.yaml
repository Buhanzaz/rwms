openapi: 3.1.0
info:
  title: RWMS Logistics Service API
  version: 1.0.0
  description: >-
    Canonical Stage 8 API for return, shipment, and transfer documents.
    Public operations require a locally validated USER Bearer JWT, the
    matching rwms scope, and warehouse access. Every retriable mutation uses
    a subject-bound Idempotency-Key; mutable transitions also require the
    current document version.
servers:
  - url: /
security:
  - bearerJwt: []
paths:
  /api/logistics/v1/returns:
    get:
      operationId: listReturns
      description: Lists visible return documents. Requires rwms.read and VIEW at the document warehouse.
      parameters:
        - $ref: "#/components/parameters/WarehouseIdQuery"
      responses:
        "200": { $ref: "#/components/responses/DocumentList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createReturn
      description: Creates a DRAFT return. No canonical asset effect occurs during creation.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReturnRequest" }
      responses:
        "201": { $ref: "#/components/responses/CreatedDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/logistics/v1/returns/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getReturn
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/returns/{documentId}/register:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: registerReturn
      description: Assigns the pickup driver/date and starts the fenced return-intake saga from a DRAFT return.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReturnPickupRequest" }
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/returns/{documentId}/accept-undamaged:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: acceptUndamagedReturn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptReturnRequest" }
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/logistics/v1/returns/{documentId}/start-estimates:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: startReturnEstimates
      description: >-
        Starts one maintenance-owned DRAFT estimate for every submitted return line.
        Return inspection photographs are immutable evidence; equipment losses are selected
        later inside each individual estimate and never in the return command.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/StartReturnEstimatesRequest" }
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/shipments:
    get:
      operationId: listShipments
      parameters:
        - $ref: "#/components/parameters/WarehouseIdQuery"
      responses:
        "200": { $ref: "#/components/responses/DocumentList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createShipment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateShipmentRequest" }
      responses:
        "201": { $ref: "#/components/responses/CreatedDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/logistics/v1/shipments/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getShipment
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/shipments/{documentId}/plan:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    put:
      operationId: replaceShipmentPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShipmentPlanRequest" }
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/logistics/v1/shipments/{documentId}/furniture-readiness:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getShipmentFurnitureReadiness
      description: >-
        Reports whether an order shipment can start or finish departure. Readiness is based on the
        current asset-side furniture delta and the durable worker task state.
      responses:
        "200":
          description: Current furniture readiness for the shipment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipmentFurnitureReadiness" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/shipments/{documentId}/furniture-tasks:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: createShipmentFurnitureTasks
      description: >-
        For a saved order shipment, compares each order cabin's desired catalogue furniture with
        its current asset contents and creates worker tasks only for the difference. No browser
        movement orchestration or user-entered reservation deadline is involved.
      responses:
        "202":
          description: Furniture movement tasks created or existing idempotent task links returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipmentFurnitureTaskResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/shipments/{documentId}/confirm-preparation:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
      - name: keepScheduledDate
        in: query
        required: false
        description: Explicitly keep a planned calendar date when the physical departure is recorded today.
        schema: { type: boolean, default: false }
    post:
      operationId: confirmShipmentPreparation
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/shipments/{documentId}/cancel:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: cancelShipment
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/transfers:
    get:
      operationId: listTransfers
      parameters:
        - $ref: "#/components/parameters/WarehouseIdQuery"
      responses:
        "200": { $ref: "#/components/responses/DocumentList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createTransfer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTransferRequest" }
      responses:
        "201": { $ref: "#/components/responses/CreatedDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/logistics/v1/rental-items/{rentalItemId}/furniture-tasks:
    parameters:
      - { name: rentalItemId, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: createCabinFurnitureTask
      description: >-
        Replaces the selected cabin's complete furniture composition with the requested total.
        Logistics derives source balances from the asset-owned additional-equipment ledger and
        creates a worker task only for the physical difference.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCabinFurnitureTaskRequest" }
      responses:
        "200":
          description: The cabin already matches the requested composition; no task was necessary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinFurnitureTaskResult" }
        "202":
          description: A server-side furniture movement task was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinFurnitureTaskResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/transfers/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getTransfer
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/transfers/{documentId}/furniture-readiness:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getTransferFurnitureReadiness
      description: >-
        Reports the durable worker-task readiness for furniture changes selected for a transfer.
        Requires rwms.read and VIEW access to both the origin and destination warehouses.
      responses:
        "200":
          description: Current furniture readiness for the transfer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferFurnitureReadiness" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/transfers/{documentId}/lines/{lineId}/depart:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/LineId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/ExpectedLineVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: departTransferLine
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/transfers/{documentId}/lines/{lineId}/arrive:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/LineId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/ExpectedLineVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: arriveTransferLine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArriveTransferLineRequest" }
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/transfers/{documentId}/lines/{lineId}/arrival-preflight:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/LineId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/ExpectedLineVersion"
    get:
      operationId: getTransferArrivalPreflight
      description: >-
        Resolves the active repair that departed with this cabin and checks the
        destination warehouse queue bindings before any arrival mutation.
        Requires MANAGE access to both warehouses.
      responses:
        "200":
          description: Canonical repair-continuation requirements for this line.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferArrivalPreflight" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/transfers/{documentId}/cancel:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: cancelTransfer
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/equipment-movement-tasks:
    post:
      operationId: createEquipmentMovementTask
      description: >-
        Reserves every source balance until deadlineAt and creates one typed worker task.
        It never changes physical equipment balances itself: asset-service executes the
        reserved batch only after task-board reports DONE before the deadline.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "#/components/schemas/CreateEquipmentMovementTaskRequest",
              }
      responses:
        "200": { $ref: "#/components/responses/EquipmentMovementTask" }
        "201": { $ref: "#/components/responses/EquipmentMovementTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/equipment-movement-tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/EquipmentMovementTaskId"
    get:
      operationId: getEquipmentMovementTask
      responses:
        "200": { $ref: "#/components/responses/EquipmentMovementTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/equipment-movement-tasks/{taskId}/cancel:
    parameters:
      - $ref: "#/components/parameters/EquipmentMovementTaskId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: cancelEquipmentMovementTask
      description: >-
        Cancels an unfinished task and releases its source reservations. A task that
        has reached physical execution cannot be cancelled by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "#/components/schemas/CancelEquipmentMovementTaskRequest",
              }
      responses:
        "202": { $ref: "#/components/responses/EquipmentMovementTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/driver-tasks:
    get:
      operationId: listDriverTasks
      description: Lists logistics-owned task intents for the selected warehouse.
      parameters:
        - $ref: "#/components/parameters/WarehouseIdQuery"
      responses:
        "200":
          description: Driver task intents. Ordering and execution remain authoritative in task-board.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DriverTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createDriverTask
      description: >-
        Creates one cabin-movement intent and registers it in the warehouse's
        single queue with purpose LOGISTICS_DRIVER. AUTO resolves the current
        warehouse date; FIXED_DATE uses the supplied date. No queue-name lookup
        or fallback is allowed.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDriverTaskRequest" }
      responses:
        "200": { $ref: "#/components/responses/DriverTask" }
        "201": { $ref: "#/components/responses/DriverTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/admin/warehouse-operation-marks/{operationId}/recovery:
    post:
      operationId: recoverLogisticsWarehouseOperationMark
      description: >-
        Global-administrator-only, reviewed retry of one quarantined warehouse operation mark.
        The expected recovery version fences concurrent reviews; every accepted review is appended
        to an immutable audit table. Requires a USER token with rwms.write and SYSTEM_ADMIN or
        WMS_ADMIN global role.
      parameters:
        - name: operationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: warehouseId
          in: query
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WarehouseOperationMarkRecoveryRequest" }
      responses:
        "200":
          description: Requeued mark or the exact replay of an already accepted review.
          headers:
            Idempotency-Replayed:
              required: false
              schema: { type: string, const: "true" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WarehouseOperationMarkRecoveryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/internal/logistics/v1/maintenance/driver-tasks:
    post:
      operationId: createMaintenanceDriverTask
      description: >-
        Exact maintenance-service boundary used by estimate, repair, and
        inventory-repair orchestration. Requires a SERVICE token with
        sub=client_id=maintenance-service, audience rwms-services, and exactly
        the logistics.maintenance scope. It creates the same logistics-owned
        driver task as the public board and never bypasses repair-place
        capacity or the ordered CURRENT queue.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDriverTaskRequest" }
      responses:
        "200": { $ref: "#/components/responses/DriverTask" }
        "201": { $ref: "#/components/responses/DriverTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/internal/logistics/v1/maintenance/equipment-movement-tasks:
    post:
      operationId: createMaintenanceEquipmentMovementTask
      description: >-
        Exact maintenance-service boundary requiring the same SERVICE identity and exactly
        logistics.maintenance. Creates the logistics-owned, worker-confirmed movement that removes
        the administrator-selected furniture quantities from a cabin and returns them to STOCK in
        the same warehouse. Source reservations are acquired before board registration; asset
        balances change only after task-board confirms DONE. decisionId is a permanent owner key.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMaintenanceEquipmentMovementTaskRequest" }
      responses:
        "200": { $ref: "#/components/responses/EquipmentMovementTask" }
        "201": { $ref: "#/components/responses/EquipmentMovementTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/internal/logistics/v1/maintenance/equipment-movement-tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/EquipmentMovementTaskId"
    get:
      operationId: getMaintenanceEquipmentMovementTask
      description: Exact maintenance-service read of current movement/effect truth.
      responses:
        "200": { $ref: "#/components/responses/EquipmentMovementTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/internal/logistics/v1/maintenance/driver-tasks/repairs/{repairId}:
    parameters:
      - name: repairId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: kind
        in: query
        required: true
        schema:
          type: string
          enum: [DELIVER_TO_REPAIR, CAPITAL_TO_PRODUCTION]
    get:
      operationId: getMaintenanceDriverTaskCompensation
      description: >-
        Reads the newest logistics-owned repair movement for maintenance
        replacement/merge compensation. This private endpoint is inaccessible
        to browsers and requires the exact maintenance-service token used by
        the maintenance driver-task intake.
      responses:
        "200":
          description: Strict current compensation snapshot; ABSENT is a successful empty lookup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceDriverTaskCompensation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/internal/logistics/v1/maintenance/driver-tasks/repairs/{repairId}/cancel:
    parameters:
      - name: repairId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: kind
        in: query
        required: true
        schema:
          type: string
          enum: [DELIVER_TO_REPAIR, CAPITAL_TO_PRODUCTION]
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: cancelMaintenanceDriverTaskCompensation
      description: >-
        Cancels an unregistered local intent, or returns a strict outcome for
        registered work. A registered task is never sent to the legacy broad
        task-board cancel command: logistics uses task-board's atomic
        expected-task-version, WAITING-only pre-start cancellation guard.
        For DELIVER_TO_REPAIR, CANCELLED or ALREADY_CANCELLED first releases
        only the same still-RESERVED repair-place allocation with a stable
        task-owned idempotency key, then records the local terminal
        cancellation. CAPITAL_TO_PRODUCTION preserves its repair-place
        allocation for maintenance reassignment/continued work. A lost
        response, non-RESERVED allocation, release failure, or a second
        version conflict remains RECONCILIATION_REQUIRED; retry with the same
        Idempotency-Key. STARTED and COMPLETED are preserved, never cancelled.
      responses:
        "200":
          description: Effective compensation truth; STARTED and COMPLETED are preserved, never cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceDriverTaskCompensation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/logistics/v1/driver-tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/DriverTaskId"
    get:
      operationId: getDriverTask
      responses:
        "200": { $ref: "#/components/responses/DriverTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/driver-tasks/{taskId}/promote:
    parameters:
      - $ref: "#/components/parameters/DriverTaskId"
    post:
      operationId: promoteDriverTask
      description: >-
        Manually moves this exact scheduled task into the ordered CURRENT
        lane, regardless of its planned calendar date. Repair delivery first
        reserves a free repair place or pairs with an earlier ready-to-release
        removal in the same ordered lane; missing capacity fails without a
        queue fallback.
      responses:
        "202": { $ref: "#/components/responses/DriverTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/driver-board:
    get:
      operationId: getDriverBoard
      description: >-
        Returns the warehouse's dedicated driver queue with the warehouse-local
        current date, an ordered CURRENT lane, finite ordered non-empty date
        columns, factual repair-place capacity and active capital repairs not
        yet moved to production.
      parameters:
        - $ref: "#/components/parameters/WarehouseIdQuery"
      responses:
        "200":
          description: Authoritative logistics board projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverBoard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/driver-board/tasks/{externalTaskId}/move:
    parameters:
      - name: externalTaskId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: moveDriverBoardTask
      description: >-
        Reorders a driver task inside a date, moves a CURRENT task back to a
        calendar date, or manually adds a scheduled capital-to-production
        movement to CURRENT. Ordinary logistics movements enter CURRENT only
        through the capacity-aware scheduler. The task-board versions are
        mandatory; already-running tasks are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveDriverBoardTaskRequest" }
      responses:
        "200":
          description: Moved driver card.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverBoardCard" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/driver-board/tasks/{externalTaskId}/return-to-capital-repairs:
    parameters:
      - name: externalTaskId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: returnDriverTaskToCapitalRepairs
      description: >-
        Cancels an unfinished capital-to-production movement while preserving
        its task history. The active repair becomes available in the dedicated
        capital-repair column again; ordinary movements are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReturnCapitalRepairRequest" }
      responses:
        "204": { description: Capital repair returned to its dedicated column. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/driver-board/capital-repairs/{repairId}/promote:
    parameters:
      - name: repairId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: promoteCapitalRepairToDriverCurrent
      description: >-
        Creates or replays the single capital-to-production movement and moves
        it into CURRENT. It never creates an ordinary repair-board task.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromoteCapitalRepairRequest" }
      responses:
        "200": { $ref: "#/components/responses/DriverTask" }
        "201": { $ref: "#/components/responses/DriverTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/driver-board/capital-repairs/{repairId}/schedule:
    parameters:
      - name: repairId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: scheduleCapitalRepairOnDriverBoard
      description: >-
        Creates or replays the single capital-to-production movement directly
        in a selected calendar date and queue position. The logistics service
        owns registration and insertion; the browser never promotes and moves
        the repair as two commands.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleCapitalRepairRequest" }
      responses:
        "200": { $ref: "#/components/responses/DriverBoardCard" }
        "201": { $ref: "#/components/responses/DriverBoardCard" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/orders:
    get:
      operationId: listOrders
      description: >-
        Server-paginated order search. Managers receive only managerId == JWT sub;
        warehouse managers receive granted-warehouse orders plus their own unassigned drafts;
        system administrators receive the global view.
      parameters:
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
        - {
            name: size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
        - { name: search, in: query, schema: { type: string, default: "" } }
        - {
            name: sort,
            in: query,
            schema:
              {
                type: string,
                enum:
                  [
                    number,
                    client,
                    manager,
                    warehouse,
                    status,
                    createdAt,
                    updatedAt,
                  ],
                default: updatedAt,
              },
          }
        - {
            name: direction,
            in: query,
            schema: { type: string, enum: [ASC, DESC], default: DESC },
          }
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              {
                type: string,
                enum: [DRAFT, SAVED, FULFILLED, CLOSED, CANCELLED],
              }
        - name: clientType
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/ClientType" }
        - name: warehouseId
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, format: uuid }
        - {
            name: createdFrom,
            in: query,
            schema: { type: string, format: date-time },
          }
        - {
            name: createdTo,
            in: query,
            schema: { type: string, format: date-time },
          }
      responses:
        "200":
          description: Visible orders only.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/OrderPage" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createOrder
      description: >-
        Creates a DRAFT order owned by the JWT subject. Exactly one existing
        clientId or explicitly confirmed newClient is required.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "201": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/orders/{orderId}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      operationId: getOrder
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateOrder
      description: >-
        Replaces the selected client and complete delivery draft under expectedVersion.
        A SAVED order is editable only while its linked shipment remains an untouched draft.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrderRequest" }
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: cancelOrder
      description: Logically cancels an editable draft and atomically requests release of every active unit reservation.
      parameters:
        - $ref: "#/components/parameters/ExpectedVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/orders/{orderId}/save:
    parameters:
      - $ref: "#/components/parameters/OrderId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: saveOrder
      description: >-
        Locks a non-empty DRAFT order whose complete rental-duration vector, delivery address,
        coordinate pair, contact phone and non-empty acceptable-date list are configured. Saving
        does not implicitly choose a shipment batch; create one explicitly with selected unitIds.
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/orders/{orderId}/rental-terms:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    put:
      operationId: setOrderRentalTerms
      description: >-
        Replaces the complete rental-duration vector for the order cabins. It is accepted for a
        DRAFT order and for a SAVED order while every existing rental shipment is still an
        untouched draft. A term already assigned to a shipment is immutable here: cancel that
        draft shipment before changing it, or use the extension command after SHIPPED.
        shipmentDate and returnDate remain null until a cabin is assigned to a shipment.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetOrderRentalTermsRequest" }
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/orders/{orderId}/rental-terms/extend:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      operationId: extendOrderRentalTerms
      description: >-
        Extends only the selected cabins whose shipment is SHIPPED. Each selected cabin keeps its
        original shipmentDate and its returnDate moves forward by additionalMonths.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtendOrderRentalTermsRequest" }
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/orders/{orderId}/shipments:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      operationId: createOrderRentalShipment
      description: >-
        Creates one DRAFT shipment for exactly the selected unitIds. The driver and calendar date
        are saved immediately, and the date must be one of the configured acceptable delivery
        dates when that list is non-empty. Preparation starts only when the shipment plan command is called.
        A cabin cannot be selected by another non-cancelled shipment. When this shipment reaches
        SHIPPED, logistics creates one cabin-level return document per shipped line, each linked by
        rentalShipmentId, so return dates and drivers can be changed independently.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRentalShipmentRequest" }
      responses:
        "201": { $ref: "#/components/responses/CreatedDocument" }
        "200": { $ref: "#/components/responses/CreatedDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/clients:
    get:
      operationId: searchOrderClients
      description: >-
        Searches counterparties by normalized name. With an empty search query,
        returns the most recently created counterparties first.
      parameters:
        - {
            name: type,
            in: query,
            schema: { $ref: "#/components/schemas/ClientType" },
          }
        - { name: search, in: query, schema: { type: string, default: "" } }
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
        - {
            name: size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
      responses:
        "200":
          description: Matching normalized clients.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ClientPage" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createOrderClient
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateClientRequest" }
      responses:
        "200": { $ref: "#/components/responses/OrderClient" }
        "201": { $ref: "#/components/responses/OrderClient" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/clients/{clientId}:
    parameters:
      - name: clientId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getOrderClient
      description: >-
        Returns a client only when the caller can see at least one of the
        client's orders, owns the client as its responsible manager, or has a
        global logistics view. An inaccessible client is not disclosed.
      responses:
        "200": { $ref: "#/components/responses/OrderClient" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/clients/{clientId}/orders:
    parameters:
      - name: clientId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listOrderClientOrders
      description: >-
        Returns the server-paginated subset of this client's orders visible to
        the authenticated caller. The client itself is not disclosed when no
        visibility rule applies.
      parameters:
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
        - {
            name: size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
        - {
            name: sort,
            in: query,
            schema:
              {
                type: string,
                enum: [number, client, manager, warehouse, status, createdAt, updatedAt],
                default: updatedAt,
              },
          }
        - {
            name: direction,
            in: query,
            schema: { type: string, enum: [ASC, DESC], default: DESC },
          }
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              { type: string, enum: [DRAFT, SAVED, FULFILLED, CLOSED, CANCELLED] }
        - name: warehouseId
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, format: uuid }
        - { name: createdFrom, in: query, schema: { type: string, format: date-time } }
        - { name: createdTo, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Visible orders for this client.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/orders/{orderId}/warehouse:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    put:
      operationId: selectOrderWarehouse
      description: Warehouse changes are rejected after the first active unit reservation.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelectOrderWarehouseRequest" }
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/orders/{orderId}/available-units:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      operationId: listOrderUnitCandidates
      parameters:
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
        - {
            name: size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - { name: search, in: query, schema: { type: string, default: "" } }
      responses:
        "200":
          description: Free units plus units already added to this order.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/OrderUnitPage" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/orders/{orderId}/units:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      operationId: addOrderUnit
      description: Atomically reserves one unit in asset-service for this editable order.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddOrderUnitRequest" }
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "201": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/orders/{orderId}/units/{unitId}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
      - $ref: "#/components/parameters/UnitId"
    delete:
      operationId: removeOrderUnit
      parameters:
        - $ref: "#/components/parameters/ExpectedVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/orders/{orderId}/units/{unitId}/desired-equipment:
    parameters:
      - $ref: "#/components/parameters/OrderId"
      - $ref: "#/components/parameters/UnitId"
    put:
      operationId: setOrderUnitDesiredEquipment
      description: >-
        Replaces the desired catalogue furniture for one draft order cabin. This creates an
        order-wide reservation, not an immediate physical movement or a time-limited cabin hold.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetOrderUnitDesiredEquipmentRequest" }
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/orders/{orderId}/history:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      operationId: getOrderHistory
      responses:
        "200":
          description: Append-only order audit history.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrderHistoryEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/manual-booking-drafts/{draftId}/holds:
    parameters:
      - name: draftId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getManualBookingDraftHolds
      description: >-
        Reads the current manager-owned holds for a manual booking draft.
        Expired holds are omitted.
      parameters:
        - name: warehouseId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current draft holds, possibly empty after expiry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualBookingDraftHolds" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    put:
      operationId: replaceManualBookingDraftHolds
      description: >-
        Starts or replaces the server-side hold only when the manager continues
        a manual booking. Checkbox selection before this command is not a hold.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualBookingDraftHoldsRequest" }
      responses:
        "200":
          description: All requested cabins are held until expiresAt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualBookingDraftHolds" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/rental-inquiries:
    post:
      operationId: createRentalInquiry
      description: >-
        Creates or replays the manager-owned rental inquiry that binds one
        immutable existing or newly resolved client to one assistant conversation.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRentalInquiryRequest" }
      responses:
        "201":
          description: Current inquiry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentalInquiry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/rental-inquiries/{inquiryId}:
    parameters:
      - $ref: "#/components/parameters/InquiryId"
    get:
      operationId: getRentalInquiry
      responses:
        "200":
          description: Current inquiry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentalInquiry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/rental-inquiries/{inquiryId}/cabin-facets:
    parameters:
      - $ref: "#/components/parameters/InquiryId"
    get:
      operationId: getRentalInquiryCabinFacets
      description: >-
        Returns bounded exact availability facets for warehouses visible to
        this inquiry's manager. It performs no natural-language interpretation.
      responses:
        "200":
          description: Exact warehouse and cabin facets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinFacets" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/rental-inquiries/{inquiryId}/cabin-searches:
    parameters:
      - $ref: "#/components/parameters/InquiryId"
    post:
      operationId: searchRentalInquiryCabins
      description: >-
        Write-authorized, subject-scoped idempotent search for currently rentable cabins by exact
        structured filters supplied by the LLM tool call. Every result is FREE; category is an
        independent exact filter and may be omitted. An identical retry resumes the exact frozen
        asset command; reusing the key for another inquiry, warehouse, or group set is a conflict.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CabinSearchRequest" }
      responses:
        "200":
          description: Rentable cabins grouped in request order, or the frozen successful replay.
          headers:
            Idempotency-Replayed:
              required: false
              description: Present with value `true` when the response came from the frozen completed receipt.
              schema: { type: string, const: "true" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinSearchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/rental-inquiries/{inquiryId}/cabin-selection:
    parameters:
      - $ref: "#/components/parameters/InquiryId"
    get:
      operationId: getRentalInquiryCabinSelection
      description: >-
        Returns the inquiry's authoritative asset-owned chat holds and current
        cabin snapshots. An empty released selection has a null expiresAt.
      responses:
        "200":
          description: Current authoritative chat selection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinSelectionResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    put:
      operationId: replaceRentalInquiryCabinSelection
      description: >-
        Replaces the full asset-owned chat selection using the configured hold
        duration. The empty list releases every inquiry hold immediately. The
        server durably freezes the exact downstream command and a non-null
        retry deadline before calling asset-service. A replace uses that same
        deadline as its public hold expiry; a release keeps the public expiry
        null but remains recoverable after its persisted retry deadline. An
        identical Idempotency-Key retry reuses the frozen bytes and returns the
        frozen successful response without another asset mutation; changed
        reuse is a conflict.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceCabinSelectionRequest" }
      responses:
        "200":
          description: Replaced or idempotently replayed authoritative selection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinSelectionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/rental-inquiries/{inquiryId}/cabin-catalog:
    parameters:
      - $ref: "#/components/parameters/InquiryId"
    get:
      operationId: searchRentalInquiryCabinCatalog
      description: >-
        Performs a bounded, read-only cabin fact lookup by number, type, or
        other catalog text. It never creates, extends, or releases holds.
      parameters:
        - name: warehouseId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - { name: query, in: query, schema: { type: string, default: "", maxLength: 255 } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Bounded cabin catalog page; no hold side effect.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinCatalogPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/rental-inquiries/{inquiryId}/cabin-availability:
    parameters:
      - $ref: "#/components/parameters/InquiryId"
    post:
      operationId: checkRentalInquiryCabinAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CabinAvailabilityRequest" }
      responses:
        "200":
          description: Current availability for the exact requested cabins.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinAvailabilityResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/rental-inquiries/{inquiryId}/client-presentation:
    parameters:
      - $ref: "#/components/parameters/InquiryId"
    get:
      operationId: getRentalInquiryClientPresentation
      responses:
        "200":
          description: Current published presentation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientPresentation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: publishRentalInquiryClientPresentation
      description: >-
        Publishes or replaces the inquiry presentation, atomically replacing
        its asset-side time-limited cabin holds and rotating the public link.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishClientPresentationRequest" }
      responses:
        "200":
          description: Published presentation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientPresentation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    delete:
      operationId: revokeRentalInquiryClientPresentation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Presentation revoked and active holds released. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/rental-booking-alerts:
    get:
      operationId: listRentalBookingAlerts
      description: >-
        Returns the current manager's unacknowledged completed client-presentation
        bookings in confirmation order. Each alert is assembled from the immutable
        presentation snapshot and contains only the cabins selected by the client.
      responses:
        "200":
          description: Unacknowledged client confirmations, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RentalBookingAlert" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/logistics/v1/rental-booking-alerts/{bookingId}/actions:
    parameters:
      - $ref: "#/components/parameters/PresentationBookingId"
    post:
      operationId: actOnRentalBookingAlert
      description: >-
        Acknowledges one client confirmation with optimistic concurrency and an
        Idempotency-Key. It never creates a second order; KEEP_DRAFT leaves the
        existing draft order unchanged.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RentalBookingAlertActionRequest" }
      responses:
        "204": { description: Booking alert action was recorded or replayed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/settings/rental:
    get:
      operationId: getRentalSettings
      responses:
        "200":
          description: Global rental presentation settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentalSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: updateRentalSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRentalSettingsRequest" }
      responses:
        "200":
          description: Updated settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentalSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/public/v1/client-presentations/{token}:
    parameters:
      - $ref: "#/components/parameters/PublicPresentationToken"
    get:
      security: []
      operationId: getPublicClientPresentation
      responses:
        "200":
          description: Public no-store presentation view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicClientPresentation" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: The post-expiry view window has ended.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ApiProblem" }
  /api/logistics/public/v1/client-presentations/{token}/bookings:
    parameters:
      - $ref: "#/components/parameters/PublicPresentationToken"
    post:
      security: []
      operationId: confirmPublicClientPresentation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmClientPresentationRequest" }
      responses:
        "201":
          description: Draft order was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresentationBooking" }
        "202":
          description: Idempotent booking orchestration is pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresentationBooking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Booking was rejected, or the selection can no longer be accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresentationBooking" }
            application/problem+json:
              schema: { $ref: "#/components/schemas/ApiProblem" }
        "410":
          description: Holds or the public view have expired.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ApiProblem" }
  /api/logistics/public/v1/client-presentations/{token}/bookings/{bookingId}:
    parameters:
      - $ref: "#/components/parameters/PublicPresentationToken"
      - $ref: "#/components/parameters/PresentationBookingId"
    get:
      security: []
      operationId: getPublicClientPresentationBooking
      responses:
        "200":
          description: Completed booking state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresentationBooking" }
        "201":
          description: Draft order was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresentationBooking" }
        "202":
          description: Booking is pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresentationBooking" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Booking was rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresentationBooking" }
  /api/logistics/public/v1/client-presentations/{token}/media/{cabinId}/{mediaId}/{generation}/{variant}:
    parameters:
      - $ref: "#/components/parameters/PublicPresentationToken"
      - $ref: "#/components/parameters/CabinId"
      - $ref: "#/components/parameters/MediaId"
      - $ref: "#/components/parameters/MediaGeneration"
      - $ref: "#/components/parameters/MediaVariant"
    get:
      security: []
      operationId: getPublicClientPresentationMedia
      responses:
        "200":
          description: Authorized no-store presentation image.
          headers:
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
          content:
            image/webp:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: The presentation view window has ended.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ApiProblem" }
  /api/logistics/v1/{documentType}/{documentId}/reconcile:
    parameters:
      - $ref: "#/components/parameters/DocumentTypePath"
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: reconcileDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconcileRequest" }
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LineId:
      name: lineId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentTypePath:
      name: documentType
      in: path
      required: true
      schema: { type: string, enum: [returns, shipments, transfers] }
    WarehouseIdQuery:
      name: warehouseId
      in: query
      required: true
      schema: { type: string, format: uuid }
    ExpectedVersion:
      name: expectedVersion
      in: query
      required: true
      schema: { type: integer, minimum: 0 }
    ExpectedLineVersion:
      name: expectedLineVersion
      in: query
      required: true
      schema: { type: integer, minimum: 0 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UnitId:
      name: unitId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EquipmentId:
      name: equipmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EquipmentMovementTaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DriverTaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InquiryId:
      name: inquiryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PublicPresentationToken:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 40, maxLength: 256 }
    PresentationBookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CabinId:
      name: cabinId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaGeneration:
      name: generation
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    MediaVariant:
      name: variant
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
  schemas:
    LogisticsDocument:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          documentType,
          state,
          warehouseId,
          destinationWarehouseId,
          partySnapshot,
          driverSnapshot,
          clientId,
          equipmentMovementTaskId,
          scheduledDate,
          scheduledAt,
          rentalOrderId,
          rentalShipmentId,
          lines,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        documentType: { type: string, enum: [RETURN, SHIPMENT, TRANSFER] }
        state:
          type: string
          enum:
            [
              DRAFT,
              REGISTERING,
              INSPECTION_REQUIRED,
              ACCEPTING,
              ACCEPTED,
              ESTIMATE_PENDING,
              ESTIMATE_REQUESTED,
              PREPARING,
              AWAITING_CONFIRMATION,
              CONFIRMING_PREPARATION,
              SHIPPED,
              CANCELLING,
              DEPARTING,
              IN_TRANSIT,
              ARRIVING,
              COMPLETED,
              CANCELLED,
              CONFLICT,
              RECONCILIATION_REQUIRED,
            ]
        warehouseId: { type: string, format: uuid }
        destinationWarehouseId: { type: [string, "null"], format: uuid }
        partySnapshot:
          {
            type: [string, "null"],
            maxLength: 512,
            description: Immutable,
            trimmed workflow snapshot; no directory identity.,
          }
        driverSnapshot:
          {
            type: [string, "null"],
            maxLength: 512,
            description: Immutable,
            trimmed workflow snapshot; no directory identity.,
          }
        clientId:
          {
            type: [string, "null"],
            format: uuid,
            description: Client bound to the return or shipment.,
          }
        equipmentMovementTaskId:
          {
            type: [string, "null"],
            format: uuid,
            description: Server-created task that moves transfer furniture between warehouses.,
          }
        scheduledDate:
          {
            type: [string, "null"],
            format: date,
            description: Assigned shipment, return pickup, or transfer task date; absent while waiting for scheduling.,
          }
        scheduledAt:
          {
            type: [string, "null"],
            format: date-time,
            description: Deprecated compatibility field. It is always null; logistics schedules by calendar date only.,
          }
        rentalOrderId:
          {
            type: [string, "null"],
            format: uuid,
            description: Order whose shipment/return lifecycle owns this document.,
          }
        rentalShipmentId:
          {
            type: [string, "null"],
            format: uuid,
          description: Shipment that produced this cabin-level rental return; null for shipments and generic documents.,
          }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/LogisticsLine" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LogisticsLine:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          lineNumber,
          assetId,
          assetVersion,
          state,
          tenantSnapshot,
          rentalOrderId,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        lineNumber: { type: integer, minimum: 1 }
        assetId: { type: string, format: uuid }
        assetVersion: { type: integer, minimum: 0 }
        state:
          {
            type: string,
            enum:
              [
                PENDING,
                DEPARTING,
                DEPARTED,
                ARRIVING,
                ARRIVED,
                CONFLICT,
                CANCELLED,
              ],
          }
        tenantSnapshot: { type: [string, "null"], maxLength: 512 }
        rentalOrderId:
          {
            type: [string, "null"],
            format: uuid,
            description: Rental order that owns the return or shipment cabin reservation.,
          }
    EquipmentMovementLocationKind:
      type: string
      enum: [STOCK, CABIN_NON_RENTED, CABIN_RENTED]
    EquipmentMovementTaskState:
      type: string
      enum:
        [
          RESERVING,
          REGISTERING_TASK,
          AWAITING_WORKER,
          EXECUTING,
          CANCELLING,
          COMPLETED,
          CANCELLED,
          EXPIRED,
          CONFLICT,
          RECONCILIATION_REQUIRED,
        ]
    EquipmentMovementTaskOwnerType:
      type: string
      enum: [USER_REQUEST, MAINTENANCE_DISPOSITION]
    EquipmentMovementLineState:
      type: string
      enum: [PENDING_RESERVATION, RESERVED, EXECUTED, RELEASED]
    EquipmentMovementLineRequest:
      type: object
      additionalProperties: false
      required:
        [
          equipmentId,
          sourceRentalItemId,
          sourceLocationKind,
          expectedSourceBalanceVersion,
          targetRentalItemId,
          targetLocationKind,
          quantity,
        ]
      properties:
        equipmentId: { type: string, format: uuid }
        sourceRentalItemId: { type: [string, "null"], format: uuid }
        sourceLocationKind:
          { $ref: "#/components/schemas/EquipmentMovementLocationKind" }
        expectedSourceBalanceVersion:
          { type: integer, format: int64, minimum: 0 }
        targetRentalItemId: { type: [string, "null"], format: uuid }
        targetLocationKind:
          { $ref: "#/components/schemas/EquipmentMovementLocationKind" }
        quantity: { type: integer, format: int64, minimum: 1 }
    CreateEquipmentMovementTaskRequest:
      type: object
      additionalProperties: false
      required:
        [
          warehouseId,
          targetWarehouseId,
          unitNumber,
          plannedDurationMinutes,
          deadlineAt,
          lines,
        ]
      properties:
        warehouseId: { type: string, format: uuid }
        targetWarehouseId:
          {
            type: [string, "null"],
            format: uuid,
            description: Target warehouse for STOCK-to-STOCK movement; omitted means the source warehouse.,
          }
        unitNumber: { type: [string, "null"], maxLength: 64 }
        plannedDurationMinutes: { type: integer, minimum: 1 }
        deadlineAt: { type: string, format: date-time }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          description: >-
            At most one hundred worker operations are accepted. A cabin-to-cabin line produces
            two operations (take out and bring in); a stock/cabin line produces one.
          items: { $ref: "#/components/schemas/EquipmentMovementLineRequest" }
    CreateMaintenanceEquipmentMovementTaskRequest:
      type: object
      additionalProperties: false
      required:
        [
          decisionId,
          warehouseId,
          unitNumber,
          plannedDurationMinutes,
          deadlineAt,
          lines,
        ]
      properties:
        decisionId:
          { type: string, format: uuid, description: Permanent maintenance disposition owner. }
        warehouseId: { type: string, format: uuid }
        unitNumber: { type: string, minLength: 1, maxLength: 64 }
        plannedDurationMinutes: { type: integer, minimum: 1 }
        deadlineAt: { type: string, format: date-time }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          description: >-
            Each unique equipment line moves a positive quantity from this decision's cabin
            CABIN_NON_RENTED balance to STOCK in the same warehouse. Zero lines are omitted.
          items: { $ref: "#/components/schemas/MaintenanceEquipmentMovementLineRequest" }
    MaintenanceEquipmentMovementLineRequest:
      type: object
      additionalProperties: false
      required: [equipmentId, sourceRentalItemId, expectedSourceBalanceVersion, quantity]
      properties:
        equipmentId: { type: string, format: uuid }
        sourceRentalItemId: { type: string, format: uuid }
        expectedSourceBalanceVersion: { type: integer, format: int64, minimum: 0 }
        quantity: { type: integer, format: int64, minimum: 1 }
    CancelEquipmentMovementTaskRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    EquipmentMovementTaskLine:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          lineNumber,
          equipmentId,
          equipmentName,
          sourceWarehouseId,
          sourceRentalItemId,
          sourceLocationKind,
          expectedSourceBalanceVersion,
          targetWarehouseId,
          targetRentalItemId,
          targetLocationKind,
          quantity,
          reservationId,
          reservationVersion,
          state,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        lineNumber: { type: integer, minimum: 1 }
        equipmentId: { type: string, format: uuid }
        equipmentName: { type: [string, "null"], maxLength: 512 }
        sourceWarehouseId: { type: string, format: uuid }
        sourceRentalItemId: { type: [string, "null"], format: uuid }
        sourceLocationKind:
          { $ref: "#/components/schemas/EquipmentMovementLocationKind" }
        expectedSourceBalanceVersion:
          { type: integer, format: int64, minimum: 0 }
        targetWarehouseId: { type: string, format: uuid }
        targetRentalItemId: { type: [string, "null"], format: uuid }
        targetLocationKind:
          { $ref: "#/components/schemas/EquipmentMovementLocationKind" }
        quantity: { type: integer, format: int64, minimum: 1 }
        reservationId: { type: [string, "null"], format: uuid }
        reservationVersion:
          { type: [integer, "null"], format: int64, minimum: 0 }
        state: { $ref: "#/components/schemas/EquipmentMovementLineState" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EquipmentMovementTask:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          warehouseId,
          ownerType,
          ownerId,
          externalTaskId,
          taskBoardTaskId,
          taskBoardTaskVersion,
          taskBoardDoneAt,
          unitNumber,
          plannedDurationMinutes,
          deadlineAt,
          state,
          terminalState,
          failureCode,
          lines,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        ownerType: { $ref: "#/components/schemas/EquipmentMovementTaskOwnerType" }
        ownerId:
          type: [string, "null"]
          format: uuid
          description: decisionId for MAINTENANCE_DISPOSITION; null for USER_REQUEST.
        externalTaskId: { type: string, format: uuid }
        taskBoardTaskId: { type: [string, "null"], format: uuid }
        taskBoardTaskVersion:
          { type: [integer, "null"], format: int64, minimum: 0 }
        taskBoardDoneAt: { type: [string, "null"], format: date-time }
        unitNumber: { type: [string, "null"], maxLength: 64 }
        plannedDurationMinutes: { type: integer, minimum: 1 }
        deadlineAt: { type: string, format: date-time }
        state: { $ref: "#/components/schemas/EquipmentMovementTaskState" }
        terminalState:
          oneOf:
            - { $ref: "#/components/schemas/EquipmentMovementTaskState" }
            - { type: "null" }
        failureCode: { type: [string, "null"], maxLength: 96 }
        lines:
          type: array
          items: { $ref: "#/components/schemas/EquipmentMovementTaskLine" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DriverTaskKind:
      type: string
      enum:
        [DELIVER_TO_REPAIR, REMOVE_FROM_REPAIR, CAPITAL_TO_PRODUCTION, GENERAL_MOVEMENT]
    DriverTaskSourceType:
      type: string
      enum: [REPAIR, ESTIMATE, INVENTORY, REPAIR_PLACE, CAPITAL_REPAIR, MANUAL]
    DriverTaskPlanningMode:
      type: string
      enum: [AUTO, FIXED_DATE]
    DriverTaskState:
      type: string
      enum:
        [REGISTERING, SCHEDULED, CURRENT, FINALIZING, COMPLETED, CANCELLED, RECONCILIATION_REQUIRED]
    MaintenanceDriverTaskCompensationOutcome:
      type: string
      enum:
        [ABSENT, PENDING, CANCELLED, STARTED, COMPLETED, RECONCILIATION_REQUIRED]
    MaintenanceDriverTaskCompensation:
      type: object
      additionalProperties: false
      required:
        [
          repairId,
          kind,
          outcome,
          taskId,
          taskVersion,
          state,
          externalTaskId,
          taskBoardTaskId,
          taskBoardTaskVersion,
          taskBoardEntryId,
          taskBoardEntryVersion,
          taskBoardEntryStatus,
          taskBoardStatus,
          taskBoardLane,
          taskBoardDoneAt,
          repairPlaceAllocationId,
          repairPlaceAllocationVersion,
        ]
      properties:
        repairId: { type: string, format: uuid }
        kind:
          type: string
          enum: [DELIVER_TO_REPAIR, CAPITAL_TO_PRODUCTION]
        outcome:
          { $ref: "#/components/schemas/MaintenanceDriverTaskCompensationOutcome" }
        taskId: { type: [string, "null"], format: uuid }
        taskVersion: { type: [integer, "null"], format: int64, minimum: 0 }
        state:
          oneOf:
            - { $ref: "#/components/schemas/DriverTaskState" }
            - { type: "null" }
        externalTaskId: { type: [string, "null"], format: uuid }
        taskBoardTaskId: { type: [string, "null"], format: uuid }
        taskBoardTaskVersion:
          { type: [integer, "null"], format: int64, minimum: 0 }
        taskBoardEntryId: { type: [string, "null"], format: uuid }
        taskBoardEntryVersion:
          { type: [integer, "null"], format: int64, minimum: 0 }
        taskBoardEntryStatus: { type: [string, "null"], maxLength: 24 }
        taskBoardStatus: { type: [string, "null"], maxLength: 24 }
        taskBoardLane: { type: [string, "null"], maxLength: 24 }
        taskBoardDoneAt: { type: [string, "null"], format: date-time }
        repairPlaceAllocationId: { type: [string, "null"], format: uuid }
        repairPlaceAllocationVersion:
          { type: [integer, "null"], format: int64, minimum: 0 }
    CreateDriverTaskRequest:
      type: object
      additionalProperties: false
      required:
        [warehouseId, cabinId, repairId, sourceType, sourceId, kind, planningMode, scheduledDate, priority, activateNow]
      properties:
        warehouseId: { type: string, format: uuid }
        cabinId: { type: string, format: uuid }
        repairId: { type: [string, "null"], format: uuid }
        sourceType: { $ref: "#/components/schemas/DriverTaskSourceType" }
        sourceId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/DriverTaskKind" }
        planningMode: { $ref: "#/components/schemas/DriverTaskPlanningMode" }
        scheduledDate:
          description: Required only for FIXED_DATE and forbidden for AUTO.
          type: [string, "null"]
          format: date
        priority: { type: integer, minimum: 1, maximum: 5 }
        activateNow:
          type: boolean
          description: Used by an explicit drag into CURRENT; DELIVER_TO_REPAIR still requires a free or paired repair place.
        comment:
          type: [string, "null"]
          maxLength: 1000
          description: Required and nonblank for MANUAL / GENERAL_MOVEMENT; optional for other task sources.
    DriverTask:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          warehouseId,
          cabinId,
          repairId,
          sourceType,
          sourceId,
          kind,
          planningMode,
          scheduledDate,
          priority,
          comment,
          unitNumber,
          driverQueueDefinitionId,
          externalTaskId,
          taskBoardTaskId,
          taskBoardTaskVersion,
          taskBoardEntryId,
          taskBoardEntryStatus,
          taskBoardDoneAt,
          state,
          repairPlaceAllocationId,
          repairPlaceAllocationVersion,
          completionMediaId,
          completionMediaGeneration,
          coverApplied,
          repairPlaceEffectApplied,
          failureCode,
          createdAt,
          updatedAt,
          completedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        cabinId: { type: string, format: uuid }
        repairId: { type: [string, "null"], format: uuid }
        sourceType: { $ref: "#/components/schemas/DriverTaskSourceType" }
        sourceId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/DriverTaskKind" }
        planningMode: { $ref: "#/components/schemas/DriverTaskPlanningMode" }
        scheduledDate: { type: string, format: date }
        priority: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, "null"], maxLength: 1000 }
        unitNumber: { type: string, minLength: 1, maxLength: 64 }
        driverQueueDefinitionId: { type: string, format: uuid }
        externalTaskId: { type: string, format: uuid }
        taskBoardTaskId: { type: [string, "null"], format: uuid }
        taskBoardTaskVersion: { type: [integer, "null"], format: int64, minimum: 0 }
        taskBoardEntryId: { type: [string, "null"], format: uuid }
        taskBoardEntryStatus: { type: [string, "null"], maxLength: 24 }
        taskBoardDoneAt: { type: [string, "null"], format: date-time }
        state: { $ref: "#/components/schemas/DriverTaskState" }
        repairPlaceAllocationId: { type: [string, "null"], format: uuid }
        repairPlaceAllocationVersion: { type: [integer, "null"], format: int64, minimum: 0 }
        completionMediaId: { type: [string, "null"], format: uuid }
        completionMediaGeneration: { type: [integer, "null"], format: int64, minimum: 1 }
        coverApplied: { type: boolean }
        repairPlaceEffectApplied: { type: boolean }
        failureCode: { type: [string, "null"], maxLength: 96 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
    DriverBoardCard:
      type: object
      additionalProperties: false
      required:
        [
          driverTaskId,
          externalTaskId,
          taskBoardTaskId,
          taskBoardTaskVersion,
          taskBoardEntryId,
          taskBoardEntryVersion,
          title,
          taskText,
          unitNumber,
          kind,
          workflowState,
          taskStatus,
          entryStatus,
          scheduledDate,
          lane,
          priority,
          pinned,
          position,
        ]
      properties:
        driverTaskId: { type: [string, "null"], format: uuid }
        externalTaskId: { type: string, format: uuid }
        taskBoardTaskId: { type: string, format: uuid }
        taskBoardTaskVersion: { type: integer, format: int64, minimum: 0 }
        taskBoardEntryId: { type: string, format: uuid }
        taskBoardEntryVersion: { type: integer, format: int64, minimum: 0 }
        title: { type: string }
        taskText: { type: [string, "null"] }
        unitNumber: { type: [string, "null"] }
        kind:
          oneOf:
            - { $ref: "#/components/schemas/DriverTaskKind" }
            - { type: "null" }
        workflowState:
          oneOf:
            - { $ref: "#/components/schemas/DriverTaskState" }
            - { type: "null" }
        taskStatus: { type: string, enum: [ACTIVE, DONE, CANCELLED] }
        entryStatus: { type: string, enum: [WAITING, IN_PROGRESS, PAUSED, DONE, CANCELLED] }
        scheduledDate: { type: string, format: date }
        lane: { type: string, enum: [SCHEDULED, CURRENT] }
        priority: { type: integer, minimum: 1, maximum: 5 }
        pinned: { type: boolean }
        position: { type: integer, minimum: 0 }
    DriverBoardDateColumn:
      type: object
      additionalProperties: false
      required: [date, tasks]
      properties:
        date: { type: string, format: date }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/DriverBoardCard" }
    CapitalRepairCard:
      type: object
      additionalProperties: false
      required:
        [repairId, repairVersion, cabinId, unitNumber, priority, complexityName, complexityColor, plannedMinutes, forcedCapital]
      properties:
        repairId: { type: string, format: uuid }
        repairVersion: { type: integer, format: int64, minimum: 0 }
        cabinId: { type: string, format: uuid }
        unitNumber: { type: string }
        priority: { type: integer, minimum: 1, maximum: 5 }
        complexityName: { type: string, const: "Капитальный ремонт" }
        complexityColor: { type: string, pattern: "^#[0-9A-F]{6}$" }
        plannedMinutes: { type: string, pattern: "^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,3})?$" }
        forcedCapital: { type: boolean }
    RepairPlaceStageState:
      type: string
      enum: [PLANNED, QUEUED, IN_PROGRESS, DONE, CANCELLED]
    DriverBoardRepairPlaceCard:
      type: object
      additionalProperties: false
      required: [repairId, cabinId, unitNumber, allocationState, repairStageName, repairStageState, priority]
      properties:
        repairId: { type: string, format: uuid }
        cabinId: { type: string, format: uuid }
        unitNumber: { type: string, minLength: 1, maxLength: 64 }
        allocationState:
          type: string
          enum: [OCCUPIED, READY_TO_RELEASE]
        repairStageName:
          oneOf:
            - { type: string, minLength: 1, maxLength: 255 }
            - { type: 'null' }
          description: Earliest unfinished maintenance stage, when one exists.
        repairStageState:
          oneOf:
            - { $ref: "#/components/schemas/RepairPlaceStageState" }
            - { type: 'null' }
          description: State of repairStageName; null when the repair has no unfinished stage.
        priority: { type: integer, minimum: 1, maximum: 5 }
    DriverBoard:
      type: object
      additionalProperties: false
      required:
        [warehouseId, currentDate, queueId, queueVersion, repairPlaceCount, usedRepairPlaceCount, occupiedRepairPlaceCount, availableRepairPlaceCount, inboundRepairPlaceAvailable, automaticRefillDelayMinutes, repairPlacesOverCapacity, repairPlaces, current, dates, capitalRepairs]
      properties:
        warehouseId: { type: string, format: uuid }
        currentDate: { type: string, format: date }
        queueId: { type: string, format: uuid }
        queueVersion: { type: integer, format: int64, minimum: 0 }
        repairPlaceCount: { type: integer, minimum: 1 }
        usedRepairPlaceCount:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Capacity-aware repair-place usage: occupied plus the larger of reservations and ready
            removals, so one paired removal/delivery uses one place.
        occupiedRepairPlaceCount:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Physically occupied places: occupied repairs plus cabins awaiting removal after repair.
        availableRepairPlaceCount: { type: integer, format: int64, minimum: 0 }
        inboundRepairPlaceAvailable:
          type: boolean
          description: True when a delivery can use a free place or pair with a ready removal.
        automaticRefillDelayMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: Maintenance-owned delay before a manually opened CURRENT hole may be refilled automatically.
        repairPlacesOverCapacity: { type: boolean }
        repairPlaces:
          type: array
          description: Cabins physically moved into the repair zone, including completed repairs awaiting removal.
          items: { $ref: "#/components/schemas/DriverBoardRepairPlaceCard" }
        current:
          type: array
          items: { $ref: "#/components/schemas/DriverBoardCard" }
        dates:
          type: array
          items: { $ref: "#/components/schemas/DriverBoardDateColumn" }
        capitalRepairs:
          type: array
          items: { $ref: "#/components/schemas/CapitalRepairCard" }
    MoveDriverBoardTaskRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, expectedTaskVersion, expectedEntryVersion, targetLane, targetDate, targetIndex]
      properties:
        warehouseId: { type: string, format: uuid }
        expectedTaskVersion: { type: integer, format: int64, minimum: 0 }
        expectedEntryVersion: { type: integer, format: int64, minimum: 0 }
        targetLane: { type: string, enum: [SCHEDULED, CURRENT] }
        targetDate: { type: string, format: date }
        targetIndex: { type: integer, minimum: 0 }
