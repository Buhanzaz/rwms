          readinessDetail,
          legacyCompatible,
          scheduledDate,
          plannedDepartureAt,
          plannedArrivalAt,
          logisticsComment,
          tripDriverId,
          tripVehicleId,
          driverReposition,
          vehicleReposition,
          cabinGroups,
          looseFurniture,
          totalCabinCount,
          furnitureTotals,
        ]
