openapi: 3.1.0
info:
  title: RWMS Logistics Service API
  version: 1.0.0
  description: >-
    Canonical Stage 8 API for return, shipment, and transfer documents.
    Public operations require a locally validated USER Bearer JWT, the
    matching rwms scope, and warehouse access. Every retriable mutation uses
    a subject-bound Idempotency-Key; mutable transitions also require the
    current document version.
servers:
  - url: /
security:
  - bearerJwt: []
paths:
  /api/logistics/v1/returns:
    get:
      operationId: listReturns
      description: Lists visible return documents. Requires rwms.read and VIEW at the document warehouse.
      parameters:
        - $ref: '#/components/parameters/WarehouseIdQuery'
      responses:
        '200': { $ref: '#/components/responses/DocumentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createReturn
      description: Creates a DRAFT return. No canonical asset effect occurs during creation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReturnRequest' }
      responses:
        '201': { $ref: '#/components/responses/CreatedDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/logistics/v1/returns/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: getReturn
      responses:
        '200': { $ref: '#/components/responses/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/logistics/v1/returns/{documentId}/register:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/ExpectedVersion'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: registerReturn
      description: Starts the fenced return-intake saga from a DRAFT return.
      responses:
        '202': { $ref: '#/components/responses/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/logistics/v1/returns/{documentId}/accept-undamaged:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/ExpectedVersion'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: acceptUndamagedReturn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptReturnRequest' }
      responses:
        '202': { $ref: '#/components/responses/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/logistics/v1/returns/{documentId}/request-estimate:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/ExpectedVersion'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: requestReturnEstimate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestReturnEstimateRequest' }
      responses:
        '202': { $ref: '#/components/responses/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/logistics/v1/shipments:
    get:
      operationId: listShipments
      parameters:
        - $ref: '#/components/parameters/WarehouseIdQuery'
      responses:
        '200': { $ref: '#/components/responses/DocumentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createShipment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateShipmentRequest' }
      responses:
        '201': { $ref: '#/components/responses/CreatedDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/logistics/v1/shipments/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: getShipment
      responses:
        '200': { $ref: '#/components/responses/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/logistics/v1/shipments/{documentId}/plan:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/ExpectedVersion'
      - $ref: '#/components/parameters/IdempotencyKey'
    put:
      operationId: replaceShipmentPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShipmentPlanRequest' }
      responses:
        '202': { $ref: '#/components/responses/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/logistics/v1/shipments/{documentId}/confirm-preparation:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/ExpectedVersion'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: confirmShipmentPreparation
      responses:
        '202': { $ref: '#/components/responses/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/logistics/v1/shipments/{documentId}/cancel:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/ExpectedVersion'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: cancelShipment
      responses:
        '202': { $ref: '#/components/responses/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/logistics/v1/transfers:
    get:
      operationId: listTransfers
      parameters:
        - $ref: '#/components/parameters/WarehouseIdQuery'
      responses:
        '200': { $ref: '#/components/responses/DocumentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createTransfer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransferRequest' }
      responses:
        '201': { $ref: '#/components/responses/CreatedDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/logistics/v1/transfers/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: getTransfer
      responses:
        '200': { $ref: '#/components/responses/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/logistics/v1/transfers/{documentId}/lines/{lineId}/depart:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/LineId'
      - $ref: '#/components/parameters/ExpectedVersion'
      - $ref: '#/components/parameters/ExpectedLineVersion'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: departTransferLine
      responses:
        '202': { $ref: '#/components/responses/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/logistics/v1/transfers/{documentId}/lines/{lineId}/arrive:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/LineId'
      - $ref: '#/components/parameters/ExpectedVersion'
      - $ref: '#/components/parameters/ExpectedLineVersion'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: arriveTransferLine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArriveTransferLineRequest' }
      responses:
        '202': { $ref: '#/components/responses/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/logistics/v1/transfers/{documentId}/cancel:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/ExpectedVersion'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: cancelTransfer
      responses:
        '202': { $ref: '#/components/responses/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/logistics/v1/equipment-movement-tasks:
    post:
      operationId: createEquipmentMovementTask
      description: >-
        Reserves every source balance until deadlineAt and creates one typed worker task.
        It never changes physical equipment balances itself: asset-service executes the
        reserved batch only after task-board reports DONE before the deadline.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEquipmentMovementTaskRequest' }
      responses:
        '200': { $ref: '#/components/responses/EquipmentMovementTask' }
        '201': { $ref: '#/components/responses/EquipmentMovementTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/logistics/v1/equipment-movement-tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/EquipmentMovementTaskId'
    get:
      operationId: getEquipmentMovementTask
      responses:
        '200': { $ref: '#/components/responses/EquipmentMovementTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/logistics/v1/equipment-movement-tasks/{taskId}/cancel:
    parameters:
      - $ref: '#/components/parameters/EquipmentMovementTaskId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: cancelEquipmentMovementTask
      description: >-
        Cancels an unfinished task and releases its source reservations. A task that
        has reached physical execution cannot be cancelled by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelEquipmentMovementTaskRequest' }
      responses:
        '202': { $ref: '#/components/responses/EquipmentMovementTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/logistics/v1/orders:
    get:
      operationId: listOrders
      description: >-
        Server-paginated order search. Managers receive only managerId == JWT sub;
        warehouse managers receive granted-warehouse orders plus their own unassigned drafts;
        system administrators receive the global view.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: search, in: query, schema: { type: string, default: '' } }
        - { name: sort, in: query, schema: { type: string, enum: [number, client, manager, warehouse, status, createdAt, updatedAt], default: updatedAt } }
        - { name: direction, in: query, schema: { type: string, enum: [ASC, DESC], default: DESC } }
      responses:
        '200':
          description: Visible orders only.
          content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createOrder
      description: >-
        Creates a DRAFT order owned by the JWT subject. Exactly one existing
        clientId or explicitly confirmed newClient is required.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '200': { $ref: '#/components/responses/OrderDetail' }
        '201': { $ref: '#/components/responses/OrderDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/logistics/v1/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: getOrder
      responses:
        '200': { $ref: '#/components/responses/OrderDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateOrder
      description: Updates only the existing client of an editable DRAFT order.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOrderRequest' }
      responses:
        '200': { $ref: '#/components/responses/OrderDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: cancelOrder
      description: Logically cancels an editable draft and atomically requests release of every active unit reservation.
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/OrderDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/logistics/v1/clients:
    get:
      operationId: searchOrderClients
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ClientType' } }
        - { name: search, in: query, schema: { type: string, default: '' } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Matching normalized clients.
          content: { application/json: { schema: { $ref: '#/components/schemas/ClientPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createOrderClient
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateClientRequest' }
      responses:
        '200': { $ref: '#/components/responses/OrderClient' }
        '201': { $ref: '#/components/responses/OrderClient' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/logistics/v1/orders/{orderId}/warehouse:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    put:
      operationId: selectOrderWarehouse
      description: Warehouse changes are rejected after the first active unit reservation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SelectOrderWarehouseRequest' }
      responses:
        '200': { $ref: '#/components/responses/OrderDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/logistics/v1/orders/{orderId}/available-units:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: listOrderUnitCandidates
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: search, in: query, schema: { type: string, default: '' } }
      responses:
        '200':
          description: Free units plus units already added to this order.
          content: { application/json: { schema: { $ref: '#/components/schemas/OrderUnitPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/logistics/v1/orders/{orderId}/units:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: addOrderUnit
      description: Atomically reserves one unit in asset-service for this editable order.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddOrderUnitRequest' }
      responses:
        '200': { $ref: '#/components/responses/OrderDetail' }
        '201': { $ref: '#/components/responses/OrderDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/logistics/v1/orders/{orderId}/units/{unitId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/UnitId'
    delete:
      operationId: removeOrderUnit
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/OrderDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/logistics/v1/orders/{orderId}/units/{unitId}/equipment/{equipmentId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/UnitId'
      - $ref: '#/components/parameters/EquipmentId'
    put:
      operationId: adjustOrderUnitEquipment
      description: >-
        Sets required quantity using only the stock-to-selected-unit or
        selected-unit-to-stock asset operation. Arbitrary unit-to-unit movement is impossible.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustOrderEquipmentRequest' }
      responses:
        '200': { $ref: '#/components/responses/OrderDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/logistics/v1/orders/{orderId}/history:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: getOrderHistory
      responses:
        '200':
          description: Append-only order audit history.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderHistoryEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/logistics/v1/{documentType}/{documentId}/reconcile:
    parameters:
      - $ref: '#/components/parameters/DocumentTypePath'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/ExpectedVersion'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: reconcileDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconcileRequest' }
      responses:
        '202': { $ref: '#/components/responses/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LineId:
      name: lineId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentTypePath:
      name: documentType
      in: path
      required: true
      schema: { type: string, enum: [returns, shipments, transfers] }
    WarehouseIdQuery:
      name: warehouseId
      in: query
      required: true
      schema: { type: string, format: uuid }
    ExpectedVersion:
      name: expectedVersion
      in: query
      required: true
      schema: { type: integer, minimum: 0 }
    ExpectedLineVersion:
      name: expectedLineVersion
      in: query
      required: true
      schema: { type: integer, minimum: 0 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UnitId:
      name: unitId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EquipmentId:
      name: equipmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EquipmentMovementTaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    LogisticsDocument:
      type: object
      additionalProperties: false
      required: [id, version, documentType, state, warehouseId, destinationWarehouseId, partySnapshot, driverSnapshot, lines, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        documentType: { type: string, enum: [RETURN, SHIPMENT, TRANSFER] }
        state:
          type: string
          enum: [DRAFT, REGISTERING, INSPECTION_REQUIRED, ACCEPTING, ACCEPTED, ESTIMATE_PENDING, ESTIMATE_REQUESTED, PREPARING, AWAITING_CONFIRMATION, CONFIRMING_PREPARATION, SHIPPED, CANCELLING, DEPARTING, IN_TRANSIT, ARRIVING, COMPLETED, CANCELLED, CONFLICT, RECONCILIATION_REQUIRED]
        warehouseId: { type: string, format: uuid }
        destinationWarehouseId: { type: [string, 'null'], format: uuid }
        partySnapshot: { type: [string, 'null'], maxLength: 512, description: Immutable, trimmed workflow snapshot; no directory identity. }
        driverSnapshot: { type: [string, 'null'], maxLength: 512, description: Immutable, trimmed workflow snapshot; no directory identity. }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/LogisticsLine' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LogisticsLine:
      type: object
      additionalProperties: false
      required: [id, version, lineNumber, assetId, assetVersion, state, tenantSnapshot]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        lineNumber: { type: integer, minimum: 1 }
        assetId: { type: string, format: uuid }
        assetVersion: { type: integer, minimum: 0 }
        state: { type: string, enum: [PENDING, DEPARTING, DEPARTED, ARRIVING, ARRIVED, CONFLICT, CANCELLED] }
        tenantSnapshot: { type: [string, 'null'], maxLength: 512 }
    EquipmentMovementLocationKind:
      type: string
      enum: [STOCK, CABIN_NON_RENTED, CABIN_RENTED]
    EquipmentMovementTaskState:
      type: string
      enum: [RESERVING, REGISTERING_TASK, AWAITING_WORKER, EXECUTING, CANCELLING, COMPLETED, CANCELLED, EXPIRED, CONFLICT, RECONCILIATION_REQUIRED]
    EquipmentMovementLineState:
      type: string
      enum: [PENDING_RESERVATION, RESERVED, EXECUTED, RELEASED]
    EquipmentMovementLineRequest:
      type: object
      additionalProperties: false
      required: [equipmentId, sourceRentalItemId, sourceLocationKind, expectedSourceBalanceVersion, targetRentalItemId, targetLocationKind, quantity]
      properties:
        equipmentId: { type: string, format: uuid }
        sourceRentalItemId: { type: [string, 'null'], format: uuid }
        sourceLocationKind: { $ref: '#/components/schemas/EquipmentMovementLocationKind' }
        expectedSourceBalanceVersion: { type: integer, format: int64, minimum: 0 }
        targetRentalItemId: { type: [string, 'null'], format: uuid }
        targetLocationKind: { $ref: '#/components/schemas/EquipmentMovementLocationKind' }
        quantity: { type: integer, format: int64, minimum: 1 }
    CreateEquipmentMovementTaskRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, unitNumber, plannedDurationMinutes, deadlineAt, lines]
      properties:
        warehouseId: { type: string, format: uuid }
        unitNumber: { type: [string, 'null'], maxLength: 64 }
        plannedDurationMinutes: { type: [integer, 'null'], minimum: 1 }
        deadlineAt: { type: string, format: date-time }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          description: >-
            At most ten worker operations are accepted. A cabin-to-cabin line produces
            two operations (take out and bring in); a stock/cabin line produces one.
          items: { $ref: '#/components/schemas/EquipmentMovementLineRequest' }
    CancelEquipmentMovementTaskRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    EquipmentMovementTaskLine:
      type: object
      additionalProperties: false
      required: [id, version, lineNumber, equipmentId, equipmentCode, equipmentName, sourceWarehouseId, sourceRentalItemId, sourceLocationKind, expectedSourceBalanceVersion, targetWarehouseId, targetRentalItemId, targetLocationKind, quantity, reservationId, reservationVersion, state, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        lineNumber: { type: integer, minimum: 1 }
        equipmentId: { type: string, format: uuid }
        equipmentCode: { type: [string, 'null'], maxLength: 128 }
        equipmentName: { type: [string, 'null'], maxLength: 512 }
        sourceWarehouseId: { type: string, format: uuid }
        sourceRentalItemId: { type: [string, 'null'], format: uuid }
        sourceLocationKind: { $ref: '#/components/schemas/EquipmentMovementLocationKind' }
        expectedSourceBalanceVersion: { type: integer, format: int64, minimum: 0 }
        targetWarehouseId: { type: string, format: uuid }
        targetRentalItemId: { type: [string, 'null'], format: uuid }
        targetLocationKind: { $ref: '#/components/schemas/EquipmentMovementLocationKind' }
        quantity: { type: integer, format: int64, minimum: 1 }
        reservationId: { type: [string, 'null'], format: uuid }
        reservationVersion: { type: [integer, 'null'], format: int64, minimum: 0 }
        state: { $ref: '#/components/schemas/EquipmentMovementLineState' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EquipmentMovementTask:
      type: object
      additionalProperties: false
      required: [id, version, warehouseId, externalTaskId, taskBoardTaskId, taskBoardTaskVersion, taskBoardDoneAt, unitNumber, plannedDurationMinutes, deadlineAt, state, terminalState, failureCode, lines, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        externalTaskId: { type: string, format: uuid }
        taskBoardTaskId: { type: [string, 'null'], format: uuid }
        taskBoardTaskVersion: { type: [integer, 'null'], format: int64, minimum: 0 }
        taskBoardDoneAt: { type: [string, 'null'], format: date-time }
        unitNumber: { type: [string, 'null'], maxLength: 64 }
        plannedDurationMinutes: { type: [integer, 'null'], minimum: 1 }
        deadlineAt: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/EquipmentMovementTaskState' }
        terminalState:
          oneOf:
            - { $ref: '#/components/schemas/EquipmentMovementTaskState' }
            - { type: 'null' }
        failureCode: { type: [string, 'null'], maxLength: 96 }
        lines:
          type: array
          items: { $ref: '#/components/schemas/EquipmentMovementTaskLine' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateReturnRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, lines]
      properties:
        warehouseId: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ReturnLineRequest' }
    ReturnLineRequest:
      type: object
      additionalProperties: false
      required: [assetId, assetVersion, tenantSnapshot]
      properties:
        assetId: { type: string, format: uuid }
        assetVersion: { type: integer, minimum: 0 }
        tenantSnapshot: { type: string, minLength: 1, maxLength: 512 }
    AcceptReturnRequest:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { $ref: '#/components/schemas/ReturnMediaLineRequest' }
    MediaReferenceInput:
      type: object
      additionalProperties: false
      required: [mediaId, generation]
      properties:
        mediaId: { type: string, format: uuid }
        generation: { type: integer, format: int64, minimum: 1 }
    ReturnMediaLineRequest:
      type: object
      additionalProperties: false
      required: [lineId, references]
      properties:
        lineId: { type: string, format: uuid }
        references:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/MediaReferenceInput' }
    EquipmentShortageRequest:
      type: object
      additionalProperties: false
      required: [equipmentId, missingQuantity]
      properties:
        equipmentId: { type: string, format: uuid }
        missingQuantity: { type: integer, format: int64, minimum: 1 }
    ReturnShortageLineRequest:
      type: object
      additionalProperties: false
      required: [lineId, shortages]
      properties:
        lineId: { type: string, format: uuid }
        shortages:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/EquipmentShortageRequest' }
    RequestReturnEstimateRequest:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ReturnShortageLineRequest' }
    CreateShipmentRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, partySnapshot, driverSnapshot, lines]
      properties:
        warehouseId: { type: string, format: uuid }
        partySnapshot: { type: string, minLength: 1, maxLength: 512 }
        driverSnapshot: { type: string, minLength: 1, maxLength: 512 }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ShipmentLineRequest' }
    ShipmentPlanRequest:
      type: object
      additionalProperties: false
      required: [partySnapshot, driverSnapshot, lines]
      properties:
        partySnapshot: { type: string, minLength: 1, maxLength: 512 }
        driverSnapshot: { type: string, minLength: 1, maxLength: 512 }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ShipmentLineRequest' }
    ShipmentLineRequest:
      type: object
      additionalProperties: false
      required: [assetId, assetVersion, allocations]
      properties:
        assetId: { type: string, format: uuid }
        assetVersion: { type: integer, minimum: 0 }
        allocations:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/EquipmentAllocationRequest' }
    EquipmentAllocationRequest:
      type: object
      additionalProperties: false
      required: [equipmentId, quantity, expectedStockVersion]
      properties:
        equipmentId: { type: string, format: uuid }
        quantity: { type: integer, format: int64, minimum: 1 }
        expectedStockVersion: { type: integer, format: int64, minimum: 0 }
    CreateTransferRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, destinationWarehouseId, lines]
      properties:
        warehouseId: { type: string, format: uuid }
        destinationWarehouseId: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/TransferLineRequest' }
    TransferLineRequest:
      type: object
      additionalProperties: false
      required: [assetId, assetVersion]
      properties:
        assetId: { type: string, format: uuid }
        assetVersion: { type: integer, minimum: 0 }
    ArriveTransferLineRequest:
      type: object
      additionalProperties: false
      required: [references]
      properties:
        references:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/MediaReferenceInput' }
    ReconcileRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    ClientType:
      type: string
      enum: [INDIVIDUAL, LEGAL_ENTITY]
    NewClientInput:
      type: object
      additionalProperties: false
      required: [clientType, displayName]
      properties:
        clientType: { $ref: '#/components/schemas/ClientType' }
        displayName: { type: string, minLength: 1, maxLength: 512 }
    CreateClientRequest:
      type: object
      additionalProperties: false
      required: [clientType, displayName]
      properties:
        clientType: { $ref: '#/components/schemas/ClientType' }
        displayName: { type: string, minLength: 1, maxLength: 512 }
    CreateOrderRequest:
      type: object
      additionalProperties: false
      properties:
        clientId: { type: string, format: uuid }
        newClient: { $ref: '#/components/schemas/NewClientInput' }
      oneOf:
        - required: [clientId]
          not: { required: [newClient] }
        - required: [newClient]
          not: { required: [clientId] }
    UpdateOrderRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, clientId]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        clientId: { type: string, format: uuid }
    SelectOrderWarehouseRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, warehouseId]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
    AddOrderUnitRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, unitId]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        unitId: { type: string, format: uuid }
    AdjustOrderEquipmentRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, expectedCurrentQuantity, requiredQuantity]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        expectedCurrentQuantity: { type: integer, format: int64, minimum: 0 }
        requiredQuantity: { type: integer, format: int64, minimum: 0 }
    OrderClient:
      type: object
      additionalProperties: false
      required: [id, version, type, displayName, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        type: { $ref: '#/components/schemas/ClientType' }
        displayName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ClientPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/OrderClient' }
        page: { type: integer, format: int64, minimum: 0 }
        size: { type: integer, format: int64, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int64, minimum: 0 }
    OrderSummary:
      type: object
      additionalProperties: false
      required: [id, version, number, status, client, managerId, managerDisplayName, createdBy, createdByDisplayName, warehouseId, unitCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        number: { type: string }
        status: { type: string, enum: [DRAFT, CANCELLED] }
        client: { $ref: '#/components/schemas/OrderClient' }
        managerId: { type: string, format: uuid }
        managerDisplayName: { type: string }
        createdBy: { type: string, format: uuid }
        createdByDisplayName: { type: string }
        warehouseId: { type: [string, 'null'], format: uuid }
        unitCount: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/OrderSummary' }
        page: { type: integer, format: int64, minimum: 0 }
        size: { type: integer, format: int64, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int64, minimum: 0 }
    OrderEquipmentContent:
      type: object
      additionalProperties: false
      required: [equipmentId, equipmentCode, equipmentName, quantity, locationKind]
      properties:
        equipmentId: { type: string, format: uuid }
        equipmentCode: { type: [string, 'null'] }
        equipmentName: { type: [string, 'null'] }
        quantity: { type: integer, format: int64, minimum: 0 }
        locationKind: { type: string }
    OrderRentalItem:
      type: object
      additionalProperties: false
      required: [id, version, warehouseId, number, status, rentalType, dimensions, finishing, category, characteristics, linoleum, tags, contents, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        number: { type: string }
        status: { type: string }
        rentalType: { type: [string, 'null'] }
        dimensions: { type: [string, 'null'] }
        finishing: { type: [string, 'null'] }
        category: { type: [string, 'null'] }
        characteristics: { type: [string, 'null'] }
        linoleum: { type: [boolean, 'null'] }
        tags: { type: array, items: { type: string } }
        contents:
          type: array
          items: { $ref: '#/components/schemas/OrderEquipmentContent' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderUnit:
      type: object
      additionalProperties: false
      required: [reservationId, added, unit]
      properties:
        reservationId: { type: [string, 'null'], format: uuid }
        added: { type: boolean }
        unit: { $ref: '#/components/schemas/OrderRentalItem' }
    OrderUnitPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/OrderUnit' } }
        page: { type: integer, format: int64, minimum: 0 }
        size: { type: integer, format: int64, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int64, minimum: 0 }
    OrderPermissions:
      type: object
      additionalProperties: false
      required: [canEdit, canViewOtherManagers]
      properties:
        canEdit: { type: boolean }
        canViewOtherManagers: { type: boolean }
    OrderDetail:
      type: object
      additionalProperties: false
      required: [id, version, number, status, client, managerId, managerDisplayName, createdBy, createdByDisplayName, warehouseId, unitCount, createdAt, updatedAt, units, permissions]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        number: { type: string }
        status: { type: string, enum: [DRAFT, CANCELLED] }
        client: { $ref: '#/components/schemas/OrderClient' }
        managerId: { type: string, format: uuid }
        managerDisplayName: { type: string }
        createdBy: { type: string, format: uuid }
        createdByDisplayName: { type: string }
        warehouseId: { type: [string, 'null'], format: uuid }
        unitCount: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        units: { type: array, items: { $ref: '#/components/schemas/OrderUnit' } }
        permissions: { $ref: '#/components/schemas/OrderPermissions' }
    OrderHistoryEvent:
      type: object
      additionalProperties: false
      required: [id, eventType, actorSubjectId, actorRole, orderId, subjectType, subjectId, previousValues, newValues, occurredAt]
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string }
        actorSubjectId: { type: string, format: uuid }
        actorRole: { type: string }
        orderId: { type: string, format: uuid }
        subjectType: { type: string }
        subjectId: { type: string }
        previousValues: { type: [object, 'null'], additionalProperties: true }
        newValues: { type: [object, 'null'], additionalProperties: true }
        occurredAt: { type: string, format: date-time }
    ApiProblem:
      type: object
      additionalProperties: true
      required: [status, code]
      properties:
        status: { type: integer }
        code: { type: string }
  responses:
    EquipmentMovementTask:
      description: Current source-reservation and worker-task state for one physical equipment movement.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: 'true' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EquipmentMovementTask' }
    Document:
      description: Current logistics document state.
      headers:
        ETag:
          required: true
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LogisticsDocument' }
    CreatedDocument:
      description: New DRAFT document, or the original successful create response.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: 'true' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LogisticsDocument' }
    DocumentList:
      description: Visible documents.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/LogisticsDocument' }
    OrderDetail:
      description: Current order state and authoritative active asset reservations.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: 'true' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrderDetail' }
    OrderClient:
      description: Explicitly created client, or the original idempotent result.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: 'true' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrderClient' }
    BadRequest:
      description: Invalid shape, missing idempotency key, or invalid expected version.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiProblem' } } }
    Unauthorized:
      description: Missing or invalid Bearer JWT.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiProblem' } } }
    Forbidden:
      description: Missing USER principal, scope, warehouse access, or required management level.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiProblem' } } }
    NotFound:
      description: Document is absent or outside the caller's warehouse scope.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiProblem' } } }
    Conflict:
      description: Stale version, changed idempotency replay, lease/hold/task conflict, or forbidden lifecycle transition.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiProblem' } } }
    Unprocessable:
      description: Semantic request error such as an impossible contents delta or unsupported correction capability.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiProblem' } } }
    DependencyUnavailable:
      description: An owning service required by the order operation is temporarily unavailable.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiProblem' } } }
