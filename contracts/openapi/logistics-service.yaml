          maxItems: 200
          items: { $ref: "#/components/schemas/PublicContractorCargoItem" }
        sourceMedia:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/PublicContractorSourceMedia" }
        route:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PublicContractorRouteEntry" }
    PublicContractorRouteShare:
      type: object
      additionalProperties: false
      required: [id, expiresAt, tasks]
      properties:
        id: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        tasks:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/PublicContractorRouteTask" }
    PublicContractorRouteTaskAction:
      type: object
      additionalProperties: false
      required: [currentVersion, task]
      properties:
        currentVersion: { type: integer, format: int64, minimum: 0 }
        task: { $ref: "#/components/schemas/PublicContractorRouteTask" }
    PublicContractorEvidenceUpload:
      type: object
      additionalProperties: false
      required:
        [evidenceId, version, state, mediaId, mediaGeneration, contentType, contentPath, thumbnailPath]
      properties:
        evidenceId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        state: { type: string, enum: [UPLOADING, READY] }
        mediaId: { type: string, format: uuid }
        mediaGeneration: { type: [integer, "null"], format: int64, minimum: 1 }
        contentType: { type: string, enum: [image/jpeg, image/webp] }
        contentPath:
          type: [string, "null"]
          maxLength: 4096
          pattern: ^/api/logistics/public/v1/contractor-route-shares/
        thumbnailPath:
          type: [string, "null"]
          maxLength: 4096
          pattern: ^/api/logistics/public/v1/contractor-route-shares/
    ClientPresentation:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          revision,
          inquiryId,
          warehouseId,
          state,
          expiresAt,
          viewUntil,
          canConfirm,
          publicPath,
          bookedOrderId,
          mode,
          replacementUnitIds,
          requiredSelectionCount,
          requiresDesiredDeliveryWindows,
          desiredDeliveryWindows,
          equipmentAvailability,
          groups,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        revision: { type: integer, format: int64, minimum: 1 }
        inquiryId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        state: { type: string, enum: [ACTIVE, BOOKING_PENDING, BOOKED, REVOKED] }
        expiresAt: { type: string, format: date-time }
        viewUntil: { type: string, format: date-time }
        canConfirm: { type: boolean }
        publicPath: { type: string }
        bookedOrderId: { type: [string, "null"], format: uuid }
        mode: { type: string, enum: [NORMAL, REPLACEMENT] }
        replacementUnitIds:
          type: array
          items: { type: string, format: uuid }
        requiredSelectionCount:
          type: [integer, "null"]
          minimum: 1
          description: Exact selection cardinality for REPLACEMENT; null for NORMAL.
        requiresDesiredDeliveryWindows:
          type: boolean
          description: True for NORMAL presentations, which collect one to four requestable client receiving dates before confirmation; false for REPLACEMENT.
        desiredDeliveryWindows:
          type: array
          description: Empty for NORMAL because the client supplies one to four requestable dates at confirmation; REPLACEMENT exposes existing date-only order preferences read-only.
          items: { $ref: "#/components/schemas/DesiredDeliveryWindow" }
        equipmentAvailability:
          type: array
          items: { $ref: "#/components/schemas/PresentationEquipmentAvailability" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/PresentationGroup" }
    RentalSettings:
      type: object
      additionalProperties: false
      required:
        [
          version,
          chatSelectionHoldMinutes,
          manualBookingHoldMinutes,
          presentationHoldMinutes,
          draftReservationHoldMinutes,
          lateChangeNoticeDays,
          lateChangeFeeMode,
          lateChangeFeeValue,
          rentalSupportPhone,
          updatedBy,
          updatedAt,
        ]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        chatSelectionHoldMinutes: { type: integer, minimum: 1, maximum: 1440 }
        manualBookingHoldMinutes: { type: integer, minimum: 5, maximum: 1440 }
        presentationHoldMinutes: { type: integer, minimum: 5, maximum: 1440 }
        draftReservationHoldMinutes: { type: integer, minimum: 1440, maximum: 14400 }
        lateChangeNoticeDays:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 2
          description: Advance notice in calendar days of the affected warehouse timezone, not rolling 24-hour periods.
        lateChangeFeeMode:
          type: [string, "null"]
          enum: [FIXED, PERCENT, null]
          description: Null together with lateChangeFeeValue means not configured, never an implicit zero fee.
        lateChangeFeeValue:
          type: [string, "null"]
          pattern: '^(0|[1-9][0-9]{0,18})(\.[0-9]{1,2})?$'
          description: Exact decimal string. FIXED is whole RUB from 0 through 9223372036854775807; PERCENT is 0 through 100 with at most two decimal places. Must be null exactly when mode is null. This setting alone neither assesses nor collects a fee.
        rentalSupportPhone:
          type: [string, "null"]
          pattern: '^\+[1-9][0-9]{7,14}$'
          description: Configured rental support dialer number in international format, not the customer's phone. Null means unavailable.
        updatedBy: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }
    RentalPricingSettings:
      type: object
      additionalProperties: false
      required: [version, types, updatedAt]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        types:
          type: array
          items: { $ref: "#/components/schemas/RentalPricingType" }
        updatedAt: { type: string, format: date-time }
    RentalPricingType:
      type: object
      additionalProperties: false
      required: [rentalTypeId, name, active, categories]
      properties:
        rentalTypeId: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        active: { type: boolean }
        categories:
          type: array
          items: { $ref: "#/components/schemas/RentalPricingCategory" }
    RentalPricingCategory:
      type: object
      additionalProperties: false
      required: [categoryId, name, active, monthlyPriceRubles]
      properties:
        categoryId: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        active: { type: boolean }
        monthlyPriceRubles: { $ref: "#/components/schemas/RentalMonthlyPriceRubles" }
    RentalMonthlyPriceRubles:
      type: string
      pattern: '^(0|[1-9][0-9]{0,18})$'
      description: Exact nonnegative whole RUB per month from 0 through 9223372036854775807. A string preserves monetary precision in JavaScript clients.
    UpdateRentalPriceRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, monthlyPriceRubles]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        monthlyPriceRubles: { $ref: "#/components/schemas/RentalMonthlyPriceRubles" }
    CabinRentalPrices:
      type: object
      additionalProperties: false
      required: [warehouseId, pricingVersion, cabins]
      properties:
        warehouseId: { type: string, format: uuid }
        pricingVersion: { type: integer, format: int64, minimum: 0 }
        cabins:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/CabinRentalPrice" }
    CabinRentalPrice:
      type: object
      additionalProperties: false
      required: [rentalItemId, rentalItemVersion, rentalTypeId, categoryId, monthlyPriceRubles]
      properties:
        rentalItemId: { type: string, format: uuid }
        rentalItemVersion: { type: integer, format: int64, minimum: 0 }
        rentalTypeId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        monthlyPriceRubles: { $ref: "#/components/schemas/RentalMonthlyPriceRubles" }
    ShipmentTaskSettings:
      type: object
      additionalProperties: false
      required: [warehouseId, version, maxCabinsPerShipmentTask, updatedBy, updatedAt]
      properties:
        warehouseId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        maxCabinsPerShipmentTask: { type: integer, minimum: 1, maximum: 100 }
        updatedBy: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }
    UpdateShipmentTaskSettingsRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, maxCabinsPerShipmentTask]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        maxCabinsPerShipmentTask: { type: integer, minimum: 1, maximum: 100 }
    UpdateRentalSettingsRequest:
      type: object
      additionalProperties: false
      required:
        [expectedVersion, chatSelectionHoldMinutes, manualBookingHoldMinutes, presentationHoldMinutes, draftReservationHoldMinutes, lateChangeNoticeDays, lateChangeFeeMode, lateChangeFeeValue, rentalSupportPhone]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        chatSelectionHoldMinutes: { type: integer, minimum: 1, maximum: 1440 }
        manualBookingHoldMinutes: { type: integer, minimum: 5, maximum: 1440 }
        presentationHoldMinutes: { type: integer, minimum: 5, maximum: 1440 }
        draftReservationHoldMinutes: { type: integer, minimum: 1440, maximum: 14400 }
        lateChangeNoticeDays:
          $ref: "#/components/schemas/RentalSettings/properties/lateChangeNoticeDays"
        lateChangeFeeMode:
          $ref: "#/components/schemas/RentalSettings/properties/lateChangeFeeMode"
        lateChangeFeeValue:
          $ref: "#/components/schemas/RentalSettings/properties/lateChangeFeeValue"
        rentalSupportPhone:
          $ref: "#/components/schemas/RentalSettings/properties/rentalSupportPhone"
    ManualBookingDraftHoldsRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, rentalItemIds]
      properties:
        warehouseId: { type: string, format: uuid }
        rentalItemIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    ManualBookingDraftHolds:
      type: object
      additionalProperties: false
      required: [draftId, warehouseId, expiresAt, rentalItemIds]
      properties:
        draftId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        expiresAt: { type: [string, "null"], format: date-time }
        rentalItemIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    ConfirmClientPresentationRequest:
      type: object
      additionalProperties: false
      required: [selections]
      properties:
        selections:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/PresentationCabinSelectionInput" }
        desiredDeliveryWindows:
          type: [array, "null"]
          description: Required only for NORMAL. It contains one to four distinct dates selected from requestableDeliveryDates; it must be absent for REPLACEMENT.
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: { $ref: "#/components/schemas/DesiredDeliveryWindowInput" }
        rentalMonths:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: Required only for NORMAL and applied to every cabin selected in this presentation; it must be absent for REPLACEMENT.
        deliveryAddress:
          type: [string, "null"]
          minLength: 1
          maxLength: 1000
          description: Required only for NORMAL and written to the target order after hold conversion; it must be absent for REPLACEMENT.
        latitude:
          type: [number, "null"]
          format: double
          minimum: -90
          maximum: 90
          description: Optional only with longitude for NORMAL; it must be absent for REPLACEMENT.
        longitude:
          type: [number, "null"]
          format: double
          minimum: -180
          maximum: 180
          description: Optional only with latitude for NORMAL; it must be absent for REPLACEMENT.
        additionalContacts:
          type: [array, "null"]
          description: Optional order-owned contacts for NORMAL, normalized to an empty list when absent; it must be absent for REPLACEMENT.
          items: { $ref: "#/components/schemas/AdditionalContactInput" }
      allOf:
        - if:
            required: [latitude]
          then:
            required: [longitude]
        - if:
            required: [longitude]
          then:
            required: [latitude]
    PresentationEquipmentSelectionInput:
      type: object
      additionalProperties: false
      required: [equipmentId, quantity]
      properties:
        equipmentId: { type: string, format: uuid }
        quantity: { type: integer, format: int64, minimum: 1 }
    PresentationCabinSelectionInput:
      type: object
      additionalProperties: false
      required: [rentalItemId, equipment]
      properties:
        rentalItemId: { type: string, format: uuid }
        equipment:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/PresentationEquipmentSelectionInput" }
    PublicClientPresentation:
      type: object
      additionalProperties: false
      required:
        [
          id,
          revision,
          state,
          expiresAt,
          viewUntil,
          viewOnly,
          mode,
          requiredSelectionCount,
          requiresDesiredDeliveryWindows,
          requestableDeliveryDates,
          desiredDeliveryWindows,
          equipmentAvailability,
          groups,
          bookedOrderId,
        ]
      properties:
        id: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
        state: { type: string, enum: [ACTIVE, BOOKING_PENDING, BOOKED, REVOKED] }
        expiresAt: { type: string, format: date-time }
        viewUntil: { type: string, format: date-time }
        viewOnly: { type: boolean }
        mode: { type: string, enum: [NORMAL, REPLACEMENT] }
        requiredSelectionCount:
          type: [integer, "null"]
          minimum: 1
        requiresDesiredDeliveryWindows:
          type: boolean
          description: True for NORMAL presentations, which collect one to four requestable client receiving dates; false for REPLACEMENT.
        requestableDeliveryDates:
          type: array
          maxItems: 4
          uniqueItems: true
          description: For NORMAL, up to four earliest warehouse-local dates with provisional one-cabin capacity derived from simulator shifts, current workload and representative support calendars; empty for REPLACEMENT. These dates are requestable preferences, not an address-based route promise or capacity reservation.
          items: { type: string, format: date }
        desiredDeliveryWindows:
          type: array
          description: Empty for NORMAL; existing date-only order preferences are read-only for REPLACEMENT.
          items: { $ref: "#/components/schemas/DesiredDeliveryWindow" }
        equipmentAvailability:
          type: array
          items: { $ref: "#/components/schemas/PresentationEquipmentAvailability" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/PresentationGroup" }
        bookedOrderId: { type: [string, "null"], format: uuid }
    PresentationBooking:
      type: object
      additionalProperties: false
      required: [bookingId, state, orderId, statusPath, errorCode]
      properties:
        bookingId: { type: string, format: uuid }
        state: { type: string, enum: [PENDING, COMPLETED, REJECTED] }
        orderId: { type: [string, "null"], format: uuid }
        statusPath: { type: string }
        errorCode: { type: [string, "null"] }
    RentalBookingAlert:
      type: object
      additionalProperties: false
      required: [bookingId, version, inquiryId, orderId, client, confirmedAt, cabins]
      properties:
        bookingId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        inquiryId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        client: { $ref: "#/components/schemas/OrderClient" }
        confirmedAt: { type: string, format: date-time }
        cabins:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/RentalBookingAlertCabin" }
    RentalBookingAlertCabin:
      type: object
      additionalProperties: false
      required: [id, number, rentalType, dimensions, finishing, category]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        rentalType: { type: [string, "null"] }
        dimensions: { type: [string, "null"] }
        finishing: { type: [string, "null"] }
        category: { type: [string, "null"] }
    RentalBookingAlertAction:
      type: string
      enum: [CONTINUE, KEEP_DRAFT]
    RentalBookingAlertActionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, action]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        action: { $ref: "#/components/schemas/RentalBookingAlertAction" }
    WarehouseOperationMarkRecoveryRequest:
      type: object
      additionalProperties: false
      required: [expectedRecoveryVersion, reason]
      properties:
        expectedRecoveryVersion: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    WarehouseOperationMarkRecoveryResponse:
      type: object
      additionalProperties: false
      required:
        - warehouseId
        - operationId
        - state
        - attemptCount
        - recoveryVersion
        - lastErrorCode
        - recoveredBySubjectId
        - recoveryReason
        - recoveredAt
      properties:
        warehouseId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        state: { type: string, enum: [PENDING, IN_FLIGHT, RETRY_PENDING, CONFIRMED, QUARANTINED] }
        attemptCount: { type: integer, minimum: 0 }
        recoveryVersion: { type: integer, format: int64, minimum: 1 }
        lastErrorCode:
          oneOf: [ { type: string, minLength: 1, maxLength: 96 }, { type: 'null' } ]
        recoveredBySubjectId: { type: string, format: uuid }
        recoveryReason: { type: string, minLength: 1, maxLength: 2000 }
        recoveredAt: { type: string, format: date-time }
    ApiProblem:
      type: object
      additionalProperties: true
      required: [status, code]
      properties:
        status: { type: integer }
        code: { type: string }
  responses:
    DriverBoardCard:
      description: Current task-board placement for one driver movement.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: "true" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DriverBoardCard" }
    DriverTask:
      description: Current logistics-owned driver task intent and effect checkpoints.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: "true" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DriverTask" }
    EquipmentMovementTask:
      description: Current source-reservation and worker-task state for one physical equipment movement.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: "true" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/EquipmentMovementTask" }
    Document:
      description: Current logistics document state.
      headers:
        ETag:
          required: true
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LogisticsDocument" }
    CreatedDocument:
      description: New document, or the original successful create response. A historical rental import may already be advancing its durable effects.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: "true" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LogisticsDocument" }
    DocumentList:
      description: One bounded page of visible documents; the JSON body remains an array.
      headers:
        X-RWMS-Page:
          required: true
          schema: { type: integer, minimum: 0 }
        X-RWMS-Page-Size:
          required: true
          schema: { type: integer, minimum: 1, maximum: 100 }
        X-RWMS-Total-Elements:
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
        X-RWMS-Total-Pages:
          required: true
          schema: { type: integer, minimum: 0 }
        X-RWMS-Has-Next:
          required: true
          schema: { type: boolean }
      content:
        application/json:
          schema:
            type: array
            items: { $ref: "#/components/schemas/LogisticsDocument" }
    OrderDetail:
      description: Current order state and authoritative active asset reservations.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: "true" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OrderDetail" }
    OrderClient:
      description: Current client detail, explicit create result, or its idempotent replay.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Idempotency-Replayed:
          required: false
          schema: { type: string, const: "true" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OrderClient" }
    BadRequest:
      description: Invalid shape, missing idempotency key, or invalid expected version.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    Unauthorized:
      description: Missing or invalid Bearer JWT.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    Forbidden:
      description: Missing USER principal, scope, warehouse access, or required management level.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    NotFound:
      description: Document is absent or outside the caller's warehouse scope.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    Conflict:
      description: Stale version, changed idempotency replay, lease/hold/task conflict, or forbidden lifecycle transition.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    Unprocessable:
      description: Semantic request error such as an impossible contents delta or unsupported correction capability.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    LengthRequired:
      description: Contractor evidence must declare one nonnegative Content-Length and cannot use chunked transfer encoding.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    PayloadTooLarge:
      description: Contractor evidence exceeds the byte limit of its declared JPEG or WebP representation.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    UnsupportedMedia:
      description: Contractor evidence content type is not JPEG or WebP.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    DependencyUnavailable:
      description: An owning service required by the order operation is temporarily unavailable.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
