        id: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
        state: { type: string, enum: [ACTIVE, BOOKING_PENDING, BOOKED, REVOKED] }
        expiresAt: { type: string, format: date-time }
        viewUntil: { type: string, format: date-time }
        viewOnly: { type: boolean }
        groups:
          type: array
          items: { $ref: "#/components/schemas/PresentationGroup" }
