openapi: 3.1.0
info:
  title: RWMS Logistics Service API
  version: 1.0.0
  description: >-
    Canonical API for rental orders, return, shipment, transfer, driver-task,
    and private route-planning integration flows.
    Public operations require a locally validated USER Bearer JWT, the
    matching rwms scope, and warehouse access. Every retriable mutation uses
    a subject-bound Idempotency-Key; mutable transitions also require the
    current document version.
servers:
  - url: /
security:
  - bearerJwt: []
paths:
  /api/logistics/v1/returns:
    get:
      operationId: listReturns
      description: Lists visible return documents. Requires rwms.read and VIEW at the document warehouse.
      parameters:
        - $ref: "#/components/parameters/WarehouseIdQuery"
      responses:
        "200": { $ref: "#/components/responses/DocumentList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createReturn
      description: Creates a DRAFT return. No canonical asset effect occurs during creation.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReturnRequest" }
      responses:
        "201": { $ref: "#/components/responses/CreatedDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/logistics/v1/returns/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getReturn
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/returns/{documentId}/register:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: registerReturn
      description: Assigns the pickup driver/date and starts the fenced return-intake saga from a DRAFT return.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReturnPickupRequest" }
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/returns/{documentId}/accept-undamaged:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: acceptUndamagedReturn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptReturnRequest" }
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/logistics/v1/returns/{documentId}/start-estimates:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: startReturnEstimates
      description: >-
        Starts one maintenance-owned DRAFT estimate for every submitted return line.
        Return inspection photographs are immutable evidence; equipment losses are selected
        later inside each individual estimate and never in the return command.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/StartReturnEstimatesRequest" }
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/historical-rental-movements:
    post:
      operationId: createHistoricalRentalMovement
      description: >-
        Creates one real past rental shipment or return from a warehouse cabin card. The command
        requires an existing visible rental client, a non-future warehouse-local date and the
        current cabin version; it never accepts a driver. An imported shipment first closes or
        cancels eligible maintenance work through a durable server-side saga. If the repair-free
        cabin is already RENTED, the saga records the missing provenance as SHIPPED without
        repeating lease, hold or asset effects. An imported return enters the ordinary fenced
        return-intake and estimate flow.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateHistoricalRentalMovementRequest" }
      responses:
        "200": { $ref: "#/components/responses/CreatedDocument" }
        "201": { $ref: "#/components/responses/CreatedDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/historical-rental-movements/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    put:
      operationId: updateHistoricalRentalShipment
      description: >-
        Corrects the client and past physical date of one existing user-entered historical
        shipment. The document version and cabin identity are fenced; no driver, lease, stock
        reservation or asset status transition is repeated.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateHistoricalRentalShipmentRequest" }
      responses:
        "200": { $ref: "#/components/responses/CreatedDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/shipments:
    get:
      operationId: listShipments
      parameters:
        - $ref: "#/components/parameters/WarehouseIdQuery"
      responses:
        "200": { $ref: "#/components/responses/DocumentList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createShipment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateShipmentRequest" }
      responses:
        "201": { $ref: "#/components/responses/CreatedDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/logistics/v1/shipments/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getShipment
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/shipments/{documentId}/plan:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    put:
      operationId: replaceShipmentPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShipmentPlanRequest" }
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/logistics/v1/shipments/{documentId}/furniture-readiness:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getShipmentFurnitureReadiness
      description: >-
        Reports whether an order shipment can start or finish departure. Readiness is based on the
        current asset-side furniture delta and the durable worker task state.
      responses:
        "200":
          description: Current furniture readiness for the shipment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipmentFurnitureReadiness" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/shipments/{documentId}/furniture-tasks:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: createShipmentFurnitureTasks
      description: >-
        For a saved order shipment, compares each order cabin's desired catalogue furniture with
        its current asset contents and creates worker tasks only for the difference. No browser
        movement orchestration or user-entered reservation deadline is involved.
      responses:
        "202":
          description: Furniture movement tasks created or existing idempotent task links returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipmentFurnitureTaskResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/shipments/{documentId}/confirm-preparation:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
      - name: keepScheduledDate
        in: query
        required: false
        description: Explicitly keep a planned calendar date when the physical departure is recorded today.
        schema: { type: boolean, default: false }
    post:
      operationId: confirmShipmentPreparation
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/shipments/{documentId}/cancel:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: cancelShipment
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/transfers:
    get:
      operationId: listTransfers
      parameters:
        - $ref: "#/components/parameters/WarehouseIdQuery"
      responses:
        "200": { $ref: "#/components/responses/DocumentList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createTransfer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTransferRequest" }
      responses:
        "201": { $ref: "#/components/responses/CreatedDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/logistics/v1/rental-items/{rentalItemId}/furniture-tasks:
    parameters:
      - { name: rentalItemId, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: createCabinFurnitureTask
      description: >-
        Replaces the selected cabin's complete furniture composition with the requested total.
        Logistics derives source balances from the asset-owned additional-equipment ledger and
        creates a worker task only for the physical difference.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCabinFurnitureTaskRequest" }
      responses:
        "200":
          description: The cabin already matches the requested composition; no task was necessary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinFurnitureTaskResult" }
        "202":
          description: A server-side furniture movement task was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinFurnitureTaskResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/transfers/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getTransfer
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/transfers/{documentId}/furniture-readiness:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getTransferFurnitureReadiness
      description: >-
        Reports the durable worker-task readiness for furniture changes selected for a transfer.
        Requires rwms.read and VIEW access to both the origin and destination warehouses.
      responses:
        "200":
          description: Current furniture readiness for the transfer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferFurnitureReadiness" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/transfers/{documentId}/lines/{lineId}/depart:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/LineId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/ExpectedLineVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: departTransferLine
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/transfers/{documentId}/lines/{lineId}/arrive:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/LineId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/ExpectedLineVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: arriveTransferLine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArriveTransferLineRequest" }
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/transfers/{documentId}/lines/{lineId}/arrival-preflight:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/LineId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/ExpectedLineVersion"
    get:
      operationId: getTransferArrivalPreflight
      description: >-
        Resolves the active repair that departed with this cabin and checks the
        destination warehouse queue bindings before any arrival mutation.
        Requires MANAGE access to both warehouses.
      responses:
        "200":
          description: Canonical repair-continuation requirements for this line.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferArrivalPreflight" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/transfers/{documentId}/cancel:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: cancelTransfer
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/equipment-movement-tasks:
    post:
      operationId: createEquipmentMovementTask
      description: >-
        Reserves every source balance until deadlineAt and creates one typed worker task.
        It never changes physical equipment balances itself: asset-service executes the
        reserved batch only after task-board reports DONE before the deadline.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "#/components/schemas/CreateEquipmentMovementTaskRequest",
              }
      responses:
        "200": { $ref: "#/components/responses/EquipmentMovementTask" }
        "201": { $ref: "#/components/responses/EquipmentMovementTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/equipment-movement-tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/EquipmentMovementTaskId"
    get:
      operationId: getEquipmentMovementTask
      responses:
        "200": { $ref: "#/components/responses/EquipmentMovementTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/equipment-movement-tasks/{taskId}/cancel:
    parameters:
      - $ref: "#/components/parameters/EquipmentMovementTaskId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: cancelEquipmentMovementTask
      description: >-
        Cancels an unfinished task and releases its source reservations. A task that
        has reached physical execution cannot be cancelled by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "#/components/schemas/CancelEquipmentMovementTaskRequest",
              }
      responses:
        "202": { $ref: "#/components/responses/EquipmentMovementTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/driver-tasks:
    get:
      operationId: listDriverTasks
      description: Lists logistics-owned task intents for the selected warehouse.
      parameters:
        - $ref: "#/components/parameters/WarehouseIdQuery"
      responses:
        "200":
          description: Driver task intents. Ordering and execution remain authoritative in task-board.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DriverTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createDriverTask
      description: >-
        Creates one cabin-movement intent and registers it in the warehouse's
        single queue with purpose LOGISTICS_DRIVER. AUTO resolves the current
        warehouse date; FIXED_DATE uses the supplied date. No queue-name lookup
        or fallback is allowed.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDriverTaskRequest" }
      responses:
        "200": { $ref: "#/components/responses/DriverTask" }
        "201": { $ref: "#/components/responses/DriverTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/admin/warehouse-operation-marks/{operationId}/recovery:
    post:
      operationId: recoverLogisticsWarehouseOperationMark
      description: >-
        Global-administrator-only, reviewed retry of one quarantined warehouse operation mark.
        The expected recovery version fences concurrent reviews; every accepted review is appended
        to an immutable audit table. Requires a USER token with rwms.write and SYSTEM_ADMIN or
        WMS_ADMIN global role.
      parameters:
        - name: operationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: warehouseId
          in: query
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WarehouseOperationMarkRecoveryRequest" }
      responses:
        "200":
          description: Requeued mark or the exact replay of an already accepted review.
          headers:
            Idempotency-Replayed:
              required: false
              schema: { type: string, const: "true" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WarehouseOperationMarkRecoveryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/internal/logistics/v1/planning/requests:
    get:
      operationId: getRoutePlanningRequests
      description: >-
        Exports the still-unplanned cabin remainder of SAVED rental orders for one warehouse and
        bounded inclusive date range. Requires the exact SERVICE identity logistics-planner,
        audience rwms-services, and sole scope logistics.planning. Coordinates, when present, are
        authoritative over the address. The response omits phone numbers, furniture, prices, and
        all unrelated client facts.
      parameters:
        - $ref: "#/components/parameters/WarehouseIdQuery"
        - name: dateFrom
          in: query
          required: true
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Warehouse-local route-planning demand snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanningRequestFeed" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/internal/logistics/v1/planning/assignments:
    get:
      operationId: getRoutePlanningAssignmentStatuses
      description: >-
        Returns current logistics-owned driver audience and task state for planner-created
        shipment parts on one warehouse-local date. The read excludes every manually created
        document and exposes no customer contact data. A shared part changes to ASSIGNED_DRIVER
        after a qualified DriverApp worker claims it, allowing the standalone planner to show the
        authoritative assignee without reading task-board or an RWMS database.
      parameters:
        - $ref: "#/components/parameters/WarehouseIdQuery"
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Current status of every planner-created assignment for the requested date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanningAssignmentStatusResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    post:
      operationId: applyRoutePlanningAssignments
      description: >-
        Applies a planner result as existing logistics-owned rental shipments for exact cabins,
        dates, and DriverApp worker identities. Requires the same exact logistics-planner token.
        The batch may contain several non-overlapping cabin parts of one order; every part has a
        stable idempotent shipment command. Automatic application rejects today and tomorrow,
        dates not approved by the client, stale order versions, and cabins already planned.
        Valid parts are retained even when another part is rejected, and every rejection is
        returned with a stable code.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplyPlanningAssignmentsRequest" }
      responses:
        "200":
          description: Complete applied/rejected result for the batch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplyPlanningAssignmentsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/internal/logistics/v1/planning/capacity-snapshots/{scenarioId}:
    put:
      operationId: replaceRoutePlanningCapacitySnapshot
      description: >-
        Atomically replaces one warehouse's active anonymous simulator-capacity projection.
        The payload contains only generated delivery coordinates, local windows, service duration,
        and cabin count; it never creates or changes an RWMS order, shipment, cabin, client, or
        driver. The latest explicitly published scenario revision constrains CustomerApp slot
        searches alongside real confirmed workload. Requires the exact SERVICE identity
        logistics-planner, audience rwms-services, and sole scope logistics.planning.
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplacePlanningCapacitySnapshotRequest" }
      responses:
        "200":
          description: Applied active projection or an exact idempotent replay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanningCapacitySnapshotResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/internal/logistics/v1/maintenance/return-arrivals/{rentalItemId}:
    parameters:
      - name: rentalItemId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/WarehouseIdQuery"
    get:
      operationId: getMaintenanceReturnArrival
      description: >-
        Returns the latest immutable physical-intake arrival for the exact rental item and
        warehouse. Normal returns freeze this owner field when intake reaches inspection-required;
        inventory-created historical returns bypass intake and are excluded. Requires a SERVICE token with
        sub=client_id=maintenance-service, audience rwms-services, and exactly the
        logistics.maintenance scope. The response deliberately contains no party data.
      responses:
        "200":
          description: Latest logistics-owned physical return arrival.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceReturnArrival" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/internal/logistics/v1/maintenance/driver-tasks:
    post:
      operationId: createMaintenanceDriverTask
      description: >-
        Exact maintenance-service boundary used by estimate, repair, and
        inventory-repair orchestration. Requires a SERVICE token with
        sub=client_id=maintenance-service, audience rwms-services, and exactly
        the logistics.maintenance scope. It creates the same logistics-owned
        driver task as the public board: DELIVER_TO_REPAIR for ordinary work or
        CAPITAL_TO_PRODUCTION for an external-capital repair. It never bypasses
        repair-place capacity or the ordered CURRENT queue. For FIXED_DATE the
        request date remains immutable idempotency input; when that date is
        overdue, the returned DriverTask.scheduledDate is the logistics-owned
        effective warehouse-local date and may be later than the request.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDriverTaskRequest" }
      responses:
        "200": { $ref: "#/components/responses/DriverTask" }
        "201": { $ref: "#/components/responses/DriverTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/internal/logistics/v1/maintenance/equipment-movement-tasks:
    post:
      operationId: createMaintenanceEquipmentMovementTask
      description: >-
        Exact maintenance-service boundary requiring the same SERVICE identity and exactly
        logistics.maintenance. Creates the logistics-owned, worker-confirmed movement that removes
        the administrator-selected furniture quantities from a cabin and returns them to STOCK in
        the same warehouse. Source reservations are acquired before board registration; asset
        balances change only after task-board confirms DONE. decisionId is a permanent owner key.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMaintenanceEquipmentMovementTaskRequest" }
      responses:
        "200": { $ref: "#/components/responses/EquipmentMovementTask" }
        "201": { $ref: "#/components/responses/EquipmentMovementTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/internal/logistics/v1/maintenance/equipment-movement-tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/EquipmentMovementTaskId"
    get:
      operationId: getMaintenanceEquipmentMovementTask
      description: Exact maintenance-service read of current movement/effect truth.
      responses:
        "200": { $ref: "#/components/responses/EquipmentMovementTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/internal/logistics/v1/inventory/outcomes/{inventoryId}:
    parameters:
      - name: inventoryId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/IdempotencyKey"
    put:
      operationId: applyAuthoritativeCompletedInventoryOutcome
      description: >-
        Private owner command available only to a SERVICE token whose subject and client_id are
        exactly inventory-service, whose audience is exactly rwms-services and whose sole scope is
        logistics.inventory. The latest completed inventory is authoritative by canonical assetId:
        selected active document lines and rental terms are retained but superseded, complete
        selected nonterminal documents and orders become terminal, and every selected unfinished
        logistics-owned task receives a durable cancellation checkpoint. LOCAL former-rental data
        creates a terminal RETURN fact without acceptance or estimate workflows; SHIPMENT creates a
        terminal shipment and line without driver, hold or stock-allocation workflows; WRITE_OFF
        retains only a logistics marker for the downstream disposition owner. It creates no
        shipment, publishes no FREE/terminal asset status and does not change the asset version;
        terminalization remains maintenance-owned after the logistics lease is released. A
        document containing an unrelated active line rejects the complete batch before any local or
        remote effect. Remote
        task-board cancellation is never executed inside a database transaction; a lost response is
        reconciled by task read on retry. An exact logistics asset lease is released through a
        durable typed-owner checkpoint outside the transaction; RELEASED/EXPIRED is terminal and
        an owner or fence mismatch fails closed. This command does not create repair/capital work,
        and a same-source reassertion does not cancel the INVENTORY movement sourced by one of its
        own findingId values. Same key and request returns the frozen response, changed input for
        the key, stale completedAt, or equal completedAt from another immutable source returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplyInventoryOutcomeRequest" }
      responses:
        "200":
          description: Frozen successful logistics supersession result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplyInventoryOutcomeResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/internal/logistics/v1/maintenance/driver-tasks/repairs/{repairId}:
    parameters:
      - name: repairId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: kind
        in: query
        required: true
        schema:
          type: string
          enum: [DELIVER_TO_REPAIR, CAPITAL_TO_PRODUCTION]
    get:
      operationId: getMaintenanceDriverTaskCompensation
      description: >-
        Reads the newest logistics-owned repair movement for maintenance
        replacement/merge compensation. This private endpoint is inaccessible
        to browsers and requires the exact maintenance-service token used by
        the maintenance driver-task intake.
      responses:
        "200":
          description: Strict current compensation snapshot; ABSENT is a successful empty lookup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceDriverTaskCompensation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/internal/logistics/v1/maintenance/driver-tasks/repairs/{repairId}/cancel:
    parameters:
      - name: repairId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: kind
        in: query
        required: true
        schema:
          type: string
          enum: [DELIVER_TO_REPAIR, CAPITAL_TO_PRODUCTION]
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: cancelMaintenanceDriverTaskCompensation
      description: >-
        Cancels an unregistered local intent, or returns a strict outcome for
        registered work. A registered task is never sent to the legacy broad
        task-board cancel command: logistics uses task-board's atomic
        expected-task-version, WAITING-only pre-start cancellation guard.
        For DELIVER_TO_REPAIR, CANCELLED or ALREADY_CANCELLED first releases
        only the same still-RESERVED repair-place allocation with a stable
        task-owned idempotency key, then records the local terminal
        cancellation. CAPITAL_TO_PRODUCTION preserves its repair-place
        allocation for maintenance reassignment/continued work. A lost
        response, non-RESERVED allocation, release failure, or a second
        version conflict remains RECONCILIATION_REQUIRED; retry with the same
        Idempotency-Key. STARTED and COMPLETED are preserved, never cancelled.
      responses:
        "200":
          description: Effective compensation truth; STARTED and COMPLETED are preserved, never cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceDriverTaskCompensation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/logistics/v1/driver-tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/DriverTaskId"
    get:
      operationId: getDriverTask
      description: >-
        Returns the logistics-owned task to a warehouse-authorized manager, or to the exact
        assigned DriverApp WORKER for an ASSIGNED_DRIVER task when the token has driver.tasks and
        its worker_id equals plannedDriverWorkerId. A DriverApp worker in the exact warehouse may
        also preview a WAREHOUSE_DRIVERS task only when its scheduled date is later than the
        warehouse-local current date, so the driver can inspect the route before claiming it. The
        session sub is not a worker identity; worker.tasks never authorizes this rich detail, and
        UNASSIGNED tasks remain hidden from DriverApp workers.
      responses:
        "200": { $ref: "#/components/responses/DriverTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/driver-tasks/{taskId}/claim:
    parameters:
      - $ref: "#/components/parameters/DriverTaskId"
    post:
      operationId: claimFutureDriverTask
      description: >-
        Assigns one shared WAREHOUSE_DRIVERS task scheduled after the warehouse-local current date
        to the authenticated DriverApp worker without starting execution. Task-board validates the
        worker's active driver qualification and fences concurrent claims with current task and
        entry versions. Repeating a claim by the same worker succeeds; a different worker receives
        409. Today is never claimable through this operation.
      responses:
        "200": { $ref: "#/components/responses/DriverTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/driver-tasks/{taskId}/promote:
    parameters:
      - $ref: "#/components/parameters/DriverTaskId"
    post:
      operationId: promoteDriverTask
      description: >-
        Manually moves this exact scheduled task into the ordered CURRENT
        lane, regardless of its planned calendar date. Repair delivery first
        reserves a free repair place or pairs with an earlier ready-to-release
        removal in the same ordered lane; missing capacity fails without a
        queue fallback.
      responses:
        "202": { $ref: "#/components/responses/DriverTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/driver-board:
    get:
      operationId: getDriverBoard
      description: >-
        Returns the warehouse's dedicated driver queue with the warehouse-local
        current date, an ordered CURRENT lane, finite ordered non-empty date
        columns, factual repair-place capacity and active capital repairs not
        yet moved to production. Every returned date column is current or
        future relative to currentDate; overdue active cards are folded into
        the current-date column while durable task-board recovery converges.
      parameters:
        - $ref: "#/components/parameters/WarehouseIdQuery"
      responses:
        "200":
          description: Authoritative logistics board projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverBoard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/driver-board/tasks/{externalTaskId}/move:
    parameters:
      - name: externalTaskId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: moveDriverBoardTask
      description: >-
        Reorders a driver task inside a date, moves a CURRENT task back to a
        calendar date, or manually adds a scheduled capital-to-production
        movement to CURRENT. Ordinary logistics movements enter CURRENT only
        through the capacity-aware scheduler. The task-board versions are
        mandatory; already-running tasks are rejected. targetDate cannot
        precede the warehouse-local currentDate.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveDriverBoardTaskRequest" }
      responses:
        "200":
          description: Moved driver card.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverBoardCard" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/driver-board/tasks/{externalTaskId}/return-to-capital-repairs:
    parameters:
      - name: externalTaskId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: returnDriverTaskToCapitalRepairs
      description: >-
        Cancels an unfinished capital-to-production movement while preserving
        its task history. The active repair becomes available in the dedicated
        capital-repair column again; ordinary movements are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReturnCapitalRepairRequest" }
      responses:
        "204": { description: Capital repair returned to its dedicated column. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/driver-board/capital-repairs/{repairId}/promote:
    parameters:
      - name: repairId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: promoteCapitalRepairToDriverCurrent
      description: >-
        Creates or replays the single capital-to-production movement and moves
        it into CURRENT. It never creates an ordinary repair-board task.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromoteCapitalRepairRequest" }
      responses:
        "200": { $ref: "#/components/responses/DriverTask" }
        "201": { $ref: "#/components/responses/DriverTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/driver-board/capital-repairs/{repairId}/schedule:
    parameters:
      - name: repairId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: scheduleCapitalRepairOnDriverBoard
      description: >-
        Creates or replays the single capital-to-production movement directly
        in a selected calendar date and queue position. The logistics service
        owns registration and insertion; the browser never promotes and moves
        the repair as two commands. The selected date cannot precede the
        warehouse-local current date.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleCapitalRepairRequest" }
      responses:
        "200": { $ref: "#/components/responses/DriverBoardCard" }
        "201": { $ref: "#/components/responses/DriverBoardCard" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/orders:
    get:
      operationId: listOrders
      description: >-
        Server-paginated order search. Managers receive only managerId == JWT sub;
        warehouse managers receive granted-warehouse orders plus their own unassigned drafts;
        system administrators receive the global view.
      parameters:
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
        - {
            name: size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
        - { name: search, in: query, schema: { type: string, default: "" } }
        - {
            name: sort,
            in: query,
            schema:
              {
                type: string,
                enum:
                  [
                    number,
                    client,
                    manager,
                    warehouse,
                    status,
                    createdAt,
                    updatedAt,
                  ],
                default: updatedAt,
              },
          }
        - {
            name: direction,
            in: query,
            schema: { type: string, enum: [ASC, DESC], default: DESC },
          }
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              {
                type: string,
                enum: [DRAFT, SAVED, FULFILLED, CLOSED, CANCELLED],
              }
        - name: clientType
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/ClientType" }
        - name: warehouseId
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, format: uuid }
        - {
            name: createdFrom,
            in: query,
            schema: { type: string, format: date-time },
          }
        - {
            name: createdTo,
            in: query,
            schema: { type: string, format: date-time },
          }
      responses:
        "200":
          description: Visible orders only.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/OrderPage" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createOrder
      description: >-
        Creates a DRAFT order owned by the JWT subject. Exactly one existing
        clientId or explicitly confirmed newClient is required.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "201": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/orders/{orderId}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      operationId: getOrder
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateOrder
      description: >-
        Replaces the selected client and manager-entered primary contact/comment under expectedVersion.
        Client-confirmed address, optional coordinates, additional contacts and desired date are
        supplied only by a NORMAL public presentation confirmation.
        A SAVED order is editable only while its linked shipment remains an untouched draft.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrderRequest" }
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: cancelOrder
      description: Logically cancels an editable draft and atomically requests release of every active unit reservation.
      parameters:
        - $ref: "#/components/parameters/ExpectedVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/orders/{orderId}/save:
    parameters:
      - $ref: "#/components/parameters/OrderId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: saveOrder
      description: >-
        Locks a non-empty DRAFT order whose complete rental-duration vector, client-confirmed
        delivery address, contact phone and non-empty date-only desired delivery window list are
        configured. Coordinates remain optional as one pair.
        Saving does not implicitly choose a shipment batch; create one explicitly with selected
        unitIds.
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/orders/{orderId}/rental-terms/extend:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      operationId: extendOrderRentalTerms
      description: >-
        Extends only the selected cabins whose shipment is SHIPPED. Each selected cabin keeps its
        original shipmentDate and its returnDate moves forward by additionalMonths.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtendOrderRentalTermsRequest" }
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/orders/{orderId}/shipments:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      operationId: createOrderRentalShipment
      description: >-
        Creates one DRAFT shipment for exactly the selected unitIds. The actual driver and calendar
        date are saved immediately. Client desired delivery
        windows remain advisory and never block another actual date. Preparation starts only when the shipment plan command is called.
        A cabin cannot be selected by another non-cancelled shipment. When this shipment reaches
        SHIPPED, logistics creates one cabin-level return document per shipped line, each linked by
        rentalShipmentId, so return dates and drivers can be changed independently.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRentalShipmentRequest" }
      responses:
        "201": { $ref: "#/components/responses/CreatedDocument" }
        "200": { $ref: "#/components/responses/CreatedDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/clients:
    get:
      operationId: searchOrderClients
      description: >-
        Searches counterparties by normalized name. With an empty search query,
        returns the most recently created counterparties first.
      parameters:
        - {
            name: type,
            in: query,
            schema: { $ref: "#/components/schemas/ClientType" },
          }
        - { name: search, in: query, schema: { type: string, default: "" } }
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
        - {
            name: size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
      responses:
        "200":
          description: Matching normalized clients.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ClientPage" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createOrderClient
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateClientRequest" }
      responses:
        "200": { $ref: "#/components/responses/OrderClient" }
        "201": { $ref: "#/components/responses/OrderClient" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/clients/{clientId}:
    parameters:
      - name: clientId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getOrderClient
      description: >-
        Returns a client only when the caller can see at least one of the
        client's orders, owns the client as its responsible manager, or has a
        global logistics view. An inaccessible client is not disclosed.
      responses:
        "200": { $ref: "#/components/responses/OrderClient" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/clients/{clientId}/orders:
    parameters:
      - name: clientId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listOrderClientOrders
      description: >-
        Returns the server-paginated subset of this client's orders visible to
        the authenticated caller. The client itself is not disclosed when no
        visibility rule applies.
      parameters:
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
        - {
            name: size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
        - {
            name: sort,
            in: query,
            schema:
              {
                type: string,
                enum: [number, client, manager, warehouse, status, createdAt, updatedAt],
                default: updatedAt,
              },
          }
        - {
            name: direction,
            in: query,
            schema: { type: string, enum: [ASC, DESC], default: DESC },
          }
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              { type: string, enum: [DRAFT, SAVED, FULFILLED, CLOSED, CANCELLED] }
        - name: warehouseId
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, format: uuid }
        - { name: createdFrom, in: query, schema: { type: string, format: date-time } }
        - { name: createdTo, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Visible orders for this client.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/orders/{orderId}/available-units:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      operationId: listOrderUnitCandidates
      parameters:
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
        - {
            name: size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - { name: search, in: query, schema: { type: string, default: "" } }
      responses:
        "200":
          description: Free units plus units already added to this order.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/OrderUnitPage" } },
            }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/orders/{orderId}/units/{unitId}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
      - $ref: "#/components/parameters/UnitId"
    delete:
      operationId: removeOrderUnit
      parameters:
        - $ref: "#/components/parameters/ExpectedVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/orders/{orderId}/units/{unitId}/replace:
    parameters:
      - $ref: "#/components/parameters/OrderId"
      - $ref: "#/components/parameters/UnitId"
    post:
      operationId: replaceOrderUnit
      description: >-
        Warehouse-manager replacement of one unavailable booked cabin inside the same order.
        Furniture requirements transfer unchanged; any required physical furniture move reuses
        the existing equipment-movement task flow.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceOrderUnitRequest" }
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/orders/{orderId}/units/{unitId}/desired-equipment:
    parameters:
      - $ref: "#/components/parameters/OrderId"
      - $ref: "#/components/parameters/UnitId"
    put:
      operationId: setOrderUnitDesiredEquipment
      description: >-
        Replaces the desired catalogue furniture for one draft order cabin. This creates an
        order-wide reservation, not an immediate physical movement or a time-limited cabin hold.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetOrderUnitDesiredEquipmentRequest" }
      responses:
        "200": { $ref: "#/components/responses/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/orders/{orderId}/history:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      operationId: getOrderHistory
      responses:
        "200":
          description: Append-only order audit history.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrderHistoryEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/manual-booking-drafts/{draftId}/holds:
    parameters:
      - name: draftId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getManualBookingDraftHolds
      description: >-
        Reads the current manager-owned holds for a manual booking draft.
        Expired holds are omitted.
      parameters:
        - name: warehouseId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current draft holds, possibly empty after expiry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualBookingDraftHolds" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    put:
      operationId: replaceManualBookingDraftHolds
      description: >-
        Starts or replaces the server-side hold only when the manager continues
        a manual booking. Checkbox selection before this command is not a hold.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualBookingDraftHoldsRequest" }
      responses:
        "200":
          description: All requested cabins are held until expiresAt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualBookingDraftHolds" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/rental-inquiries:
    get:
      operationId: listRentalInquiriesForOrder
      description: >-
        Lists manual and assistant inquiries linked to one visible rental order,
        newest first. Detached inquiries are never included; expired or completed
        presentations remain discoverable for truthful read-only reopening.
      parameters:
        - name: rentalOrderId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Order-linked inquiries, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RentalInquiry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createRentalInquiry
      description: >-
        Creates or replays a manager-owned rental inquiry that binds one
        immutable existing or newly resolved client to an optional assistant
        conversation and an optional existing order.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRentalInquiryRequest" }
      responses:
        "201":
          description: Current inquiry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentalInquiry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/rental-inquiries/{inquiryId}:
    parameters:
      - $ref: "#/components/parameters/InquiryId"
    get:
      operationId: getRentalInquiry
      responses:
        "200":
          description: Current inquiry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentalInquiry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/v1/rental-inquiries/{inquiryId}/cabin-facets:
    parameters:
      - $ref: "#/components/parameters/InquiryId"
    get:
      operationId: getRentalInquiryCabinFacets
      description: >-
        Returns bounded exact availability facets for warehouses visible to
        this inquiry's manager. It performs no natural-language interpretation.
      responses:
        "200":
          description: Exact warehouse and cabin facets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinFacets" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/rental-inquiries/{inquiryId}/cabin-searches:
    parameters:
      - $ref: "#/components/parameters/InquiryId"
    post:
      operationId: searchRentalInquiryCabins
      description: >-
        Write-authorized, subject-scoped idempotent search for currently rentable cabins by exact
        structured filters supplied by the LLM tool call. Every result is FREE; category is an
        independent exact filter and may be omitted. An identical retry resumes the exact frozen
        asset command; reusing the key for another inquiry, warehouse, or group set is a conflict.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CabinSearchRequest" }
      responses:
        "200":
          description: Rentable cabins grouped in request order, or the frozen successful replay.
          headers:
            Idempotency-Replayed:
              required: false
              description: Present with value `true` when the response came from the frozen completed receipt.
              schema: { type: string, const: "true" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinSearchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/rental-inquiries/{inquiryId}/cabin-selection:
    parameters:
      - $ref: "#/components/parameters/InquiryId"
    get:
      operationId: getRentalInquiryCabinSelection
      description: >-
        Returns the inquiry's authoritative asset-owned chat holds and current
        cabin snapshots. An empty released selection has a null expiresAt.
      responses:
        "200":
          description: Current authoritative chat selection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinSelectionResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    put:
      operationId: replaceRentalInquiryCabinSelection
      description: >-
        Replaces the full asset-owned chat selection using the configured hold
        duration. The empty list releases every inquiry hold immediately. The
        server durably freezes the exact downstream command and a non-null
        retry deadline before calling asset-service. A replace uses that same
        deadline as its public hold expiry; a release keeps the public expiry
        null but remains recoverable after its persisted retry deadline. An
        identical Idempotency-Key retry reuses the frozen bytes and returns the
        frozen successful response without another asset mutation; changed
        reuse is a conflict.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceCabinSelectionRequest" }
      responses:
        "200":
          description: Replaced or idempotently replayed authoritative selection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinSelectionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/rental-inquiries/{inquiryId}/cabin-catalog:
    parameters:
      - $ref: "#/components/parameters/InquiryId"
    get:
      operationId: searchRentalInquiryCabinCatalog
      description: >-
        Performs a bounded, read-only cabin fact lookup by number, type, or
        other catalog text. It never creates, extends, or releases holds.
      parameters:
        - name: warehouseId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - { name: query, in: query, schema: { type: string, default: "", maxLength: 255 } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Bounded cabin catalog page; no hold side effect.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinCatalogPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/rental-inquiries/{inquiryId}/cabin-availability:
    parameters:
      - $ref: "#/components/parameters/InquiryId"
    post:
      operationId: checkRentalInquiryCabinAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CabinAvailabilityRequest" }
      responses:
        "200":
          description: Current availability for the exact requested cabins.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinAvailabilityResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/rental-inquiries/{inquiryId}/client-presentation:
    parameters:
      - $ref: "#/components/parameters/InquiryId"
    get:
      operationId: getRentalInquiryClientPresentation
      responses:
        "200":
          description: Current published presentation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientPresentation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: publishRentalInquiryClientPresentation
      description: >-
        Publishes or replaces the inquiry presentation, atomically replacing
        its asset-side time-limited cabin holds and rotating the public link.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishClientPresentationRequest" }
      responses:
        "200":
          description: Published presentation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientPresentation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    delete:
      operationId: revokeRentalInquiryClientPresentation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Presentation revoked and active holds released. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/rental-booking-alerts:
    get:
      operationId: listRentalBookingAlerts
      description: >-
        Returns the current manager's unacknowledged completed client-presentation
        bookings in confirmation order. Each alert is assembled from the immutable
        presentation snapshot and contains only the cabins selected by the client.
      responses:
        "200":
          description: Unacknowledged client confirmations, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RentalBookingAlert" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/logistics/v1/rental-booking-alerts/{bookingId}/actions:
    parameters:
      - $ref: "#/components/parameters/PresentationBookingId"
    post:
      operationId: actOnRentalBookingAlert
      description: >-
        Acknowledges one client confirmation with optimistic concurrency and an
        Idempotency-Key. It never creates a second order; KEEP_DRAFT leaves the
        existing draft order unchanged.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RentalBookingAlertActionRequest" }
      responses:
        "204": { description: Booking alert action was recorded or replayed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/settings/rental:
    get:
      operationId: getRentalSettings
      responses:
        "200":
          description: Global rental presentation settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentalSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: updateRentalSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRentalSettingsRequest" }
      responses:
        "200":
          description: Updated settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentalSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/warehouses/{warehouseId}/shipment-task-settings:
    parameters:
      - name: warehouseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getShipmentTaskSettings
      description: >-
        Returns the selected warehouse's effective maximum number of cabins that may be grouped
        in one newly created shipment task. Requires rwms.read and warehouse VIEW access.
      responses:
        "200":
          description: Warehouse-scoped shipment task grouping settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipmentTaskSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: updateShipmentTaskSettings
      description: >-
        Changes the warehouse-local cabin cap for future shipment tasks. Existing documents and
        driver tasks are not regrouped. Requires rwms.write and warehouse MANAGE access.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateShipmentTaskSettingsRequest" }
      responses:
        "200":
          description: Updated warehouse-scoped shipment task grouping settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipmentTaskSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/logistics/v1/cabins/{cabinId}/photo-presentations:
    parameters:
      - $ref: "#/components/parameters/CabinId"
    post:
      operationId: createCabinPhotoPresentation
      description: >-
        Creates an immutable, non-expiring public snapshot of the cabin's current READY images and
        allowlisted asset-owned display metadata: dimensions, finishing, category, ordered
        characteristic names and nullable linoleum.
        The caller must have rwms.write and EDIT access to the supplied warehouse. Logistics
        verifies the current asset identity, warehouse and expected version before asking
        media-service for presentation-safe opaque references. The response never exposes an
        object-store locator. Exact subject-bound Idempotency-Key replay returns the original
        public link; changed key reuse conflicts.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCabinPhotoPresentationRequest" }
      responses:
        "200":
          description: Exact idempotent replay of the original immutable presentation.
          headers:
            Idempotency-Replayed:
              required: true
              schema: { type: string, const: "true" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinPhotoPresentation" }
        "201":
          description: New immutable non-expiring cabin photo presentation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinPhotoPresentation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/public/v1/client-presentations/{token}:
    parameters:
      - $ref: "#/components/parameters/PublicPresentationToken"
    get:
      security: []
      operationId: getPublicClientPresentation
      responses:
        "200":
          description: Public no-store presentation view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicClientPresentation" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: The post-expiry view window has ended.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ApiProblem" }
  /api/logistics/public/v1/cabin-photo-presentations/{token}:
    parameters:
      - $ref: "#/components/parameters/PublicPresentationToken"
    get:
      security: []
      operationId: getPublicCabinPhotoPresentation
      description: >-
        Resolves one non-expiring immutable photo snapshot. It exposes only the cabin number,
        dimensions, finishing, category, ordered characteristic names, nullable linoleum, creation
        time and presentation-scoped image URLs. Warehouse, status, rental type, actor, asset
        version, unrestricted passport and object-store details remain private. Presentations
        created before metadata snapshots return null catalog fields, an empty characteristics
        list and null linoleum.
      responses:
        "200":
          description: Public no-store cabin photo presentation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicCabinPhotoPresentation" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/public/v1/cabin-photo-presentations/{token}/media/{mediaId}/{generation}/{variant}:
    parameters:
      - $ref: "#/components/parameters/PublicPresentationToken"
      - $ref: "#/components/parameters/MediaId"
      - $ref: "#/components/parameters/MediaGeneration"
      - $ref: "#/components/parameters/MediaVariant"
    get:
      security: []
      operationId: getPublicCabinPhotoPresentationMedia
      description: >-
        Streams one exact image generation and SMALL or LARGE variant only when it belongs to the
        immutable photo snapshot addressed by the signed token. Owner, generation and variant
        mismatches are indistinguishable 404 responses.
      responses:
        "200":
          description: Authorized no-store presentation image.
          headers:
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
          content:
            image/webp:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/public/v1/client-presentations/{token}/bookings:
    parameters:
      - $ref: "#/components/parameters/PublicPresentationToken"
    post:
      security: []
      operationId: confirmPublicClientPresentation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmClientPresentationRequest" }
      responses:
        "201":
          description: Booking completed and selected cabins were added to its target order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresentationBooking" }
        "202":
          description: Idempotent booking orchestration is pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresentationBooking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Booking was rejected, or the selection can no longer be accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresentationBooking" }
            application/problem+json:
              schema: { $ref: "#/components/schemas/ApiProblem" }
        "410":
          description: Holds or the public view have expired.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ApiProblem" }
  /api/logistics/public/v1/client-presentations/{token}/bookings/{bookingId}:
    parameters:
      - $ref: "#/components/parameters/PublicPresentationToken"
      - $ref: "#/components/parameters/PresentationBookingId"
    get:
      security: []
      operationId: getPublicClientPresentationBooking
      responses:
        "200":
          description: Completed booking state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresentationBooking" }
        "201":
          description: Booking completed and selected cabins were added to its target order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresentationBooking" }
        "202":
          description: Booking is pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresentationBooking" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Booking was rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresentationBooking" }
  /api/logistics/public/v1/client-presentations/{token}/media/{cabinId}/{mediaId}/{generation}/{variant}:
    parameters:
      - $ref: "#/components/parameters/PublicPresentationToken"
      - $ref: "#/components/parameters/CabinId"
      - $ref: "#/components/parameters/MediaId"
      - $ref: "#/components/parameters/MediaGeneration"
      - $ref: "#/components/parameters/MediaVariant"
    get:
      security: []
      operationId: getPublicClientPresentationMedia
      responses:
        "200":
          description: Authorized no-store presentation image.
          headers:
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
          content:
            image/webp:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: The presentation view window has ended.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ApiProblem" }
  /api/logistics/customer/v1/profile:
    get:
      operationId: getCustomerProfile
      description: >-
        Returns the one-time logistics profile owned by the authenticated CustomerApp subject.
        Requires a USER JWT issued to rwms-customer-android with customer.rental scope.
      responses:
        "200":
          description: Current customer profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createCustomerProfile
      description: >-
        Creates the authenticated subject's immutable customer identity link and its
        logistics-owned rental-client projection. A subject can create this profile only once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCustomerProfileRequest" }
      responses:
        "201":
          description: New customer profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/customer/v1/warehouses:
    get:
      operationId: listCustomerWarehouses
      description: Lists only active warehouses explicitly enabled for CustomerApp delivery.
      responses:
        "200":
          description: Delivery-enabled warehouses.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomerWarehouse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/customer/v1/inquiries:
    post:
      operationId: createCustomerInquiry
      description: Starts a customer-owned rental inquiry and version-fenced cart.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCustomerInquiryRequest" }
      responses:
        "201":
          description: New inquiry and cart identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerInquiry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/customer/v1/inquiries/{inquiryId}:
    parameters:
      - $ref: "#/components/parameters/InquiryId"
    get:
      operationId: getCustomerInquiry
      description: Returns only an inquiry owned by the authenticated CustomerApp subject.
      responses:
        "200":
          description: Current inquiry and cart fence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerInquiry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/logistics/customer/v1/inquiries/{inquiryId}/facets:
    parameters:
      - $ref: "#/components/parameters/InquiryId"
    get:
      operationId: getCustomerCabinFacets
      description: Returns exact asset-owned facet values for the inquiry warehouse.
      responses:
        "200":
          description: Exact currently available cabin facets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinFacets" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/customer/v1/inquiries/{inquiryId}/cabins:
    parameters:
      - $ref: "#/components/parameters/InquiryId"
    get:
      operationId: listCustomerCabins
      description: >-
        Returns one bounded page of currently bookable cabin cards. The result contains only FREE
        cabins or cabins held by this inquiry and exposes no dossier/passport navigation route.
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 255 }
        - name: cabinType
          in: query
          schema: { type: string, maxLength: 255 }
        - name: finish
          in: query
          schema: { type: string, maxLength: 255 }
        - name: dimensions
          in: query
          schema: { type: string, maxLength: 255 }
        - name: category
          in: query
          schema: { type: string, maxLength: 255 }
        - name: linoleum
          in: query
          schema: { type: boolean }
        - name: characteristics
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, maxLength: 255 }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Current filtered cabin page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCabinPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/customer/v1/inquiries/{inquiryId}/selection:
    parameters:
      - $ref: "#/components/parameters/InquiryId"
    get:
      operationId: getCustomerCabinSelection
      description: Returns current authoritative cabin holds without extending their lifetime.
      responses:
        "200":
          description: Current selected cabin holds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCabinSelection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    put:
      operationId: replaceCustomerCabinSelection
      description: Replaces the complete cabin hold set under idempotency and cart-version fences.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceCustomerCabinsRequest" }
      responses:
        "200":
          description: Updated authoritative cabin holds and cart version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCabinSelection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/customer/v1/inquiries/{inquiryId}/equipment:
    parameters:
      - $ref: "#/components/parameters/InquiryId"
    get:
      operationId: listCustomerEquipment
      description: Lists only active furniture positions with positive stock at the inquiry warehouse.
      responses:
        "200":
          description: Current positive furniture availability.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomerEquipmentAvailability" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    put:
      operationId: replaceCustomerEquipment
      description: Replaces the complete per-cabin furniture intent under the cart version fence.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceCustomerEquipmentRequest" }
      responses:
        "200":
          description: Persisted furniture intent and resulting cart version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerEquipmentSelection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/customer/v1/inquiries/{inquiryId}/cart:
    parameters:
      - $ref: "#/components/parameters/InquiryId"
    get:
      operationId: getCustomerCart
      description: Returns authoritative held cabins, furniture intent and selected delivery slot.
      responses:
        "200":
          description: Complete current cart projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCart" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/customer/v1/inquiries/{inquiryId}/cabins/{cabinId}/photos/{mediaId}:
    parameters:
      - $ref: "#/components/parameters/InquiryId"
      - $ref: "#/components/parameters/CabinId"
      - $ref: "#/components/parameters/MediaId"
    get:
      operationId: getCustomerCabinPhoto
      description: >-
        Streams one exact current image generation through logistics after verifying customer,
        inquiry and cabin visibility; object-store and media-service locators are never exposed.
      parameters:
        - name: generation
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - name: variant
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: Authorized no-store cabin image.
          headers:
            X-Content-Type-Options:
              required: true
              schema: { type: string, const: nosniff }
          content:
            image/*:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/customer/v1/delivery-slots/search:
    post:
      operationId: searchCustomerDeliverySlots
      description: >-
        Calculates and persists only currently feasible fixed delivery windows using truck travel
        times, one-hour travel zones, configured drivers and existing held/confirmed workload.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerDeliverySlotSearchRequest" }
      responses:
        "200":
          description: Current feasible delivery-slot offers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomerDeliverySlot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/customer/v1/delivery-slots/{slotId}/hold:
    parameters:
      - $ref: "#/components/parameters/CustomerDeliverySlotId"
    post:
      operationId: holdCustomerDeliverySlot
      description: Rechecks route capacity and holds one offer under slot and cart version fences.
      parameters:
        - $ref: "#/components/parameters/ExpectedCustomerDeliverySlotVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HoldCustomerDeliverySlotRequest" }
      responses:
        "200":
          description: Held slot and the cart version containing its identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeldCustomerDeliverySlot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/customer/v1/inquiries/{inquiryId}/checkout:
    parameters:
      - $ref: "#/components/parameters/InquiryId"
    post:
      operationId: checkoutCustomerInquiry
      description: >-
        Idempotently converts current cabin holds, furniture intent and a held route window into
        one durable rental booking and saved real order. Pending and rejected outcomes are
        represented by the response status field and can be reconciled by replay.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerCheckoutRequest" }
      responses:
        "200":
          description: Current durable booking outcome, including pending or rejected state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerBooking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/customer/v1/bookings:
    get:
      operationId: listCustomerBookings
      description: Lists durable booking outcomes owned by the authenticated CustomerApp subject.
      responses:
        "200":
          description: Current customer's booking outcomes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomerBooking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/logistics/v1/{documentType}/{documentId}/reconcile:
    parameters:
      - $ref: "#/components/parameters/DocumentTypePath"
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ExpectedVersion"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: reconcileDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconcileRequest" }
      responses:
        "202": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LineId:
      name: lineId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentTypePath:
      name: documentType
      in: path
      required: true
      schema: { type: string, enum: [returns, shipments, transfers] }
    WarehouseIdQuery:
      name: warehouseId
      in: query
      required: true
      schema: { type: string, format: uuid }
    ExpectedVersion:
      name: expectedVersion
      in: query
      required: true
      schema: { type: integer, minimum: 0 }
    ExpectedLineVersion:
      name: expectedLineVersion
      in: query
      required: true
      schema: { type: integer, minimum: 0 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UnitId:
      name: unitId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EquipmentId:
      name: equipmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EquipmentMovementTaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DriverTaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InquiryId:
      name: inquiryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CustomerDeliverySlotId:
      name: slotId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExpectedCustomerDeliverySlotVersion:
      name: expectedSlotVersion
      in: query
      required: true
      schema: { type: integer, format: int64, minimum: 0 }
    PublicPresentationToken:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 40, maxLength: 256 }
    PresentationBookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CabinId:
      name: cabinId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaGeneration:
      name: generation
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    MediaVariant:
      name: variant
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
  schemas:
    CustomerEntityType:
      type: string
      enum: [INDIVIDUAL, LEGAL]
    CreateCustomerProfileRequest:
      type: object
      additionalProperties: false
      required: [entityType, phone]
      properties:
        entityType: { $ref: "#/components/schemas/CustomerEntityType" }
        firstName: { type: [string, "null"], maxLength: 255 }
        lastName: { type: [string, "null"], maxLength: 255 }
        companyName: { type: [string, "null"], maxLength: 512 }
        phone: { type: string, minLength: 1, maxLength: 32 }
        email: { type: [string, "null"], maxLength: 320 }
        additionalInfo: { type: [string, "null"], maxLength: 2000 }
      oneOf:
        - properties:
            entityType: { const: INDIVIDUAL }
            companyName: { type: [string, "null"], maxLength: 0 }
            firstName: { type: string, minLength: 1, maxLength: 255 }
            lastName: { type: string, minLength: 1, maxLength: 255 }
          required: [firstName, lastName]
        - properties:
            entityType: { const: LEGAL }
            companyName: { type: string, minLength: 1, maxLength: 512 }
          required: [companyName]
    CustomerProfile:
      type: object
      additionalProperties: false
      required:
        [id, version, entityType, firstName, lastName, companyName, phone, email, additionalInfo]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        entityType: { $ref: "#/components/schemas/CustomerEntityType" }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
        companyName: { type: [string, "null"] }
        phone: { type: string }
        email: { type: [string, "null"] }
        additionalInfo: { type: [string, "null"] }
    CustomerWarehouse:
      type: object
      additionalProperties: false
      required: [id, name, city, address, timezone, depotLatitude, depotLongitude]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        city: { type: [string, "null"] }
        address: { type: [string, "null"] }
        timezone: { type: string }
        depotLatitude: { type: number, minimum: -90, maximum: 90 }
        depotLongitude: { type: number, minimum: -180, maximum: 180 }
    CreateCustomerInquiryRequest:
      type: object
      additionalProperties: false
      required: [warehouseId]
      properties:
        warehouseId: { type: string, format: uuid }
    CustomerInquiry:
      type: object
      additionalProperties: false
      required: [inquiryId, warehouseId, selectionVersion, state]
      properties:
        inquiryId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        selectionVersion: { type: integer, format: int64, minimum: 0 }
        state:
          type: string
          enum: [ACTIVE, SELECTION_PENDING, CHECKOUT_PENDING, BOOKED]
    CustomerCabinPhoto:
      type: object
      additionalProperties: false
      required: [photoId, generation, thumbnailUrl, url]
      properties:
        photoId: { type: string, format: uuid }
        generation: { type: integer, format: int64, minimum: 1 }
        thumbnailUrl: { type: string, minLength: 1 }
        url: { type: string, minLength: 1 }
    CustomerCabin:
      type: object
      additionalProperties: false
      required:
        [unitId, version, accountingNo, type, finish, dimensions, category, linoleum, characteristics, facts, photos]
      properties:
        unitId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        accountingNo: { type: string }
        type: { type: [string, "null"] }
        finish: { type: [string, "null"] }
        dimensions: { type: [string, "null"] }
        category: { type: [string, "null"] }
        linoleum: { type: [boolean, "null"] }
        characteristics:
          type: array
          items: { type: string }
        facts:
          type: object
          additionalProperties: true
        photos:
          type: array
          items: { $ref: "#/components/schemas/CustomerCabinPhoto" }
    CustomerCabinPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/CustomerCabin" }
        page: { type: integer, format: int64, minimum: 0 }
        size: { type: integer, format: int64, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int64, minimum: 0 }
    ReplaceCustomerCabinsRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, cabinUnitIds]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        cabinUnitIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    CustomerCabinSelection:
      type: object
      additionalProperties: false
      required: [version, expiresAt, cabins]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        expiresAt: { type: [string, "null"], format: date-time }
        cabins:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/CustomerCabin" }
    CustomerEquipmentAvailability:
      type: object
      additionalProperties: false
      required: [inventoryItemId, name, category, availableQuantity, maximumPerCabin]
      properties:
        inventoryItemId: { type: string, format: uuid }
        name: { type: string }
        category: { type: [string, "null"] }
        availableQuantity: { type: integer, format: int64, minimum: 1 }
        maximumPerCabin: { type: [integer, "null"], minimum: 1 }
    CustomerCabinEquipmentSelection:
      type: object
      additionalProperties: false
      required: [cabinUnitId, inventoryItemId, quantity]
      properties:
        cabinUnitId: { type: string, format: uuid }
        inventoryItemId: { type: string, format: uuid }
        quantity: { type: integer, format: int64, minimum: 1 }
    ReplaceCustomerEquipmentRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, selections]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        selections:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/CustomerCabinEquipmentSelection" }
    CustomerEquipmentSelection:
      type: object
      additionalProperties: false
      required: [version, selections]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        selections:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/CustomerCabinEquipmentSelection" }
    CustomerCart:
      type: object
      additionalProperties: false
      required: [inquiryId, warehouseId, version, state, cabins, equipment, deliverySlotId]
      properties:
        inquiryId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        state:
          type: string
          enum: [ACTIVE, SELECTION_PENDING, CHECKOUT_PENDING, BOOKED]
        cabins:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/CustomerCabin" }
        equipment:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/CustomerCabinEquipmentSelection" }
        deliverySlotId: { type: [string, "null"], format: uuid }
    CustomerDeliverySlotSearchRequest:
      type: object
      additionalProperties: false
      required: [inquiryId, address, latitude, longitude]
      properties:
        inquiryId: { type: string, format: uuid }
        address: { type: string, minLength: 1, maxLength: 1000 }
        latitude:
          type: number
          minimum: -90
          maximum: 90
          multipleOf: 0.000001
        longitude:
          type: number
          minimum: -180
          maximum: 180
          multipleOf: 0.000001
    CustomerDeliverySlot:
      type: object
      additionalProperties: false
      required:
        [slotId, version, date, start, end, travelZoneHours, capacityRemaining, expiresAt, state]
      properties:
        slotId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        date: { type: string, format: date }
        start: { type: string, format: time }
        end: { type: string, format: time }
        travelZoneHours: { type: integer, minimum: 1, maximum: 4 }
        capacityRemaining: { type: integer, minimum: 0 }
        expiresAt: { type: string, format: date-time }
        state:
          type: string
          enum: [OFFERED, HELD, CHECKOUT_PENDING, CONFIRMED, RELEASED]
    HoldCustomerDeliverySlotRequest:
      type: object
      additionalProperties: false
      required: [inquiryId, expectedVersion]
      properties:
        inquiryId: { type: string, format: uuid }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    HeldCustomerDeliverySlot:
      type: object
      additionalProperties: false
      required: [cartVersion, slot]
      properties:
        cartVersion: { type: integer, format: int64, minimum: 0 }
        slot: { $ref: "#/components/schemas/CustomerDeliverySlot" }
    CustomerCheckoutRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, slotId, slotVersion, rentalMonths]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        slotId: { type: string, format: uuid }
        slotVersion: { type: integer, format: int64, minimum: 0 }
        rentalMonths: { type: integer, format: int64, minimum: 1, maximum: 120 }
    CustomerBooking:
      type: object
      additionalProperties: false
      required: [bookingId, orderId, status, errorCode, inquiryId, slotId]
      properties:
        bookingId: { type: [string, "null"], format: uuid }
        orderId: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [PENDING, COMPLETED, REJECTED] }
        errorCode: { type: [string, "null"] }
        inquiryId: { type: string, format: uuid }
        slotId: { type: [string, "null"], format: uuid }
    PlanningDateOption:
      type: object
      additionalProperties: false
      required: [date, priority, isHard]
      properties:
        date: { type: string, format: date }
        priority: { type: integer, minimum: 0 }
        isHard: { type: boolean }
        windowStart:
          type: [string, "null"]
          format: time
          description: Exact fixed CustomerApp delivery-window start; absent for date-only choices.
        windowEnd:
          type: [string, "null"]
          format: time
          description: Exact fixed CustomerApp delivery-window end; absent for date-only choices.
        travelZoneHours:
          type: [integer, "null"]
          minimum: 1
          maximum: 4
          description: Source depot-to-customer Valhalla band in supported one-hour rings; exact capacity also evaluates each driver's current route front before offering a window.
    PlanningRequest:
      type: object
      additionalProperties: false
      required:
        [orderId, orderVersion, orderNumber, clientName, address, latitude, longitude, quantity, unitIds, dateOptions, createdAt]
      properties:
        orderId: { type: string, format: uuid }
        orderVersion: { type: integer, format: int64, minimum: 0 }
        orderNumber: { type: string, minLength: 1 }
        clientName: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        latitude:
          type: [number, "null"]
          format: double
        longitude:
          type: [number, "null"]
          format: double
        quantity: { type: integer, minimum: 1 }
        unitIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        dateOptions:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PlanningDateOption" }
        createdAt: { type: string, format: date-time }
    PlanningRequestFeed:
      type: object
      additionalProperties: false
      required: [warehouseId, timeZone, generatedAt, requests]
      properties:
        warehouseId: { type: string, format: uuid }
        timeZone: { type: string, minLength: 1 }
        generatedAt: { type: string, format: date-time }
        requests:
          type: array
          items: { $ref: "#/components/schemas/PlanningRequest" }
    PlanningCapacityJob:
      type: object
      additionalProperties: false
      required:
        [sourceJobId, deliveryDate, latitude, longitude, cabinCount, windowStart, windowEnd, serviceMinutes]
      properties:
        sourceJobId: { type: string, format: uuid }
        deliveryDate: { type: string, format: date }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        cabinCount: { type: integer, minimum: 1 }
        windowStart: { type: string, format: time }
        windowEnd: { type: string, format: time }
        serviceMinutes: { type: integer, minimum: 1 }
    ReplacePlanningCapacitySnapshotRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, sourceGeneration, sourceRevision, jobs]
      properties:
        warehouseId: { type: string, format: uuid }
        sourceGeneration:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Monotonic simulator-wide publication generation. A lower generation can be replayed
            only when its exact successful command receipt already exists; otherwise it is stale.
        sourceRevision:
          type: string
          pattern: '^[0-9a-f]{64}$'
        jobs:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/PlanningCapacityJob" }
    PlanningCapacitySnapshotResponse:
      type: object
      additionalProperties: false
      required:
        [warehouseId, sourceScenarioId, sourceGeneration, version, sourceRevision, jobCount, replayed, updatedAt]
      properties:
        warehouseId: { type: string, format: uuid }
        sourceScenarioId: { type: string, format: uuid }
        sourceGeneration: { type: integer, format: int64, minimum: 1 }
        version: { type: integer, format: int64, minimum: 0 }
        sourceRevision:
          type: string
          pattern: '^[0-9a-f]{64}$'
        jobCount: { type: integer, minimum: 0 }
        replayed: { type: boolean }
        updatedAt: { type: string, format: date-time }
    PlanningAssignment:
      type: object
      additionalProperties: false
      required: [orderId, expectedOrderVersion, scheduledDate, driverName, unitIds]
      properties:
        orderId: { type: string, format: uuid }
        expectedOrderVersion: { type: integer, format: int64, minimum: 0 }
        scheduledDate: { type: string, format: date }
        driverAudienceMode:
          type: string
          enum: [ASSIGNED_DRIVER, WAREHOUSE_DRIVERS]
          default: ASSIGNED_DRIVER
          description: WAREHOUSE_DRIVERS explicitly publishes a future delivery for qualified drivers to claim.
        driverWorkerId:
          type: [string, "null"]
          format: uuid
          description: Required for ASSIGNED_DRIVER and null for WAREHOUSE_DRIVERS.
        driverName: { type: string, minLength: 1, maxLength: 512 }
        unitIds:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { type: string, format: uuid }
    ApplyPlanningAssignmentsRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, planId, planVersion, assignments]
      properties:
        warehouseId: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        planVersion: { type: integer, format: int64, minimum: 1 }
        assignments:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/PlanningAssignment" }
    AppliedPlanningAssignment:
      type: object
      additionalProperties: false
      required: [orderId, documentId, replayed]
      properties:
        orderId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        replayed: { type: boolean }
    PlanningAssignmentStatus:
      type: object
      additionalProperties: false
      required:
        [orderId, documentId, scheduledDate, unitIds, driverAudienceMode, driverWorkerId, driverName, taskState]
      properties:
        orderId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        scheduledDate: { type: string, format: date }
        unitIds:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { type: string, format: uuid }
        driverAudienceMode:
          type: string
          enum: [ASSIGNED_DRIVER, WAREHOUSE_DRIVERS]
        driverWorkerId: { type: [string, "null"], format: uuid }
        driverName: { type: [string, "null"], maxLength: 512 }
        taskState:
          type: string
          enum: [REGISTERING, SCHEDULED, CURRENT, FINALIZING, COMPLETED, CANCELLED, RECONCILIATION_REQUIRED]
    PlanningAssignmentStatusResponse:
      type: object
      additionalProperties: false
      required: [warehouseId, date, assignments]
      properties:
        warehouseId: { type: string, format: uuid }
        date: { type: string, format: date }
        assignments:
          type: array
          items: { $ref: "#/components/schemas/PlanningAssignmentStatus" }
    RejectedPlanningAssignment:
      type: object
      additionalProperties: false
      required: [orderId, code, message]
      properties:
        orderId: { type: string, format: uuid }
        code: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
    ApplyPlanningAssignmentsResponse:
      type: object
      additionalProperties: false
      required: [applied, rejected]
      properties:
        applied:
          type: array
          items: { $ref: "#/components/schemas/AppliedPlanningAssignment" }
        rejected:
          type: array
          items: { $ref: "#/components/schemas/RejectedPlanningAssignment" }
    MaintenanceReturnArrival:
      type: object
      additionalProperties: false
      required: [warehouseId, rentalItemId, returnDocumentId, arrivedAt]
      properties:
        warehouseId: { type: string, format: uuid }
        rentalItemId: { type: string, format: uuid }
        returnDocumentId: { type: string, format: uuid }
        arrivedAt: { type: string, format: date-time }
    ApplyInventoryOutcomeRequest:
      type: object
      additionalProperties: false
      required:
        [warehouseId, inventoryCompletedAt, finalPlanVersion, finalPlanSha256, outcomes]
      properties:
        warehouseId: { type: string, format: uuid }
        inventoryCompletedAt: { type: string, format: date-time }
        finalPlanVersion: { type: integer, format: int64, minimum: 1 }
        finalPlanSha256:
          { type: string, pattern: "^[0-9a-f]{64}$", minLength: 64, maxLength: 64 }
        outcomes:
          type: array
          minItems: 1
          maxItems: 5000
          description: findingId and assetId must each be unique across the complete batch.
          items: { $ref: "#/components/schemas/InventoryAssetOutcome" }
    InventoryAssetOutcome:
      type: object
      additionalProperties: false
      required: [findingId, assetId, dispositionKind, desiredStatus, formerRental, shipment]
      properties:
        findingId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        dispositionKind: { $ref: "#/components/schemas/InventoryDispositionKind" }
        desiredStatus:
          {
            type: string,
            enum: [FREE, REPAIR, CAPITAL_REPAIR, RENTED, WRITE_OFF_PENDING],
          }
        formerRental:
          oneOf:
            - { $ref: "#/components/schemas/InventoryFormerRental" }
            - { type: "null" }
        shipment:
          oneOf:
            - { $ref: "#/components/schemas/InventoryShipment" }
            - { type: "null" }
    InventoryDispositionKind:
      type: string
      enum: [LOCAL, SHIPMENT, WRITE_OFF]
    InventoryFormerRental:
      type: object
      additionalProperties: false
      required: [returnedOn, clientId, clientSnapshot]
      properties:
        returnedOn: { type: string, format: date }
        clientId: { type: string, format: uuid }
        clientSnapshot: { type: string, minLength: 1, maxLength: 512 }
    InventoryShipmentFurniture:
      type: object
      additionalProperties: false
      required: [equipmentId, catalogVersion, quantity]
      properties:
        equipmentId: { type: string, format: uuid }
        catalogVersion: { type: integer, format: int64, minimum: 0 }
        quantity: { type: integer, format: int64, minimum: 1 }
    InventoryShipment:
      type: object
      additionalProperties: false
      required: [departedOn, clientId, clientSnapshot, furniture]
      properties:
        departedOn: { type: string, format: date }
        clientId: { type: string, format: uuid }
        clientSnapshot: { type: string, minLength: 1, maxLength: 512 }
        furniture:
          type: array
          maxItems: 100
          description: >-
            equipmentId values must be unique. These reviewed physical contents deliberately do not
            reserve or decrement STOCK.
          items: { $ref: "#/components/schemas/InventoryShipmentFurniture" }
    InventoryDispositionResult:
      type: object
      additionalProperties: false
      required: [findingId, assetId, dispositionKind, markerId, documentId, lineId]
      properties:
        findingId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        dispositionKind: { $ref: "#/components/schemas/InventoryDispositionKind" }
        markerId: { type: string, format: uuid }
        documentId:
          {
            type: [string, "null"],
            format: uuid,
            description: Null for WRITE_OFF and LOCAL outcomes without formerRental.,
          }
        lineId: { type: [string, "null"], format: uuid }
    ApplyInventoryOutcomeResponse:
      type: object
      additionalProperties: false
      required:
        - inventoryId
        - finalPlanVersion
        - supersededDocumentIds
        - supersededRentalOrderIds
        - cancelledDriverTaskIds
        - dispositions
        - supersededLineCount
        - supersededRentalUnitCount
        - replay
      properties:
        inventoryId: { type: string, format: uuid }
        finalPlanVersion: { type: integer, format: int64, minimum: 1 }
        supersededDocumentIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        supersededRentalOrderIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        cancelledDriverTaskIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        dispositions:
          type: array
          description: Every stored disposition marker and any created or exact-source reused document facts.
          items: { $ref: "#/components/schemas/InventoryDispositionResult" }
        supersededLineCount: { type: integer, format: int64, minimum: 0 }
        supersededRentalUnitCount: { type: integer, format: int64, minimum: 0 }
        replay: { type: boolean }
    LogisticsDocument:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          documentType,
          state,
          warehouseId,
          destinationWarehouseId,
          partySnapshot,
          driverSnapshot,
          driverWorkerId,
          clientId,
          historicalRentalImport,
          equipmentMovementTaskId,
          scheduledDate,
          rentalOrderId,
          rentalShipmentId,
          inventorySourceId,
          inventorySourceFindingId,
          inventorySourceDispositionKind,
          lines,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        documentType: { type: string, enum: [RETURN, SHIPMENT, TRANSFER] }
        state:
          type: string
          enum:
            [
              DRAFT,
              REGISTERING,
              INSPECTION_REQUIRED,
              ACCEPTING,
              ACCEPTED,
              ESTIMATE_PENDING,
              ESTIMATE_REQUESTED,
              PREPARING,
              AWAITING_CONFIRMATION,
              CONFIRMING_PREPARATION,
              SHIPPED,
              CANCELLING,
              DEPARTING,
              IN_TRANSIT,
              ARRIVING,
              COMPLETED,
              CANCELLED,
              CONFLICT,
              RECONCILIATION_REQUIRED,
            ]
        warehouseId: { type: string, format: uuid }
        destinationWarehouseId: { type: [string, "null"], format: uuid }
        partySnapshot:
          {
            type: [string, "null"],
            maxLength: 512,
            description: Immutable,
            trimmed workflow snapshot; no directory identity.,
          }
        driverSnapshot:
          {
            type: [string, "null"],
            maxLength: 512,
            description: Immutable,
            trimmed workflow snapshot; no directory identity.,
          }
        driverWorkerId:
          {
            type: [string, "null"],
            format: uuid,
            description: Opaque task-board worker identity selected for driver work; null for legacy or unassigned documents.,
          }
        clientId:
          {
            type: [string, "null"],
            format: uuid,
            description: Client bound to the return or shipment.,
          }
        historicalRentalImport:
          {
            type: boolean,
            description: True when this document was entered as a past physical rental operation without a driver task.,
          }
        equipmentMovementTaskId:
          {
            type: [string, "null"],
            format: uuid,
            description: Server-created task that moves transfer furniture between warehouses.,
          }
        scheduledDate:
          {
            type: [string, "null"],
            format: date,
            description: Assigned shipment, return pickup, or transfer task date; absent while waiting for scheduling.,
          }
        rentalOrderId:
          {
            type: [string, "null"],
            format: uuid,
            description: Order whose shipment/return lifecycle owns this document.,
          }
        rentalShipmentId:
          {
            type: [string, "null"],
            format: uuid,
          description: Shipment that produced this cabin-level rental return; null for shipments and generic documents.,
          }
        inventorySourceId:
          {
            type: [string, "null"],
            format: uuid,
            description: Completed inventory that directly created this historical document.,
          }
        inventorySourceFindingId: { type: [string, "null"], format: uuid }
        inventorySourceDispositionKind:
          { type: [string, "null"], enum: [LOCAL, SHIPMENT, null] }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/LogisticsLine" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LogisticsLine:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          lineNumber,
          assetId,
          assetVersion,
          state,
          tenantSnapshot,
          rentalOrderId,
          inventoryShipmentFurniture,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        lineNumber: { type: integer, minimum: 1 }
        assetId: { type: string, format: uuid }
        assetVersion: { type: integer, minimum: 0 }
        state:
          {
            type: string,
            enum:
              [
                PENDING,
                DEPARTING,
                DEPARTED,
                ARRIVING,
                ARRIVED,
                CONFLICT,
                CANCELLED,
              ],
          }
        tenantSnapshot: { type: [string, "null"], maxLength: 512 }
        rentalOrderId:
          {
            type: [string, "null"],
            format: uuid,
            description: Rental order that owns the return or shipment cabin reservation.,
          }
        inventoryShipmentFurniture:
          oneOf:
            - type: array
              maxItems: 100
              items: { $ref: "#/components/schemas/InventoryShipmentFurniture" }
            - { type: "null" }
    EquipmentMovementLocationKind:
      type: string
      enum: [STOCK, CABIN_NON_RENTED, CABIN_RENTED]
    EquipmentMovementTaskState:
      type: string
      enum:
        [
          RESERVING,
          REGISTERING_TASK,
          AWAITING_WORKER,
          EXECUTING,
          CANCELLING,
          COMPLETED,
          CANCELLED,
          EXPIRED,
          CONFLICT,
          RECONCILIATION_REQUIRED,
        ]
    EquipmentMovementTaskOwnerType:
      type: string
      enum: [USER_REQUEST, MAINTENANCE_DISPOSITION]
    EquipmentMovementLineState:
      type: string
      enum: [PENDING_RESERVATION, RESERVED, EXECUTED, RELEASED]
    EquipmentMovementLineRequest:
      type: object
      additionalProperties: false
      required:
        [
          equipmentId,
          sourceRentalItemId,
          sourceLocationKind,
          expectedSourceBalanceVersion,
          targetRentalItemId,
          targetLocationKind,
          quantity,
        ]
      properties:
        equipmentId: { type: string, format: uuid }
        sourceRentalItemId: { type: [string, "null"], format: uuid }
        sourceLocationKind:
          { $ref: "#/components/schemas/EquipmentMovementLocationKind" }
        expectedSourceBalanceVersion:
          { type: integer, format: int64, minimum: 0 }
        targetRentalItemId: { type: [string, "null"], format: uuid }
        targetLocationKind:
          { $ref: "#/components/schemas/EquipmentMovementLocationKind" }
        quantity: { type: integer, format: int64, minimum: 1 }
    CreateEquipmentMovementTaskRequest:
      type: object
      additionalProperties: false
      required:
        [
          warehouseId,
          targetWarehouseId,
          unitNumber,
          plannedDurationMinutes,
          deadlineAt,
          lines,
        ]
      properties:
        warehouseId: { type: string, format: uuid }
        targetWarehouseId:
          {
            type: [string, "null"],
            format: uuid,
            description: Target warehouse for STOCK-to-STOCK movement; omitted means the source warehouse.,
          }
        unitNumber: { type: [string, "null"], maxLength: 64 }
        plannedDurationMinutes: { type: integer, minimum: 1 }
        deadlineAt: { type: string, format: date-time }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          description: >-
            At most one hundred worker operations are accepted. A cabin-to-cabin line produces
            two operations (take out and bring in); a stock/cabin line produces one.
          items: { $ref: "#/components/schemas/EquipmentMovementLineRequest" }
    CreateMaintenanceEquipmentMovementTaskRequest:
      type: object
      additionalProperties: false
      required:
        [
          decisionId,
          warehouseId,
          unitNumber,
          plannedDurationMinutes,
          deadlineAt,
          lines,
        ]
      properties:
        decisionId:
          { type: string, format: uuid, description: Permanent maintenance disposition owner. }
        warehouseId: { type: string, format: uuid }
        unitNumber: { type: string, minLength: 1, maxLength: 64 }
        plannedDurationMinutes: { type: integer, minimum: 1 }
        deadlineAt: { type: string, format: date-time }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          description: >-
            Each unique equipment line moves a positive quantity from this decision's cabin
            CABIN_NON_RENTED balance to STOCK in the same warehouse. Zero lines are omitted.
          items: { $ref: "#/components/schemas/MaintenanceEquipmentMovementLineRequest" }
    MaintenanceEquipmentMovementLineRequest:
      type: object
      additionalProperties: false
      required: [equipmentId, sourceRentalItemId, expectedSourceBalanceVersion, quantity]
      properties:
        equipmentId: { type: string, format: uuid }
        sourceRentalItemId: { type: string, format: uuid }
        expectedSourceBalanceVersion: { type: integer, format: int64, minimum: 0 }
        quantity: { type: integer, format: int64, minimum: 1 }
    CancelEquipmentMovementTaskRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    EquipmentMovementTaskLine:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          lineNumber,
          equipmentId,
          equipmentName,
          sourceWarehouseId,
          sourceRentalItemId,
          sourceLocationKind,
          expectedSourceBalanceVersion,
          targetWarehouseId,
          targetRentalItemId,
          targetLocationKind,
          quantity,
          reservationId,
          reservationVersion,
          state,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        lineNumber: { type: integer, minimum: 1 }
        equipmentId: { type: string, format: uuid }
        equipmentName: { type: [string, "null"], maxLength: 512 }
        sourceWarehouseId: { type: string, format: uuid }
        sourceRentalItemId: { type: [string, "null"], format: uuid }
        sourceLocationKind:
          { $ref: "#/components/schemas/EquipmentMovementLocationKind" }
        expectedSourceBalanceVersion:
          { type: integer, format: int64, minimum: 0 }
        targetWarehouseId: { type: string, format: uuid }
        targetRentalItemId: { type: [string, "null"], format: uuid }
        targetLocationKind:
          { $ref: "#/components/schemas/EquipmentMovementLocationKind" }
        quantity: { type: integer, format: int64, minimum: 1 }
        reservationId: { type: [string, "null"], format: uuid }
        reservationVersion:
          { type: [integer, "null"], format: int64, minimum: 0 }
        state: { $ref: "#/components/schemas/EquipmentMovementLineState" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EquipmentMovementTask:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          warehouseId,
          ownerType,
          ownerId,
          externalTaskId,
          taskBoardTaskId,
          taskBoardTaskVersion,
          taskBoardDoneAt,
          unitNumber,
          plannedDurationMinutes,
          deadlineAt,
          state,
          terminalState,
          failureCode,
          lines,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        ownerType: { $ref: "#/components/schemas/EquipmentMovementTaskOwnerType" }
        ownerId:
          type: [string, "null"]
          format: uuid
          description: decisionId for MAINTENANCE_DISPOSITION; null for USER_REQUEST.
        externalTaskId: { type: string, format: uuid }
        taskBoardTaskId: { type: [string, "null"], format: uuid }
        taskBoardTaskVersion:
          { type: [integer, "null"], format: int64, minimum: 0 }
        taskBoardDoneAt: { type: [string, "null"], format: date-time }
        unitNumber: { type: [string, "null"], maxLength: 64 }
        plannedDurationMinutes: { type: integer, minimum: 1 }
        deadlineAt: { type: string, format: date-time }
        state: { $ref: "#/components/schemas/EquipmentMovementTaskState" }
        terminalState:
          oneOf:
            - { $ref: "#/components/schemas/EquipmentMovementTaskState" }
            - { type: "null" }
        failureCode: { type: [string, "null"], maxLength: 96 }
        lines:
          type: array
          items: { $ref: "#/components/schemas/EquipmentMovementTaskLine" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DriverTaskKind:
      type: string
      enum:
        [DELIVER_TO_REPAIR, REMOVE_FROM_REPAIR, CAPITAL_TO_PRODUCTION, GENERAL_MOVEMENT, SHIPMENT, RETURN, TRANSFER]
    DriverTaskSourceType:
      type: string
      enum:
        [REPAIR, ESTIMATE, INVENTORY, REPAIR_PLACE, CAPITAL_REPAIR, MANUAL, LOGISTICS_DOCUMENT, LOGISTICS_DOCUMENT_LINE]
    DriverTaskAudienceMode:
      type: string
      enum: [UNASSIGNED, ASSIGNED_DRIVER, WAREHOUSE_DRIVERS]
    DriverTaskAudience:
      type: object
      additionalProperties: false
      required: [mode, workerId, workerName]
      properties:
        mode: { $ref: "#/components/schemas/DriverTaskAudienceMode" }
        workerId:
          type: [string, "null"]
          format: uuid
          description: Required for ASSIGNED_DRIVER; always null for UNASSIGNED and WAREHOUSE_DRIVERS.
        workerName:
          type: [string, "null"]
          maxLength: 512
          description: Immutable display snapshot paired with workerId.
      allOf:
        - if:
            properties: { mode: { const: ASSIGNED_DRIVER } }
            required: [mode]
          then:
            properties:
              workerId: { type: string, format: uuid }
              workerName: { type: string, minLength: 1, maxLength: 512 }
        - if:
            properties: { mode: { enum: [UNASSIGNED, WAREHOUSE_DRIVERS] } }
            required: [mode]
          then:
            properties:
              workerId: { type: "null" }
              workerName: { type: "null" }
    DriverTaskPlanningMode:
      type: string
      enum: [AUTO, FIXED_DATE]
    DriverTaskState:
      type: string
      enum:
        [REGISTERING, SCHEDULED, CURRENT, FINALIZING, COMPLETED, CANCELLED, RECONCILIATION_REQUIRED]
    DriverTripDesiredEquipment:
      type: object
      additionalProperties: false
      required: [equipmentId, equipmentName, quantity]
      properties:
        equipmentId: { type: string, format: uuid }
        equipmentName: { type: string, minLength: 1, maxLength: 512 }
        quantity: { type: integer, format: int64, minimum: 1 }
    DriverTripActualEquipment:
      type: object
      additionalProperties: false
      required: [equipmentId, equipmentName, quantity, locationKind]
      properties:
        equipmentId: { type: string, format: uuid }
        equipmentName: { type: [string, "null"], maxLength: 512 }
        quantity: { type: integer, format: int64, minimum: 0 }
        locationKind: { type: string }
    DriverTripCabin:
      type: object
      additionalProperties: false
      required:
        [cabinId, unitNumber, desiredContents, actualContents, movementTaskCreated, movementTaskCompleted, contentReady]
      properties:
        cabinId: { type: string, format: uuid }
        unitNumber: { type: string, minLength: 1, maxLength: 64 }
        desiredContents:
          type: array
          items: { $ref: "#/components/schemas/DriverTripDesiredEquipment" }
        actualContents:
          type: [array, "null"]
          description: Null only in the bounded local board-card projection; the detail endpoint returns live contents.
          items: { $ref: "#/components/schemas/DriverTripActualEquipment" }
        movementTaskCreated: { type: boolean }
        movementTaskCompleted: { type: boolean }
        contentReady:
          type: [boolean, "null"]
          description: Null only when the local board snapshot cannot prove readiness without a live asset read.
    DriverTripDetails:
      type: object
      additionalProperties: false
      required:
        [taskNumber, tripNumber, operationType, clientName, address, latitude, longitude, primaryContactName, primaryContactPhone, additionalContacts, comment, desiredDeliveryWindows, scheduledDate, cabins]
      properties:
        taskNumber: { type: string, minLength: 1, maxLength: 64 }
        tripNumber: { type: integer, minimum: 1 }
        operationType: { type: string }
        clientName: { type: string, minLength: 1, maxLength: 512 }
        address: { type: [string, "null"], maxLength: 1000 }
        latitude: { type: [number, "null"], format: double, minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], format: double, minimum: -180, maximum: 180 }
        primaryContactName: { type: [string, "null"], maxLength: 512 }
        primaryContactPhone:
          type: [string, "null"]
          maxLength: 16
          pattern: '^\+[1-9][0-9]{6,14}$'
        additionalContacts:
          type: array
          items: { $ref: "#/components/schemas/AdditionalContact" }
        comment: { type: [string, "null"], maxLength: 2000 }
        desiredDeliveryWindows:
          type: array
          items: { $ref: "#/components/schemas/DesiredDeliveryWindow" }
        scheduledDate: { type: string, format: date }
        cabins:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/DriverTripCabin" }
    MaintenanceDriverTaskCompensationOutcome:
      type: string
      enum:
        [ABSENT, PENDING, CANCELLED, STARTED, COMPLETED, RECONCILIATION_REQUIRED]
    MaintenanceDriverTaskCompensation:
      type: object
      additionalProperties: false
      required:
        [
          repairId,
          kind,
          outcome,
          taskId,
          taskVersion,
          state,
          externalTaskId,
          taskBoardTaskId,
          taskBoardTaskVersion,
          taskBoardEntryId,
          taskBoardEntryVersion,
          taskBoardEntryStatus,
          taskBoardStatus,
          taskBoardLane,
          taskBoardDoneAt,
          repairPlaceAllocationId,
          repairPlaceAllocationVersion,
        ]
      properties:
        repairId: { type: string, format: uuid }
        kind:
          type: string
          enum: [DELIVER_TO_REPAIR, CAPITAL_TO_PRODUCTION]
        outcome:
          { $ref: "#/components/schemas/MaintenanceDriverTaskCompensationOutcome" }
        taskId: { type: [string, "null"], format: uuid }
        taskVersion: { type: [integer, "null"], format: int64, minimum: 0 }
        state:
          oneOf:
            - { $ref: "#/components/schemas/DriverTaskState" }
            - { type: "null" }
        externalTaskId: { type: [string, "null"], format: uuid }
        taskBoardTaskId: { type: [string, "null"], format: uuid }
        taskBoardTaskVersion:
          { type: [integer, "null"], format: int64, minimum: 0 }
        taskBoardEntryId: { type: [string, "null"], format: uuid }
        taskBoardEntryVersion:
          { type: [integer, "null"], format: int64, minimum: 0 }
        taskBoardEntryStatus: { type: [string, "null"], maxLength: 24 }
        taskBoardStatus: { type: [string, "null"], maxLength: 24 }
        taskBoardLane: { type: [string, "null"], maxLength: 24 }
        taskBoardDoneAt: { type: [string, "null"], format: date-time }
        repairPlaceAllocationId: { type: [string, "null"], format: uuid }
        repairPlaceAllocationVersion:
          { type: [integer, "null"], format: int64, minimum: 0 }
    CreateDriverTaskRequest:
      type: object
      additionalProperties: false
      required:
        [warehouseId, cabinId, repairId, sourceType, sourceId, kind, planningMode, scheduledDate, priority, activateNow]
      properties:
        warehouseId: { type: string, format: uuid }
        cabinId: { type: string, format: uuid }
        repairId: { type: [string, "null"], format: uuid }
        sourceType: { $ref: "#/components/schemas/DriverTaskSourceType" }
        sourceId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/DriverTaskKind" }
        planningMode: { $ref: "#/components/schemas/DriverTaskPlanningMode" }
        scheduledDate:
          description: >-
            Required only for FIXED_DATE and forbidden for AUTO. This is the
            immutable requested date; private maintenance intake can return a
            later effective date for an overdue request.
          type: [string, "null"]
          format: date
        priority: { type: integer, minimum: 1, maximum: 5 }
        activateNow:
          type: boolean
          description: Used by an explicit drag into CURRENT; DELIVER_TO_REPAIR still requires a free or paired repair place.
        comment:
          type: [string, "null"]
          maxLength: 1000
          description: Required and nonblank for MANUAL / GENERAL_MOVEMENT; optional for other task sources.
    DriverTask:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          warehouseId,
          cabinId,
          repairId,
          sourceType,
          sourceId,
          kind,
          planningMode,
          scheduledDate,
          priority,
          comment,
