openapi: 3.1.0
info:
  title: RWMS Warehouse Service API
  version: 1.2.0
  description: >-
    Canonical warehouse identity API. The public directory listing requires a USER
    JWT with either warehouse.read, or SYSTEM_ADMIN/WMS_ADMIN
    with exactly one application scope admin.manage after protocol scopes, or the exact
    dedicated rental-manager credential
    (rwms-rental-manager-web/android, RENTAL_MANAGER, rentalAccess=true,
    rental.manage only). The listing is independent of warehouse_access grants.
    This approved warehouse directory includes name, city and address.
    An object can independently be production and/or a primary RWMS warehouse. A
    representative has neither classification and selects one production or primary-RWMS
    parent; this organizational relationship is independent from
    operational support links. Internal validation has
    separate least-privilege paths for service credentials. Warehouse UUID is
    the stable external business reference; display names are unique only after
    the documented normalization and are never used as integration identity.
    Lifecycle is one-way ACTIVE -> DRAINING -> INACTIVE. DRAINING rejects new
    incoming work but permits outbound draining work through the explicit private
    admission boundary; INACTIVE requires every resource owner to confirm readiness.
servers:
  - url: /
security:
  - bearerJwt: []
paths:
  /api/warehouse/v1/warehouses:
    get:
      operationId: listWarehouses
      description: >-
        Requires USER. Authority is either warehouse.read,
        SYSTEM_ADMIN/WMS_ADMIN with exactly one application scope admin.manage after
        protocol scopes, or the exact dedicated rental-manager credential
        (rwms-rental-manager-web/android, RENTAL_MANAGER, rentalAccess=true,
        rental.manage only). This is the approved installation directory:
        warehouse_access grants do not filter it. The default includes ACTIVE and DRAINING warehouses; includeInactive
        is SYSTEM_ADMIN-only.
      parameters:
        - name: includeInactive
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Warehouses ordered by nullable sortOrder, name and stable UUID.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Warehouse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createWarehouse
      description: >-
        Requires USER, global role SYSTEM_ADMIN or WMS_ADMIN, and
        either rwms.write or exactly one application scope admin.manage after protocol
        scopes.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWarehouseRequest' }
      responses:
        '201':
          description: Warehouse created, or the original successful response replayed.
          headers:
            Idempotency-Replayed:
              required: false
              schema: { type: string, const: 'true' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Warehouse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/warehouse/v1/warehouses/{id}:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: getWarehouse
      description: >-
        Requires USER and warehouse.read. The stable UUID lookup also returns an inactive
        warehouse so historical asset, repair and logistics references
        remain resolvable. warehouse_access grants do not filter this approved
        warehouse-directory read. An unknown UUID returns 404.
      responses:
        '200':
          description: Warehouse metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Warehouse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: replaceWarehouse
      description: >-
        Full mutable metadata replacement. Requires USER, global role
        SYSTEM_ADMIN or WMS_ADMIN, and either rwms.write or exactly one application scope
        admin.manage after protocol scopes.
        timeZone is an immediate correction only while this warehouse has no durable
        operation mark; an operated warehouse must use the effective-dated scheduling command.
        Lifecycle state is not replaceable through this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceWarehouseRequest' }
      responses:
        '200':
          description: Warehouse replaced. A semantic no-op does not increment version or append an event.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Warehouse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/warehouse/v1/warehouses/{servedWarehouseId}/support-links:
    parameters:
      - name: servedWarehouseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listWarehouseSupportLinks
      description: >-
        Returns the complete directed support-link collection, including inactive links.
        Requires USER. The dedicated rwms-admin-web client with
        SYSTEM_ADMIN/WMS_ADMIN and exactly one application scope admin.manage after
        protocol scopes bypasses warehouse grants. Other callers require warehouse.read,
        a warehouse-management role and at least VIEW access to the served warehouse.
        Unknown UUIDs return 404.
      responses:
        '200':
          description: Current collection and the served warehouse version fence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseSupportLinks' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: replaceWarehouseSupportLinks
      description: >-
        Atomic full replacement under the served warehouse expectedVersion. Requires USER. The
        dedicated rwms-admin-web client with SYSTEM_ADMIN/WMS_ADMIN and
        exactly one application scope admin.manage after protocol scopes bypasses warehouse
        grants. Other callers require rwms.write, a warehouse-management role and MANAGE access
        to both the served warehouse and every supplied support warehouse. An identical retry is
        a semantic no-op. The served warehouse must be active and representative; every support
        warehouse must be active.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceWarehouseSupportLinksRequest' }
      responses:
        '200':
          description: Replaced collection with the next warehouse version fence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseSupportLinks' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/warehouse/v1/warehouses/{id}/draining:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    post:
      operationId: startWarehouseDraining
      description: >-
        Requires USER, global role SYSTEM_ADMIN or WMS_ADMIN, and either
        rwms.write or exactly one application scope admin.manage after protocol scopes.
        Permitted only from ACTIVE.
        It permanently closes inbound admission while preserving outbound admission until
        all resource owners have confirmed readiness.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseLifecycleTransitionRequest' }
      responses:
        '200':
          description: Warehouse entered DRAINING.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Warehouse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/warehouse/v1/warehouses/{id}/inactivation:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    post:
      operationId: completeWarehouseInactivation
      description: >-
        Requires USER, global role SYSTEM_ADMIN or WMS_ADMIN, and either
        rwms.write or exactly one application scope admin.manage after protocol scopes.
        Permitted only from DRAINING
        after asset-service, inventory-service, logistics-service, maintenance-service and
        task-board-service have each recorded immutable readiness confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseLifecycleTransitionRequest' }
      responses:
        '200':
          description: Warehouse entered terminal INACTIVE state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Warehouse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/warehouse/v1/warehouses/{id}/time-zone-changes:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    post:
      operationId: scheduleWarehouseTimeZone
      description: >-
        Requires USER, global role SYSTEM_ADMIN or WMS_ADMIN, and either
        rwms.write or exactly one application scope admin.manage after protocol scopes.
        Available only after a
        durable warehouse operation mark exists. Appends an immutable timezone decision
        whose effectiveFrom must be in the future; it never rewrites historical operation
        calculations or reports. The Warehouse response continues to expose the currently
        effective timezone until that instant.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleWarehouseTimeZoneRequest' }
      responses:
        '200':
          description: Immutable timezone decision appended under the expected-version fence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseTimeZoneChange' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/warehouse/v1/admin/outbox-events/{eventId}/recovery:
    parameters:
      - $ref: '#/components/parameters/OutboxEventId'
    post:
      operationId: recoverWarehouseOutboxEvent
      description: >-
        Reviewed recovery of one terminal warehouse outbox event. Requires a USER JWT with
        exactly rwms.write and global role SYSTEM_ADMIN or WMS_ADMIN. The command is allowed only
        when the identified event is the current first unpublished event of its warehouse
        aggregate and is terminal DLT or QUARANTINED. Before the bounded relay is re-enabled, the
        server verifies the stored immutable envelope, checksum and warehouse event schema; no
        command can edit that envelope. expectedReviewVersion fences concurrent reviews. Retrying
        the exact same reviewer/reason command is idempotent; a different or stale review yields
        409 and does not write a second audit entry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseOutboxRecoveryRequest' }
      responses:
        '200':
          description: >-
            The immutable event was requeued for the existing bounded relay, or the exact prior
            reviewed command was replayed.
          headers:
            Idempotency-Replayed:
              required: false
              schema: { type: string, const: 'true' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseOutboxRecovery' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/warehouse/v1/warehouses/{id}/existence:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: getWarehouseExistence
      description: >-
        Requires principal_type SERVICE, client_id auth-service, and exactly
        one scope: warehouse.read. The response has no extra fields.
      responses:
        '200':
          description: Exact existence and state response for auth-service validation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalWarehouseExistence' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/warehouse/v1/warehouses/{id}/identity:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: getInternalWarehouseIdentity
      description: >-
        Generic least-privilege identity for task-board's daily driver shift.
        Requires principal_type SERVICE, matching task-board-service sub and
        client_id, and exactly warehouse.identity.read. This route is never
        exposed by the public gateway.
      responses:
        '200':
          description: Current owner-held metadata and canonical IANA timezone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalWarehouseIdentity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/warehouse/v1/warehouses/asset/{id}/existence:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: getWarehouseExistenceForAssetService
      description: >-
        Requires principal_type SERVICE, client_id asset-service, and exactly
        one scope: warehouse.read. This narrow private route is not gateway-routable.
      responses:
        '200':
          description: >-
            Exact legacy incoming-admission response for asset-service validation. active is true
            only in ACTIVE; callers that need outbound draining admission must use admission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalWarehouseExistence' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/warehouse/v1/warehouses/inventory/{id}/metadata:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: getWarehouseMetadataForInventoryService
      description: >-
        Requires principal_type SERVICE, sub and client_id both exactly
        inventory-service, and exactly one scope: warehouse.read. This narrow
        private route is not gateway-routable. DRAINING and INACTIVE warehouses are hidden.
      responses:
        '200':
          description: Exact active identity, version and canonical IANA timezone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryWarehouseMetadata' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/warehouse/v1/warehouses/logistics/{id}/identity:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: getWarehouseIdentityForLogisticsService
      description: >-
        Requires principal_type SERVICE, sub and client_id both exactly
        logistics-service, and exactly one scope: warehouse.logistics. This
        narrow private route is not gateway-routable and exposes only the owner-held
        human-readable address, never topology. The legacy active field is false for DRAINING and INACTIVE;
        directional admission must use the dedicated private boundary.
      responses:
        '200':
          description: Exact warehouse identity, owner-held address, version, active flag and canonical IANA timezone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsWarehouseIdentity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/warehouse/v1/warehouses/logistics:
    get:
      operationId: listWarehouseIdentitiesForLogisticsService
      description: >-
        Requires principal_type SERVICE, sub and client_id both exactly
        logistics-service, and exactly one scope: warehouse.logistics. This
        private route returns ACTIVE identities only, ordered by configured
        warehouse order, name and UUID, so logistics can build bounded availability
        facets and an address-bound planner directory without a cross-database query.
      responses:
        '200':
          description: Active warehouse identities available to logistics.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LogisticsWarehouseIdentity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/warehouse/v1/warehouses/logistics/{servedWarehouseId}/support-links:
    parameters:
      - name: servedWarehouseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listEligibleWarehouseSupportLinksForLogisticsService
      description: >-
        Requires principal_type SERVICE, matching logistics-service sub/client_id and exactly
        warehouse.logistics. Returns only active links whose calendar permits the supplied instant,
        evaluated in the served warehouse timezone. Inactive endpoints are excluded. Each edge
        contains both owner-held warehouse coordinate pairs so logistics never creates a second map
        identity or uses straight-line distance as a final route decision.
      parameters:
        - name: at
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Calendar-eligible active support links ordered by priority and stable identity.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LogisticsWarehouseSupportLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/warehouse/v1/warehouses/logistics/{warehouseId}/support-network:
    parameters:
      - name: warehouseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listWarehouseSupportNetworkForLogisticsService
      description: >-
        Requires principal_type SERVICE, matching logistics-service sub/client_id and exactly
        warehouse.logistics. Returns every active directed support edge where the requested active
        warehouse is either the support or served endpoint. No calendar filtering is applied; the
        planner evaluates the returned policy for each candidate date and time. Inactive endpoints
        are excluded and both owner-held identities are included.
      responses:
        '200':
          description: Active adjacent support links ordered by priority and stable identities.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LogisticsWarehouseSupportLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/warehouse/v1/warehouses/{id}/time-zone:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: getWarehouseTimeZoneAt
      description: >-
        Explicit as-of timezone lookup for asset-service, inventory-service,
        logistics-service, maintenance-service, and task-board-service. It resolves
        both historical and already scheduled decisions. Requires principal_type SERVICE,
        sub and client_id both equal to one of those owners, and exactly one scope:
        warehouse.timezone.read. The required at timestamp prevents accidental use of
        current metadata for a historical operation; inactive warehouses remain resolvable.
      parameters:
        - name: at
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Canonical IANA timezone effective at the requested operation timestamp.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseTimeZoneAt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/warehouse/v1/warehouses/{id}/operation-marks:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    post:
      operationId: markWarehouseOperation
      description: >-
        Durable, idempotent boundary proving that a warehouse has operated. Available
        only to asset-service, inventory-service, logistics-service, and maintenance-service
        when principal_type SERVICE, sub and client_id match and the sole scope is
        warehouse.operation.mark. The service infers operation source from client_id;
        the immutable operationId is the idempotency key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseOperationMarkRequest' }
      responses:
        '204': { description: Operation mark recorded, or an exact idempotent replay acknowledged. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/warehouse/v1/warehouses/{id}/admission:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: getWarehouseOperationAdmission
      description: >-
        Exact directional admission decision for asset-service, inventory-service,
        logistics-service, maintenance-service and task-board-service. Requires principal_type
        SERVICE, matching sub and client_id for one owner, and exactly warehouse.lifecycle.read.
        ACTIVE admits incoming and outgoing work, DRAINING admits only outgoing work, and
        INACTIVE admits neither. This route is not gateway-routable.
      parameters:
        - name: direction
          in: query
          required: true
          schema: { $ref: '#/components/schemas/WarehouseOperationDirection' }
      responses:
        '200':
          description: Admission decision for the requested direction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseOperationAdmission' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/warehouse/v1/warehouses/{id}/lifecycle-readiness:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    post:
      operationId: confirmWarehouseLifecycleReadiness
      description: >-
        Immutable own-resource readiness confirmation. Available only while DRAINING to
        asset-service, inventory-service, logistics-service, maintenance-service and
        task-board-service when principal_type SERVICE, sub and client_id match and the sole
        scope is warehouse.lifecycle.confirm. The server infers readinessOwner from client_id;
        a request cannot confirm readiness for another owner. This route is not gateway-routable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseLifecycleReadinessRequest' }
      responses:
        '200':
          description: Readiness confirmed or an exact no-op confirmation acknowledged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseLifecycleReadinessConfirmation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/warehouse/v1/lifecycle/readiness-work:
    get:
      operationId: listWarehouseLifecycleReadinessWork
      description: >-
        Durable, owner-scoped reconciliation backlog for lifecycle readiness. It returns only
        DRAINING warehouses for which the authenticated owner has not yet supplied its immutable
        readiness confirmation, including warehouses for which that owner has no live records.
        This is the correctness trigger after a missed Kafka hint or service restart. Available
        only to asset-service, inventory-service, logistics-service, maintenance-service and
        task-board-service when principal_type SERVICE, sub and client_id match and the sole
        scope is warehouse.lifecycle.read. This route is not gateway-routable.
      parameters:
        - name: after
          in: query
          required: false
          description: UUID keyset cursor from nextAfter; start a new reconciliation without it.
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Page of owner-specific DRAINING readiness work.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseLifecycleReadinessWorkPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    WarehouseId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    OutboxEventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Warehouse:
      type: object
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/WarehouseClassificationInvariant'
      required: [id, version, name, city, address, latitude, longitude, timeZone, active, lifecycleState, sortOrder, representative, production, mainWarehouse, representativeParentWarehouseId]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 255, description: Unique after trim, internal-whitespace collapse and Unicode-aware lowercase normalization. }
        city: { type: string, minLength: 1, maxLength: 255 }
        address: { type: [string, 'null'], maxLength: 1000 }
        latitude:
          type: [number, 'null']
          minimum: -90
          maximum: 90
          multipleOf: 0.000001
          description: >-
            Optional WGS84 latitude. Coordinates are absent together or present together; the exact
            pair 0,0 is rejected as an unset placeholder.
        longitude:
          type: [number, 'null']
          minimum: -180
          maximum: 180
          multipleOf: 0.000001
          description: >-
            Optional WGS84 longitude. Coordinates are absent together or present together; the exact
            pair 0,0 is rejected as an unset placeholder.
        timeZone:
          type: string
          minLength: 1
          maxLength: 64
          description: Canonical IANA timezone currently effective at the service timestamp.
        active:
          type: boolean
          description: >-
            Legacy compatibility projection, true only in ACTIVE. It is not a lifecycle command
            and cannot decide whether outbound draining work is admitted.
        lifecycleState: { $ref: '#/components/schemas/WarehouseLifecycleState' }
        sortOrder: { type: [integer, 'null'], minimum: 0 }
        representative:
          type: boolean
          description: True when this object has no production or primary-RWMS classification.
        production:
          type: boolean
          description: Object is exposed to the future manufacture management system.
        mainWarehouse:
          type: boolean
          description: Object is exposed as a primary RWMS warehouse.
        representativeParentWarehouseId:
          type: [string, 'null']
          format: uuid
          description: >-
            Selected parent for a representative object. It must reference an object marked as
            production or a primary RWMS warehouse.
    CreateWarehouseRequest:
      type: object
      additionalProperties: false
      required: [name, city, timeZone]
      properties:
        name: { type: string, minLength: 1, maxLength: 255, description: Unique after trim, internal-whitespace collapse and Unicode-aware lowercase normalization. }
        city: { type: string, minLength: 1, maxLength: 255 }
        address: { type: [string, 'null'], maxLength: 1000 }
        latitude:
          type: [number, 'null']
          minimum: -90
          maximum: 90
          multipleOf: 0.000001
          description: >-
            Optional WGS84 latitude; latitude and longitude must be supplied together and the exact
            pair 0,0 is rejected as an unset placeholder.
        longitude:
          type: [number, 'null']
          minimum: -180
          maximum: 180
          multipleOf: 0.000001
          description: >-
            Optional WGS84 longitude; latitude and longitude must be supplied together and the exact
            pair 0,0 is rejected as an unset placeholder.
        timeZone: { type: string, minLength: 1, maxLength: 64, description: Canonical IANA timezone identifier. }
        sortOrder: { type: [integer, 'null'], minimum: 0 }
        production:
          type: boolean
          description: True exposes the object to MMS.
        mainWarehouse:
          type: boolean
          description: True exposes the object as a primary RWMS warehouse.
        representativeParentWarehouseId:
          type: [string, 'null']
          format: uuid
          description: >-
            Required for a representative object and null for all other objects. Its parent must
            be production or a primary RWMS warehouse.
    ReplaceWarehouseRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, name, city, timeZone]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 255, description: Unique after trim, internal-whitespace collapse and Unicode-aware lowercase normalization. }
        city: { type: string, minLength: 1, maxLength: 255 }
        address: { type: [string, 'null'], maxLength: 1000 }
        latitude:
          type: [number, 'null']
          minimum: -90
          maximum: 90
          multipleOf: 0.000001
          description: >-
            Full-replacement WGS84 latitude; requires longitude and the exact pair 0,0 is rejected as
            an unset placeholder.
        longitude:
          type: [number, 'null']
          minimum: -180
          maximum: 180
          multipleOf: 0.000001
          description: >-
            Full-replacement WGS84 longitude; requires latitude and the exact pair 0,0 is rejected as
            an unset placeholder.
        timeZone:
          type: string
          minLength: 1
          maxLength: 64
          description: Immediate correction only before the first durable operation mark.
        sortOrder: { type: [integer, 'null'], minimum: 0 }
        production:
          type: boolean
          description: True exposes the object to MMS.
        mainWarehouse:
          type: boolean
          description: True exposes the object as a primary RWMS warehouse.
        representativeParentWarehouseId:
          type: [string, 'null']
          format: uuid
          description: >-
            Required for a representative object and null for all other objects. Its parent must
            be production or a primary RWMS warehouse.
    WarehouseClassificationInvariant:
      type: object
      description: >-
        A regular object has at least one independent production or primary-RWMS classification.
        A representative has neither classification and references exactly one eligible parent.
      oneOf:
        - title: Production or primary RWMS object
          required: [representative, production, mainWarehouse, representativeParentWarehouseId]
          properties:
            representative: { type: boolean, const: false }
            production: { type: boolean }
            mainWarehouse: { type: boolean }
            representativeParentWarehouseId: { type: 'null' }
          anyOf:
            - properties:
                production: { const: true }
            - properties:
                mainWarehouse: { const: true }
        - title: Representative warehouse
          required: [representative, production, mainWarehouse, representativeParentWarehouseId]
          properties:
            representative: { type: boolean, const: true }
            production: { type: boolean, const: false }
            mainWarehouse: { type: boolean, const: false }
            representativeParentWarehouseId: { type: string, format: uuid }
    WarehouseLifecycleState:
      type: string
      enum: [ACTIVE, DRAINING, INACTIVE]
    WarehouseOperationDirection:
      type: string
      enum: [INCOMING, OUTGOING]
    WarehouseLifecycleTransitionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
    WarehouseLifecycleReadinessRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
    WarehouseLifecycleReadinessConfirmation:
      type: object
      additionalProperties: false
      required: [warehouseId, warehouseVersion, lifecycleState, readinessOwner, confirmedAt]
      properties:
        warehouseId: { type: string, format: uuid }
        warehouseVersion: { type: integer, minimum: 0 }
        lifecycleState: { $ref: '#/components/schemas/WarehouseLifecycleState' }
        readinessOwner:
          type: string
          enum: [ASSET, INVENTORY, LOGISTICS, MAINTENANCE, TASK_BOARD]
        confirmedAt: { type: string, format: date-time }
    WarehouseLifecycleReadinessWork:
      type: object
      additionalProperties: false
      required: [warehouseId, warehouseVersion, lifecycleState]
      properties:
        warehouseId: { type: string, format: uuid }
        warehouseVersion: { type: integer, minimum: 0 }
        lifecycleState:
          type: string
          const: DRAINING
    WarehouseLifecycleReadinessWorkPage:
      type: object
      additionalProperties: false
      required: [items, nextAfter]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WarehouseLifecycleReadinessWork' }
        nextAfter: { type: [string, 'null'], format: uuid }
    WarehouseOperationAdmission:
      type: object
      additionalProperties: false
      required: [warehouseId, warehouseVersion, lifecycleState, direction, admitted]
      properties:
        warehouseId: { type: string, format: uuid }
        warehouseVersion: { type: integer, minimum: 0 }
        lifecycleState: { $ref: '#/components/schemas/WarehouseLifecycleState' }
        direction: { $ref: '#/components/schemas/WarehouseOperationDirection' }
        admitted: { type: boolean }
    ScheduleWarehouseTimeZoneRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, timeZone, effectiveFrom]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        timeZone: { type: string, minLength: 1, maxLength: 64, description: Canonical IANA timezone identifier. }
        effectiveFrom:
          type: string
          format: date-time
          description: Future instant at which the zone becomes operationally effective.
    WarehouseTimeZoneChange:
      type: object
      additionalProperties: false
      required: [warehouseId, warehouseVersion, timeZone, effectiveFrom]
      properties:
        warehouseId: { type: string, format: uuid }
        warehouseVersion: { type: integer, minimum: 0 }
        timeZone: { type: string, minLength: 1, maxLength: 64, description: Canonical IANA timezone identifier. }
        effectiveFrom: { type: string, format: date-time }
    WarehouseTimeZoneAt:
      type: object
      additionalProperties: false
      required: [warehouseId, timeZone, effectiveFrom]
      properties:
        warehouseId: { type: string, format: uuid }
        timeZone: { type: string, minLength: 1, maxLength: 64, description: Canonical IANA timezone identifier. }
        effectiveFrom: { type: string, format: date-time }
    WarehouseOperationMarkRequest:
      type: object
      additionalProperties: false
      required: [operationId, occurredAt]
      properties:
        operationId: { type: string, format: uuid }
        occurredAt:
          type: string
          format: date-time
          description: Actual operation instant, no later than warehouse-service database time.
    WarehouseOutboxRecoveryRequest:
      type: object
      additionalProperties: false
      required: [expectedReviewVersion, reason]
      properties:
        expectedReviewVersion: { type: integer, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    WarehouseOutboxStatus:
      type: string
      enum: [PENDING, IN_FLIGHT, PUBLISHED, DLT, QUARANTINED]
    WarehouseOutboxRecovery:
      type: object
      additionalProperties: false
      required:
        [eventId, aggregateType, aggregateId, aggregateVersion, status, attemptCount,
         reviewVersion, lastErrorCode, reviewedBySubjectId, recoveryReason, recoveredAt]
      properties:
        eventId: { type: string, format: uuid }
        aggregateType: { type: string, const: WAREHOUSE }
        aggregateId: { type: string, format: uuid }
        aggregateVersion: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/WarehouseOutboxStatus' }
        attemptCount: { type: integer, minimum: 0 }
        reviewVersion: { type: integer, minimum: 1 }
        lastErrorCode: { type: [string, 'null'], maxLength: 64 }
        reviewedBySubjectId: { type: string, format: uuid }
        recoveryReason: { type: string, minLength: 1, maxLength: 2000 }
        recoveredAt: { type: string, format: date-time }
    InternalWarehouseExistence:
      type: object
      additionalProperties: false
      required: [id, version, active]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        active: { type: boolean }
    InternalWarehouseIdentity:
      type: object
      additionalProperties: false
      required: [id, version, active, name, city, address, latitude, longitude, timeZone]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        active: { type: boolean }
        name: { type: string, minLength: 1, maxLength: 255 }
        city: { type: string, minLength: 1, maxLength: 255 }
        address: { type: [string, 'null'], minLength: 1, maxLength: 1000 }
        latitude:
          type: [number, 'null']
          minimum: -90
          maximum: 90
          multipleOf: 0.000001
          description: >-
            Optional owner-held WGS84 latitude; the exact coordinate pair 0,0 is rejected as an
            unset placeholder.
        longitude:
          type: [number, 'null']
          minimum: -180
          maximum: 180
          multipleOf: 0.000001
          description: >-
            Optional owner-held WGS84 longitude; the exact coordinate pair 0,0 is rejected as an
            unset placeholder.
        timeZone: { type: string, minLength: 1, maxLength: 64 }
    InventoryWarehouseMetadata:
      type: object
      additionalProperties: false
      required: [id, version, active, timeZone]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        active: { type: boolean, const: true }
        timeZone:
          type: string
          minLength: 1
          maxLength: 64
          description: Canonical IANA timezone identifier.
    LogisticsWarehouseIdentity:
      type: object
      additionalProperties: false
      required: [id, version, active, name, city, address, latitude, longitude, timeZone, representative]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        active: { type: boolean }
        name: { type: string, minLength: 1, maxLength: 255 }
        city: { type: string, minLength: 1, maxLength: 255 }
        address:
          type: [string, 'null']
          minLength: 1
          maxLength: 1000
        latitude:
          type: [number, 'null']
          minimum: -90
          maximum: 90
          multipleOf: 0.000001
          description: >-
            Owner-held WGS84 latitude used by logistics as the map source of truth; the exact
            coordinate pair 0,0 is rejected as an unset placeholder.
        longitude:
          type: [number, 'null']
          minimum: -180
          maximum: 180
          multipleOf: 0.000001
          description: >-
            Owner-held WGS84 longitude used by logistics as the map source of truth; the exact
            coordinate pair 0,0 is rejected as an unset placeholder.
        timeZone:
          type: string
          minLength: 1
          maxLength: 64
          description: Canonical IANA timezone identifier.
        representative:
          type: boolean
          description: Additive characteristic that does not alter lifecycle or operation admission.
    WarehouseSupportLinkInput:
      type: object
      additionalProperties: false
      required:
        [supportWarehouseId, active, priority, allowDrivers, allowVehicles, allowInventory,
         allowDirectFulfillment, allowInterwarehouseTransfer, allowContractorFallback]
      properties:
        supportWarehouseId: { type: string, format: uuid }
        active: { type: boolean }
        priority: { type: integer, minimum: 1 }
        allowDrivers: { type: boolean }
        allowVehicles: { type: boolean }
        allowInventory: { type: boolean }
        allowDirectFulfillment: { type: boolean }
        allowInterwarehouseTransfer: { type: boolean }
        allowContractorFallback: { type: boolean }
        allowedWeekdays:
          type: array
          uniqueItems: true
          default: []
          description: Empty means every recurring weekday; explicit allowed dates can add exceptions.
          items: { $ref: '#/components/schemas/Weekday' }
        allowedDates:
          type: array
          uniqueItems: true
          default: []
          items: { type: string, format: date }
        excludedDates:
          type: array
          uniqueItems: true
          default: []
          description: Exclusions override weekday and explicit-date allowances.
          items: { type: string, format: date }
        serviceStart: { type: [string, 'null'], format: time }
        serviceEnd: { type: [string, 'null'], format: time }
    ReplaceWarehouseSupportLinksRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, links]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        links:
          type: array
          items: { $ref: '#/components/schemas/WarehouseSupportLinkInput' }
    WarehouseSupportLink:
      type: object
      additionalProperties: false
      required:
        [id, version, supportWarehouseId, servedWarehouseId, active, priority, allowDrivers,
         allowVehicles, allowInventory, allowDirectFulfillment, allowInterwarehouseTransfer,
         allowContractorFallback, allowedWeekdays, allowedDates, excludedDates, serviceStart,
         serviceEnd]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        supportWarehouseId: { type: string, format: uuid }
        servedWarehouseId: { type: string, format: uuid }
        active: { type: boolean }
        priority: { type: integer, minimum: 1 }
        allowDrivers: { type: boolean }
        allowVehicles: { type: boolean }
        allowInventory: { type: boolean }
        allowDirectFulfillment: { type: boolean }
        allowInterwarehouseTransfer: { type: boolean }
        allowContractorFallback: { type: boolean }
        allowedWeekdays:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Weekday' }
        allowedDates:
          type: array
          uniqueItems: true
          items: { type: string, format: date }
        excludedDates:
          type: array
          uniqueItems: true
          items: { type: string, format: date }
        serviceStart: { type: [string, 'null'], format: time }
        serviceEnd: { type: [string, 'null'], format: time }
    WarehouseSupportLinks:
      type: object
      additionalProperties: false
      required: [servedWarehouseId, warehouseVersion, links]
      properties:
        servedWarehouseId: { type: string, format: uuid }
        warehouseVersion: { type: integer, minimum: 0 }
        links:
          type: array
          items: { $ref: '#/components/schemas/WarehouseSupportLink' }
    LogisticsWarehouseSupportLink:
      type: object
      additionalProperties: false
      required:
        [id, version, supportWarehouse, servedWarehouse, priority, allowDrivers, allowVehicles,
         allowInventory, allowDirectFulfillment, allowInterwarehouseTransfer,
         allowContractorFallback, allowedWeekdays, allowedDates, excludedDates, serviceStart,
         serviceEnd]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        supportWarehouse: { $ref: '#/components/schemas/LogisticsWarehouseIdentity' }
        servedWarehouse: { $ref: '#/components/schemas/LogisticsWarehouseIdentity' }
        priority: { type: integer, minimum: 1 }
        allowDrivers: { type: boolean }
        allowVehicles: { type: boolean }
        allowInventory: { type: boolean }
        allowDirectFulfillment: { type: boolean }
        allowInterwarehouseTransfer: { type: boolean }
        allowContractorFallback: { type: boolean }
        allowedWeekdays:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Weekday' }
        allowedDates:
          type: array
          uniqueItems: true
          items: { type: string, format: date }
        excludedDates:
          type: array
          uniqueItems: true
          items: { type: string, format: date }
        serviceStart: { type: [string, 'null'], format: time }
        serviceEnd: { type: [string, 'null'], format: time }
    Weekday:
      type: string
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
    ApiProblem:
      type: object
      additionalProperties: true
      required: [status, code]
      properties:
        status: { type: integer }
        code: { type: string }
  responses:
    BadRequest:
      description: Invalid request.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiProblem' } } }
    Unauthorized:
      description: Missing or invalid Bearer JWT.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiProblem' } } }
    Forbidden:
      description: Principal, scope, role, or internal client contract is insufficient.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiProblem' } } }
    NotFound:
      description: Warehouse not found or hidden inactive warehouse.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiProblem' } } }
    Conflict:
      description: Optimistic, uniqueness, or idempotency conflict.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiProblem' } } }
