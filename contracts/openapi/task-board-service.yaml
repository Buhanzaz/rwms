        application/json:
          schema: { $ref: '#/components/schemas/WorkQueue' }
    WorkQueueCreated:
      description: Work queue created
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkQueue' }
    WorkQueueListOk:
      description: Work queues
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkQueueList' }
    ReviewedBootstrapOk:
      description: Reviewed bootstrap import or identical replay result
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReviewedBootstrapResponse' }
    MaintenanceRoutingPreflightOk:
      description: Exact read-only maintenance routing prerequisite report
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MaintenanceRoutingPreflightResponse' }
    QueueReferenceOk:
      description: Queue usage reference
      content:
        application/json:
          schema: { $ref: '#/components/schemas/QueueReference' }
    WorkerOk:
      description: Worker
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Worker' }
    WorkerCreated:
      description: Worker created; credential provisioning may remain pending or fail asynchronously
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Worker' }
    WorkerListOk:
      description: Workers
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkerList' }
    WorkerGroupOk:
      description: Worker group
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkerGroup' }
    WorkerGroupCreated:
      description: Worker group created
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkerGroup' }
    WorkerGroupListOk:
      description: Worker groups
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkerGroupList' }
    TaskBoardSnapshotOk:
      description: Current task-board snapshot
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TaskBoardSnapshot' }
    TaskBoardSnapshotCreated:
      description: Current snapshot after task registration or idempotent replay
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TaskBoardSnapshot' }
    BoardEntryOk:
      description: Current task-board entry
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BoardEntry' }
    TimeEventListOk:
      description: Entry time-event history
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TimeEventList' }
    NoContent:
      description: Command completed without a response body
    BadRequest:
      description: Invalid command
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiProblem' }
    Unauthorized:
      description: Bearer token is missing, invalid or expired
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiProblem' }
    Forbidden:
      description: Principal, scope, type or warehouse access is insufficient
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiProblem' }
    NotFound:
      description: Requested resource does not exist in the scoped context
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiProblem' }
    Conflict:
      description: Stale version, conflicting state, or changed idempotent command
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiProblem' }
    BadGateway:
      description: Auth-service credential operation failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiProblem' }
