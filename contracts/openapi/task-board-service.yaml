    WorkerClassOk:
      description: Worker class
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkerClass' }
    WorkerClassCreated:
      description: Worker class created
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkerClass' }
    WorkerClassListOk:
      description: Worker classes
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkerClassList' }
    QueueDefinitionOk:
      description: Global queue definition
      content:
        application/json:
          schema: { $ref: '#/components/schemas/QueueDefinition' }
    QueueDefinitionCreated:
      description: Global queue definition created
      content:
        application/json:
          schema: { $ref: '#/components/schemas/QueueDefinition' }
    QueueDefinitionListOk:
      description: System-wide queue definition catalog
      content:
        application/json:
          schema: { $ref: '#/components/schemas/QueueDefinitionList' }
    WorkQueueOk:
      description: Work queue
      content:
        application/json:
