        application/json:
          schema: { $ref: '#/components/schemas/WarehouseQueueCapabilities' }
    CatalogRoutingPreflightOk:
      description: Exact read-only global catalog routing prerequisite report
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CatalogRoutingPreflightResponse' }
    MaintenanceRoutingPreflightOk:
      description: Exact read-only maintenance routing prerequisite report
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MaintenanceRoutingPreflightResponse' }
    QueueReferenceOk:
