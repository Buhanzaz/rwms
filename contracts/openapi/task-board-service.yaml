openapi: 3.1.0
info:
  title: RWMS Task Board Service API
  version: 1.0.0
  description: >-
    Canonical F2 inventory of the active task-board, workforce and queue
    registry HTTP API. All warehouse-scoped operations validate the warehouse
    claim locally. Internal queue-reference operations require a SERVICE
    principal, queue-registry.write and an allow-listed client_id. The private
    maintenance preflight requires the exact maintenance-service task-sync
    identity. The private logistics surface registers source-owned preparation
    and typed equipment-movement tasks only.
servers:
  - url: /api
security:
  - bearerJwt: []
paths:
  /warehouses/{warehouseId}/work-queues:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: listWorkQueues
      responses:
        '200': { $ref: '#/components/responses/WorkQueueListOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createWorkQueue
      requestBody:
        $ref: '#/components/requestBodies/WorkQueue'
      responses:
        '201': { $ref: '#/components/responses/WorkQueueCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/work-queues/{id}:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    put:
      operationId: updateWorkQueue
      requestBody:
        $ref: '#/components/requestBodies/WorkQueue'
      responses:
        '200': { $ref: '#/components/responses/WorkQueueOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteWorkQueue
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/work-queue-order:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    put:
      operationId: reorderWorkQueues
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueueOrderRequest' }
      responses:
        '200': { $ref: '#/components/responses/WorkQueueListOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/reviewed-bootstrap:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: bootstrapReviewedTaskBoard
      description: >-
        Requires USER, rwms.write and MANAGE. Imports the packaged, hash-validated
        old-panel queue and workforce registries for the canonical Saint Petersburg
        or Moscow warehouse. Exact rows are reused; conflicting identities or values
        fail atomically with 409. The stable idempotency identity is warehouseId plus
        the packaged sourceSha256, so exact-state replay is independent of the optional
        Idempotency-Key and does not use a key journal. Credentials, tasks, schedules
        and notifications are never created.
      responses:
        '200': { $ref: '#/components/responses/ReviewedBootstrapOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/work-queues/{queueId}/references:
    parameters:
      - $ref: '#/components/parameters/QueueId'
    post:
      operationId: registerQueueReference
      description: Requires SERVICE, queue-registry.write and an allow-listed client_id.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueueReferenceRequest' }
      responses:
        '200': { $ref: '#/components/responses/QueueReferenceOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/work-queues/references/{type}/{externalReferenceId}:
    parameters:
      - $ref: '#/components/parameters/QueueReferenceType'
      - $ref: '#/components/parameters/ExternalReferenceId'
    delete:
      operationId: deleteQueueReference
      description: Requires SERVICE, queue-registry.write and an allow-listed client_id.
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/maintenance/routing-preflight:
    post:
      operationId: preflightMaintenanceRouting
      description: >-
        Read-only private bulk check for maintenance-service. Requires a SERVICE
        token whose sub and client_id are both maintenance-service and whose scope
        list is exactly task-board.task-sync. Each requested queue must exist under
        the requested warehouse with the exact id, code and type and must be active
        and non-hidden. Missing ids and mismatched fields are returned explicitly;
        ready is false whenever either list is non-empty. The operation never
        creates, updates or reserves a queue.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceRoutingPreflightRequest' }
      responses:
        '200': { $ref: '#/components/responses/MaintenanceRoutingPreflightOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /worker-classes:
    get:
      operationId: listWorkerClasses
      responses:
        '200': { $ref: '#/components/responses/WorkerClassListOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createWorkerClass
      requestBody:
        $ref: '#/components/requestBodies/WorkerClass'
      responses:
        '201': { $ref: '#/components/responses/WorkerClassCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /worker-classes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: updateWorkerClass
      requestBody:
        $ref: '#/components/requestBodies/WorkerClass'
      responses:
        '200': { $ref: '#/components/responses/WorkerClassOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteWorkerClass
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: getTaskBoard
      parameters:
        - name: includeShadow
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/TaskBoardSnapshotOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /warehouses/{warehouseId}/task-board/queues/{queueId}/eligible-groups:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/QueueId'
    get:
      operationId: listEligibleWorkerGroups
      responses:
        '200': { $ref: '#/components/responses/WorkerGroupListOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /warehouses/{warehouseId}/task-board/entries/{entryId}/history:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/EntryId'
    get:
      operationId: getTaskEntryHistory
      responses:
        '200': { $ref: '#/components/responses/TimeEventListOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /warehouses/{warehouseId}/task-board/tasks:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    post:
      operationId: registerBoardTask
      description: >-
        Requires USER, rwms.write and EDIT. An identical externalTaskId replay
        returns the current snapshot without another event; changed immutable
        data or another warehouse returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBoardTaskRequest' }
      responses:
        '201': { $ref: '#/components/responses/TaskBoardSnapshotCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/tasks/by-external-id/{externalTaskId}:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/ExternalTaskId'
    get:
      operationId: getBoardTaskByExternalId
      responses:
        '200':
          description: Current registered task and its complete route
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardTaskRegistration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /warehouses/{warehouseId}/task-board/tasks/by-external-id/{externalTaskId}/cancel:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/ExternalTaskId'
    post:
      operationId: cancelBoardTaskByExternalId
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelTaskRequest' }
      responses:
        '200':
          description: Current cancelled task state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancelledTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/tasks:
    post:
      operationId: registerExternalBoardTask
      description: >-
        Private only. Requires a SERVICE principal whose subject equals the
        maintenance-service client_id and whose granted scope is exactly
        task-board.task-sync. externalTaskId is mandatory. Identical replay by
        the same authenticated source returns the existing registration;
        changed immutable input or another source returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterExternalTaskRequest' }
      responses:
        '201':
          description: Source-owned task registration or its identical replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardTaskRegistration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/logistics/preparation-tasks:
    post:
      operationId: registerLogisticsPreparationTask
      description: >-
        Private only. Requires exactly the logistics-service SERVICE principal
        with one task-board.logistics scope. externalTaskId is the stable
        registration identity: the identical request replays the immutable
        snapshot and changed input conflicts. Logistics cannot select a queue,
        worker, route or free-form task text; task-board creates the work in
        its own UNASSIGNED column.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterLogisticsPreparationTaskRequest' }
      responses:
        '201':
          description: Source-owned task registration or identical replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsTaskSnapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/logistics/preparation-tasks/{externalTaskId}:
    parameters:
      - $ref: '#/components/parameters/ExternalTaskId'
    get:
      operationId: getLogisticsPreparationTask
      description: Returns only the logistics-service-owned immutable task/status snapshot.
      responses:
        '200':
          description: Current source-owned logistics preparation task.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsTaskSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /internal/task-board/v1/logistics/preparation-tasks/{externalTaskId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ExternalTaskId'
    post:
      operationId: cancelLogisticsPreparationTask
      description: >-
        Cancels only the matching unfinished logistics preparation task. The
        cancellation reason is a task-board-owned safe code, not caller text.
        An identical retry returns the current CANCELLED snapshot without a
        second cancellation event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelLogisticsPreparationTaskRequest' }
      responses:
        '200':
          description: Current source-owned logistics task snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsTaskSnapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/logistics/equipment-movement-tasks:
    post:
      operationId: registerLogisticsEquipmentMovementTask
      description: >-
        Private only. Requires exactly the logistics-service SERVICE principal
        with one task-board.logistics scope. The immutable typed operations and
        mandatory deadlineAt form the registration identity. Logistics cannot
        set a queue, worker, route, title, description or free-form task text;
        task-board generates the board task in its own UNASSIGNED column. Only
        this task family rejects worker completion at or after deadlineAt.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterLogisticsEquipmentMovementTaskRequest' }
      responses:
        '201':
          description: Source-owned equipment movement task or identical replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsTaskSnapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/logistics/equipment-movement-tasks/{externalTaskId}:
    parameters:
      - $ref: '#/components/parameters/ExternalTaskId'
    get:
      operationId: getLogisticsEquipmentMovementTask
      description: Returns only the matching logistics-owned equipment movement task snapshot.
      responses:
        '200':
          description: Current source-owned equipment movement task.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsTaskSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /internal/task-board/v1/logistics/equipment-movement-tasks/{externalTaskId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ExternalTaskId'
    post:
      operationId: cancelLogisticsEquipmentMovementTask
      description: >-
        Cancels only the matching unfinished logistics equipment-movement task.
        The cancellation reason is task-board-owned, not caller text. An
        identical retry returns the current CANCELLED snapshot without another
        cancellation event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelLogisticsEquipmentMovementTaskRequest' }
      responses:
        '200':
          description: Current source-owned equipment movement task snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsTaskSnapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/tasks/{externalTaskId}:
    parameters:
      - $ref: '#/components/parameters/ExternalTaskId'
    get:
      operationId: getExternalBoardTask
      description: Returns a registration only when it belongs to the authenticated source client.
      responses:
        '200':
          description: Current source-owned task registration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardTaskRegistration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateExternalBoardTaskBeforeStart
      description: >-
        Replaces metadata and the complete route using task-version CAS. The
        command is rejected after any route entry or assignment has started
        and is available only to the authenticated registration source. After
        an ambiguous timeout the caller reconciles with GET; retrying the old
        expectedTaskVersion returns 409 and never applies a second replacement.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreStartUpdateTaskRequest' }
      responses:
        '200':
          description: Updated source-owned task registration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardTaskRegistration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/tasks/{externalTaskId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ExternalTaskId'
    post:
      operationId: cancelExternalBoardTask
      description: >-
        Cancels only a not-completed task owned by the authenticated source
        client. An identical retry after a lost response returns the current
        CANCELLED snapshot without another event; GET is the reconciliation
        fallback for any ambiguous outcome.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelTaskRequest' }
      responses:
        '200':
          description: Current cancelled task state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancelledTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/entries/{entryId}/take:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: takeTaskEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TakeEntryRequest' }
      responses:
        '200': { $ref: '#/components/responses/BoardEntryOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/entries/{entryId}/pause:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: pauseTaskEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PauseEntryRequest' }
      responses:
        '200': { $ref: '#/components/responses/BoardEntryOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/entries/{entryId}/resume:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: resumeTaskEntry
      requestBody:
        $ref: '#/components/requestBodies/VersionCommand'
      responses:
        '200': { $ref: '#/components/responses/BoardEntryOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/entries/{entryId}/complete:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: completeTaskEntry
      requestBody:
        $ref: '#/components/requestBodies/VersionCommand'
      responses:
        '200': { $ref: '#/components/responses/BoardEntryOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/entries/{entryId}/move:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: moveTaskEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveEntryRequest' }
      responses:
        '200': { $ref: '#/components/responses/TaskBoardSnapshotOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/workers:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: listWorkers
      responses:
        '200': { $ref: '#/components/responses/WorkerListOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createWorker
      requestBody:
        $ref: '#/components/requestBodies/Worker'
      responses:
        '201': { $ref: '#/components/responses/WorkerCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/workers/{id}:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    put:
      operationId: updateWorker
      requestBody:
        $ref: '#/components/requestBodies/Worker'
      responses:
        '200': { $ref: '#/components/responses/WorkerOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
    delete:
      operationId: deleteWorker
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /warehouses/{warehouseId}/workers/{id}/credentials/reset:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    post:
      operationId: resetWorkerCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialPasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/WorkerOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /warehouses/{warehouseId}/workers/{id}/credentials/disable:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    post:
      operationId: disableWorkerCredentials
      requestBody:
        $ref: '#/components/requestBodies/VersionCommand'
      responses:
        '200': { $ref: '#/components/responses/WorkerOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /warehouses/{warehouseId}/workers/{id}/credentials/reconcile-disable:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    post:
      operationId: reconcileWorkerCredentialDisable
      description: >-
        Reconcile an expired or failed credential operation against auth-service state;
        configure/reset may converge to ACTIVE, while disable/clear/legacy states are
        forced to NOT_CONFIGURED.
      requestBody:
        $ref: '#/components/requestBodies/VersionCommand'
      responses:
        '200': { $ref: '#/components/responses/WorkerOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /warehouses/{warehouseId}/workers/{id}/deletion/reconcile:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    post:
      operationId: reconcileWorkerDeletion
      requestBody:
        $ref: '#/components/requestBodies/VersionCommand'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /warehouses/{warehouseId}/worker-groups:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: listWorkerGroups
      responses:
        '200': { $ref: '#/components/responses/WorkerGroupListOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createWorkerGroup
      requestBody:
        $ref: '#/components/requestBodies/WorkerGroup'
      responses:
        '201': { $ref: '#/components/responses/WorkerGroupCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/worker-groups/{id}:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    put:
      operationId: updateWorkerGroup
      requestBody:
        $ref: '#/components/requestBodies/WorkerGroup'
      responses:
        '200': { $ref: '#/components/responses/WorkerGroupOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteWorkerGroup
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    WarehouseId:
      name: warehouseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    QueueId:
      name: queueId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EntryId:
      name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExternalTaskId:
      name: externalTaskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    QueueReferenceType:
      name: type
      in: path
      required: true
      schema: { type: string, enum: [REPAIR_PLAN, CATALOG_POSITION] }
    ExternalReferenceId:
      name: externalReferenceId
      in: path
      required: true
      schema: { type: string }
    ExpectedVersion:
      name: expectedVersion
      in: query
      required: true
      schema: { type: integer, format: int64, minimum: 0 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional request trace identity. Reviewed bootstrap idempotency is instead
        bound to warehouseId and the packaged sourceSha256 and therefore spans
        retries that use different keys.
      schema: { type: string, minLength: 1, maxLength: 128 }
  requestBodies:
    WorkQueue:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkQueueRequest' }
    WorkerClass:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkerClassRequest' }
    Worker:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkerRequest' }
    WorkerGroup:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkerGroupRequest' }
    VersionCommand:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/VersionCommand' }
  schemas:
    WorkerClass:
      type: object
      required: [id, version, code, name, description, comment, sortOrder, active]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        description: { oneOf: [{ type: string }, { type: 'null' }] }
        comment: { oneOf: [{ type: string }, { type: 'null' }] }
        sortOrder: { type: integer }
        active: { type: boolean }
      additionalProperties: false
    WorkerClassList:
      type: array
      items: { $ref: '#/components/schemas/WorkerClass' }
    QueueBinding:
      type: object
      required: [id, version, workerClass, stopTaskOnTake]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        workerClass: { $ref: '#/components/schemas/WorkerClass' }
        stopTaskOnTake: { type: boolean }
      additionalProperties: false
    WorkQueue:
      type: object
      required: [id, version, warehouseId, code, name, description, type, sortOrder, active, hidden, collapsed, holdingPeriodMinutes, notificationThreshold, notifyWhenThresholdReached, bindings]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        warehouseId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { oneOf: [{ type: string }, { type: 'null' }] }
        type: { type: string, enum: [MOVEMENT, REPAIR, HOLDING] }
        sortOrder: { type: integer }
        active: { type: boolean }
        hidden: { type: boolean }
        collapsed: { type: boolean }
        holdingPeriodMinutes: { oneOf: [{ type: integer }, { type: 'null' }] }
        notificationThreshold: { oneOf: [{ type: integer }, { type: 'null' }] }
        notifyWhenThresholdReached: { type: boolean }
        bindings:
          type: array
          items: { $ref: '#/components/schemas/QueueBinding' }
      additionalProperties: false
    WorkQueueList:
      type: array
      items: { $ref: '#/components/schemas/WorkQueue' }
    QueueReference:
      type: object
      required: [id, version, queueId, type, externalReferenceId]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        queueId: { type: string, format: uuid }
        type: { type: string, enum: [REPAIR_PLAN, CATALOG_POSITION] }
        externalReferenceId: { type: string }
      additionalProperties: false
    Qualification:
      type: object
      required: [id, version, workerClass, active, comment]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        workerClass: { $ref: '#/components/schemas/WorkerClass' }
        active: { type: boolean }
        comment: { oneOf: [{ type: string }, { type: 'null' }] }
      additionalProperties: false
    Worker:
      type: object
      required: [id, version, warehouseId, displayName, firstName, lastName, middleName, active, comment, appLogin, credentialStatus, credentialError, qualifications]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        warehouseId: { type: string, format: uuid }
        displayName: { type: string }
        firstName: { oneOf: [{ type: string }, { type: 'null' }] }
        lastName: { oneOf: [{ type: string }, { type: 'null' }] }
        middleName: { oneOf: [{ type: string }, { type: 'null' }] }
        active: { type: boolean }
        comment: { oneOf: [{ type: string }, { type: 'null' }] }
        appLogin: { oneOf: [{ type: string }, { type: 'null' }] }
        credentialStatus: { type: string, enum: [NOT_CONFIGURED, PENDING, ACTIVE, ERROR] }
        credentialError: { oneOf: [{ type: string }, { type: 'null' }] }
        qualifications:
          type: array
          items: { $ref: '#/components/schemas/Qualification' }
      additionalProperties: false
    WorkerList:
      type: array
      items: { $ref: '#/components/schemas/Worker' }
    GroupMember:
      type: object
      required: [id, version, workerId, workerName, roleInGroup, active]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        workerId: { type: string, format: uuid }
        workerName: { type: string }
        roleInGroup: { oneOf: [{ type: string }, { type: 'null' }] }
        active: { type: boolean }
      additionalProperties: false
    WorkerGroup:
      type: object
      required: [id, version, warehouseId, workerClass, name, description, active, members]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        warehouseId: { type: string, format: uuid }
        workerClass: { $ref: '#/components/schemas/WorkerClass' }
        name: { type: string }
        description: { oneOf: [{ type: string }, { type: 'null' }] }
        active: { type: boolean }
        members:
          type: array
          items: { $ref: '#/components/schemas/GroupMember' }
      additionalProperties: false
    WorkerGroupList:
      type: array
      items: { $ref: '#/components/schemas/WorkerGroup' }
    ReviewedBootstrapCounts:
      type: object
      required: [workerClasses, workQueues, queueBindings, workers, qualifications, workerGroups, memberships]
      properties:
        workerClasses: { type: integer, minimum: 0 }
        workQueues: { type: integer, minimum: 0 }
        queueBindings: { type: integer, minimum: 0 }
        workers: { type: integer, minimum: 0 }
        qualifications: { type: integer, minimum: 0 }
        workerGroups: { type: integer, minimum: 0 }
        memberships: { type: integer, minimum: 0 }
      additionalProperties: false
    ReviewedBootstrapResponse:
      type: object
      required: [warehouseId, sourceSha256, created, reused, conflicts, counts]
      properties:
        warehouseId: { type: string, format: uuid }
        sourceSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        created: { type: integer, minimum: 0 }
        reused: { type: integer, minimum: 0 }
        conflicts: { type: integer, minimum: 0 }
        counts: { $ref: '#/components/schemas/ReviewedBootstrapCounts' }
      additionalProperties: false
    MaintenanceRoutingQueueRequirement:
      type: object
      required: [queueId, code, type]
      properties:
        queueId: { type: string, format: uuid }
        code: { type: string, minLength: 1, maxLength: 64 }
        type: { type: string, enum: [MOVEMENT, REPAIR, HOLDING] }
      additionalProperties: false
    MaintenanceRoutingPreflightRequest:
      type: object
      required: [warehouseId, queues]
      properties:
        warehouseId: { type: string, format: uuid }
        queues:
          type: array
          minItems: 1
          maxItems: 100
          description: Queue identifiers must be unique within the request.
          items: { $ref: '#/components/schemas/MaintenanceRoutingQueueRequirement' }
      additionalProperties: false
    MaintenanceRoutingMismatchField:
      type: string
      enum: [WAREHOUSE_ID, CODE, TYPE, ACTIVE, HIDDEN]
    MaintenanceRoutingMismatch:
      type: object
      required: [queueId, fields]
      properties:
        queueId: { type: string, format: uuid }
        fields:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/MaintenanceRoutingMismatchField' }
      additionalProperties: false
    MaintenanceRoutingPreflightResponse:
      type: object
      required: [warehouseId, ready, missingQueueIds, mismatches]
      properties:
        warehouseId: { type: string, format: uuid }
        ready: { type: boolean }
        missingQueueIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        mismatches:
          type: array
          items: { $ref: '#/components/schemas/MaintenanceRoutingMismatch' }
      additionalProperties: false
    Assignment:
      type: object
      required: [id, version, workerId, workerName, workerGroupId, workerGroupName, status, assignedAt, startedAt, pausedAt, finishedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        workerId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        workerName: { oneOf: [{ type: string }, { type: 'null' }] }
        workerGroupId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        workerGroupName: { oneOf: [{ type: string }, { type: 'null' }] }
        status: { type: string, enum: [ACTIVE, PAUSED, DONE, CANCELLED] }
        assignedAt: { type: string, format: date-time }
        startedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        pausedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        finishedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
      additionalProperties: false
    BoardEntry:
      type: object
      required: [id, version, taskId, externalTaskId, taskVersion, title, unitNumber, taskStatus, queueId, queueCode, routeIndex, queuePosition, entryType, status, taskText, plannedDurationMinutes, activeStartedAt, pausedAt, activeWorkSeconds, assignments]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        taskId: { type: string, format: uuid }
        externalTaskId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        taskVersion: { type: integer, format: int64 }
        title: { type: string }
        unitNumber: { oneOf: [{ type: string }, { type: 'null' }] }
        taskStatus: { type: string, enum: [ACTIVE, DONE, CANCELLED] }
        queueId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        queueCode: { type: string }
        routeIndex: { type: integer }
        queuePosition: { type: integer }
        entryType: { type: string, enum: [REAL, SHADOW] }
        status: { type: string, enum: [WAITING, IN_PROGRESS, PAUSED, DONE, CANCELLED] }
        taskText: { oneOf: [{ type: string }, { type: 'null' }] }
        plannedDurationMinutes: { oneOf: [{ type: integer }, { type: 'null' }] }
        activeStartedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        pausedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        activeWorkSeconds: { type: integer, format: int64, minimum: 0 }
        assignments:
          type: array
          items: { $ref: '#/components/schemas/Assignment' }
      additionalProperties: false
    BoardColumn:
      type: object
      required: [queueId, queueCode, queueName, queueType, sortOrder, virtual, entries]
      properties:
        queueId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        queueCode: { type: string }
        queueName: { type: string }
        queueType: { oneOf: [{ type: string, enum: [MOVEMENT, REPAIR, HOLDING] }, { type: 'null' }] }
        sortOrder: { type: integer }
        virtual: { type: boolean }
        entries:
          type: array
          items: { $ref: '#/components/schemas/BoardEntry' }
      additionalProperties: false
    TaskBoardSnapshot:
      type: object
      required: [warehouseId, columns]
      properties:
        warehouseId: { type: string, format: uuid }
        columns:
          type: array
          items: { $ref: '#/components/schemas/BoardColumn' }
      additionalProperties: false
    TimeEvent:
      type: object
      required: [id, version, entryId, workerId, workerName, workerGroupName, eventType, reason, createdAt, relatedEntryId]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        entryId: { type: string, format: uuid }
        workerId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        workerName: { oneOf: [{ type: string }, { type: 'null' }] }
        workerGroupName: { oneOf: [{ type: string }, { type: 'null' }] }
        eventType: { type: string, enum: [STARTED, PAUSED, RESUMED, FINISHED, CANCELLED, AUTO_INTERRUPTED, AUTO_RESUMED] }
        reason: { oneOf: [{ type: string }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
        relatedEntryId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
      additionalProperties: false
    TimeEventList:
      type: array
      items: { $ref: '#/components/schemas/TimeEvent' }
    WorkerClassRequest:
      type: object
      required: [version, code, name]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { oneOf: [{ type: string, maxLength: 1000 }, { type: 'null' }] }
        comment: { oneOf: [{ type: string, maxLength: 1000 }, { type: 'null' }] }
        sortOrder: { type: integer }
        active: { type: boolean }
      additionalProperties: false
    QueueBindingRequest:
      type: object
      required: [workerClassId]
      properties:
        workerClassId: { type: string, format: uuid }
        stopTaskOnTake: { type: boolean }
      additionalProperties: false
    WorkQueueRequest:
      type: object
      required: [version, code, name, type]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { oneOf: [{ type: string, maxLength: 1000 }, { type: 'null' }] }
        type: { type: string, enum: [MOVEMENT, REPAIR, HOLDING] }
        active: { type: boolean }
        hidden: { type: boolean }
        collapsed: { type: boolean }
        holdingPeriodMinutes: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        notificationThreshold: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        notifyWhenThresholdReached: { type: boolean }
        bindings:
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/QueueBindingRequest' }
            - type: 'null'
      additionalProperties: false
    QueueOrderRequest:
      type: object
      required: [queues]
      properties:
        queues:
          type: array
          minItems: 1
          items:
            type: object
            required: [queueId, expectedVersion]
            properties:
              queueId: { type: string, format: uuid }
              expectedVersion: { type: integer, format: int64, minimum: 0 }
            additionalProperties: false
      additionalProperties: false
    QueueReferenceRequest:
      type: object
      required: [type, externalReferenceId]
      properties:
        type: { type: string, enum: [REPAIR_PLAN, CATALOG_POSITION] }
        externalReferenceId: { type: string, minLength: 1, maxLength: 128 }
      additionalProperties: false
    QualificationRequest:
      type: object
      required: [workerClassId]
      properties:
        workerClassId: { type: string, format: uuid }
        active: { type: boolean }
        comment: { oneOf: [{ type: string, maxLength: 1000 }, { type: 'null' }] }
      additionalProperties: false
    WorkerRequest:
      type: object
      required: [version, displayName]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        displayName: { type: string, minLength: 1, maxLength: 256 }
        firstName: { oneOf: [{ type: string, maxLength: 128 }, { type: 'null' }] }
        lastName: { oneOf: [{ type: string, maxLength: 128 }, { type: 'null' }] }
        middleName: { oneOf: [{ type: string, maxLength: 128 }, { type: 'null' }] }
        active: { type: boolean }
        comment: { oneOf: [{ type: string, maxLength: 1000 }, { type: 'null' }] }
        appLogin: { oneOf: [{ type: string, maxLength: 128 }, { type: 'null' }] }
        password: { oneOf: [{ type: string, minLength: 8, maxLength: 256, writeOnly: true }, { type: 'null' }] }
        qualifications:
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/QualificationRequest' }
            - type: 'null'
      additionalProperties: false
    CredentialPasswordRequest:
      type: object
      required: [expectedVersion, password]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        password: { type: string, minLength: 8, maxLength: 256, writeOnly: true }
      additionalProperties: false
    GroupMemberRequest:
      type: object
      required: [workerId]
      properties:
        workerId: { type: string, format: uuid }
        roleInGroup: { oneOf: [{ type: string, maxLength: 128 }, { type: 'null' }] }
        active: { type: boolean }
      additionalProperties: false
    WorkerGroupRequest:
      type: object
      required: [version, workerClassId, name]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        workerClassId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { oneOf: [{ type: string, maxLength: 1000 }, { type: 'null' }] }
        active: { type: boolean }
        members:
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/GroupMemberRequest' }
            - type: 'null'
      additionalProperties: false
    RouteStepRequest:
      type: object
      properties:
        queueId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        queueCode: { oneOf: [{ type: string, maxLength: 64 }, { type: 'null' }] }
        taskText: { oneOf: [{ type: string, maxLength: 2000 }, { type: 'null' }] }
        plannedDurationMinutes: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
      additionalProperties: false
    CreateBoardTaskRequest:
      type: object
      required: [title, route]
      properties:
        externalTaskId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        title: { type: string, minLength: 1, maxLength: 256 }
        unitNumber: { oneOf: [{ type: string, maxLength: 64 }, { type: 'null' }] }
        description: { oneOf: [{ type: string, maxLength: 2000 }, { type: 'null' }] }
        plannedDurationMinutes: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        deadlineAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        route:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RouteStepRequest' }
      additionalProperties: false
    RegisterExternalTaskRequest:
      type: object
      required: [warehouseId, externalTaskId, title, route]
      properties:
        warehouseId: { type: string, format: uuid }
        externalTaskId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 256 }
        unitNumber: { oneOf: [{ type: string, maxLength: 64 }, { type: 'null' }] }
        description: { oneOf: [{ type: string, maxLength: 2000 }, { type: 'null' }] }
        plannedDurationMinutes: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        deadlineAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        route:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RouteStepRequest' }
      additionalProperties: false
    RegisterLogisticsPreparationTaskRequest:
      type: object
      required: [warehouseId, externalTaskId]
      properties:
        warehouseId: { type: string, format: uuid }
        externalTaskId: { type: string, format: uuid }
        plannedDurationMinutes: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        deadlineAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
      additionalProperties: false
    CancelLogisticsPreparationTaskRequest:
      type: object
      required: [expectedTaskVersion]
      properties:
        expectedTaskVersion: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    EquipmentMovementDirection:
      type: string
      enum: [BRING_TO_CABIN, TAKE_FROM_CABIN]
    EquipmentMovementOperation:
      type: object
      required: [direction, equipmentCode, equipmentName, quantity]
      properties:
        direction: { $ref: '#/components/schemas/EquipmentMovementDirection' }
        equipmentCode:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Z0-9][A-Z0-9_-]{0,63}$'
        equipmentName: { type: string, minLength: 1, maxLength: 255 }
        quantity: { type: integer, format: int64, minimum: 1 }
      additionalProperties: false
    RegisterLogisticsEquipmentMovementTaskRequest:
      type: object
      required: [warehouseId, externalTaskId, deadlineAt, operations]
      properties:
        warehouseId: { type: string, format: uuid }
        externalTaskId: { type: string, format: uuid }
        unitNumber: { oneOf: [{ type: string, maxLength: 64 }, { type: 'null' }] }
        plannedDurationMinutes: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        deadlineAt: { type: string, format: date-time }
        operations:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/EquipmentMovementOperation' }
      additionalProperties: false
    CancelLogisticsEquipmentMovementTaskRequest:
      type: object
      required: [expectedTaskVersion]
      properties:
        expectedTaskVersion: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    LogisticsTaskSnapshot:
      type: object
      required: [taskId, taskVersion, warehouseId, externalTaskId, status, doneAt]
      properties:
        taskId: { type: string, format: uuid }
        taskVersion: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        externalTaskId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, DONE, CANCELLED] }
        doneAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
      additionalProperties: false
    PreStartUpdateTaskRequest:
      type: object
      required: [expectedTaskVersion, title, route]
      properties:
        expectedTaskVersion: { type: integer, format: int64, minimum: 0 }
        title: { type: string, minLength: 1, maxLength: 256 }
        unitNumber: { oneOf: [{ type: string, maxLength: 64 }, { type: 'null' }] }
        description: { oneOf: [{ type: string, maxLength: 2000 }, { type: 'null' }] }
        plannedDurationMinutes: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        deadlineAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        route:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RouteStepRequest' }
      additionalProperties: false
    TakeEntryRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        workerGroupId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        workerId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
      additionalProperties: false
    VersionCommand:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    PauseEntryRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        reason: { oneOf: [{ type: string, maxLength: 1000 }, { type: 'null' }] }
      additionalProperties: false
    MoveEntryRequest:
      type: object
      required: [expectedVersion, targetIndex]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        targetQueueId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        targetIndex: { type: integer, minimum: 0 }
      additionalProperties: false
    CancelTaskRequest:
      type: object
      required: [expectedTaskVersion, reason]
      properties:
        expectedTaskVersion: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
      additionalProperties: false
    CancelledTask:
      type: object
      required: [taskId, externalTaskId, taskVersion, status, cancelledAt]
      properties:
        taskId: { type: string, format: uuid }
        externalTaskId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        taskVersion: { type: integer, format: int64, minimum: 0 }
        status: { type: string, const: CANCELLED }
        cancelledAt: { type: string, format: date-time }
      additionalProperties: false
    BoardTaskRegistration:
      type: object
      required: [taskId, taskVersion, warehouseId, externalTaskId, title, unitNumber, description, status, plannedDurationMinutes, deadlineAt, doneAt, route]
      properties:
        taskId: { type: string, format: uuid }
        taskVersion: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        externalTaskId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        title: { type: string }
        unitNumber: { oneOf: [{ type: string }, { type: 'null' }] }
        description: { oneOf: [{ type: string }, { type: 'null' }] }
        status: { type: string, enum: [ACTIVE, DONE, CANCELLED] }
        plannedDurationMinutes: { oneOf: [{ type: integer }, { type: 'null' }] }
        deadlineAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        doneAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        route:
          type: array
          items: { $ref: '#/components/schemas/RegisteredRouteStep' }
      additionalProperties: false
    RegisteredRouteStep:
      type: object
      required: [entryId, entryVersion, queueId, queueCode, routeIndex, queuePosition, entryType, status, taskText, plannedDurationMinutes]
      properties:
        entryId: { type: string, format: uuid }
        entryVersion: { type: integer, format: int64, minimum: 0 }
        queueId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        queueCode: { oneOf: [{ type: string }, { type: 'null' }] }
        routeIndex: { type: integer, minimum: 0 }
        queuePosition: { type: integer, minimum: 0 }
        entryType: { type: string, enum: [REAL, SHADOW] }
        status: { type: string, enum: [WAITING, IN_PROGRESS, PAUSED, DONE, CANCELLED] }
        taskText: { oneOf: [{ type: string }, { type: 'null' }] }
        plannedDurationMinutes: { oneOf: [{ type: integer }, { type: 'null' }] }
      additionalProperties: false
    FieldViolation:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
      additionalProperties: false
    CorrelationContext:
      type: object
      required: [correlationId, causationId]
      properties:
        correlationId: { type: string, format: uuid }
        causationId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
      additionalProperties: false
    ApiProblem:
      type: object
      required: [type, title, status, detail, instance, code, violations, correlation]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string, minLength: 1 }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { oneOf: [{ type: string }, { type: 'null' }] }
        instance: { oneOf: [{ type: string, format: uri-reference }, { type: 'null' }] }
        code: { type: string, minLength: 1 }
        violations:
          type: array
          items: { $ref: '#/components/schemas/FieldViolation' }
        correlation: { $ref: '#/components/schemas/CorrelationContext' }
      additionalProperties: false
  responses:
    WorkerClassOk:
      description: Worker class
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkerClass' }
    WorkerClassCreated:
      description: Worker class created
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkerClass' }
    WorkerClassListOk:
      description: Worker classes
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkerClassList' }
    WorkQueueOk:
      description: Work queue
