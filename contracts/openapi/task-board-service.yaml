    QueueReferenceRequest:
      type: object
      required: [type, externalReferenceId]
      properties:
        type: { type: string, enum: [REPAIR_PLAN, CATALOG_POSITION] }
        externalReferenceId: { type: string, minLength: 1, maxLength: 128 }
      additionalProperties: false
    QualificationRequest:
      type: object
      required: [workerClassId]
      properties:
        workerClassId: { type: string, format: uuid }
        active: { type: boolean }
        comment: { oneOf: [{ type: string, maxLength: 1000 }, { type: 'null' }] }
      additionalProperties: false
    WorkerRequest:
      type: object
      required: [version, displayName]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        displayName: { type: string, minLength: 1, maxLength: 256 }
        firstName: { oneOf: [{ type: string, maxLength: 128 }, { type: 'null' }] }
        lastName: { oneOf: [{ type: string, maxLength: 128 }, { type: 'null' }] }
        middleName: { oneOf: [{ type: string, maxLength: 128 }, { type: 'null' }] }
        active: { type: boolean }
        comment: { oneOf: [{ type: string, maxLength: 1000 }, { type: 'null' }] }
        appLogin: { oneOf: [{ type: string, maxLength: 128 }, { type: 'null' }] }
        password: { oneOf: [{ type: string, minLength: 8, maxLength: 256, writeOnly: true }, { type: 'null' }] }
        qualifications:
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/QualificationRequest' }
            - type: 'null'
      additionalProperties: false
    SetCurrentGroupRequest:
      type: object
      required: [expectedVersion, workerGroupId]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        workerGroupId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
      additionalProperties: false
    CredentialPasswordRequest:
      type: object
      required: [expectedVersion, password]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        password: { type: string, minLength: 8, maxLength: 256, writeOnly: true }
      additionalProperties: false
    GroupMemberRequest:
      type: object
      required: [workerId]
      properties:
        workerId: { type: string, format: uuid }
        active: { type: boolean }
      additionalProperties: false
    CurrentGroupChangeRequest:
      type: object
      required: [workerId, expectedVersion, current]
      properties:
        workerId: { type: string, format: uuid }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        current:
          type: boolean
          description: True assigns this group; false clears this group when it is still current.
      additionalProperties: false
    WorkerGroupRequest:
      type: object
      required: [version, workerClassId, name]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        workerClassId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { oneOf: [{ type: string, maxLength: 1000 }, { type: 'null' }] }
        active: { type: boolean }
        members:
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/GroupMemberRequest' }
            - type: 'null'
        currentGroupChanges:
          description: >-
            Optional version-fenced worker changes committed atomically with the
            membership replacement. Assignments with current=true must also be
            active members in this request. Omission preserves existing current
            groups for backward-compatible callers.
          oneOf:
            - type: array
              maxItems: 1000
              items: { $ref: '#/components/schemas/CurrentGroupChangeRequest' }
            - type: 'null'
      additionalProperties: false
    GroupAvailabilityRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        reason: { oneOf: [{ type: string, maxLength: 1000 }, { type: 'null' }] }
      additionalProperties: false
    RouteStepRequest:
      type: object
      required: [queueDefinitionId]
      properties:
        queueDefinitionId:
          type: string
          format: uuid
          description: >-
            Stable global definition. The service resolves the selected
            warehouse's binding and never routes by a display name.
        taskText: { oneOf: [{ type: string, maxLength: 2000 }, { type: 'null' }] }
        plannedDurationMinutes: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        works:
          description: Sanitized immutable work snapshot shown to workers; prices are forbidden.
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/TaskWorkSnapshotRequest' }
        materials:
          description: Sanitized immutable material snapshot shown to workers.
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/TaskMaterialSnapshotRequest' }
        comments:
          description: Sanitized immutable worker-visible comments.
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/TaskCommentSnapshotRequest' }
        sourceMedia:
          description: >-
            Ordered immutable source media identities; object storage coordinates are forbidden.
            When the owning source defines a cover image, that reference is first and the remaining
            references retain source order.
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/TaskSourceMediaSnapshotRequest' }
        audienceSelectors:
          description: >-
            Explicit union of worker-class and worker-group audiences. Null
            uses the queue bindings as AVAILABLE class defaults; an explicit
            empty list is rejected.
          oneOf:
            - type: array
              minItems: 1
              uniqueItems: true
              items: { $ref: '#/components/schemas/AudienceSelector' }
            - type: 'null'
      additionalProperties: false
    TaskWorkSnapshotRequest:
      type: object
      required: [id, name, quantity, unit, durationMinutes, comment, sourceMediaIds]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 1000 }
        quantity: { type: number, minimum: 0 }
        unit: { oneOf: [{ type: string, maxLength: 32 }, { type: 'null' }] }
        durationMinutes: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        comment: { oneOf: [{ type: string, maxLength: 2000 }, { type: 'null' }] }
        sourceMediaIds:
          description: Source media from the enclosing route step that belong to this work only.
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
      additionalProperties: false
    TaskMaterialSnapshotRequest:
      type: object
      required: [id, name, quantity, unit]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 1000 }
        quantity: { type: number, minimum: 0 }
        unit: { oneOf: [{ type: string, maxLength: 32 }, { type: 'null' }] }
      additionalProperties: false
    TaskCommentSnapshotRequest:
      type: object
      required: [id, text, authorDisplayName, createdAt]
      properties:
        id: { type: string, format: uuid }
        text: { type: string, minLength: 1, maxLength: 2000 }
        authorDisplayName: { oneOf: [{ type: string, maxLength: 256 }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
      additionalProperties: false
    TaskSourceMediaSnapshotRequest:
      type: object
      required: [mediaId, generation, contentType, capturedAt, recordedAt]
      properties:
        mediaId: { type: string, format: uuid }
        generation: { type: integer, format: int64, minimum: 1 }
        contentType: { oneOf: [{ type: string, maxLength: 128 }, { type: 'null' }] }
        capturedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        recordedAt: { type: string, format: date-time }
      additionalProperties: false
    CreateBoardTaskRequest:
      type: object
      required: [title, route]
      properties:
        externalTaskId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        title: { type: string, minLength: 1, maxLength: 256 }
        unitNumber: { oneOf: [{ type: string, maxLength: 64 }, { type: 'null' }] }
        description: { oneOf: [{ type: string, maxLength: 2000 }, { type: 'null' }] }
        plannedDurationMinutes: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        deadlineAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        scheduledDate: { oneOf: [{ type: string, format: date }, { type: 'null' }] }
        priority: { oneOf: [{ type: integer, minimum: 1, maximum: 5 }, { type: 'null' }] }
        route:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RouteStepRequest' }
      additionalProperties: false
    RegisterExternalTaskRequest:
      type: object
      required: [warehouseId, externalTaskId, title, route]
      properties:
        warehouseId: { type: string, format: uuid }
        externalTaskId: { type: string, format: uuid }
        source:
          description: >-
            Immutable source aggregate for a maintenance repair or a dedicated
            logistics driver intent. The authenticated source client must own
            the declared source type.
          oneOf: [{ $ref: '#/components/schemas/TaskSourceReference' }, { type: 'null' }]
        title: { type: string, minLength: 1, maxLength: 256 }
        unitNumber: { oneOf: [{ type: string, maxLength: 64 }, { type: 'null' }] }
