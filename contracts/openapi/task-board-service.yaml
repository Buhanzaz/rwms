  /internal/task-board/v1/logistics/operational-assignments/{assignmentId}/transition:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: transitionInternalWorkerOperationalAssignment
      description: >-
        Applies PLANNED -> IN_TRANSIT -> ACTIVE -> COMPLETED, or cancels a
        PLANNED assignment. Replaying the current target is safe even with the
        original expectedVersion; every other transition is version-fenced.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionWorkerOperationalAssignmentRequest' }
