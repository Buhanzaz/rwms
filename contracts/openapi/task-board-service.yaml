openapi: 3.1.0
info:
  title: RWMS Task Board Service API
  version: 1.8.0
  description: >-
    Canonical F2 inventory of the active task-board, workforce and queue
    registry HTTP API. All warehouse-scoped operations validate the warehouse
    claim locally. Internal queue-reference operations require a SERVICE
    principal, queue-registry.write and an allow-listed client_id. The private
    maintenance preflight requires the exact maintenance-service task-sync
    identity. The private logistics surface registers source-owned preparation
    and typed equipment-movement tasks only.
servers:
  - url: /api
security:
  - bearerJwt: []
paths:
  /queue-definitions:
    get:
      operationId: listQueueDefinitions
      description: >-
        Returns the shared system queue catalog. GENERAL definitions are the
        one task-board standard: every active warehouse receives a derived
        physical queue projection with the same order, state and classes.
        LOGISTICS_DRIVER remains configured by the logistics endpoint.
      responses:
        '200': { $ref: '#/components/responses/QueueDefinitionListOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createQueueDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueueDefinitionRequest' }
      responses:
        '201': { $ref: '#/components/responses/QueueDefinitionCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /queue-definitions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: updateQueueDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueueDefinitionRequest' }
      responses:
        '200': { $ref: '#/components/responses/QueueDefinitionOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteQueueDefinition
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /queue-definitions/order:
    put:
      operationId: reorderQueueDefinitions
      description: >-
        Reorders custom GENERAL task-board definitions for every warehouse.
        Canonical repair phases remain fixed first in this relative order:
        SES, welding, exterior, interior, electrical, plumbing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueueDefinitionOrderRequest' }
      responses:
        '200': { $ref: '#/components/responses/QueueDefinitionListOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/work-queues:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: listWorkQueues
      responses:
        '200': { $ref: '#/components/responses/WorkQueueListOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /warehouses/{warehouseId}/work-queues/{queueId}/worker-plan:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/QueueId'
    put:
      operationId: updateWorkerQueuePlan
      description: >-
        Requires USER, rwms.write and MANAGE. Changes only this warehouse's
        WorkerApp publication switch and waiting REAL plan window. Turning the
        switch off removes the whole queue from WorkerApp, including active work.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerQueuePlanRequest' }
      responses:
        '200': { $ref: '#/components/responses/WorkQueueOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/driver-queue:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    put:
      operationId: updateDriverQueue
      description: >-
        Creates or updates the warehouse-specific LOGISTICS_DRIVER queue.
        The request cannot select or replace a queue definition.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverQueueRequest' }
      responses:
        '200': { $ref: '#/components/responses/WorkQueueOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/queue-capabilities:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: getWarehouseQueueCapabilities
      description: >-
        Reports process capabilities from active, visible warehouse bindings.
      responses:
        '200': { $ref: '#/components/responses/WarehouseQueueCapabilitiesOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /internal/queue-definitions/{queueDefinitionId}/references:
    parameters:
      - name: queueDefinitionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: registerQueueReference
      description: Requires SERVICE, queue-registry.write and an allow-listed client_id.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueueReferenceRequest' }
      responses:
        '200': { $ref: '#/components/responses/QueueReferenceOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/queue-definitions/references/{type}/{externalReferenceId}:
    parameters:
      - $ref: '#/components/parameters/QueueReferenceType'
      - $ref: '#/components/parameters/ExternalReferenceId'
    delete:
      operationId: deleteQueueReference
      description: Requires SERVICE, queue-registry.write and an allow-listed client_id.
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/maintenance/routing-preflight:
    post:
      operationId: preflightMaintenanceRouting
      description: >-
        Read-only private bulk check for maintenance-service. Requires a SERVICE
        token whose sub and client_id are both maintenance-service and whose scope
        list is exactly task-board.task-sync. Every queueDefinitionId is resolved
        to this warehouse's binding; no name or legacy identifier lookup is
        performed. The binding must be active and visible. Missing global
        definitions, missing warehouse bindings and mismatches are returned
        separately. The operation never creates, updates or reserves a queue.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceRoutingPreflightRequest' }
      responses:
        '200': { $ref: '#/components/responses/MaintenanceRoutingPreflightOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /internal/task-board/v1/maintenance/catalog-routing-preflight:
    post:
      operationId: preflightMaintenanceCatalogRouting
      description: >-
        Validates category-to-queue links against global queue definitions
        without requiring any warehouse binding. This is the catalog boundary;
        warehouse routing is validated separately by routing-preflight.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogRoutingPreflightRequest' }
      responses:
        '200': { $ref: '#/components/responses/CatalogRoutingPreflightOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /internal/task-board/v1/warehouses/{warehouseId}/queue-capabilities:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: getInternalWarehouseQueueCapabilities
      description: Private maintenance-service view of stable warehouse process capabilities.
      responses:
        '200': { $ref: '#/components/responses/WarehouseQueueCapabilitiesOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /worker-classes:
    get:
      operationId: listWorkerClasses
      responses:
        '200': { $ref: '#/components/responses/WorkerClassListOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createWorkerClass
      requestBody:
        $ref: '#/components/requestBodies/WorkerClass'
      responses:
        '201': { $ref: '#/components/responses/WorkerClassCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /worker-classes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: updateWorkerClass
      requestBody:
        $ref: '#/components/requestBodies/WorkerClass'
      responses:
        '200': { $ref: '#/components/responses/WorkerClassOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteWorkerClass
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: getTaskBoard
      description: >-
        Returns one aggregate ordinary operational-board representation. Each
        ordinary queue contains every unfinished REAL and SHADOW route entry in
        canonical active/pinned/position order. availableTaskLimit and
        workerFeedEnabled are warehouse-local WorkerApp publication controls;
        they do not truncate this manager response or fence manager TAKE.
        SHADOW remains read-only, and route order remains the execution gate.
        If-None-Match is evaluated with a weak semantic ETag over stable snapshot
        state. Rolling timer counters and serverTime do not invalidate the ETag;
        timer state and the next transition do.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: Current task-board snapshot for the requested representation.
          headers:
            ETag:
              required: true
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskBoardSnapshot' }
        '304':
          description: The requested task-board representation has not changed.
          headers:
            ETag:
              required: true
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /warehouses/{warehouseId}/task-board/logistics:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: getDriverLogisticsBoard
      description: >-
        Returns the dedicated driver queue as one sticky CURRENT lane followed
        by the finite set of non-empty scheduled-date columns. Ordinary repair
        queues are not mixed into this response.
      responses:
        '200':
          description: Current driver-logistics board.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsBoardSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/kpi-settings:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: getWarehouseKpiSettings
      description: Returns KPI settings only for the selected warehouse.
      responses:
        '200': { $ref: '#/components/responses/KpiSettingsOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /warehouses/{warehouseId}/task-board/kpi-settings/palette:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    put:
      operationId: replaceWarehouseKpiPalette
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveKpiPaletteRequest' }
      responses:
        '200': { $ref: '#/components/responses/KpiSettingsOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/kpi-settings/work-schedule:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    put:
      operationId: replacePendingWarehouseKpiWorkSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveKpiWorkScheduleRequest' }
      responses:
        '200': { $ref: '#/components/responses/KpiSettingsOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/kpi-settings/work-schedule/pending:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    delete:
      operationId: deletePendingWarehouseKpiWorkSchedule
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/kpi-settings/activate:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    post:
      operationId: activateWarehouseKpiSettings
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivateKpiSettingsRequest' }
      responses:
        '200': { $ref: '#/components/responses/KpiSettingsOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/queues/{queueId}/eligible-groups:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/QueueId'
    get:
      operationId: listEligibleWorkerGroups
      responses:
        '200': { $ref: '#/components/responses/WorkerGroupListOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /warehouses/{warehouseId}/task-board/entries/{entryId}/history:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/EntryId'
    get:
      operationId: getTaskEntryHistory
      responses:
        '200': { $ref: '#/components/responses/TimeEventListOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /warehouses/{warehouseId}/task-board/tasks:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    post:
      operationId: registerBoardTask
      description: >-
        Requires USER, rwms.write and EDIT. An identical externalTaskId replay
        returns the current snapshot without another event; changed immutable
        data or another warehouse returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBoardTaskRequest' }
      responses:
        '201': { $ref: '#/components/responses/TaskBoardSnapshotCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/tasks/by-external-id/{externalTaskId}:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/ExternalTaskId'
    get:
      operationId: getBoardTaskByExternalId
      responses:
        '200':
          description: Current registered task and its complete route
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardTaskRegistration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /warehouses/{warehouseId}/task-board/tasks/by-external-id/{externalTaskId}/cancel:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/ExternalTaskId'
    post:
      operationId: cancelBoardTaskByExternalId
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelTaskRequest' }
      responses:
        '200':
          description: Current cancelled task state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancelledTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/tasks:
    post:
      operationId: registerExternalBoardTask
      description: >-
        Private only. Accepts either the maintenance-service SERVICE principal
        with exactly task-board.task-sync or the logistics-service SERVICE
        principal with exactly task-board.logistics. externalTaskId and a
        source reference owned by that caller are mandatory for driver tasks.
        Identical replay by the same authenticated source returns the existing
        registration; changed immutable input or another source returns 409.
        Ordinary maintenance work is registered into one aggregate priority
        queue; scheduledDate does not partition the ordinary board.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterExternalTaskRequest' }
      responses:
        '201':
          description: Source-owned task registration or its identical replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardTaskRegistration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/logistics/equipment-movement-tasks:
    post:
      operationId: registerLogisticsEquipmentMovementTask
      description: >-
        Private only. Requires exactly the logistics-service SERVICE principal
        with one task-board.logistics scope. The immutable typed operations and
        mandatory deadlineAt form the registration identity. Logistics cannot
        set a queue, worker, route, title, description or free-form task text;
        task-board routes the task into the warehouse's single active visible
        FURNITURE_MOVEMENT queue and rejects creation when that routing is absent
        or ambiguous. Only this task family rejects worker completion at or after
        deadlineAt.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterLogisticsEquipmentMovementTaskRequest' }
      responses:
        '201':
          description: Source-owned equipment movement task or identical replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsTaskSnapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/logistics/warehouses/{warehouseId}/board:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: getInternalDriverLogisticsBoard
      description: >-
        Private logistics-service projection of the dedicated driver queue.
        Requires exactly the logistics-service SERVICE principal with one
        task-board.logistics scope. The response has an ordered server-
        controlled CURRENT lane and a finite ordered set of non-empty date
        columns.
      responses:
        '200':
          description: Current driver-logistics board.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsBoardSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/logistics/tasks/{externalTaskId}/move:
    parameters:
      - $ref: '#/components/parameters/ExternalTaskId'
    post:
      operationId: moveInternalDriverLogisticsTask
      description: >-
        Private logistics-service command for reordering one driver task inside
        its sole warehouse driver queue, moving it to another calendar date,
        moving it from CURRENT back to a date, or inserting/reordering it in
        the ordered CURRENT lane. Already-running tasks are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveExternalLogisticsTaskRequest' }
      responses:
        '200':
          description: Current source-owned task registration after the move.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardTaskRegistration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/logistics/equipment-movement-tasks/{externalTaskId}:
    parameters:
      - $ref: '#/components/parameters/ExternalTaskId'
    get:
      operationId: getLogisticsEquipmentMovementTask
      description: Returns only the matching logistics-owned equipment movement task snapshot.
      responses:
        '200':
          description: Current source-owned equipment movement task.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsTaskSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /internal/task-board/v1/logistics/equipment-movement-tasks/{externalTaskId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ExternalTaskId'
    post:
      operationId: cancelLogisticsEquipmentMovementTask
      description: >-
        Cancels only the matching unfinished logistics equipment-movement task.
        The cancellation reason is task-board-owned, not caller text. An
        identical retry returns the current CANCELLED snapshot without another
        cancellation event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelLogisticsEquipmentMovementTaskRequest' }
      responses:
        '200':
          description: Current source-owned equipment movement task snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsTaskSnapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/tasks/{externalTaskId}:
    parameters:
      - $ref: '#/components/parameters/ExternalTaskId'
    get:
      operationId: getExternalBoardTask
      description: Returns a registration only when it belongs to the authenticated source client.
      responses:
        '200':
          description: Current source-owned task registration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardTaskRegistration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateExternalBoardTaskBeforeStart
      description: >-
        Replaces metadata and the complete route using task-version CAS. A
        differing replacement is rejected after any route entry or assignment
        has started and is available only to the authenticated registration
        source. After an ambiguous timeout the caller reconciles with GET. A
        value-identical retry returns the current registration without mutating
        it even when expectedTaskVersion is stale; any differing payload with
        a stale expectedTaskVersion returns 409 and never applies a second
        replacement.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreStartUpdateTaskRequest' }
      responses:
        '200':
          description: Updated source-owned task registration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardTaskRegistration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/tasks/{externalTaskId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ExternalTaskId'
    post:
      operationId: cancelExternalBoardTask
      description: >-
        Cancels only a not-completed task owned by the authenticated source
        client. An identical retry after a lost response returns the current
        CANCELLED snapshot without another event; GET is the reconciliation
        fallback for any ambiguous outcome.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelTaskRequest' }
      responses:
        '200':
          description: Current cancelled task state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancelledTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/tasks/{externalTaskId}/cancel-if-pre-start:
    parameters:
      - $ref: '#/components/parameters/ExternalTaskId'
    post:
      operationId: cancelExternalBoardTaskIfPreStart
      description: >-
        Atomically cancels a task owned by the authenticated source client only
        while every route entry is still WAITING. STARTED is returned without a
        mutation when any physical work has started or completed. A retry after
        a successful cancellation returns ALREADY_CANCELLED without another
        cancellation event. VERSION_CONFLICT reports a still-unstarted task
        whose task version no longer matches the caller snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelTaskRequest' }
      responses:
        '200':
          description: Atomic pre-start cancellation outcome and current task truth.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreStartCancellationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/tasks/{externalTaskId}/relocate:
    parameters:
      - $ref: '#/components/parameters/ExternalTaskId'
    post:
      operationId: relocateExternalBoardTask
      description: >-
        Atomically moves a maintenance-owned task and its complete route to the
        target warehouse by resolving every existing queueDefinitionId to an
        active visible target binding. Entry identities, statuses, assignments,
        content and history are preserved. If any binding is absent or
        unavailable, no task or entry is changed. An identical retry is served
        from the durable relocation receipt.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RelocateExternalTaskRequest' }
      responses:
        '200':
          description: Relocated source-owned task registration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardTaskRegistration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/tasks/{externalTaskId}/lane:
    parameters:
      - $ref: '#/components/parameters/ExternalTaskId'
    post:
      operationId: setExternalDriverTaskLane
      description: >-
        Logistics-service moves its not-started driver task between SCHEDULED
        and CURRENT using task-version CAS. A task already in work cannot be
        moved and no ordinary task can use this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetTaskLaneRequest' }
      responses:
        '200':
          description: Current task registration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardTaskRegistration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/tasks/{externalTaskId}/completion-evidence:
    parameters:
      - $ref: '#/components/parameters/ExternalTaskId'
    get:
      operationId: getExternalDriverTaskCompletionEvidence
      description: >-
        Returns the one READY result photo selected by the completing
        participant. It is visible only to logistics-service after the driver
        task is DONE.
      responses:
        '200':
          description: Canonical selected completion evidence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelectedCompletionEvidence' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/entries/{entryId}/take:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: takeTaskEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TakeEntryRequest' }
      responses:
        '200': { $ref: '#/components/responses/BoardEntryOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/entries/{entryId}/reorder:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: reorderTaskEntry
      description: >-
        Requires USER, rwms.write and EDIT. Reorders one unpinned WAITING REAL
        card among the other reorderable cards in its existing ordinary queue.
        The observed target-entry identity prevents a stale index from moving a
        card against a queue that changed after it was rendered. Active entries,
        pinned cards, SHADOW route steps and queue identity are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderBoardEntryRequest' }
      responses:
        '200': { $ref: '#/components/responses/TaskBoardSnapshotOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/entries/{entryId}/pause:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: pauseTaskEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PauseEntryRequest' }
      responses:
        '200': { $ref: '#/components/responses/BoardEntryOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/entries/{entryId}/resume:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: resumeTaskEntry
      requestBody:
        $ref: '#/components/requestBodies/VersionCommand'
      responses:
        '200': { $ref: '#/components/responses/BoardEntryOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/entries/{entryId}/complete:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: completeTaskEntry
      requestBody:
        $ref: '#/components/requestBodies/VersionCommand'
      responses:
        '200': { $ref: '#/components/responses/BoardEntryOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/tasks/{taskId}/pin:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - name: taskId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: setTaskPinned
      description: Pins or unpins the task in every route queue without changing its current position.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PinTaskRequest' }
      responses:
        '200': { $ref: '#/components/responses/TaskBoardSnapshotOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /worker/v1/context:
    get:
      operationId: getWorkerContext
      description: >-
        Returns the authenticated worker profile, current memberships,
        qualifications, visible categories, server-time anchor and a
        server-issued 24-hour offline lease. The worker and warehouse are
        derived exclusively from the worker JWT.
      responses:
        '200':
          description: Current authenticated worker context.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerContext' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /worker/v1/feed:
    get:
      operationId: getWorkerFeed
      description: >-
        Returns only entries matched by at least one current audience selector,
        including group assignments visible to the authenticated worker. An
        ordinary queue must also be enabled for WorkerApp; active REAL work is
        retained and WAITING REAL work is bounded by that warehouse queue's
        daily-plan count. SHADOW entries are never published. Cursors are
        opaque. If-None-Match applies to the requested page.
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            oneOf:
              - { type: string, minLength: 1, maxLength: 512 }
              - { type: 'null' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: Current page of the authenticated worker feed.
          headers:
            ETag:
              required: true
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerFeed' }
        '304':
          description: The requested feed page has not changed.
          headers:
            ETag:
              required: true
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /worker/v1/entries/{entryId}:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    get:
      operationId: getWorkerTaskDetail
      description: >-
        Returns a sanitized worker-visible task snapshot. An entry without a
        matching current audience selector or outside its ordinary queue's
        current WorkerApp publication window is indistinguishable from a
        missing entry and is never disclosed. For a MAINTENANCE_REPAIR source,
        consecutive route entries in the same physical work queue form one
        worker execution package: works, materials, comments and source media
        cover the complete segment, while planned duration and timer cover its
        still-unfinished members.
      responses:
        '200':
          description: Current worker-visible entry detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerTaskDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /worker/v1/events:
    get:
      operationId: streamWorkerEvents
      description: >-
        Streams authorization-filtered invalidations only. Event payloads
        contain identifiers and revisions, never the task snapshot. Clients
        reconnect with Last-Event-ID and fetch the affected resource. A waiting
        logistics-driver task is never announced here; TASK_JOIN_AVAILABLE is
        emitted only after the driver takes it.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Server-sent worker invalidation event stream.
          content:
            text/event-stream:
              schema:
                type: string
              x-rwms-event-data-schema:
                $ref: '#/components/schemas/WorkerInvalidationEvent'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /worker/v1/entries/{entryId}/actions:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: applyWorkerAction
      description: >-
        Applies or replays a worker transition. Idempotency-Key must equal the
        request operationId. The worker identity is derived from the JWT;
        occurredAt is accepted only when it falls inside the referenced lease.
        TAKE and JOIN recheck the current WorkerApp publication window so a
        stale or crafted request cannot bypass the warehouse plan.
        COMPLETE on a MAINTENANCE_REPAIR representative atomically completes
        every later unfinished entry in its consecutive same-queue package and
        publishes the ordinary completion fact for each source-mapped entry.
        Other sources remain entry-scoped.
      parameters:
        - $ref: '#/components/parameters/WorkerIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerActionRequest' }
      responses:
        '200':
          description: Applied command or byte-equivalent idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerActionAppliedResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Stale, expired-lease, changed-replay or invalid-state conflict.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/WorkerActionConflictProblem' }
  /worker/v1/entries/{entryId}/evidence-reservations:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: reserveWorkerTaskEvidence
      description: >-
        Reserves a stable evidenceId before media upload. Idempotency-Key must
        equal operationId. Worker and group metadata are derived and validated
        by task-board; client-supplied actor metadata is not accepted.
      parameters:
        - $ref: '#/components/parameters/WorkerIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceReservationRequest' }
      responses:
        '200':
          description: Existing reservation returned for an identical replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEvidence' }
        '201':
          description: Evidence reservation created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEvidence' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /worker/v1/devices/{installationId}:
    parameters:
      - name: installationId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
    put:
      operationId: registerWorkerDevice
      description: >-
        Creates or replaces the authenticated worker binding for this
        installation. A registration is never transferable between workers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerDeviceRegistrationRequest' }
      responses:
        '200':
          description: Current device registration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerDeviceRegistration' }
        '201':
          description: Device registration created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerDeviceRegistration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: unregisterWorkerDevice
      description: Removes only the authenticated worker's installation binding.
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /driver/v1/context:
    get:
      operationId: getDriverContext
      description: >-
        Returns the authenticated driver's profile, primary queue categories,
        server-time anchor and server-issued 24-hour offline lease. Driver and
        warehouse identity are derived exclusively from the WORKER JWT carrying
        driver.tasks.
      responses:
        '200':
          description: Current authenticated driver context.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerContext' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /driver/v1/feed:
    get:
      operationId: getDriverFeed
      description: >-
        Returns only entries from primary queue bindings visible to the
        authenticated driver. This includes assigned or shared current
        logistics work and matching ordinary warehouse queues; cursors are
        opaque and If-None-Match applies to the requested page.
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            oneOf:
              - { type: string, minLength: 1, maxLength: 512 }
              - { type: 'null' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: Current page of the authenticated driver feed.
          headers:
            ETag:
              required: true
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerFeed' }
        '304':
          description: The requested feed page has not changed.
          headers:
            ETag:
              required: true
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /driver/v1/entries/{entryId}:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    get:
      operationId: getDriverTaskDetail
      description: >-
        Returns a sanitized primary-binding task snapshot. An entry outside the
        authenticated driver's current audience is indistinguishable from a
        missing entry.
      responses:
        '200':
          description: Current driver-visible entry detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerTaskDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /driver/v1/events:
    get:
      operationId: streamDriverEvents
      description: >-
        Streams authorization-filtered invalidations only. Event payloads carry
        identifiers and revisions, never task data; the client reloads its
        driver-authorized feed after every signal. TASK_JOIN_AVAILABLE and its
        entry identity are confined to the WorkerApp stream.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Server-sent driver invalidation event stream.
          content:
            text/event-stream:
              schema:
                type: string
              x-rwms-event-data-schema:
                $ref: '#/components/schemas/WorkerInvalidationEvent'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /driver/v1/entries/{entryId}/actions:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: applyDriverAction
      description: >-
        Applies or replays a driver transition. A driver can take primary work,
        pause, resume or complete assigned work; JOIN is reserved for the worker
        surface. Idempotency-Key must equal operationId.
      parameters:
        - $ref: '#/components/parameters/WorkerIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverActionRequest' }
      responses:
        '200':
          description: Applied command or byte-equivalent idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerActionAppliedResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Stale, expired-lease, changed-replay or invalid-state conflict.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/WorkerActionConflictProblem' }
  /driver/v1/entries/{entryId}/evidence-reservations:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: reserveDriverTaskEvidence
      description: >-
        Reserves a stable evidenceId for driver completion media. Actor and
        assignment metadata are derived from the driver JWT and task-board
        state; Idempotency-Key must equal operationId.
      parameters:
        - $ref: '#/components/parameters/WorkerIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceReservationRequest' }
      responses:
        '200':
          description: Existing reservation returned for an identical replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEvidence' }
        '201':
          description: Evidence reservation created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEvidence' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /driver/v1/devices/{installationId}:
    parameters:
      - name: installationId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
    put:
      operationId: registerDriverDevice
      description: >-
        Creates or replaces the authenticated driver's app installation. The
        server fixes its DRIVER surface and never transfers it between workers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerDeviceRegistrationRequest' }
      responses:
        '200':
          description: Current device registration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerDeviceRegistration' }
        '201':
          description: Device registration created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerDeviceRegistration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: unregisterDriverDevice
      description: Removes only the authenticated driver's DRIVER installation.
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /warehouses/{warehouseId}/workers:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: listWorkers
      responses:
        '200': { $ref: '#/components/responses/WorkerListOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createWorker
      requestBody:
        $ref: '#/components/requestBodies/Worker'
      responses:
        '201': { $ref: '#/components/responses/WorkerCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/workers/{id}:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    put:
      operationId: updateWorker
      requestBody:
        $ref: '#/components/requestBodies/Worker'
      responses:
        '200': { $ref: '#/components/responses/WorkerOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
    delete:
      operationId: deleteWorker
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /warehouses/{warehouseId}/workers/{id}/current-group:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    put:
      operationId: setWorkerCurrentGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetCurrentGroupRequest' }
      responses:
        '200': { $ref: '#/components/responses/WorkerOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/workers/{id}/credentials/reset:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    post:
      operationId: resetWorkerCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialPasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/WorkerOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /warehouses/{warehouseId}/workers/{id}/credentials/disable:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    post:
      operationId: disableWorkerCredentials
      requestBody:
        $ref: '#/components/requestBodies/VersionCommand'
      responses:
        '200': { $ref: '#/components/responses/WorkerOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /warehouses/{warehouseId}/workers/{id}/credentials/enable:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    post:
      operationId: enableWorkerCredentials
      requestBody:
        $ref: '#/components/requestBodies/VersionCommand'
      responses:
        '200': { $ref: '#/components/responses/WorkerOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /warehouses/{warehouseId}/workers/{id}/credentials/reconcile-disable:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    post:
      operationId: reconcileWorkerCredentialDisable
      description: >-
        Reconcile an expired or failed credential operation against auth-service state;
        Configure/reset and legacy recovery converge to the current auth-service
        state. Disable preserves the application login, while explicit clear
        converges to NOT_CONFIGURED.
      requestBody:
        $ref: '#/components/requestBodies/VersionCommand'
      responses:
        '200': { $ref: '#/components/responses/WorkerOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /warehouses/{warehouseId}/workers/{id}/deletion/reconcile:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    post:
      operationId: reconcileWorkerDeletion
      requestBody:
        $ref: '#/components/requestBodies/VersionCommand'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /warehouses/{warehouseId}/worker-groups:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: listWorkerGroups
      responses:
        '200': { $ref: '#/components/responses/WorkerGroupListOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createWorkerGroup
      requestBody:
        $ref: '#/components/requestBodies/WorkerGroup'
      responses:
        '201': { $ref: '#/components/responses/WorkerGroupCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/worker-groups/{id}:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    put:
      operationId: updateWorkerGroup
      requestBody:
        $ref: '#/components/requestBodies/WorkerGroup'
      responses:
        '200': { $ref: '#/components/responses/WorkerGroupOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteWorkerGroup
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/worker-groups/{id}/disable:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    post:
      operationId: disableWorkerGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupAvailabilityRequest' }
      responses:
        '200': { $ref: '#/components/responses/WorkerGroupOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/worker-groups/{id}/enable:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    post:
      operationId: enableWorkerGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupAvailabilityRequest' }
      responses:
        '200': { $ref: '#/components/responses/WorkerGroupOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    WarehouseId:
      name: warehouseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    QueueId:
      name: queueId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EntryId:
      name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExternalTaskId:
      name: externalTaskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    QueueReferenceType:
      name: type
      in: path
      required: true
      schema: { type: string, enum: [REPAIR_PLAN, CATALOG_POSITION] }
    ExternalReferenceId:
      name: externalReferenceId
      in: path
      required: true
      schema: { type: string }
    ExpectedVersion:
      name: expectedVersion
      in: query
      required: true
      schema: { type: integer, format: int64, minimum: 0 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional request trace identity. Reviewed bootstrap idempotency is instead
        bound to warehouseId and the packaged sourceSha256 and therefore spans
        retries that use different keys.
      schema: { type: string, minLength: 1, maxLength: 128 }
    WorkerIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Stable UUID for the logical worker command. It must exactly equal the
        operationId in the request body.
      schema: { type: string, format: uuid }
  requestBodies:
    WorkerClass:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkerClassRequest' }
    Worker:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkerRequest' }
    WorkerGroup:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkerGroupRequest' }
    VersionCommand:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/VersionCommand' }
  schemas:
    KpiPaletteRange:
      type: object
      required: [fromPercent, toPercent, color]
      properties:
        fromPercent: { type: integer, minimum: 0, maximum: 99 }
        toPercent: { type: integer, minimum: 1, maximum: 100 }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
      additionalProperties: false
    KpiPalette:
      type: object
      required: [version, ranges, overdueColor]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        ranges:
          type: array
          minItems: 1
          maxItems: 6
          items: { $ref: '#/components/schemas/KpiPaletteRange' }
        overdueColor: { type: string, pattern: '^#[0-9A-F]{6}$' }
      additionalProperties: false
    KpiWorkBreak:
      type: object
      required: [start, end]
      properties:
        start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
      additionalProperties: false
    KpiWorkSchedule:
      type: object
      required: [id, version, effectiveFrom, shiftStart, shiftEnd, daysOff, breaks]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        effectiveFrom: { type: string, format: date }
        shiftStart: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        shiftEnd: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        daysOff:
          type: array
          maxItems: 7
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 7 }
        breaks:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/KpiWorkBreak' }
      additionalProperties: false
    WarehouseKpiSettings:
      type: object
      required: [warehouseId, timeZone, status, version, dataAvailableFrom, palette, activeSchedule, pendingSchedule]
      properties:
        warehouseId: { type: string, format: uuid }
        timeZone: { type: string, minLength: 1, maxLength: 64 }
        status: { type: string, enum: [UNCONFIGURED, DRAFT, SCHEDULED, ACTIVE] }
        version: { type: integer, format: int64, minimum: 0 }
        dataAvailableFrom:
          oneOf:
            - { type: string, format: date }
            - { type: 'null' }
        palette:
          oneOf:
            - { $ref: '#/components/schemas/KpiPalette' }
            - { type: 'null' }
        activeSchedule:
          oneOf:
            - { $ref: '#/components/schemas/KpiWorkSchedule' }
            - { type: 'null' }
        pendingSchedule:
          oneOf:
            - { $ref: '#/components/schemas/KpiWorkSchedule' }
            - { type: 'null' }
      additionalProperties: false
    SaveKpiPaletteRequest:
      type: object
      required: [expectedVersion, ranges, overdueColor]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        ranges:
          type: array
          minItems: 1
          maxItems: 6
          items: { $ref: '#/components/schemas/KpiPaletteRange' }
        overdueColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
      additionalProperties: false
    SaveKpiWorkScheduleRequest:
      type: object
      required: [expectedVersion, effectiveFrom, shiftStart, shiftEnd, daysOff, breaks]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        effectiveFrom: { type: string, format: date }
        shiftStart: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        shiftEnd: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        daysOff:
          type: array
          maxItems: 7
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 7 }
        breaks:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/KpiWorkBreak' }
      additionalProperties: false
    ActivateKpiSettingsRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    WorkerClass:
      type: object
      required: [id, version, name, description, comment, sortOrder, active, logisticsPrimary]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        name: { type: string }
        description: { oneOf: [{ type: string }, { type: 'null' }] }
        comment: { oneOf: [{ type: string }, { type: 'null' }] }
        sortOrder: { type: integer }
        active: { type: boolean }
        logisticsPrimary:
          type: boolean
          description: >-
            True when this class is a primary LOGISTICS_DRIVER class and is not
            attached to any GENERAL queue. This is a stable relation, not a
            display-name convention or a current-warehouse setting.
      additionalProperties: false
    WorkerClassList:
      type: array
      items: { $ref: '#/components/schemas/WorkerClass' }
    QueueDefinition:
      type: object
      required: [id, version, name, description, type, purpose, sortOrder, active, hidden, collapsed, holdingPeriodMinutes, notificationThreshold, notifyWhenThresholdReached, resultPhotoMinCount, availableTaskLimit, bindings]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { oneOf: [{ type: string, maxLength: 1000 }, { type: 'null' }] }
        type: { type: string, enum: [MOVEMENT, REPAIR, HOLDING, FURNITURE_MOVEMENT] }
        purpose: { $ref: '#/components/schemas/QueuePurpose' }
        sortOrder: { type: integer, minimum: 0 }
        active: { type: boolean }
        hidden: { type: boolean }
        collapsed: { type: boolean }
        holdingPeriodMinutes: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        notificationThreshold: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        notifyWhenThresholdReached: { type: boolean }
        resultPhotoMinCount: { type: integer, minimum: 0, maximum: 20 }
        availableTaskLimit:
          type: integer
          minimum: 1
          maximum: 50
          description: Default WorkerApp waiting REAL plan copied only when a warehouse projection is first created.
        bindings:
          type: array
          items: { $ref: '#/components/schemas/QueueBinding' }
      additionalProperties: false
    QueueDefinitionList:
      type: array
      items: { $ref: '#/components/schemas/QueueDefinition' }
    QueueDefinitionRequest:
      type: object
      required: [version, name, type, purpose, sortOrder, active, hidden, collapsed, holdingPeriodMinutes, notificationThreshold, notifyWhenThresholdReached, resultPhotoMinCount, availableTaskLimit, bindings]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { oneOf: [{ type: string, maxLength: 1000 }, { type: 'null' }] }
        type: { type: string, enum: [MOVEMENT, REPAIR, HOLDING, FURNITURE_MOVEMENT] }
        purpose:
          type: string
          enum: [GENERAL]
          description: Global CRUD never creates or edits LOGISTICS_DRIVER.
        sortOrder: { type: integer, minimum: 0 }
        active: { type: boolean }
        hidden: { type: boolean }
        collapsed: { type: boolean }
        holdingPeriodMinutes: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        notificationThreshold: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        notifyWhenThresholdReached: { type: boolean }
        resultPhotoMinCount: { type: integer, minimum: 0, maximum: 20 }
        availableTaskLimit:
          type: integer
          minimum: 1
          maximum: 50
          default: 6
          description: Default WorkerApp waiting REAL plan for newly created warehouse projections; existing warehouse plans are preserved.
        bindings:
          type: array
          items: { $ref: '#/components/schemas/QueueBindingRequest' }
      additionalProperties: false
    QueueDefinitionOrderRequest:
      type: object
      required: [definitions]
      properties:
        definitions:
          type: array
          minItems: 1
          items:
            type: object
            required: [definitionId, expectedVersion]
            properties:
              definitionId: { type: string, format: uuid }
              expectedVersion: { type: integer, format: int64, minimum: 0 }
            additionalProperties: false
      additionalProperties: false
    QueuePurpose:
      type: string
      enum: [GENERAL, LOGISTICS_DRIVER]
    ParticipationPolicy:
      type: string
      enum: [PRIMARY, REQUIRED, OPTIONAL]
    TaskLane:
      type: string
      enum: [SCHEDULED, CURRENT]
    DriverTaskAudienceMode:
      type: string
      enum: [UNASSIGNED, ASSIGNED_DRIVER, WAREHOUSE_DRIVERS]
    DriverTaskAudience:
      type: object
      required: [mode]
      description: >-
        Worker visibility for a logistics driver task. ASSIGNED_DRIVER carries
        the exact worker identity. UNASSIGNED and WAREHOUSE_DRIVERS never carry
        a worker identity; shared visibility narrows only to the actual assignee
        after take.
      properties:
        mode: { $ref: '#/components/schemas/DriverTaskAudienceMode' }
        workerId:
          oneOf: [{ type: string, format: uuid }, { type: 'null' }]
        workerName:
          oneOf: [{ type: string, maxLength: 512 }, { type: 'null' }]
      allOf:
        - if:
            properties: { mode: { const: ASSIGNED_DRIVER } }
            required: [mode]
          then:
            required: [workerId]
