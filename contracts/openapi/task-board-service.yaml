        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/ExternalTaskId'
    get:
      operationId: getInternalContractorTaskExecution
      description: >-
        Returns one complete ordered execution snapshot only when the task is owned by
        logistics-service, has source type LOGISTICS_DRIVER_TASK, and is assigned through
        ASSIGNED_DRIVER to this exact active CONTRACTOR worker. The response contains no worker
        phone, credentials, general board, other tasks or bearer-only media read paths. Address
        text is present only when the source already supplied it in taskText or another immutable
        worker-visible snapshot; task-board owns no separate client coordinate in this boundary.
