      properties:
        entryId: { type: string, format: uuid }
        entryVersion: { type: integer, format: int64, minimum: 0 }
        queueDefinitionId: { type: string, format: uuid }
        workQueueId: { type: string, format: uuid }
        queueName: { type: string }
        routeIndex: { type: integer, minimum: 0 }
        queuePosition: { type: integer, minimum: 0 }
        entryType: { type: string, enum: [REAL, SHADOW] }
        status: { type: string, enum: [WAITING, IN_PROGRESS, PAUSED, DONE, CANCELLED] }
        taskText: { oneOf: [{ type: string }, { type: 'null' }] }
