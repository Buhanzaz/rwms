        sourceMedia:
          description: >-
            Ordered immutable source media identities; object storage coordinates are forbidden.
            When the owning source defines a cover image, that reference is first and the remaining
            references retain source order.
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/TaskSourceMediaSnapshotRequest' }
        audienceSelectors:
          description: >-
            Explicit union of worker-class and worker-group audiences. Null
            uses the queue bindings as AVAILABLE class defaults; an explicit
            empty list is rejected.
          oneOf:
            - type: array
              minItems: 1
              uniqueItems: true
              items: { $ref: '#/components/schemas/AudienceSelector' }
            - type: 'null'
      additionalProperties: false
    TaskWorkSnapshotRequest:
      type: object
      required: [id, name, quantity, unit, durationMinutes, comment, sourceMediaIds]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 1000 }
        quantity: { type: number, minimum: 0 }
        unit: { oneOf: [{ type: string, maxLength: 32 }, { type: 'null' }] }
        durationMinutes: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        comment: { oneOf: [{ type: string, maxLength: 2000 }, { type: 'null' }] }
        sourceMediaIds:
          description: Source media from the enclosing route step that belong to this work only.
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
      additionalProperties: false
    TaskMaterialSnapshotRequest:
      type: object
      required: [id, name, quantity, unit]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 1000 }
        quantity: { type: number, minimum: 0 }
        unit: { oneOf: [{ type: string, maxLength: 32 }, { type: 'null' }] }
      additionalProperties: false
    TaskCommentSnapshotRequest:
      type: object
      required: [id, text, authorDisplayName, createdAt]
      properties:
        id: { type: string, format: uuid }
        text: { type: string, minLength: 1, maxLength: 2000 }
        authorDisplayName: { oneOf: [{ type: string, maxLength: 256 }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
      additionalProperties: false
    TaskSourceMediaSnapshotRequest:
      type: object
      required: [mediaId, generation, contentType, capturedAt, recordedAt]
      properties:
        mediaId: { type: string, format: uuid }
        generation: { type: integer, format: int64, minimum: 1 }
        contentType: { oneOf: [{ type: string, maxLength: 128 }, { type: 'null' }] }
        capturedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        recordedAt: { type: string, format: date-time }
      additionalProperties: false
    CreateBoardTaskRequest:
      type: object
      required: [title, route]
      properties:
        externalTaskId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        title: { type: string, minLength: 1, maxLength: 256 }
        unitNumber: { oneOf: [{ type: string, maxLength: 64 }, { type: 'null' }] }
        description: { oneOf: [{ type: string, maxLength: 2000 }, { type: 'null' }] }
        plannedDurationMinutes: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        deadlineAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        scheduledDate: { oneOf: [{ type: string, format: date }, { type: 'null' }] }
        priority: { oneOf: [{ type: integer, minimum: 1, maximum: 5 }, { type: 'null' }] }
        route:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RouteStepRequest' }
      additionalProperties: false
    RegisterExternalTaskRequest:
      type: object
      required: [warehouseId, externalTaskId, title, route]
      properties:
        warehouseId: { type: string, format: uuid }
        externalTaskId: { type: string, format: uuid }
        source:
          description: >-
            Immutable source aggregate for a maintenance repair or a dedicated
            logistics driver intent. The authenticated source client must own
            the declared source type.
          oneOf: [{ $ref: '#/components/schemas/TaskSourceReference' }, { type: 'null' }]
        title: { type: string, minLength: 1, maxLength: 256 }
        unitNumber: { oneOf: [{ type: string, maxLength: 64 }, { type: 'null' }] }
        description: { oneOf: [{ type: string, maxLength: 2000 }, { type: 'null' }] }
        plannedDurationMinutes: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        deadlineAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        scheduledDate: { oneOf: [{ type: string, format: date }, { type: 'null' }] }
        lane:
          oneOf:
            - { $ref: '#/components/schemas/TaskLane' }
            - { type: 'null' }
        driverAudience:
          description: >-
            Allowed only for a logistics-service LOGISTICS_DRIVER_TASK. When
            omitted for that source, defaults to WAREHOUSE_DRIVERS.
          oneOf:
            - { $ref: '#/components/schemas/DriverTaskAudience' }
            - { type: 'null' }
        priority: { oneOf: [{ type: integer, minimum: 1, maximum: 5 }, { type: 'null' }] }
        route:
          description: >-
            A maintenance-service repair route is normalized by the server to
            SES, welding, exterior, interior, electrical and plumbing; work
            inside one phase retains source order.
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RouteStepRequest' }
      additionalProperties: false
    EquipmentMovementDirection:
      type: string
      enum: [BRING_TO_CABIN, TAKE_FROM_CABIN]
    EquipmentMovementOperation:
      type: object
      required: [direction, equipmentId, equipmentName, quantity]
      properties:
        direction: { $ref: '#/components/schemas/EquipmentMovementDirection' }
        equipmentId: { type: string, format: uuid }
        equipmentName: { type: string, minLength: 1, maxLength: 255 }
        quantity: { type: integer, format: int64, minimum: 1 }
      additionalProperties: false
    RegisterLogisticsEquipmentMovementTaskRequest:
      type: object
      required: [warehouseId, externalTaskId, deadlineAt, operations]
      properties:
        warehouseId: { type: string, format: uuid }
        externalTaskId: { type: string, format: uuid }
        unitNumber: { oneOf: [{ type: string, maxLength: 64 }, { type: 'null' }] }
        plannedDurationMinutes: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        deadlineAt: { type: string, format: date-time }
        operations:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/EquipmentMovementOperation' }
      additionalProperties: false
    CancelLogisticsEquipmentMovementTaskRequest:
      type: object
      required: [expectedTaskVersion]
      properties:
        expectedTaskVersion: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    LogisticsTaskSnapshot:
      type: object
      required: [taskId, taskVersion, warehouseId, externalTaskId, status, doneAt]
      properties:
        taskId: { type: string, format: uuid }
        taskVersion: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        externalTaskId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, DONE, CANCELLED] }
        doneAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
      additionalProperties: false
    PreStartUpdateTaskRequest:
      type: object
      required: [expectedTaskVersion, title, route]
      properties:
        expectedTaskVersion: { type: integer, format: int64, minimum: 0 }
        title: { type: string, minLength: 1, maxLength: 256 }
        unitNumber: { oneOf: [{ type: string, maxLength: 64 }, { type: 'null' }] }
        description: { oneOf: [{ type: string, maxLength: 2000 }, { type: 'null' }] }
        plannedDurationMinutes: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        deadlineAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        route:
          description: >-
            For a maintenance-service repair, the server retains the canonical
            SES, welding, exterior, interior, electrical and plumbing order;
            work inside one phase retains source order.
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RouteStepRequest' }
      additionalProperties: false
    RelocateExternalTaskRequest:
      type: object
      required: [expectedTaskVersion, targetWarehouseId]
      properties:
        expectedTaskVersion: { type: integer, format: int64, minimum: 0 }
        targetWarehouseId: { type: string, format: uuid }
      additionalProperties: false
    SetTaskLaneRequest:
      type: object
      required: [expectedTaskVersion, lane]
      properties:
        expectedTaskVersion: { type: integer, format: int64, minimum: 0 }
        lane: { $ref: '#/components/schemas/TaskLane' }
      additionalProperties: false
    SelectedCompletionEvidence:
      type: object
      required: [externalTaskId, taskId, entryId, evidenceId, mediaId, mediaGeneration, warehouseId, recordedAt]
      properties:
        externalTaskId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        entryId: { type: string, format: uuid }
        evidenceId: { type: string, format: uuid }
        mediaId: { type: string, format: uuid }
        mediaGeneration: { type: integer, format: int64, minimum: 1 }
        warehouseId: { type: string, format: uuid }
        recordedAt: { type: string, format: date-time }
      additionalProperties: false
    TakeEntryRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        workerGroupId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        workerId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
      additionalProperties: false
    ReorderBoardEntryRequest:
      type: object
      required: [expectedEntryVersion, expectedQueueVersion, targetEntryId, targetIndex]
      properties:
        expectedEntryVersion: { type: integer, format: int64, minimum: 0 }
        expectedQueueVersion: { type: integer, format: int64, minimum: 0 }
        targetEntryId: { type: string, format: uuid }
        targetIndex: { type: integer, minimum: 0 }
      additionalProperties: false
    VersionCommand:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    PauseEntryRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        reason: { oneOf: [{ type: string, maxLength: 1000 }, { type: 'null' }] }
      additionalProperties: false
    PinTaskRequest:
      type: object
      required: [expectedTaskVersion, pinned]
      properties:
        expectedTaskVersion: { type: integer, format: int64, minimum: 0 }
        pinned: { type: boolean }
      additionalProperties: false
    CancelTaskRequest:
      type: object
      required: [expectedTaskVersion, reason]
      properties:
        expectedTaskVersion: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
      additionalProperties: false
    PreStartCancellationOutcome:
      type: string
      enum: [CANCELLED, ALREADY_CANCELLED, STARTED, VERSION_CONFLICT]
    PreStartCancellationResult:
      type: object
      required: [outcome, taskId, externalTaskId, taskVersion, status, cancelledAt]
      properties:
        outcome: { $ref: '#/components/schemas/PreStartCancellationOutcome' }
        taskId: { type: string, format: uuid }
        externalTaskId: { type: string, format: uuid }
        taskVersion: { type: integer, format: int64, minimum: 0 }
        status: { type: string, enum: [ACTIVE, DONE, CANCELLED] }
        cancelledAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
      additionalProperties: false
    CancelledTask:
      type: object
      required: [taskId, externalTaskId, taskVersion, status, cancelledAt]
      properties:
        taskId: { type: string, format: uuid }
        externalTaskId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        taskVersion: { type: integer, format: int64, minimum: 0 }
        status: { type: string, const: CANCELLED }
        cancelledAt: { type: string, format: date-time }
      additionalProperties: false
    BoardTaskRegistration:
      type: object
      required: [taskId, taskVersion, warehouseId, externalTaskId, title, unitNumber, description, status, plannedDurationMinutes, deadlineAt, scheduledDate, lane, priority, pinned, driverAudience, doneAt, route]
      properties:
        taskId: { type: string, format: uuid }
        taskVersion: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        externalTaskId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        title: { type: string }
        unitNumber: { oneOf: [{ type: string }, { type: 'null' }] }
        description: { oneOf: [{ type: string }, { type: 'null' }] }
        status: { type: string, enum: [ACTIVE, DONE, CANCELLED] }
        plannedDurationMinutes: { oneOf: [{ type: integer }, { type: 'null' }] }
        deadlineAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        scheduledDate: { type: string, format: date }
        lane: { $ref: '#/components/schemas/TaskLane' }
        priority: { type: integer, minimum: 1, maximum: 5 }
        pinned: { type: boolean }
        driverAudience:
          description: >-
            Always present. Null only for ordinary work outside a logistics
            driver queue.
          oneOf:
            - { $ref: '#/components/schemas/DriverTaskAudience' }
            - { type: 'null' }
        doneAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        route:
          type: array
          items: { $ref: '#/components/schemas/RegisteredRouteStep' }
      additionalProperties: false
    RegisteredRouteStep:
      type: object
      required: [entryId, entryVersion, queueDefinitionId, workQueueId, queueName, routeIndex, queuePosition, entryType, status, taskText, plannedDurationMinutes]
      properties:
        entryId: { type: string, format: uuid }
        entryVersion: { type: integer, format: int64, minimum: 0 }
        queueDefinitionId: { type: string, format: uuid }
        workQueueId: { type: string, format: uuid }
        queueName: { type: string }
        routeIndex: { type: integer, minimum: 0 }
        queuePosition: { type: integer, minimum: 0 }
        entryType: { type: string, enum: [REAL, SHADOW] }
        status: { type: string, enum: [WAITING, IN_PROGRESS, PAUSED, DONE, CANCELLED] }
        taskText: { oneOf: [{ type: string }, { type: 'null' }] }
        plannedDurationMinutes: { oneOf: [{ type: integer }, { type: 'null' }] }
      additionalProperties: false
    WorkerIdentity:
      type: object
      required: [id, warehouseId, login, displayName]
      properties:
        id: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        login: { type: string, minLength: 1 }
        displayName: { type: string, minLength: 1 }
      additionalProperties: false
    WorkerGroupSummary:
      type: object
      required: [id, name, workerClassId, workerClassName]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        workerClassId: { type: string, format: uuid }
        workerClassName: { type: string, minLength: 1 }
      additionalProperties: false
    WorkerQualificationSummary:
      type: object
      required: [workerClassId, name]
      properties:
        workerClassId: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
      additionalProperties: false
    WorkerCategory:
      type: object
      required: [queueId, name, type, queuePurpose, sortOrder, audienceModes, groupIds, resultPhotoMinCount]
      properties:
        queueId: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        type: { type: string, enum: [MOVEMENT, REPAIR, HOLDING, FURNITURE_MOVEMENT] }
        queuePurpose: { $ref: '#/components/schemas/QueuePurpose' }
        sortOrder: { type: integer }
        audienceModes:
          type: array
          uniqueItems: true
          items: { type: string, enum: [AVAILABLE, MANDATORY, SECONDARY_PENDING, REQUIRED_JOIN, OPTIONAL_JOIN] }
        groupIds:
          description: >-
            Current worker groups whose worker class is bound to this queue.
            An empty list denotes a qualification-only or individual queue.
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        resultPhotoMinCount: { type: integer, minimum: 0, maximum: 20 }
      additionalProperties: false
    WorkerKpiPaletteRange:
      type: object
      required: [fromPercent, toPercent, color]
      properties:
        fromPercent: { type: integer, minimum: 0, maximum: 100 }
        toPercent: { type: integer, minimum: 0, maximum: 100 }
        color: { type: string, pattern: '^#[0-9A-F]{6}$' }
      additionalProperties: false
    WorkerKpiPalette:
      type: object
      required: [ranges, overdueColor]
      properties:
        ranges:
          type: array
          minItems: 1
          maxItems: 6
          items: { $ref: '#/components/schemas/WorkerKpiPaletteRange' }
        overdueColor: { type: string, pattern: '^#[0-9A-F]{6}$' }
      additionalProperties: false
    WorkerOfflineLease:
      type: object
      required: [id, issuedAt, expiresAt, syncRevision]
      properties:
        id: { type: string, format: uuid }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        syncRevision: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    WorkerContext:
      type: object
      required: [worker, currentGroup, operationalAvailability, groups, qualifications, categories, kpiPalette, serverTime, revision, offlineLease]
      properties:
        worker: { $ref: '#/components/schemas/WorkerIdentity' }
        currentGroup:
          oneOf:
            - { $ref: '#/components/schemas/WorkerGroupSummary' }
            - { type: 'null' }
        operationalAvailability: { type: string, enum: [AVAILABLE, DISABLED] }
        groups:
          type: array
          items: { $ref: '#/components/schemas/WorkerGroupSummary' }
        qualifications:
          type: array
          items: { $ref: '#/components/schemas/WorkerQualificationSummary' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/WorkerCategory' }
        kpiPalette:
          oneOf:
            - { $ref: '#/components/schemas/WorkerKpiPalette' }
            - { type: 'null' }
        serverTime: { type: string, format: date-time }
        revision: { type: integer, format: int64, minimum: 0 }
        offlineLease: { $ref: '#/components/schemas/WorkerOfflineLease' }
      additionalProperties: false
    WorkerAssignmentSnapshot:
      type: object
      required: [id, workerId, workerName, workerGroupId, workerGroupName, status, assignedAt, startedAt, pausedAt, finishedAt]
      properties:
        id: { type: string, format: uuid }
        workerId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        workerName: { oneOf: [{ type: string }, { type: 'null' }] }
        workerGroupId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        workerGroupName: { oneOf: [{ type: string }, { type: 'null' }] }
        status: { type: string, enum: [ACTIVE, PAUSED, DONE, CANCELLED] }
        assignedAt: { type: string, format: date-time }
        startedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        pausedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        finishedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
      additionalProperties: false
    WorkerFeedEntry:
      type: object
      required: [entryId, version, taskId, routeIndex, routeStepCount, title, unitNumber, taskText, scheduledDate, deadlineAt, priority, queuePosition, entryType, pinned, status, availabilityMode, driverAudience, plannedDurationMinutes, activeStartedAt, activeWorkSeconds, timerSnapshot, assignments, readyEvidenceCount, resultPhotoMinCount]
      properties:
        entryId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        taskId: { type: string, format: uuid }
        routeIndex: { type: integer, minimum: 0 }
        routeStepCount:
          description: Authoritative total number of route steps for the task.
          type: integer
          minimum: 1
        title: { type: string, minLength: 1 }
        unitNumber: { oneOf: [{ type: string }, { type: 'null' }] }
        taskText: { oneOf: [{ type: string }, { type: 'null' }] }
        scheduledDate: { type: string, format: date }
        deadlineAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        priority: { type: integer, minimum: 1, maximum: 5 }
        queuePosition: { type: integer, minimum: 0 }
        entryType:
          description: REAL is executable; SHADOW reserves a future route position and is read-only.
          type: string
          enum: [REAL, SHADOW]
        pinned:
          description: Manager pin that keeps a real card ahead of newly promoted unpinned work.
          type: boolean
        status: { type: string, enum: [WAITING, IN_PROGRESS, PAUSED, DONE, CANCELLED] }
        availabilityMode: { type: string, enum: [AVAILABLE, MANDATORY, SECONDARY_PENDING, REQUIRED_JOIN, OPTIONAL_JOIN] }
        driverAudience:
          description: >-
            Server-owned classification for WorkerApp tables. Null denotes
            ordinary work; a non-null value denotes logistics driver work.
          oneOf:
            - { $ref: '#/components/schemas/DriverTaskAudience' }
            - { type: 'null' }
        plannedDurationMinutes: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        activeStartedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        activeWorkSeconds: { type: integer, format: int64, minimum: 0 }
        timerSnapshot:
          oneOf:
            - { $ref: '#/components/schemas/TaskTimerSnapshot' }
            - { type: 'null' }
        assignments:
          type: array
          items: { $ref: '#/components/schemas/WorkerAssignmentSnapshot' }
        readyEvidenceCount: { type: integer, minimum: 0 }
        resultPhotoMinCount: { type: integer, minimum: 0, maximum: 20 }
      additionalProperties: false
    WorkerFeedCategory:
      type: object
      required: [category, entries]
      properties:
        category: { $ref: '#/components/schemas/WorkerCategory' }
        entries:
          type: array
          items: { $ref: '#/components/schemas/WorkerFeedEntry' }
      additionalProperties: false
    WorkerFeed:
      type: object
      required: [revision, serverTime, categories, nextCursor]
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
        serverTime: { type: string, format: date-time }
        categories:
          type: array
          items: { $ref: '#/components/schemas/WorkerFeedCategory' }
        nextCursor:
          oneOf:
            - { type: string, minLength: 1, maxLength: 512 }
            - { type: 'null' }
      additionalProperties: false
    WorkerTaskObject:
      type: object
      required: [kind, id, label]
      properties:
        kind: { type: string, enum: [CABIN, EQUIPMENT, OTHER] }
        id: { oneOf: [{ type: string }, { type: 'null' }] }
        label: { type: string, minLength: 1 }
      additionalProperties: false
    WorkerMaterial:
      type: object
      required: [id, name, quantity, unit]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        quantity: { type: number, minimum: 0 }
        unit: { oneOf: [{ type: string }, { type: 'null' }] }
      additionalProperties: false
    WorkerWork:
      type: object
      required: [id, name, quantity, unit, durationMinutes, comment, sourceMediaIds]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        quantity: { type: number, minimum: 0 }
        unit: { oneOf: [{ type: string }, { type: 'null' }] }
        durationMinutes: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        comment: { oneOf: [{ type: string }, { type: 'null' }] }
        sourceMediaIds:
          description: Identities to resolve against WorkerTaskDetail.sourceMedia for this work.
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
      additionalProperties: false
    WorkerVisibleComment:
      type: object
      required: [id, text, authorDisplayName, createdAt]
      properties:
        id: { type: string, format: uuid }
        text: { type: string, minLength: 1 }
        authorDisplayName: { oneOf: [{ type: string }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
      additionalProperties: false
    WorkerMediaReference:
      type: object
      required: [mediaId, generation, kind, contentType, readPath, thumbnailPath, capturedAt, recordedAt]
      properties:
        mediaId: { type: string, format: uuid }
        generation: { type: integer, format: int64, minimum: 1 }
        kind: { type: string, enum: [SOURCE, RESULT] }
        contentType: { type: string }
        readPath:
          type: string
          format: uri-reference
          pattern: '^/api/media/'
        thumbnailPath:
          oneOf:
            - { type: string, format: uri-reference, pattern: '^/api/media/' }
            - { type: 'null' }
        capturedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        recordedAt: { type: string, format: date-time }
      additionalProperties: false
    WorkerRelatedStep:
      type: object
      required: [entryId, routeIndex, queueName, taskText, status]
      properties:
        entryId: { type: string, format: uuid }
        routeIndex: { type: integer, minimum: 0 }
        queueName: { type: string }
        taskText: { oneOf: [{ type: string }, { type: 'null' }] }
        status: { type: string, enum: [WAITING, IN_PROGRESS, PAUSED, DONE, CANCELLED] }
      additionalProperties: false
    TaskEvidence:
      type: object
      required: [evidenceId, version, entryId, routeIndex, workerId, workerGroupId, capturedAt, recordedAt, state, mediaId, mediaGeneration, reviewReason, contentType, readPath, thumbnailPath]
      properties:
        evidenceId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        entryId: { type: string, format: uuid }
        routeIndex: { type: integer, minimum: 0 }
        workerId: { type: string, format: uuid }
        workerGroupId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        capturedAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        state: { type: string, enum: [RESERVED, UPLOADING, READY, REVIEW_REQUIRED, REJECTED] }
        mediaId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        mediaGeneration: { oneOf: [{ type: integer, format: int64, minimum: 1 }, { type: 'null' }] }
        reviewReason: { oneOf: [{ type: string }, { type: 'null' }] }
        contentType: { oneOf: [{ type: string }, { type: 'null' }] }
        readPath:
          oneOf:
            - { type: string, format: uri-reference, pattern: '^/api/media/' }
            - { type: 'null' }
        thumbnailPath:
          oneOf:
            - { type: string, format: uri-reference, pattern: '^/api/media/' }
            - { type: 'null' }
      additionalProperties: false
    WorkerTaskDetail:
      type: object
      required: [entryId, version, taskId, source, routeIndex, title, description, object, taskText, scheduledDate, deadlineAt, priority, queuePosition, status, availabilityMode, plannedDurationMinutes, activeStartedAt, activeWorkSeconds, timerSnapshot, audienceSelectors, assignments, works, materials, comments, sourceMedia, evidence, relatedSteps, resultPhotoMinCount, completionAllowed]
      properties:
        entryId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        taskId: { type: string, format: uuid }
        source: { oneOf: [{ $ref: '#/components/schemas/TaskSourceReference' }, { type: 'null' }] }
        routeIndex: { type: integer, minimum: 0 }
        title: { type: string, minLength: 1 }
        description: { oneOf: [{ type: string }, { type: 'null' }] }
        object: { oneOf: [{ $ref: '#/components/schemas/WorkerTaskObject' }, { type: 'null' }] }
        taskText: { oneOf: [{ type: string }, { type: 'null' }] }
        scheduledDate: { type: string, format: date }
        deadlineAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        priority: { type: integer, minimum: 1, maximum: 5 }
        queuePosition: { type: integer, minimum: 0 }
        status: { type: string, enum: [WAITING, IN_PROGRESS, PAUSED, DONE, CANCELLED] }
        availabilityMode: { type: string, enum: [AVAILABLE, MANDATORY, SECONDARY_PENDING, REQUIRED_JOIN, OPTIONAL_JOIN] }
        plannedDurationMinutes: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        activeStartedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        activeWorkSeconds: { type: integer, format: int64, minimum: 0 }
        timerSnapshot:
          oneOf:
            - { $ref: '#/components/schemas/TaskTimerSnapshot' }
            - { type: 'null' }
        audienceSelectors:
          type: array
          items: { $ref: '#/components/schemas/AudienceSelector' }
        assignments:
          type: array
          items: { $ref: '#/components/schemas/WorkerAssignmentSnapshot' }
        works:
          type: array
          items: { $ref: '#/components/schemas/WorkerWork' }
        materials:
          type: array
          items: { $ref: '#/components/schemas/WorkerMaterial' }
        comments:
          type: array
          items: { $ref: '#/components/schemas/WorkerVisibleComment' }
        sourceMedia:
          description: >-
            Server-ordered source media. A source-defined task cover is first; WorkerWork.sourceMediaIds
            identifies the remaining references that belong to each individual work.
          type: array
          items: { $ref: '#/components/schemas/WorkerMediaReference' }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/TaskEvidence' }
        relatedSteps:
          type: array
          items: { $ref: '#/components/schemas/WorkerRelatedStep' }
        resultPhotoMinCount: { type: integer, minimum: 0, maximum: 20 }
        completionAllowed: { type: boolean }
      additionalProperties: false
    WorkerActionRequest:
      type: object
      required: [operationId, action, expectedVersion, workerGroupId, occurredAt, offlineLeaseId, evidenceId]
      properties:
        operationId: { type: string, format: uuid }
        action: { type: string, enum: [TAKE, JOIN, PAUSE, RESUME, COMPLETE] }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        workerGroupId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        occurredAt: { type: string, format: date-time }
        offlineLeaseId: { type: string, format: uuid }
        evidenceId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
      additionalProperties: false
    DriverActionRequest:
      type: object
      required: [operationId, action, expectedVersion, workerGroupId, occurredAt, offlineLeaseId, evidenceId]
      properties:
        operationId: { type: string, format: uuid }
        action: { type: string, enum: [TAKE, PAUSE, RESUME, COMPLETE] }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        workerGroupId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        occurredAt: { type: string, format: date-time }
        offlineLeaseId: { type: string, format: uuid }
        evidenceId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
      additionalProperties: false
    WorkerActionAppliedResult:
      type: object
      required: [outcome, currentVersion, entry]
      properties:
        outcome: { type: string, enum: [APPLIED, REPLAYED] }
        currentVersion: { type: integer, format: int64, minimum: 0 }
        entry: { $ref: '#/components/schemas/WorkerTaskDetail' }
      additionalProperties: false
    WorkerActionConflictProblem:
      type: object
      required: [type, title, status, detail, instance, code, violations, correlation, outcome, currentVersion, currentEntry]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string, minLength: 1 }
        status: { type: integer, const: 409 }
        detail: { oneOf: [{ type: string }, { type: 'null' }] }
        instance: { oneOf: [{ type: string, format: uri-reference }, { type: 'null' }] }
        code: { type: string, minLength: 1 }
        violations:
          type: array
          items: { $ref: '#/components/schemas/FieldViolation' }
        correlation: { $ref: '#/components/schemas/CorrelationContext' }
        outcome: { type: string, const: CONFLICT }
        currentVersion: { type: integer, format: int64, minimum: 0 }
        currentEntry:
          oneOf:
            - { $ref: '#/components/schemas/WorkerTaskDetail' }
            - { type: 'null' }
      additionalProperties: false
    EvidenceReservationRequest:
      type: object
      required: [operationId, evidenceId, routeIndex, capturedAt, offlineLeaseId, contentType, sizeBytes, sha256]
      properties:
        operationId: { type: string, format: uuid }
        evidenceId: { type: string, format: uuid }
        routeIndex: { type: integer, minimum: 0 }
        capturedAt: { type: string, format: date-time }
        offlineLeaseId: { type: string, format: uuid }
        contentType: { type: string, enum: [image/jpeg, image/webp] }
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 15728640 }
        sha256:
          description: >-
            Exact JPEG checksum for a source upload, or the deterministic
            client-variant manifest checksum for an image/webp logical bundle.
          type: string
          pattern: '^[0-9a-f]{64}$'
      oneOf:
        - properties:
            contentType: { const: image/jpeg }
            sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 15728640 }
        - properties:
            contentType: { const: image/webp }
            sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 1048576 }
      additionalProperties: false
    WorkerInvalidationEvent:
      type: object
      required: [eventId, revision, type, entryId, occurredAt]
      properties:
        eventId: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 0 }
        type: { type: string, enum: [CONTEXT_CHANGED, FEED_CHANGED, ENTRY_CHANGED, NEW_TASK, URGENT_TASK, TASK_JOIN_AVAILABLE, DEVICE_REVOKED] }
        entryId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        occurredAt: { type: string, format: date-time }
      additionalProperties: false
    WorkerDeviceRegistrationRequest:
      type: object
      required: [provider, token, appVersion, sdkInt, locale]
      properties:
        provider: { type: string, const: FCM }
        targetKind:
          type: string
          enum: [TOKEN, FID]
          default: TOKEN
          description: >-
            Firebase target represented by token. Omission means the legacy FCM
            registration-token form; current Android clients send FID.
        token:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
          description: Registration token or Firebase Installation ID according to targetKind.
        appVersion: { type: string, minLength: 1, maxLength: 64 }
        sdkInt: { type: integer, minimum: 23, maximum: 1000 }
        locale: { type: string, minLength: 2, maxLength: 35 }
      additionalProperties: false
    WorkerDeviceRegistration:
      type: object
      required: [installationId, provider, status, registeredAt, updatedAt]
      properties:
        installationId: { type: string, minLength: 1, maxLength: 128 }
        provider: { type: string, const: FCM }
        status: { type: string, enum: [ACTIVE, REVOKED] }
        registeredAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      additionalProperties: false
    FieldViolation:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
      additionalProperties: false
    CorrelationContext:
      type: object
      required: [correlationId, causationId]
      properties:
        correlationId: { type: string, format: uuid }
        causationId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
      additionalProperties: false
    ApiProblem:
      type: object
      required: [type, title, status, detail, instance, code, violations, correlation]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string, minLength: 1 }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { oneOf: [{ type: string }, { type: 'null' }] }
        instance: { oneOf: [{ type: string, format: uri-reference }, { type: 'null' }] }
        code: { type: string, minLength: 1 }
        violations:
          type: array
          items: { $ref: '#/components/schemas/FieldViolation' }
        correlation: { $ref: '#/components/schemas/CorrelationContext' }
      additionalProperties: false
  responses:
    KpiSettingsOk:
