      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelLogisticsEquipmentMovementTaskRequest' }
      responses:
        '200':
          description: Current source-owned equipment movement task snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsTaskSnapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/logistics/planning-assignments/{sourcePlanId}:
    put:
      operationId: replaceLogisticsPlanningAssignments
      description: >-
        Replaces one complete, still-unstarted logistics source-plan membership and its driver
        shifts in one task-board transaction. Every task, entry, source lineage, queue position,
