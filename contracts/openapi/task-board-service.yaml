      required: [entryId, version, routeIndex, routeStepIndex, routeStepCount, queueName, taskText, status, plannedDurationMinutes, works, materials, comments, sourceMedia, resultPhotoMinCount, evidence, completionAllowed]
      properties:
        entryId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
