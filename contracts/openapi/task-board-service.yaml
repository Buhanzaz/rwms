        unitNumber: { oneOf: [{ type: string }, { type: 'null' }] }
        description: { oneOf: [{ type: string }, { type: 'null' }] }
        status: { type: string, enum: [ACTIVE, DONE, CANCELLED] }
        plannedDurationMinutes: { oneOf: [{ type: integer }, { type: 'null' }] }
        deadlineAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
