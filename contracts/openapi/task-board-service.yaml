        groupIds:
          description: >-
            Current worker groups whose worker class is bound to this queue.
            An empty list denotes a qualification-only or individual queue.
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        resultPhotoMinCount: { type: integer, minimum: 0, maximum: 20 }
      additionalProperties: false
    WorkerKpiPaletteRange:
      type: object
      required: [fromPercent, toPercent, color]
      properties:
        fromPercent: { type: integer, minimum: 0, maximum: 100 }
        toPercent: { type: integer, minimum: 0, maximum: 100 }
        color: { type: string, pattern: '^#[0-9A-F]{6}$' }
      additionalProperties: false
    WorkerKpiPalette:
      type: object
      required: [ranges, overdueColor]
      properties:
        ranges:
          type: array
          minItems: 1
          maxItems: 6
          items: { $ref: '#/components/schemas/WorkerKpiPaletteRange' }
        overdueColor: { type: string, pattern: '^#[0-9A-F]{6}$' }
      additionalProperties: false
    WorkerOfflineLease:
      type: object
      required: [id, issuedAt, expiresAt, syncRevision]
      properties:
        id: { type: string, format: uuid }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        syncRevision: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    WorkerProfileAvatarScope:
      type: object
      required: [ownerType, ownerId, warehouseId, context]
      properties:
        ownerType: { const: TASK_BOARD_WORKER_PROFILE }
        ownerId:
          description: Authenticated worker identity; clients cannot select another owner.
          type: string
          format: uuid
        warehouseId: { type: string, format: uuid }
        context: { const: PROFILE_AVATAR }
      additionalProperties: false
    WorkerContext:
      type: object
      required: [worker, currentGroup, operationalAvailability, groups, qualifications, categories, kpiPalette, serverTime, revision, offlineLease]
      properties:
        worker: { $ref: '#/components/schemas/WorkerIdentity' }
        currentGroup:
          oneOf:
            - { $ref: '#/components/schemas/WorkerGroupSummary' }
            - { type: 'null' }
        operationalAvailability: { type: string, enum: [AVAILABLE, DISABLED] }
        groups:
          type: array
          items: { $ref: '#/components/schemas/WorkerGroupSummary' }
        qualifications:
          type: array
          items: { $ref: '#/components/schemas/WorkerQualificationSummary' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/WorkerCategory' }
        kpiPalette:
          oneOf:
            - { $ref: '#/components/schemas/WorkerKpiPalette' }
            - { type: 'null' }
        serverTime: { type: string, format: date-time }
        revision: { type: integer, format: int64, minimum: 0 }
        offlineLease: { $ref: '#/components/schemas/WorkerOfflineLease' }
      additionalProperties: false
    WorkerAssignmentSnapshot:
      type: object
      required: [id, workerId, workerName, workerGroupId, workerGroupName, status, assignedAt, startedAt, pausedAt, finishedAt]
      properties:
        id: { type: string, format: uuid }
        workerId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        workerName: { oneOf: [{ type: string }, { type: 'null' }] }
        workerGroupId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        workerGroupName: { oneOf: [{ type: string }, { type: 'null' }] }
        status: { type: string, enum: [ACTIVE, PAUSED, DONE, CANCELLED] }
        assignedAt: { type: string, format: date-time }
        startedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        pausedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        finishedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
      additionalProperties: false
    WorkerFeedEntry:
      type: object
      required: [entryId, version, taskId, routeIndex, routeStepIndex, routeStepCount, title, unitNumber, taskText, scheduledDate, deadlineAt, priority, queuePosition, entryType, pinned, status, availabilityMode, driverAudience, plannedDurationMinutes, activeStartedAt, activeWorkSeconds, timerSnapshot, assignments, readyEvidenceCount, resultPhotoMinCount]
      properties:
        entryId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        taskId: { type: string, format: uuid }
        routeIndex:
          description: Raw persisted route-row identity used by evidence and commands; it is not an execution-package ordinal.
          type: integer
          minimum: 0
        routeStepIndex:
          description: >-
            Zero-based worker execution-package ordinal. Every non-maintenance route row is one
            package. For MAINTENANCE_REPAIR, consecutive rows of the same physical queue share an
            ordinal; the same queue after another queue starts a new package.
          type: integer
          minimum: 0
        routeStepCount:
          description: >-
            Authoritative total number of worker execution packages. Every non-maintenance route
            row is one package. For MAINTENANCE_REPAIR this counts consecutive same-physical-queue
            segments, so an A-B-A route has three packages.
          type: integer
          minimum: 1
        title: { type: string, minLength: 1 }
        unitNumber: { oneOf: [{ type: string }, { type: 'null' }] }
        taskText: { oneOf: [{ type: string }, { type: 'null' }] }
        scheduledDate: { type: string, format: date }
        deadlineAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        priority: { type: integer, minimum: 1, maximum: 5 }
        queuePosition: { type: integer, minimum: 0 }
        entryType:
          description: >-
            REAL is eligible for execution; SHADOW reserves a manager-visible,
            read-only future route position. Manager promotion may make more
            than one ordinary route step REAL at the same time.
          type: string
          enum: [REAL, SHADOW]
        pinned:
          description: Manager pin that keeps a real card ahead of newly promoted unpinned work.
          type: boolean
        status: { type: string, enum: [WAITING, IN_PROGRESS, PAUSED, DONE, CANCELLED] }
        availabilityMode: { type: string, enum: [AVAILABLE, MANDATORY, SECONDARY_PENDING, REQUIRED_JOIN, OPTIONAL_JOIN] }
        driverAudience:
          description: >-
            Server-owned classification for WorkerApp tables. Null denotes
            ordinary work; a non-null value denotes logistics driver work.
          oneOf:
            - { $ref: '#/components/schemas/DriverTaskAudience' }
            - { type: 'null' }
        plannedDurationMinutes: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        activeStartedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        activeWorkSeconds: { type: integer, format: int64, minimum: 0 }
        timerSnapshot:
          oneOf:
            - { $ref: '#/components/schemas/TaskTimerSnapshot' }
            - { type: 'null' }
        assignments:
          type: array
          items: { $ref: '#/components/schemas/WorkerAssignmentSnapshot' }
        readyEvidenceCount: { type: integer, minimum: 0 }
        resultPhotoMinCount: { type: integer, minimum: 0, maximum: 20 }
      additionalProperties: false
    WorkerFeedCategory:
