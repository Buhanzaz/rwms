        unit: { oneOf: [{ type: string }, { type: 'null' }] }
      additionalProperties: false
    WorkerWork:
      type: object
      required: [id, name, quantity, unit, durationMinutes, comment, sourceMediaIds]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        quantity: { type: number, minimum: 0 }
        unit: { oneOf: [{ type: string }, { type: 'null' }] }
        durationMinutes: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        comment: { oneOf: [{ type: string }, { type: 'null' }] }
        sourceMediaIds:
