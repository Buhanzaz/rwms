    WorkerCategory:
      type: object
      required: [queueId, name, type, queuePurpose, sortOrder, audienceModes, groupIds, resultPhotoMinCount]
      properties:
        queueId: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        type: { type: string, enum: [MOVEMENT, REPAIR, HOLDING, FURNITURE_MOVEMENT] }
