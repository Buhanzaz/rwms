      description: >-
        Private least-privilege logistics-service directory. Requires exactly the
        logistics-service SERVICE principal with one task-board.logistics scope.
        Staff must hold an active qualification for the primary class of their
        home warehouse's active LOGISTICS_DRIVER queue. Time-bounded contractor
        profiles are eligible only during their contract. Login, credentials and
        groups are never exposed; contractor phone is the only contact field.
        Operational assignments do not rewrite the home warehouse. IN_TRANSIT
        drivers are excluded. A PLANNED driver stops being available at the source
