        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/logistics/operational-assignments:
    post:
      operationId: createInternalWorkerOperationalAssignment
      description: >-
        Creates a PLANNED transfer-backed assignment without changing Worker.warehouseId.
        travelStartsAt begins the driver's all-warehouse unavailability, while
        effectiveFrom begins destination availability after arrival and buffer.
        The transferId+workerId identity makes identical retries safe. The command
        locks the worker and rejects overlapping nonterminal travel/assignment intervals.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkerOperationalAssignmentRequest' }
      responses:
        '201':
          description: Created assignment or identical replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerOperationalAssignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      operationId: listInternalWorkerOperationalAssignments
      description: Requires exactly one transferId or workerId filter.
      parameters:
        - name: transferId
          in: query
