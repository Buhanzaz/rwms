openapi: 3.1.0
info:
  title: RWMS Task Board Service API
  version: 1.19.0
  description: >-
    Canonical F2 inventory of the active task-board, workforce and queue
    registry HTTP API. All warehouse-scoped operations validate the warehouse
    claim locally. Internal queue-reference operations require a SERVICE
    principal, queue-registry.write and an allow-listed client_id. The private
    maintenance preflight requires the exact maintenance-service task-sync
    identity. The private logistics surface also exposes one exact assigned
    contractor's task execution without granting DriverApp credentials or
    general-board access.
servers:
  - url: /api
security:
  - bearerJwt: []
paths:
  /queue-definitions:
    get:
      operationId: listQueueDefinitions
      description: >-
        Returns the shared system queue catalog. GENERAL definitions are the
        one task-board standard: every active warehouse receives a derived
        physical queue projection with the same order, state and classes.
        LOGISTICS_DRIVER remains configured by the logistics endpoint.
      responses:
        '200': { $ref: '#/components/responses/QueueDefinitionListOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createQueueDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueueDefinitionRequest' }
      responses:
        '201': { $ref: '#/components/responses/QueueDefinitionCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /queue-definitions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: updateQueueDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueueDefinitionRequest' }
      responses:
        '200': { $ref: '#/components/responses/QueueDefinitionOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteQueueDefinition
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /queue-definitions/{id}/link:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: linkQueueDefinitions
      description: >-
        Requires global management and rwms.write. Atomically links two GENERAL
        working queues under both observed definition versions, or unlinks the
        existing pair when linkedQueueDefinitionId is null. Queues cannot link
        to themselves, HOLDING or LOGISTICS_DRIVER; both need a common PRIMARY
        worker class. Each queue belongs to at most one symmetric pair.
        One member takes ordinary work for all active current group members;
        any assigned member completes it for the group. Assignments record their
        primary TAKE role immutably; older unknown roles create no reservation.
        A group that completes a stage keeps its consecutive waiting REAL
        continuation in the linked queue. TAKE still starts the next timer.
        Other groups cannot take that continuation; while it is in the active
        WorkerApp plan, its group takes it before unrelated waiting work.
        Unavailable groups, inactive definitions and nonconsecutive route steps
        do not create a continuation reservation. Existing pairs must be
        unlinked before choosing a different partner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueueLinkRequest' }
      responses:
        '200': { $ref: '#/components/responses/QueueDefinitionListOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /queue-definitions/order:
    put:
      operationId: reorderQueueDefinitions
      description: >-
        Reorders custom GENERAL task-board definitions for every warehouse.
        Canonical repair phases remain fixed first in this relative order:
        SES, welding, exterior, interior, electrical, plumbing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueueDefinitionOrderRequest' }
      responses:
        '200': { $ref: '#/components/responses/QueueDefinitionListOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/work-queues:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: listWorkQueues
      responses:
        '200': { $ref: '#/components/responses/WorkQueueListOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /warehouses/{warehouseId}/work-queues/{queueId}/worker-plan:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/QueueId'
    put:
      operationId: updateWorkerQueuePlan
      description: >-
        Requires USER, rwms.write and MANAGE. Changes only this warehouse's
        WorkerApp publication switch and waiting REAL plan window. Turning the
        switch off removes the whole queue from WorkerApp, including active work.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerQueuePlanRequest' }
      responses:
        '200': { $ref: '#/components/responses/WorkQueueOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/driver-queue:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    put:
      operationId: updateDriverQueue
      description: >-
        Creates or updates the warehouse-specific LOGISTICS_DRIVER queue.
        The request cannot select or replace a queue definition.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverQueueRequest' }
      responses:
        '200': { $ref: '#/components/responses/WorkQueueOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/queue-capabilities:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: getWarehouseQueueCapabilities
      description: >-
        Reports process capabilities from active, visible warehouse bindings.
      responses:
        '200': { $ref: '#/components/responses/WarehouseQueueCapabilitiesOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /internal/queue-definitions/{queueDefinitionId}/references:
    parameters:
      - name: queueDefinitionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: registerQueueReference
      description: Requires SERVICE, queue-registry.write and an allow-listed client_id.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueueReferenceRequest' }
      responses:
        '200': { $ref: '#/components/responses/QueueReferenceOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/queue-definitions/references/{type}/{externalReferenceId}:
    parameters:
      - $ref: '#/components/parameters/QueueReferenceType'
      - $ref: '#/components/parameters/ExternalReferenceId'
    delete:
      operationId: deleteQueueReference
      description: Requires SERVICE, queue-registry.write and an allow-listed client_id.
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/maintenance/routing-preflight:
    post:
      operationId: preflightMaintenanceRouting
      description: >-
        Read-only private bulk check for maintenance-service. Requires a SERVICE
        token whose sub and client_id are both maintenance-service and whose scope
        list is exactly task-board.task-sync. Every queueDefinitionId is resolved
        to this warehouse's binding; no name or legacy identifier lookup is
        performed. The binding must be active and visible. Missing global
        definitions, missing warehouse bindings and mismatches are returned
        separately. The operation never creates, updates or reserves a queue.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceRoutingPreflightRequest' }
      responses:
        '200': { $ref: '#/components/responses/MaintenanceRoutingPreflightOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /internal/task-board/v1/maintenance/catalog-routing-preflight:
    post:
      operationId: preflightMaintenanceCatalogRouting
      description: >-
        Validates category-to-queue links against global queue definitions
        without requiring any warehouse binding. This is the catalog boundary;
        warehouse routing is validated separately by routing-preflight.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogRoutingPreflightRequest' }
      responses:
        '200': { $ref: '#/components/responses/CatalogRoutingPreflightOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /internal/task-board/v1/warehouses/{warehouseId}/queue-capabilities:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: getInternalWarehouseQueueCapabilities
      description: Private maintenance-service view of stable warehouse process capabilities.
      responses:
        '200': { $ref: '#/components/responses/WarehouseQueueCapabilitiesOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /internal/task-board/v1/inventory/warehouses/{warehouseId}/work-calendar:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: getInventoryWorkCalendarSnapshot
      description: >-
        Private inventory-service read of task-board's effective-dated object work calendar.
        Requires exactly the inventory-service SERVICE principal with the sole
        task-board.inventory-calendar.read scope. The inclusive range is bounded to 366
        warehouse-local dates. Each date carries the authoritative timezone fact and effective
        schedule version; null schedule fields mean that no activated schedule applies, so the
        date is unavailable for inventory planning. The fingerprint covers only the returned
        calendar evidence, not palette or other KPI presentation state.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: through
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/InventoryWorkCalendarSnapshotOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /worker-classes:
    get:
      operationId: listWorkerClasses
      responses:
        '200': { $ref: '#/components/responses/WorkerClassListOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createWorkerClass
      requestBody:
        $ref: '#/components/requestBodies/WorkerClass'
      responses:
        '201': { $ref: '#/components/responses/WorkerClassCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /worker-classes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: updateWorkerClass
      requestBody:
        $ref: '#/components/requestBodies/WorkerClass'
      responses:
        '200': { $ref: '#/components/responses/WorkerClassOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteWorkerClass
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: getTaskBoard
      description: >-
        Returns one aggregate ordinary operational-board representation. Each
        ordinary queue contains every unfinished REAL and SHADOW route entry in
        canonical active/pinned/position order. availableTaskLimit and
        workerFeedEnabled are warehouse-local WorkerApp publication controls;
        they do not truncate this manager response or fence manager TAKE.
        SHADOW remains read-only. The earliest unfinished route step is REAL by
        default; a manager may explicitly expose another future step through
        the version-fenced future-availability command so those REAL steps can
        execute in parallel without bypassing an unfinished SES phase.
        If-None-Match is evaluated with a weak semantic ETag over stable snapshot
        state. Rolling timer counters and serverTime do not invalidate the ETag;
        timer state and the next transition do.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: Current task-board snapshot for the requested representation.
          headers:
            ETag:
              required: true
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskBoardSnapshot' }
        '304':
          description: The requested task-board representation has not changed.
          headers:
            ETag:
              required: true
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /warehouses/{warehouseId}/task-board/daily-brigade-activity:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: getDailyBrigadeActivity
      description: >-
        Returns assignment intervals that actually started and overlap the
        current calendar day in the warehouse timezone effective at serverTime.
        startedAt is the persisted TAKE timestamp and finishedAt is the
        persisted completion timestamp; configured workday bounds never replace
        either value. Overlapping legacy route duplicates and joined-worker
        assignments for the same brigade, task and physical queue are
        coalesced. A live overlap keeps finishedAt null, while completed
        overlaps use their latest finish. Non-overlapping retakes remain
        distinct intervals.
      responses:
        '200': { $ref: '#/components/responses/DailyBrigadeActivityOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502':
          description: The authoritative warehouse timezone dependency is unavailable.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiProblem' }
  /warehouses/{warehouseId}/task-board/logistics:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: getDriverLogisticsBoard
      description: >-
        Returns the dedicated driver queue as one sticky CURRENT lane followed
        by the finite set of non-empty scheduled-date columns. Ordinary repair
        queues are not mixed into this response.
      responses:
        '200':
          description: Current driver-logistics board.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsBoardSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /kpi-palette:
    get:
      operationId: getKpiPalette
      description: >-
        Returns the installation-wide KPI palette shared by every warehouse.
      responses:
        '200': { $ref: '#/components/responses/KpiPaletteOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: replaceKpiPalette
      description: >-
        Replaces the version-fenced KPI palette shared by every warehouse of the
        installation. Global management authority is required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveKpiPaletteRequest' }
      responses:
        '200': { $ref: '#/components/responses/KpiPaletteOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /kpi-settings:
    get:
      operationId: getKpiSettings
      description: >-
        Returns the KPI palette and work schedule shared by every warehouse.
      responses:
        '200': { $ref: '#/components/responses/KpiSettingsOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /kpi-settings/work-schedule:
    put:
      operationId: replacePendingKpiWorkSchedule
      description: >-
        Saves one version-fenced pending schedule whose effectiveFrom is the
        current UTC configuration date or a later date. After activation, every
        warehouse applies the same effective local date and shift policy through
        its own authoritative timezone.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveKpiWorkScheduleRequest' }
      responses:
        '200': { $ref: '#/components/responses/KpiSettingsOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /kpi-settings/work-schedule/pending:
    delete:
      operationId: deletePendingKpiWorkSchedule
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /kpi-settings/activate:
    post:
      operationId: activateKpiSettings
      description: >-
        Idempotently activates the pending installation-wide schedule. Every warehouse
        then resolves the shared revision against its own local calendar and
        authoritative timezone.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivateKpiSettingsRequest' }
      responses:
        '200': { $ref: '#/components/responses/KpiSettingsOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/queues/{queueId}/eligible-groups:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/QueueId'
    get:
      operationId: listEligibleWorkerGroups
      responses:
        '200': { $ref: '#/components/responses/WorkerGroupListOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /warehouses/{warehouseId}/task-board/entries/{entryId}/history:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/EntryId'
    get:
      operationId: getTaskEntryHistory
      responses:
        '200': { $ref: '#/components/responses/TimeEventListOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /warehouses/{warehouseId}/task-board/tasks:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    post:
      operationId: registerBoardTask
      description: >-
        Requires USER, rwms.write and EDIT. An identical externalTaskId replay
        returns the current snapshot without another event; changed immutable
        data or another warehouse returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBoardTaskRequest' }
      responses:
        '201': { $ref: '#/components/responses/TaskBoardSnapshotCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/tasks/by-external-id/{externalTaskId}:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/ExternalTaskId'
    get:
      operationId: getBoardTaskByExternalId
      responses:
        '200':
          description: Current registered task and its complete route
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardTaskRegistration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /warehouses/{warehouseId}/task-board/tasks/by-external-id/{externalTaskId}/cancel:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/ExternalTaskId'
    post:
      operationId: cancelBoardTaskByExternalId
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelTaskRequest' }
      responses:
        '200':
          description: Current cancelled task state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancelledTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/tasks:
    post:
      operationId: registerExternalBoardTask
      description: >-
        Private only. Accepts either the maintenance-service SERVICE principal
        with exactly task-board.task-sync or the logistics-service SERVICE
        principal with exactly task-board.logistics. externalTaskId and a
        source reference owned by that caller are mandatory for driver tasks.
        Identical replay by the same authenticated source returns the existing
        registration; changed immutable input or another source returns 409.
        Ordinary maintenance work is registered into one aggregate priority
        queue; scheduledDate does not partition the ordinary board.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterExternalTaskRequest' }
      responses:
        '201':
