          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/TaskMaterialSnapshotRequest' }
        comments:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/TaskCommentSnapshotRequest' }
