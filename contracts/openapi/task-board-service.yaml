        queueDefinitionId: { type: string, format: uuid }
        workQueueId: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [MOVEMENT, REPAIR, HOLDING, FURNITURE_MOVEMENT] }
      additionalProperties: false
    Assignment:
      type: object
      required: [id, version, workerId, workerName, workerGroupId, workerGroupName, status, assignedAt, startedAt, pausedAt, finishedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        workerId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        workerName: { oneOf: [{ type: string }, { type: 'null' }] }
        workerGroupId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        workerGroupName: { oneOf: [{ type: string }, { type: 'null' }] }
        status: { type: string, enum: [ACTIVE, PAUSED, DONE, CANCELLED] }
        assignedAt: { type: string, format: date-time }
        startedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        pausedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        finishedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
      additionalProperties: false
    TaskTimerSnapshot:
      type: object
      required: [countedActiveSeconds, remainingSeconds, remainingPercent, timerState, nextTransitionAt, serverTime]
      properties:
        countedActiveSeconds: { type: integer, format: int64, minimum: 0 }
        remainingSeconds: { oneOf: [{ type: integer, format: int64 }, { type: 'null' }] }
        remainingPercent: { oneOf: [{ type: number }, { type: 'null' }] }
        timerState: { type: string, enum: [WORKING, BREAK, OFF_SHIFT, PAUSED, DONE] }
        nextTransitionAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        serverTime: { type: string, format: date-time }
      additionalProperties: false
    BoardEntry:
      type: object
      required: [id, version, taskId, externalTaskId, source, taskVersion, title, unitNumber, taskStatus, scheduledDate, lane, priority, pinned, driverAudience, queueId, queuePurpose, routeIndex, queuePosition, entryType, status, taskText, plannedDurationMinutes, activeStartedAt, pausedAt, activeWorkSeconds, audienceSelectors, assignments, timerSnapshot]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        taskId: { type: string, format: uuid }
        externalTaskId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        source: { oneOf: [{ $ref: '#/components/schemas/TaskSourceReference' }, { type: 'null' }] }
        taskVersion: { type: integer, format: int64 }
        title: { type: string }
        unitNumber: { oneOf: [{ type: string }, { type: 'null' }] }
        taskStatus: { type: string, enum: [ACTIVE, DONE, CANCELLED] }
        scheduledDate: { type: string, format: date }
        lane: { $ref: '#/components/schemas/TaskLane' }
        priority: { type: integer, minimum: 1, maximum: 5 }
        pinned: { type: boolean }
        driverAudience:
          description: >-
            Always present. Null only for ordinary work outside a logistics
            driver queue.
          oneOf:
            - { $ref: '#/components/schemas/DriverTaskAudience' }
            - { type: 'null' }
        queueId: { type: string, format: uuid }
        queuePurpose: { $ref: '#/components/schemas/QueuePurpose' }
        routeIndex: { type: integer }
        queuePosition: { type: integer }
        entryType:
          description: >-
            REAL is eligible for execution; SHADOW is a manager-visible,
            read-only future route position. A future ordinary step may be
            explicitly promoted to REAL by a manager.
          type: string
          enum: [REAL, SHADOW]
        status: { type: string, enum: [WAITING, IN_PROGRESS, PAUSED, DONE, CANCELLED] }
        taskText: { oneOf: [{ type: string }, { type: 'null' }] }
        plannedDurationMinutes: { oneOf: [{ type: integer }, { type: 'null' }] }
        activeStartedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        pausedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        activeWorkSeconds: { type: integer, format: int64, minimum: 0 }
        audienceSelectors:
          type: array
          items: { $ref: '#/components/schemas/AudienceSelector' }
        assignments:
          type: array
          items: { $ref: '#/components/schemas/Assignment' }
        timerSnapshot:
          oneOf:
            - { $ref: '#/components/schemas/TaskTimerSnapshot' }
            - { type: 'null' }
      additionalProperties: false
    TaskSourceReference:
      type: object
      required: [type, sourceId]
      properties:
        type: { type: string, enum: [MAINTENANCE_REPAIR, LOGISTICS_DRIVER_TASK] }
        sourceId: { type: string, format: uuid }
      additionalProperties: false
    DailyBrigadeActivityInterval:
      type: object
      description: >-
        One actual assignment interval, optionally coalesced from overlapping
        legacy route or joined-worker rows for one brigade, task and physical
        queue. The representative entry is selected by route index and then UUID.
      required: [workerGroupId, workerGroupName, taskId, entryId, queueId, queueName, title, unitNumber, taskText, priority, startedAt, finishedAt, status, source]
      properties:
        workerGroupId: { type: string, format: uuid }
        workerGroupName: { type: string, minLength: 1 }
        taskId: { type: string, format: uuid }
        entryId:
          type: string
          format: uuid
          description: Deterministic representative route-entry identity.
        queueId:
          type: string
          format: uuid
          description: Physical warehouse queue identity.
        queueName: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        unitNumber: { oneOf: [{ type: string }, { type: 'null' }] }
        taskText: { oneOf: [{ type: string }, { type: 'null' }] }
        priority: { type: integer, minimum: 1, maximum: 5 }
        startedAt:
          type: string
          format: date-time
          description: Actual persisted assignment start recorded when the task was taken.
        finishedAt:
          description: Actual persisted completion time, or null while any coalesced assignment is live.
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
        status: { type: string, enum: [ACTIVE, PAUSED, DONE] }
        source:
          oneOf:
            - { $ref: '#/components/schemas/TaskSourceReference' }
            - { type: 'null' }
      additionalProperties: false
    DailyBrigadeActivity:
      type: object
      description: Current warehouse-local day and its authoritative task execution intervals.
      required: [warehouseId, localDate, serverTime, intervals]
      properties:
        warehouseId: { type: string, format: uuid }
        localDate:
          type: string
          format: date
          description: Calendar date in the warehouse timezone effective at serverTime.
        serverTime:
          type: string
          format: date-time
          description: UTC instant used to resolve localDate and open live intervals.
        intervals:
          type: array
          items: { $ref: '#/components/schemas/DailyBrigadeActivityInterval' }
      additionalProperties: false
    BoardColumn:
      type: object
      required: [queueId, queueVersion, queueName, queueType, queuePurpose, sortOrder, availableTaskLimit, workerFeedEnabled, linkedQueueId, linkedQueueName, entries]
      properties:
        queueId: { type: string, format: uuid }
        queueVersion: { type: integer, format: int64, minimum: 0 }
        queueName: { type: string }
        queueType: { type: string, enum: [MOVEMENT, REPAIR, HOLDING, FURNITURE_MOVEMENT] }
        queuePurpose: { $ref: '#/components/schemas/QueuePurpose' }
        sortOrder: { type: integer }
        availableTaskLimit:
          type: integer
          minimum: 1
          maximum: 50
          description: Warehouse-local number of canonical WAITING REAL cards published in WorkerApp; manager entries are never truncated by this value.
        workerFeedEnabled:
          type: boolean
          description: Whether this warehouse queue is currently published in WorkerApp.
        linkedQueueId:
          oneOf: [{ type: string, format: uuid }, { type: 'null' }]
          description: Partner physical queue in the same warehouse, or null.
        linkedQueueName:
          oneOf: [{ type: string }, { type: 'null' }]
          description: Display name of the partner physical queue.
        entries:
          type: array
          items: { $ref: '#/components/schemas/BoardEntry' }
      additionalProperties: false
    TaskBoardSnapshot:
      type: object
      required: [warehouseId, columns]
      properties:
        warehouseId: { type: string, format: uuid }
        columns:
          type: array
          items: { $ref: '#/components/schemas/BoardColumn' }
      additionalProperties: false
    LogisticsDateColumn:
