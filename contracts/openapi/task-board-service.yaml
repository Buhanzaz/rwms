        stored result; a changed payload or started member returns 409 without partial mutation.
      parameters:
        - name: sourcePlanId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/PlanningIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanningReplacementRequest' }
      responses:
        '200':
          description: Authoritative task, entry, queue, shift and source-plan fences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanningReplacementResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/logistics/planning-replan-holds/{sourcePlanId}:
    post:
      operationId: prepareLogisticsPlanningReplanHold
      description: >-
        Locks one exact published source-plan lineage before its logistics-owned customer
        commitment changes. The hold preserves the complete old-day membership and can be released
        only before the owner commits. One unfinished hold is allowed for the lineage revision.
      parameters:
        - name: sourcePlanId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/PlanningIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanningReplanPrepareRequest' }
      responses:
        '200':
          description: Prepared hold or exact replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanningReplanPrepareResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/logistics/planning-replan-holds/{holdId}/commit:
    post:
      operationId: commitLogisticsPlanningReplanHold
      description: >-
        Moves a prepared hold forward by atomically tombstoning the removed task, replacing the
        remaining membership, and advancing driver shifts. The Idempotency-Key must equal holdId;
        a committed hold can only be replayed and can never be released.
      parameters:
        - name: holdId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/PlanningIdempotencyKey'
      responses:
        '200':
          description: Authoritative committed revision or exact replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanningReplanCommitResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/logistics/planning-replan-holds/{holdId}/release:
    post:
      operationId: releaseLogisticsPlanningReplanHold
      description: >-
        Releases only a PREPARED hold after logistics proves its owner mutation did not commit.
        The Idempotency-Key must equal holdId. A committed hold always returns 409 and remains
        forward-only.
      parameters:
        - name: holdId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/PlanningIdempotencyKey'
      responses:
        '200':
          description: Released hold or exact release replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanningReplanReleaseResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/tasks/{externalTaskId}:
    parameters:
      - $ref: '#/components/parameters/ExternalTaskId'
    get:
      operationId: getExternalBoardTask
      description: Returns a registration only when it belongs to the authenticated source client.
      responses:
        '200':
          description: Current source-owned task registration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardTaskRegistration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateExternalBoardTaskBeforeStart
      description: >-
        Replaces metadata and the complete route using task-version CAS. A
        differing replacement is rejected after any route entry or assignment
        has started and is available only to the authenticated registration
        source. After an ambiguous timeout the caller reconciles with GET. A
        value-identical retry returns the current registration without mutating
        it even when expectedTaskVersion is stale; any differing payload with
        a stale expectedTaskVersion returns 409 and never applies a second
        replacement.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreStartUpdateTaskRequest' }
      responses:
        '200':
          description: Updated source-owned task registration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardTaskRegistration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/tasks/{externalTaskId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ExternalTaskId'
    post:
      operationId: cancelExternalBoardTask
      description: >-
        Cancels only a not-completed task owned by the authenticated source
        client. An identical retry after a lost response returns the current
        CANCELLED snapshot without another event; GET is the reconciliation
        fallback for any ambiguous outcome.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelTaskRequest' }
      responses:
        '200':
          description: Current cancelled task state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancelledTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/tasks/{externalTaskId}/cancel-if-pre-start:
    parameters:
      - $ref: '#/components/parameters/ExternalTaskId'
    post:
      operationId: cancelExternalBoardTaskIfPreStart
      description: >-
        Atomically cancels a task owned by the authenticated source client only
        while every route entry is still WAITING. STARTED is returned without a
        mutation when any physical work has started or completed. A retry after
        a successful cancellation returns ALREADY_CANCELLED without another
        cancellation event. VERSION_CONFLICT reports a still-unstarted task
        whose task version no longer matches the caller snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelTaskRequest' }
      responses:
        '200':
          description: Atomic pre-start cancellation outcome and current task truth.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreStartCancellationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/tasks/{externalTaskId}/relocate:
    parameters:
      - $ref: '#/components/parameters/ExternalTaskId'
    post:
      operationId: relocateExternalBoardTask
      description: >-
        Atomically moves a maintenance-owned task and its complete route to the
        target warehouse by resolving every existing queueDefinitionId to an
        active visible target binding. Entry identities, statuses, assignments,
        content and history are preserved. If any binding is absent or
        unavailable, no task or entry is changed. An identical retry is served
        from the durable relocation receipt.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RelocateExternalTaskRequest' }
      responses:
        '200':
          description: Relocated source-owned task registration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardTaskRegistration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/tasks/{externalTaskId}/lane:
    parameters:
      - $ref: '#/components/parameters/ExternalTaskId'
    post:
      operationId: setExternalDriverTaskLane
      description: >-
        Logistics-service moves its not-started driver task between SCHEDULED
        and CURRENT using task-version CAS. A task already in work cannot be
        moved and no ordinary task can use this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetTaskLaneRequest' }
      responses:
        '200':
          description: Current task registration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardTaskRegistration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/tasks/{externalTaskId}/completion-evidence:
    parameters:
      - $ref: '#/components/parameters/ExternalTaskId'
    get:
      operationId: getExternalDriverTaskCompletionEvidence
      description: >-
        Returns the one READY result photo selected by the completing
        participant. It is visible only to logistics-service after the driver
        task is DONE.
      responses:
        '200':
          description: Canonical selected completion evidence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelectedCompletionEvidence' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/entries/{entryId}/take:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: takeTaskEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TakeEntryRequest' }
      responses:
        '200': { $ref: '#/components/responses/BoardEntryOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/entries/{entryId}/future-availability:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: setFutureTaskEntryAvailability
      description: >-
        Requires USER, rwms.write and EDIT. Changes only a WAITING future step
        of an active ordinary route. available=true promotes SHADOW to REAL so
        the step can be published and taken in parallel with an earlier route
        step; available=false returns a still-future REAL step to SHADOW. The
        earliest unfinished route step cannot be demoted, and an unfinished SES
        phase cannot be bypassed. WorkerApp publication additionally remains
        subject to the queue switch, waiting-real plan, audience and worker
        eligibility. The observed entry version fences concurrent route
        completion, take and another availability command.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetFutureTaskEntryAvailabilityRequest' }
      responses:
        '200': { $ref: '#/components/responses/TaskBoardSnapshotOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/entries/{entryId}/reorder:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: reorderTaskEntry
      description: >-
        Requires USER, rwms.write and EDIT. Reorders one unpinned WAITING REAL
        card among the other reorderable cards in its existing ordinary queue.
        The observed target-entry identity prevents a stale index from moving a
        card against a queue that changed after it was rendered. Active entries,
        pinned cards, SHADOW route steps and queue identity are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderBoardEntryRequest' }
      responses:
        '200': { $ref: '#/components/responses/TaskBoardSnapshotOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/entries/{entryId}/pause:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: pauseTaskEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PauseEntryRequest' }
      responses:
        '200': { $ref: '#/components/responses/BoardEntryOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/entries/{entryId}/resume:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: resumeTaskEntry
      requestBody:
        $ref: '#/components/requestBodies/VersionCommand'
      responses:
        '200': { $ref: '#/components/responses/BoardEntryOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/entries/{entryId}/complete:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: completeTaskEntry
      description: >-
        Completes the version-fenced entry when its current task-state and
        evidence prerequisites are met. deadlineAt remains task metadata and
        never rejects an otherwise valid completion.
      requestBody:
        $ref: '#/components/requestBodies/VersionCommand'
      responses:
        '200': { $ref: '#/components/responses/BoardEntryOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/task-board/tasks/{taskId}/pin:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - name: taskId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: setTaskPinned
      description: Pins or unpins the task in every route queue without changing its current position.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PinTaskRequest' }
      responses:
        '200': { $ref: '#/components/responses/TaskBoardSnapshotOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /worker/v1/context:
    get:
      operationId: getWorkerContext
      description: >-
        Returns the authenticated worker profile, current memberships,
        qualifications, visible categories, server-time anchor and a
        server-issued 24-hour offline lease. The worker and warehouse are
        derived exclusively from the worker JWT.
      responses:
        '200':
          description: Current authenticated worker context.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerContext' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /worker/v1/profile/avatar-scope:
    post:
      operationId: prepareWorkerProfileAvatarScope
      description: >-
        Idempotently establishes the authenticated active worker's private
        media owner proof and returns only the fixed owner coordinates needed
        to list or upload that worker's avatar. Worker and warehouse identity
        are derived exclusively from the worker JWT.
      responses:
        '200':
          description: Canonical server-owned avatar media scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerProfileAvatarScope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /worker/v1/feed:
    get:
      operationId: getWorkerFeed
      description: >-
        Returns only entries matched by at least one current audience selector,
        including group assignments visible to the authenticated worker. An
        ordinary queue must also be enabled for WorkerApp; active REAL work is
        retained and WAITING REAL work is bounded by that warehouse queue's
        daily-plan count. SHADOW entries are never published. Cursors are
        opaque. If-None-Match applies to the requested page.
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            oneOf:
              - { type: string, minLength: 1, maxLength: 512 }
              - { type: 'null' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: Current page of the authenticated worker feed.
          headers:
            ETag:
              required: true
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerFeed' }
        '304':
          description: The requested feed page has not changed.
          headers:
            ETag:
              required: true
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /worker/v1/entries/{entryId}:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    get:
      operationId: getWorkerTaskDetail
      description: >-
        Returns a sanitized worker-visible task snapshot. An entry without a
        matching current audience selector or outside its ordinary queue's
        current WorkerApp publication window is indistinguishable from a
        missing entry and is never disclosed. For a MAINTENANCE_REPAIR source,
        consecutive route entries in the same physical work queue form one
        worker execution package: works, materials, comments and source media
        cover the complete segment, while planned duration and timer cover its
        still-unfinished members.
      responses:
        '200':
          description: Current worker-visible entry detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerTaskDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /worker/v1/events:
    get:
      operationId: streamWorkerEvents
      description: >-
        Streams authorization-filtered invalidations only. Event payloads
        contain identifiers and revisions, never the task snapshot. A reconnect
        opens a fresh invalidation subscription and must be followed by an
        authoritative REST feed refresh; this stream does not provide cursor
        replay. A waiting logistics-driver task is never announced here;
        TASK_JOIN_AVAILABLE is emitted only after the driver takes it.
      responses:
        '200':
          description: Server-sent worker invalidation event stream.
          content:
            text/event-stream:
              schema:
                type: string
              x-rwms-event-data-schema:
                $ref: '#/components/schemas/WorkerInvalidationEvent'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /worker/v1/entries/{entryId}/actions:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: applyWorkerAction
      description: >-
        Applies or replays a worker transition. Idempotency-Key must equal the
        request operationId. The worker identity is derived from the JWT;
        TAKE, JOIN, PAUSE and RESUME require occurredAt inside the referenced
        lease. An already-assigned WorkerApp COMPLETE may use its signed lease
        after that lease has elapsed, but still requires the current task
        state, assignment, expectedVersion, evidence gate and a non-future
        occurrence time. A task deadline never rejects a valid COMPLETE. TAKE
        and JOIN recheck the current WorkerApp
        publication window so a stale or crafted request cannot bypass the
        warehouse plan.
        COMPLETE on a MAINTENANCE_REPAIR representative atomically completes
        every later unfinished entry in its consecutive same-queue package and
        publishes the ordinary completion fact for each source-mapped entry.
        Other sources remain entry-scoped.
      parameters:
        - $ref: '#/components/parameters/WorkerIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerActionRequest' }
      responses:
        '200':
          description: Applied command or byte-equivalent idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerActionAppliedResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Stale, expired-lease, changed-replay or invalid-state conflict.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/WorkerActionConflictProblem' }
  /worker/v1/entries/{entryId}/evidence-reservations:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: reserveWorkerTaskEvidence
      description: >-
        Reserves a stable evidenceId before media upload. Idempotency-Key must
        equal operationId. Worker and group metadata are derived and validated
        by task-board; client-supplied actor metadata is not accepted. A result
        photo for an already-assigned WorkerApp task may retain its original
        signed lease after its 24-hour window; current task/assignment gates
        and the non-future capture-time check still apply.
      parameters:
        - $ref: '#/components/parameters/WorkerIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceReservationRequest' }
      responses:
        '200':
          description: Existing reservation returned for an identical replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEvidence' }
        '201':
          description: Evidence reservation created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEvidence' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /worker/v1/devices/{installationId}:
    parameters:
      - name: installationId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
    put:
      operationId: registerWorkerDevice
      description: >-
        Creates or replaces the authenticated worker binding for this
        installation. A registration is never transferable between workers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerDeviceRegistrationRequest' }
      responses:
        '200':
          description: Current device registration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerDeviceRegistration' }
        '201':
          description: Device registration created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerDeviceRegistration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: unregisterWorkerDevice
      description: Removes only the authenticated worker's installation binding.
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /internal/task-board/v1/driver-shift-plans/{sourceShiftId}:
    parameters:
      - name: sourceShiftId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/DriverShiftIdempotencyKey'
    put:
      operationId: putDriverShiftPlan
      description: >-
        Applies the logistics-service-owned driver plan projection. Requires a
        SERVICE token whose sub and client_id are logistics-service and whose
        only scope is task-board.driver-shifts.plan. Exact replays are safe;
        changed or stale plans conflict after a driver shift is frozen.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutDriverShiftPlanRequest' }
      responses:
        '200':
          description: Plan replayed or replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverShiftPlanResponse' }
        '201':
          description: Plan projection created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverShiftPlanResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /driver/v1/shift/today:
    get:
      operationId: getTodayDriverShift
      description: >-
        Returns one server-driven startup aggregate. When the feature is
        disabled, nextRequiredAction is SHOW_TASKS and the legacy task flow
        remains available. Work date is resolved in the warehouse timezone at
        the server-owned 06:00 boundary.
      responses:
        '200': { $ref: '#/components/responses/TodayDriverShiftOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /driver/v1/shifts/{shiftId}/briefing/seen:
    parameters:
      - $ref: '#/components/parameters/ShiftId'
      - $ref: '#/components/parameters/DriverShiftIdempotencyKey'
    post:
      operationId: markDriverShiftBriefingSeen
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShiftTransitionRequest' }
      responses: { '200': { $ref: '#/components/responses/TodayDriverShiftOk' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /driver/v1/shifts/{shiftId}/medical-check:
    parameters:
      - $ref: '#/components/parameters/ShiftId'
      - $ref: '#/components/parameters/DriverShiftIdempotencyKey'
    post:
      operationId: confirmDriverShiftMedicalCheck
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmMedicalCheckRequest' }
      responses: { '200': { $ref: '#/components/responses/TodayDriverShiftOk' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /driver/v1/shifts/{shiftId}/vehicle-inspection/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ShiftId'
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/DriverShiftIdempotencyKey'
    put:
      operationId: updateDriverShiftInspectionItem
      description: >-
        Stores one independently fenced item result. A newly accepted child
        result advances both the item version and root shift version; an exact
        idempotent replay or content-identical no-op advances neither.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateInspectionItemRequest' }
      responses: { '200': { $ref: '#/components/responses/TodayDriverShiftOk' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /driver/v1/shifts/{shiftId}/vehicle-inspection/complete:
    parameters:
      - $ref: '#/components/parameters/ShiftId'
      - $ref: '#/components/parameters/DriverShiftIdempotencyKey'
    post:
      operationId: completeDriverShiftInspection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShiftTransitionRequest' }
      responses: { '200': { $ref: '#/components/responses/TodayDriverShiftOk' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /driver/v1/shifts/{shiftId}/start:
    parameters:
      - $ref: '#/components/parameters/ShiftId'
      - $ref: '#/components/parameters/DriverShiftIdempotencyKey'
    post:
      operationId: startDriverShift
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShiftTransitionRequest' }
      responses: { '200': { $ref: '#/components/responses/TodayDriverShiftOk' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /driver/v1/shifts/{shiftId}/closing/start:
    parameters:
      - $ref: '#/components/parameters/ShiftId'
      - $ref: '#/components/parameters/DriverShiftIdempotencyKey'
    post:
      operationId: startDriverShiftClosing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShiftTransitionRequest' }
      responses: { '200': { $ref: '#/components/responses/TodayDriverShiftOk' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /driver/v1/shifts/{shiftId}/return-to-warehouse:
    parameters:
      - $ref: '#/components/parameters/ShiftId'
      - $ref: '#/components/parameters/DriverShiftIdempotencyKey'
    post:
      operationId: confirmDriverShiftWarehouseReturn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnToWarehouseRequest' }
      responses: { '200': { $ref: '#/components/responses/TodayDriverShiftOk' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /driver/v1/shifts/{shiftId}/closing-report:
    parameters:
      - $ref: '#/components/parameters/ShiftId'
      - $ref: '#/components/parameters/DriverShiftIdempotencyKey'
    post:
      operationId: submitDriverShiftClosingReport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitClosingReportRequest' }
      responses: { '200': { $ref: '#/components/responses/TodayDriverShiftOk' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /driver/v1/shifts/{shiftId}/photos/reservations:
    parameters:
      - $ref: '#/components/parameters/ShiftId'
      - $ref: '#/components/parameters/DriverShiftIdempotencyKey'
    post:
      operationId: reserveDriverShiftPhoto
      description: >-
        Reserves one durable media correlation and advances the root shift
        version only for a new reservation. INSPECTION_DEFECT is accepted in
        VEHICLE_INSPECTION_REQUIRED, VEHICLE_OVERVIEW in
        END_VEHICLE_CHECK_REQUIRED, and END_SHIFT_DEFECT in
        SHIFT_READY_TO_CLOSE. Exact replay or content-identical no-op does not
        advance the version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveShiftPhotoRequest' }
      responses: { '200': { $ref: '#/components/responses/TodayDriverShiftOk' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /driver/v1/shifts/{shiftId}/close:
    parameters:
      - $ref: '#/components/parameters/ShiftId'
      - $ref: '#/components/parameters/DriverShiftIdempotencyKey'
    post:
      operationId: closeDriverShift
      description: >-
        Closes the shift irreversibly. When the closing report contains a new
        defect, at least one correlated END_SHIFT_DEFECT photo must have
        reached READY; RESERVED, PROCESSING and unrelated photos conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShiftTransitionRequest' }
      responses: { '200': { $ref: '#/components/responses/TodayDriverShiftOk' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /driver/v1/context:
    get:
      operationId: getDriverContext
      description: >-
        Returns the authenticated driver's profile, primary queue categories,
        server-time anchor and server-issued 24-hour offline lease. Driver and
        warehouse identity are derived exclusively from the WORKER JWT carrying
        driver.tasks.
      responses:
        '200':
          description: Current authenticated driver context.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerContext' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /driver/v1/feed:
    get:
      operationId: getDriverFeed
      description: >-
        Returns only entries from primary queue bindings visible to the
        authenticated driver. This includes assigned or shared current
        logistics work and matching ordinary warehouse queues; cursors are
        opaque and If-None-Match applies to the requested page.
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            oneOf:
              - { type: string, minLength: 1, maxLength: 512 }
              - { type: 'null' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: Current page of the authenticated driver feed.
          headers:
            ETag:
              required: true
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerFeed' }
        '304':
          description: The requested feed page has not changed.
          headers:
            ETag:
              required: true
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /driver/v1/entries/{entryId}:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    get:
      operationId: getDriverTaskDetail
      description: >-
        Returns a sanitized primary-binding task snapshot. An entry outside the
        authenticated driver's current audience is indistinguishable from a
        missing entry.
      responses:
        '200':
          description: Current driver-visible entry detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerTaskDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /driver/v1/events:
    get:
      operationId: streamDriverEvents
      description: >-
        Streams authorization-filtered invalidations only. Event payloads carry
        identifiers and revisions, never task data; the client reloads its
        driver-authorized feed from authoritative REST after every signal and
        after every reconnect. The stream does not provide cursor replay.
        TASK_JOIN_AVAILABLE and its entry identity are confined to the WorkerApp
        stream.
      responses:
        '200':
          description: Server-sent driver invalidation event stream.
          content:
            text/event-stream:
              schema:
                type: string
              x-rwms-event-data-schema:
                $ref: '#/components/schemas/WorkerInvalidationEvent'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /driver/v1/entries/{entryId}/actions:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: applyDriverAction
      description: >-
        Applies or replays a driver transition. A driver can take primary work,
        pause, resume or complete assigned work; JOIN is reserved for the worker
        surface. Idempotency-Key must equal operationId.
      parameters:
        - $ref: '#/components/parameters/WorkerIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverActionRequest' }
      responses:
        '200':
          description: Applied command or byte-equivalent idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerActionAppliedResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Stale, expired-lease, changed-replay or invalid-state conflict.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/WorkerActionConflictProblem' }
  /driver/v1/entries/{entryId}/evidence-reservations:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: reserveDriverTaskEvidence
      description: >-
        Reserves a stable evidenceId for driver completion media. Actor and
        assignment metadata are derived from the driver JWT and task-board
        state; Idempotency-Key must equal operationId.
      parameters:
        - $ref: '#/components/parameters/WorkerIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceReservationRequest' }
      responses:
        '200':
          description: Existing reservation returned for an identical replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEvidence' }
        '201':
          description: Evidence reservation created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEvidence' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /driver/v1/devices/{installationId}:
    parameters:
      - name: installationId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
    put:
      operationId: registerDriverDevice
      description: >-
        Creates or replaces the authenticated driver's app installation. The
        server fixes its DRIVER surface and never transfers it between workers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerDeviceRegistrationRequest' }
      responses:
        '200':
          description: Current device registration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerDeviceRegistration' }
        '201':
          description: Device registration created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerDeviceRegistration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: unregisterDriverDevice
      description: Removes only the authenticated driver's DRIVER installation.
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /warehouses/{warehouseId}/workers:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: listWorkers
      responses:
        '200': { $ref: '#/components/responses/WorkerListOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createWorker
      requestBody:
        $ref: '#/components/requestBodies/Worker'
      responses:
        '201': { $ref: '#/components/responses/WorkerCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/workers/{id}:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    put:
      operationId: updateWorker
      requestBody:
        $ref: '#/components/requestBodies/Worker'
      responses:
        '200': { $ref: '#/components/responses/WorkerOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
    delete:
      operationId: deleteWorker
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /warehouses/{warehouseId}/workers/{id}/current-group:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    put:
      operationId: setWorkerCurrentGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetCurrentGroupRequest' }
      responses:
        '200': { $ref: '#/components/responses/WorkerOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/workers/{id}/credentials/reset:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    post:
      operationId: resetWorkerCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialPasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/WorkerOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /warehouses/{warehouseId}/workers/{id}/credentials/disable:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    post:
      operationId: disableWorkerCredentials
      requestBody:
        $ref: '#/components/requestBodies/VersionCommand'
      responses:
        '200': { $ref: '#/components/responses/WorkerOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /warehouses/{warehouseId}/workers/{id}/credentials/enable:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    post:
      operationId: enableWorkerCredentials
      requestBody:
        $ref: '#/components/requestBodies/VersionCommand'
      responses:
        '200': { $ref: '#/components/responses/WorkerOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /warehouses/{warehouseId}/workers/{id}/credentials/reconcile-disable:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    post:
      operationId: reconcileWorkerCredentialDisable
      description: >-
        Reconcile an expired or failed credential operation against auth-service state;
        Configure/reset and legacy recovery converge to the current auth-service
        state. Disable preserves the application login, while explicit clear
        converges to NOT_CONFIGURED.
      requestBody:
        $ref: '#/components/requestBodies/VersionCommand'
      responses:
        '200': { $ref: '#/components/responses/WorkerOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /warehouses/{warehouseId}/workers/{id}/deletion/reconcile:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    post:
      operationId: reconcileWorkerDeletion
      requestBody:
        $ref: '#/components/requestBodies/VersionCommand'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /warehouses/{warehouseId}/logistics-drivers:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: listWarehouseLogisticsDrivers
      description: >-
        Public least-privilege resource directory for an authenticated panel operator. The caller
        needs rwms.read and VIEW access to the warehouse. Availability is derived from the same
        home and transfer-backed operational assignment history as the private
        logistics-service directory; credentials and ordinary worker groups are never returned.
      parameters:
        - name: at
          in: query
          required: false
          description: Availability instant; current UTC time when omitted.
          schema: { type: string, format: date-time }
        - name: includeIncoming
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Operationally available warehouse drivers in canonical order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsDriverIdentityList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /warehouses/{warehouseId}/logistics-drivers/companies:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: listContractorCompanies
      description: >-
        Lists hired-company contacts owned by this city/warehouse. Requires USER,
        rwms.read and warehouse VIEW. No company grants access or carries trip assignments.
      responses:
        '200':
          description: City-owned company catalog.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractorCompanyList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createContractorCompany
      description: >-
        Requires USER, rwms.write and warehouse EDIT. Creates one company under a
        caller-stable companyId. Identical retries return the stored contact.
        INN is unique within one home city; the same INN may be recorded in another city.
        Ownership is immutable. Conflicting identities or duplicate city/INN return 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContractorCompanyRequest' }
      responses:
        '201':
          description: Created or identically replayed company.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractorCompany' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/logistics-drivers/companies/{companyId}:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - name: companyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateContractorCompany
      description: >-
        Replaces all contact fields under expectedVersion. Requires USER,
        rwms.write and warehouse EDIT. Company and driver home ownership cannot change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateContractorCompanyRequest' }
      responses:
        '200':
          description: Persisted company with its current version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractorCompany' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteContractorCompany
      description: >-
        Deletes an empty company under expectedVersion. Requires USER, rwms.write
        and warehouse EDIT. A company with drivers returns 409; workers and their
        assignment history are never deleted or detached by this command.
      parameters:
        - name: expectedVersion
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '204': { description: Empty company deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/logistics-drivers/contractors:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: listWarehouseContractorDrivers
      description: >-
        Lists all contractor profiles owned by the warehouse, including inactive profiles. An
        exact planning day belongs to a downstream assignment and is not stored on the profile.
      responses:
        '200':
          description: Warehouse-owned contractor profiles in canonical display-name order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractorDriverList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createWarehouseContractorDriver
      description: >-
        Creates or exactly replays an on-demand contractor profile for a panel operator with
        rwms.write and EDIT warehouse access. The command provisions no credentials or DriverApp
        access; contractorId is the stable business idempotency identity.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContractorDriverRequest' }
      responses:
        '201':
          description: Created contractor or identical stable-ID replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractorDriver' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/logistics-drivers/contractors/{workerId}:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - name: workerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateWarehouseContractorDriver
      description: >-
        Fully replaces editable contractor profile fields under an expected worker version. The
        boundary cannot move a contractor to another warehouse or reclassify a staff worker.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateContractorDriverRequest' }
      responses:
        '200':
          description: Updated contractor profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractorDriver' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteWarehouseContractorDriver
      description: >-
        Deletes an unused contractor profile under its observed version. A profile referenced by
        transfer-backed operational history must be made inactive instead.
      parameters:
        - name: expectedVersion
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '204': { description: Contractor profile deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/worker-groups:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      operationId: listWorkerGroups
      responses:
        '200': { $ref: '#/components/responses/WorkerGroupListOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createWorkerGroup
      requestBody:
        $ref: '#/components/requestBodies/WorkerGroup'
      responses:
        '201': { $ref: '#/components/responses/WorkerGroupCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/worker-groups/{id}:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    put:
      operationId: updateWorkerGroup
      requestBody:
        $ref: '#/components/requestBodies/WorkerGroup'
      responses:
        '200': { $ref: '#/components/responses/WorkerGroupOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteWorkerGroup
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/worker-groups/{id}/disable:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    post:
      operationId: disableWorkerGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupAvailabilityRequest' }
      responses:
        '200': { $ref: '#/components/responses/WorkerGroupOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /warehouses/{warehouseId}/worker-groups/{id}/enable:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
      - $ref: '#/components/parameters/Id'
    post:
      operationId: enableWorkerGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupAvailabilityRequest' }
      responses:
        '200': { $ref: '#/components/responses/WorkerGroupOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    WarehouseId:
      name: warehouseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    QueueId:
      name: queueId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EntryId:
      name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExternalTaskId:
      name: externalTaskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    QueueReferenceType:
      name: type
      in: path
      required: true
      schema: { type: string, enum: [REPAIR_PLAN, CATALOG_POSITION] }
    ExternalReferenceId:
      name: externalReferenceId
      in: path
      required: true
      schema: { type: string }
    ExpectedVersion:
      name: expectedVersion
      in: query
      required: true
      schema: { type: integer, format: int64, minimum: 0 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional request trace identity. Reviewed bootstrap idempotency is instead
        bound to warehouseId and the packaged sourceSha256 and therefore spans
        retries that use different keys.
      schema: { type: string, minLength: 1, maxLength: 128 }
    WorkerIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Stable UUID for the logical worker command. It must exactly equal the
        operationId in the request body.
      schema: { type: string, format: uuid }
    DriverShiftIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable UUID equal to operationId in the command body.
      schema: { type: string, format: uuid }
    PlanningIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable UUID for one complete planning replacement or replan-hold command.
      schema: { type: string, format: uuid }
    ShiftId:
      name: shiftId
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    WorkerClass:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkerClassRequest' }
    Worker:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkerRequest' }
    WorkerGroup:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkerGroupRequest' }
    VersionCommand:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/VersionCommand' }
  schemas:
    DriverShiftStatus:
      type: string
      enum: [DAILY_BRIEFING_REQUIRED, MEDICAL_CHECK_REQUIRED, VEHICLE_INSPECTION_REQUIRED, READY_TO_START, SHIFT_ACTIVE, SHIFT_CLOSING, RETURN_TO_WAREHOUSE_REQUIRED, END_VEHICLE_CHECK_REQUIRED, SHIFT_READY_TO_CLOSE, SHIFT_CLOSED]
    DriverShiftNextRequiredAction:
      type: string
      enum: [SHIFT_NOT_AVAILABLE, SHOW_DAILY_BRIEFING, COMPLETE_MEDICAL_CHECK, COMPLETE_VEHICLE_INSPECTION, START_SHIFT, SHOW_TASKS, START_SHIFT_CLOSING, CONFIRM_WAREHOUSE_RETURN, COMPLETE_END_OF_SHIFT_REPORT, CLOSE_SHIFT, SHIFT_CLOSED]
    VehicleConfigurationType:
      type: string
      enum: [TRUCK, TRUCK_WITH_TRAILER, TRUCK_WITH_CRANE]
    InspectionItemState:
      type: string
      enum: [NOT_CHECKED, OK, DEFECT]
    ShiftTransitionRequest:
      type: object
      required: [operationId, expectedVersion]
      properties:
        operationId: { type: string, format: uuid }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    ConfirmMedicalCheckRequest:
      type: object
      required: [operationId, expectedVersion]
      properties:
        operationId: { type: string, format: uuid }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        clientCompletedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
      additionalProperties: false
    UpdateInspectionItemRequest:
      type: object
      required: [operationId, expectedVersion, expectedItemVersion, result]
      properties:
        operationId: { type: string, format: uuid }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        expectedItemVersion: { type: integer, format: int64, minimum: 0 }
        result: { type: string, enum: [OK, DEFECT] }
        defectId:
          oneOf: [{ type: string, format: uuid }, { type: 'null' }]
          description: >-
            Stable client-generated defect identity. Required with DEFECT and
            forbidden with OK so offline photo reservations can reference the
            same defect before synchronization finishes.
        defectDescription: { oneOf: [{ type: string, maxLength: 2000 }, { type: 'null' }] }
      additionalProperties: false
    ReturnToWarehouseRequest:
      type: object
      required: [operationId, expectedVersion, confirmationType]
      properties:
        operationId: { type: string, format: uuid }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        confirmationType: { type: string, enum: [MANUAL, GEOFENCE] }
      additionalProperties: false
    SubmitClosingReportRequest:
      type: object
      required: [operationId, expectedVersion, vehicleCondition, endOdometer, fuelLevelPercent, confirmSuspiciousOdometer]
      properties:
        operationId: { type: string, format: uuid }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        vehicleCondition: { type: string, enum: [NO_NEW_DEFECTS, DEFECT_REPORTED] }
        endOdometer: { type: integer, format: int64, minimum: 0 }
        fuelLevelPercent: { type: integer, minimum: 0, maximum: 100 }
        confirmSuspiciousOdometer: { type: boolean }
        defectId:
          oneOf: [{ type: string, format: uuid }, { type: 'null' }]
          description: Stable client-generated identity required for DEFECT_REPORTED.
        defectDescription: { oneOf: [{ type: string, maxLength: 2000 }, { type: 'null' }] }
      additionalProperties: false
    ReserveShiftPhotoRequest:
      type: object
      required: [operationId, expectedVersion, clientReferenceId, evidenceId, role, capturedAt, contentType, sizeBytes, sha256]
      properties:
        operationId: { type: string, format: uuid }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        clientReferenceId: { type: string, format: uuid }
        evidenceId: { type: string, format: uuid }
        role: { type: string, enum: [INSPECTION_DEFECT, END_SHIFT_DEFECT, VEHICLE_OVERVIEW] }
        defectId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        inspectionItemId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        capturedAt: { type: string, format: date-time }
        contentType: { type: string, enum: [image/jpeg] }
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 15728640 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
      additionalProperties: false
    PutDriverShiftPlanRequest:
      type: object
      required: [sourcePlanId, sourcePlanVersion, warehouseId, driverId, driverName, workDate, vehicle, tripCount, routeDistanceMeters]
      properties:
        sourcePlanId: { type: string, format: uuid }
        sourcePlanVersion: { type: integer, format: int64, minimum: 1 }
        warehouseId:
          type: string
          format: uuid
          description: >-
            Physical route origin and driver execution scope. A cross-warehouse served endpoint
            remains explicit on inbound and depot route operations.
        driverId: { type: string, format: uuid }
        driverName: { type: string, minLength: 1, maxLength: 256 }
        workDate: { type: string, format: date }
        vehicle: { $ref: '#/components/schemas/PlannedDriverVehicle' }
        trailer:
          oneOf: [{ $ref: '#/components/schemas/PlannedDriverTrailer' }, { type: 'null' }]
        tripCount: { type: integer, minimum: 0 }
        routeDistanceMeters: { type: integer, format: int64, minimum: 0 }
        operations:
          type: array
          maxItems: 1000
          default: []
          description: >-
            Immutable one-based executable route order. Omission remains an empty list for
            logistics callers predating route execution snapshots.
          items: { $ref: '#/components/schemas/DriverShiftRouteOperation' }
      additionalProperties: false
    PlanningReplacementTaskRequest:
      type: object
      required:
        [externalTaskId, sourceTaskId, taskWarehouseId, scheduledDate, expectedTaskVersion, expectedEntryVersion, targetQueuePosition, driverAudience]
      properties:
        externalTaskId: { type: string, format: uuid }
        sourceTaskId: { type: string, format: uuid }
        taskWarehouseId: { type: string, format: uuid }
        scheduledDate: { type: string, format: date }
        expectedTaskVersion: { type: integer, format: int64, minimum: 0 }
        expectedEntryVersion: { type: integer, format: int64, minimum: 0 }
        targetQueuePosition: { type: integer, minimum: 0 }
        driverAudience: { $ref: '#/components/schemas/DriverTaskAudience' }
      additionalProperties: false
    PlanningReplacementShiftRequest:
      type: object
      required: [sourceShiftId, plan]
      properties:
        sourceShiftId: { type: string, format: uuid }
        plan: { $ref: '#/components/schemas/PutDriverShiftPlanRequest' }
      additionalProperties: false
    PlanningReplacementRequest:
      type: object
      required:
        [warehouseId, date, expectedSourcePlanVersion, replacementPlanVersion, assignments, driverShiftPlans]
      properties:
        warehouseId: { type: string, format: uuid }
        date: { type: string, format: date }
        expectedSourcePlanVersion: { type: integer, format: int64, minimum: 1 }
        replacementPlanVersion: { type: integer, format: int64, minimum: 2 }
        assignments:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/PlanningReplacementTaskRequest' }
        driverShiftPlans:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/PlanningReplacementShiftRequest' }
      additionalProperties: false
    PlanningReplacementOutcome:
      type: string
      enum: [APPLIED, REPLAYED]
    PlanningReplacementTaskResult:
      type: object
      required: [externalTaskId, taskVersion, entryId, entryVersion, queuePosition]
      properties:
        externalTaskId: { type: string, format: uuid }
        taskVersion: { type: integer, format: int64, minimum: 0 }
        entryId: { type: string, format: uuid }
        entryVersion: { type: integer, format: int64, minimum: 0 }
        queuePosition: { type: integer, minimum: 0 }
      additionalProperties: false
    PlanningReplacementShiftResult:
      type: object
      required: [sourceShiftId, shiftPlanVersion, sourcePlanVersion]
      properties:
        sourceShiftId: { type: string, format: uuid }
        shiftPlanVersion: { type: integer, format: int64, minimum: 0 }
        sourcePlanVersion: { type: integer, format: int64, minimum: 1 }
      additionalProperties: false
    PlanningReplacementResponse:
      type: object
      required:
        [outcome, sourcePlanId, sourcePlanVersion, warehouseId, date, assignments, driverShiftPlans]
      properties:
        outcome: { $ref: '#/components/schemas/PlanningReplacementOutcome' }
        sourcePlanId: { type: string, format: uuid }
        sourcePlanVersion: { type: integer, format: int64, minimum: 2 }
        warehouseId: { type: string, format: uuid }
        date: { type: string, format: date }
        assignments:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/PlanningReplacementTaskResult' }
        driverShiftPlans:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/PlanningReplacementShiftResult' }
      additionalProperties: false
    PlanningRemovedTaskRequest:
      type: object
      required:
        [externalTaskId, sourceTaskId, taskWarehouseId, scheduledDate, expectedTaskVersion, expectedEntryVersion]
      properties:
        externalTaskId: { type: string, format: uuid }
        sourceTaskId: { type: string, format: uuid }
        taskWarehouseId: { type: string, format: uuid }
        scheduledDate: { type: string, format: date }
        expectedTaskVersion: { type: integer, format: int64, minimum: 0 }
        expectedEntryVersion: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    PlanningReplanPrepareRequest:
      type: object
      required:
        [warehouseId, date, expectedSourcePlanVersion, replacementPlanVersion, removedAssignment, remainingAssignments, driverShiftPlans]
      properties:
        warehouseId: { type: string, format: uuid }
        date: { type: string, format: date }
        expectedSourcePlanVersion: { type: integer, format: int64, minimum: 1 }
        replacementPlanVersion: { type: integer, format: int64, minimum: 2 }
        removedAssignment: { $ref: '#/components/schemas/PlanningRemovedTaskRequest' }
        remainingAssignments:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/PlanningReplacementTaskRequest' }
        driverShiftPlans:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/PlanningReplacementShiftRequest' }
      additionalProperties: false
    PlanningReplanPrepareOutcome:
      type: string
      enum: [PREPARED, REPLAYED]
    PlanningReplanPrepareResponse:
      type: object
      required: [outcome, holdId, sourcePlanId, sourcePlanVersion, removedExternalTaskId]
      properties:
        outcome: { $ref: '#/components/schemas/PlanningReplanPrepareOutcome' }
        holdId: { type: string, format: uuid }
        sourcePlanId: { type: string, format: uuid }
        sourcePlanVersion: { type: integer, format: int64, minimum: 1 }
        removedExternalTaskId: { type: string, format: uuid }
      additionalProperties: false
    PlanningRemovedTaskResult:
      type: object
      required: [externalTaskId, taskVersion, status]
      properties:
        externalTaskId: { type: string, format: uuid }
        taskVersion: { type: integer, format: int64, minimum: 0 }
        status: { type: string, const: CANCELLED }
      additionalProperties: false
    PlanningReplanCommitOutcome:
      type: string
      enum: [APPLIED, REPLAYED]
    PlanningReplanCommitResponse:
      type: object
      required:
        [outcome, holdId, sourcePlanId, sourcePlanVersion, removedAssignment, remainingAssignments, driverShiftPlans]
      properties:
        outcome: { $ref: '#/components/schemas/PlanningReplanCommitOutcome' }
        holdId: { type: string, format: uuid }
        sourcePlanId: { type: string, format: uuid }
        sourcePlanVersion: { type: integer, format: int64, minimum: 2 }
        removedAssignment: { $ref: '#/components/schemas/PlanningRemovedTaskResult' }
        remainingAssignments:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/PlanningReplacementTaskResult' }
        driverShiftPlans:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/PlanningReplacementShiftResult' }
      additionalProperties: false
    PlanningReplanReleaseOutcome:
      type: string
      enum: [RELEASED, REPLAYED]
    PlanningReplanReleaseResponse:
      type: object
      required: [outcome, holdId, sourcePlanId]
      properties:
        outcome: { $ref: '#/components/schemas/PlanningReplanReleaseOutcome' }
        holdId: { type: string, format: uuid }
        sourcePlanId: { type: string, format: uuid }
      additionalProperties: false
    DriverShiftRouteOperation:
      type: object
      required: [sequence, kind, locationLabel, plannedArrival, plannedDeparture, loadBefore, loadAfter]
      properties:
        sequence: { type: integer, minimum: 1 }
        kind:
          type: string
          enum: [ORIGIN_START, TRANSFER_LOAD, INBOUND_POSITIONING, TRANSFER_UNLOAD, DEPOT_LOAD, DELIVERY, PICKUP, DEPOT_UNLOAD, DEPOT_RETURN, RETURN_POSITIONING]
        warehouseId:
          oneOf: [{ type: string, format: uuid }, { type: 'null' }]
        sourceTaskId:
          oneOf: [{ type: string, format: uuid }, { type: 'null' }]
        sourceTransferId:
          oneOf: [{ type: string, format: uuid }, { type: 'null' }]
        locationLabel: { type: string, minLength: 1, maxLength: 500 }
        plannedArrival:
          type: string
          format: date-time
          description: Exact stop arrival or positioning destination arrival ETA.
        plannedDeparture:
          type: string
          format: date-time
          description: Exact stop departure or positioning origin departure ETA.
        loadBefore: { type: integer, minimum: 0 }
        loadAfter: { type: integer, minimum: 0 }
      additionalProperties: false
    PlannedDriverVehicle:
      type: object
      required: [id, name, registrationNumber, configurationType]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 256 }
        registrationNumber: { type: string, minLength: 1, maxLength: 64 }
        vehicleType: { oneOf: [{ type: string, maxLength: 64 }, { type: 'null' }] }
        manufacturer: { oneOf: [{ type: string, maxLength: 128 }, { type: 'null' }] }
        model: { oneOf: [{ type: string, maxLength: 128 }, { type: 'null' }] }
        configurationType: { $ref: '#/components/schemas/VehicleConfigurationType' }
        cabinCapacity:
          oneOf:
            - { type: integer, minimum: 1, maximum: 2 }
            - { type: 'null' }
          description: >-
            Exact effective cabin capacity of the frozen vehicle/trailer snapshot. Legacy plans
            may omit it, but transfer load operations require it.
        startOdometer:
          oneOf: [{ type: integer, format: int64, minimum: 0 }, { type: 'null' }]
      additionalProperties: false
    PlannedDriverTrailer:
      type: object
      required: [id, name, registrationNumber]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 256 }
        registrationNumber: { type: string, minLength: 1, maxLength: 64 }
      additionalProperties: false
    DriverShiftPlanResponse:
      type: object
      required: [sourceShiftId, sourcePlanId, sourcePlanVersion, result]
      properties:
        sourceShiftId: { type: string, format: uuid }
        sourcePlanId: { type: string, format: uuid }
        sourcePlanVersion: { type: integer, format: int64, minimum: 1 }
        result: { type: string, enum: [CREATED, REPLAYED, REPLACED] }
      additionalProperties: false
    TodayDriverShift:
      type: object
      required: [enabled, serverTime, suspiciousOdometerJumpKm, nextRequiredAction, operations, photos]
      properties:
        enabled: { type: boolean }
        serverTime: { type: string, format: date-time }
        suspiciousOdometerJumpKm:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Server-configured odometer delta that requires explicit driver
            confirmation instead of silent acceptance.
        nextAvailableAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        nextRequiredAction: { $ref: '#/components/schemas/DriverShiftNextRequiredAction' }
        shift: { oneOf: [{ $ref: '#/components/schemas/DriverShiftView' }, { type: 'null' }] }
        warehouse: { oneOf: [{ $ref: '#/components/schemas/DriverShiftWarehouse' }, { type: 'null' }] }
        briefing: { oneOf: [{ $ref: '#/components/schemas/DailyBriefing' }, { type: 'null' }] }
        vehicle: { oneOf: [{ $ref: '#/components/schemas/DriverShiftVehicle' }, { type: 'null' }] }
        inspection: { oneOf: [{ $ref: '#/components/schemas/DriverVehicleInspection' }, { type: 'null' }] }
        taskSummary: { oneOf: [{ $ref: '#/components/schemas/DriverShiftTaskSummary' }, { type: 'null' }] }
        closingReport: { oneOf: [{ $ref: '#/components/schemas/DriverShiftClosingReport' }, { type: 'null' }] }
        operations:
          type: array
          maxItems: 1000
          default: []
          description: Ordered immutable route snapshot retained with this shift plan.
          items: { $ref: '#/components/schemas/DriverShiftRouteOperation' }
        photos:
          type: array
          items: { $ref: '#/components/schemas/DriverShiftPhoto' }
      additionalProperties: false
    DriverShiftView:
      type: object
      required: [id, version, driverId, driverName, warehouseId, workDate, timeZone, status]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        driverId: { type: string, format: uuid }
        driverName: { type: string }
        warehouseId: { type: string, format: uuid }
        workDate: { type: string, format: date }
        timeZone: { type: string }
        status: { $ref: '#/components/schemas/DriverShiftStatus' }
        briefingSeenAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        medicalCheck: { oneOf: [{ $ref: '#/components/schemas/DriverMedicalCheck' }, { type: 'null' }] }
        vehicleInspectionCompletedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        startedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        closingStartedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        returnedToWarehouseAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        returnConfirmationType:
          oneOf: [{ type: string, enum: [MANUAL, GEOFENCE] }, { type: 'null' }]
        closedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
      additionalProperties: false
    DriverMedicalCheck:
      type: object
      required: [driverId, shiftId, workDate, confirmationType, completedAt]
      properties:
        driverId: { type: string, format: uuid }
        shiftId: { type: string, format: uuid }
        workDate: { type: string, format: date }
        confirmationType: { type: string, enum: [SELF_CONFIRMATION_TEST, EXTERNAL_MEDICAL_SYSTEM] }
        completedAt: { type: string, format: date-time }
        externalCheckId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        doctorId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        provider: { oneOf: [{ type: string }, { type: 'null' }] }
        checkedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
      additionalProperties: false
    DriverShiftWarehouse:
      type: object
      required: [id, name, city, timeZone]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        city: { type: string }
        address: { oneOf: [{ type: string }, { type: 'null' }] }
        latitude: { oneOf: [{ type: number }, { type: 'null' }] }
        longitude: { oneOf: [{ type: number }, { type: 'null' }] }
        timeZone: { type: string }
      additionalProperties: false
    DailyBriefing:
      type: object
      required: [locationName, weather]
      properties:
        locationName: { type: string }
        weather: { $ref: '#/components/schemas/DailyWeatherBriefing' }
      additionalProperties: false
    DailyWeatherBriefing:
      type: object
      required: [available, attribution, hazards]
      properties:
        available: { type: boolean }
        attribution: { type: string, const: 'Данные MET Norway' }
        currentTempC: { oneOf: [{ type: number }, { type: 'null' }] }
        feelsLikeC:
          oneOf: [{ type: number }, { type: 'null' }]
          description: >-
            Derived wind-chill temperature when the documented formula's
            temperature and wind domain applies; otherwise null.
        minTempC: { oneOf: [{ type: number }, { type: 'null' }] }
        maxTempC: { oneOf: [{ type: number }, { type: 'null' }] }
        condition:
          oneOf: [{ type: string }, { type: 'null' }]
          description: Driver-readable Russian description of the current MET symbol.
        icon:
          oneOf: [{ type: string }, { type: 'null' }]
          description: Original MET Norway symbol_code for icon selection.
