        name: { type: string, minLength: 1, maxLength: 128 }
        description: { oneOf: [{ type: string, maxLength: 1000 }, { type: 'null' }] }
        type: { type: string, enum: [MOVEMENT, REPAIR, HOLDING, FURNITURE_MOVEMENT] }
