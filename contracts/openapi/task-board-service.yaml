        contractor, without media read or upload locations.
      responses:
        '200':
          description: Exact contractor task execution snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractorTaskExecutionSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/logistics/contractor-execution/workers/{workerId}/tasks/{externalTaskId}/entries/{entryId}/actions:
    parameters:
      - name: workerId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/ExternalTaskId'
      - $ref: '#/components/parameters/EntryId'
      - $ref: '#/components/parameters/WorkerIdempotencyKey'
    post:
      operationId: applyInternalContractorTaskAction
      description: >-
        Applies START or COMPLETE to one exact route entry through the existing task-board worker
        state machine. Every delivery re-proves the immutable logistics source, exact assigned
        active contractor and route membership. The observed entry version fences the transition;
        operationId and Idempotency-Key provide an exact immutable replay. COMPLETE preserves the
        configured ready-photo minimum and accepts mandatory selected logistics result evidence
        only when it belongs to this exact contractor.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractorTaskActionRequest' }
      responses:
        '200':
          description: Applied transition or its byte-equivalent logical replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractorTaskActionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/task-board/v1/logistics/contractor-execution/workers/{workerId}/tasks/{externalTaskId}/entries/{entryId}/evidence-reservations:
