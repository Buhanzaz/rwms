        kind: { type: string, enum: [SOURCE, RESULT] }
        contentType: { type: string }
        readPath:
          type: string
          format: uri-reference
          pattern: '^/api/media/'
        thumbnailPath:
          oneOf:
            - { type: string, format: uri-reference, pattern: '^/api/media/' }
            - { type: 'null' }
        capturedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        recordedAt: { type: string, format: date-time }
      additionalProperties: false
    WorkerRelatedStep:
      type: object
      required: [entryId, routeIndex, queueName, taskText, status]
      properties:
        entryId: { type: string, format: uuid }
        routeIndex: { type: integer, minimum: 0 }
        queueName: { type: string }
        taskText: { oneOf: [{ type: string }, { type: 'null' }] }
        status: { type: string, enum: [WAITING, IN_PROGRESS, PAUSED, DONE, CANCELLED] }
      additionalProperties: false
    TaskEvidence:
      type: object
      required: [evidenceId, version, entryId, routeIndex, workerId, workerGroupId, capturedAt, recordedAt, state, mediaId, mediaGeneration, reviewReason, contentType, readPath, thumbnailPath]
      properties:
        evidenceId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        entryId: { type: string, format: uuid }
        routeIndex: { type: integer, minimum: 0 }
        workerId: { type: string, format: uuid }
        workerGroupId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        capturedAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        state: { type: string, enum: [RESERVED, UPLOADING, READY, REVIEW_REQUIRED, REJECTED] }
        mediaId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        mediaGeneration: { oneOf: [{ type: integer, format: int64, minimum: 1 }, { type: 'null' }] }
        reviewReason: { oneOf: [{ type: string }, { type: 'null' }] }
        contentType: { oneOf: [{ type: string }, { type: 'null' }] }
        readPath:
          oneOf:
            - { type: string, format: uri-reference, pattern: '^/api/media/' }
            - { type: 'null' }
        thumbnailPath:
          oneOf:
            - { type: string, format: uri-reference, pattern: '^/api/media/' }
            - { type: 'null' }
      additionalProperties: false
    WorkerTaskDetail:
      type: object
      required: [entryId, version, taskId, source, routeIndex, routeStepIndex, routeStepCount, title, description, object, taskText, scheduledDate, deadlineAt, priority, queuePosition, status, availabilityMode, plannedDurationMinutes, activeStartedAt, activeWorkSeconds, timerSnapshot, audienceSelectors, assignments, works, materials, comments, sourceMedia, evidence, relatedSteps, resultPhotoMinCount, completionAllowed]
      properties:
        entryId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        taskId: { type: string, format: uuid }
        source: { oneOf: [{ $ref: '#/components/schemas/TaskSourceReference' }, { type: 'null' }] }
        routeIndex:
          description: Raw persisted route-row identity used by evidence and commands; it is not an execution-package ordinal.
          type: integer
          minimum: 0
        routeStepIndex:
          description: >-
            Zero-based worker execution-package ordinal. Consecutive MAINTENANCE_REPAIR rows in one
            physical queue share the ordinal; all other route rows retain one package each.
          type: integer
          minimum: 0
        routeStepCount:
          description: >-
            Authoritative total number of worker execution packages. Consecutive
            MAINTENANCE_REPAIR rows in one physical queue count as one package; all other route rows
            count individually.
