        workerClassName: { type: string, minLength: 1 }
      additionalProperties: false
    WorkerQualificationSummary:
      type: object
      required: [workerClassId, name]
      properties:
        workerClassId: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
