openapi: 3.1.0
info:
  title: RWMS Media Service API
  version: 1.22.0
  license: { name: UNLICENSED }
  description: >-
    Stateful Go media API. PostgreSQL owns metadata and replay state; MinIO
    receives client-produced bytes only through authenticated same-origin
    content endpoints; every finalized source or image variant is pinned to an
    immutable object version. Still-image orientation and WebP encoding belong
    to the capturing client, while media-service authorizes, streams and records
    the immutable objects without decoding them.
servers:
  - url: /
security:
  - bearerJwt: []
paths:
  /health/live:
    get:
      security: []
      operationId: mediaLiveness
      responses:
        '200': { description: Process is alive. }
  /health/ready:
    get:
      security: []
      operationId: mediaReadiness
      responses:
        '200': { description: Exact Flyway schema, PostgreSQL and versioned MinIO are ready. }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/media/v1/events:
    get:
      operationId: streamMediaWarehouseInvalidations
      description: >-
        Opens an authenticated warehouse-scoped Server-Sent Events stream.
        Events carry opaque media identifiers and are invalidation hints only;
        clients must re-read the cabin-cover projection. Reconnects begin with
        a RESYNC event and do not rely on replay history.
      parameters:
        - name: warehouseId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Warehouse media invalidation stream.
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/media/v1/owner-proofs:
    post:
      summary: Upsert one monotonic service-owned media authorization proof
      operationId: upsertServiceMediaOwnerProof
      description: >-
        MAINTENANCE_* proofs require only sub=client_id=maintenance-service and
        exactly media.maintenance. LOGISTICS_* proofs require only
        sub=client_id=logistics-service and exactly media.logistics. Maintenance
        supplies a UUID ownerId. Structured logistics owners supply documentId
        plus lineId and media-service alone derives their internal composite
        identity. LOGISTICS_CUSTOMER_PROFILE instead supplies the authoritative
        customer-profile UUID as ownerId. TASK_BOARD_WORKER_PROFILE requires
        task-board-service with exactly media.task-board and uses the active
        worker UUID as ownerId. LOGISTICS_SHIPMENT and
        LOGISTICS_CUSTOMER_PROFILE proofs bind exactly one CustomerApp subject;
        only that customer can use the bound media scope. Exact
        proofEventId/canonical-body replay is safe. After the first accepted
        proof, ownerRevision must be exactly next. aggregateVersion must
        strictly increase but may skip source aggregate mutations that emit no
        media proof. Aggregate regression or non-increase, owner-revision
        regression/gap/non-increase, event-ID reuse and every quarantine other
        than an exact legacy AGGREGATE_VERSION_GAP replay that now satisfies
        these rules fail closed. The response contains no object key or URL.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceOwnerProofRequest' }
      responses:
        '201':
          description: New proof receipt, checkpoint and owner binding committed atomically.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceOwnerProof' }
        '200':
          description: Exact proofEventId and canonical-body replay.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceOwnerProof' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/internal/media/v1/inventory/outcomes/{inventoryId}/findings/{findingId}/cabin-photos:
    put:
      summary: Make a completed inventory finding photo batch the current cabin folder
      operationId: applyInventoryCabinPhotos
      description: >-
        Requires only a SERVICE JWT with sub=client_id=inventory-service,
        audience rwms-services and exactly media.inventory. In one serializable
        media-owned transaction the command validates a current active CABIN
        proof and a retained checkpointed INVENTORY_FINDING identity in the
        same warehouse, validates every unique reference as a READY IMAGE at
        its exact current generation and requires coverMediaId among those
        references. The finding proof may already be inactive after completion;
        that does not reopen public finding reads or uploads. A later unresolved
        VERSION_GAP is tolerated only when it starts strictly after the retained
        proof checkpoint. It associates the
        existing assets to one deterministic gallery folder without changing
        media ownership or deleting any PostgreSQL row or MinIO object, makes
        that folder and cover current, and retains every prior folder in the
        CABIN gallery history. Exact Idempotency-Key replay returns its frozen
        receipt; changed key reuse, an older completion, or a different
        immutable source at the same completedAt is rejected. A new key may
        reassert the same latest immutable source after another cover change.
      parameters:
        - name: inventoryId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: findingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyInventoryCabinPhotosRequest' }
      responses:
        '200':
          description: Exact frozen idempotent replay.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryCabinPhotosResult' }
        '201':
          description: New receipt committed; the latest immutable source is selected or reasserted.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryCabinPhotosResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/internal/media/v1/asset-imports/preflight:
    post:
      summary: Queue a durable public Yandex.Disk photo preflight
      operationId: preflightAssetImport
      description: >-
        Requires only a SERVICE JWT with sub=client_id=asset-service, audience
        rwms-services and exactly media.asset-import. The only accepted source
        form is https://disk.yandex.ru/d/{14-character-public-key}. The public
        URL/key and any temporary download address are never returned. The
        asynchronous preflight recursively lists the official unauthenticated
        public-resources API and records only bounded private job state; it
        does not download or activate any file.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetImportPreflightRequest' }
      responses:
        '202':
          description: New or exact idempotent durable preflight job.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetImportJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/internal/media/v1/asset-imports/{jobId}:
    get:
      summary: Read private asset-import progress and sanitized results
      operationId: getAssetImport
      description: >-
        Requires the exact asset-service/media.asset-import SERVICE identity.
        Result counters and imported opaque media IDs are returned, but public
        URLs, public keys, remote paths, download addresses and object-store
        coordinates are never exposed.
      parameters:
        - $ref: '#/components/parameters/AssetImportJobId'
      responses:
        '200':
          description: Current durable import state.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetImportJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/internal/media/v1/asset-imports/{jobId}/activate:
    post:
      summary: Bind preflight source rows to CABIN owners and queue ingestion
      operationId: activateAssetImport
      description: >-
        Requires the exact asset-service/media.asset-import SERVICE identity.
        Each preflight source row is bound exactly once to a current CABIN owner
        in the job warehouse. The durable worker obtains a fresh official
        download address only after activation, accepts JPEG/PNG/WebP bytes,
        skips other media with a sanitized warning, and sends accepted bytes
        through the normal immutable media ingestion and processing path.
      parameters:
        - $ref: '#/components/parameters/AssetImportJobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetImportActivationRequest' }
      responses:
        '202':
          description: New or exact idempotent durable activation job.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetImportJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/internal/media/v1/asset-imports/{jobId}/retry:
    post:
      summary: Requeue one terminal failed asset-import phase
      operationId: retryAssetImport
      description: >-
        Requires the exact asset-service/media.asset-import SERVICE identity.
        This bodyless command is idempotent and only requeues a terminal
        preflight or activation failure; it does not alter bindings or expose
        remote source data.
      parameters:
        - $ref: '#/components/parameters/AssetImportJobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Failed phase is queued again, or the exact retry is replayed.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetImportJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/internal/media/v1/asset-imports/{jobId}/replace-sources:
    post:
      summary: Replace rejected Yandex public sources and requeue preflight
      operationId: replaceAssetImportPreflightSources
      description: >-
        Requires the exact asset-service/media.asset-import SERVICE identity.
        Only a terminal PREFLIGHT failure can be corrected. Submitted public
        URLs are write-only: media-service persists only their parsed keys,
        never returns either URLs or keys, clears stale discovery rows, and
        requeues the existing durable job. Active or completed ingestion cannot
        be changed through this operation.
      parameters:
        - $ref: '#/components/parameters/AssetImportJobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetImportReplaceSourcesRequest' }
      responses:
        '202':
          description: Corrected source keys are queued for fresh preflight, or the exact command is replayed.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetImportJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/internal/media/v1/assets/cabin-creation-snapshots:
    post:
      summary: Read current CABIN photo-completion proof for asset-service
      operationId: readAssetCabinCreationSnapshots
      description: >-
        Requires only a SERVICE JWT with sub=client_id=asset-service, audience rwms-services and
        exactly media.asset. This private read reuses the canonical active CABIN photo-library
        projection and returns the current active folder, full logical image count, current READY
        image identities/generations plus their association index and immutable finalized source
        checksum/content type/byte length, and current READY cover. It exposes no filename,
        object-store locator, signed URL or bytes. Missing owner proof omits the cabin; processing,
        folder and cover state remain explicit so asset-service can fail closed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CabinPresentationSnapshotRequest' }
      responses:
        '200':
          description: Bounded current creation-proof snapshots in request order.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CabinCreationSnapshotPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/internal/media/v1/logistics/references/validate:
    post:
      summary: Validate opaque READY media references for one logistics owner
      operationId: validateLogisticsMediaReferences
      description: >-
        Requires only a SERVICE JWT with sub=client_id=logistics-service,
        audience rwms-services and exactly media.logistics. A structured request
        derives the opaque owner ID from documentId and lineId. A customer
        profile request carries the profile ownerId, exact authorizedSubjectId,
        PROFILE_AVATAR context and exactly one reference. It is read-only and
        reveals neither URLs, object keys, filenames, MIME details nor media
        policy internals.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogisticsMediaReferenceValidationRequest' }
      responses:
        '200':
          description: Every supplied reference is READY at the requested current generation for this exact owner, warehouse and optional customer subject.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsMediaReferenceValidation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/internal/media/v1/logistics/contractor-task-executions/{entryId}/workers/{workerId}/evidence/{evidenceId}:
    post:
      summary: Stream and finalize one exact contractor task evidence image
      operationId: uploadLogisticsContractorTaskEvidence
      description: >-
        Requires only a SERVICE JWT with sub=client_id=logistics-service,
        audience rwms-services and exactly media.logistics. The path binds one
        task-board entry, contractor worker and reserved evidence ID; the
        required Idempotency-Key must equal evidenceId. Media-service rechecks
        the current task-board upload audience for that exact worker and
        warehouse before create and finalize, streams one declared JPEG or
        WebP to private versioned storage, verifies Content-Length and
        X-Content-SHA256 against the immutable object, and records the worker
        as the evidence actor. Exact retries return the same logical media
        asset and never expose an upload session, object key, storage URL or
        service credential.
      parameters:
        - $ref: '#/components/parameters/ContractorTaskEntryId'
        - $ref: '#/components/parameters/ContractorWorkerId'
        - $ref: '#/components/parameters/ContractorEvidenceId'
        - $ref: '#/components/parameters/WarehouseId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContentSHA256'
        - $ref: '#/components/parameters/ContentLength'
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        '201':
          description: New exact evidence asset was streamed and finalized for asynchronous processing.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractorTaskEvidenceReceipt' }
        '200':
          description: Exact evidence ID and immutable request replay.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractorTaskEvidenceReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/internal/media/v1/logistics/contractor-task-executions/{entryId}/workers/{workerId}/assets/{mediaId}/generations/{generation}/variants/{variant}/content:
    get:
      summary: Stream one exact contractor task image derivative
      operationId: getLogisticsContractorTaskExecutionVariantContent
      description: >-
        Requires only a SERVICE JWT with sub=client_id=logistics-service,
        audience rwms-services and exactly media.logistics. Media-service
        rechecks the current task-board read audience for the exact entry,
        worker and warehouse, then streams only the requested SMALL, MEDIUM or
        LARGE generation from a private immutable object version. The route is
        not a general media reader: every owner, worker, warehouse, media,
        generation or variant mismatch is an opaque 404, and no object-store
        locator, signed URL or public media path is returned.
      parameters:
        - $ref: '#/components/parameters/ContractorTaskEntryId'
        - $ref: '#/components/parameters/ContractorWorkerId'
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/ContractorTaskGeneration'
        - $ref: '#/components/parameters/ContractorTaskVariant'
        - $ref: '#/components/parameters/WarehouseId'
      responses:
        '200':
          description: Exact immutable task-board image derivative bytes.
          headers:
            Cache-Control: { schema: { const: 'private, no-store' } }
            Content-Length: { schema: { type: integer, minimum: 1 } }
            Content-Disposition: { schema: { type: string, pattern: '^inline;' } }
            X-Content-Type-Options: { schema: { const: nosniff } }
          content:
            image/webp: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/internal/media/v1/logistics/cabin-presentations/snapshots:
    post:
      summary: Read opaque current CABIN presentation snapshots for logistics
      operationId: readLogisticsCabinPresentationSnapshots
      description: >-
        Requires only a SERVICE JWT with sub=client_id=logistics-service,
        audience rwms-services and exactly media.logistics. This private,
        read-only projection returns active canonical CABIN owner bindings and
        the full logical, runtime-available IMAGE count beside at most one
        hundred READY current-generation assets from each cabin photo library's
        active gallery folder. Older retained folders remain archive-only and
        are not mixed into this snapshot. Each photo
        contains just an opaque media ID, generation, sort order and the
        SMALL/LARGE variants currently available for a later private stream;
        it never exposes a browser route, object-store locator, signed URL,
        filename, MIME type, status or processing detail.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CabinPresentationSnapshotRequest' }
      responses:
        '200':
          description: Bounded snapshot records for currently bound requested cabins, ordered by request then stable photo presentation order.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CabinPresentationSnapshotPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/internal/media/v1/logistics/cabins/{cabinId}/cover-from-task-evidence:
    post:
      summary: Attach exact task evidence to cabin history and make it the cover
      operationId: setCabinCoverFromTaskEvidence
      description: >-
        Requires only a SERVICE JWT with sub=client_id=logistics-service,
        audience rwms-services and exactly media.logistics. The command proves
        that evidenceMediaId is a READY IMAGE owned by taskBoardEntryId and
        that the task entry and active cabin owner proof resolve to the same
        warehouse. The existing media asset is associated without copying it.
        The cabin's single cover pointer is replaced atomically; the old photo
        remains in history. Exact Idempotency-Key replay returns the same
        result and changed payload reuse is rejected.
      parameters:
        - $ref: '#/components/parameters/CabinId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetCabinCoverFromTaskEvidenceRequest' }
      responses:
        '200':
          description: Exact idempotent replay or the evidence was already the canonical cover.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CabinCoverChange' }
        '201':
          description: Evidence attached and the single cover pointer atomically replaced.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CabinCoverChange' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/internal/media/v1/logistics/cabin-presentations/assets/{mediaId}/variants/{variant}/content:
    get:
      summary: Stream one opaque retained CABIN presentation variant for logistics
      operationId: getLogisticsCabinPresentationVariantContent
      description: >-
        Requires only a SERVICE JWT with sub=client_id=logistics-service,
        audience rwms-services and exactly media.logistics. variant is exactly
        SMALL or LARGE. After logistics has validated immutable presentation
        membership, media-service verifies the retained canonical CABIN
        association, cabinId, warehouseId, exact requested media_variant
        generation and variant, then streams that row's pinned MinIO object
        version. The retained association's media_generation is at least the
        pinned generation: trusted logistics presentation membership guarantees
        that the requested tuple was issued by a current snapshot. The read
        deliberately does not require the media asset to remain current, READY
        or non-deleted; creation snapshots remain active-folder, READY and
        current-generation only. Every scope, association, cabin, warehouse,
        media, generation and variant mismatch is a uniform 404. No object-store
        locator or public media route is exposed.
      parameters:
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/CabinPresentationVariant'
        - $ref: '#/components/parameters/WarehouseId'
        - $ref: '#/components/parameters/CabinId'
        - $ref: '#/components/parameters/CabinPresentationGeneration'
      responses:
        '200':
          description: Exact immutable presentation-generation derived image bytes.
          headers:
            Cache-Control: { schema: { const: 'private, no-store' } }
            Content-Length: { schema: { type: integer, minimum: 1 } }
            Content-Disposition: { schema: { type: string, pattern: '^inline;' } }
            X-Content-Type-Options: { schema: { const: nosniff } }
          content:
            image/webp: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/media/v1/upload-sessions:
    post:
      summary: Authorize one constrained same-origin upload session
      operationId: createUploadSession
      description: >-
        Requires USER with rwms.write and warehouse EDIT, CustomerApp USER with
        exactly customer.rental for its subject-bound LOGISTICS_SHIPMENT or
        LOGISTICS_CUSTOMER_PROFILE owner, or WORKER with exactly worker.tasks
        for its own TASK_BOARD_WORKER_PROFILE/PROFILE_AVATAR, or with exactly
        one of worker.tasks or driver.tasks only for TASK_BOARD_ENTRY/WORK_RESULT,
        or specifically driver.tasks for DRIVER_SHIFT/SHIFT_EVIDENCE, and a
        current owner proof containing its worker_id. Only proven canonical owner/context
        pairs declared by MediaOwnerType are accepted.
        At most 100 live media assets may belong to one owner. The
        returned content path is same-origin and never reveals a MinIO origin
        or storage credential. An exact Idempotency-Key and request replay
        normally returns the existing open session. If that session expired
        before content was finalized, the replay issues a replacement session
        for the same logical media asset; it does not create another asset or
        overwrite completed content.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUploadSessionRequest' }
      responses:
        '201':
          description: New opaque same-origin content path. Response is no-store.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSession' }
        '200':
          description: >-
            Safe exact replay. Returns the same open session, or a replacement
            open session for the same media asset when the previous session
            expired before content was finalized.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/media/v1/upload-sessions/{uploadSessionId}/content:
    put:
      summary: Stream and pin the exact authorized upload through the gateway
      operationId: uploadSessionContent
      description: >-
        Requires the session-owning USER or WORKER principal authorized when
        the session was created; authorization is rechecked against the current
        owner proof, including an exact CustomerApp subject binding when applicable. The
        request Content-Type and Content-Length must exactly match the upload
        session. Idempotency-Key is shared with the following completion call.
        On success the immutable MinIO version is already finalized and a
        retry with the same key returns the same opaque metadata without
        writing another object. No MinIO URL or object key is exposed.
      parameters:
        - $ref: '#/components/parameters/UploadSessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
          video/mp4: { schema: { type: string, format: binary } }
          video/webm: { schema: { type: string, format: binary } }
      responses:
        '201':
          description: The exact streamed object version was pinned and finalization committed.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadedObject' }
        '200':
          description: Exact idempotent replay of the already committed content upload.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadedObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/media/v1/upload-sessions/{uploadSessionId}/variants/{variant}/content:
    put:
      summary: Stream one authorized client-produced WebP variant to private storage
      operationId: uploadSessionVariantContent
      description: >-
        Requires the session-owning USER or WORKER principal and an IMAGE_VARIANTS
        session. SMALL, MEDIUM and LARGE may be uploaded concurrently. The exact
        Content-Length and SHA-256 declared when the session was created are
        verified while bytes are streamed to private MinIO; the service never
        decodes, rotates or recompresses the image. A stable per-variant
        Idempotency-Key makes a completed PUT replay-safe.
      parameters:
        - $ref: '#/components/parameters/UploadSessionId'
        - $ref: '#/components/parameters/UploadImageVariant'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          image/webp: { schema: { type: string, format: binary } }
      responses:
        '201':
          description: The exact immutable variant version was pinned.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadedObject' }
        '200':
          description: Exact replay of an already committed variant PUT.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadedObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/media/v1/upload-sessions/{uploadSessionId}/complete:
    post:
      summary: Idempotently confirm the pinned upload version
      operationId: finalizeUploadSession
      description: >-
        Requires the session-owning principal and rechecks the current owner
        proof. TASK_BOARD_ENTRY and DRIVER_SHIFT finalization preserve
        clientReferenceId in the emitted media fact so task-board can complete
        the reservation. A
        client-variant image can complete only after all three declared WebP
        objects are pinned and the request repeats their immutable metadata.
      parameters:
        - $ref: '#/components/parameters/UploadSessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinalizeUploadRequest' }
      responses:
        '202':
          description: UPLOADED fact and dependent processing request committed atomically.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAsset' }
        '200':
          description: Exact completed-command replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAsset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/media/v1/assets:
    get:
      summary: List bounded owner media with same-origin derived content paths
      operationId: listOwnerMedia
      description: >-
        For ownerType CABIN the list is the complete retained photo archive.
        folderId is the media-owned association gallery folder, so a completed
        inventory batch is returned as one folder while all earlier direct,
        task-evidence and inventory folders remain separately grouped.
        CustomerApp may list only its exact subject-bound shipment or customer
        profile avatar owner. A WORKER may list only its own
        TASK_BOARD_WORKER_PROFILE/PROFILE_AVATAR under the matching warehouse.
        A DRIVER WORKER may list DRIVER_SHIFT/SHIFT_EVIDENCE only with
        driver.tasks, the matching warehouse and worker_id in the active
        current proof's readerWorkerIds; missing, inactive or quarantined proof
        fails closed.
      parameters:
        - $ref: '#/components/parameters/OwnerType'
        - $ref: '#/components/parameters/OwnerId'
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/LineId'
        - $ref: '#/components/parameters/WarehouseId'
        - $ref: '#/components/parameters/OwnerContext'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: Images first, then videos. READY videos expose PLAYBACK; ORIGINAL content is never returned by this list.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/media/v1/cabin-covers:
    post:
      summary: Read bounded CABIN cover projections for one warehouse page
      operationId: listCabinCovers
      description: >-
        Requires USER, rwms.read and warehouse VIEW. The service returns only
        cabins with a current canonical media owner binding. photoCount and
        previews include only retained associations from the canonical active
        CABIN gallery folder; prior folders remain available from the complete
        CABIN archive list. photoCount counts logical non-deleted IMAGE
        associations, never derived variant rows. previews contains at most 100
        READY images with exactly one SMALL variant per logical image; the
        canonical cover is first and the remaining active-folder images retain
        stable association order. cover is resolved only through the canonical
        pointer and never by a sort-order fallback.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CabinCoverBatchRequest' }
      responses:
        '200':
          description: Bounded cover projections for proved cabins that own image assets.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CabinCoverPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/media/v1/assets/{mediaId}/original:
    get:
      summary: Stream one owner-scoped ORIGINAL through the same-origin API
      operationId: getOriginalMedia
      description: >-
        CustomerApp may stream only its exact subject-bound shipment or profile
        avatar original. Manager and worker identities cannot read profile
        avatars. A DRIVER WORKER may stream DRIVER_SHIFT/SHIFT_EVIDENCE only
        with driver.tasks, the matching warehouse and worker_id in the active
        current proof's readerWorkerIds; missing, inactive or quarantined proof
        fails closed.
      parameters:
        - $ref: '#/components/parameters/MediaId'
        - name: generation
          in: query
          required: false
          description: Required for a WORKER read of a sourceMediaReferences item; ignored for a result asset's current ORIGINAL.
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/OwnerType'
        - $ref: '#/components/parameters/OwnerId'
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/LineId'
        - $ref: '#/components/parameters/WarehouseId'
        - $ref: '#/components/parameters/OwnerContext'
      responses:
        '200':
          description: >-
            Exact immutable current-generation ORIGINAL bytes; WORKER source
            reads use the proof-referenced generation. No object-store URL or
            key is exposed.
          headers:
            Cache-Control: { schema: { const: 'private, no-store' } }
            Content-Length: { schema: { type: integer, minimum: 1 } }
            Content-Disposition: { schema: { type: string, pattern: '^inline;' } }
            X-Content-Type-Options: { schema: { const: nosniff } }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            video/mp4: { schema: { type: string, format: binary } }
            video/webm: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/media/v1/assets/{mediaId}/variants/{variant}/content:
    get:
      summary: Stream one owner-scoped derived variant through the same-origin API
      operationId: getMediaVariantContent
      description: >-
        CustomerApp may stream only its exact subject-bound shipment or profile
        avatar derivative. Manager and worker identities cannot read profile
        avatars. A DRIVER WORKER may stream DRIVER_SHIFT/SHIFT_EVIDENCE only
        with driver.tasks, the matching warehouse and worker_id in the active
        current proof's readerWorkerIds; missing, inactive or quarantined proof
        fails closed.
      parameters:
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/Variant'
        - $ref: '#/components/parameters/Generation'
        - $ref: '#/components/parameters/OwnerType'
        - $ref: '#/components/parameters/OwnerId'
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/LineId'
        - $ref: '#/components/parameters/WarehouseId'
        - $ref: '#/components/parameters/OwnerContext'
      responses:
        '200':
          description: Exact immutable current-generation derived bytes; no object-store URL or key is exposed.
          headers:
            Cache-Control: { schema: { const: 'private, no-store' } }
            Content-Length: { schema: { type: integer, minimum: 1 } }
            Content-Disposition: { schema: { type: string, pattern: '^inline;' } }
            X-Content-Type-Options: { schema: { const: nosniff } }
          content:
            image/webp: { schema: { type: string, format: binary } }
            video/mp4: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/media/v1/assets/{mediaId}/deletion:
    post:
      summary: Soft-delete one owner-scoped logical media asset
      operationId: deleteMedia
      description: >-
        Requires USER, rwms.write and warehouse EDIT, or the exact CustomerApp
        subject for a subject-bound shipment/profile-avatar proof. Manager and
        worker identities cannot delete profile avatars. The command sets DELETED
        and deletedAt, emits exactly one media.media.deleted.v1 fact and never
        deletes source or derived MinIO versions. Wrong owner scope is 404;
        stale expectedVersion is 409; an exact Idempotency-Key replay is safe.
      parameters:
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OwnerType'
        - $ref: '#/components/parameters/OwnerId'
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/LineId'
        - $ref: '#/components/parameters/WarehouseId'
        - $ref: '#/components/parameters/OwnerContext'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteRequest' }
      responses:
        '200':
          description: Soft-deleted asset or exact command replay.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAsset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    ContentSHA256:
      name: X-Content-SHA256
      in: header
      required: true
      description: Lowercase SHA-256 of the exact binary request body.
      schema: { type: string, pattern: '^[0-9a-f]{64}$' }
    ContentLength:
      name: Content-Length
      in: header
      required: true
      description: Exact positive body length, additionally bounded by MEDIA_MAX_UPLOAD_BYTES.
      schema: { type: integer, format: int64, minimum: 1 }
    UploadSessionId:
      name: uploadSessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetImportJobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OwnerType:
      name: ownerType
      in: query
      required: true
      description: Must be paired with its canonical owner context.
      schema: { $ref: '#/components/schemas/MediaOwnerType' }
    OwnerId:
      name: ownerId
      in: query
      required: false
      description: Required for inventory, cabin, maintenance, task-board, driver-shift and LOGISTICS_CUSTOMER_PROFILE owners; forbidden for structured logistics owners.
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: query
      required: false
      description: Required with lineId for structured logistics owners; forbidden for all other owners.
      schema: { type: string, format: uuid }
    LineId:
      name: lineId
      in: query
      required: false
      description: Required with documentId for structured logistics owners; forbidden for all other owners.
      schema: { type: string, format: uuid }
    WarehouseId:
      name: warehouseId
      in: query
      required: true
      schema: { type: string, format: uuid }
    CabinId:
      name: cabinId
      in: query
      required: true
      schema: { type: string, format: uuid }
    OwnerContext:
      name: context
      in: query
      required: true
      description: Must match the single canonical context paired with ownerType.
      schema: { $ref: '#/components/schemas/MediaOwnerContext' }
    Variant:
      name: variant
      in: path
      required: true
      description: Image presentation size or the compressed MP4 video representation.
      schema: { enum: [SMALL, MEDIUM, LARGE, PLAYBACK] }
    UploadImageVariant:
      name: variant
      in: path
      required: true
      schema: { enum: [SMALL, MEDIUM, LARGE] }
    CabinPresentationVariant:
      name: variant
      in: path
      required: true
      description: Exact derived image variant permitted to logistics.
      schema: { enum: [SMALL, LARGE] }
    Generation:
      name: generation
      in: query
      required: true
      schema: { type: integer, minimum: 1 }
    CabinPresentationGeneration:
      name: generation
      in: query
      required: true
      description: Media generation pinned by an immutable logistics presentation; it is represented as an int64 at the boundary and must fit the stored generation range.
      schema: { type: integer, format: int64, minimum: 1, maximum: 2147483647 }
    ContractorTaskEntryId:
      name: entryId
      in: path
      required: true
      description: Exact task-board entry whose proof owns the media.
      schema: { type: string, format: uuid }
    ContractorWorkerId:
      name: workerId
      in: path
      required: true
      description: Exact contractor worker admitted by the task-board proof.
      schema: { type: string, format: uuid }
    ContractorEvidenceId:
      name: evidenceId
      in: path
      required: true
      description: Reserved evidence UUID and permanent logical client reference.
      schema: { type: string, format: uuid }
    ContractorTaskGeneration:
      name: generation
      in: path
      required: true
      description: Exact persisted media generation.
      schema: { type: integer, format: int64, minimum: 1, maximum: 2147483647 }
    ContractorTaskVariant:
      name: variant
      in: path
      required: true
      description: Exact derived image variant permitted to the contractor execution proxy.
      schema: { enum: [SMALL, MEDIUM, LARGE] }
  schemas:
    ContractorTaskEvidenceReceipt:
      type: object
      additionalProperties: false
      required: [mediaId, generation, status]
      properties:
        mediaId:
          description: Opaque stable media identity derived from the exact task, worker and evidence IDs.
          type: string
          format: uuid
        generation:
          description: Zero while asynchronous processing is pending; positive when a generation exists.
          type: integer
          minimum: 0
        status:
          enum: [PROCESSING, READY, FAILED]
    NullableUuid:
      oneOf:
        - { type: string, format: uuid }
        - { type: 'null' }
    AssetImportPreflightRequest:
      type: object
      additionalProperties: false
      required: [assetImportId, warehouseId, sources]
      properties:
        assetImportId:
          description: Stable asset-service import aggregate ID; it is the durable preflight identity.
          type: string
          format: uuid
        warehouseId: { type: string, format: uuid }
        sources:
          description: Up to five hundred distinct source rows. Recursive preflight records at most one hundred files per source and twenty-five thousand files per job. The public URL is accepted only at this command boundary and is never returned by a job.
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/AssetImportSource' }
    AssetImportSource:
      type: object
      additionalProperties: false
      required: [sourceRowId, publicUrl]
      properties:
        sourceRowId: { type: string, format: uuid }
        publicUrl:
          description: Exact Yandex.Disk public-folder/file URL. It is write-only and never echoed.
          type: string
          pattern: '^https://disk\.yandex\.ru/d/[A-Za-z0-9_-]{14}$'
    AssetImportActivationRequest:
      type: object
      additionalProperties: false
      required: [bindings]
      properties:
        bindings:
          description: Exactly one CABIN binding for every preflight source row.
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/AssetImportBinding' }
    AssetImportReplaceSourcesRequest:
      type: object
      additionalProperties: false
      required: [sources]
      properties:
        sources:
          description: One or more corrected write-only Yandex public URLs for existing source row IDs.
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/AssetImportSource' }
    AssetImportBinding:
      type: object
      additionalProperties: false
      required: [sourceRowId, cabinId]
      properties:
        sourceRowId: { type: string, format: uuid }
        cabinId: { type: string, format: uuid }
    AssetImportJob:
      type: object
      additionalProperties: false
      required: [jobId, assetImportId, warehouseId, status, preflightAttempts, activationAttempts, results]
      properties:
        jobId: { type: string, format: uuid }
        assetImportId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        status:
          enum: [PREFLIGHT_PENDING, PREFLIGHT_RUNNING, PREFLIGHT_READY, ACTIVATION_PENDING, ACTIVATION_RUNNING, COMPLETED, FAILED]
        preflightAttempts: { type: integer, minimum: 0 }
        activationAttempts: { type: integer, minimum: 0 }
        failureCode:
          description: Sanitized stable import failure code; no upstream URL, key or response detail is included.
          type: string
          pattern: '^[A-Z_]{1,64}$'
        results:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/AssetImportSourceResult' }
    AssetImportSourceResult:
      type: object
      additionalProperties: false
      required: [sourceRowId, prepared, downloading, imported, skipped, failed, mediaIds, warningCodes]
      properties:
        sourceRowId: { type: string, format: uuid }
        prepared: { type: integer, minimum: 0 }
        downloading: { type: integer, minimum: 0 }
        imported: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        mediaIds:
          description: Opaque accepted media IDs only; no filename, remote locator, object key or download address is exposed.
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        warningCodes:
          description: Distinct sanitized skip or ingestion-warning codes for this source row.
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, pattern: '^[A-Z_]{1,64}$' }
    MediaOwnerType:
      type: string
      enum:
        - INVENTORY_FINDING
        - CABIN
        - MAINTENANCE_ESTIMATE
        - MAINTENANCE_REPAIR
        - MAINTENANCE_ACCEPTANCE
        - MAINTENANCE_CATALOG_NODE
        - LOGISTICS_RETURN
        - LOGISTICS_SHIPMENT
        - LOGISTICS_TRANSFER
        - LOGISTICS_CUSTOMER_PROFILE
        - TASK_BOARD_WORKER_PROFILE
        - TASK_BOARD_ENTRY
        - DRIVER_SHIFT
    MediaOwnerContext:
      type: string
      enum: [INSPECTION, WAREHOUSE, ESTIMATE, REPAIR, ACCEPTANCE, CATALOG, RETURN_INSPECTION, SHIPMENT, TRANSFER, PROFILE_AVATAR, WORK_RESULT, SHIFT_EVIDENCE]
    MaintenanceOwnerType:
      type: string
      enum: [MAINTENANCE_ESTIMATE, MAINTENANCE_REPAIR, MAINTENANCE_ACCEPTANCE, MAINTENANCE_CATALOG_NODE]
    LogisticsOwnerType:
      type: string
      enum: [LOGISTICS_RETURN, LOGISTICS_SHIPMENT, LOGISTICS_TRANSFER]
    ServiceOwnerProofRequest:
      type: object
      additionalProperties: false
      required: [ownerType, warehouseId, ownerRevision, aggregateVersion, proofEventId, active]
      properties:
        ownerType: { $ref: '#/components/schemas/MediaOwnerType' }
        ownerId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        lineId: { type: string, format: uuid }
        authorizedSubjectId:
          type: string
          format: uuid
          description: Required for CustomerApp-owned LOGISTICS_SHIPMENT and LOGISTICS_CUSTOMER_PROFILE scopes; it never grants manager or worker permissions.
        warehouseId:
          description: >-
            Authorizing warehouse. LOGISTICS_RETURN uses the destination/receiving
            warehouse. LOGISTICS_TRANSFER uses the line destinationWarehouseId
            used by the receiving dialog, never the source warehouse.
          type: string
          format: uuid
        ownerRevision:
          description: The first proof establishes the baseline; each later proof is exactly the prior ownerRevision plus one.
          type: integer
          minimum: 0
        aggregateVersion:
          description: The first proof establishes the baseline; each later proof is strictly greater than the prior aggregateVersion and may skip unrelated aggregate mutations.
          type: integer
          minimum: 0
        proofEventId: { type: string, format: uuid }
        active: { type: boolean }
      oneOf:
        - required: [ownerId]
          properties:
            ownerType: { $ref: '#/components/schemas/MaintenanceOwnerType' }
          not:
            anyOf:
              - required: [documentId]
              - required: [lineId]
              - required: [authorizedSubjectId]
        - required: [documentId, lineId]
          properties:
            ownerType: { enum: [LOGISTICS_RETURN, LOGISTICS_TRANSFER] }
          not:
            anyOf:
              - required: [ownerId]
              - required: [authorizedSubjectId]
        - required: [documentId, lineId, authorizedSubjectId]
          properties:
            ownerType: { const: LOGISTICS_SHIPMENT }
          not: { required: [ownerId] }
        - required: [ownerId, authorizedSubjectId]
          properties:
            ownerType: { const: LOGISTICS_CUSTOMER_PROFILE }
          not:
            anyOf:
              - required: [documentId]
              - required: [lineId]
        - required: [ownerId]
          properties:
            ownerType: { const: TASK_BOARD_WORKER_PROFILE }
          not:
            anyOf:
              - required: [documentId]
              - required: [lineId]
              - required: [authorizedSubjectId]
    ServiceOwnerProof:
      type: object
      additionalProperties: false
      required: [ownerType, warehouseId, ownerRevision, aggregateVersion, proofEventId, active]
      properties:
        ownerType: { $ref: '#/components/schemas/MediaOwnerType' }
        ownerId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        lineId: { type: string, format: uuid }
        authorizedSubjectId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        ownerRevision:
          description: The applied contiguous owner-proof revision.
          type: integer
          minimum: 0
        aggregateVersion:
          description: The applied strictly increasing aggregate version; it can skip aggregate mutations without media proofs.
          type: integer
          minimum: 0
        proofEventId: { type: string, format: uuid }
        active: { type: boolean }
      oneOf:
        - required: [ownerId]
          properties:
            ownerType: { $ref: '#/components/schemas/MaintenanceOwnerType' }
          not:
            anyOf:
              - required: [documentId]
              - required: [lineId]
              - required: [authorizedSubjectId]
        - required: [documentId, lineId]
          properties:
            ownerType: { enum: [LOGISTICS_RETURN, LOGISTICS_TRANSFER] }
          not:
            anyOf:
              - required: [ownerId]
              - required: [authorizedSubjectId]
        - required: [documentId, lineId, authorizedSubjectId]
          properties:
            ownerType: { const: LOGISTICS_SHIPMENT }
          not: { required: [ownerId] }
        - required: [ownerId, authorizedSubjectId]
          properties:
            ownerType: { const: LOGISTICS_CUSTOMER_PROFILE }
          not:
            anyOf:
              - required: [documentId]
              - required: [lineId]
        - required: [ownerId]
          properties:
            ownerType: { const: TASK_BOARD_WORKER_PROFILE }
          not:
            anyOf:
              - required: [documentId]
              - required: [lineId]
              - required: [authorizedSubjectId]
    OpaqueReadyMediaReference:
      type: object
      additionalProperties: false
      required: [mediaId, generation]
      properties:
        mediaId: { type: string, format: uuid }
        generation: { type: integer, minimum: 1 }
    ApplyInventoryCabinPhotosRequest:
      type: object
      additionalProperties: false
      required:
        - warehouseId
        - cabinId
        - completedAt
        - sourceRevision
        - finalPlanVersion
        - finalPlanSha256
        - coverMediaId
        - mediaReferences
      properties:
        warehouseId: { type: string, format: uuid }
        cabinId: { type: string, format: uuid }
        completedAt:
          description: Authoritative completion time used by the per-cabin latest-result fence.
          type: string
          format: date-time
        sourceRevision: { type: integer, format: int64, minimum: 1 }
        finalPlanVersion: { type: integer, format: int64, minimum: 1 }
        finalPlanSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        coverMediaId:
          description: One mediaId from mediaReferences that becomes the current CABIN cover.
          type: string
          format: uuid
        mediaReferences:
          description: One to one hundred unique READY finding-owned IMAGE generations selected by the final plan.
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { $ref: '#/components/schemas/OpaqueReadyMediaReference' }
    InventoryCabinPhotosResult:
      type: object
      additionalProperties: false
      required:
        - inventoryId
        - findingId
        - cabinId
        - folderId
        - coverMediaId
        - photoCount
        - libraryVersion
        - replay
      properties:
        inventoryId: { type: string, format: uuid }
        findingId: { type: string, format: uuid }
        cabinId: { type: string, format: uuid }
        folderId:
          description: Deterministic CABIN gallery folder for this immutable completed source.
          type: string
          format: uuid
        coverMediaId: { type: string, format: uuid }
        photoCount: { type: integer, minimum: 1, maximum: 100 }
        libraryVersion: { type: integer, format: int64, minimum: 0 }
        replay:
          description: True only for the exact frozen Idempotency-Key receipt.
          type: boolean
    LogisticsMediaReferenceValidationRequest:
      oneOf:
        - $ref: '#/components/schemas/StructuredLogisticsMediaReferenceValidationRequest'
        - $ref: '#/components/schemas/CustomerProfileMediaReferenceValidationRequest'
    StructuredLogisticsMediaReferenceValidationRequest:
      type: object
      additionalProperties: false
      required: [ownerType, documentId, lineId, warehouseId, references]
      properties:
        ownerType: { $ref: '#/components/schemas/LogisticsOwnerType' }
        documentId: { type: string, format: uuid }
        lineId: { type: string, format: uuid }
        warehouseId:
          description: >-
            Receiving/destination warehouse proved for this line. RETURN uses
            its return destination; TRANSFER uses destinationWarehouseId.
          type: string
          format: uuid
        references:
          description: One to twenty unique media IDs; each must be READY at the stated current generation.
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { $ref: '#/components/schemas/OpaqueReadyMediaReference' }
    CustomerProfileMediaReferenceValidationRequest:
      type: object
      additionalProperties: false
      required: [ownerType, ownerId, authorizedSubjectId, warehouseId, context, references]
      properties:
        ownerType: { const: LOGISTICS_CUSTOMER_PROFILE }
        ownerId:
          description: Authoritative logistics customer_profile.id.
          type: string
          format: uuid
        authorizedSubjectId:
          description: Exact CustomerApp JWT subject bound by the current owner proof.
          type: string
          format: uuid
        warehouseId:
          description: Explicitly selected active CustomerApp warehouse used only as media authorization scope.
          type: string
          format: uuid
        context: { const: PROFILE_AVATAR }
        references:
          description: Exactly one READY current-generation profile avatar.
          type: array
          minItems: 1
          maxItems: 1
          items: { $ref: '#/components/schemas/OpaqueReadyMediaReference' }
    LogisticsMediaReferenceValidation:
      oneOf:
        - $ref: '#/components/schemas/StructuredLogisticsMediaReferenceValidation'
        - $ref: '#/components/schemas/CustomerProfileMediaReferenceValidation'
    StructuredLogisticsMediaReferenceValidation:
      type: object
      additionalProperties: false
      required: [ownerType, documentId, lineId, warehouseId, references]
      properties:
        ownerType: { $ref: '#/components/schemas/LogisticsOwnerType' }
        documentId: { type: string, format: uuid }
        lineId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        references:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/OpaqueReadyMediaReference' }
    CustomerProfileMediaReferenceValidation:
      type: object
      additionalProperties: false
      required: [ownerType, ownerId, authorizedSubjectId, warehouseId, context, references]
      properties:
        ownerType: { const: LOGISTICS_CUSTOMER_PROFILE }
        ownerId: { type: string, format: uuid }
        authorizedSubjectId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        context: { const: PROFILE_AVATAR }
        references:
          type: array
          minItems: 1
          maxItems: 1
          items: { $ref: '#/components/schemas/OpaqueReadyMediaReference' }
    CabinPresentationSnapshotRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, cabinIds]
      properties:
        warehouseId: { type: string, format: uuid }
        cabinIds:
          description: One to one hundred unique CABIN IDs whose current private presentation references are requested.
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    CabinPresentationSnapshotPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          description: Only requested cabins that currently have an active canonical CABIN owner binding are returned.
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/CabinPresentationSnapshot' }
    CabinPresentationSnapshot:
      type: object
      additionalProperties: false
      required: [cabinId, coverMediaId, photoCount, photos]
      properties:
        cabinId: { type: string, format: uuid }
        coverMediaId:
          description: Canonical cover pointer; null when the cabin has no current READY cover variant.
          oneOf:
            - { type: string, format: uuid }
            - { type: 'null' }
        photoCount:
          description: Full count of logical, non-deleted and non-quarantined IMAGE associations in the active gallery folder, including images that are not READY yet; zero when there is no active folder. It can exceed the bounded photos array so consumers can reject incomplete or oversized immutable presentations.
          type: integer
          format: int64
          minimum: 0
        photos:
          description: Up to one hundred READY current-generation CABIN IMAGE assets from the active gallery folder with at least one available private presentation variant; the canonical cover is first and the remaining images retain stable association order. Older retained folders are excluded.
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/CabinPresentationPhoto' }
    CabinPresentationPhoto:
      type: object
      additionalProperties: false
      required: [mediaId, generation, sortOrder, availableVariants]
      properties:
        mediaId: { type: string, format: uuid }
        generation: { type: integer, minimum: 1 }
        sortOrder:
          description: Zero-based cover-first presentation position; when coverMediaId is non-null its photo has position zero.
          type: integer
          format: int64
          minimum: 0
        availableVariants:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { enum: [SMALL, LARGE] }
    CabinCreationSnapshotPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/CabinCreationSnapshot' }
    CabinCreationSnapshot:
      type: object
      additionalProperties: false
      required:
        - cabinId
        - warehouseId
        - activeFolderId
        - coverMediaId
        - photoCount
        - readyPhotos
      properties:
        cabinId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        activeFolderId: { $ref: '#/components/schemas/NullableUuid' }
        coverMediaId: { $ref: '#/components/schemas/NullableUuid' }
        photoCount:
          type: integer
          format: int64
          minimum: 0
          description: Full current logical IMAGE count in activeFolderId, including non-READY images.
        readyPhotos:
          type: array
          maxItems: 100
          description: READY current-generation images in cover-first order.
          items: { $ref: '#/components/schemas/CabinCreationReadyPhoto' }
    CabinCreationReadyPhoto:
      type: object
      additionalProperties: false
      required: [mediaId, generation, photoIndex, checksumSha256, contentType, contentLength]
      properties:
        mediaId: { type: string, format: uuid }
        generation: { type: integer, minimum: 1 }
        photoIndex:
          type: integer
          format: int64
          minimum: 0
          description: Original CABIN association sort order used as the creation-manifest index.
        checksumSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Immutable finalized source checksum, never an object-store locator.
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        contentLength: { type: integer, format: int64, minimum: 1 }
    SetCabinCoverFromTaskEvidenceRequest:
      type: object
      additionalProperties: false
      required: [taskBoardEntryId, evidenceMediaId]
      properties:
        taskBoardEntryId: { type: string, format: uuid }
        evidenceMediaId: { type: string, format: uuid }
    CabinCoverChange:
      type: object
      additionalProperties: false
      required:
        - cabinId
        - warehouseId
        - coverMediaId
        - generation
        - taskBoardEntryId
        - version
        - changedAt
      properties:
        cabinId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        coverMediaId: { type: string, format: uuid }
        generation: { type: integer, minimum: 1 }
        taskBoardEntryId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        changedAt: { type: string, format: date-time }
    CreateUploadSessionRequest:
      type: object
      additionalProperties: false
      required: [ownerType, warehouseId, context, fileName]
      properties:
        ownerType: { $ref: '#/components/schemas/MediaOwnerType' }
        ownerId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        lineId: { type: string, format: uuid }
        clientReferenceId:
          description: >-
            Stable task-board evidenceId or driver-shift reservation evidenceId.
            Required and trusted only for TASK_BOARD_ENTRY and DRIVER_SHIFT;
            forbidden for every other owner type. A DRIVER WORKER uses the
            same UUID as Idempotency-Key.
          type: string
          format: uuid
        warehouseId:
          description: >-
            Proved owner warehouse. LOGISTICS_RETURN uses the destination/receiving
            warehouse and LOGISTICS_TRANSFER uses destinationWarehouseId.
          type: string
          format: uuid
        context: { $ref: '#/components/schemas/MediaOwnerContext' }
        folderId:
          description: >-
            Stable logical folder for one user batch. Files uploaded by one
            add-photo action share this UUID. If omitted, the asset forms its
            own one-item folder.
          type: string
          format: uuid
        fileName: { type: string, minLength: 1, maxLength: 512 }
        contentType: { type: string, minLength: 1, maxLength: 255 }
        contentLength: { type: integer, minimum: 1 }
        checksumSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        imageVariants:
          description: >-
            Exactly one client-produced SMALL, MEDIUM and LARGE WebP. Their
            combined contentLength must not exceed 1 MiB; media-service also
            enforces this invariant server-side.
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: '#/components/schemas/CreateImageVariant' }
          allOf:
            - contains:
                type: object
                required: [kind]
                properties: { kind: { const: SMALL } }
            - contains:
                type: object
                required: [kind]
                properties: { kind: { const: MEDIUM } }
            - contains:
                type: object
                required: [kind]
                properties: { kind: { const: LARGE } }
        sortOrder: { type: integer, minimum: 0, default: 0 }
      oneOf:
        - required: [ownerId]
          properties:
            ownerType: { const: INVENTORY_FINDING }
            context: { const: INSPECTION }
          not: { anyOf: [{ required: [documentId] }, { required: [lineId] }, { required: [clientReferenceId] }] }
        - required: [ownerId]
          properties:
            ownerType: { const: CABIN }
            context: { const: WAREHOUSE }
          not: { anyOf: [{ required: [documentId] }, { required: [lineId] }, { required: [clientReferenceId] }] }
        - required: [ownerId]
          properties:
            ownerType: { const: MAINTENANCE_ESTIMATE }
            context: { const: ESTIMATE }
          not: { anyOf: [{ required: [documentId] }, { required: [lineId] }, { required: [clientReferenceId] }] }
        - required: [ownerId]
          properties:
            ownerType: { const: MAINTENANCE_REPAIR }
            context: { const: REPAIR }
          not: { anyOf: [{ required: [documentId] }, { required: [lineId] }, { required: [clientReferenceId] }] }
        - required: [ownerId]
          properties:
            ownerType: { const: MAINTENANCE_ACCEPTANCE }
            context: { const: ACCEPTANCE }
          not: { anyOf: [{ required: [documentId] }, { required: [lineId] }, { required: [clientReferenceId] }] }
        - required: [ownerId]
          properties:
            ownerType: { const: MAINTENANCE_CATALOG_NODE }
            context: { const: CATALOG }
          not: { anyOf: [{ required: [documentId] }, { required: [lineId] }, { required: [clientReferenceId] }] }
        - required: [documentId, lineId]
          properties:
            ownerType: { const: LOGISTICS_RETURN }
            context: { const: RETURN_INSPECTION }
          not: { anyOf: [{ required: [ownerId] }, { required: [clientReferenceId] }] }
        - required: [documentId, lineId]
          properties:
            ownerType: { const: LOGISTICS_SHIPMENT }
            context: { const: SHIPMENT }
          not: { anyOf: [{ required: [ownerId] }, { required: [clientReferenceId] }] }
        - required: [documentId, lineId]
          properties:
            ownerType: { const: LOGISTICS_TRANSFER }
            context: { const: TRANSFER }
          not: { anyOf: [{ required: [ownerId] }, { required: [clientReferenceId] }] }
        - required: [ownerId]
          properties:
            ownerType: { const: LOGISTICS_CUSTOMER_PROFILE }
            context: { const: PROFILE_AVATAR }
          not: { anyOf: [{ required: [documentId] }, { required: [lineId] }, { required: [clientReferenceId] }] }
        - required: [ownerId]
          properties:
            ownerType: { const: TASK_BOARD_WORKER_PROFILE }
            context: { const: PROFILE_AVATAR }
          not: { anyOf: [{ required: [documentId] }, { required: [lineId] }, { required: [clientReferenceId] }] }
        - required: [ownerId, clientReferenceId]
          properties:
            ownerType: { const: TASK_BOARD_ENTRY }
            context: { const: WORK_RESULT }
          not: { anyOf: [{ required: [documentId] }, { required: [lineId] }] }
        - required: [ownerId, clientReferenceId]
          properties:
            ownerType: { const: DRIVER_SHIFT }
            context: { const: SHIFT_EVIDENCE }
          not: { anyOf: [{ required: [documentId] }, { required: [lineId] }] }
      allOf:
        - oneOf:
            - required: [contentType, contentLength, checksumSha256]
              not: { required: [imageVariants] }
            - required: [imageVariants]
              not:
                anyOf:
                  - { required: [contentType] }
                  - { required: [contentLength] }
                  - { required: [checksumSha256] }
    CreateImageVariant:
      type: object
      additionalProperties: false
      required: [kind, contentLength, checksumSha256, width, height]
      properties:
        kind: { enum: [SMALL, MEDIUM, LARGE] }
        contentLength: { type: integer, minimum: 1, maximum: 1048576 }
        checksumSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
    FinalizeUploadRequest:
      type: object
      additionalProperties: false
      properties:
        objectVersionId: { type: string, minLength: 1, maxLength: 255 }
        etag: { type: string, minLength: 1, maxLength: 255 }
        checksumSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        variants:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: '#/components/schemas/FinalizeImageVariant' }
          allOf:
            - contains:
                type: object
                required: [kind]
                properties: { kind: { const: SMALL } }
            - contains:
                type: object
                required: [kind]
                properties: { kind: { const: MEDIUM } }
            - contains:
                type: object
                required: [kind]
                properties: { kind: { const: LARGE } }
      oneOf:
        - required: [objectVersionId, etag, checksumSha256]
          not: { required: [variants] }
        - required: [variants]
          not:
            anyOf:
              - { required: [objectVersionId] }
              - { required: [etag] }
              - { required: [checksumSha256] }
    FinalizeImageVariant:
      type: object
      additionalProperties: false
      required: [kind, objectVersionId, etag, checksumSha256]
      properties:
        kind: { enum: [SMALL, MEDIUM, LARGE] }
        objectVersionId: { type: string, minLength: 1, maxLength: 255 }
        etag: { type: string, minLength: 1, maxLength: 255 }
        checksumSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    DeleteRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    UploadSession:
      type: object
      additionalProperties: false
      required: [uploadSessionId, mediaId, expiresAt, contentUploadUrl, variantUploadUrls]
      properties:
        uploadSessionId: { type: string, format: uuid }
        mediaId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        contentUploadUrl:
          description: Same-origin source path for SOURCE sessions; null for IMAGE_VARIANTS.
          oneOf:
            - type: string
              pattern: '^/api/media/v1/upload-sessions/[0-9a-f-]{36}/content$'
            - type: 'null'
        variantUploadUrls:
          description: Three same-origin paths for IMAGE_VARIANTS; empty for SOURCE sessions.
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/ImageVariantUploadTarget' }
    ImageVariantUploadTarget:
      type: object
      additionalProperties: false
      required: [kind, contentUploadUrl]
      properties:
        kind: { enum: [SMALL, MEDIUM, LARGE] }
        contentUploadUrl:
          type: string
          pattern: '^/api/media/v1/upload-sessions/[0-9a-f-]{36}/variants/(SMALL|MEDIUM|LARGE)/content$'
    UploadedObject:
      type: object
      additionalProperties: false
      required: [objectVersionId, etag, checksumSha256]
      properties:
        objectVersionId: { type: string, minLength: 1, maxLength: 255 }
        etag: { type: string, minLength: 1, maxLength: 255 }
        checksumSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    MediaPage:
      type: object
      additionalProperties: false
      required: [items, next]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/MediaAsset' }
        next: { oneOf: [{ type: string, maxLength: 64 }, { type: 'null' }] }
    CabinCoverBatchRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, cabinIds]
      properties:
        warehouseId: { type: string, format: uuid }
        cabinIds:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items: { type: string, format: uuid }
    CabinCoverPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/CabinCoverProjection' }
    CabinCoverProjection:
      type: object
      additionalProperties: false
      required: [cabinId, photoCount, cover, previews]
      properties:
        cabinId: { type: string, format: uuid }
        photoCount:
          description: Number of logical, non-deleted IMAGE associations in the canonical active CABIN gallery folder.
          type: integer
          minimum: 1
        cover:
          description: Exact canonical cover pointer projection; null when the pointer has no READY SMALL variant.
          oneOf:
            - { $ref: '#/components/schemas/CabinCoverVariant' }
            - { type: 'null' }
        previews:
          description: Up to 100 READY, non-deleted images from the canonical active CABIN gallery folder with one exact SMALL variant each; the canonical cover is first and the remaining images retain stable association order.
          type: array
          maxItems: 100
          uniqueItems: true
          items: { $ref: '#/components/schemas/CabinCoverVariant' }
    CabinCoverVariant:
      type: object
      additionalProperties: false
      required: [mediaId, generation, kind, contentType, contentPath, width, height]
      properties:
        mediaId: { type: string, format: uuid }
        generation: { type: integer, minimum: 1 }
        kind: { const: SMALL }
        contentType: { type: string }
        contentPath:
          description: Relative same-origin API path; never an object-store URL or key.
          type: string
          pattern: '^/api/media/v1/assets/[0-9a-f-]{36}/variants/SMALL/content\?'
        width: { oneOf: [{ type: integer, minimum: 1 }, { type: 'null' }] }
        height: { oneOf: [{ type: integer, minimum: 1 }, { type: 'null' }] }
    MediaAsset:
      type: object
      additionalProperties: false
      required: [id, folderId, clientReferenceId, fileName, contentType, kind, status, version, generation, rotationDegrees, sortOrder, sizeBytes, createdAt, variants]
      properties:
        id: { type: string, format: uuid }
        folderId:
          description: Logical owner folder; for CABIN archive reads this is the association gallery folder, including inventory-derived batches.
          type: string
          format: uuid
        clientReferenceId:
          oneOf:
            - { type: string, format: uuid }
            - { type: 'null' }
        fileName: { type: string, minLength: 1, maxLength: 512 }
        contentType: { type: string }
        kind: { enum: [IMAGE, VIDEO] }
        status: { enum: [UPLOADING, PROCESSING, READY, FAILED, DELETED] }
        version: { type: integer, minimum: 1 }
        generation: { type: integer, minimum: 0 }
        rotationDegrees:
          description: Historical read-only orientation metadata; newly processed assets always return 0.
          enum: [0, 90, 180, 270]
        sortOrder: { type: integer, minimum: 0 }
        sizeBytes: { oneOf: [{ type: integer, minimum: 1 }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
        variants:
          description: READY IMAGE responses contain SMALL/MEDIUM/LARGE; READY VIDEO responses contain PLAYBACK; ORIGINAL uses the lazy endpoint.
          type: array
          items: { $ref: '#/components/schemas/SafeVariant' }
    SafeVariant:
      type: object
      additionalProperties: false
      required: [kind, contentType, contentPath, width, height]
      properties:
        kind: { enum: [SMALL, MEDIUM, LARGE, PLAYBACK] }
        contentType: { type: string }
        contentPath:
          description: Relative same-origin API path; never an object-store URL or key.
          type: string
          pattern: '^/api/media/v1/assets/[0-9a-f-]{36}/variants/(SMALL|MEDIUM|LARGE|PLAYBACK)/content\?'
        width: { oneOf: [{ type: integer, minimum: 1 }, { type: 'null' }] }
        height: { oneOf: [{ type: integer, minimum: 1 }, { type: 'null' }] }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, detail, instance, code, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        correlationId: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid request.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: Missing or invalid Bearer JWT.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: USER scope, warehouse access or owner proof, or the exact private SERVICE identity/scope, is insufficient.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Scoped media resource not found; owner mismatches are indistinguishable.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: Idempotency, expiry, object, state, limit or optimistic-version conflict.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    UnsupportedMedia:
      description: MIME, container or codec is not in explicit runtime configuration.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unavailable:
      description: PostgreSQL, MinIO, JWKS or another required dependency is unavailable.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
