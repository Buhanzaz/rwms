openapi: 3.1.0
info:
  title: RWMS Auth Service API
  version: 1.0.0
  description: >-
    Canonical public administration and current-user projection API for
    auth-service. OAuth2/OIDC authorization endpoints remain standards-based;
    user access tokens and ID tokens expose the UserTokenClaims projection.
servers:
  - url: /
security:
  - bearerJwt: []
x-rwms-user-token-claims:
  type: object
  additionalProperties: true
  required:
    [
      sub,
      preferred_username,
      principal_type,
      global_role,
      rentalAccess,
      warehouse_access_all,
      warehouse_access,
      client_id,
    ]
  properties:
    sub: { type: string, format: uuid }
    preferred_username: { type: string }
    principal_type: { type: string, const: USER }
    global_role: { $ref: "#/components/schemas/UserGlobalRole" }
    client_id:
      type: string
      description: Managed OAuth client that minted this access token or ID token.
    rentalAccess:
      type: boolean
      description: >-
        Exact camel-case JWT claim emitted for every user access token and ID token.
    warehouse_access_all:
      type: boolean
      description: >-
        Exact snake-case JWT claim. When true, warehouse access covers every
        warehouse permitted by the current authorization policy.
    warehouse_access:
      type: array
      description: Exact snake-case JWT claim containing explicit warehouse grants.
      items: { $ref: "#/components/schemas/EffectiveWarehouseAccess" }
x-rwms-worker-token-claims:
  type: object
  additionalProperties: true
  required:
    [
      sub,
      preferred_username,
      principal_type,
      worker_id,
      warehouse_id,
      client_id,
    ]
  properties:
    sub: { type: string, format: uuid }
    preferred_username: { type: string }
    principal_type: { type: string, const: WORKER }
    worker_id: { type: string, format: uuid }
    warehouse_id: { type: string, format: uuid }
    client_id:
      type: string
      description: Managed OAuth client that minted this access token.
paths:
  /api/auth/csrf:
    get:
      operationId: getAuthCsrfToken
      summary: Bootstrap the CSRF cookie/header pair
      description: >-
        Anonymous bootstrap used before customer registration. The response sets
        XSRF-TOKEN and returns the exact token and header names that must accompany
        the registration POST.
      security: []
      responses:
        "200":
          description: Current CSRF token metadata; XSRF-TOKEN is also set as a cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsrfToken" }
  /api/customer/v1/registrations:
    post:
      operationId: registerCustomer
      summary: Register a customer-only account
      description: >-
        Anonymous but CSRF-protected. Creates an active USER with global_role
        CUSTOMER, no warehouse grants, and no manager or rental-manager
        entitlement. The account can mint tokens only through
        rwms-customer-android with the customer.rental scope.
      security:
        - csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerRegistrationRequest" }
      responses:
        "201":
          description: Customer account created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerRegistration" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/CsrfForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/admin/users:
    get:
      operationId: listAdminUsers
      summary: List users for administration
      description: >-
        Requires the dedicated rwms-admin-web SYSTEM_ADMIN session.
      responses:
        "200":
          description: Users ordered case-insensitively by username.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createAdminUser
      summary: Create an administrable user
      description: >-
        Requires the dedicated rwms-admin-web SYSTEM_ADMIN session and creates
        a user. If rentalAccess is omitted, it defaults to true for SYSTEM_ADMIN,
        WMS_ADMIN, and RENTAL_MANAGER; it defaults to false for every other
        role. An explicit boolean is persisted as supplied.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: getAdminUser
      summary: Get an administrable user
      description: >-
        Requires the dedicated rwms-admin-web SYSTEM_ADMIN session.
      responses:
        "200":
          description: User administration projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateAdminUser
      summary: Update an administrable user
      description: >-
        Requires the dedicated rwms-admin-web SYSTEM_ADMIN session.
        expectedVersion is required for optimistic concurrency. Omitted rentalAccess preserves
        the stored value.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: User updated, or an unchanged projection for a semantic no-op.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/users/me:
    get:
      operationId: getCurrentUser
      summary: Get the current user projection
      description: >-
        Requires a USER bearer JWT. rentalAccess is the current persisted
        entitlement projection; callers may instead read the boolean claim of
        the same name from a user access token or ID token.
      responses:
        "200":
          description: Current active user and effective warehouse access projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    csrfCookie:
      type: apiKey
      in: cookie
      name: XSRF-TOKEN
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    UserGlobalRole:
      type: string
      enum:
        [
          SYSTEM_ADMIN,
          WMS_ADMIN,
          WAREHOUSE_MANAGER,
          RENTAL_MANAGER,
          CUSTOMER,
          VIEWER,
        ]
    PrincipalType:
      type: string
      enum: [USER, WORKER]
    WarehouseAccessLevel:
      type: string
      enum: [VIEW, EDIT, MANAGE]
    WarehouseAccess:
      type: object
      additionalProperties: false
      required: [warehouseId, accessLevel, active]
      properties:
        warehouseId: { type: string, format: uuid }
        accessLevel: { $ref: "#/components/schemas/WarehouseAccessLevel" }
        comment: { type: [string, "null"], maxLength: 1000 }
        active: { type: boolean }
    WarehouseAccessRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, accessLevel]
      properties:
        warehouseId: { type: string, minLength: 1, maxLength: 128 }
        accessLevel: { $ref: "#/components/schemas/WarehouseAccessLevel" }
        comment: { type: [string, "null"], maxLength: 1000 }
        active: { type: [boolean, "null"], default: true }
    EffectiveWarehouseAccess:
      type: object
      additionalProperties: false
      required: [warehouseId, level]
      properties:
        warehouseId: { type: string, format: uuid }
        level: { $ref: "#/components/schemas/WarehouseAccessLevel" }
    CsrfToken:
      type: object
      additionalProperties: false
      required: [token, parameterName, headerName]
      properties:
        token: { type: string, minLength: 1 }
        parameterName: { type: string, minLength: 1 }
        headerName: { type: string, const: X-XSRF-TOKEN }
    CustomerRegistrationRequest:
      type: object
      additionalProperties: false
      required: [username, password, passwordConfirmation]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        password:
          { type: string, minLength: 8, maxLength: 128, writeOnly: true }
        passwordConfirmation:
          { type: string, minLength: 8, maxLength: 128, writeOnly: true }
    CustomerRegistration:
      type: object
      additionalProperties: false
      required: [subjectId, username]
      properties:
        subjectId: { type: string, format: uuid }
        username: { type: string, minLength: 3, maxLength: 64 }
    AdminUser:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          username,
          active,
          globalRole,
          mobileAppAccess,
          rentalAccess,
          warehouseAccesses,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        username: { type: string, minLength: 1, maxLength: 128 }
        firstName: { type: [string, "null"], maxLength: 128 }
        lastName: { type: [string, "null"], maxLength: 128 }
        email: { type: [string, "null"], format: email, maxLength: 255 }
        timeZoneId: { type: [string, "null"], maxLength: 64 }
        active: { type: boolean }
        globalRole: { $ref: "#/components/schemas/UserGlobalRole" }
        mobileAppAccess: { type: boolean }
        rentalAccess:
          type: boolean
          description: Persisted rental entitlement; not inferred by callers from the role.
        warehouseAccesses:
          type: array
          items: { $ref: "#/components/schemas/WarehouseAccess" }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, password, globalRole]
      properties:
        username: { type: string, minLength: 1, maxLength: 128 }
        password:
          { type: string, minLength: 8, maxLength: 200, writeOnly: true }
        firstName: { type: [string, "null"], maxLength: 128 }
        lastName: { type: [string, "null"], maxLength: 128 }
        email: { type: [string, "null"], format: email, maxLength: 255 }
        timeZoneId: { type: [string, "null"], maxLength: 64 }
        globalRole: { $ref: "#/components/schemas/UserGlobalRole" }
        active: { type: [boolean, "null"], default: true }
        mobileAppAccess: { type: [boolean, "null"] }
        rentalAccess:
          type: [boolean, "null"]
          description: >-
            When absent, defaults by globalRole: true for SYSTEM_ADMIN,
            WMS_ADMIN, RENTAL_MANAGER; false otherwise.
        warehouseAccesses:
          type: array
          items: { $ref: "#/components/schemas/WarehouseAccessRequest" }
    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, username, active, globalRole]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        username: { type: string, minLength: 1, maxLength: 128 }
        firstName: { type: [string, "null"], maxLength: 128 }
        lastName: { type: [string, "null"], maxLength: 128 }
        email: { type: [string, "null"], format: email, maxLength: 255 }
        timeZoneId: { type: [string, "null"], maxLength: 64 }
        active: { type: boolean }
        globalRole: { $ref: "#/components/schemas/UserGlobalRole" }
        mobileAppAccess: { type: [boolean, "null"] }
        rentalAccess:
          type: [boolean, "null"]
          description: Omitted preserves the persisted value; explicit value updates it.
    CurrentUser:
      type: object
      additionalProperties: false
      required:
        [
          id,
          username,
          displayName,
          principalType,
          globalRole,
          rentalAccess,
          warehouseAccessAll,
          warehouseAccesses,
        ]
      properties:
        id: { type: string, format: uuid }
        username: { type: string, minLength: 1, maxLength: 128 }
        displayName: { type: string, minLength: 1, maxLength: 257 }
        firstName: { type: [string, "null"], maxLength: 128 }
        lastName: { type: [string, "null"], maxLength: 128 }
        email: { type: [string, "null"], format: email, maxLength: 255 }
        principalType: { $ref: "#/components/schemas/PrincipalType" }
        globalRole: { $ref: "#/components/schemas/UserGlobalRole" }
        rentalAccess: { type: boolean }
        warehouseAccessAll: { type: boolean }
        warehouseAccesses:
          type: array
          items: { $ref: "#/components/schemas/EffectiveWarehouseAccess" }
    ApiProblem:
      type: object
      additionalProperties: true
      required: [status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
  responses:
    BadRequest:
      description: Invalid request.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    Unauthorized:
      description: Missing, expired, or invalid bearer token.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    Forbidden:
      description: Authenticated caller lacks the required role or principal type.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    CsrfForbidden:
      description: CSRF cookie/header pair is missing or invalid.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    NotFound:
      description: Requested user does not exist in the caller's visible boundary.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    Conflict:
      description: Login conflict, stale version, or a protected SYSTEM_ADMIN invariant.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    TooManyRequests:
      description: The anonymous registration budget for the client or service has been exhausted.
      headers:
        Retry-After:
          description: Whole seconds until this registration budget can accept another attempt.
          schema: { type: integer, minimum: 1 }
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
