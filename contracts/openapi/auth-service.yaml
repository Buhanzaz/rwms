openapi: 3.1.0
info:
  title: RWMS Auth Service API
  version: 1.0.0
  description: >-
    Canonical administration, current-user projection, internal worker credential,
    and authorization-event recovery API for auth-service. OAuth2/OIDC authorization endpoints remain standards-based;
    user access tokens and ID tokens expose the UserTokenClaims projection.
servers:
  - url: /
security:
  - bearerJwt: []
x-rwms-user-token-claims:
  type: object
  additionalProperties: true
  required:
    [
      sub,
      preferred_username,
      principal_type,
      global_role,
      rentalAccess,
      warehouse_access_all,
      warehouse_access,
      client_id,
    ]
  properties:
    sub: { type: string, format: uuid }
    preferred_username: { type: string }
    principal_type: { type: string, const: USER }
    global_role: { $ref: "#/components/schemas/UserGlobalRole" }
    client_id:
      type: string
      description: Managed OAuth client that minted this access token or ID token.
    rentalAccess:
      type: boolean
      description: >-
        Exact camel-case JWT claim emitted for every user access token and ID token.
    warehouse_access_all:
      type: boolean
      description: >-
        Exact snake-case JWT claim. When true, warehouse access covers every
        warehouse permitted by the current authorization policy.
    warehouse_access:
      type: array
      description: Exact snake-case JWT claim containing explicit warehouse grants.
      items: { $ref: "#/components/schemas/EffectiveWarehouseAccess" }
x-rwms-worker-token-claims:
  type: object
  additionalProperties: true
  required:
    [
      sub,
      preferred_username,
      principal_type,
      worker_id,
      warehouse_id,
      client_id,
    ]
  properties:
    sub: { type: string, format: uuid }
    preferred_username: { type: string }
    principal_type: { type: string, const: WORKER }
    worker_id: { type: string, format: uuid }
    warehouse_id: { type: string, format: uuid }
    client_id:
      type: string
      description: Managed OAuth client that minted this access token.
paths:
  /api/auth/csrf:
    get:
      operationId: getAuthCsrfToken
      summary: Bootstrap the CSRF cookie/header pair
      description: >-
        Anonymous bootstrap used before customer registration. The response sets
        XSRF-TOKEN and returns the exact token and header names that must accompany
        the registration POST.
      security: []
      responses:
        "200":
          description: Current CSRF token metadata; XSRF-TOKEN is also set as a cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsrfToken" }
  /api/customer/v1/registrations:
    post:
      operationId: registerCustomer
      summary: Register a customer-only account
      description: >-
        Anonymous but CSRF-protected. Creates an active USER with global_role
        CUSTOMER, no warehouse grants, and no manager or rental-manager
        entitlement. The account can mint tokens only through
        rwms-customer-android with the customer.rental scope.
      security:
        - csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerRegistrationRequest" }
      responses:
        "201":
          description: Customer account created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerRegistration" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/CsrfForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/admin/users:
    get:
      operationId: listAdminUsers
      summary: List users for administration
      description: >-
        Requires a USER bearer JWT from rwms-admin-web with admin.manage and
        SYSTEM_ADMIN or WMS_ADMIN; authorization also checks the current persisted user.
      responses:
        "200":
          description: Users ordered case-insensitively by username.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createAdminUser
      summary: Create an administrable user
      description: >-
        Requires a USER bearer JWT from rwms-admin-web with admin.manage and
        SYSTEM_ADMIN or WMS_ADMIN. Only SYSTEM_ADMIN may create a SYSTEM_ADMIN user. If rentalAccess is omitted, it defaults to true for SYSTEM_ADMIN,
        WMS_ADMIN, and RENTAL_MANAGER; it defaults to false for every other
        role. An explicit boolean is persisted as supplied.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: getAdminUser
      summary: Get an administrable user
      description: >-
        Requires a USER bearer JWT from rwms-admin-web with admin.manage and
        SYSTEM_ADMIN or WMS_ADMIN; authorization also checks the current persisted user.
      responses:
        "200":
          description: User administration projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateAdminUser
      summary: Update an administrable user
      description: >-
        Requires a USER bearer JWT from rwms-admin-web with admin.manage and
        SYSTEM_ADMIN or WMS_ADMIN; authorization also checks the current persisted user.
        expectedVersion is required for optimistic concurrency. Omitted rentalAccess preserves
        the stored value.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: User updated, or an unchanged projection for a semantic no-op.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteAdminUser
      summary: Reject physical user deletion
      description: Requires a USER bearer JWT from rwms-admin-web with admin.manage and SYSTEM_ADMIN or
        WMS_ADMIN. The current persisted user must be an administrator; WMS_ADMIN cannot manage SYSTEM_ADMIN.
        Stateless; no CSRF token is required. Physical deletion is currently prohibited because absence
        of history and active sessions is not proven. Existing visible users return 409; disabling a user
        is the supported reversible operation.
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/users/me:
    get:
      operationId: getCurrentUser
      summary: Get the current user projection
      description: >-
        Requires a USER bearer JWT. rentalAccess is the current persisted
        entitlement projection; callers may instead read the boolean claim of
        the same name from a user access token or ID token.
      responses:
        "200":
          description: Current active user and effective warehouse access projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/users/{id}/password:
    parameters:
    - $ref: '#/components/parameters/UserId'
    put:
      operationId: resetAdminUserPassword
      summary: Replace a user password
      description: Requires a USER bearer JWT from rwms-admin-web with admin.manage and SYSTEM_ADMIN
        or WMS_ADMIN. The current persisted user must be an administrator; WMS_ADMIN cannot manage SYSTEM_ADMIN.
        Stateless; no CSRF token is required. expectedVersion fences the mutation; stored authorizations
        are revoked. Passwords are write-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPasswordResetRequest'
      responses:
        '204':
          description: Completed without a response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/users/{id}/warehouse-accesses:
    parameters:
    - $ref: '#/components/parameters/UserId'
    put:
      operationId: replaceAdminUserWarehouseAccesses
      summary: Replace all explicit warehouse grants
      description: Requires a USER bearer JWT from rwms-admin-web with admin.manage and SYSTEM_ADMIN
        or WMS_ADMIN. The current persisted user must be an administrator; WMS_ADMIN cannot manage SYSTEM_ADMIN.
        Stateless; no CSRF token is required. expectedVersion fences the complete replacement set. An
        empty accesses array removes every explicit grant. A semantic no-op preserves the version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseAccessesUpdateRequest'
      responses:
        '200':
          description: Current non-secret result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/users/actor-displays:
    get:
      operationId: listActorDisplays
      summary: Resolve compact actor identities
      description: Requires a USER bearer JWT and a current persisted SYSTEM_ADMIN or WMS_ADMIN user.
        Accepts at most 100 subjectId values before deduplication. Results retain first-occurrence order
        and omit unknown subjects. Stateless; no CSRF token is required.
      responses:
        '200':
          description: Known subject identities in first-occurrence input order.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/ActorDisplay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
      - name: subjectId
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
  /api/internal/worker-credentials/{workerId}:
    parameters:
    - name: workerId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: \S
      description: External worker identifier, trimmed by auth-service; not restricted to UUID syntax.
    put:
      operationId: configureWorkerCredential
      summary: Create or replace a worker credential
      description: Private service endpoint requiring SERVICE, client_id=task-board-service, and worker-credentials.manage.
        Stateless Bearer authentication; no CSRF token is required. Resolves warehouseId through the
        owning warehouse identifier policy and returns its canonical UUID. An exact retry preserves
        the credential state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerCredentialRequest'
      responses:
        '200':
          description: Current non-secret result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerCredential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteWorkerCredential
      summary: Delete a worker credential
      description: Private service endpoint requiring SERVICE, client_id=task-board-service, and worker-credentials.manage.
        Stateless Bearer authentication; no CSRF token is required. Repeating deletion for an absent
        credential succeeds. Existing authorizations are revoked when the credential exists.
      responses:
        '204':
          description: Completed without a response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/internal/worker-credentials/{workerId}/reset:
    parameters:
    - name: workerId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: \S
      description: External worker identifier, trimmed by auth-service; not restricted to UUID syntax.
    post:
      operationId: resetWorkerCredentialPassword
      summary: Replace a worker password
      description: Private service endpoint requiring SERVICE, client_id=task-board-service, and worker-credentials.manage.
        Stateless Bearer authentication; no CSRF token is required. Requires an existing credential
        and revokes its stored authorizations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Completed without a response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/internal/worker-credentials/{workerId}/disable:
    parameters:
    - name: workerId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: \S
      description: External worker identifier, trimmed by auth-service; not restricted to UUID syntax.
    post:
      operationId: disableWorkerCredential
      summary: Disable a worker credential
      description: Private service endpoint requiring SERVICE, client_id=task-board-service, and worker-credentials.manage.
        Stateless Bearer authentication; no CSRF token is required. An absent or already disabled credential
        is an idempotent success.
      responses:
        '204':
          description: Completed without a response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/internal/worker-credentials/{workerId}/enable:
    parameters:
    - name: workerId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: \S
      description: External worker identifier, trimmed by auth-service; not restricted to UUID syntax.
    post:
      operationId: enableWorkerCredential
      summary: Enable an existing worker credential
      description: Private service endpoint requiring SERVICE, client_id=task-board-service, and worker-credentials.manage.
        Stateless Bearer authentication; no CSRF token is required. Requires an existing credential;
        an already active credential is an idempotent success.
      responses:
        '204':
          description: Completed without a response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/internal/worker-credentials/{workerId}/status:
    parameters:
    - name: workerId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: \S
      description: External worker identifier, trimmed by auth-service; not restricted to UUID syntax.
    get:
      operationId: getWorkerCredentialStatus
      summary: Read non-secret worker credential status
      description: Private service endpoint requiring SERVICE, client_id=task-board-service, and worker-credentials.manage.
        Stateless Bearer authentication; no CSRF token is required. An absent credential returns 404;
        the response never contains a password or hash.
      responses:
        '200':
          description: Current non-secret result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerCredential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/eventing/outbox/{eventId}/requeue:
    parameters:
    - name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: requeueAuthOutbox
      summary: Requeue an eligible auth outbox event
      description: Requires a bearer JWT with SYSTEM_ADMIN. This recovery route does not require the
        dedicated admin client or admin.manage scope. Stateless; no CSRF token is required. Requires
        an unpublished DLT row with the matching expectedAttemptCount and no active lease. A missing
        or ineligible row returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequeueOutboxRequest'
      responses:
        '204':
          description: Completed without a response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/eventing/sanitized-dlt/{dltId}/requeue:
    parameters:
    - name: dltId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: requeueAuthSanitizedDlt
      summary: Requeue an eligible sanitized dead-letter record
      description: Requires a bearer JWT with SYSTEM_ADMIN. This recovery route does not require the
        dedicated admin client or admin.manage scope. Stateless; no CSRF token is required. Requires
        FAILED status and the matching expectedAttemptCount. A missing or ineligible row returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequeueOutboxRequest'
      responses:
        '204':
          description: Completed without a response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/eventing/shadow/{aggregateType}/{aggregateId}/reconcile:
    parameters:
    - name: aggregateType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AuthAggregateType'
    - name: aggregateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: reconcileAuthShadow
      summary: Reconcile one blocked authorization shadow
      description: Requires a bearer JWT with SYSTEM_ADMIN. This recovery route does not require the
        dedicated admin client or admin.manage scope. Stateless; no CSRF token is required. The operator
        username must resolve to a canonical auth subject. Recovery uses the expected blocked checkpoint
        and an audit reason to replay the authoritative aggregate stream and resolve its version-gap
        quarantine.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileAuthShadowRequest'
      responses:
        '200':
          description: Current non-secret result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthShadowReconciliation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: A missing shadow checkpoint currently produces an unhandled recovery failure.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [status, error]
                properties:
                  status: {type: integer, const: 500}
                  error: {type: string, const: Internal Server Error}
  /api/admin/eventing/shadow/rebuild:
    post:
      operationId: rebuildAuthShadow
      summary: Rebuild the authorization shadow with replay parity
      description: Requires a bearer JWT with SYSTEM_ADMIN. This recovery route does not require the
        dedicated admin client or admin.manage scope. Stateless; no CSRF token is required. The operator
        username must resolve to a canonical auth subject. operationId identifies a durable replay receipt;
        a repeated completed operation returns its recorded parity result. A failed receipt cannot be
        retried under the same operationId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayAuthShadowRequest'
      responses:
        '200':
          description: Current non-secret result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthShadowReplayParity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    csrfCookie:
      type: apiKey
      in: cookie
      name: XSRF-TOKEN
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    UserGlobalRole:
      type: string
      enum:
        [
          SYSTEM_ADMIN,
          WMS_ADMIN,
          WAREHOUSE_MANAGER,
          RENTAL_MANAGER,
          CUSTOMER,
          VIEWER,
        ]
    PrincipalType:
      type: string
      enum: [USER, WORKER]
    WarehouseAccessLevel:
      type: string
      enum: [VIEW, EDIT, MANAGE]
    WarehouseAccess:
      type: object
      additionalProperties: false
      required: [warehouseId, accessLevel, active]
      properties:
        warehouseId: { type: string, format: uuid }
        accessLevel: { $ref: "#/components/schemas/WarehouseAccessLevel" }
        comment: { type: [string, "null"], maxLength: 1000 }
        active: { type: boolean }
    WarehouseAccessRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, accessLevel]
      properties:
        warehouseId: { type: string, minLength: 1, maxLength: 128 }
        accessLevel: { $ref: "#/components/schemas/WarehouseAccessLevel" }
        comment: { type: [string, "null"], maxLength: 1000 }
        active: { type: [boolean, "null"], default: true }
    EffectiveWarehouseAccess:
      type: object
      additionalProperties: false
      required: [warehouseId, level]
      properties:
        warehouseId: { type: string, format: uuid }
        level: { $ref: "#/components/schemas/WarehouseAccessLevel" }
    CsrfToken:
      type: object
      additionalProperties: false
      required: [token, parameterName, headerName]
      properties:
        token: { type: string, minLength: 1 }
        parameterName: { type: string, minLength: 1 }
        headerName: { type: string, const: X-XSRF-TOKEN }
    CustomerRegistrationRequest:
      type: object
      additionalProperties: false
      required: [username, password, passwordConfirmation]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        password:
          { type: string, minLength: 8, maxLength: 128, writeOnly: true }
        passwordConfirmation:
          { type: string, minLength: 8, maxLength: 128, writeOnly: true }
    CustomerRegistration:
      type: object
      additionalProperties: false
      required: [subjectId, username]
      properties:
        subjectId: { type: string, format: uuid }
        username: { type: string, minLength: 3, maxLength: 64 }
    AdminUser:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          username,
          active,
          globalRole,
          mobileAppAccess,
          rentalAccess,
          warehouseAccesses,
        ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        username: { type: string, minLength: 1, maxLength: 128 }
        firstName: { type: [string, "null"], maxLength: 128 }
        lastName: { type: [string, "null"], maxLength: 128 }
        email: { type: [string, "null"], format: email, maxLength: 255 }
        timeZoneId: { type: [string, "null"], maxLength: 64 }
        active: { type: boolean }
        globalRole: { $ref: "#/components/schemas/UserGlobalRole" }
        mobileAppAccess: { type: boolean }
        rentalAccess:
          type: boolean
          description: Persisted rental entitlement; not inferred by callers from the role.
        warehouseAccesses:
          type: array
          items: { $ref: "#/components/schemas/WarehouseAccess" }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, password, globalRole]
      properties:
        username: { type: string, minLength: 1, maxLength: 128 }
        password:
          { type: string, minLength: 8, maxLength: 200, writeOnly: true }
        firstName: { type: [string, "null"], maxLength: 128 }
        lastName: { type: [string, "null"], maxLength: 128 }
        email: { type: [string, "null"], format: email, maxLength: 255 }
        timeZoneId: { type: [string, "null"], maxLength: 64 }
        globalRole: { $ref: "#/components/schemas/UserGlobalRole" }
        active: { type: [boolean, "null"], default: true }
        mobileAppAccess: { type: [boolean, "null"] }
        rentalAccess:
          type: [boolean, "null"]
          description: >-
            When absent, defaults by globalRole: true for SYSTEM_ADMIN,
            WMS_ADMIN, RENTAL_MANAGER; false otherwise.
        warehouseAccesses:
          type: array
          items: { $ref: "#/components/schemas/WarehouseAccessRequest" }
    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, username, active, globalRole]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        username: { type: string, minLength: 1, maxLength: 128 }
        firstName: { type: [string, "null"], maxLength: 128 }
        lastName: { type: [string, "null"], maxLength: 128 }
        email: { type: [string, "null"], format: email, maxLength: 255 }
        timeZoneId: { type: [string, "null"], maxLength: 64 }
        active: { type: boolean }
        globalRole: { $ref: "#/components/schemas/UserGlobalRole" }
        mobileAppAccess: { type: [boolean, "null"] }
        rentalAccess:
          type: [boolean, "null"]
          description: Omitted preserves the persisted value; explicit value updates it.
    CurrentUser:
      type: object
      additionalProperties: false
      required:
        [
          id,
          username,
          displayName,
          principalType,
          globalRole,
          rentalAccess,
          warehouseAccessAll,
          warehouseAccesses,
        ]
      properties:
        id: { type: string, format: uuid }
        username: { type: string, minLength: 1, maxLength: 128 }
        displayName: { type: string, minLength: 1, maxLength: 257 }
        firstName: { type: [string, "null"], maxLength: 128 }
        lastName: { type: [string, "null"], maxLength: 128 }
        email: { type: [string, "null"], format: email, maxLength: 255 }
        principalType: { $ref: "#/components/schemas/PrincipalType" }
        globalRole: { $ref: "#/components/schemas/UserGlobalRole" }
        rentalAccess: { type: boolean }
        warehouseAccessAll: { type: boolean }
        warehouseAccesses:
          type: array
          items: { $ref: "#/components/schemas/EffectiveWarehouseAccess" }
    AdminPasswordResetRequest:
      type: object
      additionalProperties: false
      required:
      - password
      - expectedVersion
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 200
          writeOnly: true
        expectedVersion:
          type: integer
          format: int32
    WarehouseAccessesUpdateRequest:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      - accesses
      properties:
        expectedVersion:
          type: integer
          format: int32
        accesses:
          type: array
          items:
            $ref: '#/components/schemas/WarehouseAccessRequest'
    ActorDisplay:
      type: object
      additionalProperties: false
      required:
      - subjectId
      - principalType
      - globalRole
      - username
      - firstName
      - lastName
      - email
      properties:
        subjectId:
          type: string
          format: uuid
        principalType:
          $ref: '#/components/schemas/PrincipalType'
        globalRole:
          anyOf:
          - $ref: '#/components/schemas/UserGlobalRole'
          - type: 'null'
        username:
          type: string
        firstName:
          type:
          - string
          - 'null'
        lastName:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
    WorkerCredentialRequest:
      type: object
      additionalProperties: false
      required:
      - warehouseId
      - appLogin
      - password
      properties:
        warehouseId:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 128
        appLogin:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 128
        password:
          type: string
          minLength: 8
          maxLength: 200
          writeOnly: true
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
      - password
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 200
          writeOnly: true
    WorkerCredential:
      type: object
      additionalProperties: false
      required:
      - workerId
      - warehouseId
      - appLogin
      - status
      properties:
        workerId:
          type: string
          minLength: 1
          pattern: \S
        warehouseId:
          type: string
          format: uuid
        appLogin:
          type: string
          minLength: 1
          pattern: \S
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
    RequeueOutboxRequest:
      type: object
      additionalProperties: false
      required:
      - expectedAttemptCount
      properties:
        expectedAttemptCount:
          type: integer
          format: int32
          minimum: 1
    AuthAggregateType:
      type: string
      enum:
      - USER_AUTHORIZATION
      - WORKER_ACCESS
    ReconcileAuthShadowRequest:
      type: object
      additionalProperties: false
      required:
      - expectedCheckpointVersion
      - reason
      properties:
        expectedCheckpointVersion:
          type: integer
          format: int64
          minimum: 0
          description: Expected blocked checkpoint version; omission is rejected by HTTP request binding.
        reason:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 500
    AuthShadowReconciliation:
      type: object
      additionalProperties: false
      required:
      - aggregateType
      - aggregateId
      - version
      - lastEventId
      - resolvedQuarantines
      properties:
        aggregateType:
          $ref: '#/components/schemas/AuthAggregateType'
        aggregateId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
        lastEventId:
          type: string
          format: uuid
        resolvedQuarantines:
          type: integer
          format: int32
          minimum: 0
    ReplayAuthShadowRequest:
      type: object
      additionalProperties: false
      required:
      - operationId
      - reason
      properties:
        operationId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 500
    AuthShadowReplayParity:
      type: object
      additionalProperties: false
      required:
      - aggregateCount
      - versionSum
      - canonicalChecksum
      properties:
        aggregateCount:
          type: integer
          format: int32
          minimum: 0
        versionSum:
          type: integer
          format: int64
          minimum: 0
        canonicalChecksum:
          type: string
          pattern: ^[0-9a-f]{64}$
    ApiProblem:
      type: object
      additionalProperties: true
      required: [status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
  responses:
    BadRequest:
      description: Invalid request.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    Unauthorized:
      description: Missing, expired, or invalid bearer token.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    Forbidden:
      description: Authenticated caller lacks the required role or principal type.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    CsrfForbidden:
      description: CSRF cookie/header pair is missing or invalid.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    NotFound:
      description: Requested user does not exist in the caller's visible boundary.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    Conflict:
      description: Login conflict, stale version, or a protected SYSTEM_ADMIN invariant.
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
    TooManyRequests:
      description: The anonymous registration budget for the client or service has been exhausted.
      headers:
        Retry-After:
          description: Whole seconds until this registration budget can accept another attempt.
          schema: { type: integer, minimum: 1 }
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ApiProblem" } },
        }
