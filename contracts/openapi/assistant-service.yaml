openapi: 3.1.1
info:
  title: RWMS Assistant Service API
  version: 1.0.0
  description: |
    Stateful, owner-scoped rental conversations. The service owns conversation
    history and tool audit records only. Rental inquiries and cabin availability
    remain delegated to logistics-service through private service calls.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/assistant/v1/conversations:
    get:
      operationId: listAssistantConversations
      summary: List active and archived conversations owned by the current rental user
      description: |
        Without a filter, returns the owner's normal conversation history. With rentalOrderId,
        returns only the one active conversation linked to that order, allowing the order screen
        to open the existing chat without scanning client-side history.
      parameters:
        - name: rentalOrderId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Active conversations in most-recent activity order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createAssistantConversation
      summary: Create or replay a conversation and its delegated rental inquiry
      description: |
        Exactly one existing clientId or newClient is required. rentalOrderId is optional; when
        supplied it requires clientId and links or opens the one active conversation for that
        existing order. When
        conversationId is supplied it is the stable idempotency key forwarded
        to logistics-service as Idempotency-Key. The delegated inquiry is
        created before the service persists a new local conversation; reopening an active
        order-linked conversation performs no duplicate create.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Conversation created or replayed for its owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateConversationResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/LogisticsUnavailable"
  /api/assistant/v1/conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: getAssistantConversation
      summary: Read one owner-scoped conversation and its persisted messages
      responses:
        "200":
          description: Conversation detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ConversationNotFound"
    delete:
      operationId: archiveAssistantConversation
      summary: Archive one owner-scoped conversation
      description: Archiving is idempotent and does not delete audit history.
      responses:
        "204":
          description: Conversation archived.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ConversationNotFound"
  /api/assistant/v1/conversations/{conversationId}/turns:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      operationId: streamAssistantTurn
      summary: Persist a user turn and stream the LLM-assisted reply
      description: |
        Clients must request Accept: text/event-stream and send exactly one free-text
        message or exact persisted clarification answer. Availability selection requires
        exact current cabinType and finish; ambiguous type/size relations create one durable
        ordered question queue without acquiring a hold. Only its PENDING head is actionable;
        answering it activates the next QUEUED question and provider execution resumes only after
        the final answer. Informational cabin catalog/help calls
        are read-only. Search omission is REPLACE and APPEND must be explicit. If logistics
        reports INQUIRY_ARCHIVED, the assistant persists a terminal explanation and archives
        the local conversation. The final assistant text and tool records are persisted before
        turn.completed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TurnRequest"
      responses:
        "200":
          description: Server-sent events for a single turn.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/TurnEvent"
              examples:
                started:
                  summary: A persisted user message has started a turn.
                  value:
                    event: turn.started
                    conversationId: 4cf7de27-6b47-4f85-8041-522e50a671e7
                    messageId: 6f029694-0647-4b96-9a88-0a3cbf4c8154
                delta:
                  summary: An incremental assistant text fragment.
                  value:
                    event: assistant.delta
                    conversationId: 4cf7de27-6b47-4f85-8041-522e50a671e7
                    delta: "I can check availability."
                toolStarted:
                  summary: The provider selected a bounded tool.
                  value:
                    event: tool.started
                    conversationId: 4cf7de27-6b47-4f85-8041-522e50a671e7
                    toolCallId: 4b940865-437a-4a6e-8d4c-3158e1f1ce3d
                searchResult:
                  summary: Normalized cabin-search projection.
                  value:
                    event: search.result
                    conversationId: 4cf7de27-6b47-4f85-8041-522e50a671e7
                    toolCallId: 4b940865-437a-4a6e-8d4c-3158e1f1ce3d
                    result:
                      tool: search_available_cabins
                      resultMode: REPLACE
                      filterSuggestions:
                        cabinTypes: [Модуль]
                        finishes: [ЛДСП]
                        dimensions: [6x2.4]
                        categories: []
                        characteristics: [Линолеум]
                      notices: []
                      data:
                        warehouseId: 14a4087c-c21b-43d9-ab70-8bfa7610a1db
                        expiresAt: 2030-08-09T12:10:00Z
                        groups: []
                completed:
                  summary: Persisted final assistant message.
                  value:
                    event: turn.completed
                    conversationId: 4cf7de27-6b47-4f85-8041-522e50a671e7
                    messageId: cba9b3ce-a4aa-4c15-9365-401ee86e39b0
                failed:
                  summary: A provider or tool failure ended the turn.
                  value:
                    event: turn.failed
                    conversationId: 4cf7de27-6b47-4f85-8041-522e50a671e7
                    code: PROVIDER_FAILED
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ConversationNotFound"
  /api/assistant/v1/conversations/{conversationId}/selection:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/IdempotencyKey"
    put:
      operationId: replaceAssistantCabinSelection
      summary: Keep exactly the selected cabin IDs and immediately release removed holds
      description: >-
        Delegates one owner-checked, idempotent replacement to logistics-service. An empty
        rentalItemIds list releases the complete inquiry selection. Assistant-service stores no
        independent availability or hold truth.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CabinSelectionRequest" }
      responses:
        "200":
          description: Authoritative logistics-owned selection after replacement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinSelection" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ConversationNotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/LogisticsUnavailable" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authenticated JWT with rentalAccess true.
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  responses:
    InvalidRequest:
      description: The input did not satisfy the bounded command schema.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: A bearer token is required.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The token has no rental access.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ConversationNotFound:
      description: The conversation is absent or is not owned by the caller.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: A replay attempted to change a conversation's immutable client.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    LogisticsUnavailable:
      description: logistics-service could not accept the private delegation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    CreateConversationRequest:
      type: object
      additionalProperties: false
      properties:
        conversationId:
          type: string
          format: uuid
          description: Optional caller-generated stable idempotency key.
        clientId:
          type: string
          format: uuid
        newClient:
          $ref: "#/components/schemas/NewClient"
        rentalOrderId:
          type: string
          format: uuid
          description: |
            Existing rental order amended by this conversation. logistics-service remains the
            authority for whether the current order is editable and for its client and warehouse.
      oneOf:
        - required: [clientId]
          not:
            required: [newClient]
        - required: [newClient]
          not:
            required: [clientId]
      allOf:
        - if:
            required: [rentalOrderId]
          then:
            required: [clientId]
            not:
              required: [newClient]
    NewClient:
      type: object
      additionalProperties: false
      required: [clientType, displayName, phone]
      oneOf:
        - properties:
            clientType: { const: INDIVIDUAL }
        - required: [contactPerson]
          properties:
            clientType: { enum: [LEGAL_ENTITY] }
            contactPerson: { type: string, minLength: 1, maxLength: 255 }
      properties:
        clientType:
          type: string
          enum: [INDIVIDUAL, LEGAL_ENTITY]
        displayName:
          type: string
          minLength: 1
          maxLength: 512
        phone:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^(?:\+|8)[0-9() .-]{6,31}$'
        contactPerson:
          type: [string, "null"]
          minLength: 1
          maxLength: 255
        email:
          type: [string, "null"]
          format: email
          maxLength: 320
        comment:
          type: [string, "null"]
          minLength: 1
          maxLength: 2000
        source:
          type: [string, "null"]
          minLength: 1
          maxLength: 255
    CreateConversationResponse:
      type: object
      additionalProperties: false
      required: [conversation, inquiry, client]
      properties:
        conversation:
          $ref: "#/components/schemas/Conversation"
        inquiry:
          $ref: "#/components/schemas/RentalInquirySummary"
        client:
          $ref: "#/components/schemas/ClientSummary"
    Conversation:
      type: object
      additionalProperties: false
      required:
        - id
        - version
        - clientId
        - rentalInquiryId
        - rentalOrderId
        - archived
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
        clientId:
          type: string
          format: uuid
        rentalInquiryId:
          type: string
          format: uuid
        rentalOrderId:
          type: [string, "null"]
          format: uuid
        clientType:
          type: [string, "null"]
        clientDisplayName:
          type: [string, "null"]
        archived:
          type: boolean
        archivedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RentalInquirySummary:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: [string, "null"]
    ClientSummary:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        clientType:
          type: [string, "null"]
        displayName:
          type: [string, "null"]
    ConversationDetail:
      type: object
      additionalProperties: false
      required: [conversation, messages, lastSearchResult, clarifications, currentSelection]
      properties:
        conversation:
          $ref: "#/components/schemas/Conversation"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        lastSearchResult:
          anyOf:
            - $ref: "#/components/schemas/CabinSearchToolResult"
            - type: "null"
        clarifications:
          type: array
          items: { $ref: "#/components/schemas/ClarificationQuestion" }
        currentSelection:
          oneOf:
            - $ref: "#/components/schemas/CabinSelection"
            - type: "null"
    Message:
      type: object
      additionalProperties: false
      required: [id, role, content, createdAt, searchNotices]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [USER, ASSISTANT]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        searchNotices:
          type: array
          description: Structured exact-search availability gaps attached to this user turn.
          items:
            $ref: "#/components/schemas/CabinSearchNotice"
    TurnRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [message]
          properties:
            message:
              type: string
              minLength: 1
              maxLength: 8000
        - type: object
          additionalProperties: false
          required: [clarificationAnswer]
          properties:
            clarificationAnswer:
              $ref: "#/components/schemas/ClarificationAnswer"
    ClarificationAnswer:
      type: object
      additionalProperties: false
      required: [questionId, optionId]
      properties:
        questionId: { type: string, format: uuid }
        optionId: { type: string, format: uuid }
    TurnEvent:
      oneOf:
        - $ref: "#/components/schemas/TurnStartedEvent"
        - $ref: "#/components/schemas/AssistantDeltaEvent"
        - $ref: "#/components/schemas/ToolStartedEvent"
        - $ref: "#/components/schemas/SearchResultEvent"
        - $ref: "#/components/schemas/ClarificationRequestedEvent"
        - $ref: "#/components/schemas/ClarificationAnsweredEvent"
        - $ref: "#/components/schemas/SelectionUpdatedEvent"
        - $ref: "#/components/schemas/ToolCompletedEvent"
        - $ref: "#/components/schemas/TurnCompletedEvent"
        - $ref: "#/components/schemas/TurnFailedEvent"
      discriminator:
        propertyName: event
    TurnStartedEvent:
      type: object
      additionalProperties: false
      required: [event, conversationId, messageId]
      properties:
        event:
          const: turn.started
        conversationId:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
    AssistantDeltaEvent:
      type: object
      additionalProperties: false
      required: [event, conversationId, delta]
      properties:
        event:
          const: assistant.delta
        conversationId:
          type: string
          format: uuid
        delta:
          type: string
    ToolStartedEvent:
      type: object
      additionalProperties: false
      required: [event, conversationId, toolCallId]
      properties:
        event:
          const: tool.started
        conversationId:
          type: string
          format: uuid
        toolCallId:
          type: string
          format: uuid
    SearchResultEvent:
      type: object
      additionalProperties: false
      required: [event, conversationId, toolCallId, result]
      properties:
        event:
          const: search.result
        conversationId:
          type: string
          format: uuid
        toolCallId:
          type: string
          format: uuid
        result:
          oneOf:
            - $ref: "#/components/schemas/CabinSearchToolResult"
            - $ref: "#/components/schemas/ToolFailureResult"
    ClarificationRequestedEvent:
      type: object
      additionalProperties: false
      required: [event, conversationId, toolCallId, clarification]
      properties:
        event: { const: clarification.requested }
        conversationId: { type: string, format: uuid }
        toolCallId: { type: string, format: uuid }
        clarification: { $ref: "#/components/schemas/ClarificationQuestion" }
    ClarificationAnsweredEvent:
      type: object
      additionalProperties: false
      required: [event, conversationId, messageId, clarification]
      properties:
        event: { const: clarification.answered }
        conversationId: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        clarification: { $ref: "#/components/schemas/ClarificationQuestion" }
    SelectionUpdatedEvent:
      type: object
      additionalProperties: false
      required: [event, conversationId, toolCallId, result]
      properties:
        event: { const: selection.updated }
        conversationId: { type: string, format: uuid }
        toolCallId: { type: string, format: uuid }
        result:
          oneOf:
            - $ref: "#/components/schemas/RemoveSelectedCabinsToolResult"
            - $ref: "#/components/schemas/ToolFailureResult"
    ToolCompletedEvent:
      type: object
      additionalProperties: false
      required: [event, conversationId, toolCallId, result]
      properties:
        event:
          const: tool.completed
        conversationId:
          type: string
          format: uuid
        toolCallId:
          type: string
          format: uuid
        result:
          oneOf:
            - $ref: "#/components/schemas/ToolResult"
            - $ref: "#/components/schemas/ToolFailureResult"
        code:
          type: [string, "null"]
    TurnCompletedEvent:
      type: object
      additionalProperties: false
      required: [event, conversationId, messageId]
      properties:
        event:
          const: turn.completed
        conversationId:
          type: string
          format: uuid
        messageId:
          type: [string, "null"]
          format: uuid
          description: Null when the turn parks on a structured clarification without duplicate assistant text.
    TurnFailedEvent:
      type: object
      additionalProperties: false
      required: [event, conversationId, code]
      properties:
        event:
          const: turn.failed
        conversationId:
          type: string
          format: uuid
        code:
          type: string
          enum:
            - CONVERSATION_UNAVAILABLE
            - PROVIDER_FAILED
            - TURN_FAILED
    ToolResult:
      oneOf:
        - $ref: "#/components/schemas/CabinFacetsToolResult"
        - $ref: "#/components/schemas/CabinSearchToolResult"
        - $ref: "#/components/schemas/CabinClarificationsToolResult"
        - $ref: "#/components/schemas/CabinCatalogToolResult"
        - $ref: "#/components/schemas/RemoveSelectedCabinsToolResult"
      discriminator:
        propertyName: tool
    CabinFacetsToolResult:
      type: object
      additionalProperties: false
      required: [tool, data]
      properties:
        tool:
          type: string
          const: list_available_cabin_facets
        data:
          $ref: "#/components/schemas/CabinFacetsProjection"
    CabinSearchToolResult:
      type: object
      additionalProperties: false
      required: [tool, resultMode, filterSuggestions, notices, data]
      properties:
        tool:
          type: string
          const: search_available_cabins
        resultMode:
          $ref: "#/components/schemas/SearchResultMode"
        filterSuggestions:
          $ref: "#/components/schemas/CabinFilterSuggestions"
        notices:
          type: array
          items:
            $ref: "#/components/schemas/CabinSearchNotice"
        data:
          $ref: "#/components/schemas/CabinSearchProjection"
    CabinClarificationsToolResult:
      type: object
      additionalProperties: false
      required: [tool, data]
      properties:
        tool:
          type: string
          const: request_cabin_clarifications
        data:
          type: object
          additionalProperties: false
          required: [questions]
          properties:
            questions:
              type: array
              minItems: 1
              maxItems: 5
              items: { $ref: "#/components/schemas/ClarificationQuestion" }
    CabinCatalogToolResult:
      type: object
      additionalProperties: false
      required: [tool, data]
      properties:
        tool: { type: string, const: lookup_cabin_catalog }
        data:
          type: object
          additionalProperties: false
          required: [facets]
          properties:
            facets: { $ref: "#/components/schemas/CabinFacetsProjection" }
            catalog:
              oneOf:
                - $ref: "#/components/schemas/CabinCatalogPage"
                - type: "null"
    RemoveSelectedCabinsToolResult:
      type: object
      additionalProperties: false
      required: [tool, data]
      properties:
        tool: { type: string, const: remove_selected_cabins }
        data:
          type: object
          additionalProperties: false
          required: [inquiryId, warehouseId, expiresAt, rentalItemIds, items, removedRentalItemIds]
          properties:
            inquiryId: { type: string, format: uuid }
            warehouseId:
              type: [string, "null"]
              format: uuid
            expiresAt:
              type: [string, "null"]
              format: date-time
            rentalItemIds:
              type: array
              maxItems: 100
              uniqueItems: true
              items: { type: string, format: uuid }
            items:
              type: array
              maxItems: 100
              items: { $ref: "#/components/schemas/AvailableCabin" }
            removedRentalItemIds:
              type: array
              minItems: 1
              maxItems: 100
              uniqueItems: true
              items: { type: string, format: uuid }
    SearchResultMode:
      type: string
      enum: [APPEND, REPLACE]
    ToolFailureResult:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum:
            - TOOL_ARGUMENTS_INVALID
            - LOGISTICS_UNAVAILABLE
            - INQUIRY_ARCHIVED
            - TOOL_FAILED
    CabinFacetsProjection:
      type: object
      additionalProperties: false
      required: [warehouses]
      properties:
        warehouses:
          type: array
          items:
            $ref: "#/components/schemas/CabinFacetWarehouse"
    CabinFacetWarehouse:
      type: object
      additionalProperties: false
      required: [warehouseId, name, city, cabinTypes, finishes, dimensions, categories, characteristics, typeDimensions]
      properties:
        warehouseId:
          type: string
          format: uuid
        name:
          type: string
        city:
          type: string
        cabinTypes:
          type: array
          items:
            type: string
        finishes:
          type: array
          items:
            type: string
        dimensions:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            type: string
        characteristics:
          type: array
          items:
            type: string
        typeDimensions:
          type: array
          items: { $ref: "#/components/schemas/CabinTypeDimensions" }
    CabinTypeDimensions:
      type: object
      additionalProperties: false
      required: [cabinType, dimensions]
      properties:
        cabinType: { type: string, minLength: 1, maxLength: 255 }
        dimensions:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 255 }
    CabinFilterSuggestions:
      type: object
      additionalProperties: false
      required: [cabinTypes, finishes, dimensions, categories, characteristics]
      properties:
        cabinTypes: { type: array, items: { type: string } }
        finishes: { type: array, items: { type: string } }
        dimensions: { type: array, items: { type: string } }
        categories: { type: array, items: { type: string } }
        characteristics: { type: array, items: { type: string } }
    ClarificationQuestion:
      type: object
      additionalProperties: false
      required: [id, branchKey, sequenceNumber, kind, prompt, status, options, answeredOptionId, createdAt, answeredAt]
      properties:
        id: { type: string, format: uuid }
        branchKey:
          type: string
          minLength: 1
          maxLength: 255
          description: Stable historical key; it does not create an independently actionable branch.
        sequenceNumber:
          type: integer
          format: int32
          minimum: 1
          description: Durable position in the conversation's single clarification queue.
        kind:
          type: string
          enum: [CABIN_TYPE, FINISH, DIMENSIONS, CATEGORY, SEARCH_MERGE]
        prompt: { type: string, minLength: 1, maxLength: 2000 }
        status:
          type: string
          enum: [QUEUED, PENDING, ANSWERED, SUPERSEDED]
          description: QUEUED entries remain hidden from detail and SSE until activated as the sole PENDING head.
        options:
          type: array
          minItems: 2
          maxItems: 30
          items: { $ref: "#/components/schemas/ClarificationOption" }
        answeredOptionId:
          type: [string, "null"]
          format: uuid
        createdAt: { type: string, format: date-time }
        answeredAt:
          type: [string, "null"]
          format: date-time
    ClarificationOption:
      type: object
      additionalProperties: false
      required: [id, label, value]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, minLength: 1, maxLength: 255 }
        value: { type: string, minLength: 1, maxLength: 255 }
    CabinSearchProjection:
      type: object
      additionalProperties: false
      required: [warehouseId, expiresAt, groups]
      properties:
        warehouseId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
          description: Earliest expiry of the short reservations backing this carousel.
        groups:
          type: array
          items:
            $ref: "#/components/schemas/CabinSearchGroupResult"
    CabinSearchGroupResult:
      type: object
      additionalProperties: false
      required: [group, cabins]
      properties:
        group:
          $ref: "#/components/schemas/CabinSearchGroup"
        cabins:
          type: array
          items:
            $ref: "#/components/schemas/AvailableCabin"
    CabinSearchGroup:
      type: object
      additionalProperties: false
      required: [quantity]
      description: |
        One distinct requested filter combination. cabinType, finish, dimensions,
        and category are exact facets. categories is an exact OR list of category
        facets and cannot be combined with category. characteristics is the user-requested
        characteristic text forwarded without invention or normalization.
        linoleum is true for a requested linoleum filter and false only for an
        explicitly requested no-linoleum filter. Every group has its own
        requested quantity.
      properties:
        cabinType:
          type: [string, "null"]
          maxLength: 255
        finish:
          type: [string, "null"]
          maxLength: 255
        dimensions:
          type: [string, "null"]
          maxLength: 255
        category:
          type: [string, "null"]
          maxLength: 255
        categories:
          type: [array, "null"]
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            maxLength: 255
        characteristics:
          type: [string, "null"]
          maxLength: 2000
        linoleum:
          type: [boolean, "null"]
        quantity:
          type: integer
          minimum: 1
          maximum: 30
    CabinSearchNotice:
      type: object
      additionalProperties: false
      required: [code, groups, requestedQuantity, foundQuantity]
      description: |
        An exact requested logical group was not found in full. The criteria are
        carried structurally so the client can render the warning without parsing
        assistant prose. For a shared total, requestedQuantity is authoritative
        and each group has a positive materialized display quantity.
      properties:
        code:
          type: string
          enum: [CABINS_NOT_FOUND, CABINS_PARTIALLY_FOUND]
        groups:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CabinSearchNoticeGroup"
        requestedQuantity:
          type: integer
          minimum: 1
          maximum: 30
        foundQuantity:
          type: integer
          minimum: 0
          maximum: 30
    CabinSearchNoticeGroup:
      type: object
      additionalProperties: false
      required: [quantity]
      description: Exact logical search criteria. categories is exact OR filtering.
      properties:
        cabinType:
          type: [string, "null"]
          maxLength: 255
        finish:
          type: [string, "null"]
          maxLength: 255
        dimensions:
          type: [string, "null"]
          maxLength: 255
        category:
          type: [string, "null"]
          maxLength: 255
        categories:
          type: [array, "null"]
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            maxLength: 255
        characteristics:
          type: [string, "null"]
          maxLength: 2000
        linoleum:
          type: [boolean, "null"]
        quantity:
          type: integer
          minimum: 1
          maximum: 30
    AvailableCabin:
      type: object
      additionalProperties: false
      required: [id, version, warehouseId, number, status, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
        warehouseId:
          type: string
          format: uuid
        number:
          type: [string, "null"]
        status:
          type: string
          description: Every cabin returned by the search is currently free.
          enum: [FREE]
        rentalType:
          type: [string, "null"]
        dimensions:
          type: [string, "null"]
        finishing:
          type: [string, "null"]
        category:
          type: [string, "null"]
        characteristics:
          type: [string, "null"]
        linoleum:
          type: [boolean, "null"]
        passport:
          type: [object, "null"]
          additionalProperties: true
        tags:
          type: [array, "null"]
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
    CabinFact:
      type: object
      additionalProperties: false
      required: [id, version, warehouseId, status, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        number: { type: [string, "null"] }
        status: { type: string }
        rentalType: { type: [string, "null"] }
        dimensions: { type: [string, "null"] }
        finishing: { type: [string, "null"] }
        category: { type: [string, "null"] }
        characteristics: { type: [string, "null"] }
        linoleum: { type: [boolean, "null"] }
        passport:
          type: [object, "null"]
          additionalProperties: true
        tags:
          type: [array, "null"]
          items: { type: string }
        updatedAt: { type: string, format: date-time }
    CabinCatalogPage:
      type: object
      additionalProperties: false
      required: [warehouseId, content, page, size, totalElements, totalPages]
      properties:
        warehouseId: { type: string, format: uuid }
        content:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/CabinFact" }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    CabinSelectionRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, rentalItemIds]
      properties:
        warehouseId: { type: string, format: uuid }
        rentalItemIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    CabinSelection:
      type: object
      additionalProperties: false
      required: [inquiryId, warehouseId, expiresAt, rentalItemIds, items]
      properties:
        inquiryId: { type: string, format: uuid }
        warehouseId:
          type: [string, "null"]
          format: uuid
        expiresAt:
          type: [string, "null"]
          format: date-time
        rentalItemIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/AvailableCabin" }
    Problem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
