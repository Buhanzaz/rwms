      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }
        cancelledAt: { type: string, format: date-time }
    InventoryActor:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
