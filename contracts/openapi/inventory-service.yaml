      type: object
      additionalProperties: false
      required: [expectedSessionRevision, expectedSettingsRevision, movementScheduleMode, repairScheduleMode]
      properties:
        expectedSessionRevision: { type: integer, format: int64, minimum: 0 }
        expectedSettingsRevision: { type: integer, format: int64, minimum: 0 }
        movementScheduleMode: { $ref: '#/components/schemas/FinalPlanScheduleMode' }
        repairScheduleMode: { $ref: '#/components/schemas/FinalPlanScheduleMode' }
    FinalPlanReconciliationDecision:
      type: object
      description: >-
        CREATE is valid only when preflight has no active candidate. A selected existing target
