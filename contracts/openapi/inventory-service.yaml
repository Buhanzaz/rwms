      type: object
      additionalProperties: false
      required: [expectedSessionRevision, finalPlanVersion, finalPlanSha256, findingRevisions]
      properties:
        expectedSessionRevision: { type: integer, format: int64, minimum: 0 }
        finalPlanVersion: { type: integer, format: int64, minimum: 1 }
        finalPlanSha256: { $ref: '#/components/schemas/Sha256' }
        findingRevisions: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/RevisionExpectation' } }
    CompleteSessionRequest:
      type: object
      additionalProperties: false
      required: [expectedSessionRevision, finalPlanVersion, finalPlanSha256, findingRevisions, acknowledgementSha256, validationSha256]
      properties:
        expectedSessionRevision: { type: integer, format: int64, minimum: 0 }
        finalPlanVersion: { type: integer, format: int64, minimum: 1 }
        finalPlanSha256: { $ref: '#/components/schemas/Sha256' }
        findingRevisions: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/RevisionExpectation' } }
        acknowledgementSha256: { $ref: '#/components/schemas/Sha256' }
        validationSha256:
          allOf: [{ $ref: '#/components/schemas/Sha256' }]
          description: >-
            Digest of the business-significant registry validation facts from the preview.
            A rental item's technical asset version is intentionally excluded.
    CancelSessionRequest:
      type: object
      additionalProperties: false
      required: [expectedSessionRevision, reason]
      properties:
        expectedSessionRevision: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    PublicationExpectation:
      type: object
      additionalProperties: false
      required: [findingId, expectedPublicationRevision]
      properties:
        findingId: { type: string, format: uuid }
        expectedPublicationRevision: { type: integer, format: int64, minimum: 0 }
    PublishFindingsRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [expectedSessionRevision, allEligible, findings]
          properties:
            expectedSessionRevision: { type: integer, format: int64, minimum: 0 }
            allEligible: { type: boolean, const: true }
            findings: { type: array, maxItems: 0 }
        - type: object
          additionalProperties: false
          required: [expectedSessionRevision, allEligible, findings]
          properties:
            expectedSessionRevision: { type: integer, format: int64, minimum: 0 }
            allEligible: { type: boolean, const: false }
            findings:
              type: array
              minItems: 1
              uniqueItems: true
              items: { $ref: '#/components/schemas/PublicationExpectation' }
    RecalculateInventoryOutcomeRequest:
      type: object
      additionalProperties: false
      required: [expectedSessionRevision, finalPlanVersion, finalPlanSha256]
      properties:
        expectedSessionRevision: { type: integer, format: int64, minimum: 0 }
        finalPlanVersion: { type: integer, format: int64, minimum: 1 }
        finalPlanSha256: { $ref: '#/components/schemas/Sha256' }
    RetryPublicationRequest:
      type: object
      additionalProperties: false
      required: [expectedPublicationRevision, reconcileReason, currentPreconditionSha256]
      properties:
        expectedPublicationRevision: { type: integer, format: int64, minimum: 0 }
        reconcileReason: { oneOf: [{ type: string, minLength: 1, maxLength: 2000 }, { type: 'null' }] }
        currentPreconditionSha256: { $ref: '#/components/schemas/NullableSha256' }
    ClosePublicationRequest:
      type: object
      additionalProperties: false
      required: [expectedPublicationRevision, reason]
      properties:
        expectedPublicationRevision: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    FurnitureReview:
      type: object
      additionalProperties: false
      required: [inventoryId, sessionRevision, stage, assetSnapshotSha256, reviewSha256, confirmed, items]
      properties:
        inventoryId: { type: string, format: uuid }
        sessionRevision: { type: integer, format: int64, minimum: 0 }
        stage: { $ref: '#/components/schemas/InventoryReviewStage' }
        assetSnapshotSha256: { $ref: '#/components/schemas/Sha256' }
        reviewSha256: { $ref: '#/components/schemas/NullableSha256' }
        confirmed: { type: boolean }
        items:
          type: array
          items: { $ref: '#/components/schemas/FurnitureReviewItem' }
    FurnitureReviewItem:
      type: object
      additionalProperties: false
      required: [equipmentId, catalogVersion, equipmentName, currentStockQuantity, observedStockQuantity, cabins]
      properties:
        equipmentId: { type: string, format: uuid }
        catalogVersion: { type: integer, format: int64, minimum: 0 }
        equipmentName: { type: string, minLength: 1, maxLength: 255 }
        currentStockQuantity: { type: integer, format: int64, minimum: 0 }
        observedStockQuantity: { type: integer, format: int64, minimum: 0 }
        cabins:
          type: array
          items: { $ref: '#/components/schemas/FurnitureReviewCabin' }
    FurnitureReviewCabin:
      type: object
      additionalProperties: false
      required: [findingId, assetId, cabinNumber, status, currentQuantity, observedQuantity]
      properties:
        findingId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        cabinNumber: { type: string, minLength: 1, maxLength: 128 }
        status: { $ref: '#/components/schemas/RentalItemStatus' }
        currentQuantity: { type: integer, format: int64, minimum: 0 }
        observedQuantity: { type: integer, format: int64, minimum: 0 }
    SessionSummary:
      type: object
      additionalProperties: false
      required: [id, sessionRevision, warehouseId, warehouseVersion, warehouseTimeZone, author, businessDate, lifecycle, reviewStage, furnitureReconciliationState, expectedCount, findingCount, inspectedCount, startedAt, terminalAt, publicationState]
      properties:
        id: { type: string, format: uuid }
        sessionRevision: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        warehouseVersion: { type: integer, format: int64, minimum: 0 }
        warehouseTimeZone: { type: string, minLength: 1, maxLength: 64 }
        author: { $ref: '#/components/schemas/InventoryActor' }
        businessDate: { type: string, format: date }
        lifecycle: { $ref: '#/components/schemas/SessionLifecycle' }
        reviewStage: { $ref: '#/components/schemas/InventoryReviewStage' }
        furnitureReconciliationState: { $ref: '#/components/schemas/FurnitureReconciliationState' }
        expectedCount: { type: integer, minimum: 0 }
        findingCount: { type: integer, format: int64, minimum: 0 }
        inspectedCount: { type: integer, format: int64, minimum: 0 }
        startedAt: { type: string, format: date-time }
        terminalAt: { $ref: '#/components/schemas/NullableDateTime' }
        publicationState: { $ref: '#/components/schemas/AggregatePublicationState' }
    SessionDetail:
      type: object
      additionalProperties: false
      required: [id, sessionRevision, warehouseId, warehouseVersion, warehouseTimeZone, author, businessDate, lifecycle, reviewStage, furnitureReconciliationState, expectedCount, findingCount, inspectedCount, startedAt, terminalAt, publicationState, membershipMovements, statistics, cancellation]
      properties:
        id: { type: string, format: uuid }
        sessionRevision: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        warehouseVersion: { type: integer, format: int64, minimum: 0 }
        warehouseTimeZone: { type: string, minLength: 1, maxLength: 64 }
        author: { $ref: '#/components/schemas/InventoryActor' }
        businessDate: { type: string, format: date }
        lifecycle: { $ref: '#/components/schemas/SessionLifecycle' }
        reviewStage: { $ref: '#/components/schemas/InventoryReviewStage' }
        furnitureReconciliationState: { $ref: '#/components/schemas/FurnitureReconciliationState' }
        expectedCount: { type: integer, minimum: 0 }
        findingCount: { type: integer, format: int64, minimum: 0 }
        inspectedCount: { type: integer, format: int64, minimum: 0 }
        startedAt: { type: string, format: date-time }
        terminalAt: { $ref: '#/components/schemas/NullableDateTime' }
        publicationState: { $ref: '#/components/schemas/AggregatePublicationState' }
        membershipMovements:
          type: array
          items: { $ref: '#/components/schemas/MembershipMovement' }
        statistics: { oneOf: [{ $ref: '#/components/schemas/FrozenStatistics' }, { type: 'null' }] }
        cancellation: { oneOf: [{ $ref: '#/components/schemas/CancellationAudit' }, { type: 'null' }] }
    CancellationAudit:
      type: object
      additionalProperties: false
      required: [reason, cancelledAt]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }
        cancelledAt: { type: string, format: date-time }
    MembershipMovement:
      type: object
      additionalProperties: false
      required: [id, type, assetId, displayCanonicalNumber, origin, fromWarehouseId, toWarehouseId, status, tenantSnapshot, occurredAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [DEPARTED, TRANSFERRED, ARRIVED] }
        assetId: { type: string, format: uuid }
        displayCanonicalNumber: { type: string, minLength: 1, maxLength: 128 }
        origin: { $ref: '#/components/schemas/FindingOrigin' }
        fromWarehouseId: { $ref: '#/components/schemas/NullableUuid' }
        toWarehouseId: { $ref: '#/components/schemas/NullableUuid' }
        status:
          oneOf:
            - { $ref: '#/components/schemas/RentalItemStatus' }
            - { type: 'null' }
        tenantSnapshot:
          oneOf:
            - { type: string, maxLength: 512 }
            - { type: 'null' }
        occurredAt: { type: string, format: date-time }
    InventoryActor:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, minLength: 1, maxLength: 255 }
    Finding:
      type: object
      additionalProperties: false
      required: [id, inventoryId, findingRevision, origin, inspection, inspectionSource, reconciliation, assetId, assetVersion, displayCanonicalNumber, identityMatchKey, passportObservation, equipmentObservation, mutationState, planFingerprintSha256, comment, expectedSnapshot, inspectionBaseline, currentSnapshot, conflicts, conflictResolution, frozenPlan, coverMediaId, media, publication]
      properties:
        id: { type: string, format: uuid }
        inventoryId: { type: string, format: uuid }
        findingRevision: { type: integer, format: int64, minimum: 0 }
        origin: { $ref: '#/components/schemas/FindingOrigin' }
        inspection: { $ref: '#/components/schemas/InspectionState' }
        inspectionSource:
          oneOf:
            - { $ref: '#/components/schemas/InspectionSource' }
            - { type: 'null' }
        reconciliation: { $ref: '#/components/schemas/ReconciliationState' }
        assetId: { $ref: '#/components/schemas/NullableUuid' }
        assetVersion: { oneOf: [{ type: integer, format: int64, minimum: 0 }, { type: 'null' }] }
        displayCanonicalNumber: { type: string, minLength: 1, maxLength: 128 }
        identityMatchKey: { type: string, minLength: 1, maxLength: 128 }
        passportObservation: { $ref: '#/components/schemas/PassportObservation' }
        equipmentObservation: { $ref: '#/components/schemas/EquipmentObservation' }
        mutationState: { type: string, enum: [IDLE, SOURCE_CREATE_PENDING, SOURCE_CREATED, PLAN_RESOLVE_PENDING] }
        planFingerprintSha256: { $ref: '#/components/schemas/NullableSha256' }
        comment: { type: string, maxLength: 2000 }
        expectedSnapshot: { oneOf: [{ $ref: '#/components/schemas/ExpectedItemSnapshot' }, { type: 'null' }] }
        inspectionBaseline: { oneOf: [{ $ref: '#/components/schemas/CurrentItemSnapshot' }, { type: 'null' }] }
        currentSnapshot: { oneOf: [{ $ref: '#/components/schemas/CurrentItemSnapshot' }, { type: 'null' }] }
        conflicts: { type: array, items: { $ref: '#/components/schemas/InventoryConflict' } }
        conflictResolution: { oneOf: [{ $ref: '#/components/schemas/ConflictResolution' }, { type: 'null' }] }
        frozenPlan: { oneOf: [{ $ref: '#/components/schemas/FrozenPlan' }, { type: 'null' }] }
        coverMediaId: { $ref: '#/components/schemas/NullableUuid' }
        media: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/MediaReference' } }
        publication: { oneOf: [{ $ref: '#/components/schemas/PublicationIntent' }, { type: 'null' }] }
    ExpectedItemSnapshot:
      type: object
      additionalProperties: false
      required: [assetId, assetVersion, warehouseId, status, displayCanonicalNumber, tenantSnapshot, passportSnapshot, contentsSnapshot]
      properties:
        assetId: { type: string, format: uuid }
        assetVersion: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        status: { type: string, enum: [BOOKED, REPAIR, WAITING_REPAIR_CHECK, CAPITAL_REPAIR, AFTER_RENT, SALE, USED_SALE, RESERVED, FREE, WAREHOUSE, OWN_NEEDS] }
        displayCanonicalNumber: { type: string, minLength: 1, maxLength: 128 }
        tenantSnapshot: { type: [string, 'null'], maxLength: 512 }
        passportSnapshot:
          type: object
          additionalProperties: true
          description: Safe structured capture snapshot; the service rejects persisted JSON over 65536 characters.
        contentsSnapshot:
          description: Safe structured capture snapshot; the service rejects persisted JSON over 65536 characters.
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: array, items: {} }
    CurrentItemSnapshot:
      type: object
      additionalProperties: false
      required: [assetId, assetVersion, warehouseId, status, displayCanonicalNumber, tenantSnapshot, passportSnapshot, contentsSnapshot, repairsSnapshot]
      properties:
        assetId: { type: string, format: uuid }
        assetVersion: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RentalItemStatus' }
        displayCanonicalNumber: { type: string, minLength: 1, maxLength: 128 }
        tenantSnapshot: { type: [string, 'null'], maxLength: 512 }
        passportSnapshot:
          type: object
          additionalProperties: true
          description: Inventory-safe registry passport without local comments or notes.
        contentsSnapshot:
          type: array
          items: {}
          description: Inventory-safe cabin contents ordered by asset-service.
        repairsSnapshot:
          type: array
          items: { $ref: '#/components/schemas/RepairRegistryFact' }
          description: Active maintenance facts relevant to the inspected cabin.
    RepairRegistryFact:
      type: object
      additionalProperties: false
      required: [repairId, rootRepairId, origin, kind, executionState, acceptanceState, planFingerprintSha256]
      properties:
        repairId: { type: string, format: uuid }
        rootRepairId: { type: string, format: uuid }
        origin: { type: string, minLength: 1, maxLength: 48 }
        kind: { type: string, minLength: 1, maxLength: 48 }
        executionState: { type: string, minLength: 1, maxLength: 48 }
        acceptanceState: { type: string, minLength: 1, maxLength: 48 }
        planFingerprintSha256: { $ref: '#/components/schemas/Sha256' }
    InventoryConflict:
      type: object
      additionalProperties: false
      required: [code, message, expected, actual]
      properties:
        code:
          type: string
          enum: [WAREHOUSE_CHANGED, STATUS_CHANGED, TENANT_CHANGED, RENTED, WRITTEN_OFF, OTHER_WAREHOUSE, ADDED_AFTER_START, RENTAL_ITEM_MISSING, ASSET_CHANGED, NUMBER_CHANGED, PASSPORT_CHANGED, CONTENTS_CHANGED, REPAIRS_CHANGED]
        message: { type: string, minLength: 1, maxLength: 1000 }
        expected: { type: [string, 'null'] }
        actual: { type: [string, 'null'] }
    ConflictResolution:
      type: object
      additionalProperties: false
      required: [strategy, reason, resolvedAt]
      properties:
        strategy: { $ref: '#/components/schemas/ConflictResolutionStrategy' }
        reason:
          oneOf:
            - { type: string, minLength: 1, maxLength: 2000 }
            - { type: 'null' }
        resolvedAt: { type: string, format: date-time }
    FrozenPlan:
      type: object
      additionalProperties: false
      required: [mode, catalogVersionId, fingerprintSha256, priority, coverMediaId, movementToRepair, logisticsPlanningMode, logisticsScheduledDate, lines, stages, forceCapitalRepair]
      properties:
        mode: { type: string, enum: [AUTO, MANUAL] }
        catalogVersionId: { type: string, format: uuid }
        fingerprintSha256: { $ref: '#/components/schemas/Sha256' }
        priority:
          type: integer
          minimum: 1
          maximum: 5
        coverMediaId: { $ref: '#/components/schemas/NullableUuid' }
        movementToRepair: { type: boolean }
        forceCapitalRepair: { type: boolean }
        logisticsPlanningMode:
          oneOf: [{ $ref: '#/components/schemas/LogisticsPlanningMode' }, { type: 'null' }]
        logisticsScheduledDate:
          oneOf: [{ type: string, format: date }, { type: 'null' }]
          description: Required only for inbound FIXED_DATE and null otherwise.
        lines: { type: array, minItems: 1, maxItems: 2000, items: { $ref: '#/components/schemas/FrozenPlanLine' } }
        stages: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/FrozenPlanStage' } }
      allOf:
        - oneOf:
            - properties:
                movementToRepair: { const: false }
                logisticsPlanningMode: { type: 'null' }
                logisticsScheduledDate: { type: 'null' }
            - properties:
                movementToRepair: { const: true }
                logisticsPlanningMode: { const: AUTO }
                logisticsScheduledDate: { type: 'null' }
            - properties:
                movementToRepair: { const: true }
                logisticsPlanningMode: { const: FIXED_DATE }
                logisticsScheduledDate: { type: string, format: date }
        - not:
            required: [movementToRepair, forceCapitalRepair]
            properties:
              movementToRepair: { const: true }
              forceCapitalRepair: { const: true }
    FrozenPlanLine:
      type: object
      additionalProperties: false
      required: [id, sourceKind, lineType, catalogVersionId, catalogNodeId, routingQueueId, routingQueueName, routingQueueType, description, normalizedDescription, unit, quantity, unitPriceMinor, normativeMinutes, groupComment, mediaReferences]
      properties:
        id: { type: string, format: uuid }
        sourceKind: { type: string, enum: [CATALOG, MANUAL] }
        lineType: { type: string, enum: [WORK, MATERIAL] }
        catalogVersionId: { $ref: '#/components/schemas/NullableUuid' }
        catalogNodeId: { $ref: '#/components/schemas/NullableUuid' }
        routingQueueId:
          $ref: '#/components/schemas/NullableUuid'
          description: Frozen global queue identity for this exact line; null only for legacy snapshots without line routing evidence.
        routingQueueName:
          type: [string, 'null']
          maxLength: 255
        routingQueueType:
          type: [string, 'null']
          maxLength: 64
        description: { type: string, minLength: 1, maxLength: 1000 }
        normalizedDescription: { oneOf: [{ type: string, minLength: 1, maxLength: 1000 }, { type: 'null' }] }
        unit: { type: string, minLength: 1, maxLength: 32 }
        quantity: { $ref: '#/components/schemas/DecimalQuantity' }
        unitPriceMinor: { type: integer, format: int64, minimum: 0 }
        normativeMinutes: { type: string, pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]{1,3})?$' }
        groupComment: { type: [string, 'null'], maxLength: 2000 }
        mediaReferences: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/MediaReference' } }
    FrozenPlanStage:
      type: object
      additionalProperties: false
      required: [id, order, catalogNodeId, catalogNodeName, kind, routingQueueId, routingQueueName, routingQueueType, photoRequired, normativeDurationMinutes]
      properties:
        id: { type: string, format: uuid }
        order: { type: integer, minimum: 0 }
        catalogNodeId: { type: string, format: uuid }
        catalogNodeName: { type: string, minLength: 1, maxLength: 255 }
        kind: { type: string, const: REPAIR_WORK }
        routingQueueId: { type: string, format: uuid }
        routingQueueName: { type: string, minLength: 1, maxLength: 255 }
        routingQueueType: { type: string, minLength: 1, maxLength: 64 }
        photoRequired: { type: boolean }
        normativeDurationMinutes: { type: integer, minimum: 0 }
    NumberResolution:
      type: object
      additionalProperties: false
      required: [displayCanonicalNumber, identityMatchKey, outcome, finding]
      properties:
        displayCanonicalNumber: { type: string, minLength: 1, maxLength: 128 }
        identityMatchKey: { type: string, minLength: 1, maxLength: 128 }
        outcome: { type: string, enum: [MATCHED, CROSS_WAREHOUSE_CONFLICT, EXCLUDED_STATUS_CONFLICT, MISSING_CONFLICT, NOT_FOUND] }
        finding: { oneOf: [{ $ref: '#/components/schemas/Finding' }, { type: 'null' }] }
    FrozenStatistics:
      type: object
      additionalProperties: false
      required: [expectedCount, inspectedCount, missingCount, readyCount, withWorkCount, addedCount, unexpectedExistingCount, conflictCount, workLineCount, materialLineCount, workTotalMinor, materialTotalMinor, grandTotalMinor, roundingAdjustmentMinor, normativeMinutes, durationSeconds, aggregateLines]
      properties:
        expectedCount: { type: integer, minimum: 0 }
        inspectedCount: { type: integer, minimum: 0 }
        missingCount: { type: integer, minimum: 0 }
        readyCount: { type: integer, minimum: 0 }
        withWorkCount: { type: integer, minimum: 0 }
        addedCount: { type: integer, minimum: 0 }
        unexpectedExistingCount: { type: integer, minimum: 0 }
        conflictCount: { type: integer, minimum: 0 }
        workLineCount: { type: integer, minimum: 0 }
        materialLineCount: { type: integer, minimum: 0 }
        workTotalMinor: { type: integer, format: int64, minimum: 0 }
        materialTotalMinor: { type: integer, format: int64, minimum: 0 }
        grandTotalMinor: { type: integer, format: int64, minimum: 0 }
        roundingAdjustmentMinor: { type: integer, minimum: -1, maximum: 1 }
        normativeMinutes: { type: string, pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]{1,3})?$' }
        durationSeconds: { type: integer, format: int64, minimum: 0 }
        aggregateLines: { type: array, items: { $ref: '#/components/schemas/StatisticsLine' } }
    StatisticsLine:
      type: object
      additionalProperties: false
      required: [aggregationKind, catalogVersionId, catalogNodeId, normalizedDescription, type, unit, unitPriceMinor, quantity, rowTotalMinor]
      properties:
        aggregationKind: { type: string, enum: [CATALOG, MANUAL] }
        catalogVersionId: { $ref: '#/components/schemas/NullableUuid' }
        catalogNodeId: { $ref: '#/components/schemas/NullableUuid' }
        normalizedDescription: { oneOf: [{ type: string, minLength: 1, maxLength: 1000 }, { type: 'null' }] }
        type: { type: string, enum: [WORK, MATERIAL] }
        unit: { type: string, minLength: 1, maxLength: 32 }
        unitPriceMinor: { type: integer, format: int64, minimum: 0 }
        quantity: { $ref: '#/components/schemas/DecimalQuantity' }
        rowTotalMinor: { type: integer, format: int64, minimum: 0 }
    CompletionRisk:
      type: object
      additionalProperties: false
      required: [findingId, code]
      properties:
        findingId: { type: string, format: uuid }
        code:
          type: string
          enum: [NOT_INSPECTED, MISSING, CONFLICT, ASSET_CHANGED, MEDIA_NOT_READY, PLAN_STALE, MUTATION_IN_FLIGHT]
          description: >-
            Active previews report semantic registry differences as CONFLICT.
    CompletionPreview:
      type: object
      additionalProperties: false
      required: [inventoryId, sessionRevision, finalPlanVersion, finalPlanSha256, findingRevisions, validationSha256, validatedAt, acknowledgementSha256, statistics, risks, validatedFindings]
      properties:
        inventoryId: { type: string, format: uuid }
        sessionRevision: { type: integer, format: int64, minimum: 0 }
        finalPlanVersion: { type: integer, format: int64, minimum: 1 }
        finalPlanSha256: { $ref: '#/components/schemas/Sha256' }
        findingRevisions: { type: array, items: { $ref: '#/components/schemas/RevisionExpectation' } }
        validationSha256:
          allOf: [{ $ref: '#/components/schemas/Sha256' }]
          description: >-
            Digest of business-significant registry facts. Technical asset versions are
            excluded so a version-only update cannot invalidate completion.
        validatedAt: { type: string, format: date-time }
        acknowledgementSha256: { $ref: '#/components/schemas/Sha256' }
        statistics: { $ref: '#/components/schemas/FrozenStatistics' }
        risks: { type: array, items: { $ref: '#/components/schemas/CompletionRisk' } }
        validatedFindings: { type: array, items: { $ref: '#/components/schemas/ValidatedFinding' } }
    ValidatedFinding:
      type: object
      additionalProperties: false
      required: [findingId, currentSnapshot, conflicts]
      properties:
        findingId: { type: string, format: uuid }
        currentSnapshot: { oneOf: [{ $ref: '#/components/schemas/CurrentItemSnapshot' }, { type: 'null' }] }
        conflicts: { type: array, items: { $ref: '#/components/schemas/InventoryConflict' } }
    RegistryReview:
      type: object
      additionalProperties: false
      required: [inventoryId, sessionRevision, findingRevisions, validatedAt, validatedFindings]
      properties:
        inventoryId: { type: string, format: uuid }
        sessionRevision: { type: integer, format: int64, minimum: 0 }
        findingRevisions:
          type: array
          maxItems: 10000
          uniqueItems: true
          items: { $ref: '#/components/schemas/RevisionExpectation' }
        validatedAt: { type: string, format: date-time }
        validatedFindings:
          type: array
          maxItems: 10000
          items: { $ref: '#/components/schemas/ValidatedFinding' }
    PublicationIntent:
      type: object
      additionalProperties: false
      required: [id, inventoryId, findingId, publicationRevision, state, sourceRevision, attemptCount, finalPlanVersion, targetKind, targetId, maintenanceEstimateId, maintenanceRepairId, desiredAssetStatus, effectiveAssetVersion, assetOutcomeResult, maintenanceOutcome, maintenanceResult, failureCode]
      properties:
        id: { type: string, format: uuid }
        inventoryId: { type: string, format: uuid }
        findingId: { type: string, format: uuid }
        publicationRevision: { type: integer, format: int64, minimum: 0 }
        state: { $ref: '#/components/schemas/PublicationState' }
        sourceRevision: { type: integer, format: int64, minimum: 1 }
        attemptCount: { type: integer, minimum: 0 }
        finalPlanVersion: { oneOf: [{ type: integer, format: int64, minimum: 1 }, { type: 'null' }] }
        targetKind: { oneOf: [{ $ref: '#/components/schemas/FinalPlanTargetKind' }, { type: 'null' }] }
        targetId: { $ref: '#/components/schemas/NullableUuid' }
        maintenanceEstimateId: { $ref: '#/components/schemas/NullableUuid' }
        maintenanceRepairId: { $ref: '#/components/schemas/NullableUuid' }
        desiredAssetStatus: { $ref: '#/components/schemas/InventoryAssetOutcomeStatus' }
        effectiveAssetVersion:
          oneOf: [{ type: integer, format: int64, minimum: 0 }, { type: 'null' }]
        assetOutcomeResult:
          description: Canonical response from asset-service; null before the asset outcome applies.
          oneOf: [{ type: object, additionalProperties: true }, { type: 'null' }]
        maintenanceOutcome:
          oneOf: [{ $ref: '#/components/schemas/MaintenancePublicationOutcome' }, { type: 'null' }]
        maintenanceResult:
          description: >-
            Immutable raw result returned by maintenance for a final-plan reconciliation,
            including its source, outcome, delta and successor facts. Null for legacy repair
            publications and before reconciliation succeeds.
          oneOf: [{ type: object, additionalProperties: true }, { type: 'null' }]
        failureCode: { oneOf: [{ type: string, minLength: 1, maxLength: 64 }, { type: 'null' }] }
      allOf:
        - if:
            properties:
              maintenanceOutcome: { type: 'null' }
          then:
            properties:
              maintenanceResult: { type: 'null' }
          else:
            properties:
              maintenanceResult: { type: object, additionalProperties: true }
        - if:
            properties:
              maintenanceOutcome: { const: MATCHED }
          then:
            properties:
              targetKind: { type: 'null' }
              targetId: { type: 'null' }
              maintenanceEstimateId: { type: 'null' }
              maintenanceRepairId: { type: 'null' }
        - if:
            properties:
              maintenanceOutcome: { const: SUCCESSOR }
          then:
            properties:
              targetKind: { const: REPAIR }
              targetId: { type: string, format: uuid }
              maintenanceEstimateId: { type: 'null' }
              maintenanceRepairId: { type: string, format: uuid }
        - if:
            properties:
              maintenanceOutcome: { const: CREATED }
          then:
            oneOf:
              - properties:
                  targetKind: { const: ESTIMATE }
                  targetId: { type: string, format: uuid }
                  maintenanceEstimateId: { type: string, format: uuid }
                  maintenanceRepairId: { type: 'null' }
              - properties:
                  targetKind: { const: REPAIR }
                  targetId: { type: string, format: uuid }
                  maintenanceEstimateId: { type: 'null' }
                  maintenanceRepairId: { type: string, format: uuid }
    PublicationBatch:
      type: object
      additionalProperties: false
      required: [inventoryId, aggregateState, intents]
      properties:
        inventoryId: { type: string, format: uuid }
        aggregateState: { $ref: '#/components/schemas/AggregatePublicationState' }
        intents: { type: array, items: { $ref: '#/components/schemas/PublicationIntent' } }
    OutcomeRecalculation:
      type: object
      additionalProperties: false
      required: [inventoryId, sessionRevision, finalPlanVersion, finalPlanSha256, furnitureReconciliationState, createdPublicationCount, requeuedPublicationCount]
      properties:
        inventoryId: { type: string, format: uuid }
        sessionRevision: { type: integer, format: int64, minimum: 0 }
        finalPlanVersion: { type: integer, format: int64, minimum: 1 }
        finalPlanSha256: { $ref: '#/components/schemas/Sha256' }
        furnitureReconciliationState: { $ref: '#/components/schemas/FurnitureReconciliationState' }
        createdPublicationCount: { type: integer, minimum: 0 }
        requeuedPublicationCount: { type: integer, minimum: 0 }
    SessionStatistics:
      type: object
      additionalProperties: false
      required: [inventoryId, warehouseId, businessDate, startedAt, completedAt, statistics]
      properties:
        inventoryId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        businessDate: { type: string, format: date }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        statistics: { $ref: '#/components/schemas/FrozenStatistics' }
    StatisticsSummary:
      type: object
      additionalProperties: false
      required: [sessionCount, statistics]
      properties:
        sessionCount: { type: integer, format: int64, minimum: 0 }
        statistics: { $ref: '#/components/schemas/FrozenStatistics' }
    PageMetadata:
      type: object
      additionalProperties: false
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 200 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    SessionPage:
      type: object
      additionalProperties: false
      required: [content, page]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/SessionSummary' } }
        page: { $ref: '#/components/schemas/PageMetadata' }
    FindingPage:
      type: object
      additionalProperties: false
      required: [content, page]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/Finding' } }
        page: { $ref: '#/components/schemas/PageMetadata' }
    StatisticsPage:
      type: object
      additionalProperties: false
      required: [content, page]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/SessionStatistics' } }
        page: { $ref: '#/components/schemas/PageMetadata' }
    CorrelationContext:
      type: object
      additionalProperties: false
      required: [correlationId, causationId]
      properties:
        correlationId: { type: string, format: uuid }
        causationId: { $ref: '#/components/schemas/NullableUuid' }
    FieldViolation:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    ProblemDetail:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code, violations, correlation]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code:
          type: string
          enum:
            - INVENTORY_VALIDATION_FAILED
            - INVENTORY_NOT_FOUND
            - INVENTORY_VERSION_CONFLICT
            - INVENTORY_IDEMPOTENCY_CONFLICT
            - INVENTORY_ACTIVE_SESSION_CONFLICT
            - INVENTORY_NUMBER_CONFLICT
            - INVENTORY_ACKNOWLEDGEMENT_STALE
            - INVENTORY_FINAL_PLAN_INCOMPLETE
            - INVENTORY_MEDIA_NOT_READY
            - INVENTORY_PUBLICATION_CONFLICT
            - INVENTORY_DEPENDENCY_UNAVAILABLE
            - INVENTORY_FORBIDDEN
        violations: { type: array, items: { $ref: '#/components/schemas/FieldViolation' } }
        correlation: { $ref: '#/components/schemas/CorrelationContext' }
