        currentSnapshot: { oneOf: [{ $ref: '#/components/schemas/CurrentItemSnapshot' }, { type: 'null' }] }
        conflicts: { type: array, items: { $ref: '#/components/schemas/InventoryConflict' } }
        frozenPlan: { oneOf: [{ $ref: '#/components/schemas/FrozenPlan' }, { type: 'null' }] }
        media: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/MediaReference' } }
        publication: { oneOf: [{ $ref: '#/components/schemas/PublicationIntent' }, { type: 'null' }] }
    ExpectedItemSnapshot:
      type: object
      additionalProperties: false
      required: [assetId, assetVersion, warehouseId, status, displayCanonicalNumber, tenantSnapshot, passportSnapshot, contentsSnapshot]
      properties:
        assetId: { type: string, format: uuid }
        assetVersion: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        status: { type: string, enum: [NEW, BOOKED, REPAIR, WAITING_REPAIR_CHECK, CAPITAL_REPAIR, AFTER_RENT, SALE, USED_SALE, RESERVED, FREE, WAREHOUSE, OWN_NEEDS] }
        displayCanonicalNumber: { type: string, minLength: 1, maxLength: 128 }
        tenantSnapshot: { type: [string, 'null'], maxLength: 512 }
        passportSnapshot:
          type: object
          additionalProperties: true
          description: Safe structured capture snapshot; the service rejects persisted JSON over 65536 characters.
        contentsSnapshot:
          description: Safe structured capture snapshot; the service rejects persisted JSON over 65536 characters.
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: array, items: {} }
    CurrentItemSnapshot:
      type: object
      additionalProperties: false
      required: [assetId, assetVersion, warehouseId, status, displayCanonicalNumber, tenantSnapshot]
      properties:
        assetId: { type: string, format: uuid }
        assetVersion: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        status: { type: string, minLength: 1, maxLength: 48 }
        displayCanonicalNumber: { type: string, minLength: 1, maxLength: 128 }
        tenantSnapshot: { type: [string, 'null'], maxLength: 512 }
