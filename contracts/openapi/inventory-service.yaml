        failureCode: { oneOf: [{ type: string, minLength: 1, maxLength: 64 }, { type: 'null' }] }
    PublicationBatch:
      type: object
      additionalProperties: false
      required: [inventoryId, aggregateState, intents]
      properties:
        inventoryId: { type: string, format: uuid }
        aggregateState: { $ref: '#/components/schemas/AggregatePublicationState' }
        intents: { type: array, items: { $ref: '#/components/schemas/PublicationIntent' } }
    SessionStatistics:
      type: object
      additionalProperties: false
      required: [inventoryId, warehouseId, businessDate, startedAt, completedAt, statistics]
      properties:
        inventoryId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        businessDate: { type: string, format: date }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        statistics: { $ref: '#/components/schemas/FrozenStatistics' }
    StatisticsSummary:
      type: object
      additionalProperties: false
      required: [sessionCount, statistics]
      properties:
        sessionCount: { type: integer, format: int64, minimum: 0 }
        statistics: { $ref: '#/components/schemas/FrozenStatistics' }
    PageMetadata:
      type: object
      additionalProperties: false
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 200 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    SessionPage:
      type: object
      additionalProperties: false
      required: [content, page]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/SessionSummary' } }
        page: { $ref: '#/components/schemas/PageMetadata' }
    FindingPage:
      type: object
      additionalProperties: false
      required: [content, page]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/Finding' } }
        page: { $ref: '#/components/schemas/PageMetadata' }
    StatisticsPage:
      type: object
      additionalProperties: false
      required: [content, page]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/SessionStatistics' } }
        page: { $ref: '#/components/schemas/PageMetadata' }
    CorrelationContext:
      type: object
      additionalProperties: false
      required: [correlationId, causationId]
      properties:
        correlationId: { type: string, format: uuid }
        causationId: { $ref: '#/components/schemas/NullableUuid' }
    FieldViolation:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    ProblemDetail:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code, violations, correlation]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code:
          type: string
          enum:
            - INVENTORY_VALIDATION_FAILED
            - INVENTORY_NOT_FOUND
            - INVENTORY_VERSION_CONFLICT
            - INVENTORY_IDEMPOTENCY_CONFLICT
            - INVENTORY_ACTIVE_SESSION_CONFLICT
            - INVENTORY_NUMBER_CONFLICT
            - INVENTORY_ACKNOWLEDGEMENT_STALE
            - INVENTORY_MEDIA_NOT_READY
            - INVENTORY_PUBLICATION_CONFLICT
            - INVENTORY_DEPENDENCY_UNAVAILABLE
            - INVENTORY_FORBIDDEN
        violations: { type: array, items: { $ref: '#/components/schemas/FieldViolation' } }
        correlation: { $ref: '#/components/schemas/CorrelationContext' }
