        subtracting the current work/material lines and creating a successor after current work).
      additionalProperties: false
      required: [strategy, selectedTargetKind, selectedTargetId]
      properties:
        strategy: { $ref: '#/components/schemas/FinalPlanReconciliationStrategy' }
        selectedTargetKind:
          oneOf: [{ $ref: '#/components/schemas/FinalPlanTargetKind' }, { type: 'null' }]
        selectedTargetId: { $ref: '#/components/schemas/NullableUuid' }
    FinalPlanEntryUpdate:
      type: object
      additionalProperties: false
      required: [findingId, expectedFindingRevision, order, priority, movementToRepair, movementScheduledDate, repairScheduledDate, reconciliationDecision]
      properties:
        findingId: { type: string, format: uuid }
        expectedFindingRevision: { type: integer, format: int64, minimum: 0 }
        order: { type: integer, minimum: 0 }
        priority: { oneOf: [{ type: integer, minimum: 1, maximum: 5 }, { type: 'null' }] }
        movementToRepair: { type: boolean }
        movementScheduledDate: { oneOf: [{ type: string, format: date }, { type: 'null' }] }
        repairScheduledDate: { oneOf: [{ type: string, format: date }, { type: 'null' }] }
        reconciliationDecision:
