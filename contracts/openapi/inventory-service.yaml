      properties:
        findingId: { type: string, format: uuid }
        expectedFindingRevision: { type: integer, format: int64, minimum: 0 }
    CompletionPreviewRequest:
      type: object
      additionalProperties: false
      required: [expectedSessionRevision, findingRevisions]
      properties:
        expectedSessionRevision: { type: integer, format: int64, minimum: 0 }
        findingRevisions: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/RevisionExpectation' } }
    CompleteSessionRequest:
      type: object
      additionalProperties: false
      required: [expectedSessionRevision, findingRevisions, acknowledgementSha256, validationSha256]
      properties:
        expectedSessionRevision: { type: integer, format: int64, minimum: 0 }
        findingRevisions: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/RevisionExpectation' } }
        acknowledgementSha256: { $ref: '#/components/schemas/Sha256' }
        validationSha256: { $ref: '#/components/schemas/Sha256' }
    CancelSessionRequest:
      type: object
