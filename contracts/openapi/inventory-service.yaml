        mediaId: { type: string, format: uuid }
        generation: { type: integer, format: int64, minimum: 0 }
    InventoryQuantityInput:
      type: string
      pattern: '^(?:0|[1-9][0-9]{0,13})(?:\.[0-9]{1,3})?$'
    CatalogInventoryPlanLineInput:
      type: object
      additionalProperties: false
      required: [aggregationKind, catalogNodeId, routingCatalogNodeId, description, type, unit, quantity, unitPriceMinor, normativeMinutes, mediaReferences]
      properties:
        aggregationKind: { type: string, const: CATALOG }
        catalogNodeId: { type: string, format: uuid }
        routingCatalogNodeId: { type: 'null' }
        description: { type: 'null' }
        type: { type: 'null' }
        unit: { type: 'null' }
        quantity: { $ref: '#/components/schemas/InventoryQuantityInput' }
        unitPriceMinor: { type: 'null' }
        normativeMinutes: { type: 'null' }
        groupComment: { oneOf: [{ type: string, minLength: 1, maxLength: 2000 }, { type: 'null' }] }
        mediaReferences: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/MediaReference' } }
    ManualInventoryPlanLineInput:
      type: object
      additionalProperties: false
      required: [aggregationKind, catalogNodeId, routingCatalogNodeId, description, type, unit, quantity, unitPriceMinor, normativeMinutes, mediaReferences]
      properties:
        aggregationKind: { type: string, const: MANUAL }
        catalogNodeId: { type: 'null' }
        routingCatalogNodeId:
          description: >-
            Active maintenance catalog node used only to freeze the line routing snapshot;
            it does not make the manual line catalog-derived.
          type: string
          format: uuid
        description: { type: string, minLength: 1, maxLength: 1000 }
        type: { type: string, enum: [WORK, MATERIAL] }
        unit: { type: string, minLength: 1, maxLength: 32 }
        quantity: { $ref: '#/components/schemas/InventoryQuantityInput' }
        unitPriceMinor: { type: integer, format: int64, minimum: 0 }
        normativeMinutes: { type: string, pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]{1,3})?$' }
        groupComment: { oneOf: [{ type: string, minLength: 1, maxLength: 2000 }, { type: 'null' }] }
        mediaReferences: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/MediaReference' } }
    InventoryPlanLineInput:
      oneOf:
        - { $ref: '#/components/schemas/CatalogInventoryPlanLineInput' }
        - { $ref: '#/components/schemas/ManualInventoryPlanLineInput' }
    InventoryPlanStageSelection:
      type: object
      additionalProperties: false
      required: [catalogNodeId, kind, order]
      properties:
        catalogNodeId: { type: string, format: uuid }
        kind: { type: string, const: REPAIR_WORK }
        order: { type: integer, minimum: 0 }
    PlanSelection:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode, priority, coverMediaId, movementToRepair, logisticsPlanningMode, logisticsScheduledDate, lines, stages]
          properties:
            mode: { type: string, const: AUTO }
            priority: { type: integer, minimum: 1, maximum: 5 }
            coverMediaId: { $ref: '#/components/schemas/NullableUuid' }
            movementToRepair: { type: boolean }
            forceCapitalRepair:
              description: Explicit manager choice independent of catalog WORK flags; omitted means false.
              type: boolean
              default: false
            logisticsPlanningMode:
              oneOf: [{ $ref: '#/components/schemas/LogisticsPlanningMode' }, { type: 'null' }]
            logisticsScheduledDate:
              oneOf: [{ type: string, format: date }, { type: 'null' }]
              description: Required only for inbound FIXED_DATE and null otherwise.
            lines:
              type: array
              minItems: 1
              maxItems: 2000
              items: { $ref: '#/components/schemas/CatalogInventoryPlanLineInput' }
            stages:
              type: array
              maxItems: 1000
              items: { $ref: '#/components/schemas/InventoryPlanStageSelection' }
          allOf:
            - oneOf:
                - properties:
                    movementToRepair: { const: false }
                    logisticsPlanningMode: { type: 'null' }
                    logisticsScheduledDate: { type: 'null' }
                - properties:
                    movementToRepair: { const: true }
                    logisticsPlanningMode: { const: AUTO }
                    logisticsScheduledDate: { type: 'null' }
                - properties:
                    movementToRepair: { const: true }
                    logisticsPlanningMode: { const: FIXED_DATE }
                    logisticsScheduledDate: { type: string, format: date }
            - not:
                required: [movementToRepair, forceCapitalRepair]
                properties:
                  movementToRepair: { const: true }
                  forceCapitalRepair: { const: true }
        - type: object
          additionalProperties: false
          required: [mode, priority, coverMediaId, movementToRepair, logisticsPlanningMode, logisticsScheduledDate, lines, stages]
          properties:
            mode: { type: string, const: MANUAL }
            priority: { type: integer, minimum: 1, maximum: 5 }
            coverMediaId: { $ref: '#/components/schemas/NullableUuid' }
            movementToRepair: { type: boolean }
            forceCapitalRepair:
              description: Explicit manager choice independent of catalog WORK flags; omitted means false.
              type: boolean
              default: false
            logisticsPlanningMode:
              oneOf: [{ $ref: '#/components/schemas/LogisticsPlanningMode' }, { type: 'null' }]
            logisticsScheduledDate:
              oneOf: [{ type: string, format: date }, { type: 'null' }]
              description: Required only for inbound FIXED_DATE and null otherwise.
            lines:
              type: array
              minItems: 1
              maxItems: 2000
              items: { $ref: '#/components/schemas/InventoryPlanLineInput' }
            stages:
              type: array
              minItems: 1
              maxItems: 1000
              items: { $ref: '#/components/schemas/InventoryPlanStageSelection' }
          allOf:
            - oneOf:
                - properties:
                    movementToRepair: { const: false }
                    logisticsPlanningMode: { type: 'null' }
                    logisticsScheduledDate: { type: 'null' }
                - properties:
                    movementToRepair: { const: true }
                    logisticsPlanningMode: { const: AUTO }
                    logisticsScheduledDate: { type: 'null' }
                - properties:
                    movementToRepair: { const: true }
                    logisticsPlanningMode: { const: FIXED_DATE }
                    logisticsScheduledDate: { type: string, format: date }
            - not:
                required: [movementToRepair, forceCapitalRepair]
                properties:
                  movementToRepair: { const: true }
                  forceCapitalRepair: { const: true }
    SaveInspectionRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [expectedSessionRevision, expectedFindingRevision, inspection, comment, passportObservation, equipmentObservation, media, coverMediaId, planSelection]
          properties:
            expectedSessionRevision: { type: integer, format: int64, minimum: 0 }
            expectedFindingRevision: { type: integer, format: int64, minimum: 0 }
            inspection: { type: string, const: READY }
            comment: { type: string, maxLength: 2000 }
            passportObservation: { $ref: '#/components/schemas/PassportObservation' }
            equipmentObservation: { $ref: '#/components/schemas/EquipmentObservation' }
            media: { type: array, maxItems: 100, uniqueItems: true, items: { $ref: '#/components/schemas/MediaReference' } }
            coverMediaId: { $ref: '#/components/schemas/NullableUuid' }
            planSelection: { type: 'null' }
          allOf:
            - if:
                properties:
                  media: { minItems: 1 }
              then:
                properties:
                  coverMediaId: { type: string, format: uuid }
              else:
                properties:
                  coverMediaId: { type: 'null' }
        - type: object
          additionalProperties: false
          required: [expectedSessionRevision, expectedFindingRevision, inspection, comment, passportObservation, equipmentObservation, media, coverMediaId, planSelection]
          properties:
            expectedSessionRevision: { type: integer, format: int64, minimum: 0 }
            expectedFindingRevision: { type: integer, format: int64, minimum: 0 }
            inspection: { type: string, const: WORK_STAGED }
            comment: { type: string, maxLength: 2000 }
            passportObservation: { $ref: '#/components/schemas/PassportObservation' }
            equipmentObservation: { $ref: '#/components/schemas/EquipmentObservation' }
            media: { type: array, maxItems: 100, uniqueItems: true, items: { $ref: '#/components/schemas/MediaReference' } }
            coverMediaId: { $ref: '#/components/schemas/NullableUuid' }
            planSelection: { $ref: '#/components/schemas/PlanSelection' }
          allOf:
            - if:
                properties:
                  media: { minItems: 1 }
              then:
                properties:
                  coverMediaId: { type: string, format: uuid }
              else:
                properties:
                  coverMediaId: { type: 'null' }
