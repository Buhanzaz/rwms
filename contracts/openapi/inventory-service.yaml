      properties:
        id: { type: string, format: uuid }
        inventoryId: { type: string, format: uuid }
        findingRevision: { type: integer, format: int64, minimum: 0 }
        origin: { $ref: '#/components/schemas/FindingOrigin' }
        inspection: { $ref: '#/components/schemas/InspectionState' }
        reconciliation: { $ref: '#/components/schemas/ReconciliationState' }
        assetId: { $ref: '#/components/schemas/NullableUuid' }
        assetVersion: { oneOf: [{ type: integer, format: int64, minimum: 0 }, { type: 'null' }] }
        displayCanonicalNumber: { type: string, minLength: 1, maxLength: 128 }
        identityMatchKey: { type: string, minLength: 1, maxLength: 128 }
        passportObservation: { $ref: '#/components/schemas/PassportObservation' }
        equipmentObservation: { $ref: '#/components/schemas/EquipmentObservation' }
        mutationState: { type: string, enum: [IDLE, SOURCE_CREATE_PENDING, SOURCE_CREATED, PLAN_RESOLVE_PENDING] }
        planFingerprintSha256: { $ref: '#/components/schemas/NullableSha256' }
