        sessionRevision: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        warehouseVersion: { type: integer, format: int64, minimum: 0 }
        warehouseTimeZone: { type: string, minLength: 1, maxLength: 64 }
        author: { $ref: '#/components/schemas/InventoryActor' }
        businessDate: { type: string, format: date }
        lifecycle: { $ref: '#/components/schemas/SessionLifecycle' }
        expectedCount: { type: integer, minimum: 0 }
        findingCount: { type: integer, format: int64, minimum: 0 }
        inspectedCount: { type: integer, format: int64, minimum: 0 }
        startedAt: { type: string, format: date-time }
