          properties:
            expectedSessionRevision: { type: integer, format: int64, minimum: 0 }
            allEligible: { type: boolean, const: true }
            findings: { type: array, maxItems: 0 }
        - type: object
          additionalProperties: false
          required: [expectedSessionRevision, allEligible, findings]
          properties:
            expectedSessionRevision: { type: integer, format: int64, minimum: 0 }
            allEligible: { type: boolean, const: false }
            findings:
              type: array
              minItems: 1
              uniqueItems: true
              items: { $ref: '#/components/schemas/PublicationExpectation' }
