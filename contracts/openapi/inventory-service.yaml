openapi: 3.1.0
info:
  title: RWMS Inventory Service API
  version: 1.8.0
  x-rwms-owner: inventory-service
  x-rwms-stability: approved-stage-7
  description: >-
    Canonical Stage 7 warehouse-scoped inventory sessions, findings, immutable
    completion statistics and independently retryable maintenance publication.
    The server derives actor, warehouse-local business date, reconciliation,
    validation and statistics. Browser persistence and client-calculated totals
    are never authoritative.
servers:
  - url: /
security:
  - bearerJwt: []
tags:
  - { name: Sessions }
  - { name: Findings }
  - { name: Furniture }
  - { name: Planning }
  - { name: Completion }
  - { name: Publication }
  - { name: Statistics }
  - { name: Operations }
paths:
  /api/inventory/v1/sessions:
    get:
      tags: [Sessions]
      operationId: listInventorySessions
      description: >-
        Requires USER, rwms.read and warehouse VIEW. Date/instant from values
        are inclusive and to values are exclusive. ACTIVE and CANCELLED remain
        visible here but never contribute completed statistics.
      parameters:
        - { $ref: '#/components/parameters/WarehouseId' }
        - { $ref: '#/components/parameters/SessionLifecycleQuery' }
        - { $ref: '#/components/parameters/BusinessDateFrom' }
        - { $ref: '#/components/parameters/BusinessDateTo' }
        - { $ref: '#/components/parameters/StartedFrom' }
        - { $ref: '#/components/parameters/StartedTo' }
        - { $ref: '#/components/parameters/TerminalFrom' }
        - { $ref: '#/components/parameters/TerminalTo' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/SessionSort' }
      responses:
        '200': { $ref: '#/components/responses/SessionPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Sessions]
      operationId: startInventorySession
      description: >-
        Requires USER, rwms.write and warehouse EDIT. The service validates the
        active warehouse, computes businessDate in its IANA timezone, copies one
        stable asset capture and commits no partial local session.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartSessionRequest' }
      responses:
        '201': { $ref: '#/components/responses/SessionDetailIdempotentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/inventory/v1/sessions/active:
    get:
      tags: [Sessions]
      operationId: getActiveInventorySession
      description: >-
        Requires USER, rwms.read and warehouse VIEW. The response carries an
        ETag for both an active session and the no-active-session state; clients
        can send If-None-Match to retain their local snapshot when it is current.
      parameters:
        - { $ref: '#/components/parameters/WarehouseId' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: Warehouse-scoped active inventory session.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetail' }
        '204':
          description: The warehouse has no active inventory session.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
            ETag: { $ref: '#/components/headers/ETag' }
        '304':
          description: The active-session state has not changed.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
            ETag: { $ref: '#/components/headers/ETag' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/inventory/v1/sessions/{inventoryId}:
    parameters:
      - { $ref: '#/components/parameters/InventoryId' }
    get:
      tags: [Sessions]
      operationId: getInventorySession
      description: >-
        Requires USER, rwms.read and warehouse VIEW. Frozen statistics are
        present only for COMPLETED sessions.
      responses:
        '200': { $ref: '#/components/responses/SessionDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/inventory/v1/sessions/{inventoryId}/refresh:
    parameters:
      - { $ref: '#/components/parameters/InventoryId' }
    post:
      tags: [Sessions]
      operationId: refreshInventorySession
      description: >-
        Requires USER, rwms.write and warehouse MANAGE. The service rejects a
        stale initial session revision before taking a dependency capture. It
        then copies the fresh read-only asset capture outside the idempotent
        local transaction, rechecks the same revision under the session lock,
        reconciles the union of captured and currently active cabin identities
        through the inventory membership journal, and invalidates only derived
        furniture-review and final-plan state. Existing findings, inspection
        evidence, media and membership history are retained.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshSessionRequest' }
      responses:
        '200': { $ref: '#/components/responses/SessionDetailIdempotentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/inventory/v1/sessions/{inventoryId}/findings:
    parameters:
      - { $ref: '#/components/parameters/InventoryId' }
    get:
      tags: [Findings]
      operationId: listInventoryFindings
      description: >-
        Requires USER, rwms.read and warehouse VIEW. The active finding set
        follows the live warehouse population: departures and transfers are
        removed, while arrivals are added. Every membership change is retained
        separately in SessionDetail.membershipMovements.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/FindingSort' }
      responses:
        '200': { $ref: '#/components/responses/FindingPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/inventory/v1/sessions/{inventoryId}/registry-review:
    parameters:
      - { $ref: '#/components/parameters/InventoryId' }
    post:
      tags: [Findings]
      operationId: reviewInventoryRegistry
      description: >-
        Requires USER, rwms.write and warehouse EDIT. Performs a read-only fresh
        comparison of the exact active finding revision vector with current asset
        and maintenance registry truth. It neither resolves conflicts nor changes
        the inventory, repair cycle or logistics state.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistryReviewRequest' }
      responses:
        '200':
          description: Fresh registry review for the exact requested revisions.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistryReview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/inventory/v1/sessions/{inventoryId}/statistics-preview:
    parameters:
      - { $ref: '#/components/parameters/InventoryId' }
    get:
      tags: [Statistics]
      operationId: getInventoryPreliminaryStatistics
      description: >-
        Requires USER, rwms.write and warehouse MANAGE. Available only while the
        session is ACTIVE in the CABINS review stage. Returns read-only preliminary
        counters and money totals from persisted active findings and their active
        frozen plan lines. It does not validate assets, require or change a furniture
        review, create a completion preview or validation, or persist any state;
        completion performs fresh validation and freezes the final statistics separately.
      responses:
        '200': { $ref: '#/components/responses/FrozenStatisticsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/inventory/v1/planning-settings/{warehouseId}:
    parameters:
      - { $ref: '#/components/parameters/WarehousePathId' }
    get:
      tags: [Planning]
      operationId: getInventoryPlanningSettings
      description: >-
        Requires USER, rwms.write and warehouse MANAGE, or the isolated rwms-admin-web
        application token with its exact admin.manage scope and a SYSTEM_ADMIN or WMS_ADMIN
        global role. Settings are inventory-owned holiday exceptions only; task-board owns the
        effective object work schedule. They derive only future final-plan versions and do not
        change frozen plan evidence.
      responses:
        '200':
          description: Current inventory holiday exceptions and their optimistic revision.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/PlanningSettings' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Planning]
      operationId: updateInventoryPlanningSettings
      description: >-
        Requires USER, rwms.write and warehouse MANAGE, or the isolated rwms-admin-web
        application token with its exact admin.manage scope and a SYSTEM_ADMIN or WMS_ADMIN
        global role. A matching settingsRevision is required; changing inventory holiday
        exceptions marks the active session's draft final plan stale.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanningSettingsUpdateRequest' }
      responses:
        '200':
          description: Updated planning settings.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/PlanningSettings' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/inventory/v1/sessions/{inventoryId}/final-plan/prepare:
    parameters:
      - { $ref: '#/components/parameters/InventoryId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Planning]
      operationId: prepareInventoryFinalPlan
      description: >-
        Requires USER, rwms.write and warehouse MANAGE. The server creates one immutable ordered
        final-plan version for every active finding, combines task-board's effective object work
        calendar with inventory holidays, and preflights maintenance reconciliation candidates.
        AUTO uses the earliest common working date without a daily capacity; MANUAL validates that
        calendar and movement-before-repair ordering. The task-board calendar snapshot/version and
        fingerprint fence this plan generation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrepareFinalPlanRequest' }
      responses:
        '200': { $ref: '#/components/responses/FinalPlanIdempotentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/inventory/v1/sessions/{inventoryId}/final-plan:
    parameters:
      - { $ref: '#/components/parameters/InventoryId' }
    get:
      tags: [Planning]
      operationId: getInventoryFinalPlan
      description: Requires USER, rwms.read and warehouse VIEW.
      responses:
        '200':
          description: Current final-plan head, including stale evidence when replacement is required.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/FinalPlan' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Planning]
      operationId: updateInventoryFinalPlan
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      description: >-
        Requires USER, rwms.write and warehouse MANAGE. The request contains every active
        finding in exact order. It always creates a new immutable final-plan version using the
        common task-board object calendar plus inventory holidays, with no per-day capacity
        throttle; MANUAL dates must be common working dates and preserve movement-before-repair.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinalPlanUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/FinalPlanIdempotentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/inventory/v1/sessions/{inventoryId}/number-resolutions:
    parameters:
      - { $ref: '#/components/parameters/InventoryId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Findings]
      operationId: resolveInventoryNumber
      description: >-
        Requires USER, rwms.write and warehouse EDIT. Resolution is global by
        the server-derived identity match key and never moves or duplicates a
        cross-warehouse/excluded asset.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveNumberRequest' }
      responses:
        '200': { $ref: '#/components/responses/NumberResolutionIdempotentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/inventory/v1/sessions/{inventoryId}/findings/{findingId}/assets:
    parameters:
      - { $ref: '#/components/parameters/InventoryId' }
      - { $ref: '#/components/parameters/FindingId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Findings]
      operationId: createAndAttachInventoryAsset
      description: >-
        Requires USER, rwms.write and warehouse EDIT. The permanent remote
        source is inventoryId:findingId and survives ordinary idempotency expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFindingAssetRequest' }
      responses:
        '200': { $ref: '#/components/responses/FindingIdempotentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/inventory/v1/sessions/{inventoryId}/findings/{findingId}/inspection:
    parameters:
      - { $ref: '#/components/parameters/InventoryId' }
      - { $ref: '#/components/parameters/FindingId' }
    put:
      tags: [Findings]
      operationId: saveFindingInspection
      description: >-
        Requires USER, rwms.write and warehouse EDIT. Reconciliation is
        server-owned. WORK_STAGED commits only a maintenance-issued immutable
        plan fingerprint; ABSENT and EXPLICIT_EMPTY observations remain distinct.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveInspectionRequest' }
      responses:
        '200': { $ref: '#/components/responses/FindingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/inventory/v1/sessions/{inventoryId}/findings/{findingId}/conflict-resolution:
    parameters:
      - { $ref: '#/components/parameters/InventoryId' }
      - { $ref: '#/components/parameters/FindingId' }
    put:
      tags: [Findings]
      operationId: resolveFindingRegistryConflict
      description: >-
        Requires USER, rwms.write and warehouse EDIT. Available only after an
        inspection and only while the exact current semantic registry snapshot
        still conflicts with the inspection baseline. ACCEPT_REGISTRY rebases
        the baseline and does not publish its previously staged work or
        materials. KEEP_INSPECTION preserves the staged plan and records an
        audited decision for that exact current snapshot without mutating
        asset-service or maintenance-service.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveConflictRequest' }
      responses:
        '200': { $ref: '#/components/responses/FindingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/inventory/v1/sessions/{inventoryId}/furniture-review/start:
    parameters:
      - { $ref: '#/components/parameters/InventoryId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Furniture]
      operationId: startInventoryFurnitureReview
      description: >-
        Requires USER, rwms.write and warehouse EDIT. Freezes the cabin-review
        stage on one asset-service furniture snapshot only after the server-owned
        return and shipment review reaches COMPLETED. Registry conflicts must be
        resolved first. Only LOCAL cabins enter the furniture snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartFurnitureReviewRequest' }
      responses:
        '200': { $ref: '#/components/responses/FurnitureReviewIdempotentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/inventory/v1/sessions/{inventoryId}/cabin-disposition-review:
    parameters:
      - { $ref: '#/components/parameters/InventoryId' }
    get:
      tags: [Completion]
      operationId: getInventoryCabinDispositionReview
      description: >-
        Requires USER, rwms.write and warehouse MANAGE. Returns or rebuilds the exact
        server-owned return/missing candidate set from current active finding revisions.
      responses:
        '200': { $ref: '#/components/responses/CabinDispositionReviewResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
  /api/inventory/v1/sessions/{inventoryId}/cabin-disposition-review/returns/confirm:
    parameters:
      - { $ref: '#/components/parameters/InventoryId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Completion]
      operationId: confirmInventoryReturns
      description: >-
        Requires USER, rwms.write and warehouse MANAGE. The request must contain every
        found-rented candidate exactly once at its current finding revision. This records
        historical return facts only and creates neither acceptance nor estimates.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmInventoryReturnsRequest' }
      responses:
        '200': { $ref: '#/components/responses/CabinDispositionReviewIdempotentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/inventory/v1/sessions/{inventoryId}/cabin-disposition-review/shipments/confirm:
    parameters:
      - { $ref: '#/components/parameters/InventoryId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Completion]
      operationId: confirmInventoryShipments
      description: >-
        Requires USER, rwms.write and warehouse MANAGE. The request contains only missing
        cabins known to have shipped. Every omitted missing candidate deterministically becomes
        WRITE_OFF pending maintenance approval. Shipment furniture does not consume STOCK.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmInventoryShipmentsRequest' }
      responses:
        '200': { $ref: '#/components/responses/CabinDispositionReviewIdempotentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/inventory/v1/sessions/{inventoryId}/furniture-review:
    parameters:
      - { $ref: '#/components/parameters/InventoryId' }
    get:
      tags: [Furniture]
      operationId: getInventoryFurnitureReview
      description: >-
        Requires USER, rwms.read and warehouse VIEW. Returns the frozen asset
        snapshot and the current absolute furniture observations.
      responses:
        '200': { $ref: '#/components/responses/FurnitureReviewResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    put:
      tags: [Furniture]
      operationId: saveInventoryFurnitureReview
      description: >-
        Requires USER, rwms.write and warehouse EDIT. The request must contain
        exactly every frozen equipment item and cabin; it updates only the
        equipment observation facts and confirms the review.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveFurnitureReviewRequest' }
      responses:
        '200': { $ref: '#/components/responses/FurnitureReviewResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
  /api/inventory/v1/sessions/{inventoryId}/completion-preview:
    parameters:
      - { $ref: '#/components/parameters/InventoryId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Completion]
      operationId: previewInventoryCompletion
      description: >-
        Requires USER, rwms.write and warehouse MANAGE. Advisory preview owns
        fresh asset validation, exact statistics and acknowledgement hash; it
        acquires no remote lease or validation token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompletionPreviewRequest' }
      responses:
        '200': { $ref: '#/components/responses/CompletionPreviewIdempotentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/inventory/v1/sessions/{inventoryId}/complete:
    parameters:
      - { $ref: '#/components/parameters/InventoryId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Completion]
      operationId: completeInventorySession
      description: >-
        Requires USER, rwms.write and warehouse MANAGE. Fresh validation must
        equal the acknowledged preview. Completion is irreversible and local;
        Kafka or maintenance outage cannot roll it back.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteSessionRequest' }
      responses:
        '200': { $ref: '#/components/responses/SessionDetailIdempotentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/inventory/v1/sessions/{inventoryId}/cancel:
    parameters:
      - { $ref: '#/components/parameters/InventoryId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Completion]
      operationId: cancelInventorySession
      description: Requires USER, rwms.write and warehouse MANAGE. Only ACTIVE may cancel.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelSessionRequest' }
      responses:
        '200': { $ref: '#/components/responses/SessionDetailIdempotentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/inventory/v1/sessions/{inventoryId}/publications:
    parameters:
      - { $ref: '#/components/parameters/InventoryId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Publication]
      operationId: publishInventoryFindings
      description: >-
        Requires USER, rwms.write and warehouse MANAGE. Selected or all eligible
        findings advance independently; partial success never reopens completion.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishFindingsRequest' }
      responses:
        '200': { $ref: '#/components/responses/PublicationBatchIdempotentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/inventory/v1/sessions/{inventoryId}/outcome/recalculate:
    parameters:
      - { $ref: '#/components/parameters/InventoryId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Publication]
      operationId: recalculateInventoryOutcome
      description: >-
        Requires USER, rwms.write and warehouse MANAGE. Fences the submitted completed plan,
        copies its exact reviewed entries and dispositions into one strictly newer immutable
        final-plan generation, and durably requeues its downstream effects. An idempotency replay
        returns the first response without creating another generation. LOCAL no-work means FREE,
        LOCAL work means REPAIR or explicit CAPITAL_REPAIR, SHIPMENT means RENTED with frozen
        furniture, and WRITE_OFF remains asset-less pending maintenance approval. Evidence, photos
        and prior attempt history are retained.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecalculateInventoryOutcomeRequest' }
      responses:
        '202': { $ref: '#/components/responses/OutcomeRecalculationAcceptedResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/inventory/v1/sessions/{inventoryId}/findings/{findingId}/publication/retry:
    parameters:
      - { $ref: '#/components/parameters/InventoryId' }
      - { $ref: '#/components/parameters/FindingId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Publication]
      operationId: retryFindingPublication
      description: >-
        Requires USER, rwms.write and warehouse MANAGE. TRANSIENT_FAILED retries;
        BLOCKED requires an explicit reconcile reason/fingerprint. CLOSED_BLOCKED is terminal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetryPublicationRequest' }
      responses:
        '200': { $ref: '#/components/responses/PublicationIntentIdempotentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/inventory/v1/sessions/{inventoryId}/findings/{findingId}/publication/close:
    parameters:
      - { $ref: '#/components/parameters/InventoryId' }
      - { $ref: '#/components/parameters/FindingId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Publication]
      operationId: closeBlockedFindingPublication
      description: >-
        Requires USER, rwms.write and warehouse MANAGE. Only BLOCKED may become
        terminal CLOSED_BLOCKED; a succeeded peer remains succeeded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClosePublicationRequest' }
      responses:
        '200': { $ref: '#/components/responses/PublicationIntentIdempotentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/inventory/v1/statistics/sessions:
    get:
      tags: [Statistics]
      operationId: listInventorySessionStatistics
      description: >-
        Requires USER, rwms.read and warehouse VIEW. Returns only persisted
        COMPLETED-session statistics with inclusive-from/exclusive-to filters.
      parameters:
        - { $ref: '#/components/parameters/WarehouseId' }
        - { $ref: '#/components/parameters/BusinessDateFrom' }
        - { $ref: '#/components/parameters/BusinessDateTo' }
        - { $ref: '#/components/parameters/StartedFrom' }
        - { $ref: '#/components/parameters/StartedTo' }
        - { $ref: '#/components/parameters/TerminalFrom' }
        - { $ref: '#/components/parameters/TerminalTo' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/StatisticsSort' }
      responses:
        '200': { $ref: '#/components/responses/StatisticsPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/inventory/v1/statistics/summary:
    get:
      tags: [Statistics]
      operationId: summarizeInventoryStatistics
      description: >-
        Requires USER, rwms.read and warehouse VIEW. Each aggregate monetary
        total is independently HALF_UP rounded from exact raw sums; rows are not
        resummed to replace header totals.
      parameters:
        - { $ref: '#/components/parameters/WarehouseId' }
        - { $ref: '#/components/parameters/BusinessDateFrom' }
        - { $ref: '#/components/parameters/BusinessDateTo' }
        - { $ref: '#/components/parameters/StartedFrom' }
        - { $ref: '#/components/parameters/StartedTo' }
        - { $ref: '#/components/parameters/TerminalFrom' }
        - { $ref: '#/components/parameters/TerminalTo' }
      responses:
        '200': { $ref: '#/components/responses/StatisticsSummaryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/inventory/v1/operations/outbox/{eventId}/requeue:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Operations]
      operationId: requeueInventoryOutboxEvent
      description: >-
        Requires a USER with SYSTEM_ADMIN or WMS_ADMIN, plus rwms.write; the isolated admin
        application may instead use its exact admin.manage scope. expectedReviewVersion fences
        concurrent review. The immutable event identity, ordered aggregate head, envelope and
        payload are validated before the same record returns to PENDING. Later aggregate versions
        remain blocked until this head is published.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventingRecoveryRequest' }
      responses:
        '200': { $ref: '#/components/responses/EventingRecoveryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
  /api/inventory/v1/operations/dead-letters/{dltId}/requeue:
    parameters:
      - name: dltId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Operations]
      operationId: requeueInventoryDeadLetter
      description: >-
        Requires a USER with SYSTEM_ADMIN or WMS_ADMIN, plus rwms.write; the isolated admin
        application may instead use its exact admin.manage scope. expectedReviewVersion fences
        concurrent review. A FAILED sanitized dead letter returns to PENDING only after its exact
        three-field safe body and checksum are validated; checksum failures cannot be overridden.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventingRecoveryRequest' }
      responses:
        '200': { $ref: '#/components/responses/EventingRecoveryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
components:
  securitySchemes:
    bearerJwt: { type: http, scheme: bearer, bearerFormat: JWT }
  headers:
    X-Correlation-Id:
      required: true
      schema: { type: string, format: uuid }
    ETag:
      required: true
      schema: { type: string }
    Idempotency-Replayed:
      schema: { type: string, const: 'true' }
  parameters:
    InventoryId: { name: inventoryId, in: path, required: true, schema: { type: string, format: uuid } }
    FindingId: { name: findingId, in: path, required: true, schema: { type: string, format: uuid } }
    WarehousePathId: { name: warehouseId, in: path, required: true, schema: { type: string, format: uuid } }
    WarehouseId: { name: warehouseId, in: query, required: true, schema: { type: string, format: uuid } }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 256 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID command identity retained for seven days; changed canonical payload conflicts.
      schema: { type: string, format: uuid }
    Page: { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    Size: { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    SessionLifecycleQuery: { name: status, in: query, schema: { $ref: '#/components/schemas/SessionLifecycle' } }
    BusinessDateFrom: { name: businessDateFrom, in: query, schema: { type: string, format: date } }
    BusinessDateTo: { name: businessDateTo, in: query, description: Exclusive upper bound., schema: { type: string, format: date } }
    StartedFrom: { name: startedFrom, in: query, schema: { type: string, format: date-time } }
    StartedTo: { name: startedTo, in: query, description: Exclusive upper bound., schema: { type: string, format: date-time } }
    TerminalFrom: { name: terminalFrom, in: query, schema: { type: string, format: date-time } }
    TerminalTo: { name: terminalTo, in: query, description: Exclusive upper bound., schema: { type: string, format: date-time } }
    SessionSort:
      name: sort
      in: query
      schema: { type: string, enum: ["startedAt,asc", "startedAt,desc", "businessDate,asc", "businessDate,desc"], default: "startedAt,desc" }
    FindingSort:
      name: sort
      in: query
      schema: { type: string, enum: ["createdAt,asc", "createdAt,desc", "displayCanonicalNumber,asc", "displayCanonicalNumber,desc"], default: "createdAt,asc" }
    StatisticsSort:
      name: sort
      in: query
      schema: { type: string, enum: ["completedAt,asc", "completedAt,desc", "businessDate,asc", "businessDate,desc"], default: "completedAt,desc" }
  responses:
    EventingRecoveryResponse:
      description: Stable receipt for the reviewed transition to PENDING.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/EventingRecoveryReceipt' } } }
    SessionPageResponse:
      description: Server-paged session history.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/SessionPage' } } }
    SessionDetailResponse:
      description: Warehouse-scoped session.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/SessionDetail' } } }
    SessionDetailIdempotentResponse:
      description: Idempotent session command result.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/SessionDetail' } } }
    FindingPageResponse:
      description: Server-paged findings.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/FindingPage' } } }
    FindingResponse:
      description: Finding with independent revision.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Finding' } } }
    FindingIdempotentResponse:
      description: Idempotent finding command result.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Finding' } } }
    NumberResolutionIdempotentResponse:
      description: Global number resolution result.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/NumberResolution' } } }
    CompletionPreviewIdempotentResponse:
      description: Server-owned completion preview.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/CompletionPreview' } } }
    FinalPlanIdempotentResponse:
      description: Server-owned immutable final-plan version.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/FinalPlan' } } }
    FurnitureReviewResponse:
      description: Frozen furniture-review snapshot and absolute observations.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/FurnitureReview' } } }
    FurnitureReviewIdempotentResponse:
      description: Idempotent furniture-review start result.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/FurnitureReview' } } }
    CabinDispositionReviewResponse:
      description: Current server-owned return and shipment review.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/InventoryCabinDispositionReview' } } }
    CabinDispositionReviewIdempotentResponse:
      description: Idempotent return or shipment review result.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/InventoryCabinDispositionReview' } } }
    PublicationBatchIdempotentResponse:
      description: Per-finding publication results and derived aggregate state.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/PublicationBatch' } } }
    OutcomeRecalculationAcceptedResponse:
      description: Exact completed plan was durably queued for owner-by-owner recovery.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/OutcomeRecalculation' } } }
    PublicationIntentIdempotentResponse:
      description: Publication intent result.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/PublicationIntent' } } }
    StatisticsPageResponse:
      description: Completed-session statistics page.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/StatisticsPage' } } }
    StatisticsSummaryResponse:
      description: Exact aggregate of matching completed sessions.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/StatisticsSummary' } } }
    FrozenStatisticsResponse:
      description: Read-only inventory statistics.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/FrozenStatistics' } } }
    BadRequest: { description: Malformed input or invalid/broad range., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } } }
    Unauthorized: { description: Missing or invalid Bearer JWT., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } } }
    Forbidden: { description: Principal, scope or warehouse grant is insufficient., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } } }
    NotFound: { description: Warehouse-scoped resource is absent., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } } }
    Conflict: { description: Version, idempotency, active-session, number, source, acknowledgement or publication conflict., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } } }
    ValidationFailure: { description: Domain, plan, media, quantity, count or overflow validation failed., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } } }
    DependencyUnavailable: { description: Mandatory dependency failed before local commit., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } } }
  schemas:
    SessionLifecycle: { type: string, enum: [ACTIVE, COMPLETED, CANCELLED] }
    InventoryReviewStage: { type: string, enum: [CABINS, FURNITURE] }
    FurnitureReconciliationState: { type: string, enum: [NOT_REQUIRED, READY, PENDING, SUCCEEDED, TRANSIENT_FAILED, BLOCKED] }
    FindingOrigin: { type: string, enum: [EXPECTED, ADDED_NEW, ADDED_USED, UNEXPECTED_EXISTING] }
    InspectionSource: { type: string, enum: [INVENTORY] }
    RentalItemStatus:
      type: string
      enum: [RENTED, BOOKED, REPAIR, WAITING_REPAIR_CHECK, WRITTEN_OFF, LOST, CAPITAL_REPAIR, AFTER_RENT, WAITING_ESTIMATE_CONFIRMATION, SALE, USED_SALE, RESERVED, FREE, WAREHOUSE, OWN_NEEDS, IN_TRANSFER]
    InventoryAssetOutcomeStatus: { type: string, enum: [FREE, REPAIR, CAPITAL_REPAIR, RENTED] }
    InventoryCabinDispositionReviewPhase: { type: string, enum: [RETURNS, SHIPMENTS, COMPLETED] }
    InventoryCabinDispositionKind: { type: string, enum: [LOCAL, SHIPMENT, WRITE_OFF] }
    InspectionState: { type: string, enum: [NOT_INSPECTED, READY, WORK_STAGED] }
    LogisticsPlanningMode: { type: string, enum: [AUTO, FIXED_DATE] }
    ReconciliationState: { type: string, enum: [MATCHED, MISSING, CONFLICT] }
    ConflictResolutionStrategy: { type: string, enum: [ACCEPT_REGISTRY, KEEP_INSPECTION] }
    ObservationPresence: { type: string, enum: [ABSENT, EXPLICIT_EMPTY, PRESENT] }
    PublicationState: { type: string, enum: [NOT_REQUIRED, READY, PENDING, SUCCEEDED, TRANSIENT_FAILED, BLOCKED, CLOSED_BLOCKED] }
    MaintenancePublicationOutcome: { type: string, enum: [CREATED, SUCCESSOR, MATCHED] }
    AggregatePublicationState: { type: string, enum: [NOT_REQUESTED, PENDING, PARTIAL, SUCCEEDED, BLOCKED] }
    Sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    DecimalQuantity:
      type: string
      pattern: '^(?:0*[1-9][0-9]{0,13})(?:\.[0-9]{1,3})?$'
      description: Positive exact decimal; at most 14 integer and 3 fractional digits.
    NullableUuid: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
