          description: Released reservations or the original replayed result.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderUnitReservation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/orders/{orderId}/units/{rentalItemId}/release:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: rentalItemId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: releaseOrderUnit
      description: Releases only an active reservation owned by this order and supports exact replay.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderActorRequest' }
      responses:
        '200':
          description: Released reservation or the original replayed result.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderUnitReservation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/orders/{orderId}/units/replace:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: replaceOrderUnits
      description: >-
        Atomically replaces every ordered old/new cabin pair inside the same order. The units field
        is the authoritative complete post-swap order composition. All exact existing logistics
        movement lines are recomputed, globally locked and pre-held before any old reservation is
        released; any invalid pair rolls back the whole batch. A presentation-scoped call converts
        every target hold and releases the scope's unselected alternatives in the same transaction.
        Released old cabins remain BOOKED but non-order-reserved until an existing maintenance
        transition is retried.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ReplaceOrderUnitsRequest' } }
      responses:
        '200':
          description: Ordered all-or-nothing replacement receipt or exact idempotent replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderUnitsReplacementReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/orders/{orderId}/equipment-reservations:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    put:
      operationId: replaceOrderEquipmentReservations
      description: >-
        Replaces the order-wide catalogue reservation from requirements grouped by existing order
        cabins and partitions it by each cabin's physical warehouse. Capacity is allocatable
        physical furniture less other orders' unfulfilled reservation portions, plus physical
        furniture already fulfilling this order's active cabins at the same source; every
        configured per-cabin maximum is validated atomically.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ReplaceOrderEquipmentReservationsRequest' } }
      responses:
        '200':
          description: Active reservations after replacement or original replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/OrderEquipmentReservation' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/orders/{orderId}/equipment-movement-plan:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: planOrderFurnitureMovements
      description: >-
        Computes the physical difference between one selected order cabin and its desired furniture.
        It plans additions first from another active same-order warehouse cabin's unheld surplus,
        then from legacy allocatable stock or non-rented cabins, and returns surplus to stock; it does
        not move any ledger balance itself. Supplying replacementForRentalItemId instead returns
        exact direct lines from that reserved cabin to rentalItemId.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/OrderFurnitureMovementPlanRequest' } }
      responses:
        '200':
          description: Exact source-to-target worker movement plan.
          content: { application/json: { schema: { $ref: '#/components/schemas/OrderFurnitureMovementPlan' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/rental-items/{rentalItemId}/furniture-movement-plan:
    parameters:
      - { name: rentalItemId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: planCabinFurnitureMovements
      description: >-
        Computes the complete desired furniture composition for one editable cabin. It selects
        current source balances from additional equipment and returns a worker-task plan without
        changing physical balances.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CabinFurnitureMovementPlanRequest' } }
      responses:
        '200':
          description: Exact source-to-target worker movement plan.
          content: { application/json: { schema: { $ref: '#/components/schemas/CabinFurnitureMovementPlan' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/cabin-pricing-catalog:
    get:
      operationId: readCabinPricingCatalog
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Returns every existing
        TYPE and CATEGORY catalog identity, including inactive entries and entries not yet used by
        any cabin. Deleted values disappear; names are labels, not pricing keys. This read owns no
        rental-price policy and has no hold or reservation effects.
      responses:
        '200':
          description: Current global classification dimensions from one consistent asset snapshot.
          content: { application/json: { schema: { $ref: '#/components/schemas/CabinPricingCatalog' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/logistics/cabin-pricing-references:
    post:
      operationId: readCabinPricingReferences
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Reads the current TYPE
        and CATEGORY identities of one to 100 distinct cabins in the supplied warehouse without
        checking availability or changing holds. A missing or foreign-warehouse cabin rejects the
        entire request with 404; no partial result or passport data is returned.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CabinAvailabilityRequest' } }
      responses:
        '200':
          description: Complete classification references ordered by cabin UUID.
          content: { application/json: { schema: { $ref: '#/components/schemas/CabinPricingReferences' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/asset/v1/logistics/cabin-facets:
    get:
      operationId: readPresentationCabinFacets
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Returns facet values from
        FREE cabins that are not order-reserved, operation-leased, or held by another presentation.
        Supplying holdScopeId retains the requesting inquiry's current holds; this read does not
        create a hold.
      parameters:
        - { $ref: '#/components/parameters/WarehouseIdQuery' }
        - name: holdScopeId
          in: query
          required: false
          description: Inquiry ID whose current presentation holds remain visible in the facets.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Available cabin facet values for the warehouse.
          content: { application/json: { schema: { $ref: '#/components/schemas/CabinFacetResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/logistics/cabin-catalog:
    get:
      operationId: readPresentationCabinCatalog
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Returns a bounded
        facts-only warehouse page searchable by cabin number, type, finish, dimensions, category,
        characteristics or linoleum. It includes current status but neither checks availability nor
        creates, renews or releases a presentation hold.
      parameters:
        - { $ref: '#/components/parameters/WarehouseIdQuery' }
        - name: query
          in: query
          required: true
          schema: { type: string, maxLength: 255 }
        - name: page
          in: query
          required: true
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Facts-only cabin page; no availability or hold semantics are implied.
          content: { application/json: { schema: { $ref: '#/components/schemas/CabinCatalogPage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/logistics/customer-cabin-catalog:
    get:
      operationId: readCustomerCabinCatalog
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Returns a stable bounded
        page of FREE cabins that are currently bookable for one customer inquiry. The inquiry's
        own live presentation holds remain visible; active order reservations, operation leases
        and holds belonging to other scopes are excluded. Structured filters use
        case-insensitive normalized exact matching and every supplied characteristic must be
        present. This read expires due holds but never creates, renews or releases a live hold.
      parameters:
        - { $ref: '#/components/parameters/WarehouseIdQuery' }
        - name: holdScopeId
          in: query
          required: true
          description: Customer rental-inquiry ID whose current live holds remain visible.
          schema: { type: string, format: uuid }
        - name: query
          in: query
          required: false
          schema: { type: string, maxLength: 255 }
        - name: cabinType
          in: query
          required: false
          schema: { type: string, maxLength: 255 }
        - name: finish
          in: query
          required: false
          schema: { type: string, maxLength: 255 }
        - name: dimensions
          in: query
          required: false
          schema: { type: string, maxLength: 255 }
        - name: category
          in: query
          required: false
          schema: { type: string, maxLength: 255 }
        - name: linoleum
          in: query
          required: false
          schema: { type: boolean }
        - name: characteristics
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            uniqueItems: true
            items: { type: string, minLength: 1, maxLength: 255 }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Currently bookable cabin page for the inquiry scope.
          content: { application/json: { schema: { $ref: '#/components/schemas/CabinCatalogPage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/logistics/cabin-searches:
    post:
      operationId: searchPresentationCabins
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Matches currently
        available rentable cabins for each requested group and mutates this inquiry's short-lived
        holds atomically. REPLACE releases every previous inquiry hold not selected by this exact
        search, including when no cabin matches. Explicit APPEND preserves and renews the previous
        selection and returns only newly selected cabins. A cabin is returned at most once across
        the groups in a response. The
        mandatory Idempotency-Key is scoped to the exact logistics-service subject and
        logistics.cabin-search request fingerprint. An identical retry replays the frozen response;
        the same key with another request returns 409.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CabinSearchRequest' } } }
      responses:
        '200':
          description: Available cabin matches, grouped in request order.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/CabinSearchResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/cabin-availability:
    post:
      operationId: checkPresentationCabinAvailability
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Rechecks each selected
        cabin and returns an explicit per-cabin availability reason without changing state.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CabinAvailabilityRequest' } } }
      responses:
        '200':
          description: Per-cabin availability for the requested warehouse.
          content: { application/json: { schema: { $ref: '#/components/schemas/CabinAvailabilityResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/logistics/cabin-snapshots:
    post:
      operationId: readPresentationCabinSnapshots
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Reads the current cabin
        snapshots for a selected warehouse; all requested cabin IDs must still belong to it.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CabinAvailabilityRequest' } } }
      responses:
        '200':
          description: Current cabin snapshots in the request ID order.
          content: { application/json: { schema: { $ref: '#/components/schemas/CabinSnapshotsResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/asset/v1/logistics/presentations/{presentationId}/holds:
    parameters: [ { $ref: '#/components/parameters/PresentationId' } ]
    get:
      operationId: readPresentationHolds
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Expires due holds before
        returning this presentation's remaining active cabin holds; an unknown or empty presentation
        returns an empty holds list. When actorSubjectId and actorRole are supplied together,
        every active hold must belong to that actor.
      parameters:
        - name: actorSubjectId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: actorRole
          in: query
          required: false
          schema: { $ref: '#/components/schemas/OrderActorRole' }
      responses:
        '200':
          description: Active presentation holds and their latest expiry, if any.
          content: { application/json: { schema: { $ref: '#/components/schemas/ReplacePresentationHoldsResponse' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: replacePresentationHolds
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Atomically replaces the
        presentation's active cabin selection. expiresAt must be in the future and no more than 24
        hours away; retries use the same actor-bound idempotency key. The response cabin snapshots
        are captured under the successful hold locks and preserve rentalItemIds request order, so
        presentation publishers must use them instead of a pre-hold snapshot.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReplacePresentationHoldsRequest' } } }
      responses:
        '200':
          description: Active holds after replacement or the original actor-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ReplacePresentationHoldsResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/presentations/{presentationId}/holds/release:
    parameters:
      - { $ref: '#/components/parameters/PresentationId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: releasePresentationHolds
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Releases every active hold
        for the presentation and is idempotent even when no active holds remain.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ActorInput' } } }
      responses:
        '200':
          description: Empty active-holds result after release or the original actor-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ReplacePresentationHoldsResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/presentations/{presentationId}/holds/convert:
    parameters:
      - { $ref: '#/components/parameters/PresentationId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: convertPresentationHolds
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Atomically converts the
        selected live presentation holds into active order-unit reservations and releases the other
        current holds. When units is non-null, the authoritative post-conversion per-unit furniture
        requirements and aggregate equipment reservations commit under the same order-composition
        lock; retries use the same actor-bound idempotency key.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConvertPresentationHoldsRequest' } } }
      responses:
        '200':
          description: Atomically converted unit and optional equipment reservations, or the original replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ConvertPresentationHoldsResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/inventory/captures:
    post:
      operationId: createInventoryAssetCapture
      description: >-
        Requires SERVICE inventory-service with exactly asset.inventory. Freezes one deterministic
        eligible warehouse population for 30 non-sliding minutes. A later technical attempt under
        the same operation is accepted only after the prior attempt expires.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryCaptureRequest' } } } }
      responses:
        '201': { description: Stable capture created or recovered., content: { application/json: { schema: { $ref: '#/components/schemas/InventoryCapture' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/inventory/assets/{assetId}:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: readCurrentInventoryAssetSnapshot
      description: >-
        Requires SERVICE inventory-service with exactly asset.inventory. Reads one authoritative
        current inventory-safe asset snapshot, including its current tenant and cabin contents;
        local general comments and manual notes are never exposed.
      responses:
        '200': { description: Current inventory-safe asset snapshot., content: { application/json: { schema: { $ref: '#/components/schemas/InventoryAssetCurrentSnapshot' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/asset/v1/inventory/captures/{captureId}/members:
    parameters:
      - { name: captureId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: readInventoryAssetCapturePage
      description: Reads only the immutable capture; page reads never extend its expiry.
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        '200': { description: Stable capture page., content: { application/json: { schema: { $ref: '#/components/schemas/InventoryCapturePage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/inventory/captures/{captureId}:
    parameters:
      - { name: captureId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: releaseInventoryAssetCapture
      description: Idempotently releases copied or losing technical capture state immediately.
      responses:
        '204': { description: Capture released or already terminal. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/asset/v1/inventory/number-resolutions:
    post:
      operationId: resolveInventoryRentalNumber
      description: Warehouse-scoped identity lookup. It never resolves a same-number cabin from another warehouse.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryNumberResolutionRequest' } } } }
      responses:
        '200': { description: Warehouse-scoped resolution including explicit absence., content: { application/json: { schema: { $ref: '#/components/schemas/InventoryNumberResolution' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/inventory/validations:
    post:
      operationId: validateInventoryAssets
      description: Point-in-time read snapshot only; it creates no validation token, lease or fence.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryValidationRequest' } } } }
      responses:
        '200': { description: Deterministically ordered validation snapshot and digest., content: { application/json: { schema: { $ref: '#/components/schemas/InventoryValidation' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/inventory/furniture-snapshots:
    post:
      operationId: readInventoryFurnitureSnapshot
      description: >-
        Requires SERVICE inventory-service with exactly asset.inventory. Returns every active
        FURNITURE catalogue position, stock and only the requested cabin quantities in canonical
        order. An empty assetIds list is a stock-only snapshot with empty cabins arrays.
        snapshotSha256 covers the complete returned current state.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryFurnitureSnapshotRequest' } } } }
      responses:
        '200': { description: Deterministic current furniture count snapshot., content: { application/json: { schema: { $ref: '#/components/schemas/InventoryFurnitureSnapshot' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
  /api/internal/asset/v1/inventory/furniture-reconciliations/{inventoryId}:
    parameters:
      - { name: inventoryId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    put:
      operationId: reconcileInventoryFurniture
      description: >-
        Atomically applies one absolute count for every current active FURNITURE position and the
        selected cabins. Every item may carry an empty cabins list for a stock-only review.
        inventoryId is a permanent source identity: the exact request replays and a changed request
        conflicts. expectedSnapshotSha256 remains mandatory immutable source evidence in that
        request identity, but is not compared with a new full snapshot: non-terminal cabin
        status/version and physical quantities may legitimately drift before reconciliation. Under
        current locks the command still rejects missing, moved or terminal LOST/WRITTEN_OFF cabins,
        cabin-scope mismatch, and an active FURNITURE catalog set/version change. It then supersedes
        live cabin leases, presentation/order bindings, equipment reservations and allocation
        holds while preserving their rows and normal audit events, and replaces the affected
        asset-owned balance quantities with the reviewed absolute counts.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryFurnitureReconciliationRequest' } } } }
      responses:
        '204':
          description: Reconciliation applied, or its exact permanent replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
  /api/internal/asset/v1/inventory/outcomes/{inventoryId}/findings/{findingId}:
    parameters:
      - { name: inventoryId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: findingId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    put:
      operationId: applyInventoryAssetOutcome
      description: >-
        Requires SERVICE inventory-service with exactly asset.inventory. Applies the latest
        completed final-plan finding as authoritative current truth for one non-terminal cabin.
        A PRESENT passport observation replaces the cabin type, dimensions, finishing, category,
        characteristic set and linoleum with exact active catalogue values; ABSENT preserves the
        current passport. Catalogue display names are resolved only inside asset-service and never
        create catalogue rows. Passport and status changes are committed atomically and retain the
        ordinary rental-item event history.
        A first or newer FREE, REPAIR, CAPITAL_REPAIR or RENTED source supersedes active order-unit
        reservations, operation leases, presentation holds and transfer state without deleting
        their history. Another key for the same latest immutable source reasserts status,
        reservations, holds and transfer state. Only a maintenance-repair lease may be retained for
        a REPAIR or CAPITAL_REPAIR outcome; FREE and RENTED release every predecessor lease. RENTED
        requires exact active-catalog shipmentContents; asset-service replaces every cabin-content
        bucket with those CABIN_RENTED quantities without reading, reserving or decrementing STOCK.
        The exact idempotency key replays its stored result, while a strictly older completed
        inventory is rejected permanently.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryOutcomeRequest' }
      responses:
        '200':
          description: Applied/reasserted outcome or exact successful replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryOutcomeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/inventory/source-assets:
    post:
      operationId: createInventorySourceAsset
      description: >-
        Atomically creates one FREE asset and its normal rental-item fact. Permanent source identity
        inventoryId:findingId replays beyond ordinary idempotency retention; changed payload conflicts.
        Canonical callers supply catalogue UUIDs. Supported manager clients may supply the documented
        legacy display names instead; asset-service resolves only exact active
        catalogue values before it registers the permanent source identity. The two representations
        must never be mixed.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventorySourceAssetRequest' } } } }
      responses:
        '200':
          description: Permanent replay.
          headers:
            Idempotency-Replayed: { required: true, schema: { type: string, enum: ['true'] } }
          content: { application/json: { schema: { $ref: '#/components/schemas/InventorySourceAsset' } } }
        '201': { description: Source asset created., content: { application/json: { schema: { $ref: '#/components/schemas/InventorySourceAsset' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerJwt: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    RentalItemId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    RentalItemCreationIntentId: { name: intentId, in: path, required: true, schema: { type: string, format: uuid } }
    EquipmentId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    EquipmentIdPath: { name: equipmentId, in: path, required: true, schema: { type: string, format: uuid } }
    ClassifierId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    HoldId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    LeaseId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    HtmlImportId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    WarehouseIdQuery: { name: warehouseId, in: query, required: true, schema: { type: string, format: uuid } }
    PresentationId: { name: presentationId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
  responses:
    RentalItemCreated:
      description: Created item or original successful replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } }
    ManualNoteCreated:
      description: Appended service-local note or replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ManualNote' } } }
    EquipmentCreated:
      description: Created catalog item or replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Equipment' } } }
    MovementCreated:
      description: Committed ledger movement or replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Movement' } } }
    ClassifierCreated:
      description: Created classifier or replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Classifier' } } }
    EquipmentHoldCreated:
      description: Hold acquired or replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentHold' } } }
    OperationLeaseCreated:
      description: Lease acquired or replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/OperationLease' } } }
    BadRequest: { description: Invalid request., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unauthorized: { description: Missing or invalid token., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Forbidden: { description: Insufficient USER or exact service credential., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NotFound: { description: Canonical asset not found., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Conflict: { description: Unified expected-version, idempotency, invariant or fencing conflict., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    DependencyFailure: { description: A required private warehouse or media dependency is unavailable or rejects the request., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  schemas:
    ExpectedVersion: { type: integer, format: int64, minimum: 0 }
    NullableUuid: { oneOf: [ { type: string, format: uuid }, { type: 'null' } ] }
    RentalItemStatus: { type: string, enum: [RENTED, BOOKED, REPAIR, WAITING_REPAIR_CHECK, WRITTEN_OFF, LOST, CAPITAL_REPAIR, AFTER_RENT, WAITING_ESTIMATE_CONFIRMATION, SALE, USED_SALE, RESERVED, FREE, WAREHOUSE, OWN_NEEDS, IN_TRANSFER] }
    BalanceLocationKind: { type: string, enum: [STOCK, CABIN_NON_RENTED, CABIN_RENTED, WRITTEN_OFF, LOST] }
    EquipmentCategory: { type: string, enum: [FURNITURE, ELECTRICAL, OTHER] }
    Passport: { type: object, additionalProperties: true }
    HtmlImportState:
      type: string
      description: >-
        COMMITTING is a durable local intent awaiting an idempotent media
        preflight or the atomic local asset phase; it is server-recovered and
        cannot be edited or cancelled.
      enum: [DRAFT, REVIEW_REQUIRED, READY, COMMITTING, ASSETS_COMMITTED, MEDIA_IMPORTING, COMPLETED, COMPLETED_WITH_WARNINGS, FAILED]
    HtmlImportRowAction:
      type: string
      description: >-
        CREATE and EXCLUDE are the only active commit actions. MERGE is kept
        solely for reading historical records and is rejected; REVIEW requires
        an explicit CREATE or EXCLUDE decision.
      enum: [CREATE, MERGE, EXCLUDE, REVIEW]
    HtmlImportSummary:
      type: object
      additionalProperties: false
      required: [id, version, warehouseId, state, rowCount, selectedCount, invalidCount, unresolvedCount, mediaLinkCount, warningCount, mediaJobId, failureCode, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { $ref: '#/components/schemas/ExpectedVersion' }
        warehouseId: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/HtmlImportState' }
        rowCount: { type: integer, minimum: 0 }
        selectedCount: { type: integer, minimum: 0 }
        invalidCount: { type: integer, minimum: 0 }
        unresolvedCount: { type: integer, minimum: 0 }
        mediaLinkCount: { type: integer, minimum: 0 }
        warningCount: { type: integer, minimum: 0 }
        mediaJobId: { $ref: '#/components/schemas/NullableUuid' }
        failureCode: { type: [string, 'null'], maxLength: 128 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    HtmlImportCatalogTarget:
      type: object
      additionalProperties: false
      required: [id, kind, name, active]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/CabinCatalogKind' }
        name: { type: string, minLength: 1, maxLength: 255 }
        active: { type: boolean }
    HtmlImportEquipmentTarget:
      type: object
      additionalProperties: false
      required: [id, name, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 255 }
        active: { type: boolean }
    HtmlImportCandidateKind:
      type: string
      enum: [TYPE, DIMENSION, FINISHING, CATEGORY, CHARACTERISTIC, STATUS, EQUIPMENT]
    HtmlImportSourceCandidate:
      type: object
      additionalProperties: false
      required: [kind, sourceValue, suggestedValue, occurrences, suggestedTargetId, required]
      properties:
        kind: { $ref: '#/components/schemas/HtmlImportCandidateKind' }
        sourceValue: { type: string, minLength: 1, maxLength: 255 }
        suggestedValue: { type: [string, 'null'], maxLength: 255 }
        occurrences: { type: integer, format: int64, minimum: 1 }
        suggestedTargetId: { $ref: '#/components/schemas/NullableUuid' }
        required: { type: boolean }
    HtmlImportSourceValue:
      type: object
      additionalProperties: false
      required: [sourceId, sourceLabel, suggestedValue]
      properties:
        sourceId: { type: [string, 'null'], maxLength: 255 }
        sourceLabel: { type: [string, 'null'], maxLength: 255 }
        suggestedValue: { type: [string, 'null'], maxLength: 255 }
    HtmlImportDiagnostic:
      type: object
      additionalProperties: false
      required: [severity, code, field]
      properties:
        severity: { type: string, enum: [ERROR, WARNING] }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,127}$' }
        field: { type: [string, 'null'], maxLength: 64 }
    HtmlImportFurnitureLine:
      type: object
      additionalProperties: false
      required: [sourceId, sourceLabel, quantity]
      properties:
        sourceId: { type: string, minLength: 1, maxLength: 64 }
        sourceLabel: { type: string, minLength: 1, maxLength: 255 }
        quantity: { type: integer, minimum: 1, maximum: 1000 }
    HtmlImportMappingAction:
      type: string
      enum: [MAP, CREATE, IGNORE]
    HtmlImportCatalogMapping:
      type: object
      additionalProperties: false
      required: [kind, sourceValue, action]
      properties:
        kind: { $ref: '#/components/schemas/CabinCatalogKind' }
        sourceValue: { type: string, minLength: 1, maxLength: 255 }
        action: { $ref: '#/components/schemas/HtmlImportMappingAction' }
        targetId: { $ref: '#/components/schemas/NullableUuid' }
        stagedName: { type: [string, 'null'], maxLength: 255 }
    HtmlImportEquipmentMapping:
      type: object
      additionalProperties: false
      required: [sourceValue, action]
      properties:
        sourceValue: { type: string, minLength: 1, maxLength: 255 }
        action: { $ref: '#/components/schemas/HtmlImportMappingAction' }
        targetId: { $ref: '#/components/schemas/NullableUuid' }
        stagedName: { type: [string, 'null'], maxLength: 255 }
    HtmlImportStatusMapping:
      type: object
      description: >-
        targetStatus is restricted by the service to SALE, USED_SALE, FREE,
        WAREHOUSE or OWN_NEEDS; workflow and terminal statuses are rejected.
      additionalProperties: false
      required: [sourceValue, targetStatus]
      properties:
        sourceValue: { type: string, minLength: 1, maxLength: 255 }
        targetStatus: { type: string, enum: [SALE, USED_SALE, FREE, WAREHOUSE, OWN_NEEDS] }
    HtmlImportMergeWinner:
      type: string
      enum: [SOURCE, TARGET]
    HtmlImportRowDecision:
      type: object
      description: >-
        For active imports action must be CREATE, EXCLUDE or REVIEW. A MERGE
        decision and its target/mergeChoices are rejected because an HTML
        import never changes an existing cabin.
      additionalProperties: false
      required: [sourceRowId, action]
      properties:
        sourceRowId: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        action: { $ref: '#/components/schemas/HtmlImportRowAction' }
        proposedNumber: { type: [string, 'null'], maxLength: 128 }
        targetRentalItemId: { $ref: '#/components/schemas/NullableUuid' }
        targetExpectedVersion:
          oneOf:
            - { $ref: '#/components/schemas/ExpectedVersion' }
            - { type: 'null' }
        rentalTypeId: { $ref: '#/components/schemas/NullableUuid' }
        dimensionId: { $ref: '#/components/schemas/NullableUuid' }
        finishingId: { $ref: '#/components/schemas/NullableUuid' }
        categoryId: { $ref: '#/components/schemas/NullableUuid' }
        characteristicIds:
          oneOf:
            - type: array
              maxItems: 100
              uniqueItems: true
              items: { type: string, format: uuid }
            - { type: 'null' }
        status:
          oneOf:
            - { type: string, enum: [SALE, USED_SALE, FREE, WAREHOUSE, OWN_NEEDS] }
            - { type: 'null' }
        linoleum: { type: [boolean, 'null'] }
        comment: { type: [string, 'null'], maxLength: 4000 }
        mergeChoices:
          type: [object, 'null']
          maxProperties: 32
          additionalProperties: { $ref: '#/components/schemas/HtmlImportMergeWinner' }
    HtmlImportPlan:
      type: object
      additionalProperties: false
      required: [catalogMappings, equipmentMappings, statusMappings, rows]
      properties:
        catalogMappings:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/HtmlImportCatalogMapping' }
        equipmentMappings:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/HtmlImportEquipmentMapping' }
        statusMappings:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/HtmlImportStatusMapping' }
        rows:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/HtmlImportRowDecision' }
    UpdateHtmlImportPlanRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, catalogMappings, equipmentMappings, statusMappings, rows]
      properties:
        expectedVersion: { $ref: '#/components/schemas/ExpectedVersion' }
        catalogMappings:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/HtmlImportCatalogMapping' }
        equipmentMappings:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/HtmlImportEquipmentMapping' }
        statusMappings:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/HtmlImportStatusMapping' }
        rows:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/HtmlImportRowDecision' }
    CommitHtmlImportRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { $ref: '#/components/schemas/ExpectedVersion' }
    RetryHtmlImportMediaRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { $ref: '#/components/schemas/ExpectedVersion' }
    SkipHtmlImportMediaRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { $ref: '#/components/schemas/ExpectedVersion' }
    HtmlImportMediaReplacement:
      type: object
      additionalProperties: false
      required: [rowId, publicUrl]
      properties:
        rowId: { type: string, format: uuid }
        publicUrl:
          description: Exact Yandex.Disk replacement link. It is write-only and never returned by this API.
          type: string
          pattern: '^https://disk\.yandex\.ru/d/[A-Za-z0-9_-]{14}$'
    ReplaceHtmlImportMediaRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, replacements]
      properties:
        expectedVersion: { $ref: '#/components/schemas/ExpectedVersion' }
        replacements:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/HtmlImportMediaReplacement' }
    ExistingRentalItemPreview:
      type: object
      additionalProperties: false
      required: [id, version, number, status, rentalTypeId, rentalType, dimensionId, dimension, finishingId, finishing, categoryId, category, linoleum, generalComment, passport]
      properties:
        id: { type: string, format: uuid }
        version: { $ref: '#/components/schemas/ExpectedVersion' }
        number: { type: string, minLength: 1, maxLength: 128 }
        status: { $ref: '#/components/schemas/RentalItemStatus' }
        rentalTypeId: { $ref: '#/components/schemas/NullableUuid' }
        rentalType: { type: [string, 'null'], maxLength: 255 }
        dimensionId: { $ref: '#/components/schemas/NullableUuid' }
        dimension: { type: [string, 'null'], maxLength: 255 }
        finishingId: { $ref: '#/components/schemas/NullableUuid' }
        finishing: { type: [string, 'null'], maxLength: 255 }
        categoryId: { $ref: '#/components/schemas/NullableUuid' }
        category: { type: [string, 'null'], maxLength: 255 }
        linoleum: { type: [boolean, 'null'] }
        generalComment: { type: [string, 'null'], maxLength: 4000 }
        passport: { $ref: '#/components/schemas/Passport' }
    HtmlImportRow:
      type: object
      additionalProperties: false
      required: [id, sourceRowId, sourcePosition, sourceNumber, proposedNumber, action, targetRentalItemId, rentalType, dimension, finishing, category, characteristics, linoleum, storageState, status, proposedStatus, comment, hasPhotoLink, furniture, shipmentDate, tenant, price, diagnostics, decision, existingRentalItem]
      properties:
        id: { type: string, format: uuid }
        sourceRowId: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        sourcePosition: { type: integer, minimum: 0 }
        sourceNumber: { type: [string, 'null'], maxLength: 512 }
        proposedNumber: { type: [string, 'null'], maxLength: 128 }
        action: { $ref: '#/components/schemas/HtmlImportRowAction' }
        targetRentalItemId: { $ref: '#/components/schemas/NullableUuid' }
        rentalType: { $ref: '#/components/schemas/HtmlImportSourceValue' }
        dimension: { $ref: '#/components/schemas/HtmlImportSourceValue' }
        finishing: { $ref: '#/components/schemas/HtmlImportSourceValue' }
        category: { $ref: '#/components/schemas/HtmlImportSourceValue' }
        characteristics:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/HtmlImportSourceValue' }
        linoleum: { type: [boolean, 'null'] }
        storageState: { type: [string, 'null'], maxLength: 4000 }
        status: { $ref: '#/components/schemas/HtmlImportSourceValue' }
        proposedStatus:
          oneOf:
            - { $ref: '#/components/schemas/RentalItemStatus' }
            - { type: 'null' }
        comment: { type: [string, 'null'], maxLength: 4000 }
        hasPhotoLink: { type: boolean }
        furniture:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/HtmlImportFurnitureLine' }
        shipmentDate: { type: [string, 'null'], format: date }
        tenant: { type: [string, 'null'], maxLength: 4000 }
        price: { type: [number, 'null'], exclusiveMinimum: 0 }
        diagnostics:
          type: array
          items: { $ref: '#/components/schemas/HtmlImportDiagnostic' }
        decision:
          oneOf:
            - { $ref: '#/components/schemas/HtmlImportRowDecision' }
            - { type: 'null' }
        existingRentalItem:
          oneOf:
            - { $ref: '#/components/schemas/ExistingRentalItemPreview' }
            - { type: 'null' }
    HtmlImportRowPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/HtmlImportRow' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 200 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int64, minimum: 0 }
    HtmlImportDetail:
      type: object
      additionalProperties: false
      required: [id, version, warehouseId, state, rowCount, selectedCount, invalidCount, unresolvedCount, mediaLinkCount, warningCount, mediaJobId, failureCode, createdAt, updatedAt, catalogTargets, equipmentTargets, sourceCandidates, plan]
      properties:
        id: { type: string, format: uuid }
        version: { $ref: '#/components/schemas/ExpectedVersion' }
        warehouseId: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/HtmlImportState' }
        rowCount: { type: integer, minimum: 0 }
        selectedCount: { type: integer, minimum: 0 }
        invalidCount: { type: integer, minimum: 0 }
        unresolvedCount: { type: integer, minimum: 0 }
        mediaLinkCount: { type: integer, minimum: 0 }
        warningCount: { type: integer, minimum: 0 }
        mediaJobId: { $ref: '#/components/schemas/NullableUuid' }
        failureCode: { type: [string, 'null'], maxLength: 128 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        catalogTargets:
          type: array
          items: { $ref: '#/components/schemas/HtmlImportCatalogTarget' }
        equipmentTargets:
          type: array
          items: { $ref: '#/components/schemas/HtmlImportEquipmentTarget' }
        sourceCandidates:
          type: array
          items: { $ref: '#/components/schemas/HtmlImportSourceCandidate' }
        plan: { $ref: '#/components/schemas/HtmlImportPlan' }
    CreateRentalItemRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, number, rentalTypeId, dimensionId, finishingId, characteristicIds, linoleum]
      properties:
        warehouseId: { type: string, format: uuid }
        number: { type: string, minLength: 1, maxLength: 128 }
        rentalTypeId: { type: string, format: uuid }
        dimensionId: { type: string, format: uuid }
        finishingId: { type: string, format: uuid }
        category: { type: [string, 'null'], maxLength: 255 }
        characteristicIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        linoleum: { type: boolean }
        passport: { $ref: '#/components/schemas/Passport' }
        tags: { type: array, maxItems: 128, items: { type: string, minLength: 1, maxLength: 128 } }
    CabinCatalogKind:
      type: string
      enum: [TYPE, DIMENSION, FINISHING, CATEGORY, CHARACTERISTIC]
    CabinCatalogValue:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 255 }
    CabinCatalogItem:
      type: object
