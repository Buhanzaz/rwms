  /api/internal/asset/v1/logistics/transfer-unit-reservations:
    post:
      operationId: confirmLogisticsTransferUnitReservations
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Atomically locks every
        selected cabin in stable UUID order, verifies source warehouse, expected rental-item
        version, FREE status, active catalog-backed type/dimension/finishing/characteristics and
        linoleum requirements, and rejects order, presentation, lease, inventory, disposition or
