        targetWarehouseId: { type: string, format: uuid }
        targetRentalItemId: { $ref: '#/components/schemas/NullableUuid' }
        targetLocationKind: { $ref: '#/components/schemas/TransferBalanceLocationKind' }
        targetExpectedVersion:
          allOf: [ { $ref: '#/components/schemas/ExpectedVersion' } ]
          description: Existing target balance revision; use 0 when the target STOCK balance is absent.
        quantity: { type: integer, format: int64, minimum: 1 }
    TransferBalanceLocationKind:
      type: string
      enum: [STOCK, CABIN_NON_RENTED, CABIN_RENTED]
