          application/json:
            schema: { $ref: '#/components/schemas/ConfirmTransferUnitReservationsRequest' }
      responses:
        '201':
          description: Active batch reservation receipt or original subject-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferUnitReservationReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
        '503': { $ref: '#/components/responses/DependencyFailure' }
  /api/internal/asset/v1/logistics/transfer-unit-reservations/release:
    put:
      operationId: releaseLogisticsTransferUnitReservations
      description: >-
        Releases only exact ACTIVE transferId:lineId reservation owners with matching reservation
        versions. Every cabin returns to FREE without changing warehouse; RELEASED and CONSUMED
        rows remain immutable history, and a subject-bound command replay is response-stable.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
