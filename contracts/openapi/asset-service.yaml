        - addedByRole
        - createdAt
        - releasedAt
        - replayed
        - unit
      properties:
        reservationId: { type: string, format: uuid }
        reservationVersion: { $ref: '#/components/schemas/ExpectedVersion' }
        orderId: { type: string, format: uuid }
        rentalItemId: { type: string, format: uuid }
