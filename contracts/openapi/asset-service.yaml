      properties:
        holdId: { type: string, format: uuid }
        version: { $ref: '#/components/schemas/ExpectedVersion' }
        presentationId: { type: string, format: uuid }
        rentalItemId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/PresentationHoldState' }
        expiresAt: { type: string, format: date-time }
        orderId: { $ref: '#/components/schemas/NullableUuid' }
        createdAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
