openapi: 3.1.0
info:
  title: RWMS Asset Service API
  version: 1.5.0
  description: >-
    Stage 5 canonical asset boundary plus narrow Stage 7 inventory-service and
    Stage 8 logistics-service private surfaces. Rental-item comments and
    manual-note text are readable only through this HTTP API and are never
    Kafka facts. New production databases start empty; browser fixtures and
    legacy rows are not an import source.
servers:
  - url: /
security:
  - bearerJwt: []
paths:
  /api/asset/v1/rental-items:
    get:
      operationId: listRentalItems
      description: Requires USER rwms.read and warehouse VIEW access.
      parameters:
        - $ref: '#/components/parameters/WarehouseIdQuery'
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: search, in: query, schema: { type: string, maxLength: 128 } }
        - name: excludeStatus
          in: query
          description: Rental-item statuses omitted before pagination.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/RentalItemStatus' }
      responses:
        '200': { description: Page of canonical rental items, content: { application/json: { schema: { $ref: '#/components/schemas/RentalItemPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createRentalItem
      description: Requires USER rwms.write and warehouse EDIT access. Number is unique inside its warehouse, normalized, and never reusable there.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateRentalItemRequest' } } }
      responses:
        '201': { $ref: '#/components/responses/RentalItemCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
  /api/asset/v1/rental-items/{id}:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    get:
      operationId: getRentalItem
      description: Requires USER rwms.read and the item's warehouse VIEW access.
      responses:
        '200': { description: Canonical rental-item passport, status, editable general comment and contents., content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/asset/v1/rental-items/{id}/passport:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    put:
      operationId: updateRentalItemPassport
      description: Requires USER rwms.write and warehouse EDIT access. expectedVersion is mandatory.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePassportRequest' } } } }
      responses:
        '200': { description: Updated rental item., content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/rental-items/{id}/status:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    put:
      operationId: updateRentalItemStatus
      description: Public manual status changes cannot set IN_TRANSFER or WRITTEN_OFF and require expectedVersion.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateStatusRequest' } } } }
      responses:
        '200': { description: Updated rental item., content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/rental-items/{id}/warehouse:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    put:
      operationId: updateRentalItemWarehouse
      description: Requires EDIT access to both source and target warehouse, an active target warehouse registry response, and no equipment contents; move contents through the equipment transfer command first.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateWarehouseRequest' } } } }
      responses:
        '200': { description: Updated rental item., content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
  /api/asset/v1/rental-items/{id}/general-comment:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    put:
      operationId: updateRentalItemGeneralComment
      description: The general comment is editable service-local data and does not enter Kafka or DLT.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateGeneralCommentRequest' } } } }
      responses:
        '200': { description: Updated rental item., content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/rental-items/{id}/manual-notes:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    get:
      operationId: listRentalItemManualNotes
      description: Append-only service-local notes. Requires VIEW access and is never a Kafka read model.
      responses:
        '200': { description: Notes ordered by creation time., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ManualNote' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addRentalItemManualNote
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddManualNoteRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/ManualNoteCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/equipment:
    get:
      operationId: listWarehouseEquipment
      description: Returns global catalog items with warehouse ledger totals. total = stock + non-rented cabin + rented cabin + written-off + lost. Each balance exposes its active holds and free quantity in availableStock; the aggregate availableStock is the free stock balance.
      parameters: [ { $ref: '#/components/parameters/WarehouseIdQuery' } ]
      responses:
        '200': { description: Equipment and balance summaries., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EquipmentWarehouse' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/asset/v1/equipment/catalog:
    get:
      operationId: listEquipmentCatalog
      description: Requires USER rwms.read. Catalog writes are global-admin only.
      responses:
        '200': { description: Global catalog., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Equipment' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createEquipmentCatalogItem
      description: Requires SYSTEM_ADMIN or WMS_ADMIN plus rwms.write.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateEquipmentRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/EquipmentCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/equipment/catalog/{id}:
    parameters: [ { $ref: '#/components/parameters/EquipmentId' } ]
    get:
      operationId: getEquipmentCatalogItem
      responses:
        '200': { description: Catalog item., content: { application/json: { schema: { $ref: '#/components/schemas/Equipment' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateEquipmentCatalogItem
      description: Global-admin write; expectedVersion is mandatory.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateEquipmentRequest' } } } }
      responses:
        '200': { description: Updated catalog item., content: { application/json: { schema: { $ref: '#/components/schemas/Equipment' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/equipment/{equipmentId}/totals:
    parameters:
      - $ref: '#/components/parameters/EquipmentIdPath'
      - $ref: '#/components/parameters/WarehouseIdQuery'
    get:
      operationId: getEquipmentTotals
      responses:
        '200': { description: Immutable-ledger balance view., content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentTotals' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/asset/v1/equipment/transfers:
    post:
      operationId: transferEquipment
      description: One local PostgreSQL transaction changes both balance streams and immutable movement ledger lines. Requires MANAGE in both warehouses.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransferEquipmentRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/MovementCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
  /api/asset/v1/equipment/dispositions:
    get:
      operationId: listEquipmentDispositions
      parameters: [ { $ref: '#/components/parameters/WarehouseIdQuery' } ]
      responses:
        '200': { description: Written-off and lost movements., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EquipmentDisposition' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: disposeEquipment
      description: Moves equipment to written-off or lost ledger bucket. Requires MANAGE and expected source balance version.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DispositionEquipmentRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/MovementCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/classifiers:
    get:
      operationId: listAssetClassifiers
      parameters: [ { name: type, in: query, schema: { type: string, enum: [CATEGORY, SUBCATEGORY, TYPE, CONDITION] } } ]
      responses:
        '200': { description: Global classifier list., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Classifier' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAssetClassifier
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateClassifierRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/ClassifierCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/classifiers/{id}:
    parameters: [ { $ref: '#/components/parameters/ClassifierId' } ]
    put:
      operationId: updateAssetClassifier
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClassifierRequest' } } } }
      responses:
        '200': { description: Updated classifier., content: { application/json: { schema: { $ref: '#/components/schemas/Classifier' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/equipment-holds:
    post:
      operationId: acquireEquipmentHold
      description: Private only. Requires SERVICE principal with exactly asset.internal; renewable hold TTL is 15 minutes by default.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AcquireEquipmentHoldRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/EquipmentHoldCreated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/equipment-holds/{id}/renew:
    parameters: [ { $ref: '#/components/parameters/HoldId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: renewEquipmentHold
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExpectedVersionRequest' } } } }
      responses:
        '200': { description: Renewed hold., content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentHold' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/equipment-holds/{id}/release:
    parameters: [ { $ref: '#/components/parameters/HoldId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: releaseEquipmentHold
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExpectedVersionRequest' } } } }
      responses:
        '200': { description: Released hold., content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentHold' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/equipment-holds/{id}/commit:
    parameters: [ { $ref: '#/components/parameters/HoldId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: commitEquipmentHold
      description: >-
        Commits an active physical-stock hold without inferring a logistics movement. A committed hold
        continues to reduce available stock until a compensating release is accepted.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExpectedVersionRequest' } } } }
      responses:
        '200': { description: Committed hold., content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentHold' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/operation-leases:
    post:
      operationId: acquireOperationLease
      description: Private only. Fencing tokens prevent stale status commands; lease TTL is 15 minutes by default.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AcquireOperationLeaseRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/OperationLeaseCreated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/operation-leases/{id}/renew:
    parameters: [ { $ref: '#/components/parameters/LeaseId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: renewOperationLease
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RenewOperationLeaseRequest' } } } }
      responses:
        '200': { description: Renewed lease., content: { application/json: { schema: { $ref: '#/components/schemas/OperationLease' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/operation-leases/{id}/release:
    parameters: [ { $ref: '#/components/parameters/LeaseId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: releaseOperationLease
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseOperationLeaseRequest' } } } }
      responses:
        '200': { description: Released lease., content: { application/json: { schema: { $ref: '#/components/schemas/OperationLease' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/rental-items/{id}/fenced-status:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    put:
      operationId: updateFencedRentalItemStatus
      description: Private status command rejected unless lease ID and fencing token match the active lease.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FencedStatusRequest' } } } }
      responses:
        '200': { description: Updated rental item., content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/operation-leases:
    post:
      operationId: acquireMaintenanceOperationLease
      description: >-
        Requires SERVICE principal maintenance-service with exactly asset.maintenance. The owner is
        restricted to MAINTENANCE_ESTIMATE:<UUID> or MAINTENANCE_REPAIR:<root-repair UUID>.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AcquireMaintenanceOperationLeaseRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/OperationLeaseCreated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/operation-leases/{id}/renew:
    parameters: [ { $ref: '#/components/parameters/LeaseId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: renewMaintenanceOperationLease
      description: Rechecks the exact maintenance owner, expected lease version and active fencing token.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RenewMaintenanceOperationLeaseRequest' } } } }
      responses:
        '200': { description: Renewed lease or original subject-bound replay., content: { application/json: { schema: { $ref: '#/components/schemas/OperationLease' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/operation-leases/{id}/release:
    parameters: [ { $ref: '#/components/parameters/LeaseId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: releaseMaintenanceOperationLease
      description: Rechecks the exact maintenance owner and returns the original response for an identical replay.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseMaintenanceOperationLeaseRequest' } } } }
      responses:
        '200': { description: Released lease or original subject-bound replay., content: { application/json: { schema: { $ref: '#/components/schemas/OperationLease' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/rental-items/{id}/snapshot:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    get:
      operationId: readMaintenanceRentalItemSnapshot
      description: >-
        Requires SERVICE maintenance-service with exactly asset.maintenance. Returns only the
        current canonical ID, version, warehouse and status needed before acquiring a lease; it
        never exposes a cabin number, passport, comments or equipment.
      responses:
        '200': { description: Current narrow maintenance asset snapshot., content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceRentalItemSnapshot' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/asset/v1/maintenance/equipment-catalog/{equipmentCode}:
    parameters:
      - name: equipmentCode
        in: path
        required: true
        description: Stable maintenance furniture code, canonicalized by asset-service.
        schema: { type: string, minLength: 1, maxLength: 64 }
    put:
      operationId: ensureMaintenanceFurnitureEquipment
      description: >-
        Requires SERVICE maintenance-service with exactly asset.maintenance. Idempotently creates
        or reactivates the matching FURNITURE catalog item. A code already bound to another trimmed
        name or category is rejected without mutation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnsureMaintenanceFurnitureEquipmentRequest' }
      responses:
        '200':
          description: Existing, created or reactivated sanitized furniture identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceFurnitureEquipment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/rental-items/{id}/fenced-status:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: updateMaintenanceFencedRentalItemStatus
      description: >-
        Requires the exact maintenance client/scope, matching active lease owner and fence. The request
        exposes only approved maintenance actions; asset derives and validates the source/target status.
        Only an estimate-owned queue action with estimateId equal to the lease owner may atomically move
        estimate-linked furniture from the cabin to LOST before the status transition. Direct repairs
        cannot submit furniture losses.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceFencedStatusRequest' } } } }
      responses:
        '200':
          description: Updated rental item or original subject-bound replay while the fence remains active.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/rental-items/{id}/snapshot:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    get:
      operationId: readLogisticsRentalItemSnapshot
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Returns only the canonical
        asset ID, version, warehouse, status and opaque equipment quantities; it never exposes a
        cabin number, passport, local comments or generic asset read data.
      responses:
        '200': { description: Narrow canonical asset snapshot., content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsRentalItemSnapshot' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/asset/v1/logistics/operation-leases:
    post:
      operationId: acquireLogisticsOperationLease
      description: >-
        Requires exactly asset.logistics. Owner type is closed to the three logistics aggregate
        families and asset derives the persisted owner reference as documentId:lineId.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AcquireLogisticsOperationLeaseRequest' } } } }
      responses:
        '201':
          description: Acquired lease or original subject-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsOperationLease' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/return-equipment-receipts:
    post:
      operationId: receiveLogisticsReturnEquipment
      description: >-
        Requires exactly asset.logistics. Records an immutable receipt for active
        FURNITURE found in addition to a returned cabin's canonical contents and
        increments the destination warehouse STOCK balance atomically.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogisticsReturnEquipmentReceiptRequest' }
      responses:
        '201':
          description: Immutable stock receipts or original subject-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsReturnEquipmentReceipt' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
  /api/internal/asset/v1/logistics/operation-leases/{id}/renew:
    parameters: [ { $ref: '#/components/parameters/LeaseId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: renewLogisticsOperationLease
      description: Rechecks the exact typed document-line owner, expected lease version and active fencing token.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsLeaseCommandRequest' } } } }
      responses:
        '200':
          description: Renewed lease or original subject-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsOperationLease' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/operation-leases/{id}/release:
    parameters: [ { $ref: '#/components/parameters/LeaseId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: releaseLogisticsOperationLease
      description: Rechecks the exact typed document-line owner before releasing the opaque lease.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsLeaseCommandRequest' } } } }
      responses:
        '200':
          description: Released lease or original subject-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsOperationLease' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/rental-items/{id}/effects:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: applyLogisticsRentalItemEffect
      description: >-
        A closed action allowlist validates the matching active typed lease, asset version and
        permissible canonical return, shipment or transfer transition. Only transfer arrival may
        move warehouse; attached cabin contents move through asset-owned ledger rows atomically.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsFencedEffectRequest' } } } }
      responses:
        '200':
          description: Canonical effect applied or original replay while the active fence remains valid.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsRentalItemSnapshot' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
        '503': { $ref: '#/components/responses/DependencyFailure' }
  /api/internal/asset/v1/logistics/equipment-holds:
    post:
      operationId: acquireLogisticsEquipmentHold
      description: >-
        Requires exactly asset.logistics. Only a shipmentId:shipmentLineId owner can reserve
        canonical stock; asset remains owner of hold state and all physical ledger movement.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AcquireLogisticsEquipmentHoldRequest' } } } }
      responses:
        '201':
          description: Opaque hold reference or original subject-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsEquipmentHold' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
        '503': { $ref: '#/components/responses/DependencyFailure' }
  /api/internal/asset/v1/logistics/equipment-holds/{id}/renew:
    parameters: [ { $ref: '#/components/parameters/HoldId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: renewLogisticsEquipmentHold
      description: Renews only a matching active shipment-line hold.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsEquipmentHoldCommandRequest' } } } }
      responses:
        '200':
          description: Renewed opaque hold or original subject-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsEquipmentHold' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/equipment-holds/{id}/commit:
    parameters: [ { $ref: '#/components/parameters/HoldId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: commitLogisticsEquipmentHold
      description: Commits only a matching active shipment-line hold without inferring a logistics movement.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsEquipmentHoldCommandRequest' } } } }
      responses:
        '200':
          description: Committed opaque hold or original subject-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsEquipmentHold' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/equipment-holds/{id}/release:
    parameters: [ { $ref: '#/components/parameters/HoldId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: releaseLogisticsEquipmentHold
      description: Releases only a matching shipment-line hold; active and committed holds are asset-owned states.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsEquipmentHoldCommandRequest' } } } }
      responses:
        '200':
          description: Released opaque hold or original subject-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsEquipmentHold' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/equipment-movement-reservations:
    post:
      operationId: acquireLogisticsEquipmentMovementReservation
      description: >-
        Requires exactly asset.logistics. Reserves one exact STOCK or canonical cabin source balance
        for movementId:lineId until the caller-supplied reservedUntil instant. Asset derives the closed
        LOGISTICS_EQUIPMENT_MOVEMENT owner and returns canonical catalog code/name for task text.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcquireLogisticsEquipmentMovementReservationRequest' }
      responses:
        '201':
          description: Acquired reservation or original subject-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsEquipmentMovementReservation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
        '503': { $ref: '#/components/responses/DependencyFailure' }
  /api/internal/asset/v1/logistics/equipment-movement-reservations/{id}/release:
    parameters: [ { $ref: '#/components/parameters/HoldId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: releaseLogisticsEquipmentMovementReservation
      description: >-
        Releases only a matching movementId:lineId reservation with its exact reservation version.
        An already terminal reservation is returned unchanged only when that current version is supplied.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogisticsEquipmentMovementReservationCommandRequest' }
      responses:
        '200':
          description: Released reservation or original subject-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsEquipmentMovementReservation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/equipment-movement-reservations/execute:
    post:
      operationId: executeLogisticsEquipmentMovementReservations
      description: >-
        Applies one or more worker-completed reserved movements atomically. Every reservation must
        be ACTIVE, unexpired, owned by the supplied movementId:lineId and match its reservation
        version. Target balance versions are intentionally not preconditions; asset serializes and
        increments the current target balance in the same transaction.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecuteLogisticsEquipmentMovementReservationsRequest' }
      responses:
        '201':
          description: Every physical movement and reservation execution persisted, or original replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsEquipmentMovementExecution' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
        '503': { $ref: '#/components/responses/DependencyFailure' }
  /api/internal/asset/v1/logistics/orders/{orderId}/unit-candidates:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: readOrderUnitCandidates
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. The server returns only
        unreserved FREE units without a live operation lease in the requested warehouse, plus
        units already active in this order. Non-FREE units and reservations owned by other orders
        are excluded before pagination.
      parameters:
        - { name: warehouseId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: search, in: query, schema: { type: string, maxLength: 128, default: '' } }
      responses:
        '200':
          description: Server-filtered order-unit candidate page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderUnitCandidatePage' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/logistics/orders/{orderId}/units:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: readOrderUnits
      description: Requires SERVICE logistics-service with exactly asset.logistics.
      responses:
        '200':
          description: Active unit reservations owned by this order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderUnitReservation' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: reserveOrderUnit
      description: >-
        Atomically locks the canonical rental item and creates one active reservation. A partial
        database unique index forbids a second active order for the same rental item.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveOrderUnitRequest' }
      responses:
        '200':
          description: Original reservation replay or same-order natural replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderUnitReservation' }
        '201':
          description: Active reservation created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderUnitReservation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/orders/{orderId}/units/release-all:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: releaseAllOrderUnits
      description: Releases every active reservation for the order in one transaction and supports exact replay.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderActorRequest' }
      responses:
        '200':
          description: Released reservations or the original replayed result.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderUnitReservation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/orders/{orderId}/units/{rentalItemId}/release:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: rentalItemId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: releaseOrderUnit
      description: Releases only an active reservation owned by this order and supports exact replay.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderActorRequest' }
      responses:
        '200':
          description: Released reservation or the original replayed result.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderUnitReservation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/orders/{orderId}/units/{rentalItemId}/equipment/{equipmentId}:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: rentalItemId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: equipmentId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    put:
      operationId: setOrderUnitEquipmentQuantity
      description: >-
        Atomically sets the required quantity through the canonical equipment ledger. The only
        permitted locations are warehouse STOCK and the selected order unit; cabin-to-cabin
        movement is not expressible on this boundary.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustOrderEquipmentRequest' }
      responses:
        '200':
          description: Applied ledger adjustment or original replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderEquipmentAdjustment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/inventory/captures:
    post:
      operationId: createInventoryAssetCapture
      description: >-
        Requires SERVICE inventory-service with exactly asset.inventory. Freezes one deterministic
        eligible warehouse population for 30 non-sliding minutes. A later technical attempt under
        the same operation is accepted only after the prior attempt expires.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryCaptureRequest' } } } }
      responses:
        '201': { description: Stable capture created or recovered., content: { application/json: { schema: { $ref: '#/components/schemas/InventoryCapture' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/inventory/captures/{captureId}/members:
    parameters:
      - { name: captureId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: readInventoryAssetCapturePage
      description: Reads only the immutable capture; page reads never extend its expiry.
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        '200': { description: Stable capture page., content: { application/json: { schema: { $ref: '#/components/schemas/InventoryCapturePage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/inventory/captures/{captureId}:
    parameters:
      - { name: captureId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: releaseInventoryAssetCapture
      description: Idempotently releases copied or losing technical capture state immediately.
      responses:
        '204': { description: Capture released or already terminal. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/asset/v1/inventory/number-resolutions:
    post:
      operationId: resolveInventoryRentalNumber
      description: Warehouse-scoped identity lookup. It never resolves a same-number cabin from another warehouse.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryNumberResolutionRequest' } } } }
      responses:
        '200': { description: Warehouse-scoped resolution including explicit absence., content: { application/json: { schema: { $ref: '#/components/schemas/InventoryNumberResolution' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/inventory/validations:
    post:
      operationId: validateInventoryAssets
      description: Point-in-time read snapshot only; it creates no validation token, lease or fence.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryValidationRequest' } } } }
      responses:
        '200': { description: Deterministically ordered validation snapshot and digest., content: { application/json: { schema: { $ref: '#/components/schemas/InventoryValidation' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/inventory/source-assets:
    post:
      operationId: createInventorySourceAsset
      description: >-
        Atomically creates one FREE asset and its normal rental-item fact. Permanent source identity
        inventoryId:findingId replays beyond ordinary idempotency retention; changed payload conflicts.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventorySourceAssetRequest' } } } }
      responses:
        '200':
          description: Permanent replay.
          headers:
            Idempotency-Replayed: { required: true, schema: { type: string, enum: ['true'] } }
          content: { application/json: { schema: { $ref: '#/components/schemas/InventorySourceAsset' } } }
        '201': { description: Source asset created., content: { application/json: { schema: { $ref: '#/components/schemas/InventorySourceAsset' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerJwt: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    RentalItemId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    EquipmentId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    EquipmentIdPath: { name: equipmentId, in: path, required: true, schema: { type: string, format: uuid } }
    ClassifierId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    HoldId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    LeaseId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    WarehouseIdQuery: { name: warehouseId, in: query, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
  responses:
    RentalItemCreated:
      description: Created item or original successful replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } }
    ManualNoteCreated:
      description: Appended service-local note or replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ManualNote' } } }
    EquipmentCreated:
      description: Created catalog item or replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Equipment' } } }
    MovementCreated:
      description: Committed ledger movement or replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
