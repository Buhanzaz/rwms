  /api/internal/asset/v1/logistics/equipment-movement-reservations:
    post:
      operationId: acquireLogisticsEquipmentMovementReservation
      description: >-
        Requires exactly asset.logistics. Reserves one exact STOCK or canonical cabin source balance
        for movementId:lineId until the caller-supplied reservedUntil instant. Asset derives the closed
        LOGISTICS_EQUIPMENT_MOVEMENT owner and returns canonical catalog UUID/name for task text.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcquireLogisticsEquipmentMovementReservationRequest' }
      responses:
        '201':
          description: Acquired reservation or original subject-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsEquipmentMovementReservation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
        '503': { $ref: '#/components/responses/DependencyFailure' }
  /api/internal/asset/v1/logistics/equipment-movement-reservations/{id}/release:
    parameters: [ { $ref: '#/components/parameters/HoldId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: releaseLogisticsEquipmentMovementReservation
      description: >-
        Releases only a matching movementId:lineId reservation with its exact reservation version.
        An already terminal reservation is returned unchanged only when that current version is supplied.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogisticsEquipmentMovementReservationCommandRequest' }
      responses:
        '200':
          description: Released reservation or original subject-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsEquipmentMovementReservation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/equipment-movement-reservations/execute:
    post:
      operationId: executeLogisticsEquipmentMovementReservations
      description: >-
        Applies one or more worker-completed reserved movements atomically. Every reservation must
        be ACTIVE, unexpired, owned by the supplied movementId:lineId and match its reservation
        version. Target balance versions are intentionally not preconditions; asset serializes and
        increments the current target balance in the same transaction.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecuteLogisticsEquipmentMovementReservationsRequest' }
      responses:
        '201':
          description: Every physical movement and reservation execution persisted, or original replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsEquipmentMovementExecution' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
        '503': { $ref: '#/components/responses/DependencyFailure' }
  /api/internal/asset/v1/logistics/orders/{orderId}/unit-candidates:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: readOrderUnitCandidates
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. The server returns only
        unreserved FREE units without a live operation lease in the requested warehouse, plus
        units already active in this order. Non-FREE units and reservations owned
        by other orders are excluded before pagination.
      parameters:
        - { name: warehouseId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: search, in: query, schema: { type: string, maxLength: 128, default: '' } }
      responses:
        '200':
          description: Server-filtered order-unit candidate page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderUnitCandidatePage' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/logistics/orders/{orderId}/units:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: readOrderUnits
      description: Requires SERVICE logistics-service with exactly asset.logistics.
      responses:
        '200':
          description: Active unit reservations owned by this order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderUnitReservation' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: reserveOrderUnit
      description: >-
        Atomically locks a FREE rental item and creates one active reservation. Releasing a draft
        reservation restores FREE. A partial
        database unique index forbids a second active order for the same rental item.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveOrderUnitRequest' }
      responses:
        '200':
          description: Original reservation replay or same-order natural replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderUnitReservation' }
        '201':
          description: Active reservation created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderUnitReservation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/orders/{orderId}/units/release-all:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: releaseAllOrderUnits
      description: Releases every active reservation for the order in one transaction and supports exact replay.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderActorRequest' }
      responses:
        '200':
          description: Released reservations or the original replayed result.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderUnitReservation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/orders/{orderId}/units/{rentalItemId}/release:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: rentalItemId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: releaseOrderUnit
      description: Releases only an active reservation owned by this order and supports exact replay.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderActorRequest' }
      responses:
        '200':
          description: Released reservation or the original replayed result.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderUnitReservation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/orders/{orderId}/equipment-reservations:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    put:
      operationId: replaceOrderEquipmentReservations
      description: >-
        Replaces the order-wide catalogue reservation without choosing a source cabin. Availability
        is stock plus non-rented cabins, less physical holds and reservations of other orders.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ReplaceOrderEquipmentReservationsRequest' } }
      responses:
        '200':
          description: Active reservations after replacement or original replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/OrderEquipmentReservation' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/orders/{orderId}/equipment-movement-plan:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: planOrderFurnitureMovements
      description: >-
        Computes the physical difference between one selected order cabin and its desired furniture.
        It plans additions from stock or unreserved non-rented cabins and returns surplus to stock;
        it does not move any ledger balance itself.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/OrderFurnitureMovementPlanRequest' } }
      responses:
        '200':
          description: Exact source-to-target worker movement plan.
          content: { application/json: { schema: { $ref: '#/components/schemas/OrderFurnitureMovementPlan' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/rental-items/{rentalItemId}/furniture-movement-plan:
    parameters:
      - { name: rentalItemId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: planCabinFurnitureMovements
      description: >-
        Computes the complete desired furniture composition for one editable cabin. It selects
        current source balances from additional equipment and returns a worker-task plan without
        changing physical balances.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CabinFurnitureMovementPlanRequest' } }
      responses:
        '200':
          description: Exact source-to-target worker movement plan.
          content: { application/json: { schema: { $ref: '#/components/schemas/CabinFurnitureMovementPlan' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/cabin-facets:
    get:
      operationId: readPresentationCabinFacets
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Returns facet values from
        FREE cabins that are not order-reserved, operation-leased, or held by another presentation.
        Supplying holdScopeId retains the requesting inquiry's current holds; this read does not
        create a hold.
      parameters:
        - { $ref: '#/components/parameters/WarehouseIdQuery' }
        - name: holdScopeId
          in: query
          required: false
          description: Inquiry ID whose current presentation holds remain visible in the facets.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Available cabin facet values for the warehouse.
          content: { application/json: { schema: { $ref: '#/components/schemas/CabinFacetResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/logistics/cabin-searches:
    post:
      operationId: searchPresentationCabins
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Matches currently
        available rentable cabins for each requested group and creates or renews this inquiry's
        short-lived holds; a cabin is returned at most once across the groups in a response.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CabinSearchRequest' } } }
      responses:
        '200':
          description: Available cabin matches, grouped in request order.
          content: { application/json: { schema: { $ref: '#/components/schemas/CabinSearchResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/logistics/cabin-availability:
    post:
      operationId: checkPresentationCabinAvailability
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Rechecks each selected
        cabin and returns an explicit per-cabin availability reason without changing state.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CabinAvailabilityRequest' } } }
      responses:
        '200':
          description: Per-cabin availability for the requested warehouse.
          content: { application/json: { schema: { $ref: '#/components/schemas/CabinAvailabilityResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/logistics/cabin-snapshots:
    post:
      operationId: readPresentationCabinSnapshots
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Reads the current cabin
        snapshots for a selected warehouse; all requested cabin IDs must still belong to it.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CabinAvailabilityRequest' } } }
      responses:
        '200':
          description: Current cabin snapshots in the request ID order.
          content: { application/json: { schema: { $ref: '#/components/schemas/CabinSnapshotsResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/asset/v1/logistics/presentations/{presentationId}/holds:
    parameters: [ { $ref: '#/components/parameters/PresentationId' } ]
    get:
      operationId: readPresentationHolds
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Expires due holds before
        returning this presentation's remaining active cabin holds; an unknown or empty presentation
        returns an empty holds list.
      responses:
        '200':
          description: Active presentation holds and their latest expiry, if any.
          content: { application/json: { schema: { $ref: '#/components/schemas/ReplacePresentationHoldsResponse' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: replacePresentationHolds
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Atomically replaces the
        presentation's active cabin selection. expiresAt must be in the future and no more than 24
        hours away; retries use the same actor-bound idempotency key.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReplacePresentationHoldsRequest' } } }
      responses:
        '200':
          description: Active holds after replacement or the original actor-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ReplacePresentationHoldsResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/presentations/{presentationId}/holds/release:
    parameters:
      - { $ref: '#/components/parameters/PresentationId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: releasePresentationHolds
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Releases every active hold
        for the presentation and is idempotent even when no active holds remain.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ActorInput' } } }
      responses:
        '200':
          description: Empty active-holds result after release or the original actor-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ReplacePresentationHoldsResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/presentations/{presentationId}/holds/convert:
    parameters:
      - { $ref: '#/components/parameters/PresentationId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: convertPresentationHolds
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Atomically converts the
        selected live presentation holds into active order-unit reservations and releases the other
        current holds; retries use the same actor-bound idempotency key.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConvertPresentationHoldsRequest' } } }
      responses:
        '200':
          description: Converted order-unit reservations and released cabin IDs, or the original replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ConvertPresentationHoldsResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/inventory/captures:
    post:
      operationId: createInventoryAssetCapture
      description: >-
        Requires SERVICE inventory-service with exactly asset.inventory. Freezes one deterministic
        eligible warehouse population for 30 non-sliding minutes. A later technical attempt under
        the same operation is accepted only after the prior attempt expires.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryCaptureRequest' } } } }
      responses:
        '201': { description: Stable capture created or recovered., content: { application/json: { schema: { $ref: '#/components/schemas/InventoryCapture' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/inventory/assets/{assetId}:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: readCurrentInventoryAssetSnapshot
      description: >-
        Requires SERVICE inventory-service with exactly asset.inventory. Reads one authoritative
        current inventory-safe asset snapshot, including its current tenant and cabin contents;
        local general comments and manual notes are never exposed.
      responses:
        '200': { description: Current inventory-safe asset snapshot., content: { application/json: { schema: { $ref: '#/components/schemas/InventoryAssetCurrentSnapshot' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/asset/v1/inventory/captures/{captureId}/members:
    parameters:
      - { name: captureId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: readInventoryAssetCapturePage
      description: Reads only the immutable capture; page reads never extend its expiry.
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        '200': { description: Stable capture page., content: { application/json: { schema: { $ref: '#/components/schemas/InventoryCapturePage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/inventory/captures/{captureId}:
    parameters:
      - { name: captureId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: releaseInventoryAssetCapture
      description: Idempotently releases copied or losing technical capture state immediately.
      responses:
        '204': { description: Capture released or already terminal. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/asset/v1/inventory/number-resolutions:
    post:
      operationId: resolveInventoryRentalNumber
      description: Warehouse-scoped identity lookup. It never resolves a same-number cabin from another warehouse.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryNumberResolutionRequest' } } } }
      responses:
        '200': { description: Warehouse-scoped resolution including explicit absence., content: { application/json: { schema: { $ref: '#/components/schemas/InventoryNumberResolution' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/inventory/validations:
    post:
      operationId: validateInventoryAssets
      description: Point-in-time read snapshot only; it creates no validation token, lease or fence.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryValidationRequest' } } } }
      responses:
        '200': { description: Deterministically ordered validation snapshot and digest., content: { application/json: { schema: { $ref: '#/components/schemas/InventoryValidation' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/inventory/source-assets:
    post:
      operationId: createInventorySourceAsset
      description: >-
        Atomically creates one FREE asset and its normal rental-item fact. Permanent source identity
        inventoryId:findingId replays beyond ordinary idempotency retention; changed payload conflicts.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventorySourceAssetRequest' } } } }
      responses:
        '200':
          description: Permanent replay.
          headers:
            Idempotency-Replayed: { required: true, schema: { type: string, enum: ['true'] } }
          content: { application/json: { schema: { $ref: '#/components/schemas/InventorySourceAsset' } } }
        '201': { description: Source asset created., content: { application/json: { schema: { $ref: '#/components/schemas/InventorySourceAsset' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerJwt: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    RentalItemId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    EquipmentId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    EquipmentIdPath: { name: equipmentId, in: path, required: true, schema: { type: string, format: uuid } }
    ClassifierId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    HoldId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    LeaseId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    HtmlImportId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    WarehouseIdQuery: { name: warehouseId, in: query, required: true, schema: { type: string, format: uuid } }
    PresentationId: { name: presentationId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
  responses:
    RentalItemCreated:
      description: Created item or original successful replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } }
