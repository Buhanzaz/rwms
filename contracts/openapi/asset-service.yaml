      type: object
      additionalProperties: false
      required:
        - id
        - version
        - rentalItemId
        - warehouseId
        - state
        - expectedPhotoCount
        - mediaFolderId
        - mediaCommandId
        - photoManifestSha256
        - photoManifest
        - coverMediaId
        - mediaProofSha256
        - createdAt
        - completedAt
        - abandonedAt
      properties:
        id: { type: string, format: uuid }
        version: { $ref: '#/components/schemas/ExpectedVersion' }
        rentalItemId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/RentalItemCreationIntentState' }
        expectedPhotoCount: { type: integer, minimum: 1, maximum: 20 }
        mediaFolderId:
          type: string
          format: uuid
          description: Unique media-owned CABIN gallery folder reserved for this intent.
        mediaCommandId:
          type: string
          format: uuid
          description: Stable command namespace for resumable uploads belonging to this intent.
        photoManifestSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Canonical SHA-256 of the ordered durable manifest including command identities.
        photoManifest:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/RentalItemCreationPhotoManifestEntry' }
        coverMediaId: { $ref: '#/components/schemas/NullableUuid' }
        mediaProofSha256:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        abandonedAt: { type: [string, 'null'], format: date-time }
