openapi: 3.1.0
info:
  title: RWMS Asset Service API
  version: 1.1.0
  description: >-
    Stage 5 canonical asset boundary. Rental-item comments and manual-note text
    are readable only through this HTTP API and are never Kafka facts. New
    production databases start empty; browser fixtures and legacy rows are not
    an import source.
servers:
  - url: /
security:
  - bearerJwt: []
paths:
  /api/asset/v1/rental-items:
    get:
      operationId: listRentalItems
      description: Requires USER rwms.read and warehouse VIEW access.
      parameters:
        - $ref: '#/components/parameters/WarehouseIdQuery'
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: search, in: query, schema: { type: string, maxLength: 128 } }
      responses:
        '200': { description: Page of canonical rental items, content: { application/json: { schema: { $ref: '#/components/schemas/RentalItemPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createRentalItem
      description: Requires USER rwms.write and warehouse EDIT access. Number is globally unique, normalized, and never reusable.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateRentalItemRequest' } } }
      responses:
        '201': { $ref: '#/components/responses/RentalItemCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
  /api/asset/v1/rental-items/{id}:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    get:
      operationId: getRentalItem
      description: Requires USER rwms.read and the item's warehouse VIEW access.
      responses:
        '200': { description: Canonical rental-item passport, status, editable general comment and contents., content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/asset/v1/rental-items/{id}/passport:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    put:
      operationId: updateRentalItemPassport
      description: Requires USER rwms.write and warehouse EDIT access. expectedVersion is mandatory.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePassportRequest' } } } }
      responses:
        '200': { description: Updated rental item., content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/rental-items/{id}/status:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    put:
      operationId: updateRentalItemStatus
      description: Public manual status changes cannot set IN_TRANSFER or WRITTEN_OFF and require expectedVersion.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateStatusRequest' } } } }
      responses:
        '200': { description: Updated rental item., content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/rental-items/{id}/warehouse:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    put:
      operationId: updateRentalItemWarehouse
      description: Requires EDIT access to both source and target warehouse, an active target warehouse registry response, and no equipment contents; move contents through the equipment transfer command first.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateWarehouseRequest' } } } }
      responses:
        '200': { description: Updated rental item., content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
  /api/asset/v1/rental-items/{id}/general-comment:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    put:
      operationId: updateRentalItemGeneralComment
      description: The general comment is editable service-local data and does not enter Kafka or DLT.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateGeneralCommentRequest' } } } }
      responses:
        '200': { description: Updated rental item., content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/rental-items/{id}/manual-notes:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    get:
      operationId: listRentalItemManualNotes
      description: Append-only service-local notes. Requires VIEW access and is never a Kafka read model.
      responses:
        '200': { description: Notes ordered by creation time., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ManualNote' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addRentalItemManualNote
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddManualNoteRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/ManualNoteCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/equipment:
    get:
      operationId: listWarehouseEquipment
      description: Returns global catalog items with warehouse ledger totals. total = stock + non-rented cabin + rented cabin + written-off + lost; active holds only reduce availableStock.
      parameters: [ { $ref: '#/components/parameters/WarehouseIdQuery' } ]
      responses:
        '200': { description: Equipment and balance summaries., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EquipmentWarehouse' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/asset/v1/equipment/catalog:
    get:
      operationId: listEquipmentCatalog
      description: Requires USER rwms.read. Catalog writes are global-admin only.
      responses:
        '200': { description: Global catalog., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Equipment' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createEquipmentCatalogItem
      description: Requires SYSTEM_ADMIN or WMS_ADMIN plus rwms.write.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateEquipmentRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/EquipmentCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/equipment/catalog/{id}:
    parameters: [ { $ref: '#/components/parameters/EquipmentId' } ]
    get:
      operationId: getEquipmentCatalogItem
      responses:
        '200': { description: Catalog item., content: { application/json: { schema: { $ref: '#/components/schemas/Equipment' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateEquipmentCatalogItem
      description: Global-admin write; expectedVersion is mandatory.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateEquipmentRequest' } } } }
      responses:
        '200': { description: Updated catalog item., content: { application/json: { schema: { $ref: '#/components/schemas/Equipment' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/equipment/{equipmentId}/totals:
    parameters:
      - $ref: '#/components/parameters/EquipmentIdPath'
      - $ref: '#/components/parameters/WarehouseIdQuery'
    get:
      operationId: getEquipmentTotals
      responses:
        '200': { description: Immutable-ledger balance view., content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentTotals' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/asset/v1/equipment/transfers:
    post:
      operationId: transferEquipment
      description: One local PostgreSQL transaction changes both balance streams and immutable movement ledger lines. Requires MANAGE in both warehouses.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransferEquipmentRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/MovementCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
  /api/asset/v1/equipment/dispositions:
    get:
      operationId: listEquipmentDispositions
      parameters: [ { $ref: '#/components/parameters/WarehouseIdQuery' } ]
      responses:
        '200': { description: Written-off and lost movements., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EquipmentDisposition' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: disposeEquipment
      description: Moves equipment to written-off or lost ledger bucket. Requires MANAGE and expected source balance version.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DispositionEquipmentRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/MovementCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/classifiers:
    get:
      operationId: listAssetClassifiers
      parameters: [ { name: type, in: query, schema: { type: string, enum: [CATEGORY, SUBCATEGORY, TYPE, CONDITION] } } ]
      responses:
        '200': { description: Global classifier list., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Classifier' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAssetClassifier
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateClassifierRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/ClassifierCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/classifiers/{id}:
    parameters: [ { $ref: '#/components/parameters/ClassifierId' } ]
    put:
      operationId: updateAssetClassifier
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClassifierRequest' } } } }
      responses:
        '200': { description: Updated classifier., content: { application/json: { schema: { $ref: '#/components/schemas/Classifier' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/equipment-holds:
    post:
      operationId: acquireEquipmentHold
      description: Private only. Requires SERVICE principal with exactly asset.internal; renewable hold TTL is 15 minutes by default.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AcquireEquipmentHoldRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/EquipmentHoldCreated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/equipment-holds/{id}/renew:
    parameters: [ { $ref: '#/components/parameters/HoldId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: renewEquipmentHold
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExpectedVersionRequest' } } } }
      responses:
        '200': { description: Renewed hold., content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentHold' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/equipment-holds/{id}/release:
    parameters: [ { $ref: '#/components/parameters/HoldId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: releaseEquipmentHold
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExpectedVersionRequest' } } } }
      responses:
        '200': { description: Released hold., content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentHold' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/equipment-holds/{id}/commit:
    parameters: [ { $ref: '#/components/parameters/HoldId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: commitEquipmentHold
      description: >-
        Commits an active physical-stock hold without inferring a logistics movement. A committed hold
        continues to reduce available stock until a compensating release is accepted.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExpectedVersionRequest' } } } }
      responses:
        '200': { description: Committed hold., content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentHold' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/operation-leases:
    post:
      operationId: acquireOperationLease
      description: Private only. Fencing tokens prevent stale status commands; lease TTL is 15 minutes by default.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AcquireOperationLeaseRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/OperationLeaseCreated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/operation-leases/{id}/renew:
    parameters: [ { $ref: '#/components/parameters/LeaseId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: renewOperationLease
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RenewOperationLeaseRequest' } } } }
      responses:
        '200': { description: Renewed lease., content: { application/json: { schema: { $ref: '#/components/schemas/OperationLease' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/operation-leases/{id}/release:
    parameters: [ { $ref: '#/components/parameters/LeaseId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: releaseOperationLease
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseOperationLeaseRequest' } } } }
      responses:
        '200': { description: Released lease., content: { application/json: { schema: { $ref: '#/components/schemas/OperationLease' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/rental-items/{id}/fenced-status:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    put:
      operationId: updateFencedRentalItemStatus
      description: Private status command rejected unless lease ID and fencing token match the active lease.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FencedStatusRequest' } } } }
      responses:
        '200': { description: Updated rental item., content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/operation-leases:
    post:
      operationId: acquireMaintenanceOperationLease
      description: >-
        Requires SERVICE principal maintenance-service with exactly asset.maintenance. The owner is
        restricted to MAINTENANCE_ESTIMATE:<UUID> or MAINTENANCE_REPAIR:<root-repair UUID>.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AcquireMaintenanceOperationLeaseRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/OperationLeaseCreated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/operation-leases/{id}/renew:
    parameters: [ { $ref: '#/components/parameters/LeaseId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: renewMaintenanceOperationLease
      description: Rechecks the exact maintenance owner, expected lease version and active fencing token.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RenewMaintenanceOperationLeaseRequest' } } } }
      responses:
        '200': { description: Renewed lease or original subject-bound replay., content: { application/json: { schema: { $ref: '#/components/schemas/OperationLease' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/operation-leases/{id}/release:
    parameters: [ { $ref: '#/components/parameters/LeaseId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: releaseMaintenanceOperationLease
      description: Rechecks the exact maintenance owner and returns the original response for an identical replay.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseMaintenanceOperationLeaseRequest' } } } }
      responses:
        '200': { description: Released lease or original subject-bound replay., content: { application/json: { schema: { $ref: '#/components/schemas/OperationLease' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/rental-items/{id}/fenced-status:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: updateMaintenanceFencedRentalItemStatus
      description: >-
        Requires the exact maintenance client/scope, matching active lease owner and fence. The request
        exposes only approved maintenance actions; asset derives and validates the source/target status.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceFencedStatusRequest' } } } }
      responses:
        '200':
          description: Updated rental item or original subject-bound replay while the fence remains active.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerJwt: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    RentalItemId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    EquipmentId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    EquipmentIdPath: { name: equipmentId, in: path, required: true, schema: { type: string, format: uuid } }
    ClassifierId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    HoldId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    LeaseId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    WarehouseIdQuery: { name: warehouseId, in: query, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
  responses:
    RentalItemCreated:
      description: Created item or original successful replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } }
    ManualNoteCreated:
      description: Appended service-local note or replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ManualNote' } } }
    EquipmentCreated:
      description: Created catalog item or replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Equipment' } } }
    MovementCreated:
      description: Committed ledger movement or replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Movement' } } }
    ClassifierCreated:
      description: Created classifier or replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Classifier' } } }
    EquipmentHoldCreated:
      description: Hold acquired or replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentHold' } } }
    OperationLeaseCreated:
      description: Lease acquired or replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/OperationLease' } } }
    BadRequest: { description: Invalid request., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unauthorized: { description: Missing or invalid token., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Forbidden: { description: Insufficient USER or exact service credential., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NotFound: { description: Canonical asset not found., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Conflict: { description: Unified expected-version, idempotency, invariant or fencing conflict., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    DependencyFailure: { description: Required private warehouse registry is unavailable or rejects the request., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  schemas:
