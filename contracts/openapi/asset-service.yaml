      type: object
      additionalProperties: false
      required: [photoIndex, uploadCommandId, checksumSha256, contentType, contentLength]
      properties:
        photoIndex: { type: integer, minimum: 0, maximum: 19 }
        uploadCommandId:
          type: string
          format: uuid
          description: Stable Idempotency-Key for creating this exact media upload session.
        checksumSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        contentLength: { type: integer, format: int64, minimum: 1 }
