        estimateId:
          $ref: '#/components/schemas/NullableUuid'
          description: Must equal ownerId whenever furnitureLosses is non-empty.
        furnitureLosses:
          type: array
          description: >-
            Empty for direct repairs. Non-empty only for QUEUE_FOR_REPAIR under a
            MAINTENANCE_ESTIMATE lease owned by estimateId.
          items: { $ref: '#/components/schemas/MaintenanceFurnitureLoss' }
