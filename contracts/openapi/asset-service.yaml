      required: [id, version, name, category, active, createdAt, updatedAt]
      properties: { id: { type: string, format: uuid }, version: { $ref: '#/components/schemas/ExpectedVersion' }, name: { type: string }, category: { $ref: '#/components/schemas/EquipmentCategory' }, active: { type: boolean }, comment: { type: [string, 'null'] }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    EquipmentBalance:
      type: object
