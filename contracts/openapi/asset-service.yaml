      additionalProperties: false
      required: [warehouseId, rentalItemIds, expiresAt, actorSubjectId, actorRole]
      properties:
        warehouseId: { type: string, format: uuid }
        rentalItemIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        expiresAt:
          type: string
          format: date-time
          description: Must be strictly in the future and no more than 24 hours from processing time.
