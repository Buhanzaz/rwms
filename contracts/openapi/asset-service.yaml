        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
  /api/internal/asset/v1/logistics/equipment-availability:
    get:
      operationId: readLogisticsEquipmentAvailability
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Returns the shared
        asset-owned warehouse availability and nullable per-cabin maximum for every equipment item.
        Availability subtracts only the unfulfilled portion of active order reservations; furniture
