  /api/asset/v1/equipment/transfers:
    post:
      operationId: transferEquipmentWithinWarehouse
      description: >-
        Moves equipment only between two distinct STOCK or CABIN locations in the same warehouse.
        sourceWarehouseId and targetWarehouseId must be identical. A physical inter-warehouse
        movement is logistics-owned and must use a logistics document; it is never an asset
        transfer or an administrative correction.
