    parameters: [ { $ref: '#/components/parameters/LeaseId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: releaseLogisticsOperationLease
      description: Rechecks the exact typed document-line owner before releasing the opaque lease.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsLeaseCommandRequest' } } } }
      responses:
        '200':
          description: Released lease, matching already terminal lease (RELEASED or EXPIRED), or original subject-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsOperationLease' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/rental-items/{id}/effects:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: applyLogisticsRentalItemEffect
      description: >-
        A closed action allowlist validates the matching active typed lease, asset version and
        permissible canonical return, shipment or transfer transition. Only transfer arrival may
        move warehouse; attached cabin contents move through asset-owned ledger rows atomically.
        TRANSFER_DEPART and TRANSFER_ARRIVE require transferAssetStatus FREE or REPAIR. Departure
        persists this canonical restoration status and arrival rejects a mismatch instead of
        applying a fallback. CAPITAL_REPAIR departs with REPAIR and is temporarily restored to
        REPAIR so maintenance can reapply its calculated capital status after arrival.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsFencedEffectRequest' } } } }
      responses:
        '200':
          description: Canonical effect applied or original replay while the active fence remains valid.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsRentalItemSnapshot' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
        '503': { $ref: '#/components/responses/DependencyFailure' }
  /api/internal/asset/v1/logistics/equipment-holds:
    post:
