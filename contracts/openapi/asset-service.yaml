      type: object
      additionalProperties: false
      required: [types, categories]
      properties:
        types: { type: array, items: { $ref: '#/components/schemas/CabinPricingCatalogValue' } }
        categories: { type: array, items: { $ref: '#/components/schemas/CabinPricingCatalogValue' } }
