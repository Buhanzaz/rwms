      additionalProperties: false
      required: [orderId, warehouseId, selectedRentalItemIds, clientId, tenantSnapshot, actorSubjectId, actorRole]
      properties:
        orderId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        selectedRentalItemIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        clientId: { type: string, format: uuid }
        tenantSnapshot: { type: string, minLength: 1, maxLength: 512 }
        actorSubjectId: { type: string, format: uuid }
        actorRole: { $ref: '#/components/schemas/OrderActorRole' }
        units:
          description: >-
            Nullable only for legacy conversion. When present, this is the authoritative
