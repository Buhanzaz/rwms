        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
  /api/asset/v1/administrative-corrections:
    post:
      operationId: createAdministrativeAssetCorrection
      description: >-
        SYSTEM_ADMIN or WMS_ADMIN only, with warehouse MANAGE in both warehouses. This is not a
        physical movement command: it corrects an erroneous recorded location only when the asset
        did not move. A cabin correction atomically changes the cabin and every cabin-content
        balance. Active rental, repair, transport, reservation, hold or operation lease rejects the
        command. A physically completed undocumented move must instead be represented by a
        retrospective logistics document. The reason, evidence link, request fingerprint and
        resulting immutable correction event are retained permanently.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateAdministrativeAssetCorrectionRequest' } } } }
      responses:
        '200': { description: Original subject-bound replay., content: { application/json: { schema: { $ref: '#/components/schemas/AdministrativeAssetCorrection' } } } }
        '201': { description: Applied immutable correction., content: { application/json: { schema: { $ref: '#/components/schemas/AdministrativeAssetCorrection' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
  /api/asset/v1/operations/outbox/{eventId}/requeue:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: requeueAssetOutboxEvent
      description: >-
        SYSTEM_ADMIN or WMS_ADMIN recovery for a terminal DLT/QUARANTINED outbox head. Requires
        USER rwms.write. expectedReviewVersion fences concurrent reviews; the mandatory reason is
        stored only in an immutable audit record. The original event ID, aggregate ordering key,
        envelope and sanitized payload are preserved after schema preflight. A non-head event can
        never bypass an earlier aggregate event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetOutboxRequeueRequest' }
      responses:
        '200':
          description: Reviewed event returned to PENDING without changing its envelope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetOutboxRequeueResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/classifiers:
    get:
