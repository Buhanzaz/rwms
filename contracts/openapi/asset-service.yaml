        actorRole: { $ref: '#/components/schemas/OrderActorRole' }
        sourceHoldScopeId:
          type: [string, 'null']
          format: uuid
          description: >-
            Optional manager-owned manual draft scope. Selected live holds are
            transferred to presentationId and the remaining source holds are released.
