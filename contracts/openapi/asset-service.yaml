        dimensions: { type: [string, 'null'], maxLength: 255 }
        category:
          type: [string, 'null']
          maxLength: 255
          description: Exact optional category facet such as ИТР, Обычная or Новая; null matches all.
        characteristics:
          type: [string, 'null']
          maxLength: 2000
          description: >-
            Optional case-insensitive normalized substring of stored cabin characteristics; null or
            blank matches all.
        linoleum:
          type: [boolean, 'null']
          description: Optional exact linoleum filter; null matches all.
        quantity: { type: integer, format: int32, minimum: 1, maximum: 30 }
    CabinSearchRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, holdScopeId, expiresAt, actorSubjectId, actorRole, groups]
      properties:
        warehouseId: { type: string, format: uuid }
        holdScopeId:
          type: string
          format: uuid
          description: Rental inquiry ID that owns the short-lived chat selection.
        expiresAt:
          type: string
          format: date-time
          description: Configurable short chat-selection expiry, no more than 24 hours in the future.
        actorSubjectId: { type: string, format: uuid }
        actorRole: { $ref: '#/components/schemas/OrderActorRole' }
        groups:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/CabinSearchGroup' }
        resultMode:
          type: [string, 'null']
          enum: [APPEND, REPLACE, null]
          default: REPLACE
          description: >-
            Missing or null is replacement-safe REPLACE. APPEND is honored only when explicitly
            supplied by the caller.
