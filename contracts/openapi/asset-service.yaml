openapi: 3.1.0
info:
  title: RWMS Asset Service API
  version: 1.9.0
  description: >-
    Stage 5 canonical asset boundary plus narrow Stage 7 inventory-service and
    Stage 8 logistics-service private surfaces. Rental-item comments and
    manual-note text are readable only through this HTTP API and are never
    Kafka facts. New production databases start empty; browser fixtures and
    legacy browser state is never imported automatically. An administrator may
    explicitly review and commit a bounded server-parsed HTML registry export.
servers:
  - url: /
security:
  - bearerJwt: []
paths:
  /api/asset/v1/rental-items:
    get:
      operationId: listRentalItems
      description: Requires USER rwms.read and warehouse VIEW access.
      parameters:
        - $ref: '#/components/parameters/WarehouseIdQuery'
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: search, in: query, schema: { type: string, maxLength: 128 } }
        - name: excludeStatus
          in: query
          description: Rental-item statuses omitted before pagination.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/RentalItemStatus' }
      responses:
        '200': { description: Page of canonical rental items, content: { application/json: { schema: { $ref: '#/components/schemas/RentalItemPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createRentalItem
      description: Requires USER rwms.write and warehouse EDIT access. Number is unique inside its warehouse, normalized, and never reusable there.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateRentalItemRequest' } } }
      responses:
        '201': { $ref: '#/components/responses/RentalItemCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
  /api/asset/v1/rental-items/creation-options:
    get:
      operationId: getRentalItemCreationOptions
      description: >-
        Returns the active UUID-backed cabin passport choices and allowed type-to-dimension
        pairs used by rental-item and inventory creation forms. Requires USER rwms.read and
        warehouse VIEW access.
      parameters: [ { $ref: '#/components/parameters/WarehouseIdQuery' } ]
      responses:
        '200':
          description: Canonical rental-item creation choices.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalItemCreationOptions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/asset/v1/html-imports:
    get:
      operationId: listRentalItemHtmlImports
      description: Requires USER rwms.write and warehouse EDIT access.
      parameters: [ { $ref: '#/components/parameters/WarehouseIdQuery' } ]
      responses:
        '200':
          description: Durable import drafts for the selected warehouse.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HtmlImportSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createRentalItemHtmlImport
      description: >-
        Parses one bounded HTML registry export without evaluating scripts or
        retaining raw HTML. Requires USER rwms.write and warehouse EDIT access.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [warehouseId, html]
              properties:
                warehouseId: { type: string, format: uuid }
                html: { type: string, format: binary }
      responses:
        '201':
          description: Durable parsed review draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HtmlImportDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
  /api/asset/v1/html-imports/{id}:
    parameters: [ { $ref: '#/components/parameters/HtmlImportId' } ]
    get:
      operationId: getRentalItemHtmlImport
      description: Requires USER rwms.write and warehouse EDIT access.
      responses:
        '200':
          description: Current durable import draft and plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HtmlImportDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: cancelRentalItemHtmlImport
      description: >-
        Deletes an uncommitted HTML import draft and its normalized source
        rows. Cabins and media are not changed. Requires USER rwms.write and
        warehouse EDIT access.
      parameters:
        - name: expectedVersion
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ExpectedVersion' }
      responses:
        '204':
          description: Draft cancelled.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/html-imports/{id}/rows:
    parameters: [ { $ref: '#/components/parameters/HtmlImportId' } ]
    get:
      operationId: listRentalItemHtmlImportRows
      description: Requires USER rwms.write and warehouse EDIT access.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200':
          description: Paged normalized source rows; public photo keys are not exposed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HtmlImportRowPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/asset/v1/html-imports/{id}/plan:
    parameters: [ { $ref: '#/components/parameters/HtmlImportId' } ]
    put:
      operationId: updateRentalItemHtmlImportPlan
      description: Saves catalog, equipment, status, row and merge decisions with optimistic concurrency.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateHtmlImportPlanRequest' }
      responses:
        '200':
          description: Re-evaluated durable import draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HtmlImportDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/html-imports/{id}/commit:
    parameters:
      - { $ref: '#/components/parameters/HtmlImportId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: commitRentalItemHtmlImport
      description: >-
        Atomically creates or merges selected cabins and staged catalogs. Only
        WMS_ADMIN or SYSTEM_ADMIN with warehouse access may commit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommitHtmlImportRequest' }
      responses:
        '202':
          description: Asset phase committed; media phase is durable and retryable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HtmlImportDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/DependencyFailure' }
        '503': { $ref: '#/components/responses/DependencyFailure' }
  /api/asset/v1/html-imports/{id}/retry-media:
    parameters:
      - { $ref: '#/components/parameters/HtmlImportId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: retryRentalItemHtmlImportMedia
      description: Retries only the media phase after the asset transaction has committed, with optimistic concurrency.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetryHtmlImportMediaRequest' }
      responses:
        '202':
          description: Current durable media phase.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HtmlImportDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/DependencyFailure' }
        '503': { $ref: '#/components/responses/DependencyFailure' }
  /api/asset/v1/html-imports/{id}/replace-media:
    parameters:
      - { $ref: '#/components/parameters/HtmlImportId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: replaceRentalItemHtmlImportMedia
      description: >-
        Replaces one or more write-only Yandex.Disk links after a failed media
        preflight and restarts only that media phase. The response and row list
        expose cabin numbers and link presence, never an existing public link.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceHtmlImportMediaRequest' }
      responses:
        '202':
          description: Corrected media sources are queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HtmlImportDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/DependencyFailure' }
        '503': { $ref: '#/components/responses/DependencyFailure' }
  /api/asset/v1/html-imports/{id}/skip-media:
    parameters:
      - { $ref: '#/components/parameters/HtmlImportId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: skipRentalItemHtmlImportMedia
      description: >-
        Finishes a terminal failed media phase with warnings; committed cabins
        remain unchanged and no media job is resumed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkipHtmlImportMediaRequest' }
      responses:
        '202':
          description: Media phase is explicitly skipped and the import is completed with warnings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HtmlImportDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/cabin-settings:
    get:
      operationId: getCabinSettings
      description: >-
        Returns all operator-managed cabin types, dimensions, finishings, characteristics and
        type-to-dimension links. Requires global catalog read permission.
      responses:
        '200':
          description: UUID-backed cabin composition settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CabinSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/asset/v1/cabin-settings/items:
    post:
      operationId: createCabinSettingsItem
      description: >-
        Creates one UUID-backed type, dimension, finishing or characteristic. Requires global
        catalog management and an Idempotency-Key.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCabinCatalogItemRequest' }
      responses:
        '201':
          description: Created cabin setting or the original idempotent replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CabinCatalogItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/cabin-settings/items/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    put:
      operationId: updateCabinSettingsItem
      description: Renames or activates/deactivates one cabin setting with optimistic concurrency.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCabinCatalogItemRequest' }
      responses:
        '200':
          description: Updated cabin setting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CabinCatalogItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteCabinSettingsItem
      description: >-
        Deletes a cabin setting only when no existing cabin or type-to-dimension relation refers to
        it. Requires global catalog management and the item's current version.
      parameters:
        - name: expectedVersion
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ExpectedVersion' }
      responses:
        '204': { description: Deleted cabin setting. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/cabin-settings/types/{typeId}/dimensions:
    parameters: [ { name: typeId, in: path, required: true, schema: { type: string, format: uuid } } ]
    put:
      operationId: replaceCabinTypeDimensions
      description: >-
        Replaces the ordered set of dimensions allowed for one cabin type. Requires global catalog
        management and the type's current version. An empty set is accepted only when the type has
        no existing cabins.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceCabinTypeDimensionsRequest' }
      responses:
        '200':
          description: Full settings after the link replacement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CabinSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/rental-items/{id}:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    get:
      operationId: getRentalItem
      description: Requires USER rwms.read and the item's warehouse VIEW access.
      responses:
        '200': { description: Canonical rental-item passport, status, editable general comment and contents., content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/asset/v1/rental-items/{id}/passport:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    put:
      operationId: updateRentalItemPassport
      description: Requires USER rwms.write and warehouse EDIT access. expectedVersion is mandatory.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePassportRequest' } } } }
      responses:
        '200': { description: Updated rental item., content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/rental-items/{id}/status:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    put:
      operationId: updateRentalItemStatus
      description: Public manual status changes cannot set IN_TRANSFER or WRITTEN_OFF and require expectedVersion.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateStatusRequest' } } } }
      responses:
        '200': { description: Updated rental item., content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/rental-items/{id}/warehouse:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    put:
      operationId: updateRentalItemWarehouse
      description: Requires EDIT access to both source and target warehouse, an active target warehouse registry response, and no equipment contents; move contents through the equipment transfer command first.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateWarehouseRequest' } } } }
      responses:
        '200': { description: Updated rental item., content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
  /api/asset/v1/rental-items/{id}/general-comment:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    put:
      operationId: updateRentalItemGeneralComment
      description: The general comment is editable service-local data and does not enter Kafka or DLT.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateGeneralCommentRequest' } } } }
      responses:
        '200': { description: Updated rental item., content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/rental-items/{id}/manual-notes:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    get:
      operationId: listRentalItemManualNotes
      description: Append-only service-local notes. Requires VIEW access and is never a Kafka read model.
      responses:
        '200': { description: Notes ordered by creation time., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ManualNote' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addRentalItemManualNote
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddManualNoteRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/ManualNoteCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/equipment:
    get:
      operationId: listWarehouseEquipment
      description: Returns global catalog items with warehouse ledger totals. total = stock + non-rented cabin + rented cabin + written-off + lost. reservedQuantity is the active order-wide reservation; availableQuantity is stock plus non-rented cabins after physical holds and all active order reservations.
      parameters: [ { $ref: '#/components/parameters/WarehouseIdQuery' } ]
      responses:
        '200': { description: Equipment and balance summaries., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EquipmentWarehouse' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/asset/v1/equipment/catalog:
    get:
      operationId: listEquipmentCatalog
      description: Requires USER rwms.read. Catalog writes are global-admin only.
      responses:
        '200': { description: Global catalog., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Equipment' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createEquipmentCatalogItem
      description: Requires SYSTEM_ADMIN or WMS_ADMIN plus rwms.write.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateEquipmentRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/EquipmentCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/equipment/catalog/{id}:
    parameters: [ { $ref: '#/components/parameters/EquipmentId' } ]
    get:
      operationId: getEquipmentCatalogItem
      responses:
        '200': { description: Catalog item., content: { application/json: { schema: { $ref: '#/components/schemas/Equipment' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateEquipmentCatalogItem
      description: Global-admin write; expectedVersion is mandatory.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateEquipmentRequest' } } } }
      responses:
        '200': { description: Updated catalog item., content: { application/json: { schema: { $ref: '#/components/schemas/Equipment' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/equipment/{equipmentId}/totals:
    parameters:
      - $ref: '#/components/parameters/EquipmentIdPath'
      - $ref: '#/components/parameters/WarehouseIdQuery'
    get:
      operationId: getEquipmentTotals
      responses:
        '200': { description: Immutable-ledger balance view., content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentTotals' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/asset/v1/equipment/transfers:
    post:
      operationId: transferEquipment
      description: One local PostgreSQL transaction changes both balance streams and immutable movement ledger lines. Requires MANAGE in both warehouses.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransferEquipmentRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/MovementCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
  /api/asset/v1/equipment/dispositions:
    get:
      operationId: listEquipmentDispositions
