      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePassportRequest' } } } }
      responses:
        '200': { description: Updated rental item., content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/rental-items/{id}/status:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    put:
      operationId: updateRentalItemStatus
      description: >-
        Manual correction only. Both the current and requested status must belong to the closed
        non-workflow set SALE, USED_SALE, FREE, WAREHOUSE or OWN_NEEDS. Rental, reservation,
        repair, transfer, write-off and loss states are changed only by their owning workflows.
        Requires USER rwms.write, warehouse EDIT and expectedVersion.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateStatusRequest' } } } }
      responses:
        '200': { description: Updated rental item., content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/rental-items/{id}/general-comment:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    put:
      operationId: updateRentalItemGeneralComment
      description: The general comment is editable service-local data and does not enter Kafka or DLT.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateGeneralCommentRequest' } } } }
      responses:
        '200': { description: Updated rental item., content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/rental-items/{id}/manual-notes:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    get:
      operationId: listRentalItemManualNotes
      description: Append-only service-local notes. Requires VIEW access and is never a Kafka read model.
      responses:
        '200': { description: Notes ordered by creation time., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ManualNote' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addRentalItemManualNote
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddManualNoteRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/ManualNoteCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/equipment:
    get:
      operationId: listWarehouseEquipment
      description: Returns global catalog items with warehouse ledger totals. total = stock + non-rented cabin + rented cabin + written-off + lost. reservedQuantity is the active order-wide reservation; availableQuantity is stock plus non-rented cabins after physical holds and all active order reservations.
      parameters: [ { $ref: '#/components/parameters/WarehouseIdQuery' } ]
      responses:
        '200': { description: Equipment and balance summaries., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EquipmentWarehouse' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/asset/v1/equipment/catalog:
    get:
      operationId: listEquipmentCatalog
      description: Requires USER rwms.read. Catalog writes are global-admin only.
      responses:
        '200': { description: Global catalog., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Equipment' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createEquipmentCatalogItem
      description: Requires SYSTEM_ADMIN or WMS_ADMIN plus rwms.write.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateEquipmentRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/EquipmentCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/equipment/catalog/{id}:
    parameters: [ { $ref: '#/components/parameters/EquipmentId' } ]
    get:
      operationId: getEquipmentCatalogItem
      responses:
        '200': { description: Catalog item., content: { application/json: { schema: { $ref: '#/components/schemas/Equipment' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateEquipmentCatalogItem
      description: Global-admin write; expectedVersion is mandatory.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateEquipmentRequest' } } } }
      responses:
        '200': { description: Updated catalog item., content: { application/json: { schema: { $ref: '#/components/schemas/Equipment' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/equipment/{equipmentId}/totals:
    parameters:
      - $ref: '#/components/parameters/EquipmentIdPath'
      - $ref: '#/components/parameters/WarehouseIdQuery'
    get:
      operationId: getEquipmentTotals
      responses:
        '200': { description: Immutable-ledger balance view., content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentTotals' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/asset/v1/equipment/transfers:
    post:
      operationId: transferEquipmentWithinWarehouse
      description: >-
        Moves equipment only between two distinct STOCK or CABIN locations in the same warehouse.
        sourceWarehouseId and targetWarehouseId must be identical. A physical inter-warehouse
        movement is logistics-owned and must use a logistics document; it is never an asset
        transfer or an administrative correction.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransferEquipmentRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/MovementCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
  /api/asset/v1/administrative-corrections:
    post:
      operationId: createAdministrativeAssetCorrection
      description: >-
        SYSTEM_ADMIN or WMS_ADMIN only, with warehouse MANAGE in both warehouses. This is not a
        physical movement command: it corrects an erroneous recorded location only when the asset
        did not move. A cabin correction atomically changes the cabin and every cabin-content
        balance. Active rental, repair, transport, reservation, hold or operation lease rejects the
        command. A physically completed undocumented move must instead be represented by a
        retrospective logistics document. The reason, evidence link, request fingerprint and
        resulting immutable correction event are retained permanently.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateAdministrativeAssetCorrectionRequest' } } } }
      responses:
        '200': { description: Original subject-bound replay., content: { application/json: { schema: { $ref: '#/components/schemas/AdministrativeAssetCorrection' } } } }
        '201': { description: Applied immutable correction., content: { application/json: { schema: { $ref: '#/components/schemas/AdministrativeAssetCorrection' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
  /api/asset/v1/operations/outbox/{eventId}/requeue:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: requeueAssetOutboxEvent
      description: >-
        SYSTEM_ADMIN or WMS_ADMIN recovery for a terminal DLT/QUARANTINED outbox head. Requires
        USER rwms.write. expectedReviewVersion fences concurrent reviews; the mandatory reason is
        stored only in an immutable audit record. The original event ID, aggregate ordering key,
        envelope and sanitized payload are preserved after schema preflight. A non-head event can
        never bypass an earlier aggregate event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetOutboxRequeueRequest' }
      responses:
        '200':
          description: Reviewed event returned to PENDING without changing its envelope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetOutboxRequeueResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/classifiers:
    get:
      operationId: listAssetClassifiers
      parameters: [ { name: type, in: query, schema: { type: string, enum: [CATEGORY, SUBCATEGORY, TYPE, CONDITION] } } ]
      responses:
        '200': { description: Global classifier list., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Classifier' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAssetClassifier
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateClassifierRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/ClassifierCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/classifiers/{id}:
    parameters: [ { $ref: '#/components/parameters/ClassifierId' } ]
    put:
      operationId: updateAssetClassifier
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClassifierRequest' } } } }
      responses:
        '200': { description: Updated classifier., content: { application/json: { schema: { $ref: '#/components/schemas/Classifier' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/operation-leases:
    post:
      operationId: acquireMaintenanceOperationLease
      description: >-
        Requires SERVICE principal maintenance-service with exactly asset.maintenance. The owner is
        restricted to MAINTENANCE_ESTIMATE:<UUID> or MAINTENANCE_REPAIR:<root-repair UUID>.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AcquireMaintenanceOperationLeaseRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/OperationLeaseCreated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/operation-leases/{id}/renew:
    parameters: [ { $ref: '#/components/parameters/LeaseId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: renewMaintenanceOperationLease
      description: Rechecks the exact maintenance owner, expected lease version and active fencing token.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RenewMaintenanceOperationLeaseRequest' } } } }
      responses:
        '200': { description: Renewed lease or original subject-bound replay., content: { application/json: { schema: { $ref: '#/components/schemas/OperationLease' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/operation-leases/{id}/release:
    parameters: [ { $ref: '#/components/parameters/LeaseId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: releaseMaintenanceOperationLease
      description: Rechecks the exact maintenance owner and returns the original response for an identical replay.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseMaintenanceOperationLeaseRequest' } } } }
      responses:
        '200': { description: Released lease, original subject-bound replay, or same-owner terminal RELEASED/EXPIRED recovery with the matching fencing token., content: { application/json: { schema: { $ref: '#/components/schemas/OperationLease' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/rental-items/{id}/snapshot:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    get:
      operationId: readMaintenanceRentalItemSnapshot
      description: >-
        Requires SERVICE maintenance-service with exactly asset.maintenance. Returns only the
        current canonical ID, version, warehouse and status needed before acquiring a lease; it
        never exposes a cabin number, passport, comments or equipment.
      responses:
        '200': { description: Current narrow maintenance asset snapshot., content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceRentalItemSnapshot' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/asset/v1/maintenance/property-assets/{assetKind}/{assetId}/snapshot:
    parameters:
      - name: assetKind
        in: path
        required: true
        schema: { $ref: '#/components/schemas/PropertyAssetKind' }
      - name: assetId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: warehouseId
        in: query
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: readMaintenancePropertyAssetSnapshot
      description: >-
        Requires SERVICE maintenance-service with exactly asset.maintenance. Returns only the
        canonical versioned cabin or warehouse-stock equipment truth required to create/reconcile a
        disposition decision, including non-zero cabin contents and blocking workflow flags. A
        lagging RENTED cabin is eligible only after logistics custody has been released: no active
        reservation, content hold, operation lease or prepared disposition fence may remain. This
        read never changes the cabin status or version.
      responses:
        '200': { description: Narrow versioned property snapshot., content: { application/json: { schema: { $ref: '#/components/schemas/MaintenancePropertyAssetSnapshot' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/property-dispositions/{decisionId}/prepare:
    parameters:
      - name: decisionId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: prepareMaintenancePropertyDisposition
      description: >-
        Requires SERVICE maintenance-service with exactly asset.maintenance. Under canonical asset
        row locks, validates the approved decision's immutable versions and cabin-content plan,
        then creates a durable fence and committed holds. The fence prevents any competing asset
        mutation between administrative approval, worker-confirmed logistics and the terminal
        effect. A custody-backed EQUIPMENT request binds the exact unreserved pending-return claim
        instead of STOCK; it is valid only after the maintenance decision is already approved. An
        active maintenance lease is accepted only when the explicit proof matches its
        lease ID, fencing token and owner; every other active rental, reservation, transport, hold
        or lease rejects preparation. decisionId plus request fingerprint is the permanent replay
        sink; a changed replay returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrepareMaintenancePropertyDispositionRequest' }
      responses:
        '200': { description: Original permanently recorded preparation replay., content: { application/json: { schema: { $ref: '#/components/schemas/MaintenancePropertyDispositionFence' } } } }
        '201': { description: Newly prepared durable disposition fence., content: { application/json: { schema: { $ref: '#/components/schemas/MaintenancePropertyDispositionFence' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/property-dispositions/{decisionId}/apply:
    parameters:
      - name: decisionId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: applyMaintenancePropertyDisposition
      description: >-
        Requires SERVICE maintenance-service with exactly asset.maintenance. Applies one approved
        prepared decision atomically and idempotently. For a cabin, quantities selected for return
        to stock must already be present in the canonical asset movement ledger under
        movementId=decisionId after the referenced logistics task completed; the request then
        disposes only the prepared remainder and sets terminal cabin truth. For stock equipment it
        moves the prepared quantity to WRITTEN_OFF or LOST. For custody equipment it appends the
        terminal claim event and credits the terminal balance only now—no terminal balance or
        equipment_movement exists before this approved APPLY. The immutable PREPARE fingerprint is
        the permanent sink; APPLY cannot alter the approved plan.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApplyMaintenancePropertyDispositionRequest' } } } }
      responses:
        '200': { description: Original applied effect replay., content: { application/json: { schema: { $ref: '#/components/schemas/MaintenancePropertyDispositionEffect' } } } }
        '201': { description: Newly applied terminal asset effect., content: { application/json: { schema: { $ref: '#/components/schemas/MaintenancePropertyDispositionEffect' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/cabin-characteristics:
    get:
      operationId: listMaintenanceCabinCharacteristics
      description: >-
        Requires SERVICE maintenance-service with exactly asset.maintenance.
        Returns the active values from asset's canonical CHARACTERISTIC catalog;
        maintenance never owns or copies this catalog.
      responses:
        '200':
          description: Active cabin characteristics ordered by name and UUID.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CabinCatalogValue' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/maintenance/rental-items/{rentalItemId}/characteristics/{characteristicId}:
    parameters:
      - name: rentalItemId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: characteristicId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    put:
      operationId: applyMaintenanceCabinCharacteristic
      description: >-
        Requires SERVICE maintenance-service with exactly asset.maintenance.
        Appends one active canonical CHARACTERISTIC after successful maintenance
        acceptance. Existing cabin characteristics and their order are
        preserved; the relation is unique and replay-safe.
      responses:
        '200':
          description: Characteristic application or original subject-bound replay.
          headers:
            Idempotency-Replayed:
              required: false
              schema: { type: string, const: 'true' }
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/MaintenanceCharacteristicApplication' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/equipment-catalog:
    post:
      operationId: createMaintenanceFurnitureEquipment
      description: >-
        Requires SERVICE maintenance-service with exactly asset.maintenance. Durably binds a
        maintenance catalog node to the asset-owned FURNITURE item through the canonical
        UUID-idempotent path. A request without expectedEquipmentVersion preserves the current
        asset settings; only a matching version may change or clear maximumPerCabin.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnsureMaintenanceFurnitureEquipmentRequest' }
      responses:
        '201':
          description: Created furniture identity or the original successful replay.
          headers:
            Idempotency-Replayed:
              required: false
              schema: { type: string, const: 'true' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceFurnitureEquipment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/equipment-catalog/snapshots:
    post:
      operationId: readMaintenanceFurnitureEquipmentSnapshots
      description: >-
        Requires SERVICE maintenance-service with exactly asset.maintenance. Reads current
        asset-owned versions and per-cabin maximums for durable maintenance catalog-node bindings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceFurnitureEquipmentSnapshotRequest' }
      responses:
        '200':
          description: Current bound furniture snapshots; missing references are omitted.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MaintenanceFurnitureEquipment' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/rental-items/{id}/fenced-status:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: updateMaintenanceFencedRentalItemStatus
      description: >-
        Requires the exact maintenance client/scope, matching active lease owner and fence. The request
        exposes only approved maintenance actions; asset derives and validates the source/target status.
        COMPLETE_EMPTY_REPAIR is restricted to a repair-owned lease and frees only an eligible,
        unoccupied cabin; occupied, reserved, in-flight and active-repair states are rejected.
        Either an estimate-owned or a direct-repair queue action may atomically select exact versioned
        FURNITURE cabin balances into asset's pending-return custody ledger. Selection never creates
        LOST or WRITTEN_OFF truth; a stock return closes the claim, while a separately approved
        maintenance property disposition is the only terminal path.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceFencedStatusRequest' } } } }
      responses:
        '200':
          description: Updated rental item or original subject-bound replay while the fence remains active.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/furniture-custody:
    parameters:
      - name: ownerType
        in: query
        required: true
        schema: { $ref: '#/components/schemas/MaintenanceLeaseOwnerType' }
      - name: ownerId
        in: query
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listUnresolvedMaintenanceFurnitureCustody
      description: >-
        Requires SERVICE maintenance-service with exactly asset.maintenance. Returns the immutable
        pending-return claims owned by one estimate or direct repair whose quantities are not yet fully
        returned to stock or terminally applied. `availableForDispositionQuantity` excludes quantities
        already reserved by another approved decision and is the only quantity that may seed a new
        PENDING_APPROVAL property decision.
      responses:
        '200':
          description: Unresolved asset-owned furniture custody claims.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MaintenanceFurnitureCustodyClaim' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/maintenance/furniture-custody/{claimId}/return-to-stock:
    parameters:
      - name: claimId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: returnMaintenanceFurnitureCustodyToStock
      description: >-
        Requires SERVICE maintenance-service with exactly asset.maintenance. Atomically credits STOCK
        and appends immutable return evidence for an unreserved pending-return quantity. The exact
        custody version and stock balance version fence concurrent changes. The permanent claim plus
        returnReferenceId and Idempotency-Key reject a changed retry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnMaintenanceFurnitureCustodyToStockRequest' }
      responses:
        '200':
          description: Original permanent return replay.
          content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceFurnitureCustodyReturnReceipt' } } }
        '201':
          description: Newly recorded stock return.
          content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceFurnitureCustodyReturnReceipt' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/rental-items/{id}/snapshot:
