        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/classifiers/{id}:
    parameters: [ { $ref: '#/components/parameters/ClassifierId' } ]
    put:
