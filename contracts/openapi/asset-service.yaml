        current canonical ID, version, warehouse and status needed before acquiring a lease; it
        never exposes a cabin number, passport, comments or equipment.
      responses:
        '200': { description: Current narrow maintenance asset snapshot., content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceRentalItemSnapshot' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/asset/v1/maintenance/property-assets/{assetKind}/{assetId}/snapshot:
    parameters:
      - name: assetKind
        in: path
        required: true
        schema: { $ref: '#/components/schemas/PropertyAssetKind' }
      - name: assetId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: warehouseId
        in: query
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: readMaintenancePropertyAssetSnapshot
      description: >-
        Requires SERVICE maintenance-service with exactly asset.maintenance. Returns only the
        canonical versioned cabin or warehouse-stock equipment truth required to create/reconcile a
        disposition decision, including non-zero cabin contents and blocking workflow flags.
      responses:
        '200': { description: Narrow versioned property snapshot., content: { application/json: { schema: { $ref: '#/components/schemas/MaintenancePropertyAssetSnapshot' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/property-dispositions/{decisionId}/prepare:
    parameters:
      - name: decisionId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: prepareMaintenancePropertyDisposition
      description: >-
        Requires SERVICE maintenance-service with exactly asset.maintenance. Under canonical asset
        row locks, validates the approved decision's immutable versions and cabin-content plan,
        then creates a durable fence and committed holds. The fence prevents any competing asset
        mutation between administrative approval, worker-confirmed logistics and the terminal
        effect. A custody-backed EQUIPMENT request binds the exact unreserved pending-return claim
        instead of STOCK; it is valid only after the maintenance decision is already approved. An
        active maintenance lease is accepted only when the explicit proof matches its
        lease ID, fencing token and owner; every other active rental, reservation, transport, hold
        or lease rejects preparation. decisionId plus request fingerprint is the permanent replay
        sink; a changed replay returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrepareMaintenancePropertyDispositionRequest' }
      responses:
        '200': { description: Original permanently recorded preparation replay., content: { application/json: { schema: { $ref: '#/components/schemas/MaintenancePropertyDispositionFence' } } } }
        '201': { description: Newly prepared durable disposition fence., content: { application/json: { schema: { $ref: '#/components/schemas/MaintenancePropertyDispositionFence' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/property-dispositions/{decisionId}/apply:
    parameters:
      - name: decisionId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: applyMaintenancePropertyDisposition
      description: >-
        Requires SERVICE maintenance-service with exactly asset.maintenance. Applies one approved
        prepared decision atomically and idempotently. For a cabin, quantities selected for return
        to stock must already be present in the canonical asset movement ledger under
        movementId=decisionId after the referenced logistics task completed; the request then
        disposes only the prepared remainder and sets terminal cabin truth. For stock equipment it
        moves the prepared quantity to WRITTEN_OFF or LOST. For custody equipment it appends the
        terminal claim event and credits the terminal balance only now—no terminal balance or
        equipment_movement exists before this approved APPLY. The immutable PREPARE fingerprint is
        the permanent sink; APPLY cannot alter the approved plan.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApplyMaintenancePropertyDispositionRequest' } } } }
      responses:
        '200': { description: Original applied effect replay., content: { application/json: { schema: { $ref: '#/components/schemas/MaintenancePropertyDispositionEffect' } } } }
        '201': { description: Newly applied terminal asset effect., content: { application/json: { schema: { $ref: '#/components/schemas/MaintenancePropertyDispositionEffect' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/cabin-characteristics:
    get:
      operationId: listMaintenanceCabinCharacteristics
      description: >-
        Requires SERVICE maintenance-service with exactly asset.maintenance.
        Returns the active values from asset's canonical CHARACTERISTIC catalog;
        maintenance never owns or copies this catalog.
      responses:
        '200':
          description: Active cabin characteristics ordered by name and UUID.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CabinCatalogValue' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/maintenance/rental-items/{rentalItemId}/characteristics/{characteristicId}:
    parameters:
      - name: rentalItemId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: characteristicId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    put:
      operationId: applyMaintenanceCabinCharacteristic
      description: >-
        Requires SERVICE maintenance-service with exactly asset.maintenance.
        Appends one active canonical CHARACTERISTIC after successful maintenance
        acceptance. Existing cabin characteristics and their order are
        preserved; the relation is unique and replay-safe.
      responses:
        '200':
          description: Characteristic application or original subject-bound replay.
          headers:
            Idempotency-Replayed:
              required: false
              schema: { type: string, const: 'true' }
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/MaintenanceCharacteristicApplication' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/equipment-catalog:
    post:
      operationId: createMaintenanceFurnitureEquipment
      description: >-
        Requires SERVICE maintenance-service with exactly asset.maintenance. Creates a FURNITURE
        catalog item through the canonical UUID-idempotent create path; the maintenance catalog node
        supplies Idempotency-Key and a changed equipmentName for the same key conflicts.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnsureMaintenanceFurnitureEquipmentRequest' }
      responses:
        '201':
          description: Created furniture identity or the original successful replay.
          headers:
            Idempotency-Replayed:
              required: false
              schema: { type: string, const: 'true' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceFurnitureEquipment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/rental-items/{id}/fenced-status:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: updateMaintenanceFencedRentalItemStatus
      description: >-
        Requires the exact maintenance client/scope, matching active lease owner and fence. The request
        exposes only approved maintenance actions; asset derives and validates the source/target status.
        COMPLETE_EMPTY_REPAIR is restricted to a repair-owned lease and frees only an eligible,
        unoccupied cabin; occupied, reserved, in-flight and active-repair states are rejected.
        Either an estimate-owned or a direct-repair queue action may atomically select exact versioned
        FURNITURE cabin balances into asset's pending-return custody ledger. Selection never creates
        LOST or WRITTEN_OFF truth; a stock return closes the claim, while a separately approved
        maintenance property disposition is the only terminal path.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceFencedStatusRequest' } } } }
      responses:
        '200':
          description: Updated rental item or original subject-bound replay while the fence remains active.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/furniture-custody:
    parameters:
      - name: ownerType
        in: query
        required: true
        schema: { $ref: '#/components/schemas/MaintenanceLeaseOwnerType' }
      - name: ownerId
        in: query
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listUnresolvedMaintenanceFurnitureCustody
      description: >-
        Requires SERVICE maintenance-service with exactly asset.maintenance. Returns the immutable
        pending-return claims owned by one estimate or direct repair whose quantities are not yet fully
        returned to stock or terminally applied. `availableForDispositionQuantity` excludes quantities
        already reserved by another approved decision and is the only quantity that may seed a new
        PENDING_APPROVAL property decision.
      responses:
        '200':
          description: Unresolved asset-owned furniture custody claims.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MaintenanceFurnitureCustodyClaim' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/maintenance/furniture-custody/{claimId}/return-to-stock:
    parameters:
      - name: claimId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: returnMaintenanceFurnitureCustodyToStock
      description: >-
        Requires SERVICE maintenance-service with exactly asset.maintenance. Atomically credits STOCK
        and appends immutable return evidence for an unreserved pending-return quantity. The exact
        custody version and stock balance version fence concurrent changes. The permanent claim plus
        returnReferenceId and Idempotency-Key reject a changed retry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnMaintenanceFurnitureCustodyToStockRequest' }
      responses:
        '200':
          description: Original permanent return replay.
          content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceFurnitureCustodyReturnReceipt' } } }
        '201':
          description: Newly recorded stock return.
          content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceFurnitureCustodyReturnReceipt' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/rental-items/{id}/snapshot:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    get:
      operationId: readLogisticsRentalItemSnapshot
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Returns only the canonical
        asset ID, version, warehouse, canonical number used on driver cards, status and opaque
        equipment quantities; it never exposes a passport, local comments or generic asset read data.
      responses:
        '200': { description: Narrow canonical asset snapshot., content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsRentalItemSnapshot' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/asset/v1/logistics/operation-leases:
    post:
      operationId: acquireLogisticsOperationLease
      description: >-
        Requires exactly asset.logistics. Owner type is closed to the three logistics aggregate
        families and asset derives the persisted owner reference as documentId:lineId.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AcquireLogisticsOperationLeaseRequest' } } } }
      responses:
        '201':
          description: Acquired lease or original subject-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsOperationLease' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/return-equipment-receipts:
    post:
      operationId: receiveLogisticsReturnEquipment
      description: >-
        Requires exactly asset.logistics. Records an immutable receipt for active
        FURNITURE found in addition to a returned cabin's canonical contents and
        increments the destination warehouse STOCK balance atomically.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogisticsReturnEquipmentReceiptRequest' }
      responses:
        '201':
          description: Immutable stock receipts or original subject-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsReturnEquipmentReceipt' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
  /api/internal/asset/v1/logistics/operation-leases/{id}/renew:
    parameters: [ { $ref: '#/components/parameters/LeaseId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: renewLogisticsOperationLease
      description: Rechecks the exact typed document-line owner, expected lease version and active fencing token.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsLeaseCommandRequest' } } } }
      responses:
        '200':
          description: Renewed lease or original subject-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsOperationLease' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/operation-leases/{id}/release:
    parameters: [ { $ref: '#/components/parameters/LeaseId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: releaseLogisticsOperationLease
      description: Rechecks the exact typed document-line owner before releasing the opaque lease.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsLeaseCommandRequest' } } } }
      responses:
        '200':
          description: Released lease or original subject-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsOperationLease' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/rental-items/{id}/effects:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: applyLogisticsRentalItemEffect
      description: >-
        A closed action allowlist validates the matching active typed lease, asset version and
        permissible canonical return, shipment or transfer transition. Only transfer arrival may
        move warehouse; attached cabin contents move through asset-owned ledger rows atomically.
        TRANSFER_DEPART and TRANSFER_ARRIVE require transferAssetStatus FREE or REPAIR. Departure
        persists this canonical restoration status and arrival rejects a mismatch instead of
        applying a fallback. CAPITAL_REPAIR departs with REPAIR and is temporarily restored to
        REPAIR so maintenance can reapply its calculated capital status after arrival.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsFencedEffectRequest' } } } }
      responses:
        '200':
          description: Canonical effect applied or original replay while the active fence remains valid.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsRentalItemSnapshot' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
        '503': { $ref: '#/components/responses/DependencyFailure' }
  /api/internal/asset/v1/logistics/equipment-holds:
    post:
      operationId: acquireLogisticsEquipmentHold
      description: >-
        Requires exactly asset.logistics. Only a shipmentId:shipmentLineId owner can reserve
        canonical stock; asset remains owner of hold state and all physical ledger movement.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AcquireLogisticsEquipmentHoldRequest' } } } }
      responses:
        '201':
          description: Opaque hold reference or original subject-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsEquipmentHold' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
        '503': { $ref: '#/components/responses/DependencyFailure' }
  /api/internal/asset/v1/logistics/equipment-holds/{id}/renew:
    parameters: [ { $ref: '#/components/parameters/HoldId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: renewLogisticsEquipmentHold
      description: Renews only a matching active shipment-line hold.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsEquipmentHoldCommandRequest' } } } }
      responses:
        '200':
          description: Renewed opaque hold or original subject-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsEquipmentHold' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/equipment-holds/{id}/commit:
    parameters: [ { $ref: '#/components/parameters/HoldId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: commitLogisticsEquipmentHold
      description: Commits only a matching active shipment-line hold without inferring a logistics movement.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsEquipmentHoldCommandRequest' } } } }
      responses:
        '200':
          description: Committed opaque hold or original subject-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsEquipmentHold' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/equipment-holds/{id}/release:
    parameters: [ { $ref: '#/components/parameters/HoldId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: releaseLogisticsEquipmentHold
      description: Releases only a matching shipment-line hold; active and committed holds are asset-owned states.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsEquipmentHoldCommandRequest' } } } }
      responses:
        '200':
          description: Released opaque hold or original subject-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsEquipmentHold' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/equipment-movement-reservations:
    post:
      operationId: acquireLogisticsEquipmentMovementReservation
      description: >-
        Requires exactly asset.logistics. Reserves one exact STOCK or canonical cabin source balance
        for movementId:lineId until the caller-supplied reservedUntil instant. Asset derives the closed
        LOGISTICS_EQUIPMENT_MOVEMENT owner and returns canonical catalog UUID/name for task text.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcquireLogisticsEquipmentMovementReservationRequest' }
      responses:
        '201':
          description: Acquired reservation or original subject-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsEquipmentMovementReservation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
        '503': { $ref: '#/components/responses/DependencyFailure' }
  /api/internal/asset/v1/logistics/equipment-movement-reservations/{id}/release:
    parameters: [ { $ref: '#/components/parameters/HoldId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: releaseLogisticsEquipmentMovementReservation
      description: >-
        Releases only a matching movementId:lineId reservation with its exact reservation version.
        An already terminal reservation is returned unchanged only when that current version is supplied.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogisticsEquipmentMovementReservationCommandRequest' }
      responses:
        '200':
          description: Released reservation or original subject-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsEquipmentMovementReservation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/equipment-movement-reservations/execute:
    post:
      operationId: executeLogisticsEquipmentMovementReservations
      description: >-
        Applies one or more worker-completed reserved movements atomically. Every reservation must
        be ACTIVE, unexpired, owned by the supplied movementId:lineId and match its reservation
        version. Target balance versions are intentionally not preconditions; asset serializes and
        increments the current target balance in the same transaction.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecuteLogisticsEquipmentMovementReservationsRequest' }
      responses:
        '201':
          description: Every physical movement and reservation execution persisted, or original replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsEquipmentMovementExecution' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
        '503': { $ref: '#/components/responses/DependencyFailure' }
  /api/internal/asset/v1/logistics/orders/{orderId}/unit-candidates:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: readOrderUnitCandidates
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. The server returns only
        unreserved FREE units without a live operation lease in the requested warehouse, plus
        units already active in this order. Non-FREE units and reservations owned
        by other orders are excluded before pagination.
      parameters:
        - { name: warehouseId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: search, in: query, schema: { type: string, maxLength: 128, default: '' } }
      responses:
        '200':
          description: Server-filtered order-unit candidate page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderUnitCandidatePage' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/logistics/orders/{orderId}/units:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: readOrderUnits
      description: Requires SERVICE logistics-service with exactly asset.logistics.
      responses:
        '200':
          description: Active unit reservations owned by this order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderUnitReservation' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: reserveOrderUnit
      description: >-
        Atomically locks a FREE rental item and creates one active reservation. Releasing a draft
        reservation restores FREE. A partial
        database unique index forbids a second active order for the same rental item.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveOrderUnitRequest' }
      responses:
        '200':
          description: Original reservation replay or same-order natural replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderUnitReservation' }
        '201':
          description: Active reservation created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderUnitReservation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/orders/{orderId}/units/release-all:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: releaseAllOrderUnits
      description: Releases every active reservation for the order in one transaction and supports exact replay.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderActorRequest' }
      responses:
        '200':
          description: Released reservations or the original replayed result.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderUnitReservation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/orders/{orderId}/units/{rentalItemId}/release:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: rentalItemId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: releaseOrderUnit
      description: Releases only an active reservation owned by this order and supports exact replay.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderActorRequest' }
      responses:
        '200':
          description: Released reservation or the original replayed result.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderUnitReservation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/orders/{orderId}/equipment-reservations:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    put:
      operationId: replaceOrderEquipmentReservations
      description: >-
        Replaces the order-wide catalogue reservation without choosing a source cabin. Availability
        is stock plus non-rented cabins, less physical holds and reservations of other orders.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ReplaceOrderEquipmentReservationsRequest' } }
      responses:
        '200':
          description: Active reservations after replacement or original replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/OrderEquipmentReservation' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/orders/{orderId}/equipment-movement-plan:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: planOrderFurnitureMovements
      description: >-
        Computes the physical difference between one selected order cabin and its desired furniture.
        It plans additions from stock or unreserved non-rented cabins and returns surplus to stock;
        it does not move any ledger balance itself.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/OrderFurnitureMovementPlanRequest' } }
      responses:
        '200':
          description: Exact source-to-target worker movement plan.
          content: { application/json: { schema: { $ref: '#/components/schemas/OrderFurnitureMovementPlan' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/rental-items/{rentalItemId}/furniture-movement-plan:
    parameters:
      - { name: rentalItemId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: planCabinFurnitureMovements
      description: >-
        Computes the complete desired furniture composition for one editable cabin. It selects
        current source balances from additional equipment and returns a worker-task plan without
        changing physical balances.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CabinFurnitureMovementPlanRequest' } }
      responses:
        '200':
          description: Exact source-to-target worker movement plan.
          content: { application/json: { schema: { $ref: '#/components/schemas/CabinFurnitureMovementPlan' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/cabin-facets:
    get:
      operationId: readPresentationCabinFacets
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Returns facet values from
        FREE cabins that are not order-reserved, operation-leased, or held by another presentation.
        Supplying holdScopeId retains the requesting inquiry's current holds; this read does not
        create a hold.
      parameters:
        - { $ref: '#/components/parameters/WarehouseIdQuery' }
        - name: holdScopeId
          in: query
          required: false
          description: Inquiry ID whose current presentation holds remain visible in the facets.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Available cabin facet values for the warehouse.
          content: { application/json: { schema: { $ref: '#/components/schemas/CabinFacetResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/logistics/cabin-searches:
    post:
      operationId: searchPresentationCabins
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Matches currently
        available rentable cabins for each requested group and creates or renews this inquiry's
        short-lived holds; a cabin is returned at most once across the groups in a response.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CabinSearchRequest' } } }
      responses:
        '200':
          description: Available cabin matches, grouped in request order.
          content: { application/json: { schema: { $ref: '#/components/schemas/CabinSearchResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/logistics/cabin-availability:
    post:
      operationId: checkPresentationCabinAvailability
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Rechecks each selected
        cabin and returns an explicit per-cabin availability reason without changing state.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CabinAvailabilityRequest' } } }
      responses:
        '200':
          description: Per-cabin availability for the requested warehouse.
          content: { application/json: { schema: { $ref: '#/components/schemas/CabinAvailabilityResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/logistics/cabin-snapshots:
    post:
      operationId: readPresentationCabinSnapshots
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Reads the current cabin
        snapshots for a selected warehouse; all requested cabin IDs must still belong to it.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CabinAvailabilityRequest' } } }
      responses:
        '200':
          description: Current cabin snapshots in the request ID order.
          content: { application/json: { schema: { $ref: '#/components/schemas/CabinSnapshotsResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/asset/v1/logistics/presentations/{presentationId}/holds:
    parameters: [ { $ref: '#/components/parameters/PresentationId' } ]
    get:
      operationId: readPresentationHolds
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Expires due holds before
        returning this presentation's remaining active cabin holds; an unknown or empty presentation
        returns an empty holds list. When actorSubjectId and actorRole are supplied together,
        every active hold must belong to that actor.
      parameters:
        - name: actorSubjectId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: actorRole
          in: query
          required: false
          schema: { $ref: '#/components/schemas/OrderActorRole' }
      responses:
        '200':
          description: Active presentation holds and their latest expiry, if any.
          content: { application/json: { schema: { $ref: '#/components/schemas/ReplacePresentationHoldsResponse' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: replacePresentationHolds
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Atomically replaces the
        presentation's active cabin selection. expiresAt must be in the future and no more than 24
        hours away; retries use the same actor-bound idempotency key.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReplacePresentationHoldsRequest' } } }
      responses:
        '200':
          description: Active holds after replacement or the original actor-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ReplacePresentationHoldsResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/presentations/{presentationId}/holds/release:
    parameters:
      - { $ref: '#/components/parameters/PresentationId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: releasePresentationHolds
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Releases every active hold
        for the presentation and is idempotent even when no active holds remain.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ActorInput' } } }
      responses:
        '200':
          description: Empty active-holds result after release or the original actor-bound replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ReplacePresentationHoldsResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/logistics/presentations/{presentationId}/holds/convert:
    parameters:
      - { $ref: '#/components/parameters/PresentationId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: convertPresentationHolds
      description: >-
        Requires SERVICE logistics-service with exactly asset.logistics. Atomically converts the
        selected live presentation holds into active order-unit reservations and releases the other
        current holds; retries use the same actor-bound idempotency key.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConvertPresentationHoldsRequest' } } }
      responses:
        '200':
          description: Converted order-unit reservations and released cabin IDs, or the original replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ConvertPresentationHoldsResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/inventory/captures:
    post:
      operationId: createInventoryAssetCapture
      description: >-
        Requires SERVICE inventory-service with exactly asset.inventory. Freezes one deterministic
        eligible warehouse population for 30 non-sliding minutes. A later technical attempt under
        the same operation is accepted only after the prior attempt expires.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryCaptureRequest' } } } }
      responses:
        '201': { description: Stable capture created or recovered., content: { application/json: { schema: { $ref: '#/components/schemas/InventoryCapture' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/inventory/assets/{assetId}:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: readCurrentInventoryAssetSnapshot
      description: >-
        Requires SERVICE inventory-service with exactly asset.inventory. Reads one authoritative
        current inventory-safe asset snapshot, including its current tenant and cabin contents;
        local general comments and manual notes are never exposed.
      responses:
        '200': { description: Current inventory-safe asset snapshot., content: { application/json: { schema: { $ref: '#/components/schemas/InventoryAssetCurrentSnapshot' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/asset/v1/inventory/captures/{captureId}/members:
    parameters:
      - { name: captureId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: readInventoryAssetCapturePage
      description: Reads only the immutable capture; page reads never extend its expiry.
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        '200': { description: Stable capture page., content: { application/json: { schema: { $ref: '#/components/schemas/InventoryCapturePage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/inventory/captures/{captureId}:
    parameters:
      - { name: captureId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: releaseInventoryAssetCapture
      description: Idempotently releases copied or losing technical capture state immediately.
      responses:
        '204': { description: Capture released or already terminal. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/asset/v1/inventory/number-resolutions:
    post:
      operationId: resolveInventoryRentalNumber
      description: Warehouse-scoped identity lookup. It never resolves a same-number cabin from another warehouse.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryNumberResolutionRequest' } } } }
      responses:
        '200': { description: Warehouse-scoped resolution including explicit absence., content: { application/json: { schema: { $ref: '#/components/schemas/InventoryNumberResolution' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/inventory/validations:
    post:
      operationId: validateInventoryAssets
      description: Point-in-time read snapshot only; it creates no validation token, lease or fence.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryValidationRequest' } } } }
      responses:
        '200': { description: Deterministically ordered validation snapshot and digest., content: { application/json: { schema: { $ref: '#/components/schemas/InventoryValidation' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/asset/v1/inventory/furniture-snapshots:
    post:
      operationId: readInventoryFurnitureSnapshot
      description: >-
        Requires SERVICE inventory-service with exactly asset.inventory. Returns every active
        FURNITURE catalogue position, stock and only the requested cabin quantities in canonical
        order. An empty assetIds list is a stock-only snapshot with empty cabins arrays.
        snapshotSha256 covers the complete returned current state.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryFurnitureSnapshotRequest' } } } }
      responses:
        '200': { description: Deterministic current furniture count snapshot., content: { application/json: { schema: { $ref: '#/components/schemas/InventoryFurnitureSnapshot' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
  /api/internal/asset/v1/inventory/furniture-reconciliations/{inventoryId}:
    parameters:
      - { name: inventoryId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    put:
      operationId: reconcileInventoryFurniture
      description: >-
        Atomically applies one absolute count for every current active FURNITURE position and the
        selected cabins. Every item may carry an empty cabins list for a stock-only review.
        inventoryId is a permanent source identity: the exact request replays and a changed request
        conflicts. The current snapshot, catalogue and live lease, hold and order
        reservation guards are checked while the affected asset-owned balance streams are locked.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryFurnitureReconciliationRequest' } } } }
      responses:
        '204':
          description: Reconciliation applied, or its exact permanent replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
  /api/internal/asset/v1/inventory/source-assets:
    post:
      operationId: createInventorySourceAsset
      description: >-
        Atomically creates one FREE asset and its normal rental-item fact. Permanent source identity
        inventoryId:findingId replays beyond ordinary idempotency retention; changed payload conflicts.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventorySourceAssetRequest' } } } }
      responses:
        '200':
          description: Permanent replay.
          headers:
            Idempotency-Replayed: { required: true, schema: { type: string, enum: ['true'] } }
          content: { application/json: { schema: { $ref: '#/components/schemas/InventorySourceAsset' } } }
        '201': { description: Source asset created., content: { application/json: { schema: { $ref: '#/components/schemas/InventorySourceAsset' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerJwt: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    RentalItemId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    EquipmentId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    EquipmentIdPath: { name: equipmentId, in: path, required: true, schema: { type: string, format: uuid } }
    ClassifierId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    HoldId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    LeaseId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    HtmlImportId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    WarehouseIdQuery: { name: warehouseId, in: query, required: true, schema: { type: string, format: uuid } }
    PresentationId: { name: presentationId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
  responses:
    RentalItemCreated:
      description: Created item or original successful replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } }
    ManualNoteCreated:
      description: Appended service-local note or replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ManualNote' } } }
    EquipmentCreated:
      description: Created catalog item or replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Equipment' } } }
    MovementCreated:
      description: Committed ledger movement or replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Movement' } } }
    ClassifierCreated:
      description: Created classifier or replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Classifier' } } }
    EquipmentHoldCreated:
      description: Hold acquired or replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentHold' } } }
    OperationLeaseCreated:
      description: Lease acquired or replay.
      headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/OperationLease' } } }
    BadRequest: { description: Invalid request., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unauthorized: { description: Missing or invalid token., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Forbidden: { description: Insufficient USER or exact service credential., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NotFound: { description: Canonical asset not found., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Conflict: { description: Unified expected-version, idempotency, invariant or fencing conflict., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    DependencyFailure: { description: A required private warehouse or media dependency is unavailable or rejects the request., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  schemas:
    ExpectedVersion: { type: integer, format: int64, minimum: 0 }
    NullableUuid: { oneOf: [ { type: string, format: uuid }, { type: 'null' } ] }
    RentalItemStatus: { type: string, enum: [RENTED, BOOKED, REPAIR, WAITING_REPAIR_CHECK, WRITTEN_OFF, LOST, CAPITAL_REPAIR, AFTER_RENT, WAITING_ESTIMATE_CONFIRMATION, SALE, USED_SALE, RESERVED, FREE, WAREHOUSE, OWN_NEEDS, IN_TRANSFER] }
    BalanceLocationKind: { type: string, enum: [STOCK, CABIN_NON_RENTED, CABIN_RENTED, WRITTEN_OFF, LOST] }
    EquipmentCategory: { type: string, enum: [FURNITURE, ELECTRICAL, OTHER] }
    Passport: { type: object, additionalProperties: true }
    HtmlImportState:
      type: string
      description: >-
        COMMITTING is a durable local intent awaiting an idempotent media
        preflight or the atomic local asset phase; it is server-recovered and
        cannot be edited or cancelled.
      enum: [DRAFT, REVIEW_REQUIRED, READY, COMMITTING, ASSETS_COMMITTED, MEDIA_IMPORTING, COMPLETED, COMPLETED_WITH_WARNINGS, FAILED]
    HtmlImportRowAction:
      type: string
      description: >-
        CREATE and EXCLUDE are the only active commit actions. MERGE is kept
        solely for reading historical records and is rejected; REVIEW requires
        an explicit CREATE or EXCLUDE decision.
      enum: [CREATE, MERGE, EXCLUDE, REVIEW]
    HtmlImportSummary:
      type: object
      additionalProperties: false
      required: [id, version, warehouseId, state, rowCount, selectedCount, invalidCount, unresolvedCount, mediaLinkCount, warningCount, mediaJobId, failureCode, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { $ref: '#/components/schemas/ExpectedVersion' }
        warehouseId: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/HtmlImportState' }
        rowCount: { type: integer, minimum: 0 }
        selectedCount: { type: integer, minimum: 0 }
        invalidCount: { type: integer, minimum: 0 }
        unresolvedCount: { type: integer, minimum: 0 }
        mediaLinkCount: { type: integer, minimum: 0 }
        warningCount: { type: integer, minimum: 0 }
        mediaJobId: { $ref: '#/components/schemas/NullableUuid' }
        failureCode: { type: [string, 'null'], maxLength: 128 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    HtmlImportCatalogTarget:
      type: object
      additionalProperties: false
      required: [id, kind, name, active]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/CabinCatalogKind' }
        name: { type: string, minLength: 1, maxLength: 255 }
        active: { type: boolean }
    HtmlImportEquipmentTarget:
      type: object
      additionalProperties: false
      required: [id, name, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 255 }
        active: { type: boolean }
    HtmlImportCandidateKind:
      type: string
      enum: [TYPE, DIMENSION, FINISHING, CATEGORY, CHARACTERISTIC, STATUS, EQUIPMENT]
    HtmlImportSourceCandidate:
      type: object
      additionalProperties: false
      required: [kind, sourceValue, suggestedValue, occurrences, suggestedTargetId, required]
      properties:
        kind: { $ref: '#/components/schemas/HtmlImportCandidateKind' }
        sourceValue: { type: string, minLength: 1, maxLength: 255 }
        suggestedValue: { type: [string, 'null'], maxLength: 255 }
        occurrences: { type: integer, format: int64, minimum: 1 }
        suggestedTargetId: { $ref: '#/components/schemas/NullableUuid' }
        required: { type: boolean }
    HtmlImportSourceValue:
      type: object
      additionalProperties: false
      required: [sourceId, sourceLabel, suggestedValue]
      properties:
        sourceId: { type: [string, 'null'], maxLength: 255 }
        sourceLabel: { type: [string, 'null'], maxLength: 255 }
        suggestedValue: { type: [string, 'null'], maxLength: 255 }
    HtmlImportDiagnostic:
      type: object
      additionalProperties: false
      required: [severity, code, field]
      properties:
        severity: { type: string, enum: [ERROR, WARNING] }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,127}$' }
        field: { type: [string, 'null'], maxLength: 64 }
    HtmlImportFurnitureLine:
      type: object
      additionalProperties: false
      required: [sourceId, sourceLabel, quantity]
      properties:
        sourceId: { type: string, minLength: 1, maxLength: 64 }
        sourceLabel: { type: string, minLength: 1, maxLength: 255 }
        quantity: { type: integer, minimum: 1, maximum: 1000 }
    HtmlImportMappingAction:
      type: string
      enum: [MAP, CREATE, IGNORE]
    HtmlImportCatalogMapping:
      type: object
      additionalProperties: false
      required: [kind, sourceValue, action]
      properties:
        kind: { $ref: '#/components/schemas/CabinCatalogKind' }
        sourceValue: { type: string, minLength: 1, maxLength: 255 }
        action: { $ref: '#/components/schemas/HtmlImportMappingAction' }
        targetId: { $ref: '#/components/schemas/NullableUuid' }
        stagedName: { type: [string, 'null'], maxLength: 255 }
    HtmlImportEquipmentMapping:
      type: object
      additionalProperties: false
      required: [sourceValue, action]
      properties:
        sourceValue: { type: string, minLength: 1, maxLength: 255 }
        action: { $ref: '#/components/schemas/HtmlImportMappingAction' }
        targetId: { $ref: '#/components/schemas/NullableUuid' }
        stagedName: { type: [string, 'null'], maxLength: 255 }
    HtmlImportStatusMapping:
      type: object
      description: >-
        targetStatus is restricted by the service to SALE, USED_SALE, FREE,
        WAREHOUSE or OWN_NEEDS; workflow and terminal statuses are rejected.
      additionalProperties: false
      required: [sourceValue, targetStatus]
      properties:
        sourceValue: { type: string, minLength: 1, maxLength: 255 }
        targetStatus: { type: string, enum: [SALE, USED_SALE, FREE, WAREHOUSE, OWN_NEEDS] }
    HtmlImportMergeWinner:
      type: string
      enum: [SOURCE, TARGET]
    HtmlImportRowDecision:
      type: object
      description: >-
        For active imports action must be CREATE, EXCLUDE or REVIEW. A MERGE
        decision and its target/mergeChoices are rejected because an HTML
        import never changes an existing cabin.
      additionalProperties: false
      required: [sourceRowId, action]
      properties:
        sourceRowId: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        action: { $ref: '#/components/schemas/HtmlImportRowAction' }
        proposedNumber: { type: [string, 'null'], maxLength: 128 }
        targetRentalItemId: { $ref: '#/components/schemas/NullableUuid' }
        targetExpectedVersion:
          oneOf:
            - { $ref: '#/components/schemas/ExpectedVersion' }
            - { type: 'null' }
        rentalTypeId: { $ref: '#/components/schemas/NullableUuid' }
        dimensionId: { $ref: '#/components/schemas/NullableUuid' }
        finishingId: { $ref: '#/components/schemas/NullableUuid' }
        categoryId: { $ref: '#/components/schemas/NullableUuid' }
        characteristicIds:
          oneOf:
            - type: array
              maxItems: 100
              uniqueItems: true
              items: { type: string, format: uuid }
            - { type: 'null' }
        status:
          oneOf:
            - { type: string, enum: [SALE, USED_SALE, FREE, WAREHOUSE, OWN_NEEDS] }
            - { type: 'null' }
        linoleum: { type: [boolean, 'null'] }
        comment: { type: [string, 'null'], maxLength: 4000 }
        mergeChoices:
          type: [object, 'null']
          maxProperties: 32
          additionalProperties: { $ref: '#/components/schemas/HtmlImportMergeWinner' }
    HtmlImportPlan:
      type: object
      additionalProperties: false
      required: [catalogMappings, equipmentMappings, statusMappings, rows]
      properties:
        catalogMappings:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/HtmlImportCatalogMapping' }
        equipmentMappings:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/HtmlImportEquipmentMapping' }
        statusMappings:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/HtmlImportStatusMapping' }
        rows:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/HtmlImportRowDecision' }
    UpdateHtmlImportPlanRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, catalogMappings, equipmentMappings, statusMappings, rows]
      properties:
        expectedVersion: { $ref: '#/components/schemas/ExpectedVersion' }
        catalogMappings:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/HtmlImportCatalogMapping' }
        equipmentMappings:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/HtmlImportEquipmentMapping' }
        statusMappings:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/HtmlImportStatusMapping' }
        rows:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/HtmlImportRowDecision' }
    CommitHtmlImportRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { $ref: '#/components/schemas/ExpectedVersion' }
    RetryHtmlImportMediaRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { $ref: '#/components/schemas/ExpectedVersion' }
    SkipHtmlImportMediaRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { $ref: '#/components/schemas/ExpectedVersion' }
    HtmlImportMediaReplacement:
      type: object
      additionalProperties: false
      required: [rowId, publicUrl]
      properties:
        rowId: { type: string, format: uuid }
        publicUrl:
          description: Exact Yandex.Disk replacement link. It is write-only and never returned by this API.
          type: string
          pattern: '^https://disk\.yandex\.ru/d/[A-Za-z0-9_-]{14}$'
    ReplaceHtmlImportMediaRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, replacements]
      properties:
        expectedVersion: { $ref: '#/components/schemas/ExpectedVersion' }
        replacements:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/HtmlImportMediaReplacement' }
    ExistingRentalItemPreview:
      type: object
      additionalProperties: false
      required: [id, version, number, status, rentalTypeId, rentalType, dimensionId, dimension, finishingId, finishing, categoryId, category, linoleum, generalComment, passport]
      properties:
        id: { type: string, format: uuid }
        version: { $ref: '#/components/schemas/ExpectedVersion' }
        number: { type: string, minLength: 1, maxLength: 128 }
        status: { $ref: '#/components/schemas/RentalItemStatus' }
        rentalTypeId: { $ref: '#/components/schemas/NullableUuid' }
        rentalType: { type: [string, 'null'], maxLength: 255 }
        dimensionId: { $ref: '#/components/schemas/NullableUuid' }
        dimension: { type: [string, 'null'], maxLength: 255 }
        finishingId: { $ref: '#/components/schemas/NullableUuid' }
        finishing: { type: [string, 'null'], maxLength: 255 }
        categoryId: { $ref: '#/components/schemas/NullableUuid' }
        category: { type: [string, 'null'], maxLength: 255 }
        linoleum: { type: [boolean, 'null'] }
        generalComment: { type: [string, 'null'], maxLength: 4000 }
        passport: { $ref: '#/components/schemas/Passport' }
    HtmlImportRow:
      type: object
      additionalProperties: false
      required: [id, sourceRowId, sourcePosition, sourceNumber, proposedNumber, action, targetRentalItemId, rentalType, dimension, finishing, category, characteristics, linoleum, storageState, status, proposedStatus, comment, hasPhotoLink, furniture, shipmentDate, tenant, price, diagnostics, decision, existingRentalItem]
      properties:
        id: { type: string, format: uuid }
        sourceRowId: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        sourcePosition: { type: integer, minimum: 0 }
        sourceNumber: { type: [string, 'null'], maxLength: 512 }
        proposedNumber: { type: [string, 'null'], maxLength: 128 }
        action: { $ref: '#/components/schemas/HtmlImportRowAction' }
        targetRentalItemId: { $ref: '#/components/schemas/NullableUuid' }
        rentalType: { $ref: '#/components/schemas/HtmlImportSourceValue' }
        dimension: { $ref: '#/components/schemas/HtmlImportSourceValue' }
        finishing: { $ref: '#/components/schemas/HtmlImportSourceValue' }
        category: { $ref: '#/components/schemas/HtmlImportSourceValue' }
        characteristics:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/HtmlImportSourceValue' }
        linoleum: { type: [boolean, 'null'] }
        storageState: { type: [string, 'null'], maxLength: 4000 }
        status: { $ref: '#/components/schemas/HtmlImportSourceValue' }
        proposedStatus:
          oneOf:
            - { $ref: '#/components/schemas/RentalItemStatus' }
            - { type: 'null' }
        comment: { type: [string, 'null'], maxLength: 4000 }
        hasPhotoLink: { type: boolean }
        furniture:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/HtmlImportFurnitureLine' }
        shipmentDate: { type: [string, 'null'], format: date }
        tenant: { type: [string, 'null'], maxLength: 4000 }
        price: { type: [number, 'null'], exclusiveMinimum: 0 }
        diagnostics:
          type: array
          items: { $ref: '#/components/schemas/HtmlImportDiagnostic' }
        decision:
          oneOf:
            - { $ref: '#/components/schemas/HtmlImportRowDecision' }
            - { type: 'null' }
        existingRentalItem:
          oneOf:
            - { $ref: '#/components/schemas/ExistingRentalItemPreview' }
            - { type: 'null' }
    HtmlImportRowPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/HtmlImportRow' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 200 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int64, minimum: 0 }
    HtmlImportDetail:
      type: object
      additionalProperties: false
      required: [id, version, warehouseId, state, rowCount, selectedCount, invalidCount, unresolvedCount, mediaLinkCount, warningCount, mediaJobId, failureCode, createdAt, updatedAt, catalogTargets, equipmentTargets, sourceCandidates, plan]
      properties:
        id: { type: string, format: uuid }
