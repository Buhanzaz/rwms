        presentationId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        reservations:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/OrderUnitReservation' }
        releasedRentalItemIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        equipmentReservations:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/OrderEquipmentReservation' }
