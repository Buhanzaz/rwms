        Requires SERVICE principal maintenance-service with exactly asset.maintenance. The owner is
        restricted to MAINTENANCE_ESTIMATE:<UUID> or MAINTENANCE_REPAIR:<root-repair UUID>.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AcquireMaintenanceOperationLeaseRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/OperationLeaseCreated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/operation-leases/{id}/renew:
    parameters: [ { $ref: '#/components/parameters/LeaseId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: renewMaintenanceOperationLease
      description: Rechecks the exact maintenance owner, expected lease version and active fencing token.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RenewMaintenanceOperationLeaseRequest' } } } }
      responses:
        '200': { description: Renewed lease or original subject-bound replay., content: { application/json: { schema: { $ref: '#/components/schemas/OperationLease' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/operation-leases/{id}/release:
    parameters: [ { $ref: '#/components/parameters/LeaseId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: releaseMaintenanceOperationLease
      description: Rechecks the exact maintenance owner and returns the original response for an identical replay.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseMaintenanceOperationLeaseRequest' } } } }
      responses:
        '200': { description: Released lease or original subject-bound replay., content: { application/json: { schema: { $ref: '#/components/schemas/OperationLease' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/rental-items/{id}/snapshot:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    get:
