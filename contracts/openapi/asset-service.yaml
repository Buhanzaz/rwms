openapi: 3.1.0
info:
  title: RWMS Asset Service API
  version: 1.16.0
  description: >-
    Stage 5 canonical asset boundary plus narrow Stage 7 inventory-service and
    Stage 8 logistics-service private surfaces. Rental-item comments and
    manual-note text are readable only through this HTTP API and are never
    Kafka facts. New production databases start empty; browser fixtures and
    legacy browser state is never imported automatically. An administrator may
    explicitly review and commit a bounded server-parsed HTML registry export.
servers:
  - url: /
security:
  - bearerJwt: []
paths:
  /api/asset/v1/events:
    get:
      operationId: streamAssetWarehouseInvalidations
      description: >-
        Opens an authenticated warehouse-scoped Server-Sent Events stream.
        Events are invalidation hints only; clients re-read the affected public
        projection. A reconnect starts with a RESYNC event, so Last-Event-ID
        is accepted for diagnostics and no event history is promised.
      parameters:
        - $ref: '#/components/parameters/WarehouseIdQuery'
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Warehouse invalidation stream.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/asset/v1/rental-items:
    get:
      operationId: listRentalItems
      description: Requires USER rwms.read and warehouse VIEW access.
      parameters:
        - $ref: '#/components/parameters/WarehouseIdQuery'
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: search, in: query, schema: { type: string, maxLength: 128 } }
        - name: excludeStatus
          in: query
          description: Rental-item statuses omitted before pagination.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/RentalItemStatus' }
      responses:
        '200': { description: Page of canonical rental items, content: { application/json: { schema: { $ref: '#/components/schemas/RentalItemPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createRentalItem
      description: Requires USER rwms.write and warehouse EDIT access. Number is unique inside its warehouse, normalized, and never reusable there.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateRentalItemRequest' } } }
      responses:
        '201': { $ref: '#/components/responses/RentalItemCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
  /api/asset/v1/rental-items/available:
    get:
      operationId: listAvailableRentalItems
      description: >-
        Returns only FREE rental items that are currently available for a new booking.
        Active order reservations, presentation holds and operation leases are excluded before
        number search and pagination. Requires USER rwms.read and warehouse VIEW access.
        Presentation-hold expiry is reconciled before this authoritative read.
      parameters:
        - $ref: '#/components/parameters/WarehouseIdQuery'
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - name: search
          in: query
          description: Case-insensitive substring search over the rental-item number.
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Page of currently available canonical rental items.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalItemPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/asset/v1/rental-items/availability:
    post:
      operationId: checkRentalItemAvailability
      description: >-
        Rechecks up to 100 selected rental items against the authoritative FREE status, active
        order reservations, presentation holds and operation leases without changing state.
        Requires USER rwms.read and warehouse VIEW access for the request warehouse.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CabinAvailabilityRequest' }
      responses:
        '200':
          description: Per-rental-item availability in request order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CabinAvailabilityResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/asset/v1/rental-items/creation-options:
    get:
      operationId: getRentalItemCreationOptions
      description: >-
        Returns the active UUID-backed cabin passport choices and allowed type-to-dimension
        pairs used by rental-item and inventory creation forms. Requires USER rwms.read and
        warehouse VIEW access.
      parameters: [ { $ref: '#/components/parameters/WarehouseIdQuery' } ]
      responses:
        '200':
          description: Canonical rental-item creation choices.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalItemCreationOptions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/asset/v1/rental-item-creation-intents:
    get:
      operationId: listPendingRentalItemCreationIntents
      description: >-
        Returns a bounded page of incomplete cabin-photo creation intents for one warehouse.
        Requires USER rwms.read and warehouse VIEW access.
      parameters:
        - $ref: '#/components/parameters/WarehouseIdQuery'
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Pending intents ordered by creation time and identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalItemCreationIntentPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createRentalItemWithPhotoIntent
      description: >-
        Atomically creates a FREE rental item, a durable server-owned photo-completion intent and
        an asset-owned creation lease that excludes the cabin from availability until completion.
        The ordered 1-20 item manifest records the expected source checksum, content type and byte
        length without retaining a filename. The returned unique mediaFolderId, mediaCommandId and
        per-photo uploadCommandId values are stable on exact replay and allow the client to resume
        the same media batch after a lost response. Existing createRentalItem remains available for
        cabin creation that has no mandatory-photo workflow. Requires USER rwms.write and warehouse
        EDIT access.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRentalItemWithPhotoIntentRequest' }
      responses:
        '201':
          description: New atomic cabin and photo intent, or the exact frozen replay.
          headers:
            Idempotency-Replayed: { schema: { type: string, const: 'true' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateRentalItemWithPhotoIntentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
  /api/asset/v1/rental-item-creation-intents/{intentId}:
    get:
      operationId: getRentalItemCreationIntent
      description: Requires USER rwms.read and warehouse VIEW access for the immutable intent warehouse.
      parameters:
        - $ref: '#/components/parameters/RentalItemCreationIntentId'
      responses:
        '200':
          description: Current durable creation intent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalItemCreationIntent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/asset/v1/rental-item-creation-intents/{intentId}/complete:
    post:
      operationId: completeRentalItemCreationIntent
      description: >-
        Proves through media-service that the intent's exact active folder contains exactly the
        expected number of current READY images and a current READY cover, then completes the
        intent and releases its creation lease. The private media call occurs outside local DB
        locks; finalization rechecks expectedVersion and PENDING state transactionally.
      parameters:
        - $ref: '#/components/parameters/RentalItemCreationIntentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RentalItemCreationIntentCommand' }
      responses:
        '200':
          description: Completed intent or exact replay.
          headers:
            Idempotency-Replayed: { schema: { type: string, const: 'true' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalItemCreationIntent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
  /api/asset/v1/rental-item-creation-intents/{intentId}/abandon:
    post:
      operationId: abandonRentalItemCreationIntent
      description: >-
        Ends an incomplete intent, releases its creation lease and changes the cabin from FREE to
        the existing non-rentable WAREHOUSE status in the same transaction. The cabin and retained
        media are not deleted. Requires USER rwms.write and warehouse EDIT access.
      parameters:
        - $ref: '#/components/parameters/RentalItemCreationIntentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RentalItemCreationIntentCommand' }
      responses:
        '200':
          description: Abandoned intent or exact replay.
          headers:
            Idempotency-Replayed: { schema: { type: string, const: 'true' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalItemCreationIntent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/html-imports:
    get:
      operationId: listRentalItemHtmlImports
      description: >-
        Lists bounded legacy HTML-import records retained for controlled
        remediation. Requires USER rwms.write and warehouse EDIT access.
      parameters: [ { $ref: '#/components/parameters/WarehouseIdQuery' } ]
      responses:
        '200':
          description: Durable import drafts for the selected warehouse.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HtmlImportSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createRentalItemHtmlImport
      description: >-
        Parses one bounded HTML registry export without evaluating scripts or
        retaining raw HTML. Requires USER rwms.write and warehouse EDIT access.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [warehouseId, html]
              properties:
                warehouseId: { type: string, format: uuid }
                html: { type: string, format: binary }
      responses:
        '201':
          description: Durable parsed review draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HtmlImportDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DependencyFailure' }
  /api/asset/v1/html-imports/{id}:
    parameters: [ { $ref: '#/components/parameters/HtmlImportId' } ]
    get:
      operationId: getRentalItemHtmlImport
      description: Requires USER rwms.write and warehouse EDIT access.
      responses:
        '200':
          description: Current durable import draft and plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HtmlImportDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: cancelRentalItemHtmlImport
      description: >-
        Deletes an uncommitted HTML import draft and its normalized source
        rows. Cabins and media are not changed. Requires USER rwms.write and
        warehouse EDIT access.
      parameters:
        - name: expectedVersion
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ExpectedVersion' }
      responses:
        '204':
          description: Draft cancelled.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/html-imports/{id}/rows:
    parameters: [ { $ref: '#/components/parameters/HtmlImportId' } ]
    get:
      operationId: listRentalItemHtmlImportRows
      description: Requires USER rwms.write and warehouse EDIT access.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200':
          description: Paged normalized source rows; public photo keys are not exposed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HtmlImportRowPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/asset/v1/html-imports/{id}/plan:
    parameters: [ { $ref: '#/components/parameters/HtmlImportId' } ]
    put:
      operationId: updateRentalItemHtmlImportPlan
      description: >-
        Saves catalog, equipment, permitted manual-status and CREATE/EXCLUDE
        row decisions with optimistic concurrency. MERGE is retained only to
        render historical records and is rejected for active imports.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateHtmlImportPlanRequest' }
      responses:
        '200':
          description: Re-evaluated durable import draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HtmlImportDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/html-imports/{id}/commit:
    parameters:
      - { $ref: '#/components/parameters/HtmlImportId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: commitRentalItemHtmlImport
      description: >-
        Persists a durable COMMITTING intent, then atomically creates selected
        new cabins, staged catalogs and append-only initial-furniture receipts.
        Existing cabins are never merged or mutated. Only SALE, USED_SALE,
        FREE, WAREHOUSE and OWN_NEEDS may be imported as cabin statuses. The
        media preflight runs after the local intent has committed and is
        recovered by the server after a lost response. Only WMS_ADMIN or
        SYSTEM_ADMIN with warehouse access may commit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommitHtmlImportRequest' }
      responses:
        '202':
          description: Asset phase committed; media phase is durable and retryable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HtmlImportDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/DependencyFailure' }
        '503': { $ref: '#/components/responses/DependencyFailure' }
  /api/asset/v1/html-imports/{id}/retry-media:
    parameters:
      - { $ref: '#/components/parameters/HtmlImportId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: retryRentalItemHtmlImportMedia
      description: Retries only the media phase after the asset transaction has committed, with optimistic concurrency.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetryHtmlImportMediaRequest' }
      responses:
        '202':
          description: Current durable media phase.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HtmlImportDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/DependencyFailure' }
        '503': { $ref: '#/components/responses/DependencyFailure' }
  /api/asset/v1/html-imports/{id}/replace-media:
    parameters:
      - { $ref: '#/components/parameters/HtmlImportId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: replaceRentalItemHtmlImportMedia
      description: >-
        Replaces one or more write-only Yandex.Disk links after a failed media
        preflight and restarts only that media phase. The response and row list
        expose cabin numbers and link presence, never an existing public link.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceHtmlImportMediaRequest' }
      responses:
        '202':
          description: Corrected media sources are queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HtmlImportDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/DependencyFailure' }
        '503': { $ref: '#/components/responses/DependencyFailure' }
  /api/asset/v1/html-imports/{id}/skip-media:
    parameters:
      - { $ref: '#/components/parameters/HtmlImportId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      operationId: skipRentalItemHtmlImportMedia
      description: >-
        Finishes a terminal failed media phase with warnings; committed cabins
        remain unchanged and no media job is resumed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkipHtmlImportMediaRequest' }
      responses:
        '202':
          description: Media phase is explicitly skipped and the import is completed with warnings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HtmlImportDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/cabin-settings:
    get:
      operationId: getCabinSettings
      description: >-
        Returns all operator-managed cabin types, dimensions, finishings, characteristics and
        type-to-dimension links. Requires global catalog read permission.
      responses:
        '200':
          description: UUID-backed cabin composition settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CabinSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/asset/v1/cabin-settings/status-colors:
    get:
      operationId: getCabinStatusColors
      description: >-
        Global presentation palette for every canonical cabin status, shared by all warehouses.
        Requires USER principal and rwms.read. Colors never change lifecycle semantics.
      responses:
        '200':
          description: Complete versioned global cabin palette.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CabinStatusColors' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: replaceCabinStatusColors
      description: >-
        Replaces the entire global palette with expectedVersion fencing. Requires USER principal,
        rwms.write and SYSTEM_ADMIN or WMS_ADMIN. No warehouse-specific overrides exist.
        Missing or unknown statuses and invalid hex colors are rejected. Concurrent changes return 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceCabinStatusColorsRequest' }
      responses:
        '200':
          description: Persisted global palette and its current version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CabinStatusColors' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/cabin-settings/items:
    post:
      operationId: createCabinSettingsItem
      description: >-
        Creates one UUID-backed type, dimension, finishing or characteristic. Requires global
        catalog management and an Idempotency-Key.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCabinCatalogItemRequest' }
      responses:
        '201':
          description: Created cabin setting or the original idempotent replay.
          headers: { Idempotency-Replayed: { schema: { type: string, const: 'true' } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CabinCatalogItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/cabin-settings/items/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    put:
      operationId: updateCabinSettingsItem
      description: Renames or activates/deactivates one cabin setting with optimistic concurrency.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCabinCatalogItemRequest' }
      responses:
        '200':
          description: Updated cabin setting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CabinCatalogItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteCabinSettingsItem
      description: >-
        Deletes a cabin setting only when no existing cabin or type-to-dimension relation refers to
        it. Requires global catalog management and the item's current version.
      parameters:
        - name: expectedVersion
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ExpectedVersion' }
      responses:
        '204': { description: Deleted cabin setting. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/cabin-settings/types/{typeId}/dimensions:
    parameters: [ { name: typeId, in: path, required: true, schema: { type: string, format: uuid } } ]
    put:
      operationId: replaceCabinTypeDimensions
      description: >-
        Replaces the ordered set of dimensions allowed for one cabin type. Requires global catalog
        management and the type's current version. An empty set is accepted only when the type has
        no existing cabins.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceCabinTypeDimensionsRequest' }
      responses:
        '200':
          description: Full settings after the link replacement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CabinSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/asset/v1/rental-items/{id}:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    get:
      operationId: getRentalItem
      description: Requires USER rwms.read and the item's warehouse VIEW access.
      responses:
        '200': { description: Canonical rental-item passport, status, editable general comment and contents., content: { application/json: { schema: { $ref: '#/components/schemas/RentalItem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/asset/v1/rental-items/{id}/passport:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' } ]
    put:
      operationId: updateRentalItemPassport
