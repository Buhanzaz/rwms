        correctedWarehouseId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        evidenceLink:
          type: string
          format: uri
          minLength: 1
          maxLength: 2000
          description: Absolute HTTPS URI with a non-empty host that identifies correction evidence.
    CreateEquipmentAdministrativeCorrectionRequest:
      type: object
      additionalProperties: false
      required: [assetKind, assetId, sourceWarehouseId, sourceExpectedVersion, targetWarehouseId, targetExpectedVersion, quantity, reason, evidenceLink]
      properties:
        assetKind: { type: string, const: EQUIPMENT }
        assetId: { type: string, format: uuid }
        sourceWarehouseId: { type: string, format: uuid }
        sourceExpectedVersion: { $ref: '#/components/schemas/ExpectedVersion' }
        targetWarehouseId: { type: string, format: uuid }
        targetExpectedVersion:
          allOf: [ { $ref: '#/components/schemas/ExpectedVersion' } ]
          description: Existing target STOCK balance revision; use 0 when that balance is absent.
        quantity: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        evidenceLink:
          type: string
          format: uri
          minLength: 1
          maxLength: 2000
          description: Absolute HTTPS URI with a non-empty host that identifies correction evidence.
