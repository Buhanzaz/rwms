            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceFurnitureEquipment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/asset/v1/maintenance/rental-items/{id}/fenced-status:
    parameters: [ { $ref: '#/components/parameters/RentalItemId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
    put:
      operationId: updateMaintenanceFencedRentalItemStatus
      description: >-
        Requires the exact maintenance client/scope, matching active lease owner and fence. The request
        exposes only approved maintenance actions; asset derives and validates the source/target status.
        COMPLETE_EMPTY_REPAIR is restricted to a repair-owned lease and frees only an eligible,
        unoccupied cabin; occupied, reserved, in-flight and active-repair states are rejected.
