    LogisticsEquipmentHoldCommandRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, shipmentId, shipmentLineId]
      properties:
        expectedVersion: { $ref: '#/components/schemas/ExpectedVersion' }
        shipmentId: { type: string, format: uuid }
        shipmentLineId: { type: string, format: uuid }
    LogisticsEquipmentHold:
      type: object
      additionalProperties: false
      required: [holdId, version, state, expiresAt, committedAt]
      properties:
        holdId: { type: string, format: uuid }
        version: { $ref: '#/components/schemas/ExpectedVersion' }
        state: { type: string, enum: [ACTIVE, COMMITTED, RELEASED, EXPIRED] }
        expiresAt: { type: string, format: date-time }
        committedAt: { type: [string, 'null'], format: date-time }
    LogisticsEquipmentMovementReservationOwnerType:
      type: string
      enum: [LOGISTICS_EQUIPMENT_MOVEMENT, MAINTENANCE_DISPOSITION_MOVEMENT]
    LogisticsEquipmentMovementPurpose:
      type: string
      enum: [ALLOCATABLE_REBALANCE, TRANSFER_REBALANCE, MAINTENANCE_DISPOSITION]
      description: >-
        ALLOCATABLE_REBALANCE uses the canonical allocatable-source policy when
        order context is omitted and may use fenced physical surplus between
        active cabins of the same order when complete order context is present.
        TRANSFER_REBALANCE reserves warehouse STOCK and may execute only as a
        STOCK-to-STOCK movement between two different warehouses, without cabin
        or order context.
        MAINTENANCE_DISPOSITION must match the prepared decision fence whose
        decisionId is movementId and may consume its nested committed hold.
    AcquireLogisticsEquipmentMovementReservationRequest:
      type: object
      additionalProperties: false
      description: >-
        orderId, targetRentalItemId and units are either all null/omitted for the legacy allocatable
        source path or all present for a standard order furniture task. The latter may reserve only
        physical surplus from another active cabin of the same order and never beyond the target's
        remaining deficit; active source and inbound target holds are subtracted atomically.
        replacementSourceReservationId is accepted only to replay a movement pre-held by the
        atomic order-unit replacement effect; it can never mint a new reservation.
        TRANSFER_REBALANCE must omit every order/cabin context field and reserve source STOCK.
      required: [movementId, lineId, purpose, equipmentId, sourceWarehouseId, sourceLocationKind, expectedSourceBalanceVersion, quantity, reservedUntil]
      properties:
        movementId: { type: string, format: uuid }
        lineId: { type: string, format: uuid }
        purpose: { $ref: '#/components/schemas/LogisticsEquipmentMovementPurpose' }
        equipmentId: { type: string, format: uuid }
        sourceWarehouseId: { type: string, format: uuid }
        sourceRentalItemId: { $ref: '#/components/schemas/NullableUuid' }
        sourceLocationKind: { $ref: '#/components/schemas/BalanceLocationKind' }
        expectedSourceBalanceVersion: { $ref: '#/components/schemas/ExpectedVersion' }
        quantity: { type: integer, format: int64, minimum: 1 }
        reservedUntil: { type: string, format: date-time }
        orderId: { $ref: '#/components/schemas/NullableUuid' }
        targetRentalItemId: { $ref: '#/components/schemas/NullableUuid' }
        units:
          type: [array, 'null']
          maxItems: 100
          items: { $ref: '#/components/schemas/OrderUnitEquipmentRequirements' }
        replacementSourceReservationId:
          $ref: '#/components/schemas/NullableUuid'
    LogisticsEquipmentMovementReservationCommandRequest:
      type: object
      additionalProperties: false
      required: [expectedReservationVersion, movementId, lineId]
      properties:
        expectedReservationVersion: { $ref: '#/components/schemas/ExpectedVersion' }
        movementId: { type: string, format: uuid }
        lineId: { type: string, format: uuid }
    ExecuteLogisticsEquipmentMovementReservationLine:
      type: object
      additionalProperties: false
      required: [reservationId, expectedReservationVersion, lineId, targetWarehouseId, targetLocationKind]
      properties:
        reservationId: { type: string, format: uuid }
        expectedReservationVersion: { $ref: '#/components/schemas/ExpectedVersion' }
        lineId: { type: string, format: uuid }
        targetWarehouseId: { type: string, format: uuid }
        targetRentalItemId: { $ref: '#/components/schemas/NullableUuid' }
        targetLocationKind: { $ref: '#/components/schemas/BalanceLocationKind' }
    ExecuteLogisticsEquipmentMovementReservationsRequest:
      type: object
      additionalProperties: false
      required: [movementId, lines]
      properties:
        movementId: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ExecuteLogisticsEquipmentMovementReservationLine' }
    LogisticsEquipmentMovementReservation:
      type: object
      additionalProperties: false
      required: [reservationId, version, ownerType, movementId, lineId, equipmentId, equipmentName, sourceBalanceId, sourceWarehouseId, sourceRentalItemId, sourceLocationKind, quantity, state, reservedUntil, executedAt]
      properties:
        reservationId: { type: string, format: uuid }
        version: { $ref: '#/components/schemas/ExpectedVersion' }
        ownerType: { $ref: '#/components/schemas/LogisticsEquipmentMovementReservationOwnerType' }
        movementId: { type: string, format: uuid }
        lineId: { type: string, format: uuid }
        equipmentId: { type: string, format: uuid }
        equipmentName: { type: string, maxLength: 255 }
        sourceBalanceId: { type: string, format: uuid }
        sourceWarehouseId: { type: string, format: uuid }
        sourceRentalItemId: { $ref: '#/components/schemas/NullableUuid' }
        sourceLocationKind: { $ref: '#/components/schemas/BalanceLocationKind' }
        quantity: { type: integer, format: int64, minimum: 1 }
        state: { type: string, enum: [ACTIVE, RELEASED, EXPIRED, EXECUTED] }
        reservedUntil: { type: string, format: date-time }
        executedAt: { type: [string, 'null'], format: date-time }
    LogisticsEquipmentMovementExecutionLine:
      type: object
      additionalProperties: false
      required: [reservationId, reservationVersion, lineId, movement]
      properties:
        reservationId: { type: string, format: uuid }
        reservationVersion: { $ref: '#/components/schemas/ExpectedVersion' }
        lineId: { type: string, format: uuid }
        movement: { $ref: '#/components/schemas/Movement' }
    LogisticsEquipmentMovementExecution:
      type: object
      additionalProperties: false
      required: [movementId, lines]
      properties:
        movementId: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/LogisticsEquipmentMovementExecutionLine' }
    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    InventoryCaptureRequest:
      type: object
      additionalProperties: false
      required: [operationId, technicalAttempt, requestFingerprint, warehouseId]
      properties:
        operationId: { type: string, format: uuid }
        technicalAttempt: { type: integer, format: int64, minimum: 1 }
        requestFingerprint: { $ref: '#/components/schemas/Sha256' }
        warehouseId: { type: string, format: uuid }
    InventoryCapture:
      type: object
      additionalProperties: false
      required: [captureId, operationId, technicalAttempt, warehouseId, totalCount, membershipDigest, createdAt, expiresAt]
      properties:
        captureId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        technicalAttempt: { type: integer, format: int64, minimum: 1 }
        warehouseId: { type: string, format: uuid }
        totalCount: { type: integer, format: int64, minimum: 0 }
        membershipDigest: { $ref: '#/components/schemas/Sha256' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    InventoryCaptureMember:
      type: object
      additionalProperties: false
      required: [sequence, assetId, version, warehouseId, status, displayCanonicalNumber, identityMatchKey, passportSnapshot, contentsSnapshot]
      properties:
        sequence: { type: integer, format: int64, minimum: 0 }
        assetId: { type: string, format: uuid }
        version: { $ref: '#/components/schemas/ExpectedVersion' }
        warehouseId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RentalItemStatus' }
        displayCanonicalNumber: { type: string, minLength: 1, maxLength: 128 }
        identityMatchKey: { type: string, minLength: 1, maxLength: 128 }
        passportSnapshot: { $ref: '#/components/schemas/Passport' }
        contentsSnapshot: { type: array, items: { $ref: '#/components/schemas/EquipmentContent' } }
    InventoryCapturePage:
      type: object
      additionalProperties: false
      required: [captureId, operationId, technicalAttempt, warehouseId, totalCount, membershipDigest, content]
      properties:
        captureId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        technicalAttempt: { type: integer, format: int64, minimum: 1 }
        warehouseId: { type: string, format: uuid }
        totalCount: { type: integer, format: int64, minimum: 0 }
        membershipDigest: { $ref: '#/components/schemas/Sha256' }
        nextCursor: { type: [string, 'null'] }
        content: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/InventoryCaptureMember' } }
    InventoryAssetSnapshot:
      type: object
      additionalProperties: false
      required: [assetId, version, warehouseId, status, displayCanonicalNumber, identityMatchKey, tenantSnapshot]
      properties:
        assetId: { type: string, format: uuid }
        version: { $ref: '#/components/schemas/ExpectedVersion' }
        warehouseId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RentalItemStatus' }
        displayCanonicalNumber: { type: string }
        identityMatchKey: { type: string }
        tenantSnapshot: { type: [string, 'null'], maxLength: 512 }
    InventoryAssetCurrentSnapshot:
      type: object
      additionalProperties: false
      required: [assetId, version, warehouseId, status, displayCanonicalNumber, identityMatchKey, tenantSnapshot, passportSnapshot, contentsSnapshot]
      properties:
        assetId: { type: string, format: uuid }
        version: { $ref: '#/components/schemas/ExpectedVersion' }
        warehouseId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RentalItemStatus' }
        displayCanonicalNumber: { type: string, minLength: 1, maxLength: 128 }
        identityMatchKey: { type: string, minLength: 1, maxLength: 128 }
        tenantSnapshot: { type: [string, 'null'], maxLength: 512 }
        passportSnapshot: { $ref: '#/components/schemas/Passport' }
        contentsSnapshot: { type: array, items: { $ref: '#/components/schemas/EquipmentContent' } }
    InventoryNumberResolutionRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, number]
      properties:
        warehouseId: { type: string, format: uuid }
        number: { type: string, minLength: 1, maxLength: 128 }
    InventoryNumberResolution:
      type: object
      additionalProperties: false
      required: [displayCanonicalNumber, identityMatchKey, found]
      properties:
        displayCanonicalNumber: { type: string }
        identityMatchKey: { type: string }
        found: { type: boolean }
        asset: { oneOf: [ { $ref: '#/components/schemas/InventoryAssetSnapshot' }, { type: 'null' } ] }
    InventoryValidationRequest:
      type: object
      additionalProperties: false
      required: [assetIds]
      properties:
        assetIds: { type: array, minItems: 1, maxItems: 5000, uniqueItems: true, items: { type: string, format: uuid } }
    InventoryValidationItem:
      type: object
      additionalProperties: false
      required: [assetId, found, version, warehouseId, status, displayCanonicalNumber, identityMatchKey, tenantSnapshot, passportSnapshot, contentsSnapshot]
      properties:
        assetId: { type: string, format: uuid }
        found: { type: boolean }
        version: { type: [integer, 'null'], format: int64, minimum: 0 }
        warehouseId: { $ref: '#/components/schemas/NullableUuid' }
        status: { oneOf: [ { $ref: '#/components/schemas/RentalItemStatus' }, { type: 'null' } ] }
        displayCanonicalNumber: { type: [string, 'null'], maxLength: 128 }
        identityMatchKey: { type: [string, 'null'], maxLength: 128 }
        tenantSnapshot: { type: [string, 'null'], maxLength: 512 }
        passportSnapshot:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: 'null' }
        contentsSnapshot:
          oneOf:
            - { type: array, items: { $ref: '#/components/schemas/EquipmentContent' } }
            - { type: 'null' }
    InventoryValidation:
      type: object
      additionalProperties: false
      required: [validatedAt, validationDigest, assets]
      properties:
        validatedAt: { type: string, format: date-time }
        validationDigest: { $ref: '#/components/schemas/Sha256' }
        assets: { type: array, maxItems: 5000, items: { $ref: '#/components/schemas/InventoryValidationItem' } }
    InventoryOutcomeStatus:
      type: string
      enum: [FREE, REPAIR, CAPITAL_REPAIR, RENTED]
    InventoryOutcomeRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, assetId, inventoryCompletedAt, finalPlanVersion, finalPlanSha256, findingRevision, desiredStatus, passportObservation, passportObservationSha256, shipmentContents]
      properties:
        warehouseId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        inventoryCompletedAt: { type: string, format: date-time }
        finalPlanVersion: { type: integer, format: int64, minimum: 1 }
        finalPlanSha256: { $ref: '#/components/schemas/Sha256' }
        findingRevision: { type: integer, format: int64, minimum: 1 }
        desiredStatus: { $ref: '#/components/schemas/InventoryOutcomeStatus' }
        passportObservation: { $ref: '#/components/schemas/InventoryOutcomePassportObservation' }
        passportObservationSha256: { $ref: '#/components/schemas/Sha256' }
        shipmentContents:
          description: >-
            Required (an empty array is valid) only when desiredStatus is RENTED; strictly null for
            all other statuses. equipmentId values must be unique and name active FURNITURE catalog
            rows at the exact catalogVersion. Quantities replace cabin contents without changing STOCK.
          oneOf:
            - type: array
              maxItems: 100
              items: { $ref: '#/components/schemas/InventoryOutcomeShipmentContent' }
            - { type: 'null' }
    InventoryOutcomeShipmentContent:
      type: object
      additionalProperties: false
      required: [equipmentId, catalogVersion, quantity]
      properties:
        equipmentId: { type: string, format: uuid }
        catalogVersion: { type: integer, format: int64, minimum: 0 }
        quantity: { type: integer, format: int64, minimum: 1 }
    InventoryOutcomePassportObservation:
      oneOf:
        - type: object
          additionalProperties: false
          required: [presence, value]
          properties:
            presence: { type: string, const: ABSENT }
            value: { type: 'null' }
        - type: object
          additionalProperties: false
          required: [presence, value]
          properties:
            presence: { type: string, const: PRESENT }
            value:
              type: object
              additionalProperties: false
              required: [rentalType, dimensions, finishing, category]
              properties:
                rentalType: { type: string, minLength: 1, maxLength: 255 }
                dimensions: { type: string, minLength: 1, maxLength: 255 }
                finishing: { type: string, minLength: 1, maxLength: 255 }
                category: { type: string, minLength: 1, maxLength: 255 }
                characteristics:
                  description: >-
                    Missing or null means the exact empty set. Every string, including each array
                    element, is split on commas, trimmed and de-duplicated before exact active
                    catalogue resolution.
                  oneOf:
                    - { type: string, maxLength: 4096 }
                    - type: array
                      maxItems: 100
                      items: { type: string, maxLength: 4096 }
                    - { type: 'null' }
                linoleum:
                  description: Missing or null clears the nullable canonical value.
                  type: [boolean, 'null']
    InventoryOutcomeResponse:
      type: object
      additionalProperties: false
      required: [inventoryId, findingId, assetId, assetVersion, status, releasedOrderUnitReservationIds, releasedOperationLeaseIds, releasedPresentationHoldIds, transferSuperseded]
      properties:
        inventoryId: { type: string, format: uuid }
        findingId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        assetVersion: { $ref: '#/components/schemas/ExpectedVersion' }
        status: { $ref: '#/components/schemas/InventoryOutcomeStatus' }
        releasedOrderUnitReservationIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        releasedOperationLeaseIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        releasedPresentationHoldIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        transferSuperseded: { type: boolean }
    InventoryFurnitureSnapshotRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, assetIds]
      properties:
        warehouseId: { type: string, format: uuid }
        assetIds:
          type: array
          maxItems: 5000
          uniqueItems: true
          items: { type: string, format: uuid }
    InventoryFurnitureSnapshot:
      type: object
      additionalProperties: false
      required: [warehouseId, snapshotSha256, items]
      properties:
        warehouseId: { type: string, format: uuid }
        snapshotSha256: { $ref: '#/components/schemas/Sha256' }
        items:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/InventoryFurnitureSnapshotItem' }
    InventoryFurnitureSnapshotItem:
      type: object
      additionalProperties: false
      required: [equipmentId, catalogVersion, equipmentName, currentStockQuantity, stockBalanceVersion, cabins]
      properties:
        equipmentId: { type: string, format: uuid }
        catalogVersion: { $ref: '#/components/schemas/ExpectedVersion' }
        equipmentName: { type: string, minLength: 1, maxLength: 255 }
        currentStockQuantity: { type: integer, format: int64, minimum: 0 }
        stockBalanceVersion:
          description: >-
            Version of the physical STOCK balance used for currentStockQuantity; null only when
            this warehouse has no STOCK balance row for the active furniture catalog item.
          oneOf: [ { $ref: '#/components/schemas/ExpectedVersion' }, { type: 'null' } ]
        cabins:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/InventoryFurnitureSnapshotCabin' }
    InventoryFurnitureSnapshotCabin:
      type: object
      additionalProperties: false
      required: [assetId, assetVersion, displayCanonicalNumber, status, currentQuantity]
      properties:
        assetId: { type: string, format: uuid }
        assetVersion: { $ref: '#/components/schemas/ExpectedVersion' }
        displayCanonicalNumber: { type: string, minLength: 1, maxLength: 128 }
        status: { $ref: '#/components/schemas/RentalItemStatus' }
        currentQuantity: { type: integer, format: int64, minimum: 0 }
    InventoryFurnitureReconciliationRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, expectedSnapshotSha256, reviewSha256, items]
      properties:
        warehouseId: { type: string, format: uuid }
        expectedSnapshotSha256:
          description: >-
            Mandatory immutable source evidence and part of the permanent request fingerprint. It
            is not a live full-snapshot equality fence because cabin status/version and reviewed
            physical quantities may change before authoritative reconciliation.
          $ref: '#/components/schemas/Sha256'
        reviewSha256: { $ref: '#/components/schemas/Sha256' }
        items:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: { $ref: '#/components/schemas/InventoryFurnitureReconciliationItem' }
    InventoryFurnitureReconciliationItem:
      type: object
      additionalProperties: false
      required: [equipmentId, catalogVersion, stockQuantity, cabins]
      properties:
        equipmentId: { type: string, format: uuid }
        catalogVersion: { $ref: '#/components/schemas/ExpectedVersion' }
        stockQuantity: { type: integer, format: int64, minimum: 0 }
        cabins:
          type: array
          maxItems: 5000
          uniqueItems: true
          items: { $ref: '#/components/schemas/InventoryFurnitureReconciliationCabin' }
    InventoryFurnitureReconciliationCabin:
      type: object
      additionalProperties: false
      required: [assetId, quantity]
      properties:
        assetId: { type: string, format: uuid }
        quantity: { type: integer, format: int64, minimum: 0 }
    InventorySourceAssetRequest:
      type: object
      description: >-
        Exactly one passport representation is required. UUID fields are canonical. Legacy display
        names are a manager-client compatibility format converted by asset-service;
        characteristics is its comma-separated list of active characteristic names. A mixed or
        incomplete representation is rejected before any source identity, number claim or asset is
        persisted.
      additionalProperties: false
      required: [inventoryId, findingId, warehouseId, number, linoleum]
      oneOf:
        - required: [rentalTypeId, dimensionId, finishingId, characteristicIds]
          not:
            anyOf:
              - required: [rentalType]
              - required: [dimensions]
              - required: [finishing]
              - required: [characteristics]
        - required: [rentalType, dimensions, finishing]
          not:
            anyOf:
              - required: [rentalTypeId]
              - required: [dimensionId]
              - required: [finishingId]
              - required: [characteristicIds]
      properties:
        inventoryId: { type: string, format: uuid }
        findingId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        number: { type: string, minLength: 1, maxLength: 128 }
        rentalTypeId: { type: string, format: uuid }
        dimensionId: { type: string, format: uuid }
        finishingId: { type: string, format: uuid }
        rentalType:
          description: Legacy exact active TYPE catalogue name. Cannot be mixed with rentalTypeId.
          type: string
          minLength: 1
          maxLength: 255
        dimensions:
          description: Legacy exact active DIMENSION catalogue name. Cannot be mixed with dimensionId.
          type: string
          minLength: 1
          maxLength: 255
        finishing:
          description: Legacy exact active FINISHING catalogue name. Cannot be mixed with finishingId.
          type: string
          minLength: 1
          maxLength: 255
        category: { type: [string, 'null'], maxLength: 255 }
        characteristicIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        characteristics:
          description: Legacy comma-separated active CHARACTERISTIC catalogue names.
          type: string
          maxLength: 26000
        linoleum: { type: boolean }
        passport: { $ref: '#/components/schemas/Passport' }
        tags: { type: array, items: { type: string, minLength: 1, maxLength: 128 } }
    InventorySourceAsset:
      type: object
      additionalProperties: false
      required: [inventoryId, findingId, asset]
      properties:
        inventoryId: { type: string, format: uuid }
        findingId: { type: string, format: uuid }
        asset: { $ref: '#/components/schemas/InventoryAssetSnapshot' }
    Problem:
      type: object
      additionalProperties: true
      required: [status, code]
      properties: { status: { type: integer }, code: { type: string }, detail: { type: string }, correlation: { type: object } }
