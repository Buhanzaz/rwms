openapi: 3.1.0
info:
  title: RWMS Logistics Planner Administration API
  version: 1.1.0
  x-rwms-owner: logistics-planner-service
  x-rwms-stability: admin-catalog-v1
  description: >-
    Canonical API for the logistics planner's catalog-home vehicles, trailers and warehouse planning settings.
    Browser traffic enters only through the same-origin gateway prefix
    /api/logistics-planner/v1/admin; the gateway rewrites that prefix to the
    planner's private FastAPI implementation path /api/admin. This contract does
    not expose the Spring logistics-service operational vehicle-assignment API.
servers:
  - url: /api/logistics-planner/v1
security:
  - bearerJwt: []
tags:
  - name: Planner administration catalog
    description: SYSTEM_ADMIN-only permanent catalog-home administration.
  - name: Planner administration settings
    description: SYSTEM_ADMIN-only planning, tariffs and exceptional map policies.
paths:
  /admin/warehouses/{warehouse_id}/vehicles:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      tags: [Planner administration catalog]
      operationId: plannerAdminListVehicles
      summary: List catalog-home vehicles for one eligible warehouse
      description: >-
        Returns only vehicles whose permanent catalog home is warehouse_id. The
        warehouse UUID is the canonical warehouse-service UUID, never a
        planner-local database UUID.
      responses:
        '200':
          description: Complete administrative vehicle representations.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AdminVehicle'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '502': {$ref: '#/components/responses/DependencyFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /admin/warehouses/{warehouse_id}/vehicle-configurations:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    post:
      tags: [Planner administration catalog]
      operationId: plannerAdminCreateVehicleConfiguration
      summary: Create a vehicle and its complete axle-load profile set
      description: >-
        Requires Idempotency-Key. A replay is accepted only for the exact same
        authenticated actor, operation, canonical warehouse UUID and request
        payload; it returns the originally created vehicle and never creates a
        second catalog row.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VehicleConfigurationCreate'}
      responses:
        '201':
          description: Vehicle configuration created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminVehicle'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '502': {$ref: '#/components/responses/DependencyFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /admin/vehicles/{vehicle_id}:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    patch:
      tags: [Planner administration catalog]
      operationId: plannerAdminUpdateVehicle
      summary: Optimistically update a catalog-home vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VehiclePatch'}
      responses:
        '200':
          description: Updated vehicle with incremented version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminVehicle'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '502': {$ref: '#/components/responses/DependencyFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
    delete:
      tags: [Planner administration catalog]
      operationId: plannerAdminDeleteVehicle
      summary: Delete an unused catalog-home vehicle
      description: >-
        expected_version is mandatory. The planner takes the vehicle's driver
        shift advisory lock and rejects deletion for every DriverShift, whether
        active or retained history. It never cascades away shift history or a
        route cycle.
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204': {description: Vehicle deleted.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/VehicleDeleteConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '502': {$ref: '#/components/responses/DependencyFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /admin/vehicles/{vehicle_id}/configuration:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    put:
      tags: [Planner administration catalog]
      operationId: plannerAdminReplaceVehicleConfiguration
      summary: Atomically replace a vehicle and its axle-load profile set
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VehicleConfigurationUpdate'}
      responses:
        '200':
          description: Replaced vehicle configuration with incremented version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminVehicle'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '502': {$ref: '#/components/responses/DependencyFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /admin/vehicles/{vehicle_id}/relocate:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    post:
      tags: [Planner administration catalog]
      operationId: plannerAdminRehomeVehicle
      summary: Permanently rehome a vehicle's catalog base
      description: >-
        This is a permanent catalog-home rehome to target_warehouse_id. It is
        not a physical move, transport task, reservation, or operational
        assignment. The command takes the vehicle's shift advisory lock and
        rejects active DriverShift records and an attached default trailer.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CatalogRehomeRequest'}
      responses:
        '200':
          description: Vehicle catalog home changed and version incremented.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminVehicle'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '502': {$ref: '#/components/responses/DependencyFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /admin/warehouses/{warehouse_id}/trailers:
    parameters:
      - $ref: '#/components/parameters/WarehouseId'
    get:
      tags: [Planner administration catalog]
      operationId: plannerAdminListTrailers
      summary: List catalog-home trailers for one eligible warehouse
      responses:
        '200':
          description: Complete administrative trailer representations.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AdminTrailer'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '502': {$ref: '#/components/responses/DependencyFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
    post:
      tags: [Planner administration catalog]
      operationId: plannerAdminCreateTrailer
      summary: Create a catalog-home trailer
      description: >-
        Requires Idempotency-Key. A replay is accepted only for the exact same
        authenticated actor, operation, canonical warehouse UUID and request
        payload; it returns the originally created trailer without another write.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TrailerCreate'}
      responses:
        '201':
          description: Trailer created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminTrailer'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '502': {$ref: '#/components/responses/DependencyFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /admin/trailers/{trailer_id}:
    parameters:
      - $ref: '#/components/parameters/TrailerId'
    patch:
      tags: [Planner administration catalog]
      operationId: plannerAdminUpdateTrailer
      summary: Optimistically update a catalog-home trailer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TrailerPatch'}
      responses:
        '200':
          description: Updated trailer with incremented version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminTrailer'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '502': {$ref: '#/components/responses/DependencyFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
    delete:
      tags: [Planner administration catalog]
      operationId: plannerAdminDeleteTrailer
      summary: Delete an unassigned catalog-home trailer
      description: >-
        expected_version is mandatory. The planner takes the trailer-assignment
        advisory lock and rejects a trailer selected as any vehicle's default;
        it never relies on the database SET NULL action for this command.
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204': {description: Trailer deleted.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/TrailerDeleteConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '502': {$ref: '#/components/responses/DependencyFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /admin/trailers/{trailer_id}/relocate:
    parameters:
      - $ref: '#/components/parameters/TrailerId'
    post:
      tags: [Planner administration catalog]
      operationId: plannerAdminRehomeTrailer
      summary: Permanently rehome a trailer's catalog base
      description: >-
        This is a permanent catalog-home rehome, not a physical operational
        relocation. The trailer-assignment advisory lock rejects a trailer that
        remains any vehicle's default.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CatalogRehomeRequest'}
      responses:
        '200':
          description: Trailer catalog home changed and version incremented.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminTrailer'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '502': {$ref: '#/components/responses/DependencyFailure'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /admin/warehouses/{warehouse_id}/planning-settings:
    get:
      operationId: plannerAdminGetPlanningSettings
      parameters:
      - in: path
        name: warehouse_id
        required: true
        schema:
          format: uuid
          title: Warehouse Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPlanningSettingsRead'
          description: Successful Response
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/DependencyFailure'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
      security:
      - bearerJwt: []
      summary: Get Planning Settings
      tags:
      - Planner administration settings
      description: SYSTEM_ADMIN only, using the isolated rwms-admin-web client and admin.manage scope. warehouse_id is
        the canonical warehouse-service UUID. Representative warehouses retain their own configuration. Returns the
        owning planner configuration and effective defaults; an unconfigured workspace is an explicit error.
    put:
      description: SYSTEM_ADMIN only, using the isolated rwms-admin-web client and admin.manage scope. warehouse_id is
        the canonical warehouse-service UUID. Representative warehouses retain their own configuration. Replaces the
        observed settings and contiguous tariff ladder atomically with expected_version. Publishes capacity after
        commit and reports its actual outcome.
      operationId: plannerAdminReplacePlanningSettings
      parameters:
      - in: path
        name: warehouse_id
        required: true
        schema:
          format: uuid
          title: Warehouse Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPlanningSettingsUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPlanningSettingsRead'
          description: Successful Response
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/DependencyFailure'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerJwt: []
      summary: Replace Planning Settings
      tags:
      - Planner administration settings
  /admin/warehouses/{warehouse_id}/policy-zones:
    get:
      operationId: plannerAdminListPolicyZones
      parameters:
      - in: path
        name: warehouse_id
        required: true
        schema:
          format: uuid
          title: Warehouse Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AdminPolicyZoneRead'
                title: Response Planneradminlistpolicyzones
                type: array
          description: Successful Response
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/DependencyFailure'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
      security:
      - bearerJwt: []
      summary: List Admin Policy Zones
      tags:
      - Planner administration settings
      description: 'SYSTEM_ADMIN only, using the isolated rwms-admin-web client and admin.manage scope. warehouse_id is
        the canonical warehouse-service UUID. Policies apply only inside the ordinary isochrone limit. Mutations retain
        the existing owner validation, version fencing, mutable-plan invalidation and capacity publication. '
    post:
      description: SYSTEM_ADMIN only, using the isolated rwms-admin-web client and admin.manage scope. warehouse_id is
        the canonical warehouse-service UUID. Policies apply only inside the ordinary isochrone limit. Mutations retain
        the existing owner validation, version fencing, mutable-plan invalidation and capacity publication. Requires
        Idempotency-Key; an identical actor and payload replay returns the original polygon.
      operationId: plannerAdminCreatePolicyZone
      parameters:
      - in: path
        name: warehouse_id
        required: true
        schema:
          format: uuid
          title: Warehouse Id
          type: string
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 200
          minLength: 1
          pattern: ^[\x21-\x7e]+$
          title: Idempotency-Key
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyZoneCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPolicyZoneRead'
          description: Successful Response
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/DependencyFailure'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerJwt: []
      summary: Create Admin Policy Zone
      tags:
      - Planner administration settings
  /admin/warehouses/{warehouse_id}/policy-zones/{zone_id}:
    delete:
      operationId: plannerAdminDeletePolicyZone
      parameters:
      - in: path
        name: warehouse_id
        required: true
        schema:
          format: uuid
          title: Warehouse Id
          type: string
      - in: path
        name: zone_id
        required: true
        schema:
          format: uuid
          title: Zone Id
          type: string
      - in: query
        name: expected_version
        required: true
        schema:
          minimum: 1
          title: Expected Version
          type: integer
      responses:
        '204':
          description: Successful Response
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/DependencyFailure'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerJwt: []
      summary: Delete Admin Policy Zone
      tags:
      - Planner administration settings
      description: 'SYSTEM_ADMIN only, using the isolated rwms-admin-web client and admin.manage scope. warehouse_id is
        the canonical warehouse-service UUID. Policies apply only inside the ordinary isochrone limit. Mutations retain
        the existing owner validation, version fencing, mutable-plan invalidation and capacity publication. '
    patch:
      operationId: plannerAdminUpdatePolicyZone
      parameters:
      - in: path
        name: warehouse_id
        required: true
        schema:
          format: uuid
          title: Warehouse Id
          type: string
      - in: path
        name: zone_id
        required: true
        schema:
          format: uuid
          title: Zone Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyZoneUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPolicyZoneRead'
          description: Successful Response
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/DependencyFailure'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerJwt: []
      summary: Update Admin Policy Zone
      tags:
      - Planner administration settings
      description: 'SYSTEM_ADMIN only, using the isolated rwms-admin-web client and admin.manage scope. warehouse_id is
        the canonical warehouse-service UUID. Policies apply only inside the ordinary isochrone limit. Mutations retain
        the existing owner validation, version fencing, mutable-plan invalidation and capacity publication. '
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Only an interactive USER token with client_id rwms-admin-web,
        global_role SYSTEM_ADMIN, audience rwms-services, and exactly the
        business scope admin.manage after removing openid, profile and
        offline_access is authorized. WMS_ADMIN is explicitly rejected.
  parameters:
    WarehouseId:
      name: warehouse_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    VehicleId:
      name: vehicle_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    TrailerId:
      name: trailer_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    ExpectedVersion:
      name: expected_version
      in: query
      required: true
      schema: {$ref: '#/components/schemas/ExpectedVersion'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: '^[\x21-\x7e]+$'
  responses:
    Unauthorized:
      description: Missing, malformed, expired, or invalid Bearer token (AUTHENTICATION_REQUIRED).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: >-
        ACCESS_DENIED: the caller is not rwms-admin-web SYSTEM_ADMIN, has a
        business scope other than exactly admin.manage, or is WMS_ADMIN.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: >-
        CATALOG resource, canonical warehouse, or local planner warehouse is
        absent (for example VEHICLE_NOT_FOUND, TRAILER_NOT_FOUND,
        CANONICAL_WAREHOUSE_NOT_FOUND, WAREHOUSE_NOT_CONFIGURED_FOR_LOGISTICS).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: >-
        A stable domain conflict such as CATALOG_VERSION_CONFLICT, duplicate
        registration, idempotency payload mismatch,
        CATALOG_RELOCATION_TARGET_UNCHANGED,
        VEHICLE_HAS_ACTIVE_SHIFTS, VEHICLE_HAS_DEFAULT_TRAILER, or
        TRAILER_IS_DEFAULT_FOR_VEHICLE.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    VehicleDeleteConflict:
      description: >-
        CATALOG_VERSION_CONFLICT, VEHICLE_HAS_ACTIVE_SHIFTS (with shift_id), or
        VEHICLE_HAS_LINKED_SHIFTS (with shift_id). The latter covers inactive,
        historical, and route-cycle-retained shifts.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    TrailerDeleteConflict:
      description: >-
        CATALOG_VERSION_CONFLICT or TRAILER_IS_DEFAULT_FOR_VEHICLE (with
        vehicle_id).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationFailed:
      description: >-
        Request schema validation uses FastAPI's application/json validation
        body; domain validation uses an RFC 9457 Problem Details body.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RequestValidationError'}
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    DependencyFailure:
      description: A required canonical RWMS dependency failed (5xx Problem Details).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    DependencyUnavailable:
      description: A required planner dependency is unavailable (5xx Problem Details).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Uuid:
      type: string
      format: uuid
    ExpectedVersion:
      type: integer
      minimum: 1
    NonBlankString:
      type: string
      minLength: 1
    NullablePositiveInteger:
      type: [integer, 'null']
      minimum: 1
    NullableString:
      type: [string, 'null']
    NullableBoolean:
      type: [boolean, 'null']
    VehicleLoadProfile:
      type: object
      additionalProperties: false
      required: [configuration_type, max_actual_axle_load_kg]
      properties:
        configuration_type:
          type: string
          enum:
            - EMPTY_TRUCK
            - CARGO_ON_TRUCK
            - EMPTY_COMBINATION
            - CARGO_ON_TRUCK_WITH_TRAILER
            - CARGO_ON_TRAILER_WITH_TRAILER
            - TWO_CARGO_SPLIT
        max_actual_axle_load_kg: {type: integer, minimum: 1}
    VehicleCreate:
      type: object
      additionalProperties: false
      required: [name, registration_number]
      properties:
        name: {$ref: '#/components/schemas/NonBlankString'}
        registration_number: {$ref: '#/components/schemas/NonBlankString'}
