openapi: 3.1.0
info:
  title: RWMS Maintenance Service API
  version: 2.0.0
  x-rwms-owner: maintenance-service
  x-rwms-stability: approved-stage-7-maintenance-v2
  description: >-
    Stage 6 canonical maintenance boundary plus the approved Stage 7 private
    inventory plan-freeze and permanent repair-source upsert for immutable repair catalogs,
    estimates, primary/direct repairs, reworks, acceptance, maintenance
    write-off decisions and warehouse repair-capacity settings. Estimates and
    repairs are warehouse-scoped, while one global versioned catalog owns all
    categories, works and materials. The public catalog boundary has no warehouse
    selector; a retained warehouseId is immutable internal audit context only. Business text is service-local and
    is never copied to Kafka facts. Locally committed
    commands return 200 with delivery state even while downstream delivery is
    pending; they never return 202 and are never rolled back for broker outage.
servers:
  - url: /
security:
  - bearerJwt: []
tags:
  - { name: Catalog }
  - { name: Estimates }
  - { name: Repairs }
  - { name: Decisions }
  - { name: Settings }
  - { name: Inventory Integration }
paths:
  /api/maintenance/v1/catalog/versions:
    get:
      tags: [Catalog]
      operationId: listCatalogVersions
      description: >-
        Returns the single global catalog history without a warehouse selector. Requires USER
        and rwms.read; the result never filters or clones catalog data by warehouse.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: lifecycle
          in: query
          schema: { $ref: '#/components/schemas/CatalogLifecycle' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200': { description: Catalog versions., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogVersionPage' } } } }
        '304': { description: Requested catalog-version page has not changed., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, ETag: { $ref: '#/components/headers/ETag' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Catalog]
      operationId: createCatalogVersion
      description: >-
        Requires a SYSTEM_ADMIN/WMS_ADMIN USER with rwms.write. Creates the first empty global
        ACTIVE catalog-builder version without accepting a warehouse. If a global active version
        already exists, that same version is returned idempotently; no catalog is copied and no
        packaged or browser-owned legacy data is imported.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '201': { description: Created or replayed catalog version., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/maintenance/v1/catalog/versions/{id}:
    parameters:
      - { $ref: '#/components/parameters/CatalogVersionId' }
    put:
      tags: [Catalog]
      operationId: replaceCatalog
      description: >-
        Atomically replaces nodes and links in the global catalog without a warehouse selector.
        Requires a SYSTEM_ADMIN/WMS_ADMIN USER with rwms.write. The current ACTIVE catalog and historical DRAFT versions may change
        with optimistic locking; SUPERSEDED versions are immutable.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceCatalogRequest' } } } }
      responses:
        '200': { description: Changed catalog., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/maintenance/v1/catalog/versions/{id}/nodes:
    parameters:
      - { $ref: '#/components/parameters/CatalogVersionId' }
    get:
      tags: [Catalog]
      operationId: listCatalogNodes
      description: Requires USER and rwms.read; no warehouse selector is accepted.
      responses:
        '200':
          description: Nodes in the selected catalog version.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CatalogNode' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Catalog]
      operationId: replaceCatalogNodes
      description: >-
        Requires a SYSTEM_ADMIN/WMS_ADMIN USER with rwms.write. The current ACTIVE catalog and
        historical DRAFT versions may change with optimistic locking; SUPERSEDED versions are
        immutable.
        A MATERIAL below a furnitureCategory may omit furnitureEquipment: maintenance-service then
        first commits a durable node-UUID/name intent, then idempotently ensures the asset-service
        additional-equipment item outside the catalog transaction and stores the returned immutable
        mapping. Dependency failure or catalog conflict commits no catalog change but retains
        inspectable retryable/confirmed link truth; it never deletes an already-created item.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceCatalogNodesRequest' } } } }
      responses:
        '200': { description: Changed catalog., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/maintenance/v1/catalog/versions/{id}/links:
    parameters:
      - { $ref: '#/components/parameters/CatalogVersionId' }
    get:
      tags: [Catalog]
      operationId: listCatalogLinks
      description: Requires USER and rwms.read; no warehouse selector is accepted.
      responses:
        '200':
          description: Links in the selected catalog version.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CatalogLink' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Catalog]
      operationId: replaceCatalogLinks
      description: >-
        Requires a SYSTEM_ADMIN/WMS_ADMIN USER with rwms.write. The current ACTIVE catalog and
        historical DRAFT versions may change with optimistic locking; SUPERSEDED versions are
        immutable.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceCatalogLinksRequest' } } } }
      responses:
        '200': { description: Changed catalog., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
  /api/maintenance/v1/catalog/versions/{id}/fork:
    parameters:
      - { $ref: '#/components/parameters/CatalogVersionId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Catalog]
      operationId: forkCatalogVersion
      description: >-
        Requires a SYSTEM_ADMIN/WMS_ADMIN USER with rwms.write. Copies the exact immutable
        catalog-builder snapshot of an ACTIVE or SUPERSEDED version into a new DRAFT using
        optimistic source expectedVersion; published source rows remain immutable.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExpectedVersionRequest' } } } }
      responses:
        '201': { description: Created or replayed DRAFT fork., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
  /api/maintenance/v1/catalog/furniture-equipment-links:
    get:
      tags: [Catalog]
      operationId: listFurnitureEquipmentLinks
      description: >-
        SYSTEM_ADMIN/WMS_ADMIN only. Lists durable maintenance-owned auto-link intent,
        retry, confirmed and reviewed terminal truth globally. A node UUID is
        the permanent asset-service external reference; confirmed mappings do not depend on the
        generic idempotency retention window.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/FurnitureEquipmentLinkState' }
      responses:
        '200': { description: Durable furniture equipment link page., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/FurnitureEquipmentLinkPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/maintenance/v1/catalog/furniture-equipment-links/{nodeId}/review:
    parameters:
      - name: nodeId
        in: path
        required: true
        description: Stable maintenance catalog node UUID and asset external reference.
        schema: { type: string, format: uuid }
    post:
      tags: [Catalog]
      operationId: reviewFurnitureEquipmentLink
      description: >-
        SYSTEM_ADMIN/WMS_ADMIN only. Version-fenced review either retries bounded reconciliation
        after the underlying conflict is corrected or abandons the local intent. Every accepted
        review and reason is immutable. Abandon never deletes or remaps asset equipment.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FurnitureEquipmentLinkReviewRequest' }
      responses:
        '200':
          description: Reviewed link truth or exact replay of the accepted review.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FurnitureEquipmentLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/maintenance/v1/catalog/versions/{id}/activate:
    parameters:
      - { $ref: '#/components/parameters/CatalogVersionId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Catalog]
      operationId: activateCatalogVersion
      description: >-
        Requires a SYSTEM_ADMIN/WMS_ADMIN USER with rwms.write. Before any local mutation,
        maintenance-service verifies global queue-definition ID/type snapshots through the
        private task-board preflight. Activation uses a global CAS, supersedes the single
        previous active version
        atomically and stores durable CATALOG_POSITION registration/cleanup intents in that same
        transaction. Cleanup of superseded references waits for all replacement registrations.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExpectedVersionRequest' } } } }
      responses:
        '200': { description: Active catalog version., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/internal/maintenance/v1/inventory/dispositions:
    post:
      tags: [Internal]
      operationId: createInventoryLossDisposition
      description: >-
        Exact inventory-service boundary requiring sub=client_id=inventory-service
        and exactly maintenance.inventory. Records one PENDING_APPROVAL LOSS
        decision for each inventory shortage; inventory completion never mutates
        asset balances directly and retries by the stable inventory/finding ID.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateInventoryLossDispositionRequest' } } } }
      responses:
        '200': { description: Existing idempotent loss decision., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyDispositionDecision' } } } }
        '201': { description: Newly recorded loss decision awaiting administrator approval., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyDispositionDecision' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/maintenance/v1/inventory/cabin-write-offs:
    post:
      tags: [Internal]
      operationId: createInventoryCabinWriteOff
      description: >-
        Exact inventory-service boundary requiring sub=client_id=inventory-service
        and exactly maintenance.inventory. Records one PENDING_APPROVAL WRITE_OFF
        decision for a cabin that remained missing after the inventory shipment
        review. Maintenance reads and freezes the current cabin contents itself as
        DISPOSE_WITH_CABIN evidence; neither inventory-service nor the browser
        fabricates asset balance versions. The cabin remains non-terminal until an
        administrator approves the existing disposition saga.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateInventoryCabinWriteOffRequest' } } } }
      responses:
        '200': { description: Existing idempotent cabin write-off decision., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyDispositionDecision' } } } }
        '201': { description: Newly recorded cabin write-off decision awaiting administrator approval., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyDispositionDecision' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/internal/maintenance/v1/inventory/plans:
    post:
      tags: [Inventory Integration]
      operationId: freezeInventoryRepairPlan
      description: >-
        Private direct-service boundary. Requires principal_type=SERVICE,
        sub=client_id=inventory-service, audience rwms-services and exactly the
        maintenance.inventory scope. AUTO resolves against the active warehouse
        catalog; MANUAL validates the submitted order. The permanent source key is
        inventoryId:findingId:sourceRevision: each inspection revision replays its
        own immutable historical result and never adopts a later catalog.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FreezeInventoryPlanRequest' } } } }
      responses:
        '200': { description: Immutable maintenance-issued inventory plan., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/FrozenInventoryPlan' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
  /api/internal/maintenance/v1/inventory/repair-snapshots:
    post:
      tags: [Inventory Integration]
      operationId: getInventoryRepairSnapshots
      description: >-
        Private exact maintenance.inventory SERVICE boundary. Returns all
        maintenance-owned repairs for each requested rental-item identity. The
        stable plan fingerprint covers only ordered stage kind, routing, work,
        material, primary-line and group-comment semantics; technical versions,
        timestamps, task synchronization and delivery state are excluded.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryRepairSnapshotRequest' } } } }
      responses:
        '200': { description: Current semantic repair snapshots grouped by rental item., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryRepairSnapshots' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/maintenance/v1/inventory/sources/{inventoryId}/findings/{findingId}:
    parameters:
      - { name: inventoryId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: findingId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Inventory Integration]
      operationId: upsertInventoryRepairSource
      description: >-
        Private exact maintenance.inventory SERVICE boundary. Binds the permanent
        inventoryId:findingId:sourceRevision source to one INVENTORY repair only
        when the exact historical snapshot/fingerprint and current asset
        preconditions match.
        Identical replay returns that repair. Maintenance alone acquires the asset
        lease/fence and synchronizes task-board through durable reconciliation.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpsertInventoryRepairRequest' } } } }
      responses:
        '200': { description: Created or replayed inventory-origin repair., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryRepairUpsertResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/internal/maintenance/v1/inventory/reconciliations/preflight:
    post:
      tags: [Inventory Integration]
      operationId: preflightInventoryPublicationReconciliation
      description: >-
        Private exact maintenance.inventory SERVICE boundary. Validates the completed inventory
        evidence without mutating maintenance state and targets every accepted non-terminal
        current status as REPAIR. Each work finding has an empty candidates array because the
        latest completed inventory is authoritative and no active estimate/repair requires a
        caller-selected merge or replacement decision.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryPublicationPreflightRequest' } } } }
      responses:
        '200': { description: Immutable work-finding identities with no collision candidates., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryPublicationPreflightResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/internal/maintenance/v1/inventory/reconciliations/{inventoryId}/findings/{findingId}:
    parameters:
      - { name: inventoryId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: findingId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    put:
      tags: [Inventory Integration]
      operationId: applyInventoryPublicationReconciliation
      description: >-
        Private exact maintenance.inventory SERVICE boundary. The latest immutable completed
        inventory source is authoritative for this asset: maintenance durably cancels or
        supersedes every non-terminal predecessor estimate, repair, task, driver movement, lease
        and repair-place guard, then materializes exactly one full frozen REPAIR target. Historical
        CREATE, REPLACE and MERGE selections remain accepted as immutable source evidence but do
        not weaken full replacement semantics. Terminal accepted/written-off truth and stale,
        ambiguous or cross-warehouse source ordering fail before an external effect. A completed
        Idempotency-Key replays its frozen response; a new key for the same immutable source
        re-discovers and supersedes later non-terminal predecessors while preserving the exact
        source repair and never creating a duplicate.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryPublicationApplyRequest' } } } }
      responses:
        '200': { description: Created or idempotently replayed completed-inventory publication., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryPublicationApplyResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/internal/maintenance/v1/inventory/outcomes/{inventoryId}/findings/{findingId}/no-work:
    parameters:
      - { name: inventoryId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: findingId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    put:
      tags: [Inventory Integration]
      operationId: applyInventoryNoWorkOutcome
      description: >-
        Private exact maintenance.inventory SERVICE boundary. Applies the latest completed FREE
        finding without creating an estimate or repair. All non-terminal maintenance predecessors
        and their owned external effects are durably superseded while every row, stage, evidence,
        media reference and event remains audit history. A completed Idempotency-Key replays; a
        new key for the same immutable source re-discovers and supersedes later predecessors. An
        older source or a different source at the same completion time is rejected.
