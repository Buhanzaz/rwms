      properties:
        version: { type: integer, format: int64, minimum: 0 }
        lightColor: { type: string, pattern: '^#[0-9A-F]{6}$' }
        mediumColor: { type: string, pattern: '^#[0-9A-F]{6}$' }
        complexColor: { type: string, pattern: '^#[0-9A-F]{6}$' }
        capitalColor: { type: string, pattern: '^#[0-9A-F]{6}$' }
        updatedAt: { type: string, format: date-time }
    TransferRepairRequest:
      type: object
      additionalProperties: false
      required: [rentalItemId, sourceWarehouseId, targetWarehouseId]
      properties:
        rentalItemId: { type: string, format: uuid }
        sourceWarehouseId: { type: string, format: uuid }
        targetWarehouseId: { type: string, format: uuid }
    PrepareTransferRepairResult:
      type: object
      additionalProperties: false
      required: [activeRepairId, activeRepairVersion, assetStatus]
      properties:
        activeRepairId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        activeRepairVersion:
          oneOf: [ { type: integer, format: int64, minimum: 0 }, { type: 'null' } ]
        assetStatus: { enum: [FREE, REPAIR] }
    TransferRepairArrivalPreflight:
      type: object
      additionalProperties: false
      required: [activeRepairId, priorityRequired, missingQueueDefinitionIds]
      properties:
        activeRepairId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        priorityRequired: { type: boolean }
        missingQueueDefinitionIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
    CompleteTransferRepairRequest:
      type: object
      additionalProperties: false
      required: [rentalItemId, rentalItemVersion, sourceWarehouseId, targetWarehouseId, priority]
      properties:
        rentalItemId: { type: string, format: uuid }
        rentalItemVersion: { type: integer, format: int64, minimum: 0 }
        sourceWarehouseId: { type: string, format: uuid }
        targetWarehouseId: { type: string, format: uuid }
        priority:
          description: Existing maintenance priority selected by the target-warehouse receiver.
          oneOf:
            - { type: integer, minimum: 1, maximum: 5 }
            - { type: 'null' }
    CompleteTransferRepairResult:
      type: object
      additionalProperties: false
      required: [activeRepairId, repairVersion, warehouseId]
      properties:
        activeRepairId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        repairVersion:
          oneOf: [ { type: integer, format: int64, minimum: 0 }, { type: 'null' } ]
        warehouseId: { type: string, format: uuid }
    ActorSnapshot:
      description: Opaque local audit snapshot; login and display name are forbidden.
      type: object
      additionalProperties: false
      required: [actorId, actorType]
      properties:
        actorId: { type: string, minLength: 1, maxLength: 128 }
        actorType: { enum: [USER, SERVICE] }
    MediaReference:
      description: >-
        Opaque READY media generation from the maintenance-owned media inbox
        projection. Signed URLs and object keys are never persisted here.
      type: object
      additionalProperties: false
      required: [mediaId, generation]
      properties:
        mediaId: { type: string, format: uuid }
        generation: { type: integer, minimum: 0 }
      x-rwms-approved-owner-types:
        - MAINTENANCE_ESTIMATE
        - MAINTENANCE_REPAIR
        - MAINTENANCE_ACCEPTANCE
        - INVENTORY_FINDING
    RepairWorkerEvidence:
      type: object
      additionalProperties: false
      required: [evidenceId, repairId, stageId, stageIndex, entryId, taskId, routeIndex, workerId, workerGroupId, mediaId, mediaGeneration, capturedAt, recordedAt, state]
      properties:
        evidenceId: { type: string, format: uuid }
        repairId: { type: string, format: uuid }
        stageId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        stageIndex: { type: integer, minimum: 0 }
        entryId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        routeIndex: { type: integer, minimum: 0 }
        workerId: { type: string, format: uuid }
        workerGroupId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        mediaId: { type: string, format: uuid }
        mediaGeneration: { type: integer, format: int64, minimum: 1 }
        capturedAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        state: { enum: [READY, REVIEW_REQUIRED] }
    Money:
      type: string
      pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]{2})$'
      examples: ['1250.00']
    DecimalQuantity:
      type: string
      pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]{1,3})?$'
      examples: ['2.5']
    InventoryQuantityInput:
      type: string
      pattern: '^(?:0|[1-9][0-9]{0,13})(?:\.[0-9]{1,3})?$'
      examples: ['2.5']
    InventoryQuantitySnapshot:
      type: string
      pattern: '^(?:0|[1-9][0-9]{0,13})\.[0-9]{6}$'
      examples: ['2.500000']
    CatalogCounts:
      type: object
      additionalProperties: false
      required: [nodes, links]
      properties:
        nodes: { type: integer, minimum: 0 }
        links: { type: integer, minimum: 0 }
    CatalogValidationReport:
      type: object
      additionalProperties: false
      required: [valid, errorCount, warningCount, reportSha256]
      properties:
        valid: { type: boolean }
        errorCount: { type: integer, minimum: 0 }
        warningCount: { type: integer, minimum: 0 }
        reportSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    CatalogRoutingSync:
      description: >-
        Durable maintenance-owned delivery truth for task-board CATALOG_POSITION references.
        Cleanup is not attempted until every registration predecessor for the replacement and
        superseded versions is confirmed.
      type: object
      additionalProperties: false
      required: [state, registrationsRequired, registrationsConfirmed, cleanupRequired, cleanupConfirmed, attempts, updatedAt]
      properties:
        state: { $ref: '#/components/schemas/DeliveryState' }
        registrationsRequired: { type: integer, minimum: 0 }
        registrationsConfirmed: { type: integer, minimum: 0 }
        cleanupRequired: { type: integer, minimum: 0 }
        cleanupConfirmed: { type: integer, minimum: 0 }
        attempts: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }
    CatalogVersion:
      type: object
      additionalProperties: false
      required: [id, warehouseId, version, lifecycle, sourceSha256, counts, validation, createdAt, routingSync]
      properties:
        id: { type: string, format: uuid }
        warehouseId:
          description: >-
            Immutable creation/audit context only. It does not scope visibility or ownership;
            every warehouse consumes this same global catalog version.
          type: string
          format: uuid
        version: { type: integer, format: int64, minimum: 0 }
        lifecycle: { $ref: '#/components/schemas/CatalogLifecycle' }
        sourceSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        counts: { $ref: '#/components/schemas/CatalogCounts' }
        validation: { $ref: '#/components/schemas/CatalogValidationReport' }
        createdAt: { type: string, format: date-time }
        activatedAt:
          oneOf: [ { type: string, format: date-time }, { type: 'null' } ]
        routingSync:
          oneOf:
            - $ref: '#/components/schemas/CatalogRoutingSync'
            - type: 'null'
    CatalogVersionPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CatalogVersion' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
