        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
    CatalogRoutingInput:
      description: Queue selected by UUID and declared type. Task-board preflight supplies its name.
      type: object
      additionalProperties: false
      required: [queueId, queueType]
      properties:
        queueId: { type: string, format: uuid }
        queueType: { type: string, minLength: 1, maxLength: 64 }
    RoutingSnapshot:
      description: >-
        Immutable global task-board queue-definition snapshot. queueName is display data only;
        all routing resolves queueId to a target-warehouse binding.
      type: object
      additionalProperties: false
      required: [queueId, queueName, queueType]
      properties:
        queueId: { type: string, format: uuid }
        queueName: { type: string, minLength: 1, maxLength: 255 }
        queueType: { type: string, minLength: 1, maxLength: 64 }
    FurnitureEquipmentReference:
      description: >-
        Asset-service-owned additional-equipment setting. Catalog reads enrich its live version and
        maximum; an input may use null identity/version only while creating a new furniture node.
        This is never a cross-database foreign key.
      type: object
      additionalProperties: false
      required: [equipmentId, equipmentName, equipmentVersion, maximumPerCabin]
      properties:
        equipmentId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        equipmentName: { type: string, minLength: 1, maxLength: 255 }
        equipmentVersion:
          oneOf: [ { type: integer, format: int64, minimum: 0 }, { type: 'null' } ]
        maximumPerCabin:
          oneOf: [ { type: integer, minimum: 1 }, { type: 'null' } ]
    CabinCharacteristicReference:
      description: >-
        Immutable display snapshot of an asset-service cabin characteristic. The UUID remains
        authoritative and is applied idempotently only after successful repair acceptance.
      type: object
      additionalProperties: false
      required: [characteristicId, characteristicName]
      properties:
        characteristicId: { type: string, format: uuid }
        characteristicName: { type: string, minLength: 1, maxLength: 255 }
    CatalogNodeInput:
      type: object
      additionalProperties: false
      allOf:
        - if:
            properties:
              nodeType: { const: WORK }
            required: [nodeType]
          then:
            properties:
              durationMinutes: { minimum: 1 }
      required: [id, nodeType, name, active, durationMinutes, unitPrice, routing]
      properties:
        id: { type: string, format: uuid }
        nodeType: { $ref: '#/components/schemas/CatalogNodeType' }
        name: { type: string, minLength: 1, maxLength: 255 }
        active: { type: boolean }
        parentNodeId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        furnitureCategory:
          type: boolean
          default: false
          description: Marks this category and its descendants as the Furniture material view.
        furnitureEquipment:
          oneOf: [ { $ref: '#/components/schemas/FurnitureEquipmentReference' }, { type: 'null' } ]
        unit:
          oneOf: [ { type: string, minLength: 1, maxLength: 32 }, { type: 'null' } ]
        unitPrice:
          oneOf: [ { $ref: '#/components/schemas/Money' }, { type: 'null' } ]
        durationMinutes: { type: integer, minimum: 0, maximum: 525600 }
        includeInEstimate: { type: boolean, default: true }
        commonItem: { type: boolean, default: false }
        showInMainMenu: { type: boolean, default: false }
        canvasX:
          oneOf: [ { type: integer }, { type: 'null' } ]
        canvasY:
          oneOf: [ { type: integer }, { type: 'null' } ]
        routing:
          oneOf: [ { $ref: '#/components/schemas/CatalogRoutingInput' }, { type: 'null' } ]
        comment:
          description: Service-local catalog text for non-MATERIAL nodes. MATERIAL is always null.
          oneOf: [ { type: string, maxLength: 2000 }, { type: 'null' } ]
        displayColor:
          description: Optional catalog-button color shared by panel and mobile clients.
