openapi: 3.1.0
info:
  title: RWMS Maintenance Service API
  version: 2.0.0
  x-rwms-owner: maintenance-service
  x-rwms-stability: approved-stage-7-maintenance-v2
  description: >-
    Stage 6 canonical maintenance boundary plus the approved Stage 7 private
    inventory plan-freeze and permanent repair-source upsert for immutable repair catalogs,
    estimates, primary/direct repairs, reworks, acceptance, maintenance
    write-off decisions and warehouse repair-capacity settings. Estimates and
    repairs are warehouse-scoped, while one global versioned catalog owns all
    categories, works and materials. A catalog version's warehouseId is immutable
    creation/audit context only. Business text is service-local and
    is never copied to Kafka facts. Locally committed
    commands return 200 with delivery state even while downstream delivery is
    pending; they never return 202 and are never rolled back for broker outage.
servers:
  - url: /
security:
  - bearerJwt: []
tags:
  - { name: Catalog }
  - { name: Estimates }
  - { name: Repairs }
  - { name: Decisions }
  - { name: Settings }
  - { name: Inventory Integration }
paths:
  /api/maintenance/v1/catalog/versions:
    get:
      tags: [Catalog]
      operationId: listCatalogVersions
      description: >-
        Returns the single global catalog history. warehouseId is authorization context only;
        it never filters or clones catalog data. Requires USER, rwms.read and VIEW access.
      parameters:
        - { $ref: '#/components/parameters/WarehouseIdQuery' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: lifecycle
          in: query
          schema: { $ref: '#/components/schemas/CatalogLifecycle' }
      responses:
        '200': { description: Catalog versions., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogVersionPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Catalog]
      operationId: createCatalogVersion
      description: >-
        Requires USER, rwms.write and warehouse MANAGE access. Creates the first empty global
        ACTIVE catalog-builder version. If a global active version already exists, that same
        version is returned idempotently for every authorized warehouse; no catalog is copied
        for a new warehouse and no packaged or browser-owned legacy data is imported.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateCatalogRequest' } } } }
      responses:
        '201': { description: Created or replayed catalog version., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/maintenance/v1/catalog/versions/{id}:
    parameters:
      - { $ref: '#/components/parameters/CatalogVersionId' }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
    put:
      tags: [Catalog]
      operationId: replaceCatalog
      description: >-
        Atomically replaces nodes and links in the global catalog. warehouseId authorizes the
        caller but does not select a catalog copy. Requires USER, rwms.write and warehouse EDIT
        access. The current ACTIVE catalog and historical DRAFT versions may change
        with optimistic locking; SUPERSEDED versions are immutable.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceCatalogRequest' } } } }
      responses:
        '200': { description: Changed catalog., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/maintenance/v1/catalog/versions/{id}/nodes:
    parameters:
      - { $ref: '#/components/parameters/CatalogVersionId' }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
    get:
      tags: [Catalog]
      operationId: listCatalogNodes
      description: Requires USER, rwms.read and warehouse VIEW access.
      responses:
        '200':
          description: Nodes in the selected catalog version.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CatalogNode' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Catalog]
      operationId: replaceCatalogNodes
      description: >-
        Requires USER, rwms.write and warehouse EDIT access. The current ACTIVE catalog and
        historical DRAFT versions may change with optimistic locking; SUPERSEDED versions are
        immutable.
        A MATERIAL below a furnitureCategory may omit furnitureEquipment: maintenance-service then
        idempotently ensures an asset-service additional-equipment item from the material name and
        stores the returned immutable identity. Dependency failure or conflict commits no catalog
        change.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceCatalogNodesRequest' } } } }
      responses:
        '200': { description: Changed catalog., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/maintenance/v1/catalog/versions/{id}/links:
    parameters:
      - { $ref: '#/components/parameters/CatalogVersionId' }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
    get:
      tags: [Catalog]
      operationId: listCatalogLinks
      description: Requires USER, rwms.read and warehouse VIEW access.
      responses:
        '200':
          description: Links in the selected catalog version.
          headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CatalogLink' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Catalog]
      operationId: replaceCatalogLinks
      description: >-
        Requires USER, rwms.write and warehouse EDIT access. The current ACTIVE catalog and
        historical DRAFT versions may change with optimistic locking; SUPERSEDED versions are
        immutable.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceCatalogLinksRequest' } } } }
      responses:
        '200': { description: Changed catalog., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
  /api/maintenance/v1/catalog/versions/{id}/fork:
    parameters:
      - { $ref: '#/components/parameters/CatalogVersionId' }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Catalog]
      operationId: forkCatalogVersion
      description: >-
        Requires USER, rwms.write and warehouse MANAGE access. Copies the exact immutable
        catalog-builder snapshot of an ACTIVE or SUPERSEDED version into a new DRAFT using
        optimistic source expectedVersion; published source rows remain immutable.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExpectedVersionRequest' } } } }
      responses:
        '201': { description: Created or replayed DRAFT fork., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
  /api/maintenance/v1/catalog/versions/{id}/activate:
    parameters:
      - { $ref: '#/components/parameters/CatalogVersionId' }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Catalog]
      operationId: activateCatalogVersion
      description: >-
        Requires USER, rwms.write and warehouse MANAGE access. Before any local mutation,
        maintenance-service verifies global queue-definition ID/type snapshots through the
        private task-board preflight. Activation uses a global CAS, supersedes the single
        previous active version
        atomically and stores durable CATALOG_POSITION registration/cleanup intents in that same
        transaction. Cleanup of superseded references waits for all replacement registrations.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExpectedVersionRequest' } } } }
      responses:
        '200': { description: Active catalog version., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/internal/maintenance/v1/inventory/plans:
    post:
      tags: [Inventory Integration]
      operationId: freezeInventoryRepairPlan
      description: >-
        Private direct-service boundary. Requires principal_type=SERVICE,
        sub=client_id=inventory-service, audience rwms-services and exactly the
        maintenance.inventory scope. AUTO resolves against the active warehouse
        catalog; MANUAL validates the submitted order. The permanent source key
        replays its immutable historical result and never adopts a later catalog.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FreezeInventoryPlanRequest' } } } }
      responses:
        '200': { description: Immutable maintenance-issued inventory plan., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/FrozenInventoryPlan' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
  /api/internal/maintenance/v1/inventory/repair-snapshots:
    post:
      tags: [Inventory Integration]
      operationId: getInventoryRepairSnapshots
      description: >-
        Private exact maintenance.inventory SERVICE boundary. Returns all
        maintenance-owned repairs for each requested rental-item identity. The
        stable plan fingerprint covers only ordered stage kind, routing, work,
        material, primary-line and group-comment semantics; technical versions,
        timestamps, task synchronization and delivery state are excluded.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryRepairSnapshotRequest' } } } }
      responses:
        '200': { description: Current semantic repair snapshots grouped by rental item., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryRepairSnapshots' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/internal/maintenance/v1/inventory/sources/{inventoryId}/findings/{findingId}:
    parameters:
      - { name: inventoryId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: findingId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Inventory Integration]
      operationId: upsertInventoryRepairSource
      description: >-
        Private exact maintenance.inventory SERVICE boundary. Binds the permanent
        inventoryId:findingId source to one INVENTORY repair only when the exact
        historical snapshot/fingerprint and current asset preconditions match.
        Identical replay returns that repair. Maintenance alone acquires the asset
        lease/fence and synchronizes task-board through durable reconciliation.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpsertInventoryRepairRequest' } } } }
      responses:
        '200': { description: Created or replayed inventory-origin repair., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryRepairUpsertResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/internal/maintenance/v1/logistics/returns/{returnId}/lines/{lineId}/shortage:
    parameters:
      - { name: returnId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: lineId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Logistics Integration]
      operationId: upsertLogisticsReturnShortage
      description: >-
        Private direct-service boundary. Requires principal_type=SERVICE,
        sub=client_id=logistics-service, audience rwms-services and exactly the
        maintenance.logistics scope. The permanent returnId:lineId source accepts
        the immutable equipment-shortage, dispatch-date and return-inspection-photo
        snapshot and atomically owns one empty DRAFT estimate in the active catalog.
        Identical replay returns the same estimate. This boundary never creates a
        repair; normal estimate completion owns that transition.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpsertLogisticsReturnShortageRequest' } } } }
      responses:
        '200': { description: Recorded or replayed immutable logistics return shortage source and its sole DRAFT estimate., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsReturnShortage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
    get:
      tags: [Logistics Integration]
      operationId: getLogisticsReturnShortage
      description: Returns the immutable logistics return shortage source and its sole estimate ID.
      responses:
        '200': { description: Immutable logistics return shortage source., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/LogisticsReturnShortage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/internal/maintenance/v1/logistics/transfers/{transferId}/lines/{lineId}/prepare-departure:
    parameters:
      - { name: transferId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: lineId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Logistics Integration]
      operationId: prepareRepairTransferDeparture
      description: >-
        Private maintenance.logistics SERVICE boundary. Idempotently parks the same active
        repair chain before cabin departure, releases its asset lease and preserves every
        repair, estimate, stage, task correlation and history item. It never completes or
        duplicates a repair.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransferRepairRequest' } } } }
      responses:
        '200': { description: 'Active repair transfer preparation, or an explicit no-repair result.', headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PrepareTransferRepairResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/internal/maintenance/v1/logistics/transfers/{transferId}/lines/{lineId}/arrival-preflight:
    parameters:
      - { name: transferId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: lineId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Logistics Integration]
      operationId: preflightRepairTransferArrival
      description: >-
        Resolves the prepared active repair against target-warehouse queue bindings. Missing
        global queue definitions are returned explicitly; no name-based, old-warehouse or
        arbitrary fallback is allowed. The movement option is true only when the target
        warehouse has the required movement/driver capability.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransferRepairRequest' } } } }
      responses:
        '200': { description: Receiver choices and missing target queue bindings., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TransferRepairArrivalPreflight' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/internal/maintenance/v1/logistics/transfers/{transferId}/lines/{lineId}/complete-arrival:
    parameters:
      - { name: transferId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: lineId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Logistics Integration]
      operationId: completeRepairTransferArrival
      description: >-
        Called only after target-warehouse cabin acceptance. The receiver supplies the existing
        priority and, when available, movement-to-shipment choice. The same repair chain moves to
        the target warehouse, unfinished task-board entries are relocated by global queue
        definition, and the lease is reacquired. Missing target queues fail closed without
        partial relocation.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CompleteTransferRepairRequest' } } } }
      responses:
        '200': { description: Same active repair after target-warehouse continuation., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CompleteTransferRepairResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/maintenance/v1/estimates:
    get:
      tags: [Estimates]
      operationId: listEstimates
      description: Requires USER, rwms.read and warehouse VIEW access.
      parameters:
        - { $ref: '#/components/parameters/WarehouseIdQuery' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: lifecycle
          in: query
          schema: { $ref: '#/components/schemas/EstimateLifecycle' }
        - name: rentalItemId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Estimate page., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EstimatePage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Estimates]
      operationId: createEstimate
      description: Requires USER, rwms.write and warehouse EDIT access.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateEstimateRequest' } } } }
      responses:
        '201': { description: Created DRAFT estimate., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Estimate' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
  /api/maintenance/v1/estimates/{id}:
    parameters:
      - { $ref: '#/components/parameters/EstimateId' }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
    get:
      tags: [Estimates]
      operationId: getEstimate
      description: Requires USER, rwms.read and warehouse VIEW access.
      responses:
        '200': { description: Estimate and immutable revision history., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Estimate' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Estimates]
      operationId: replaceDraftEstimate
      description: Requires USER, rwms.write and warehouse EDIT access. Ordinary replacement is forbidden after completion.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceEstimateRequest' } } } }
      responses:
        '200': { description: Updated DRAFT estimate., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Estimate' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
  /api/maintenance/v1/estimates/{id}/complete:
    parameters:
      - { $ref: '#/components/parameters/EstimateId' }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Estimates]
      operationId: completeEstimate
      description: >-
        Completes the DRAFT estimate using CAS. Empty completion creates no
        repair or task and fences the cabin to FREE. Non-empty completion
        atomically creates the ESTIMATE primary repair and publication intents.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PriorityVersionRequest' } } } }
      responses:
        '200': { description: Locally committed completion and downstream delivery truth., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EstimateCommandResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/maintenance/v1/estimates/{id}/amendments:
    parameters:
      - { $ref: '#/components/parameters/EstimateId' }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Estimates]
      operationId: amendCompletedEstimate
      description: >-
        Appends an immutable revision while the linked repair has not started.
        Both expectedVersion and expectedLinkedRepairVersion are checked in one
        local transaction. A zero-line amendment is rejected when a repair exists.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AmendEstimateRequest' } } } }
      responses:
        '201': { description: Appended estimate revision and delivery truth., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EstimateCommandResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/maintenance/v1/repairs:
    get:
      tags: [Repairs]
      operationId: listRepairs
      description: Requires USER, rwms.read and warehouse VIEW access.
      parameters:
        - { $ref: '#/components/parameters/WarehouseIdQuery' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: executionState
          in: query
          schema: { $ref: '#/components/schemas/RepairExecutionState' }
        - name: acceptanceState
          in: query
          schema: { $ref: '#/components/schemas/RepairAcceptanceState' }
        - name: rentalItemId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Repair page., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RepairPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/maintenance/v1/repairs/direct:
    post:
      tags: [Repairs]
      operationId: createDirectRepair
      description: >-
        Requires USER, rwms.write and warehouse EDIT access. Creates a DIRECT_REPAIR
        primary repair in DRAFT without an estimate or downstream side effect. An empty
        lines/plan pair is valid and is completed by the queue command without creating a task.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateDirectRepairRequest' } } } }
      responses:
        '201': { description: Created direct DRAFT repair., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Repair' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
  /api/maintenance/v1/repairs/{id}:
    parameters:
      - { $ref: '#/components/parameters/RepairId' }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
    get:
      tags: [Repairs]
      operationId: getRepair
      description: Requires USER, rwms.read and warehouse VIEW access.
      responses:
        '200': { description: 'Repair with stages, lease reconciliation and task synchronization truth.', headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Repair' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/maintenance/v1/repairs/{id}/worker-evidence:
    parameters:
      - { $ref: '#/components/parameters/RepairId' }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
    get:
      tags: [Repairs]
      operationId: listRepairWorkerEvidence
      description: >-
        Returns the maintenance-owned projection of READY and REVIEW_REQUIRED
        task-board result evidence for this repair. Worker/group IDs are
        server-attributed; names are intentionally resolved by the panel from
        the independent public workforce projection. Requires USER, rwms.read
        and warehouse VIEW access.
      responses:
        '200':
          description: Ordered result evidence grouped by repair route step.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/RepairWorkerEvidence' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/maintenance/v1/repairs/{id}/rework-candidates:
    parameters:
      - { $ref: '#/components/parameters/RepairId' }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
    get:
      tags: [Repairs]
      operationId: listReworkCandidates
      description: >-
        Requires USER, rwms.read and warehouse VIEW access. Returns the latest completed,
        non-written-off occurrence of every repair-line lineage in the root repair chain.
        These immutable candidates are the only source lines accepted by REPEAT rework inputs.
      responses:
        '200':
          description: Rework candidate lines.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReworkCandidates' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/maintenance/v1/repairs/{id}/plan:
    parameters:
      - { $ref: '#/components/parameters/RepairId' }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
    get:
      tags: [Repairs]
      operationId: getRepairPlan
      description: Requires USER, rwms.read and warehouse VIEW access.
      responses:
        '200': { description: Current ordered plan., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RepairPlan' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Repairs]
      operationId: replaceDraftRepairPlan
      description: >-
        Requires USER, rwms.write and warehouse EDIT access. Replaces the ordered
        plan and opaque MAINTENANCE_REPAIR media references for a DRAFT repair or
        a QUEUED repair whose task has not started, using CAS. A registered queued
        task is updated through durable server-side reconciliation. The queued
        cabin status is durably synchronized with recalculated complexity,
        including removal of a work item that forced capital repair. Media owner
        proof delivery is server-side durable reconciliation and is never a browser saga.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceRepairPlanRequest' } } } }
      responses:
        '200': { description: Changed pre-start repair., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Repair' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
    post:
      tags: [Repairs]
      operationId: queueRepairPlan
      description: >-
        Requires USER, rwms.write and warehouse EDIT access. Acquires or reuses
        the root lease, fences the cabin to REPAIR or CAPITAL_REPAIR from the
        calculated complexity, and locally commits stable task publication
        intents. Queueing a rework also moves its source from PENDING to IN_REWORK
        atomically. For an empty DIRECT_REPAIR, the command creates no worker task
        and fences the safely eligible cabin to FREE.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PriorityVersionRequest' } } } }
      responses:
        '200': { description: Queued repair and downstream delivery truth., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RepairCommandResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/maintenance/v1/repairs/{id}/reworks:
    parameters:
      - { $ref: '#/components/parameters/RepairId' }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Repairs]
      operationId: createRework
      description: >-
        Creates a child REWORK in DRAFT and leaves the source unchanged. Only a
        queued or in-progress sibling blocks creation; the child is queued
        later through its own /plan command and reuses the root lease.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateReworkRequest' } } } }
      responses:
        '201': { description: Created child DRAFT repair., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Repair' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
  /api/maintenance/v1/repairs/{id}/accept:
    parameters:
      - { $ref: '#/components/parameters/RepairId' }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Decisions]
      operationId: acceptRepair
      description: >-
        Requires USER, rwms.write and warehouse EDIT access. Validates and stores
        the supplied opaque media references under MAINTENANCE_ACCEPTANCE, fences
        the cabin to FREE and cascades ACCEPTED through the source repair chain.
        Material-linked cabin characteristics are applied only by idempotent
        server-side reconciliation after this successful acceptance.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RepairDecisionRequest' } } } }
      responses:
        '200': { description: Accepted repair and lease reconciliation truth., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RepairCommandResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/maintenance/v1/repairs/{id}/write-off:
    parameters:
      - { $ref: '#/components/parameters/RepairId' }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Decisions]
      operationId: writeOffRepair
      description: Requires USER, rwms.write and warehouse MANAGE access. Fences the cabin to WRITTEN_OFF and cascades the terminal decision through the source chain.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WriteOffRepairRequest' } } } }
      responses:
        '200': { description: Written-off repair and lease reconciliation truth., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RepairCommandResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/maintenance/v1/acceptance:
    get:
      tags: [Decisions]
      operationId: listAcceptanceProjection
      description: Read-only repair projection; not a command aggregate. Requires USER, rwms.read and warehouse VIEW access.
      parameters:
        - { $ref: '#/components/parameters/WarehouseIdQuery' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/RepairAcceptanceState' }
      responses:
        '200': { description: Acceptance projection page., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AcceptanceProjectionPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/maintenance/v1/write-offs:
    get:
      tags: [Decisions]
      operationId: listWriteOffProjection
      description: Read-only repair projection; not a command aggregate. Requires USER, rwms.read and warehouse VIEW access.
      parameters:
        - { $ref: '#/components/parameters/WarehouseIdQuery' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { description: Write-off projection page., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/WriteOffProjectionPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/maintenance/v1/settings/repair-capacity/{warehouseId}:
    parameters:
      - name: warehouseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Settings]
      operationId: getRepairCapacitySettings
      description: >-
        Returns the warehouse repair-capacity setting. An absent setting is represented as
        version 0 with maxRepairsPerDay 6 and null lifecycle timestamps without persisting a row.
        Requires USER, rwms.write and warehouse MANAGE access.
      responses:
        '200': { description: Repair-capacity setting or its non-persisted default., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RepairCapacitySettings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Settings]
      operationId: replaceRepairCapacitySettings
      description: >-
        Creates or replaces the warehouse repair-capacity setting with strict optimistic CAS.
        Creation is allowed only with expectedVersion 0. Requires USER, rwms.write and warehouse
        MANAGE access.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceRepairCapacitySettingsRequest' } } } }
      responses:
        '200': { description: Persisted repair-capacity setting., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RepairCapacitySettings' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/maintenance/v1/settings/repair-complexity-colors:
    parameters:
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
    get:
      tags: [Settings]
      operationId: getRepairComplexityColors
      description: >-
        Returns the single global estimate-catalog color palette. warehouseId is authorization
        context only; colors are not copied or overridden per warehouse.
      responses:
        '200': { description: Global repair-complexity color palette., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RepairComplexityColors' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Settings]
      operationId: replaceRepairComplexityColors
      description: >-
        Replaces the one global palette with optimistic CAS. The configured color for a repair
        type is reused everywhere that calculated type is displayed.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceRepairComplexityColorsRequest' } } } }
      responses:
        '200': { description: Updated global repair-complexity color palette., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RepairComplexityColors' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Public reads require a USER token with rwms.read and warehouse VIEW;
        writes require rwms.write and EDIT. Catalog import/activation and
        maintenance write-off and repair-capacity settings additionally require
        warehouse MANAGE.
  parameters:
    WarehouseIdQuery:
      name: warehouseId
      in: query
      required: true
      description: >-
        Warehouse authorization and catalog scope.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        UUID key scoped to authenticated subject and command for seven days.
        An identical canonical request replays the original successful status
        and body; reuse with another request hash returns 409.
      schema: { type: string, format: uuid }
    CatalogVersionId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    EstimateId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    RepairId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    Size: { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
  responses:
    Unauthorized:
      description: Missing or invalid bearer token; production fails closed.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
    Forbidden:
      description: Missing scope, principal type or warehouse access.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
    BadRequest:
      description: Malformed input.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
    NotFound:
      description: Resource is absent in the authorized warehouse scope.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
    Conflict:
      description: Version, idempotency, state, lease, fence or task-sync conflict.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
    ValidationFailure:
      description: Domain validation failed, including catalog graph or media-reference validation.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
    DependencyUnavailable:
      description: Required dependency was unavailable before any local commit.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
  headers:
    X-Correlation-Id:
      description: Request correlation identifier emitted by the platform correlation filter.
      schema: { type: string, format: uuid }
    Idempotency-Replayed:
      description: Present with value `true` only when the original successful response is replayed.
      schema: { type: string, const: 'true' }
  schemas:
    ProblemDetail:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code, violations, correlation]
      properties:
        type: { type: string, format: uri }
        title: { type: string, minLength: 1, maxLength: 256 }
        status: { type: integer, enum: [400, 401, 403, 404, 409, 422, 503] }
        detail:
          oneOf: [ { type: string, maxLength: 2000 }, { type: 'null' } ]
        instance:
          oneOf: [ { type: string, format: uri-reference }, { type: 'null' } ]
        code:
          enum:
            - MAINTENANCE_UNAUTHORIZED
            - MAINTENANCE_VALIDATION_FAILED
            - MAINTENANCE_NOT_FOUND
            - MAINTENANCE_VERSION_CONFLICT
            - MAINTENANCE_IDEMPOTENCY_CONFLICT
            - MAINTENANCE_STATE_CONFLICT
            - MAINTENANCE_LEASE_CONFLICT
            - MAINTENANCE_FENCE_CONFLICT
            - MAINTENANCE_MEDIA_NOT_READY
            - MAINTENANCE_TASK_SYNC_CONFLICT
            - MAINTENANCE_DEPENDENCY_UNAVAILABLE
            - MAINTENANCE_FORBIDDEN
        violations:
          type: array
          items: { $ref: '#/components/schemas/FieldViolation' }
        correlation: { $ref: '#/components/schemas/CorrelationContext' }
    FieldViolation:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
    CorrelationContext:
      type: object
      additionalProperties: false
      required: [correlationId, causationId]
      properties:
        correlationId: { type: string, format: uuid }
        causationId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
    CatalogLifecycle: { enum: [DRAFT, ACTIVE, SUPERSEDED] }
    EstimateLifecycle: { enum: [DRAFT, COMPLETED] }
    RepairOrigin: { enum: [ESTIMATE, DIRECT_REPAIR, INVENTORY] }
    RepairKind: { enum: [PRIMARY, REWORK] }
    RepairExecutionState: { enum: [DRAFT, QUEUED, IN_PROGRESS, COMPLETED, CANCELLED] }
    RepairAcceptanceState: { enum: [NOT_READY, PENDING, IN_REWORK, ACCEPTED, WRITTEN_OFF] }
    RepairComplexity: { enum: [LIGHT, MEDIUM, COMPLEX, CAPITAL] }
    RepairStageKind: { enum: [REPAIR_WORK, MOVE_TO_REPAIR, MOVE_FROM_REPAIR] }
    RepairStageState: { enum: [PLANNED, QUEUED, IN_PROGRESS, DONE, CANCELLED] }
    GenerationState: { enum: [PENDING_GENERATION, GENERATED, FAILED] }
    InventoryPlanMode: { enum: [AUTO, MANUAL] }
    InventoryPlanLineKind: { enum: [CATALOG, MANUAL] }
    InventoryPlanLineType: { enum: [WORK, MATERIAL] }
    EstimateLineType: { enum: [WORK, MATERIAL] }
    ReworkLineDisposition: { enum: [ADDED, REPEAT] }
    DeliveryState: { enum: [PENDING, RETRY_PENDING, DELIVERED, QUARANTINED] }
    LeaseReconciliationState: { enum: [NOT_ACQUIRED, ACTIVE, RELEASED, RECONCILIATION_REQUIRED] }
    CatalogNodeType: { enum: [CATEGORY, SUBCATEGORY, WORK, MATERIAL, LOCATION, OPTION] }
    CatalogLinkType: { enum: [DEPENDENCY, FOLLOW_UP] }
    CatalogLinkAnchor: { enum: [TOP, BOTTOM] }
    ExpectedVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    PriorityVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, priority]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        priority:
          type: integer
          minimum: 1
          maximum: 5
          description: 1 is the most urgent and 5 is the least urgent.
    ReplaceRepairCapacitySettingsRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, maxRepairsPerDay]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        maxRepairsPerDay: { type: integer, minimum: 1 }
    RepairCapacitySettings:
      type: object
      additionalProperties: false
      required: [warehouseId, version, maxRepairsPerDay, createdAt, updatedAt]
      properties:
        warehouseId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        maxRepairsPerDay: { type: integer, minimum: 1 }
        createdAt:
          oneOf: [ { type: string, format: date-time }, { type: 'null' } ]
        updatedAt:
          oneOf: [ { type: string, format: date-time }, { type: 'null' } ]
    ReplaceRepairComplexityColorsRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, lightColor, mediumColor, complexColor, capitalColor]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        lightColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        mediumColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        complexColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        capitalColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
    RepairComplexityColors:
      type: object
      additionalProperties: false
      required: [version, lightColor, mediumColor, complexColor, capitalColor, updatedAt]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        lightColor: { type: string, pattern: '^#[0-9A-F]{6}$' }
        mediumColor: { type: string, pattern: '^#[0-9A-F]{6}$' }
        complexColor: { type: string, pattern: '^#[0-9A-F]{6}$' }
        capitalColor: { type: string, pattern: '^#[0-9A-F]{6}$' }
        updatedAt: { type: string, format: date-time }
    TransferRepairRequest:
      type: object
      additionalProperties: false
      required: [rentalItemId, sourceWarehouseId, targetWarehouseId]
      properties:
        rentalItemId: { type: string, format: uuid }
        sourceWarehouseId: { type: string, format: uuid }
        targetWarehouseId: { type: string, format: uuid }
    PrepareTransferRepairResult:
      type: object
      additionalProperties: false
      required: [activeRepairId, activeRepairVersion, assetStatus]
      properties:
        activeRepairId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        activeRepairVersion:
          oneOf: [ { type: integer, format: int64, minimum: 0 }, { type: 'null' } ]
        assetStatus: { enum: [FREE, REPAIR] }
    TransferRepairArrivalPreflight:
      type: object
      additionalProperties: false
      required: [activeRepairId, priorityRequired, movementToShipmentAvailable, missingQueueDefinitionIds]
      properties:
        activeRepairId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        priorityRequired: { type: boolean }
        movementToShipmentAvailable: { type: boolean }
        missingQueueDefinitionIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
    CompleteTransferRepairRequest:
      type: object
      additionalProperties: false
      required: [rentalItemId, sourceWarehouseId, targetWarehouseId, priority, movementToShipment]
      properties:
        rentalItemId: { type: string, format: uuid }
        sourceWarehouseId: { type: string, format: uuid }
        targetWarehouseId: { type: string, format: uuid }
        priority:
          description: Existing maintenance priority selected by the target-warehouse receiver.
          oneOf:
            - { type: integer, minimum: 1, maximum: 5 }
            - { type: 'null' }
        movementToShipment:
          description: Must be false when target-warehouse movement capability is unavailable.
          type: boolean
    CompleteTransferRepairResult:
      type: object
      additionalProperties: false
      required: [activeRepairId, repairVersion, warehouseId]
      properties:
        activeRepairId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        repairVersion:
          oneOf: [ { type: integer, format: int64, minimum: 0 }, { type: 'null' } ]
        warehouseId: { type: string, format: uuid }
    ActorSnapshot:
      description: Opaque local audit snapshot; login and display name are forbidden.
      type: object
      additionalProperties: false
      required: [actorId, actorType]
      properties:
        actorId: { type: string, minLength: 1, maxLength: 128 }
        actorType: { enum: [USER, SERVICE] }
    MediaReference:
      description: >-
        Opaque READY media generation from the maintenance-owned media inbox
        projection. Signed URLs and object keys are never persisted here.
      type: object
      additionalProperties: false
      required: [mediaId, generation]
      properties:
        mediaId: { type: string, format: uuid }
        generation: { type: integer, minimum: 0 }
      x-rwms-approved-owner-types:
        - MAINTENANCE_ESTIMATE
        - MAINTENANCE_REPAIR
        - MAINTENANCE_ACCEPTANCE
        - INVENTORY_FINDING
    RepairWorkerEvidence:
      type: object
      additionalProperties: false
      required: [evidenceId, repairId, stageId, stageIndex, entryId, taskId, routeIndex, workerId, workerGroupId, mediaId, mediaGeneration, capturedAt, recordedAt, state]
      properties:
        evidenceId: { type: string, format: uuid }
        repairId: { type: string, format: uuid }
        stageId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        stageIndex: { type: integer, minimum: 0 }
        entryId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        routeIndex: { type: integer, minimum: 0 }
        workerId: { type: string, format: uuid }
        workerGroupId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        mediaId: { type: string, format: uuid }
        mediaGeneration: { type: integer, format: int64, minimum: 1 }
        capturedAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        state: { enum: [READY, REVIEW_REQUIRED] }
    Money:
      type: string
      pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]{2})$'
      examples: ['1250.00']
    DecimalQuantity:
      type: string
      pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]{1,3})?$'
      examples: ['2.5']
    InventoryQuantityInput:
      type: string
      pattern: '^(?:0|[1-9][0-9]{0,13})(?:\.[0-9]{1,3})?$'
      examples: ['2.5']
    InventoryQuantitySnapshot:
      type: string
      pattern: '^(?:0|[1-9][0-9]{0,13})\.[0-9]{6}$'
      examples: ['2.500000']
    CatalogCounts:
      type: object
      additionalProperties: false
      required: [nodes, links]
      properties:
        nodes: { type: integer, minimum: 0 }
        links: { type: integer, minimum: 0 }
    CatalogValidationReport:
      type: object
      additionalProperties: false
      required: [valid, errorCount, warningCount, reportSha256]
      properties:
        valid: { type: boolean }
        errorCount: { type: integer, minimum: 0 }
        warningCount: { type: integer, minimum: 0 }
        reportSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    CatalogRoutingSync:
      description: >-
        Durable maintenance-owned delivery truth for task-board CATALOG_POSITION references.
        Cleanup is not attempted until every registration predecessor for the replacement and
        superseded versions is confirmed.
      type: object
      additionalProperties: false
      required: [state, registrationsRequired, registrationsConfirmed, cleanupRequired, cleanupConfirmed, attempts, updatedAt]
      properties:
        state: { $ref: '#/components/schemas/DeliveryState' }
        registrationsRequired: { type: integer, minimum: 0 }
        registrationsConfirmed: { type: integer, minimum: 0 }
        cleanupRequired: { type: integer, minimum: 0 }
        cleanupConfirmed: { type: integer, minimum: 0 }
        attempts: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }
    CatalogVersion:
      type: object
      additionalProperties: false
      required: [id, warehouseId, version, lifecycle, sourceSha256, counts, validation, createdAt, routingSync]
      properties:
        id: { type: string, format: uuid }
        warehouseId:
          description: >-
            Immutable creation/audit context only. It does not scope visibility or ownership;
            every warehouse consumes this same global catalog version.
          type: string
          format: uuid
        version: { type: integer, format: int64, minimum: 0 }
        lifecycle: { $ref: '#/components/schemas/CatalogLifecycle' }
        sourceSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        counts: { $ref: '#/components/schemas/CatalogCounts' }
        validation: { $ref: '#/components/schemas/CatalogValidationReport' }
        createdAt: { type: string, format: date-time }
        activatedAt:
          oneOf: [ { type: string, format: date-time }, { type: 'null' } ]
        routingSync:
          oneOf:
            - $ref: '#/components/schemas/CatalogRoutingSync'
            - type: 'null'
    CatalogVersionPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CatalogVersion' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
    CatalogRoutingInput:
      description: Queue selected by UUID and declared type. Task-board preflight supplies its name.
      type: object
      additionalProperties: false
      required: [queueId, queueType]
      properties:
        queueId: { type: string, format: uuid }
        queueType: { type: string, minLength: 1, maxLength: 64 }
    RoutingSnapshot:
      description: >-
        Immutable global task-board queue-definition snapshot. queueName is display data only;
        all routing resolves queueId to a target-warehouse binding.
      type: object
      additionalProperties: false
      required: [queueId, queueName, queueType]
      properties:
        queueId: { type: string, format: uuid }
        queueName: { type: string, minLength: 1, maxLength: 255 }
        queueType: { type: string, minLength: 1, maxLength: 64 }
    FurnitureEquipmentReference:
      description: >-
        Immutable snapshot of the asset-service additional-equipment master item. This is never a
        cross-database foreign key; asset-service validates the live item before applying a loss.
      type: object
      additionalProperties: false
      required: [equipmentId, equipmentName]
      properties:
        equipmentId: { type: string, format: uuid }
        equipmentName: { type: string, minLength: 1, maxLength: 255 }
    CabinCharacteristicReference:
      description: >-
        Immutable display snapshot of an asset-service cabin characteristic. The UUID remains
        authoritative and is applied idempotently only after successful repair acceptance.
      type: object
      additionalProperties: false
      required: [characteristicId, characteristicName]
      properties:
        characteristicId: { type: string, format: uuid }
        characteristicName: { type: string, minLength: 1, maxLength: 255 }
    CatalogNodeInput:
      type: object
      additionalProperties: false
      allOf:
        - if:
            properties:
              nodeType: { const: WORK }
            required: [nodeType]
          then:
            properties:
              durationMinutes: { minimum: 1 }
      required: [id, nodeType, name, active, durationMinutes, unitPrice, routing]
      properties:
        id: { type: string, format: uuid }
        nodeType: { $ref: '#/components/schemas/CatalogNodeType' }
        name: { type: string, minLength: 1, maxLength: 255 }
        active: { type: boolean }
        parentNodeId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        furnitureCategory:
          type: boolean
          default: false
          description: Marks this category and its descendants as the Furniture material view.
        furnitureEquipment:
          oneOf: [ { $ref: '#/components/schemas/FurnitureEquipmentReference' }, { type: 'null' } ]
        unit:
          oneOf: [ { type: string, minLength: 1, maxLength: 32 }, { type: 'null' } ]
        unitPrice:
          oneOf: [ { $ref: '#/components/schemas/Money' }, { type: 'null' } ]
        durationMinutes: { type: integer, minimum: 0, maximum: 525600 }
        includeInEstimate: { type: boolean, default: true }
        commonItem: { type: boolean, default: false }
        showInMainMenu: { type: boolean, default: false }
        canvasX:
          oneOf: [ { type: integer }, { type: 'null' } ]
        canvasY:
          oneOf: [ { type: integer }, { type: 'null' } ]
        routing:
          oneOf: [ { $ref: '#/components/schemas/CatalogRoutingInput' }, { type: 'null' } ]
        comment:
          description: Service-local catalog text; never published to Kafka.
          oneOf: [ { type: string, maxLength: 2000 }, { type: 'null' } ]
        displayColor:
          description: Optional catalog-button color shared by panel and mobile clients.
          oneOf:
            - { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
            - { type: 'null' }
        forcesCapitalRepair:
          description: >-
            Valid only for WORK. One selected flagged work forces the whole repair to CAPITAL
            regardless of its calculated planned duration.
          type: boolean
          default: false
        characteristicId:
          description: >-
            Valid only for MATERIAL. References the existing asset-service characteristic
            catalog; maintenance does not own or copy that catalog.
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
    CatalogNode:
      type: object
      additionalProperties: false
      allOf:
        - if:
            properties:
              nodeType: { const: WORK }
            required: [nodeType]
          then:
            properties:
              durationMinutes: { minimum: 1 }
      required: [id, catalogVersionId, nodeType, name, active, furnitureCategory, furnitureEquipment, durationMinutes, unitPrice, includeInEstimate, commonItem, showInMainMenu, routing, forcesCapitalRepair, characteristic]
      properties:
        id: { type: string, format: uuid }
        catalogVersionId: { type: string, format: uuid }
        nodeType: { $ref: '#/components/schemas/CatalogNodeType' }
        name: { type: string, minLength: 1, maxLength: 255 }
        active: { type: boolean }
        parentNodeId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        furnitureCategory: { type: boolean }
        furnitureEquipment:
          oneOf: [ { $ref: '#/components/schemas/FurnitureEquipmentReference' }, { type: 'null' } ]
        unit:
          oneOf: [ { type: string, minLength: 1, maxLength: 32 }, { type: 'null' } ]
        unitPrice:
          oneOf: [ { $ref: '#/components/schemas/Money' }, { type: 'null' } ]
        durationMinutes: { type: integer, minimum: 0, maximum: 525600 }
        includeInEstimate: { type: boolean }
        commonItem: { type: boolean }
        showInMainMenu: { type: boolean }
        canvasX:
          oneOf: [ { type: integer }, { type: 'null' } ]
        canvasY:
          oneOf: [ { type: integer }, { type: 'null' } ]
        routing:
          oneOf: [ { $ref: '#/components/schemas/RoutingSnapshot' }, { type: 'null' } ]
        comment:
          description: Service-local catalog text; never published to Kafka.
          oneOf: [ { type: string, maxLength: 2000 }, { type: 'null' } ]
        displayColor:
          description: Optional catalog-button color shared by panel and mobile clients.
          oneOf:
            - { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
            - { type: 'null' }
        forcesCapitalRepair: { type: boolean }
        characteristic:
          oneOf:
            - { $ref: '#/components/schemas/CabinCharacteristicReference' }
            - { type: 'null' }
    CatalogLink:
      type: object
      additionalProperties: false
      required: [id, catalogVersionId, fromNodeId, toNodeId, linkType, sortOrder]
      properties:
        id: { type: string, format: uuid }
        catalogVersionId: { type: string, format: uuid }
        fromNodeId: { type: string, format: uuid }
        toNodeId: { type: string, format: uuid }
        linkType: { $ref: '#/components/schemas/CatalogLinkType' }
        sourceAnchor:
          oneOf: [ { $ref: '#/components/schemas/CatalogLinkAnchor' }, { type: 'null' } ]
        targetAnchor:
          oneOf: [ { $ref: '#/components/schemas/CatalogLinkAnchor' }, { type: 'null' } ]
        sortOrder: { type: integer, minimum: 0 }
    CatalogLinkInput:
      type: object
      additionalProperties: false
      required: [id, fromNodeId, toNodeId, linkType, sortOrder]
      properties:
        id: { type: string, format: uuid }
        fromNodeId: { type: string, format: uuid }
        toNodeId: { type: string, format: uuid }
        linkType: { $ref: '#/components/schemas/CatalogLinkType' }
        sourceAnchor:
          oneOf: [ { $ref: '#/components/schemas/CatalogLinkAnchor' }, { type: 'null' } ]
        targetAnchor:
          oneOf: [ { $ref: '#/components/schemas/CatalogLinkAnchor' }, { type: 'null' } ]
        sortOrder: { type: integer, minimum: 0 }
    ReplaceCatalogNodesRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, nodes]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        nodes: { type: array, maxItems: 10000, items: { $ref: '#/components/schemas/CatalogNodeInput' } }
    ReplaceCatalogRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, nodes, links]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        nodes: { type: array, maxItems: 10000, items: { $ref: '#/components/schemas/CatalogNodeInput' } }
        links: { type: array, maxItems: 20000, items: { $ref: '#/components/schemas/CatalogLinkInput' } }
    ReplaceCatalogLinksRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, links]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        links: { type: array, maxItems: 20000, items: { $ref: '#/components/schemas/CatalogLinkInput' } }
    CreateCatalogRequest:
      type: object
      additionalProperties: false
      required: [warehouseId]
      properties:
        warehouseId:
          description: >-
            Warehouse authorization and immutable creation/audit context. Creating from a new
            warehouse returns the existing global active catalog instead of cloning it.
          type: string
          format: uuid
    CatalogNodeSnapshot:
      type: object
      additionalProperties: false
      allOf:
        - if:
            properties:
              nodeType: { const: WORK }
            required: [nodeType]
          then:
            properties:
              durationMinutes: { minimum: 1 }
      required: [catalogVersionId, nodeId, nodeType, name, unit, unitPrice, durationMinutes, routing, furnitureEquipment, forcesCapitalRepair, characteristic]
      properties:
        catalogVersionId: { type: string, format: uuid }
        nodeId: { type: string, format: uuid }
        nodeType: { $ref: '#/components/schemas/CatalogNodeType' }
        name: { type: string, minLength: 1, maxLength: 255 }
        unit: { type: string, minLength: 1, maxLength: 32 }
        unitPrice: { $ref: '#/components/schemas/Money' }
        durationMinutes: { type: integer, minimum: 0 }
        routing:
          oneOf: [ { $ref: '#/components/schemas/RoutingSnapshot' }, { type: 'null' } ]
        furnitureEquipment:
          oneOf: [ { $ref: '#/components/schemas/FurnitureEquipmentReference' }, { type: 'null' } ]
        forcesCapitalRepair: { type: boolean }
        characteristic:
          oneOf:
            - { $ref: '#/components/schemas/CabinCharacteristicReference' }
            - { type: 'null' }
    EstimateLineInput:
      type: object
      additionalProperties: false
      required: [id, catalogSnapshot, lineType, description, unit, quantity, unitPrice, mediaReferences]
      properties:
        id: { type: string, format: uuid }
        catalogSnapshot:
          description: >-
            Frozen global-catalog position, or null for an explicitly named custom line. Every
            custom line must be assigned to exactly one REPAIR_WORK stage. A custom WORK must use
            an active REPAIR or HOLDING queue. A custom MATERIAL may either share a stage with a
            related work or form an independently routed material-only stage.
          oneOf: [ { $ref: '#/components/schemas/CatalogNodeSnapshot' }, { type: 'null' } ]
        lineType: { $ref: '#/components/schemas/EstimateLineType' }
        description: { type: string, minLength: 1, maxLength: 1000 }
        unit:
          description: >-
            Canonical unit for catalog lines. Required and nonblank when catalogSnapshot is null;
            nullable only when the active catalog position itself has no unit.
          oneOf: [ { type: string, minLength: 1, maxLength: 32 }, { type: 'null' } ]
        quantity: { $ref: '#/components/schemas/DecimalQuantity' }
        unitPrice: { $ref: '#/components/schemas/Money' }
        normativeMinutes:
          description: >-
            Per-unit execution time in minutes. Catalog lines are canonicalized from the warehouse
            catalog and may omit this input; a custom WORK must provide 1..525600, while a custom
            MATERIAL is canonicalized to zero.
          type: integer
          minimum: 0
          maximum: 525600
        comment:
          description: Service-local estimate text; never published to Kafka.
          oneOf: [ { type: string, maxLength: 2000 }, { type: 'null' } ]
        mediaReferences:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/MediaReference' }
    EstimateLine:
      type: object
      additionalProperties: false
      required: [id, catalogSnapshot, lineType, description, unit, quantity, unitPrice, lineTotal, normativeMinutes, mediaReferences, disposition, sourceRepairId, sourceLineId, lineageRootLineId]
      properties:
        id: { type: string, format: uuid }
        catalogSnapshot:
          description: >-
            Frozen global-catalog position. Null identifies a custom line whose selected queue is
            retained by the containing repair-work stage rather than by a second catalog.
          oneOf: [ { $ref: '#/components/schemas/CatalogNodeSnapshot' }, { type: 'null' } ]
        lineType: { $ref: '#/components/schemas/EstimateLineType' }
        description: { type: string, minLength: 1, maxLength: 1000 }
        unit: { type: string, minLength: 1, maxLength: 32 }
        quantity: { $ref: '#/components/schemas/DecimalQuantity' }
        unitPrice: { $ref: '#/components/schemas/Money' }
        lineTotal: { $ref: '#/components/schemas/Money' }
        normativeMinutes:
          description: Canonical per-unit execution time in minutes.
          type: integer
          minimum: 0
          maximum: 525600
        comment:
          description: Service-local estimate text; never published to Kafka.
          oneOf: [ { type: string, maxLength: 2000 }, { type: 'null' } ]
        mediaReferences:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/MediaReference' }
        disposition:
          oneOf: [ { $ref: '#/components/schemas/ReworkLineDisposition' }, { type: 'null' } ]
        sourceRepairId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        sourceLineId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        lineageRootLineId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
    PlanStageInput:
      type: object
      additionalProperties: false
      required: [id, kind, order, routing, includedLineIds, primaryLineId, groupComment]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/RepairStageKind' }
        order: { type: integer, minimum: 0 }
        routing:
          description: >-
            Catalog-derived for catalog lines. For custom lines this is the explicit active
            queue selected for the stage; custom works are restricted to REPAIR or HOLDING and
            movement and furniture-movement queues are not valid custom-work destinations.
            A REPAIR_WORK stage may contain work lines, material lines, or both.
          $ref: '#/components/schemas/RoutingSnapshot'
        includedLineIds:
          type: array
          maxItems: 2000
          uniqueItems: true
          items: { type: string, format: uuid }
        primaryLineId:
          description: >-
            Included WORK line used as the stage primary, or null when the REPAIR_WORK stage
            contains materials only.
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        groupComment: { type: string, maxLength: 2000 }
        taskDeadline:
          description: Explicit offset date-time; never inferred from dispatchDate.
          oneOf: [ { type: string, format: date-time }, { type: 'null' } ]
    CreateEstimateRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, rentalItemId, dispatchDate, lines, plan, mediaReferences]
      properties:
        warehouseId: { type: string, format: uuid }
        rentalItemId: { type: string, format: uuid }
        dispatchDate: { type: string, format: date }
        sourceParty:
          description: Service-local business text; never published to Kafka.
          oneOf: [ { type: string, minLength: 1, maxLength: 512 }, { type: 'null' } ]
        lines: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/EstimateLineInput' } }
        plan: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/PlanStageInput' } }
        mediaReferences: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/MediaReference' } }
        coverMediaId:
          description: Required and contained in mediaReferences when aggregate photos are present; otherwise null.
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
    ReplaceEstimateRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, dispatchDate, lines, plan, mediaReferences]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        dispatchDate: { type: string, format: date }
        sourceParty:
          description: Service-local business text; never published to Kafka.
          oneOf: [ { type: string, minLength: 1, maxLength: 512 }, { type: 'null' } ]
        lines: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/EstimateLineInput' } }
        plan: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/PlanStageInput' } }
        mediaReferences: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/MediaReference' } }
        coverMediaId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
    AmendEstimateRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, expectedLinkedRepairVersion, dispatchDate, reason, lines, plan, mediaReferences]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        expectedLinkedRepairVersion:
          oneOf: [ { type: integer, format: int64, minimum: 0 }, { type: 'null' } ]
        dispatchDate: { type: string, format: date }
        reason:
          description: Service-local business text; never published to Kafka.
          type: string
          minLength: 1
          maxLength: 2000
        sourceParty:
          description: Service-local business text; never published to Kafka.
          oneOf: [ { type: string, minLength: 1, maxLength: 512 }, { type: 'null' } ]
        lines: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/EstimateLineInput' } }
        plan: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/PlanStageInput' } }
        mediaReferences: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/MediaReference' } }
        coverMediaId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
    EstimateRevision:
      type: object
