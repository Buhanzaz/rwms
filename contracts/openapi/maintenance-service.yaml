          schema: { type: string, format: uuid }
        - name: estimateId
          in: query
          description: Optional exact maintenance-owned estimate identity; pagination remains database-backed.
          schema: { type: string, format: uuid }
        - name: repairIds
          in: query
          description: Optional bounded maintenance-owned IDs used to resolve only visible task-board repairs.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 200
            uniqueItems: true
            items: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200': { description: Repair page., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RepairPage' } } } }
        '304': { description: Requested repair page has not changed., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, ETag: { $ref: '#/components/headers/ETag' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/maintenance/v1/repairs/capital:
    get:
      tags: [Repairs]
      operationId: listActiveCapitalRepairs
      description: Active calculated CAPITAL repairs only; accepted, written-off and cancelled rows are excluded.
      parameters:
        - { $ref: '#/components/parameters/WarehouseIdQuery' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { description: Active capital repair page., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RepairPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/maintenance/v1/repairs/direct:
    post:
      tags: [Repairs]
      operationId: createDirectRepair
      description: >-
        Requires USER, rwms.write and warehouse EDIT access. Creates a DIRECT_REPAIR
        primary repair in DRAFT without an estimate or downstream side effect. An empty
        lines/plan pair is valid and is completed by the queue command without creating a task.
        The idempotency receipt is rechecked under the rental-item creation fence: exact lost-response
        retries replay the original repair, while another active PRIMARY repair chain for the same
        rental item returns 409.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateDirectRepairRequest' } } } }
      responses:
        '201': { description: Created direct DRAFT repair., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Repair' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
  /api/maintenance/v1/repairs/{id}:
    parameters:
      - { $ref: '#/components/parameters/RepairId' }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
    get:
      tags: [Repairs]
      operationId: getRepair
      description: Requires USER, rwms.read and warehouse VIEW access.
      responses:
        '200': { description: 'Repair with stages, lease reconciliation and task synchronization truth.', headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Repair' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/maintenance/v1/repairs/{id}/worker-evidence:
    parameters:
      - { $ref: '#/components/parameters/RepairId' }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
    get:
      tags: [Repairs]
      operationId: listRepairWorkerEvidence
      description: >-
        Returns the maintenance-owned projection of READY and REVIEW_REQUIRED
        task-board result evidence for this repair. Worker/group IDs are
        server-attributed; names are intentionally resolved by the panel from
        the independent public workforce projection. Requires USER, rwms.read
        and warehouse VIEW access.
      responses:
        '200':
          description: Ordered result evidence grouped by repair route step.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/RepairWorkerEvidence' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/maintenance/v1/repairs/{id}/rework-candidates:
    parameters:
      - { $ref: '#/components/parameters/RepairId' }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
    get:
      tags: [Repairs]
      operationId: listReworkCandidates
      description: >-
        Requires USER, rwms.read and warehouse VIEW access. Returns the latest completed,
        non-written-off occurrence of every repair-line lineage in the root repair chain.
        These immutable candidates are the only source lines accepted by REPEAT rework inputs.
      responses:
        '200':
          description: Rework candidate lines.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReworkCandidates' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/maintenance/v1/repairs/{id}/plan:
    parameters:
      - { $ref: '#/components/parameters/RepairId' }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
    get:
      tags: [Repairs]
      operationId: getRepairPlan
      description: Requires USER, rwms.read and warehouse VIEW access.
      responses:
        '200': { description: Current ordered plan., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RepairPlan' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Repairs]
      operationId: replaceDraftRepairPlan
      description: >-
        Requires USER, rwms.write and warehouse EDIT access. Replaces the ordered
        plan and opaque MAINTENANCE_REPAIR media references for a DRAFT repair or
        a QUEUED repair whose task has not started, using CAS. A registered queued
        task is updated through durable server-side reconciliation. The queued
        cabin status is durably synchronized with recalculated complexity,
        including removal of a work item that forced capital repair. Media owner
        proof delivery is server-side durable reconciliation and is never a browser saga.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceRepairPlanRequest' } } } }
      responses:
        '200': { description: Changed pre-start repair., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Repair' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
    post:
      tags: [Repairs]
      operationId: queueRepairPlan
      description: >-
        Requires USER, rwms.write and warehouse EDIT access. Acquires or reuses
        the root lease, fences the cabin to REPAIR or CAPITAL_REPAIR from the
        calculated complexity, and locally commits stable task publication
        intents. Queueing a rework also moves its source from PENDING to IN_REWORK
        atomically. For an empty DIRECT_REPAIR, the command creates no worker task
        and fences the safely eligible cabin to FREE.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PriorityVersionRequest' } } } }
      responses:
        '200': { description: Queued repair and downstream delivery truth., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RepairCommandResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/maintenance/v1/repairs/{id}/inbound-delivery/retry:
    parameters:
      - { $ref: '#/components/parameters/RepairId' }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Repairs]
      operationId: retryQuarantinedInboundDelivery
      description: >-
        Requires USER, rwms.write and exact warehouse MANAGE access. Recovers only an ordinary
        STABLE queued repair whose exact LOGISTICS/CREATE_DRIVER_TASK inbound intent is
        quarantined and whose logistics-owned DELIVER_TO_REPAIR task is proven absent. The
        command changes only inbound planning, resumes the existing stable intent, and never
        cancels or deletes logistics work.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RetryInboundDeliveryRequest' } } } }
      responses:
        '200': { description: Recovered inbound delivery intent and current repair delivery truth., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RepairCommandResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/maintenance/v1/repairs/{id}/reworks:
    parameters:
      - { $ref: '#/components/parameters/RepairId' }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Repairs]
      operationId: createRework
      description: >-
        Creates a child REWORK in DRAFT and leaves the source unchanged. Only a
        queued or in-progress sibling blocks creation; the child is queued
        later through its own /plan command and reuses the root lease.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateReworkRequest' } } } }
      responses:
        '201': { description: Created child DRAFT repair., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Repair' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
  /api/maintenance/v1/repairs/{id}/accept:
    parameters:
      - { $ref: '#/components/parameters/RepairId' }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Decisions]
      operationId: acceptRepair
      description: >-
        Requires USER, rwms.write and warehouse EDIT access. Validates and stores
        the supplied opaque media references under MAINTENANCE_ACCEPTANCE, fences
        the cabin to FREE and cascades ACCEPTED through the source repair chain.
        Material-linked cabin characteristics are applied only by idempotent
        server-side reconciliation after this successful acceptance.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RepairDecisionRequest' } } } }
      responses:
        '200': { description: Accepted repair and lease reconciliation truth., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RepairCommandResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/maintenance/v1/repairs/{id}/write-off:
    parameters:
      - { $ref: '#/components/parameters/RepairId' }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Decisions]
      operationId: writeOffRepair
      description: >-
        Requires USER, rwms.write, warehouse MANAGE and a warehouse-operational
        global role (WAREHOUSE_MANAGER, WMS_ADMIN or SYSTEM_ADMIN). Creates one
        PENDING_APPROVAL cabin disposition decision for the root cabin/rework
        chain; it does not change asset truth before an administrator approves
        the decision. A non-empty cabin requires an explicit contents plan.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WriteOffRepairRequest' } } } }
      responses:
        '200': { description: Existing idempotent disposition decision., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyDispositionDecision' } } } }
        '201': { description: Newly recorded disposition decision awaiting administrator approval., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyDispositionDecision' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/maintenance/v1/acceptance:
    get:
      tags: [Decisions]
      operationId: listAcceptanceProjection
      description: >-
        Database-paged read-only repair projection; not a command aggregate. A source blocked by
        unresolved rework is excluded in the same query. Inventory-origin rows require every route
        stage to contain task-board completion identity; registration versions and historical
        system completion are not execution proof. Requires USER, rwms.read and warehouse VIEW access.
      parameters:
        - { $ref: '#/components/parameters/WarehouseIdQuery' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/RepairAcceptanceState' }
        - name: repairId
          in: query
          description: Optional exact maintenance-owned repair identity for a bounded acceptance lookup.
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Acceptance projection page., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AcceptanceProjectionPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/maintenance/v1/write-offs:
    get:
      tags: [Decisions]
      operationId: listWriteOffProjection
      description: >-
        One row per disposition decision/root asset, never one row per repair in
        a rework chain. Requires USER, rwms.read and warehouse VIEW access.
      parameters:
        - { $ref: '#/components/parameters/WarehouseIdQuery' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/PropertyDispositionState' }
      responses:
        '200': { description: Write-off decision page with honest effect state., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyDispositionPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/maintenance/v1/losses:
    get:
      tags: [Decisions]
      operationId: listLossProjection
      description: One row per loss decision/root asset. Requires USER, rwms.read and warehouse VIEW access.
      parameters:
        - { $ref: '#/components/parameters/WarehouseIdQuery' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/PropertyDispositionState' }
      responses:
        '200': { description: Loss decision page with honest effect state., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyDispositionPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/maintenance/v1/dispositions:
    post:
      tags: [Decisions]
      operationId: createPropertyDisposition
      description: >-
        Creates a manual cabin or stock-equipment write-off/loss request.
        Requires USER, rwms.write, warehouse MANAGE and global role
        WAREHOUSE_MANAGER, WMS_ADMIN or SYSTEM_ADMIN. reason is mandatory; final
        approval remains administrator-only. Manual equipment always comes from
        STOCK. A cabin with contents requires an explicit plan; a cabin without
        contents rejects a fabricated plan.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePropertyDispositionRequest' } } } }
      responses:
        '200': { description: Existing idempotent decision., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyDispositionDecision' } } } }
        '201': { description: Newly recorded decision awaiting approval., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }, Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyDispositionDecision' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/maintenance/v1/dispositions/{decisionId}:
    parameters:
      - name: decisionId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
    get:
      tags: [Decisions]
      operationId: getPropertyDisposition
      description: Returns decision, root/repair-chain detail and current effect/recovery truth.
      responses:
        '200': { description: Current decision truth., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyDispositionDecision' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/maintenance/v1/dispositions/{decisionId}/approve:
    parameters:
      - name: decisionId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
    post:
      tags: [Decisions]
      operationId: approvePropertyDisposition
      description: >-
        SYSTEM_ADMIN/WMS_ADMIN only. Records the immutable approval and starts
        or resumes the server-owned asset/logistics saga; it never reports an
        EFFECTIVE state before asset truth confirms the terminal effect.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovePropertyDispositionRequest' } } } }
      responses:
        '200': { description: Approved decision and current effect state., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyDispositionDecision' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/maintenance/v1/dispositions/{decisionId}/reject:
    parameters:
      - name: decisionId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
    post:
      tags: [Decisions]
      operationId: rejectPropertyDisposition
      description: SYSTEM_ADMIN/WMS_ADMIN only; rejection is final and requires a reason.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RejectPropertyDispositionRequest' } } } }
      responses:
        '200': { description: Rejected decision., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyDispositionDecision' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/maintenance/v1/dispositions/{decisionId}/recovery:
    parameters:
      - name: decisionId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
    post:
      tags: [Decisions]
      operationId: recoverPropertyDisposition
      description: >-
        SYSTEM_ADMIN/WMS_ADMIN only. Re-reads asset/logistics truth before a
        version-fenced requeue; blind retry is forbidden. reviewer reason is
        retained locally and never published to Kafka.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoverPropertyDispositionRequest' } } } }
      responses:
        '200': { description: Reviewed/requeued decision truth., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyDispositionDecision' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/maintenance/v1/warehouse-operation-marks/{operationId}/recovery:
    parameters:
      - name: operationId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - { $ref: '#/components/parameters/WarehouseIdQuery' }
    post:
      tags: [Decisions]
      operationId: recoverWarehouseOperationMark
      description: >-
        SYSTEM_ADMIN/WMS_ADMIN only. Requeues one quarantined warehouse operated-boundary mark
        after a reviewed, reason-bearing and recovery-version-fenced decision. The review is
        append-only; the endpoint never bypasses the bounded delivery workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseOperationMarkRecoveryRequest' }
      responses:
        '200':
          description: Requeued mark or exact replay of an already accepted review.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseOperationMarkRecoveryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/maintenance/v1/settings/repair-capacity/{warehouseId}:
    parameters:
      - name: warehouseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Settings]
      operationId: getRepairCapacitySettings
      description: >-
        Returns the warehouse repair-capacity setting. An absent setting is represented as
        version 0 with repairPlaceCount 6 and null lifecycle timestamps without persisting a row.
        Requires either USER with rwms.write and warehouse MANAGE access, or USER from the
        dedicated rwms-admin-web client with SYSTEM_ADMIN/WMS_ADMIN and exactly one application
        scope admin.manage after protocol scopes.
      responses:
        '200': { description: Repair-capacity setting or its non-persisted default., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RepairCapacitySettings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Settings]
      operationId: replaceRepairCapacitySettings
      description: >-
        Creates or replaces the warehouse repair-capacity setting with strict optimistic CAS.
        Creation is allowed only with expectedVersion 0. Requires either USER with rwms.write
        and warehouse MANAGE access, or USER from the dedicated rwms-admin-web client with
        SYSTEM_ADMIN/WMS_ADMIN and exactly one application scope admin.manage after protocol
        scopes.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceRepairCapacitySettingsRequest' } } } }
      responses:
        '200': { description: Persisted repair-capacity setting., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RepairCapacitySettings' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/maintenance/v1/settings/estimate-creation-window:
    get:
      tags: [Settings]
      operationId: getEstimateCreationWindowSettings
      description: >-
        Returns the global estimate-creation window, initialized to seven days. The same days
        apply to every warehouse, evaluated in each warehouse\'s timezone. Requires USER with
        rwms.read, or the dedicated rwms-admin-web administrator with admin.manage.
      responses:
        '200': { description: Global estimate-creation window., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EstimateCreationWindowSettings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Settings]
      operationId: replaceEstimateCreationWindowSettings
      description: >-
        Replaces the global setting with strict optimistic CAS. Requires USER with rwms.write
        and SYSTEM_ADMIN/WMS_ADMIN, or the dedicated rwms-admin-web administrator with admin.manage.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceEstimateCreationWindowSettingsRequest' } } } }
      responses:
        '200': { description: Persisted estimate-creation window., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EstimateCreationWindowSettings' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/maintenance/v1/settings/repair-complexity:
    get:
      tags: [Settings]
      operationId: getRepairComplexitySettings
      description: >-
        Returns global integer-minute boundaries, initialized to 60/180/360. Requires USER with
        rwms.read, or the dedicated rwms-admin-web administrator with admin.manage.
      responses:
        '200': { description: Global repair-complexity settings., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RepairComplexitySettings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Settings]
      operationId: replaceRepairComplexitySettings
      description: >-
        Replaces global strictly increasing boundaries with optimistic CAS and durably schedules
        recalculation of active repairs in every warehouse in the same transaction. Requires USER
        with rwms.write and SYSTEM_ADMIN/WMS_ADMIN, or the dedicated rwms-admin-web administrator
        with admin.manage. A readiness fence rejects the complete transaction.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceRepairComplexitySettingsRequest' } } } }
      responses:
        '200': { description: Persisted repair-complexity settings., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RepairComplexitySettings' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/maintenance/v1/repair-places/{warehouseId}:
    parameters:
      - name: warehouseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Repairs]
      operationId: getRepairPlaceProjection
      responses:
        '200': { description: Capacity, current allocation counts and allocation audit rows., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RepairPlaceProjection' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/maintenance/v1/settings/repair-complexity-colors:
    get:
      tags: [Settings]
      operationId: getRepairComplexityColors
      description: >-
        Returns the single global estimate-catalog color palette without a warehouse selector.
        Colors are not copied or overridden per warehouse. Requires USER and rwms.read.
      responses:
        '200': { description: Global repair-complexity color palette., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RepairComplexityColors' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Settings]
      operationId: replaceRepairComplexityColors
      description: >-
        Replaces the one global palette with optimistic CAS. The configured color for a repair
        type is reused everywhere that calculated type is displayed. Requires a
        SYSTEM_ADMIN/WMS_ADMIN USER with rwms.write.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceRepairComplexityColorsRequest' } } } }
      responses:
        '200': { description: Updated global repair-complexity color palette., headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RepairComplexityColors' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Warehouse-scoped public reads require a USER token with rwms.read and warehouse VIEW;
        warehouse-scoped writes require rwms.write and EDIT. Global catalog, repair-color,
        estimate-creation-window and repair-complexity reads require USER with rwms.read and
        accept no warehouse selector; their writes require SYSTEM_ADMIN/WMS_ADMIN with rwms.write.
        Maintenance write-off and repair-capacity settings require warehouse MANAGE.
  parameters:
    WarehouseIdQuery:
      name: warehouseId
      in: query
      required: true
      description: >-
        Warehouse authorization and scope for warehouse-owned maintenance resources.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        UUID key scoped to authenticated subject and command for seven days.
        An identical canonical request replays the original successful status
        and body; reuse with another request hash returns 409.
      schema: { type: string, format: uuid }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 512 }
    CatalogVersionId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    EstimateId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    RepairId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    Size: { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
  responses:
    Unauthorized:
      description: Missing or invalid bearer token; production fails closed.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
    Forbidden:
      description: Missing scope, principal type or warehouse access.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
    BadRequest:
      description: Malformed input.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
    NotFound:
      description: Resource is absent in the authorized warehouse scope.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
    Conflict:
      description: Version, idempotency, state, lease, fence or task-sync conflict.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
    ValidationFailure:
      description: Domain validation failed, including catalog graph or media-reference validation.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
    DependencyUnavailable:
      description: Required dependency was unavailable before any local commit.
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
  headers:
    X-Correlation-Id:
      description: Request correlation identifier emitted by the platform correlation filter.
      schema: { type: string, format: uuid }
    Idempotency-Replayed:
      description: Present with value `true` only when the original successful response is replayed.
      schema: { type: string, const: 'true' }
    ETag:
      description: Current representation validator for a conditional GET.
      schema: { type: string, minLength: 1, maxLength: 512 }
  schemas:
    ProblemDetail:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code, violations, correlation]
      properties:
        type: { type: string, format: uri }
        title: { type: string, minLength: 1, maxLength: 256 }
        status: { type: integer, enum: [400, 401, 403, 404, 409, 422, 503] }
        detail:
          oneOf: [ { type: string, maxLength: 2000 }, { type: 'null' } ]
        instance:
          oneOf: [ { type: string, format: uri-reference }, { type: 'null' } ]
        code:
          enum:
            - MAINTENANCE_UNAUTHORIZED
            - MAINTENANCE_VALIDATION_FAILED
            - ESTIMATE_CREATION_WINDOW_EXPIRED
            - MAINTENANCE_NOT_FOUND
            - MAINTENANCE_VERSION_CONFLICT
            - MAINTENANCE_IDEMPOTENCY_CONFLICT
            - MAINTENANCE_STATE_CONFLICT
            - MAINTENANCE_LEASE_CONFLICT
            - MAINTENANCE_FENCE_CONFLICT
            - MAINTENANCE_MEDIA_NOT_READY
            - MAINTENANCE_TASK_SYNC_CONFLICT
            - MAINTENANCE_DEPENDENCY_UNAVAILABLE
            - BOOKED_UNIT_REPLACEMENT_REQUIRED
            - MAINTENANCE_FORBIDDEN
        violations:
          type: array
          items: { $ref: '#/components/schemas/FieldViolation' }
        correlation: { $ref: '#/components/schemas/CorrelationContext' }
    FieldViolation:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
    CorrelationContext:
      type: object
      additionalProperties: false
      required: [correlationId, causationId]
      properties:
        correlationId: { type: string, format: uuid }
        causationId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
    CatalogLifecycle: { enum: [DRAFT, ACTIVE, SUPERSEDED] }
    EstimateLifecycle: { enum: [DRAFT, COMPLETED] }
    RepairOrigin: { enum: [ESTIMATE, DIRECT_REPAIR, INVENTORY] }
    RepairKind: { enum: [PRIMARY, REWORK] }
    RepairExecutionState: { enum: [DRAFT, QUEUED, IN_PROGRESS, COMPLETED, CANCELLED] }
    RepairAcceptanceState: { enum: [NOT_READY, PENDING, IN_REWORK, ACCEPTED, WRITTEN_OFF] }
    RepairReclassificationState: { enum: [STABLE, RECLASSIFYING_CAPITAL, EXTERNAL_CAPITAL] }
    RepairComplexity: { enum: [LIGHT, MEDIUM, COMPLEX, CAPITAL] }
    RepairStageKind: { enum: [REPAIR_WORK] }
    RepairStageState: { enum: [PLANNED, QUEUED, IN_PROGRESS, DONE, CANCELLED] }
    GenerationState: { enum: [PENDING_GENERATION, GENERATED, NOT_REQUIRED, FAILED] }
    RepairLogisticsPlanningMode: { enum: [AUTO, FIXED_DATE] }
    RepairPlaceAllocationState: { enum: [RESERVED, OCCUPIED, READY_TO_RELEASE, RELEASED] }
    InventoryPlanMode: { enum: [AUTO, MANUAL] }
    InventoryPlanLineKind: { enum: [CATALOG, MANUAL] }
    InventoryPlanLineType: { enum: [WORK, MATERIAL] }
    EstimateLineType: { enum: [WORK, MATERIAL] }
    ReworkLineDisposition: { enum: [ADDED, REPEAT] }
    DeliveryState: { enum: [PENDING, RETRY_PENDING, DELIVERED, QUARANTINED] }
    LeaseReconciliationState: { enum: [NOT_ACQUIRED, ACTIVE, RELEASED, RECONCILIATION_REQUIRED] }
    CatalogNodeType: { enum: [CATEGORY, SUBCATEGORY, WORK, MATERIAL, LOCATION, OPTION] }
    CatalogLinkType: { enum: [DEPENDENCY, FOLLOW_UP] }
    CatalogLinkAnchor: { enum: [TOP, BOTTOM] }
    ExpectedVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    PriorityVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, priority, movementToRepair, logisticsPlanningMode, logisticsScheduledDate]
      allOf:
        - if:
            properties:
              movementToRepair: { const: true }
            required: [movementToRepair]
          then:
            oneOf:
              - properties:
                  logisticsPlanningMode: { const: AUTO }
                  logisticsScheduledDate: { type: 'null' }
              - properties:
                  logisticsPlanningMode: { const: FIXED_DATE }
                  logisticsScheduledDate: { type: string, format: date }
          else:
            properties:
              logisticsPlanningMode: { type: 'null' }
              logisticsScheduledDate: { type: 'null' }
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        priority:
          type: integer
          minimum: 1
          maximum: 5
          description: 1 is the most urgent and 5 is the least urgent.
        movementToRepair:
          description: >-
            Request driver delivery into the repair zone before worker tasks are visible and an
            automatic movement from repair after the repair process is completed.
          type: boolean
        logisticsPlanningMode:
          oneOf: [ { $ref: '#/components/schemas/RepairLogisticsPlanningMode' }, { type: 'null' } ]
        logisticsScheduledDate:
          description: Required only for inbound FIXED_DATE and null without inbound movement.
          oneOf: [ { type: string, format: date }, { type: 'null' } ]
    CompleteEstimateRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, priority, movementToRepair, logisticsPlanningMode, logisticsScheduledDate]
      allOf:
        - if:
            properties:
              movementToRepair: { const: true }
            required: [movementToRepair]
          then:
            oneOf:
              - properties:
                  logisticsPlanningMode: { const: AUTO }
                  logisticsScheduledDate: { type: 'null' }
              - properties:
                  logisticsPlanningMode: { const: FIXED_DATE }
                  logisticsScheduledDate: { type: string, format: date }
          else:
            properties:
              logisticsPlanningMode: { type: 'null' }
              logisticsScheduledDate: { type: 'null' }
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        priority:
          type: integer
          minimum: 1
          maximum: 5
          description: 1 is the most urgent and 5 is the least urgent.
        movementToRepair:
          description: >-
            Request driver delivery into the repair zone before worker tasks are visible and an
            automatic movement from repair after the repair process is completed.
          type: boolean
        logisticsPlanningMode:
          oneOf: [ { $ref: '#/components/schemas/RepairLogisticsPlanningMode' }, { type: 'null' } ]
        logisticsScheduledDate:
          description: Required only for inbound FIXED_DATE and null without inbound movement.
          oneOf: [ { type: string, format: date }, { type: 'null' } ]
        allowUnaccountedFurniture:
          description: >-
            Explicit confirmation allowed only when the cabin has no recorded contents.
            The resulting furniture loss is recorded for a separate approval and never
            decrements a warehouse equipment balance.
          oneOf: [ { type: boolean }, { type: 'null' } ]
          default: false
    RetryInboundDeliveryRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, logisticsPlanningMode, logisticsScheduledDate, reason]
      oneOf:
        - type: object
          properties:
            logisticsPlanningMode: { const: AUTO }
            logisticsScheduledDate: { type: 'null' }
        - type: object
          properties:
            logisticsPlanningMode: { const: FIXED_DATE }
            logisticsScheduledDate: { type: string, format: date }
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        logisticsPlanningMode: { $ref: '#/components/schemas/RepairLogisticsPlanningMode' }
        logisticsScheduledDate:
          description: Null for AUTO; required for FIXED_DATE.
          oneOf: [ { type: string, format: date }, { type: 'null' } ]
        reason: { type: string, minLength: 1, maxLength: 2000 }
    ReplaceRepairCapacitySettingsRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, repairPlaceCount]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        repairPlaceCount: { type: integer, minimum: 1 }
    RepairCapacitySettings:
      type: object
      additionalProperties: false
      required: [warehouseId, version, repairPlaceCount, createdAt, updatedAt]
      properties:
        warehouseId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        repairPlaceCount: { type: integer, minimum: 1 }
        createdAt:
          oneOf: [ { type: string, format: date-time }, { type: 'null' } ]
        updatedAt:
          oneOf: [ { type: string, format: date-time }, { type: 'null' } ]
    ReplaceEstimateCreationWindowSettingsRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, days]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        days: { type: integer, minimum: 1, maximum: 3650 }
    EstimateCreationWindowSettings:
      type: object
      additionalProperties: false
      required: [version, days, createdAt, updatedAt]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        days: { type: integer, minimum: 1, maximum: 3650 }
        createdAt:
          oneOf: [ { type: string, format: date-time }, { type: 'null' } ]
        updatedAt:
          oneOf: [ { type: string, format: date-time }, { type: 'null' } ]
    ReplaceRepairComplexitySettingsRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, lightBoundaryMinutes, mediumBoundaryMinutes, complexBoundaryMinutes]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        lightBoundaryMinutes: { type: integer, minimum: 1 }
        mediumBoundaryMinutes: { type: integer, minimum: 2 }
        complexBoundaryMinutes: { type: integer, minimum: 3 }
    RepairComplexitySettings:
      type: object
      additionalProperties: false
      required: [version, lightBoundaryMinutes, mediumBoundaryMinutes, complexBoundaryMinutes, createdAt, updatedAt]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        lightBoundaryMinutes: { type: integer, minimum: 1 }
        mediumBoundaryMinutes: { type: integer, minimum: 2 }
        complexBoundaryMinutes: { type: integer, minimum: 3 }
        createdAt:
          oneOf: [ { type: string, format: date-time }, { type: 'null' } ]
        updatedAt:
          oneOf: [ { type: string, format: date-time }, { type: 'null' } ]
    RepairPlaceTransitionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    RepairPlaceAllocation:
      type: object
      additionalProperties: false
      required: [id, version, warehouseId, repairId, state, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        repairId: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/RepairPlaceAllocationState' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RepairPlaceProjection:
      type: object
      additionalProperties: false
      required: [warehouseId, repairPlaceCount, reservedCount, occupiedCount, readyToReleaseCount, availableCount, overCapacity, allocations]
      properties:
        warehouseId: { type: string, format: uuid }
        repairPlaceCount: { type: integer, minimum: 1 }
        reservedCount: { type: integer, format: int64, minimum: 0 }
        occupiedCount: { type: integer, format: int64, minimum: 0 }
        readyToReleaseCount: { type: integer, format: int64, minimum: 0 }
        availableCount:
          type: integer
          format: int64
          minimum: 0
          description: Physically free places after active reservations.
        overCapacity:
          type: boolean
          description: >-
            True when occupied places plus the larger of reservations and
            ready removals exceeds capacity; a paired removal and inbound
            reservation share one ordered scheduling slot.
        allocations:
          type: array
          items: { $ref: '#/components/schemas/RepairPlaceAllocation' }
    LogisticsRepairPlaceAllocation:
      type: object
      additionalProperties: false
      required: [id, version, warehouseId, repairId, rentalItemId, state, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        repairId: { type: string, format: uuid }
        rentalItemId: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/RepairPlaceAllocationState' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LogisticsRepairPlaceProjectionAllocation:
      type: object
      additionalProperties: false
      required: [id, version, warehouseId, repairId, rentalItemId, state, repairStageName, repairStageState, priority, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        repairId: { type: string, format: uuid }
        rentalItemId: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/RepairPlaceAllocationState' }
        repairStageName:
          oneOf:
            - { type: string, minLength: 1, maxLength: 255 }
            - { type: 'null' }
          description: Earliest unfinished maintenance stage, when one exists.
        repairStageState:
          oneOf:
            - { $ref: '#/components/schemas/RepairStageState' }
            - { type: 'null' }
          description: State of repairStageName; null when the repair has no unfinished stage.
        priority: { type: integer, minimum: 1, maximum: 5 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LogisticsRepairPlaceProjection:
      type: object
      additionalProperties: false
      required: [warehouseId, repairPlaceCount, automaticRefillDelayMinutes, reservedCount, occupiedCount, readyToReleaseCount, availableCount, overCapacity, allocations]
      properties:
        warehouseId: { type: string, format: uuid }
        repairPlaceCount: { type: integer, minimum: 1 }
        automaticRefillDelayMinutes:
          type: integer
          const: 0
          deprecated: true
          description: >-
            Compatibility marker fixed at zero. Automatic refill is eligible immediately;
            the delay is no longer configurable.
        reservedCount: { type: integer, format: int64, minimum: 0 }
        occupiedCount: { type: integer, format: int64, minimum: 0 }
        readyToReleaseCount: { type: integer, format: int64, minimum: 0 }
        availableCount:
          type: integer
          format: int64
          minimum: 0
          description: Physically free places after active reservations.
        overCapacity:
          type: boolean
          description: >-
            True when occupied places plus the larger of reservations and
            ready removals exceeds capacity; a paired removal and inbound
            reservation share one ordered scheduling slot.
        allocations:
          type: array
          items: { $ref: '#/components/schemas/LogisticsRepairPlaceProjectionAllocation' }
    LogisticsCapitalRepair:
      type: object
      additionalProperties: false
      required: [repairId, rentalItemId, warehouseId, priority, complexity, version]
      properties:
        repairId: { type: string, format: uuid }
        rentalItemId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        priority: { type: integer, minimum: 1, maximum: 5 }
        complexity: { $ref: '#/components/schemas/RepairComplexitySnapshot' }
        version: { type: integer, format: int64, minimum: 0 }
    LogisticsCapitalRepairPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LogisticsCapitalRepair' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
    ReplaceRepairComplexityColorsRequest:
      type: object
