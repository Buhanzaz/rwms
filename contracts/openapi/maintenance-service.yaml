        unitPrice: { $ref: '#/components/schemas/Money' }
        durationMinutes: { type: integer, minimum: 0 }
        routing:
          oneOf: [ { $ref: '#/components/schemas/RoutingSnapshot' }, { type: 'null' } ]
        furnitureEquipment:
          oneOf: [ { $ref: '#/components/schemas/FurnitureEquipmentReference' }, { type: 'null' } ]
        forcesCapitalRepair: { type: boolean }
        characteristic:
          oneOf:
            - { $ref: '#/components/schemas/CabinCharacteristicReference' }
            - { type: 'null' }
    EstimateLineInput:
      type: object
      additionalProperties: false
      required: [id, catalogSnapshot, lineType, description, unit, quantity, unitPrice, mediaReferences]
      properties:
        id: { type: string, format: uuid }
        catalogSnapshot:
          description: >-
            Frozen global-catalog position, or null for an explicitly named custom line. Every
            custom line must be assigned to exactly one REPAIR_WORK stage. A custom WORK must use
            an active REPAIR or HOLDING queue. A custom MATERIAL may either share a stage with a
            related work or form an independently routed material-only stage.
          oneOf: [ { $ref: '#/components/schemas/CatalogNodeSnapshot' }, { type: 'null' } ]
        lineType: { $ref: '#/components/schemas/EstimateLineType' }
        description: { type: string, minLength: 1, maxLength: 1000 }
        unit:
          description: >-
            Canonical unit for catalog lines. Required and nonblank when catalogSnapshot is null;
            nullable only when the active catalog position itself has no unit.
          oneOf: [ { type: string, minLength: 1, maxLength: 32 }, { type: 'null' } ]
        quantity: { $ref: '#/components/schemas/DecimalQuantity' }
        unitPrice: { $ref: '#/components/schemas/Money' }
        normativeMinutes:
          description: >-
            Per-unit execution time in minutes. Catalog lines are canonicalized from the warehouse
            catalog and may omit this input; a custom WORK must provide 1..525600, while a custom
            MATERIAL is canonicalized to zero.
          type: integer
          minimum: 0
          maximum: 525600
        comment:
          description: Optional WORK-line comment. MATERIAL lines are normalized to null.
          oneOf: [ { type: string, maxLength: 2000 }, { type: 'null' } ]
        mediaReferences:
          description: Optional source photographs assigned to this work line; use an empty array when absent.
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/MediaReference' }
    EstimateLine:
      type: object
      additionalProperties: false
      required: [id, catalogSnapshot, lineType, description, unit, quantity, unitPrice, lineTotal, normativeMinutes, mediaReferences, disposition, sourceRepairId, sourceLineId, lineageRootLineId]
      properties:
        id: { type: string, format: uuid }
        catalogSnapshot:
          description: >-
            Frozen global-catalog position. Null identifies a custom line whose selected queue is
            retained by the containing repair-work stage rather than by a second catalog.
          oneOf: [ { $ref: '#/components/schemas/CatalogNodeSnapshot' }, { type: 'null' } ]
        lineType: { $ref: '#/components/schemas/EstimateLineType' }
        description: { type: string, minLength: 1, maxLength: 1000 }
        unit: { type: string, minLength: 1, maxLength: 32 }
        quantity: { $ref: '#/components/schemas/DecimalQuantity' }
        unitPrice: { $ref: '#/components/schemas/Money' }
        lineTotal: { $ref: '#/components/schemas/Money' }
        normativeMinutes:
          description: Canonical per-unit execution time in minutes.
          type: integer
          minimum: 0
          maximum: 525600
        comment:
          description: Optional WORK-line comment. MATERIAL is always null.
          oneOf: [ { type: string, maxLength: 2000 }, { type: 'null' } ]
        mediaReferences:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/MediaReference' }
        disposition:
          oneOf: [ { $ref: '#/components/schemas/ReworkLineDisposition' }, { type: 'null' } ]
        sourceRepairId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        sourceLineId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        lineageRootLineId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
    PlanStageInput:
      description: >-
        One submitted ordinary-repair group. For one repair, one routing.queueId produces exactly
        one executable maintenance stage and one task-board subtask. Before persistence the server
        coalesces every repeated routing.queueId, retaining the first stage identity and routing
        snapshot while appending all included line IDs and nonblank group comments in source order.
        The worker subtask therefore contains every work and material assigned to that physical
        queue, and the same cabin cannot appear twice in one queue. A combined comment longer than
        2000 characters is rejected rather than truncated. Queue identity is the UUID, so equal
        display names with different queue IDs remain separate. The resulting stages are ordered
        as SES, welding, exterior, interior, electrical and plumbing; unknown legacy queues follow
        those phases. An already registered duplicate route may converge through the same combined
        shape only while its complete route and assignments remain unstarted; started history is
        immutable.
      type: object
      additionalProperties: false
      required: [id, kind, order, routing, includedLineIds, primaryLineId, groupComment]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/RepairStageKind' }
        order:
          description: >-
            Source order used while merging repeated groups for one physical queue; persisted
            executable stages are reindexed after canonical phase ordering.
          type: integer
          minimum: 0
        routing:
          description: >-
            Catalog-derived for catalog lines. For custom lines this is the explicit active
            queue selected for the stage; custom works are restricted to REPAIR or HOLDING and
            movement and furniture-movement queues are not valid custom-work destinations.
            A REPAIR_WORK stage may contain work lines, material lines, or both.
          $ref: '#/components/schemas/RoutingSnapshot'
        includedLineIds:
          description: >-
            Stable source-ordered line membership. The combined same-queue stage is rejected when
            it would exceed 2000 references; references are never truncated or silently dropped.
          type: array
          maxItems: 2000
          uniqueItems: true
          items: { type: string, format: uuid }
        primaryLineId:
          description: >-
            Included WORK line used as the stage primary, or null when the REPAIR_WORK stage
            contains materials only.
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        groupComment:
          description: >-
            Queue-group comment. Nonblank comments from compatible repeated same-queue groups are
            preserved in source order and must fit the combined 2000-character limit.
          type: string
          maxLength: 2000
        taskDeadline:
          description: Explicit offset date-time; never inferred from dispatchDate.
          oneOf: [ { type: string, format: date-time }, { type: 'null' } ]
    CreateEstimateRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, rentalItemId, dispatchDate, lines, plan, mediaReferences]
      properties:
        warehouseId: { type: string, format: uuid }
        rentalItemId: { type: string, format: uuid }
        dispatchDate: { type: string, format: date }
        sourceParty:
          description: Service-local business text; never published to Kafka.
          oneOf: [ { type: string, minLength: 1, maxLength: 512 }, { type: 'null' } ]
        lines: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/EstimateLineInput' } }
        plan: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/PlanStageInput' } }
        mediaReferences: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/MediaReference' } }
        coverMediaId:
          description: Required and contained in mediaReferences when aggregate photos are present; otherwise null.
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        forceCapitalRepair:
          description: Explicit manager choice, independent of catalog WORK flags; omitted means false.
          type: boolean
          default: false
    ReplaceEstimateRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, dispatchDate, lines, plan, mediaReferences]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        dispatchDate: { type: string, format: date }
        sourceParty:
          description: Service-local business text; never published to Kafka.
          oneOf: [ { type: string, minLength: 1, maxLength: 512 }, { type: 'null' } ]
        lines: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/EstimateLineInput' } }
        plan: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/PlanStageInput' } }
        mediaReferences: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/MediaReference' } }
        coverMediaId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        forceCapitalRepair:
          description: Explicit manager choice, independent of catalog WORK flags; omitted means false.
          type: boolean
          default: false
    AmendEstimateRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, expectedLinkedRepairVersion, dispatchDate, reason, lines, plan, mediaReferences]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        expectedLinkedRepairVersion:
          oneOf: [ { type: integer, format: int64, minimum: 0 }, { type: 'null' } ]
        dispatchDate: { type: string, format: date }
        reason:
          description: Service-local business text; never published to Kafka.
          type: string
          minLength: 1
          maxLength: 2000
        sourceParty:
          description: Service-local business text; never published to Kafka.
          oneOf: [ { type: string, minLength: 1, maxLength: 512 }, { type: 'null' } ]
        lines: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/EstimateLineInput' } }
        plan: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/PlanStageInput' } }
        mediaReferences: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/MediaReference' } }
        coverMediaId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        forceCapitalRepair:
          description: Explicit manager choice, independent of catalog WORK flags; omitted means false.
          type: boolean
          default: false
    EstimateRevision:
      type: object
      additionalProperties: false
      required: [revision, dispatchDate, lines, plan, total, recordedAt, forceCapitalRepair]
      properties:
        revision: { type: integer, minimum: 1 }
        dispatchDate: { type: string, format: date }
        sourceParty:
          oneOf: [ { type: string, minLength: 1, maxLength: 512 }, { type: 'null' } ]
        lines: { type: array, items: { $ref: '#/components/schemas/EstimateLine' } }
        plan: { type: array, items: { $ref: '#/components/schemas/PlanStageInput' } }
        total: { $ref: '#/components/schemas/Money' }
        reason:
          oneOf: [ { type: string, maxLength: 2000 }, { type: 'null' } ]
        recordedAt: { type: string, format: date-time }
        forceCapitalRepair: { type: boolean }
    Estimate:
      type: object
      additionalProperties: false
      required: [id, warehouseId, rentalItemId, version, lifecycle, currentRevision, revisions, repairId, mediaReferences, coverMediaId, createdAt, completedAt, actor, forceCapitalRepair]
      properties:
        id: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        rentalItemId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        lifecycle: { $ref: '#/components/schemas/EstimateLifecycle' }
        currentRevision: { type: integer, minimum: 1 }
        revisions: { type: array, minItems: 1, items: { $ref: '#/components/schemas/EstimateRevision' } }
        repairId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        mediaReferences: { type: array, items: { $ref: '#/components/schemas/MediaReference' } }
        coverMediaId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        createdAt: { type: string, format: date-time }
        completedAt:
          oneOf: [ { type: string, format: date-time }, { type: 'null' } ]
        actor: { $ref: '#/components/schemas/ActorSnapshot' }
        forceCapitalRepair: { type: boolean }
    EstimatePage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Estimate' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
    DeliverySnapshot:
      type: object
      additionalProperties: false
      required: [state, attempts, updatedAt]
      properties:
        state: { $ref: '#/components/schemas/DeliveryState' }
        attempts: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }
    LeaseSnapshot:
      description: >-
        Opaque asset lease/fence truth. The default TTL is 15 minutes and the
        lease is renewed before the final five minutes. Unknown renewal or
        release truth is RECONCILIATION_REQUIRED and blocks fenced transitions;
        it never permits reacquisition over an unexpired lease or fence bypass.
      type: object
      additionalProperties: false
      required: [leaseId, fencingToken, expiresAt, reconciliationState]
      properties:
        leaseId: { type: string, format: uuid }
        fencingToken: { type: integer, format: int64, minimum: 1 }
        expiresAt: { type: string, format: date-time }
        reconciliationState: { $ref: '#/components/schemas/LeaseReconciliationState' }
    TaskSyncSnapshot:
      description: >-
        A stable externalTaskId exists before publication. GENERATED requires a
        confirmed task-board registration. Transient delivery failure remains
        PENDING_GENERATION with RETRY_PENDING; FAILED is permanent validation
        rejection or operator-owned quarantine only.
      type: object
      additionalProperties: false
      required: [externalTaskId, taskBoardEntryId, taskBoardRegistrationVersion, generationState, delivery]
      properties:
        externalTaskId: { type: string, format: uuid }
        taskBoardEntryId:
          description: >-
            Canonical task-board entry created for this repair stage. Null only
            while registration has not completed or when task generation is not required.
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        taskBoardRegistrationVersion:
          oneOf: [ { type: integer, format: int64, minimum: 0 }, { type: 'null' } ]
        generationState: { $ref: '#/components/schemas/GenerationState' }
        delivery: { $ref: '#/components/schemas/DeliverySnapshot' }
    TaskEvidence:
      type: object
      additionalProperties: false
      required: [evidenceId, entryId, workerId, workerGroupId, mediaId, mediaGeneration, capturedAt, recordedAt, state]
      properties:
        evidenceId: { type: string, format: uuid }
        entryId: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        workerGroupId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        mediaId: { type: string, format: uuid }
        mediaGeneration: { type: integer, format: int64, minimum: 1 }
        capturedAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        state: { type: string, enum: [READY, REVIEW_REQUIRED] }
    RepairStage:
      description: >-
        Persisted repair stage presented at its canonical route position: SES,
        welding, exterior, interior, electrical, plumbing, then unknown legacy
        queues in stable source order.
      type: object
      additionalProperties: false
      required: [id, kind, order, state, routing, workLines, materialLines, primaryLineId, groupComment, evidence, taskSync, completedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/RepairStageKind' }
        order:
          description: Zero-based canonical route position returned by maintenance.
          type: integer
          minimum: 0
        state: { $ref: '#/components/schemas/RepairStageState' }
        routing: { $ref: '#/components/schemas/RoutingSnapshot' }
        workLines: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/EstimateLine' } }
        materialLines: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/EstimateLine' } }
        primaryLineId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        groupComment: { type: string, maxLength: 2000 }
        evidence: { type: array, items: { $ref: '#/components/schemas/TaskEvidence' } }
        taskDeadline:
          oneOf: [ { type: string, format: date-time }, { type: 'null' } ]
        taskSync: { $ref: '#/components/schemas/TaskSyncSnapshot' }
        completedAt:
          oneOf: [ { type: string, format: date-time }, { type: 'null' } ]
    InventoryPlanLineInput:
      type: object
      additionalProperties: false
      description: >-
        CATALOG requires catalogNodeId and rejects the manual evidence fields.
        MANUAL requires null catalogNodeId, a non-null active routingCatalogNodeId
        used only to resolve an immutable routing snapshot, description, WORK/MATERIAL
        type, unit, nonnegative minor-unit price and exact normative minutes. MANUAL
        lines are valid only with MANUAL plan mode and remain non-catalog lines after freezing.
      required: [aggregationKind, catalogNodeId, routingCatalogNodeId, description, type, unit, quantity, unitPriceMinor, normativeMinutes, mediaReferences]
      properties:
        aggregationKind: { $ref: '#/components/schemas/InventoryPlanLineKind' }
        catalogNodeId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        routingCatalogNodeId:
          description: >-
            Null for CATALOG. Required for MANUAL and used only to resolve the frozen routing
            snapshot; it is not retained as catalogVersionId, catalogNodeId or catalogNodeName.
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        description:
          oneOf: [ { type: string, minLength: 1, maxLength: 1000 }, { type: 'null' } ]
        type:
          oneOf: [ { $ref: '#/components/schemas/InventoryPlanLineType' }, { type: 'null' } ]
        unit:
          oneOf: [ { type: string, minLength: 1, maxLength: 32 }, { type: 'null' } ]
        quantity: { $ref: '#/components/schemas/InventoryQuantityInput' }
        unitPriceMinor:
          oneOf: [ { type: integer, format: int64, minimum: 0 }, { type: 'null' } ]
        normativeMinutes:
          oneOf:
            - { type: string, pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]{1,3})?$' }
            - { type: 'null' }
        groupComment:
          description: Optional WORK-line comment; MATERIAL lines must use null.
          oneOf: [ { type: string, minLength: 1, maxLength: 2000 }, { type: 'null' } ]
        mediaReferences:
          description: Optional WORK-line photographs; MATERIAL lines must use an empty array.
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/MediaReference' }
    InventoryPlanStageSelection:
      type: object
      additionalProperties: false
      required: [catalogNodeId, kind, order]
      properties:
        catalogNodeId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/RepairStageKind' }
        order: { type: integer, minimum: 0 }
    FreezeInventoryPlanRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, inventoryId, findingId, sourceRevision, mode, lines, plan, mediaReferences, priority, coverMediaId, movementToRepair, logisticsPlanningMode, logisticsScheduledDate]
      allOf:
        - if:
            properties:
              movementToRepair: { const: true }
            required: [movementToRepair]
          then:
            oneOf:
              - properties:
                  logisticsPlanningMode: { const: AUTO }
                  logisticsScheduledDate: { type: 'null' }
              - properties:
                  logisticsPlanningMode: { const: FIXED_DATE }
                  logisticsScheduledDate: { type: string, format: date }
          else:
            properties:
              logisticsPlanningMode: { type: 'null' }
              logisticsScheduledDate: { type: 'null' }
        - not:
            required: [movementToRepair, forceCapitalRepair]
            properties:
              movementToRepair: { const: true }
              forceCapitalRepair: { const: true }
      properties:
        warehouseId: { type: string, format: uuid }
        inventoryId: { type: string, format: uuid }
        findingId: { type: string, format: uuid }
        sourceRevision: { type: integer, format: int64, minimum: 1 }
        mode: { $ref: '#/components/schemas/InventoryPlanMode' }
        lines:
          type: array
          minItems: 1
          maxItems: 2000
          items: { $ref: '#/components/schemas/InventoryPlanLineInput' }
        plan:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/InventoryPlanStageSelection' }
        mediaReferences:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/MediaReference' }
        priority:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        coverMediaId:
          description: Required and contained in aggregate mediaReferences when photos are present; otherwise null.
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        movementToRepair: { type: boolean }
        logisticsPlanningMode:
          oneOf: [ { $ref: '#/components/schemas/RepairLogisticsPlanningMode' }, { type: 'null' } ]
        logisticsScheduledDate:
          description: Required only for inbound FIXED_DATE and null without inbound movement.
          oneOf: [ { type: string, format: date }, { type: 'null' } ]
        forceCapitalRepair:
          description: Explicit inventory-manager choice; omitted means false.
          type: boolean
          default: false
    InventoryPlanLineSnapshot:
      type: object
      additionalProperties: false
      required: [aggregationKind, catalogVersionId, catalogNodeId, catalogNodeName, type, description, normalizedDescription, unit, quantity, unitPriceMinor, normativeMinutes, routing, groupComment, mediaReferences, forcesCapitalRepair, characteristic]
      properties:
        aggregationKind: { $ref: '#/components/schemas/InventoryPlanLineKind' }
        catalogVersionId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        catalogNodeId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        catalogNodeName:
          oneOf:
            - { type: string, minLength: 1, maxLength: 255 }
            - { type: 'null' }
        type: { $ref: '#/components/schemas/InventoryPlanLineType' }
        description: { type: string, minLength: 1, maxLength: 1000 }
        normalizedDescription:
          oneOf: [ { type: string, minLength: 1, maxLength: 1000 }, { type: 'null' } ]
        unit:
          oneOf: [ { type: string, minLength: 1, maxLength: 32 }, { type: 'null' } ]
        quantity: { $ref: '#/components/schemas/InventoryQuantitySnapshot' }
        unitPriceMinor: { type: integer, format: int64, minimum: 0 }
        normativeMinutes:
          { type: string, pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]{1,3})?$' }
        routing:
          oneOf: [ { $ref: '#/components/schemas/RoutingSnapshot' }, { type: 'null' } ]
        groupComment:
          description: Optional WORK-line comment; always null for MATERIAL.
          oneOf: [ { type: string, minLength: 1, maxLength: 2000 }, { type: 'null' } ]
        mediaReferences:
          description: WORK-line photographs; always empty for MATERIAL.
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/MediaReference' }
        forcesCapitalRepair: { type: boolean }
        characteristic:
          oneOf:
            - { $ref: '#/components/schemas/CabinCharacteristicReference' }
            - { type: 'null' }
    InventoryPlanStageSnapshot:
      description: >-
        Frozen catalog-stage selection. Freeze output contains one snapshot per routing.queueId;
        when an older duplicate-stage snapshot is materialized, all entries with the same queue ID
        allocate into one executable repair stage and the first snapshot identity/catalog metadata
        survive. Equal display names with different queue IDs remain separate.
      type: object
      additionalProperties: false
      required: [id, catalogNodeId, catalogNodeName, kind, order, routing, normativeDurationMinutes]
      properties:
        id: { type: string, format: uuid }
        catalogNodeId: { type: string, format: uuid }
        catalogNodeName: { type: string, minLength: 1, maxLength: 255 }
        kind: { $ref: '#/components/schemas/RepairStageKind' }
        order: { type: integer, minimum: 0 }
        routing: { $ref: '#/components/schemas/RoutingSnapshot' }
        normativeDurationMinutes: { type: integer, minimum: 0, maximum: 525600 }
    FrozenInventoryPlanSnapshot:
      type: object
      additionalProperties: false
      required: [catalogVersionId, mode, lines, stages, movementToRepair, mediaReferences, priority, coverMediaId, logisticsPlanningMode, logisticsScheduledDate]
      allOf:
        - if:
            properties:
              movementToRepair: { const: true }
            required: [movementToRepair]
          then:
            oneOf:
              - properties:
                  logisticsPlanningMode: { const: AUTO }
                  logisticsScheduledDate: { type: 'null' }
              - properties:
                  logisticsPlanningMode: { const: FIXED_DATE }
                  logisticsScheduledDate: { type: string, format: date }
          else:
            properties:
              logisticsPlanningMode: { type: 'null' }
              logisticsScheduledDate: { type: 'null' }
        - not:
            required: [movementToRepair, forceCapitalRepair]
            properties:
              movementToRepair: { const: true }
              forceCapitalRepair: { const: true }
      properties:
        catalogVersionId: { type: string, format: uuid }
        mode: { $ref: '#/components/schemas/InventoryPlanMode' }
        lines:
          type: array
          minItems: 1
          maxItems: 2000
          items: { $ref: '#/components/schemas/InventoryPlanLineSnapshot' }
        stages:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/InventoryPlanStageSnapshot' }
        movementToRepair: { type: boolean }
        mediaReferences:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/MediaReference' }
        priority:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        coverMediaId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        logisticsPlanningMode:
          oneOf: [ { $ref: '#/components/schemas/RepairLogisticsPlanningMode' }, { type: 'null' } ]
        logisticsScheduledDate:
          description: Frozen maintenance-owned planning choice; logistics resolves AUTO later.
          oneOf: [ { type: string, format: date }, { type: 'null' } ]
        forceCapitalRepair:
          description: Frozen explicit manager choice; omitted legacy snapshots mean false.
          type: boolean
          default: false
    FrozenInventoryPlan:
      type: object
      additionalProperties: false
      required: [warehouseId, inventoryId, findingId, sourceRevision, snapshot, fingerprint]
      properties:
        warehouseId: { type: string, format: uuid }
        inventoryId: { type: string, format: uuid }
        findingId: { type: string, format: uuid }
        sourceRevision: { type: integer, format: int64, minimum: 1 }
        snapshot: { $ref: '#/components/schemas/FrozenInventoryPlanSnapshot' }
        fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
    UpsertInventoryRepairRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, sourceRevision, rentalItemId, rentalItemVersion, dispatchDate, planFingerprint, snapshot]
      properties:
        warehouseId: { type: string, format: uuid }
        sourceRevision: { type: integer, format: int64, minimum: 1 }
        rentalItemId: { type: string, format: uuid }
        rentalItemVersion: { type: integer, format: int64, minimum: 0 }
        dispatchDate: { type: string, format: date }
        planFingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        snapshot: { $ref: '#/components/schemas/FrozenInventoryPlanSnapshot' }
    InventoryPublicationTargetKind:
      type: string
      enum: [ESTIMATE, REPAIR]
    InventoryPublicationStrategy:
      type: string
      enum: [CREATE, REPLACE, MERGE]
    InventoryPublicationOutcome:
      type: string
      enum: [CREATED, SUCCESSOR, MATCHED]
    InventoryPublicationSuccessorState:
      type: string
      enum: [WAITING_PREDECESSOR, RELEASED]
    InventoryPublicationTerminalFact:
      type: string
      enum: [TASK_BOARD_COMPLETION, REPAIR_ACCEPTANCE]
    InventoryPublicationDeltaDisposition:
      type: string
      enum: [RETAINED, RETAINED_AFTER_DEDUCTION, REMOVED_AS_ALREADY_PRESENT, RETAINED_AMBIGUOUS]
    InventoryPublicationSnapshot:
      description: >-
        Raw inventory-owned frozen plan. snapshotSchemaVersion=1 may additionally retain the
        historical movementToShipment boolean. A legacy version-1 producer may also have copied
        the same non-empty aggregate mediaReferences array onto every line; after verifying the
        exact raw fingerprint, maintenance interprets only that complete duplication as aggregate
        media and clears the line copies in memory. No other version-1 shape is normalized, and
        current validation still applies. Maintenance stores and hashes the exact raw document;
        version 2 uses the strict current executable schema and omits movementToShipment.
      type: object
      additionalProperties: true
      properties:
        catalogVersionId: { type: string, format: uuid }
        mode: { $ref: '#/components/schemas/InventoryPlanMode' }
        lines: { type: array, items: { $ref: '#/components/schemas/InventoryPlanLineSnapshot' } }
        stages: { type: array, items: { $ref: '#/components/schemas/InventoryPlanStageSnapshot' } }
        movementToRepair: { type: boolean }
        forceCapitalRepair:
          description: Frozen explicit manager choice; omitted legacy snapshots mean false.
          type: boolean
          default: false
        movementToShipment: { type: boolean }
        mediaReferences: { type: array, items: { $ref: '#/components/schemas/MediaReference' } }
        priority: { type: integer, minimum: 1, maximum: 5 }
        coverMediaId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        logisticsPlanningMode:
          oneOf: [ { $ref: '#/components/schemas/RepairLogisticsPlanningMode' }, { type: 'null' } ]
        logisticsScheduledDate:
          oneOf: [ { type: string, format: date }, { type: 'null' } ]
    InventoryPublicationFindingInput:
      type: object
      additionalProperties: false
      required: [findingId, findingRevision, assetId, assetVersion, planFingerprintSha256, priority, movementToRepair, movementScheduledDate, repairScheduledDate, snapshot, media, snapshotSchemaVersion]
      properties:
        findingId: { type: string, format: uuid }
        findingRevision: { type: integer, format: int64, minimum: 1 }
        assetId: { type: string, format: uuid }
        assetVersion: { type: integer, format: int64, minimum: 0 }
        planFingerprintSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        priority: { type: integer, minimum: 1, maximum: 5 }
        movementToRepair: { type: boolean }
        movementScheduledDate:
          oneOf: [ { type: string, format: date }, { type: 'null' } ]
        repairScheduledDate: { type: string, format: date }
        snapshot: { $ref: '#/components/schemas/InventoryPublicationSnapshot' }
        media:
          description: >-
            Deterministic unique union: aggregate media first, then line media in source order.
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/MediaReference' }
        snapshotSchemaVersion: { type: integer, minimum: 1, maximum: 2 }
        forceCapitalRepair:
          description: Must equal the frozen snapshot value; omitted means false.
          type: boolean
          default: false
    InventoryPublicationPreflightRequest:
      type: object
      additionalProperties: false
      required: [inventoryId, warehouseId, finalPlanVersion, finalPlanSha256, findings]
      properties:
        inventoryId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        finalPlanVersion: { type: integer, format: int64, minimum: 1 }
        finalPlanSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        findings:
          description: >-
            Completed findings that can produce maintenance candidates. An empty list is valid
            when the final inventory plan contains no maintenance work.
          type: array
          minItems: 0
          maxItems: 5000
          items: { $ref: '#/components/schemas/InventoryPublicationFindingInput' }
    InventoryPublicationPlanSummary:
      type: object
      additionalProperties: false
      required: [workLineCount, materialLineCount, grandTotalMinor]
      properties:
        workLineCount: { type: integer, minimum: 0 }
        materialLineCount: { type: integer, minimum: 0 }
        grandTotalMinor: { type: integer, format: int64, minimum: 0 }
    InventoryPublicationCandidate:
      type: object
      additionalProperties: false
      required: [targetKind, targetId, estimateId, repairId, version, state, started, active, priority, sourceParty, planFingerprintSha256, planSummary, forceCapitalRepair]
      properties:
        targetKind: { $ref: '#/components/schemas/InventoryPublicationTargetKind' }
        targetId: { type: string, format: uuid }
        estimateId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        repairId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        version: { type: integer, format: int64, minimum: 0 }
        state: { type: string, minLength: 1 }
        started: { type: boolean }
        active: { type: boolean }
        priority:
          oneOf: [ { type: integer, minimum: 1, maximum: 5 }, { type: 'null' } ]
        sourceParty:
          oneOf: [ { type: string, maxLength: 512 }, { type: 'null' } ]
        planFingerprintSha256:
          oneOf: [ { type: string, pattern: '^[0-9a-f]{64}$' }, { type: 'null' } ]
        planSummary: { $ref: '#/components/schemas/InventoryPublicationPlanSummary' }
        forceCapitalRepair: { type: boolean }
    InventoryPublicationPreflightFinding:
      description: >-
        Collision-free projection for one completed-inventory work finding. targetKind is always
        REPAIR and candidates is always empty; existing active maintenance is superseded during
        authoritative apply without a caller-selected merge or replacement.
      type: object
      additionalProperties: false
      required: [findingId, targetKind, candidates]
      properties:
        findingId: { type: string, format: uuid }
        targetKind: { $ref: '#/components/schemas/InventoryPublicationTargetKind' }
        candidates: { type: array, items: { $ref: '#/components/schemas/InventoryPublicationCandidate' } }
    InventoryPublicationPreflightResponse:
      type: object
      additionalProperties: false
      required: [inventoryId, finalPlanVersion, finalPlanSha256, findings]
      properties:
        inventoryId: { type: string, format: uuid }
        finalPlanVersion: { type: integer, format: int64, minimum: 1 }
        finalPlanSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        findings: { type: array, items: { $ref: '#/components/schemas/InventoryPublicationPreflightFinding' } }
    InventoryPublicationApplyRequest:
      description: >-
        Immutable completed-inventory evidence plus the effective asset version returned by the
        authoritative asset outcome command. Maintenance creates a REPAIR for every accepted
        non-terminal source status; LOST and WRITTEN_OFF remain terminal conflicts.
      type: object
      additionalProperties: false
      required: [warehouseId, finalPlanVersion, finalPlanSha256, findingRevision, assetId, assetVersion, authoritativeAssetVersion, inventoryCompletedAt, planFingerprintSha256, priority, movementToRepair, movementScheduledDate, repairScheduledDate, snapshot, media, snapshotSchemaVersion, strategy, selectedTargetKind, selectedTargetId]
      properties:
        warehouseId: { type: string, format: uuid }
        finalPlanVersion: { type: integer, format: int64, minimum: 1 }
        finalPlanSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        findingRevision: { type: integer, format: int64, minimum: 1 }
        assetId: { type: string, format: uuid }
        assetVersion:
          description: Immutable asset version observed by the completed inventory final plan.
          type: integer
          format: int64
          minimum: 0
        authoritativeAssetVersion:
          description: >-
            Effective version returned after asset-service applied the authoritative inventory
            outcome. It must be greater than or equal to assetVersion and is persisted on a new or
            successor repair.
          type: integer
          format: int64
          minimum: 0
        inventoryCompletedAt:
          description: Immutable completion time used to order authoritative inventory sources.
          type: string
          format: date-time
        planFingerprintSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        priority: { type: integer, minimum: 1, maximum: 5 }
        movementToRepair: { type: boolean }
        movementScheduledDate:
          oneOf: [ { type: string, format: date }, { type: 'null' } ]
        repairScheduledDate: { type: string, format: date }
        snapshot: { $ref: '#/components/schemas/InventoryPublicationSnapshot' }
        media: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/MediaReference' } }
        snapshotSchemaVersion: { type: integer, minimum: 1, maximum: 2 }
        strategy: { $ref: '#/components/schemas/InventoryPublicationStrategy' }
        selectedTargetKind:
          oneOf: [ { $ref: '#/components/schemas/InventoryPublicationTargetKind' }, { type: 'null' } ]
        selectedTargetId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        forceCapitalRepair:
          description: Must equal the frozen snapshot value; omitted means false.
          type: boolean
          default: false
    InventoryNoWorkOutcomeRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, assetId, inventoryCompletedAt, finalPlanVersion, finalPlanSha256, findingRevision, authoritativeAssetVersion, desiredStatus]
      properties:
        warehouseId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        inventoryCompletedAt: { type: string, format: date-time }
        finalPlanVersion: { type: integer, format: int64, minimum: 1 }
        finalPlanSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        findingRevision: { type: integer, format: int64, minimum: 1 }
        authoritativeAssetVersion: { type: integer, format: int64, minimum: 0 }
        desiredStatus: { type: string, enum: [FREE] }
    InventoryNoWorkOutcomeResult:
      type: object
      additionalProperties: false
      required: [inventoryId, findingId, assetId, supersededEstimateIds, supersededRepairIds, cancelledExternalTaskIds, cancelledDriverTaskIds, releasedLeaseIds, replay]
      properties:
        inventoryId: { type: string, format: uuid }
        findingId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        supersededEstimateIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        supersededRepairIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        cancelledExternalTaskIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        cancelledDriverTaskIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        releasedLeaseIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        replay: { type: boolean }
    InventoryPublicationSourceReference:
      type: object
      additionalProperties: false
      required: [inventoryId, finalPlanVersion, findingId, findingRevision, finalPlanSha256, planFingerprintSha256, strategy, selectedTargetKind, selectedTargetId, supersededTargetKind, supersededTargetId]
      properties:
        inventoryId: { type: string, format: uuid }
        finalPlanVersion: { type: integer, format: int64, minimum: 1 }
        findingId: { type: string, format: uuid }
        findingRevision: { type: integer, format: int64, minimum: 1 }
        finalPlanSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        planFingerprintSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        strategy: { $ref: '#/components/schemas/InventoryPublicationStrategy' }
        selectedTargetKind:
          oneOf: [ { $ref: '#/components/schemas/InventoryPublicationTargetKind' }, { type: 'null' } ]
        selectedTargetId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        supersededTargetKind:
          oneOf: [ { $ref: '#/components/schemas/InventoryPublicationTargetKind' }, { type: 'null' } ]
        supersededTargetId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
    InventoryPublicationDeltaLine:
      description: >-
        A line decision against the raw frozen snapshot. sourceIndex addresses snapshot.lines;
        retainedQuantity may be zero only when the line was already present in the predecessor.
      type: object
      additionalProperties: false
      required: [sourceIndex, disposition, lineType, catalogNodeId, requestedQuantity, retainedQuantity]
      properties:
        sourceIndex: { type: integer, minimum: 0 }
        disposition: { $ref: '#/components/schemas/InventoryPublicationDeltaDisposition' }
        lineType: { $ref: '#/components/schemas/InventoryPlanLineType' }
        catalogNodeId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        requestedQuantity: { type: string, minLength: 1 }
        retainedQuantity: { type: string, minLength: 1 }
    InventoryPublicationDelta:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        lines:
          type: array
          items: { $ref: '#/components/schemas/InventoryPublicationDeltaLine' }
    InventoryPublicationSuccessorStatus:
      description: >-
        Present only for SUCCESSOR. RELEASED means the existing maintenance QUEUE_REPAIR
        reconciliation was durably enqueued after the listed proven predecessor fact.
      type: object
      additionalProperties: false
      required: [predecessorRepairId, state, terminalFact, terminalFactEventId, terminalFactOccurredAt, releasedAt]
      properties:
        predecessorRepairId: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/InventoryPublicationSuccessorState' }
        terminalFact:
          oneOf: [ { $ref: '#/components/schemas/InventoryPublicationTerminalFact' }, { type: 'null' } ]
        terminalFactEventId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        terminalFactOccurredAt:
          oneOf: [ { type: string, format: date-time }, { type: 'null' } ]
        releasedAt:
          oneOf: [ { type: string, format: date-time }, { type: 'null' } ]
    InventoryPublicationApplyResult:
      type: object
      additionalProperties: false
      required: [source, outcome, targetKind, targetId, estimateId, repairId, successor, delta]
      properties:
        source: { $ref: '#/components/schemas/InventoryPublicationSourceReference' }
        outcome: { $ref: '#/components/schemas/InventoryPublicationOutcome' }
        targetKind:
          oneOf: [ { $ref: '#/components/schemas/InventoryPublicationTargetKind' }, { type: 'null' } ]
        targetId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        estimateId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        repairId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        successor:
          oneOf: [ { $ref: '#/components/schemas/InventoryPublicationSuccessorStatus' }, { type: 'null' } ]
        delta: { $ref: '#/components/schemas/InventoryPublicationDelta' }
    InventoryRepairSnapshotRequest:
      type: object
      additionalProperties: false
      required: [assetIds]
      properties:
        assetIds:
          type: array
          minItems: 1
          maxItems: 5000
          uniqueItems: true
          items: { type: string, format: uuid }
    InventoryRepairFact:
      type: object
      additionalProperties: false
      required: [repairId, rootRepairId, origin, kind, executionState, acceptanceState, planFingerprintSha256, forceCapitalRepair]
      properties:
        repairId: { type: string, format: uuid }
        rootRepairId: { type: string, format: uuid }
        origin: { $ref: '#/components/schemas/RepairOrigin' }
        kind: { $ref: '#/components/schemas/RepairKind' }
        executionState: { $ref: '#/components/schemas/RepairExecutionState' }
        acceptanceState: { $ref: '#/components/schemas/RepairAcceptanceState' }
        planFingerprintSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        forceCapitalRepair: { type: boolean }
    InventoryRepairSnapshot:
      type: object
      additionalProperties: false
      required: [assetId, repairs]
      properties:
        assetId: { type: string, format: uuid }
        repairs:
          type: array
          items: { $ref: '#/components/schemas/InventoryRepairFact' }
    InventoryRepairSnapshots:
      type: object
      additionalProperties: false
      required: [assets]
      properties:
        assets:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/InventoryRepairSnapshot' }
    UpsertLogisticsReturnEstimateSourceRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, rentalItemId, rentalItemVersion, dispatchDate, arrivedAt, mediaReferences]
      properties:
        warehouseId: { type: string, format: uuid }
        rentalItemId: { type: string, format: uuid }
        rentalItemVersion: { type: integer, format: int64, minimum: 0 }
        dispatchDate: { type: string, format: date }
        arrivedAt:
          type: string
          format: date-time
          description: Immutable occurred_at of the logistics.return.inspection-required.v1 event.
        mediaReferences:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { $ref: '#/components/schemas/MediaReference' }
    ReturnEstimateSource:
      type: object
      additionalProperties: false
      required: [returnId, lineId, sourceVersion, warehouseId, rentalItemId, rentalItemVersion, estimateId, snapshotSha256, receivedAt]
      properties:
        returnId: { type: string, format: uuid }
        lineId: { type: string, format: uuid }
        sourceVersion: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        rentalItemId: { type: string, format: uuid }
        rentalItemVersion: { type: integer, format: int64, minimum: 0 }
        estimateId: { type: string, format: uuid }
        snapshotSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        receivedAt: { type: string, format: date-time }
    HistoricalShipmentRepairClosureRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, rentalItemId]
      properties:
        warehouseId: { type: string, format: uuid }
        rentalItemId: { type: string, format: uuid }
    HistoricalShipmentRepairClosureResponse:
      type: object
      additionalProperties: false
      required: [shipmentId, warehouseId, rentalItemId, rentalItemVersion, rentalItemStatus, closedRepairIds, outcome]
      properties:
        shipmentId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        rentalItemId: { type: string, format: uuid }
        rentalItemVersion: { type: integer, format: int64, minimum: 0 }
        rentalItemStatus:
          type: string
          enum: [FREE, RENTED]
          description: FREE when maintenance released the cabin; RENTED when the historical shipment only restores missing logistics provenance for an already rented cabin.
        closedRepairIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        outcome: { type: string, enum: [NOT_REQUIRED, CLOSED, ALREADY_RENTED] }
    RepairPlan:
      type: object
      additionalProperties: false
      required: [repairId, repairVersion, stages]
      properties:
        repairId: { type: string, format: uuid }
        repairVersion: { type: integer, format: int64, minimum: 0 }
        stages: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/RepairStage' } }
    InventorySourceReference:
      type: object
      additionalProperties: false
      required: [inventoryId, findingId, sourceRevision, planFingerprint, sourceFingerprint]
      properties:
        inventoryId: { type: string, format: uuid }
        findingId: { type: string, format: uuid }
        sourceRevision: { type: integer, format: int64, minimum: 1 }
        planFingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        sourceFingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
    RepairComplexitySnapshot:
      type: object
      additionalProperties: false
      required: [type, name, color, plannedMinutes, forcedCapital]
      properties:
        type: { $ref: '#/components/schemas/RepairComplexity' }
        name:
          description: Calculated human-readable Russian label.
          enum:
            - Лёгкий ремонт
            - Средний ремонт
            - Тяжёлый ремонт
            - Капитальный ремонт
        color:
          description: Color from the single global estimate setting.
          type: string
          pattern: '^#[0-9A-F]{6}$'
        plannedMinutes:
          description: Sum of quantity multiplied by normativeMinutes for every current WORK.
          $ref: '#/components/schemas/DecimalQuantity'
        forcedCapital:
          description: >-
            True when the explicit manager choice is enabled or at least one current catalog
            work forces CAPITAL.
          type: boolean
    Repair:
      type: object
      additionalProperties: false
      required: [id, rootRepairId, sourceRepairId, estimateId, warehouseId, rentalItemId, origin, kind, executionState, acceptanceState, reclassificationState, version, dispatchDate, priority, sourceParty, plan, inventorySource, lease, mediaReferences, coverMediaId, complexity, movementToRepair, logisticsPlanningMode, logisticsScheduledDate, createdAt, updatedAt, actor, forceCapitalRepair]
      properties:
        id: { type: string, format: uuid }
        rootRepairId: { type: string, format: uuid }
        sourceRepairId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        estimateId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        warehouseId: { type: string, format: uuid }
        rentalItemId: { type: string, format: uuid }
        origin: { $ref: '#/components/schemas/RepairOrigin' }
        kind: { $ref: '#/components/schemas/RepairKind' }
        executionState: { $ref: '#/components/schemas/RepairExecutionState' }
        acceptanceState: { $ref: '#/components/schemas/RepairAcceptanceState' }
        reclassificationState: { $ref: '#/components/schemas/RepairReclassificationState' }
        version: { type: integer, format: int64, minimum: 0 }
        dispatchDate: { type: string, format: date }
        priority: { type: integer, minimum: 1, maximum: 5 }
        sourceParty:
          oneOf: [ { type: string, minLength: 1, maxLength: 512 }, { type: 'null' } ]
        plan: { $ref: '#/components/schemas/RepairPlan' }
        inventorySource:
          oneOf: [ { $ref: '#/components/schemas/InventorySourceReference' }, { type: 'null' } ]
        lease:
          oneOf: [ { $ref: '#/components/schemas/LeaseSnapshot' }, { type: 'null' } ]
        mediaReferences: { type: array, items: { $ref: '#/components/schemas/MediaReference' } }
        coverMediaId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        complexity:
          description: >-
            Recomputed from the current repair lines and canonical maintenance warehouse thresholds on
            every read; it is not user-entered cached text.
          $ref: '#/components/schemas/RepairComplexitySnapshot'
        movementToRepair:
          description: >-
            Selects the full repair movement cycle: driver delivery into the repair zone before
            worker tasks are shown and automatic movement from repair after completion.
          type: boolean
        forceCapitalRepair:
          description: Explicit manager choice independent of catalog WORK flags.
          type: boolean
        logisticsPlanningMode:
          oneOf: [ { $ref: '#/components/schemas/RepairLogisticsPlanningMode' }, { type: 'null' } ]
        logisticsScheduledDate:
          description: User-selected inbound logistics date; null unless inbound FIXED_DATE is selected.
          oneOf: [ { type: string, format: date }, { type: 'null' } ]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        actor: { $ref: '#/components/schemas/ActorSnapshot' }
    InventoryRepairUpsertResult:
      type: object
      additionalProperties: false
      required: [repair, source, delivery]
      properties:
        repair: { $ref: '#/components/schemas/Repair' }
        source: { $ref: '#/components/schemas/InventorySourceReference' }
        delivery: { $ref: '#/components/schemas/DeliverySnapshot' }
    RepairPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Repair' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
    CreateDirectRepairRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, rentalItemId, dispatchDate, sourceParty, lines, plan, mediaReferences]
      properties:
        warehouseId: { type: string, format: uuid }
        rentalItemId: { type: string, format: uuid }
        dispatchDate: { type: string, format: date }
        sourceParty:
          oneOf: [ { type: string, minLength: 1, maxLength: 512 }, { type: 'null' } ]
        lines: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/EstimateLineInput' } }
        plan: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/PlanStageInput' } }
        mediaReferences: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/MediaReference' } }
        coverMediaId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        forceCapitalRepair:
          description: Explicit manager choice; omitted means false.
          type: boolean
          default: false
    ReplaceRepairPlanRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, lines, stages, mediaReferences]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        lines: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/EstimateLineInput' } }
        stages: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/PlanStageInput' } }
        mediaReferences: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/MediaReference' } }
        coverMediaId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        forceCapitalRepair:
          description: Explicit manager choice; omitted means false.
          type: boolean
          default: false
    AddedReworkLineInput:
      type: object
      additionalProperties: false
      required: [id, disposition, line]
      properties:
        id: { type: string, format: uuid }
        disposition: { type: string, enum: [ADDED] }
        line:
          description: The nested line ID must equal the child ID.
          $ref: '#/components/schemas/EstimateLineInput'
    RepeatReworkLineInput:
      type: object
      additionalProperties: false
      required: [id, disposition, sourceRepairId, sourceLineId, quantity]
      properties:
        id:
          description: New child line identity; it cannot reuse an identity from the repair chain.
          type: string
          format: uuid
        disposition: { type: string, enum: [REPEAT] }
        sourceRepairId: { type: string, format: uuid }
        sourceLineId: { type: string, format: uuid }
        quantity: { $ref: '#/components/schemas/DecimalQuantity' }
        comment:
          oneOf: [ { type: string, maxLength: 2000 }, { type: 'null' } ]
    ReworkLineInput:
      oneOf:
        - { $ref: '#/components/schemas/AddedReworkLineInput' }
        - { $ref: '#/components/schemas/RepeatReworkLineInput' }
      discriminator:
        propertyName: disposition
        mapping:
          ADDED: '#/components/schemas/AddedReworkLineInput'
          REPEAT: '#/components/schemas/RepeatReworkLineInput'
    ReworkCandidateLine:
      type: object
      additionalProperties: false
      required: [sourceRepairId, sourceLineId, lineageRootLineId, line]
      properties:
        sourceRepairId: { type: string, format: uuid }
        sourceLineId: { type: string, format: uuid }
        lineageRootLineId: { type: string, format: uuid }
        line: { $ref: '#/components/schemas/EstimateLine' }
    ReworkCandidates:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/ReworkCandidateLine' }
    CreateReworkRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason, lines, plan, mediaReferences]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        reason:
          description: Service-local business text; never published to Kafka.
          type: string
          minLength: 1
          maxLength: 2000
        lines: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/ReworkLineInput' } }
        plan: { type: array, minItems: 1, maxItems: 1000, items: { $ref: '#/components/schemas/PlanStageInput' } }
        mediaReferences: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/MediaReference' } }
        coverMediaId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
    RepairDecisionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, mediaReferences]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        comment:
          description: Service-local decision text; never published to Kafka.
          oneOf: [ { type: string, maxLength: 2000 }, { type: 'null' } ]
        mediaReferences:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/MediaReference' }
    WriteOffRepairRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason, contentsPlan]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        reason:
          description: Service-local decision text; never published to Kafka.
          type: string
          minLength: 1
          maxLength: 2000
        comment:
          description: Service-local decision text; never published to Kafka.
          oneOf: [ { type: string, maxLength: 2000 }, { type: 'null' } ]
        contentsPlan:
          description: >-
            Required and non-null only when the root cabin currently has contents. Null means the
            cabin is empty and therefore no contents-choice modal was shown.
          oneOf:
            - { $ref: '#/components/schemas/CabinContentsDispositionPlanInput' }
            - { type: 'null' }
    EstimateCommandResult:
      type: object
      additionalProperties: false
      required: [estimate, repair, delivery]
      properties:
        estimate: { $ref: '#/components/schemas/Estimate' }
        repair:
          oneOf: [ { $ref: '#/components/schemas/Repair' }, { type: 'null' } ]
        delivery: { $ref: '#/components/schemas/DeliverySnapshot' }
    RepairCommandResult:
      type: object
      additionalProperties: false
      required: [repair, affectedSourceRepairs, delivery]
      properties:
        repair: { $ref: '#/components/schemas/Repair' }
        affectedSourceRepairs: { type: array, items: { $ref: '#/components/schemas/Repair' } }
        delivery: { $ref: '#/components/schemas/DeliverySnapshot' }
    AcceptanceProjection:
      type: object
      additionalProperties: false
      required: [repairId, rootRepairId, warehouseId, rentalItemId, executionState, acceptanceState, repairVersion, readyAt]
      properties:
        repairId: { type: string, format: uuid }
        rootRepairId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        rentalItemId: { type: string, format: uuid }
        executionState: { $ref: '#/components/schemas/RepairExecutionState' }
        acceptanceState: { $ref: '#/components/schemas/RepairAcceptanceState' }
        repairVersion: { type: integer, format: int64, minimum: 0 }
        readyAt: { type: string, format: date-time }
    AcceptanceProjectionPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AcceptanceProjection' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
    PropertyDispositionAssetKind:
      type: string
      enum: [CABIN, EQUIPMENT]
    PropertyDispositionKind:
      type: string
      enum: [WRITE_OFF, LOSS]
    PropertyDispositionSource:
      type: string
      enum: [MANUAL, REPAIR, ESTIMATE, UNACCOUNTED, INVENTORY]
    PropertyDispositionState:
      type: string
      description: >-
        EFFECTIVE is returned only after asset-service confirms terminal truth. APPROVED,
        MOVEMENT_PENDING and EFFECT_PENDING expose honest server-side saga progress; QUARANTINED
        requires an administrator recovery decision.
      enum: [PENDING_APPROVAL, APPROVED, MOVEMENT_PENDING, EFFECT_PENDING, EFFECTIVE, REJECTED, QUARANTINED]
    PropertyDispositionAssetEffectState:
      type: string
      enum: [NOT_REQUIRED, NOT_STARTED, PENDING, APPLIED, QUARANTINED]
    CabinContentsDispositionMode:
      type: string
      enum: [MOVE_SELECTED_TO_STOCK, DISPOSE_WITH_CABIN]
    CabinContentsDispositionLineInput:
      type: object
      additionalProperties: false
      required: [equipmentId, expectedBalanceVersion, moveToStockQuantity]
      properties:
        equipmentId: { type: string, format: uuid }
        expectedBalanceVersion: { type: integer, format: int64, minimum: 0 }
        moveToStockQuantity:
          description: >-
            Quantity physically assigned to the furniture-movement task. It must be between zero
            and the current cabin quantity. The remainder is disposed with the cabin.
          type: integer
          format: int64
          minimum: 0
    CabinContentsDispositionPlanInput:
      type: object
      additionalProperties: false
      required: [mode, lines]
      properties:
        mode: { $ref: '#/components/schemas/CabinContentsDispositionMode' }
        lines:
          description: >-
            Exactly one line for every non-zero cabin content item. Zero-quantity catalogue extras
            are never accepted. DISPOSE_WITH_CABIN requires every moveToStockQuantity to be zero.
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/CabinContentsDispositionLineInput' }
    CabinContentsDispositionLine:
      type: object
      additionalProperties: false
      required: [equipmentId, equipmentName, equipmentFormat, currentQuantity, moveToStockQuantity, disposeQuantity, expectedBalanceVersion]
      properties:
        equipmentId: { type: string, format: uuid }
        equipmentName: { type: string, minLength: 1, maxLength: 255 }
        equipmentFormat:
          description: Optional immutable display format/unit snapshot; identity remains equipmentId.
          oneOf: [ { type: string, minLength: 1, maxLength: 128 }, { type: 'null' } ]
        currentQuantity: { type: integer, format: int64, minimum: 1 }
        moveToStockQuantity: { type: integer, format: int64, minimum: 0 }
        disposeQuantity: { type: integer, format: int64, minimum: 0 }
        expectedBalanceVersion: { type: integer, format: int64, minimum: 0 }
    CabinContentsDispositionPlan:
      type: object
      additionalProperties: false
      required: [mode, lines]
      properties:
        mode: { $ref: '#/components/schemas/CabinContentsDispositionMode' }
        lines:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/CabinContentsDispositionLine' }
    CreateCabinPropertyDispositionRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, assetKind, assetId, expectedAssetVersion, disposition, reason, contentsPlan]
      properties:
        warehouseId: { type: string, format: uuid }
        assetKind: { type: string, const: CABIN }
        assetId: { type: string, format: uuid }
        expectedAssetVersion: { type: integer, format: int64, minimum: 0 }
        disposition: { $ref: '#/components/schemas/PropertyDispositionKind' }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        evidenceLink:
          oneOf: [ { type: string, format: uri, maxLength: 2000 }, { type: 'null' } ]
        contentsPlan:
          description: Non-null exactly when the live cabin has contents; empty cabins use null.
          oneOf:
            - { $ref: '#/components/schemas/CabinContentsDispositionPlanInput' }
            - { type: 'null' }
    CreateEquipmentPropertyDispositionRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, assetKind, assetId, expectedAssetVersion, expectedSourceBalanceVersion, quantity, disposition, reason]
      properties:
        warehouseId: { type: string, format: uuid }
        assetKind: { type: string, const: EQUIPMENT }
        assetId: { type: string, format: uuid }
        expectedAssetVersion:
          description: Current equipment-catalog version; deactivation or semantic mutation conflicts.
          type: integer
          format: int64
          minimum: 0
        expectedSourceBalanceVersion: { type: integer, format: int64, minimum: 0 }
        quantity: { type: integer, format: int64, minimum: 1 }
        disposition: { $ref: '#/components/schemas/PropertyDispositionKind' }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        evidenceLink:
          oneOf: [ { type: string, format: uri, maxLength: 2000 }, { type: 'null' } ]
    CreatePropertyDispositionRequest:
      oneOf:
        - { $ref: '#/components/schemas/CreateCabinPropertyDispositionRequest' }
        - { $ref: '#/components/schemas/CreateEquipmentPropertyDispositionRequest' }
      discriminator:
        propertyName: assetKind
        mapping:
          CABIN: '#/components/schemas/CreateCabinPropertyDispositionRequest'
          EQUIPMENT: '#/components/schemas/CreateEquipmentPropertyDispositionRequest'
    CreateInventoryLossDispositionRequest:
      type: object
      additionalProperties: false
      required: [inventorySessionId, findingId, warehouseId, equipmentId, equipmentName, expectedAssetVersion, quantity, expectedSourceBalanceVersion, reason]
      properties:
        inventorySessionId: { type: string, format: uuid }
        findingId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        equipmentId: { type: string, format: uuid }
        equipmentName: { type: string, minLength: 1, maxLength: 255 }
        expectedAssetVersion: { type: integer, format: int64, minimum: 0 }
        quantity: { type: integer, format: int64, minimum: 1 }
        expectedSourceBalanceVersion: { type: integer, format: int64, minimum: 0 }
        reason:
          description: Inventory-owned nonblank shortage explanation frozen into the decision.
          type: string
          minLength: 1
          maxLength: 2000
        evidenceLink:
          oneOf: [ { type: string, format: uri, maxLength: 2000 }, { type: 'null' } ]
    CreateInventoryCabinWriteOffRequest:
      type: object
      additionalProperties: false
      required: [inventorySessionId, findingId, warehouseId, cabinId, expectedAssetVersion, reason]
      properties:
        inventorySessionId: { type: string, format: uuid }
        findingId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        cabinId: { type: string, format: uuid }
        expectedAssetVersion: { type: integer, format: int64, minimum: 0 }
        reason:
          description: Inventory-owned explanation that the cabin remained missing after shipment review.
          type: string
          minLength: 1
          maxLength: 2000
        evidenceLink:
          oneOf: [ { type: string, format: uri, maxLength: 2000 }, { type: 'null' } ]
    ApprovePropertyDispositionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        comment:
          oneOf: [ { type: string, minLength: 1, maxLength: 2000 }, { type: 'null' } ]
    RejectPropertyDispositionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    RecoverPropertyDispositionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, expectedRecoveryVersion, reason]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        expectedRecoveryVersion: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    PropertyDispositionRepairChainEntry:
      type: object
      additionalProperties: false
      required: [repairId, repairVersion]
      properties:
        repairId: { type: string, format: uuid }
        repairVersion: { type: integer, format: int64, minimum: 0 }
    PropertyDispositionDecision:
      type: object
      additionalProperties: false
      required:
        - id
        - version
        - recoveryVersion
        - warehouseId
        - assetKind
        - assetId
        - assetDisplayName
        - disposition
        - source
        - state
        - reason
        - quantity
        - expectedAssetVersion
        - expectedSourceBalanceVersion
        - maintenanceCustodyClaimId
        - maintenanceCustodyVersion
        - contentsPlan
        - rootRepairId
        - repairChain
        - inventorySessionId
        - findingId
        - assetEffectState
        - movementTaskId
        - failureCode
        - failureDetail
        - requestedBy
        - requestedAt
        - reviewedBy
        - reviewedAt
        - reviewComment
        - effectiveAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        recoveryVersion: { type: integer, format: int64, minimum: 0 }
        warehouseId: { type: string, format: uuid }
        assetKind: { $ref: '#/components/schemas/PropertyDispositionAssetKind' }
        assetId: { type: string, format: uuid }
        assetDisplayName: { type: string, minLength: 1, maxLength: 255 }
        disposition: { $ref: '#/components/schemas/PropertyDispositionKind' }
        source: { $ref: '#/components/schemas/PropertyDispositionSource' }
        state: { $ref: '#/components/schemas/PropertyDispositionState' }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        evidenceLink:
          oneOf: [ { type: string, format: uri, maxLength: 2000 }, { type: 'null' } ]
        quantity:
          oneOf: [ { type: integer, format: int64, minimum: 1 }, { type: 'null' } ]
        expectedAssetVersion:
          oneOf: [ { type: integer, format: int64, minimum: 0 }, { type: 'null' } ]
        expectedSourceBalanceVersion:
          oneOf: [ { type: integer, format: int64, minimum: 0 }, { type: 'null' } ]
        maintenanceCustodyClaimId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        maintenanceCustodyVersion:
          oneOf: [ { type: integer, format: int64, minimum: 0 }, { type: 'null' } ]
        contentsPlan:
          oneOf:
            - { $ref: '#/components/schemas/CabinContentsDispositionPlan' }
            - { type: 'null' }
        rootRepairId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        repairChain:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/PropertyDispositionRepairChainEntry' }
        inventorySessionId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        findingId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        assetEffectState: { $ref: '#/components/schemas/PropertyDispositionAssetEffectState' }
        movementTaskId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        failureCode:
          oneOf: [ { type: string, minLength: 1, maxLength: 128 }, { type: 'null' } ]
        failureDetail:
          description: Sanitized operator-safe detail; upstream response bodies and secrets are forbidden.
          oneOf: [ { type: string, minLength: 1, maxLength: 2000 }, { type: 'null' } ]
        requestedBy: { $ref: '#/components/schemas/ActorSnapshot' }
        requestedAt: { type: string, format: date-time }
        reviewedBy:
          oneOf: [ { $ref: '#/components/schemas/ActorSnapshot' }, { type: 'null' } ]
        reviewedAt:
          oneOf: [ { type: string, format: date-time }, { type: 'null' } ]
        reviewComment:
          oneOf: [ { type: string, minLength: 1, maxLength: 2000 }, { type: 'null' } ]
        effectiveAt:
          oneOf: [ { type: string, format: date-time }, { type: 'null' } ]
        updatedAt: { type: string, format: date-time }
    PropertyDispositionPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PropertyDispositionDecision' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
    WarehouseOperationMarkRecoveryRequest:
      type: object
      additionalProperties: false
      required: [expectedRecoveryVersion, reason]
      properties:
        expectedRecoveryVersion: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    WarehouseOperationMarkRecoveryResponse:
      type: object
      additionalProperties: false
      required:
        - warehouseId
        - operationId
        - state
        - attemptCount
        - recoveryVersion
        - lastErrorCode
        - recoveredBySubjectId
        - recoveryReason
        - recoveredAt
      properties:
        warehouseId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        state: { type: string, enum: [PENDING, IN_FLIGHT, RETRY_PENDING, CONFIRMED, QUARANTINED] }
        attemptCount: { type: integer, minimum: 0 }
        recoveryVersion: { type: integer, format: int64, minimum: 1 }
        lastErrorCode:
          oneOf: [ { type: string, minLength: 1, maxLength: 128 }, { type: 'null' } ]
        recoveredBySubjectId: { type: string, format: uuid }
        recoveryReason: { type: string, minLength: 1, maxLength: 2000 }
        recoveredAt: { type: string, format: date-time }
